<!--

<html
  lang="en"
  data-composition-id="extrude-pop"
  data-composition-duration="3"
  data-composition-variables='[
    { "id": "letter", "type": "string", "role": "content", "label": "Text", "description": "One short, punchy word.", "default": "WIN" },
    { "id": "body_color", "type": "color", "role": "style", "label": "Body color", "description": "Color of the extruded body.", "default": "#e8192b" },
    { "id": "face_color", "type": "color", "role": "style", "label": "Face color", "description": "Color of the word's front face.", "default": "#ffffff" },
    { "id": "minimax_radius", "type": "number", "role": "motion", "label": "Extrusion radius", "description": "Half the final depth of the extrusion, in px at 1920×1080.", "default": 80, "min": 0, "max": 200, "step": 1, "unit": "px" },
    { "id": "extrude_angle_deg", "type": "number", "role": "style", "label": "Extrusion angle", "description": "Direction the body extends, in degrees.", "default": -58.6, "min": -180, "max": 180, "step": 0.1, "unit": "deg" },
    { "id": "extrude_end_frame", "type": "number", "role": "motion", "label": "Extrude frames", "description": "Frame at which the extrusion is fully grown (30 fps).", "default": 48, "min": 10, "max": 90, "step": 1, "unit": "frames" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Extrude Pop</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .exp-svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="extrude-pop" data-duration="3" data-fps="30">
        <div id="exp-clip" class="exp-stage clip" data-start="0" data-duration="3" data-track-index="0" style="position:absolute;inset:0">
          <svg id="exp-svg" class="exp-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("exp-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "3");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["extrude-pop"] = tl;
            }
            var letter = str(vars.letter, "WIN");
            var bodyColor = str(vars.body_color, "#e8192b");
            var faceColor = str(vars.face_color, "#ffffff");
            var radiusMax = num(vars.minimax_radius, 80, 0, 200);
            var angle = num(vars.extrude_angle_deg, -58.6, -180, 180);
            var endFrame = num(vars.extrude_end_frame, 48, 10, 90);
            var STEPS = 200, FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif", WEIGHT = 700;
            var BASE = [959.2, 752.5], FONT_SIZE = 603, MAX_W = 1660;
            var ctx = document.createElement("canvas").getContext("2d");
            ctx.font = WEIGHT + " " + FONT_SIZE + "px " + FONT;
            var measured = ctx.measureText(letter).width;
            var fitK = measured > 0 ? Math.min(1, MAX_W / measured) : 1;
            var size = FONT_SIZE * fitK, rMax = radiusMax * fitK;

            var NS = "http://www.w3.org/2000/svg";
            var svg = document.getElementById("exp-svg");
            function glyph(fill, id) {
              var t = document.createElementNS(NS, "text");
              t.id = id;
              t.setAttribute("text-anchor", "middle");
              t.setAttribute("font-family", FONT);
              t.setAttribute("font-weight", WEIGHT);
              t.setAttribute("font-size", size);
              t.setAttribute("fill", fill);
              t.textContent = letter;
              svg.appendChild(t);
              return t;
            }
            var body = [];
            for (var i = STEPS; i >= 0; i--) body[i] = glyph(bodyColor, "exp-body-" + i);
            var face = glyph(faceColor, "exp-face");

            var ease = bz("pop", 0.16, 1, 0.3, 1);
            var theta = (angle * Math.PI) / 180;
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var r = rMax * ease(Math.min(1, Math.max(0, f / endFrame)));
              var depth = r * 2;
              var sx = (depth * Math.sin(theta)) / STEPS, sy = (depth * Math.cos(theta)) / STEPS;
              for (var i = 0; i <= STEPS; i++) {
                body[i].setAttribute("x", BASE[0] + sx * i);
                body[i].setAttribute("y", BASE[1] + sy * i);
              }
              face.setAttribute("x", BASE[0] + sx * STEPS);
              face.setAttribute("y", BASE[1] + sy * STEPS);
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
