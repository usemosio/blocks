<!--
  Selection Snap

  A thin word in a loose viewfinder snaps into a design-tool selection while it goes from Thin to Black, pops its handles and counts up a size badge.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="selection-snap"
  data-composition-duration="2.5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "One short word.", "default": "Frame"},
    {"id": "color", "type": "color", "role": "style", "label": "Start color", "description": "Color of the word at the start.", "default": "#fafafa"},
    {"id": "accent", "type": "color", "role": "style", "label": "Accent", "description": "Color the word settles on.", "default": "#ff4d1a"},
    {"id": "selection_color", "type": "color", "role": "style", "label": "Selection", "description": "Color of the brackets, handles and badge.", "default": "#3d5afe"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in reference pixels (1280×720 stage).", "default": 150, "min": 60, "max": 260, "step": 1, "unit": "px"},
    {"id": "from_weight", "type": "number", "role": "style", "label": "From weight", "description": "Starting font weight.", "default": 100, "min": 100, "max": 900, "step": 100},
    {"id": "to_weight", "type": "number", "role": "style", "label": "To weight", "description": "Final font weight.", "default": 900, "min": 100, "max": 900, "step": 100},
    {"id": "badge", "type": "boolean", "role": "style", "label": "Size badge", "description": "Show the W × H readout under the box.", "default": true},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Selection Snap</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .ss-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
        .ss-box { position: relative; display: inline-block; }
        .ss-word { display: block; white-space: pre; line-height: 1; }
        .ss-measure { position: absolute; visibility: hidden; white-space: pre; line-height: 1; left: 0; top: 0; }
        .ss-frame { position: absolute; inset: 0; }
        .ss-arm, .ss-handle { position: absolute; }
        .ss-handle { box-sizing: border-box; background: #fff; }
        .ss-badge { position: absolute; left: 50%; white-space: nowrap; color: #fff; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; transform-origin: 50% 0; }
      </style>

      <div id="root" data-composition-id="selection-snap" data-duration="2.5" data-fps="30">
        <div id="ss-clip" class="ss-stage clip" data-start="0" data-duration="2.5" data-track-index="0">
          <span id="ss-measure" class="ss-measure"></span>
          <div id="ss-box" class="ss-box">
            <span id="ss-word" class="ss-word"></span>
            <div id="ss-frame" class="ss-frame"></div>
            <div id="ss-badge" class="ss-badge"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "2.5");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var text = str(vars.text, "Frame");
            var accent = col(vars.accent, "#ff4d1a"), start = col(vars.color, "#fafafa"), sel = col(vars.selection_color, "#3d5afe");
            var fromW = num(vars.from_weight, 100, 100, 900), toW = num(vars.to_weight, 900, 100, 900);
            var speed = num(vars.speed, 1, 0.25, 4), showBadge = bool(vars.badge, true);
            var unit = Math.min(root.clientWidth / 1280, root.clientHeight / 720);
            var size = num(vars.font_size, 150, 60, 260) * unit;
            var box = document.getElementById("ss-box"), word = document.getElementById("ss-word"), frameEl = document.getElementById("ss-frame");
            var badge = document.getElementById("ss-badge"), measure = document.getElementById("ss-measure");
            word.textContent = text; measure.textContent = text;
            word.style.fontSize = size + "px"; measure.style.fontSize = size + "px";
            measure.style.fontWeight = toW; measure.style.fontVariationSettings = '"wght" ' + toW;
            var stroke = Math.max(1, 1.5 * unit), arm = 0.16 * size, hs = 9 * unit;
            var armEls = [], i;
            var armDefs = [["top", "left", "h"], ["top", "right", "h"], ["bottom", "left", "h"], ["bottom", "right", "h"], ["top", "left", "v"], ["bottom", "left", "v"], ["top", "right", "v"], ["bottom", "right", "v"]];
            armDefs.forEach(function (d) {
              var el = document.createElement("div"); el.className = "ss-arm"; el.style.background = sel;
              el.style[d[0]] = "0"; el.style[d[1]] = "0";
              if (d[2] === "h") el.style.height = stroke + "px"; else el.style.width = stroke + "px";
              frameEl.appendChild(el); armEls.push({ el: el, dir: d[2] });
            });
            var HANDLES = [[0, 0], [1, 0], [1, 1], [0, 1], [0.5, 0], [1, 0.5], [0.5, 1], [0, 0.5]];
            var handleEls = HANDLES.map(function (h) {
              var el = document.createElement("div"); el.className = "ss-handle";
              el.style.left = h[0] * 100 + "%"; el.style.top = h[1] * 100 + "%";
              el.style.width = hs + "px"; el.style.height = hs + "px"; el.style.border = stroke + "px solid " + sel;
              frameEl.appendChild(el); return el;
            });
            badge.style.top = "calc(100% + " + 12 * unit + "px)";
            badge.style.padding = 3 * unit + "px " + 7 * unit + "px";
            badge.style.borderRadius = 4 * unit + "px"; badge.style.background = sel;
            badge.style.fontSize = 14 * unit + "px"; badge.style.fontVariationSettings = '"wght" 600';
            if (!showBadge) badge.style.display = "none";
            function rgb(c) {
              var h = c.replace("#", "");
              if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
              var n = parseInt(h, 16);
              return Number.isFinite(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : [255, 255, 255];
            }
            var c0 = rgb(start), c1 = rgb(accent);
            var easeOutCubic = function (p) { return 1 - Math.pow(1 - p, 3); };
            var snapEase = ease("ss-snap", 0.34, 1.3, 0.64, 1);
            var popEase = function (p) { var q = 1 - p; return 1 - q * q * (2.7 * q - 1.7); };
            function pop(t, s, d) { return Math.max(0, ip(t, s, s + d, 0, 1, popEase)); }
            tick(function (tt) {
              var t = tt * 30 * speed;
              var intro = ip(t, 0, 8, 0, 1, easeOutCubic), bScale = ip(t, 0, 8, 1.06, 1, easeOutCubic);
              var snap = ip(t, 14, 28, 0, 1, snapEase), wt = ip(t, 14, 30, 0, 1, cubInOut);
              var tint = ip(t, 18, 30, 0, 1, cubInOut), edges = ip(t, 16, 26, 0, 1, cubInOut);
              var px = 1.1 + (0.12 - 1.1) * snap, py = 0.9 + (0 - 0.9) * snap;
              box.style.padding = py * size + "px " + px * size + "px";
              var w = fromW + (toW - fromW) * wt;
              word.style.fontWeight = Math.round(w / 100) * 100;
              word.style.fontVariationSettings = '"wght" ' + w.toFixed(2);
              word.style.color = "rgb(" + [0, 1, 2].map(function (k) { return Math.round(c0[k] + (c1[k] - c0[k]) * tint); }).join(",") + ")";
              word.style.opacity = intro;
              frameEl.style.opacity = intro; frameEl.style.transform = "scale(" + bScale + ")";
              var along = "calc(" + arm + "px + (50% - " + arm + "px) * " + edges + ")";
              armEls.forEach(function (a) { if (a.dir === "h") a.el.style.width = along; else a.el.style.height = along; });
              handleEls.forEach(function (el, k) { el.style.transform = "translate(-50%, -50%) scale(" + pop(t, 24 + k, 5) + ")"; });
              if (showBadge) {
                var tw = measure.getBoundingClientRect().width / unit, fs = size / unit;
                var bw = Math.round(tw + 2 * 0.12 * fs), bh = Math.round(fs);
                var pb = pop(t, 24, 8), count = ip(t, 24, 38, 0, 1, easeOutCubic);
                badge.textContent = Math.round(bw * count) + " × " + Math.round(bh * count);
                badge.style.opacity = Math.min(1, pb);
                badge.style.transform = "translate(-50%, " + (1 - pb) * 8 * unit + "px) scale(" + (0.6 + 0.4 * pb) + ")";
              }
            });
            var total = parseFloat(root.dataset.duration || "2.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["selection-snap"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
