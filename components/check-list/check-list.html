<html
  lang="en"
  data-composition-id="check-list"
  data-composition-duration="4.1"
  data-composition-variables='[
    {"id": "items", "type": "string", "role": "content", "label": "Items", "description": "JSON array of list items: a string (ticked) or an object with text and checked. One line per label.", "default": "[\"Render on your own machine\",\"No watermark, ever\",\"Every component MIT\",{\"text\":\"Ships as source\",\"checked\":false}]"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Label size in px on a 1280 by 720 layout; the whole list scales to fit the frame.", "default": 40, "min": 24, "max": 120, "step": 2, "unit": "px"},
    {"id": "list_width", "type": "number", "role": "style", "label": "List width", "description": "Row width in px on the 1280 by 720 layout.", "default": 820, "min": 300, "max": 1600, "step": 10, "unit": "px"},
    {"id": "item_gap", "type": "number", "role": "motion", "label": "Item gap", "description": "Frames between items starting to write.", "default": 18, "min": 6, "max": 48, "step": 3},
    {"id": "close_gap", "type": "number", "role": "motion", "label": "Close gap", "description": "Frames between ticks when the done items are crossed off.", "default": 9, "min": 3, "max": 24, "step": 3},
    {"id": "per_step", "type": "number", "role": "motion", "label": "Letters per step", "description": "Letters written per stepped frame.", "default": 1.6, "min": 0.5, "max": 6, "step": 0.1},
    {"id": "step", "type": "number", "role": "motion", "label": "Frame step", "description": "Stop-motion step: motion updates every this many frames.", "default": 3, "min": 1, "max": 6, "step": 1},
    {"id": "stroke_width", "type": "number", "role": "style", "label": "Stroke width", "description": "Pen stroke width.", "default": 3, "min": 1, "max": 8, "step": 0.5},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the handwriting.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Text", "description": "Handwriting color.", "default": "#26242c"},
    {"id": "box_color", "type": "color", "role": "style", "label": "Box", "description": "Checkbox outline color.", "default": "#26242c"},
    {"id": "tick_color", "type": "color", "role": "style", "label": "Tick", "description": "Tick and strike-through color.", "default": "#6f7f35"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Paper color.", "default": "#f1eee7"},
    {"id": "seed", "type": "string", "role": "motion", "label": "Seed", "description": "Seed for the hand-drawn wobble.", "default": "checklist"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Check List</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--bg); }
        .cl-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .cl-list { display: flex; flex-direction: column; flex-shrink: 0; transform-origin: 50% 50%; }
        .cl-row { display: flex; align-items: center; }
        .cl-box { display: block; overflow: visible; flex-shrink: 0; }
        .cl-label { position: relative; flex-shrink: 0; }
        .cl-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-start; font-family: Caveat, cursive; line-height: 1.15; color: var(--ink); }
        .cl-text > span { display: inline-block; white-space: pre; }
        .cl-char { display: inline-block; white-space: pre; opacity: 0; }
        .cl-strike { position: absolute; inset: 0; display: block; overflow: visible; }
      </style>

      <div id="root" data-composition-id="check-list" data-duration="4.1" data-fps="30">

          <div class="cl-list" id="cl-list"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {

// Seeded random: same string in, same number out.
function rnd(seed) {

}
function rgb(h) {

function mixc(a, b, t) {

function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {

  for (var k in attrs) e.setAttribute(k, attrs[k]);

  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }

var list = document.getElementById("cl-list");
var DEFAULT_ITEMS = [{ text: "Render on your own machine", checked: true }, { text: "No watermark, ever", checked: true }, { text: "Every component MIT", checked: true }, { text: "Ships as source", checked: false }];
var items = DEFAULT_ITEMS;
try {
  var parsed = typeof vars.items === "string" ? JSON.parse(vars.items) : Array.isArray(vars.items) ? vars.items : null;
  if (Array.isArray(parsed) && parsed.length) items = parsed.map(function (it) { return typeof it === "string" ? { text: it, checked: true } : { text: String(it.text), checked: it.checked !== false }; });
} catch (e) {}
var fontSize = num(vars.font_size, 40, 24, 120), listWidth = num(vars.list_width, 820, 300, 1600), step = Math.round(num(vars.step, 3, 1, 6));
var itemGap = num(vars.item_gap, 18, 6, 48), closeGap = num(vars.close_gap, 9, 3, 24), strokeW = num(vars.stroke_width, 3, 1, 8), perStep = num(vars.per_step, 1.6, 0.5, 6);
var weight = ["400", "500", "600", "700"].indexOf(String(vars.font_weight)) >= 0 ? String(vars.font_weight) : "600";
var seed = str(vars.seed, "checklist");
var ink = col(vars.color, "#26242c"), boxC = col(vars.box_color, "#26242c"), tickC = col(vars.tick_color, "#6f7f35"), bg = col(vars.background_color, "#f1eee7");
var LIST_FROM = 0;
root.style.setProperty("--bg", bg); root.style.setProperty("--ink", ink);
var W = root.clientWidth, H = root.clientHeight;
// The list is laid out for a 1280 by 720 frame and scaled to fit the real one.
var scale = Math.min(W / 1280, H / 720);
function hash01(sd) { var h = 2166136261; for (var i = 0; i < sd.length; i++) { h ^= sd.charCodeAt(i); h = Math.imul(h, 16777619); } h = Math.imul(h ^ (h >>> 13), 2246822519); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function qf(f) { return Math.floor(f / step) * step; }

list.style.width = boxSize + boxGap + labelWidth + "px"; list.style.gap = fontSize * 0.55 + "px"; list.style.transform = "scale(" + scale + ")";

var enterEnd = 0;
items.forEach(function (it, i) { enterEnd = Math.max(enterEnd, i * itemGap + step * 2 + hwDuration(it.text)); });
var closeIdx = 0, end = 0;
var rows = items.map(function (it, i) {
  var b = { boxFrom: i * itemGap }; b.boxTo = b.boxFrom + step * 2; b.labelAt = b.boxTo; b.labelEnd = b.boxTo + hwDuration(it.text);

  var chars = Array.from(it.text);

    var c = document.createElement("span"); c.className = "cl-char"; c.textContent = ch; sp.appendChild(c);
    return { el: c, rot: hashRange("hw:" + it.text + ":" + k + ":r", -3.2, 3.2), dy: hashRange("hw:" + it.text + ":" + k + ":y", -1.8, 1.8) };
  });
  label.appendChild(tx);
  if (it.checked) {
    var ss = svgEl("svg", { width: labelWidth, height: rowHeight, viewBox: "0 0 " + labelWidth + " " + rowHeight }, label); ss.setAttribute("class", "cl-strike");

  rows.forEach(function (b) {

      </div>
    </template>
