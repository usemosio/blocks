<html

  data-composition-id="vertical-cut-reveal"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Lines of text, separated by a line break.", "default": "HI, FRIEND!\nIT IS NICE TO\nMEET YOU."},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Long lines shrink to fit the frame.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#2447e6"},
    {"id": "align", "type": "enum", "role": "style", "label": "Align", "description": "Alignment of the lines.", "default": "left", "options": [{"value": "left", "label": "Left"}, {"value": "center", "label": "Center"}]},
    {"id": "tracking", "type": "number", "role": "style", "label": "Tracking", "description": "Letter spacing in em.", "default": 0.04, "min": -0.1, "max": 0.4, "step": 0.01, "unit": "em"},
    {"id": "split_by", "type": "enum", "role": "motion", "label": "Split by", "description": "What slides as one piece.", "default": "characters", "options": [{"value": "characters", "label": "Characters"}, {"value": "words", "label": "Words"}, {"value": "lines", "label": "Lines"}]},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring pieces.", "default": 0.025, "min": 0, "max": 0.6, "step": 0.005, "unit": "s"},
    {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of pieces starts.", "default": "first", "options": [{"value": "first", "label": "First"}, {"value": "last", "label": "Last"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]},
    {"id": "reverse", "type": "boolean", "role": "motion", "label": "Reverse", "description": "Pieces slide in from above instead of from below.", "default": false},
    {"id": "line_delay", "type": "number", "role": "motion", "label": "Line delay", "description": "Seconds between one line starting and the next (letters and words). Lines mode uses the stagger instead.", "default": 0.5, "min": 0, "max": 2, "step": 0.05, "unit": "s"},
    {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first piece moves.", "default": 0.2, "min": 0, "max": 3, "step": 0.05, "unit": "s"},
    {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness.", "default": 200, "min": 50, "max": 600, "step": 10},
    {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping.", "default": 21, "min": 5, "max": 60, "step": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Vertical Cut Reveal</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #2447e6; font-family: Geist, system-ui, sans-serif; }
        .vc-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .vc-block { display: flex; flex-direction: column; width: 88cqw; line-height: 1.15; }
        .vc-row { display: flex; flex-wrap: wrap; white-space: pre; }
        .vc-word { display: inline-flex; overflow: hidden; padding: 0.04em 0 0.12em; margin: -0.04em 0 -0.12em; }
        .vc-piece { display: inline-block; white-space: pre; }
      </style>

      <div id="root" data-composition-id="vertical-cut-reveal" data-duration="4" data-fps="30">
        <div id="vc-clip" class="vc-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="vc-block" class="vc-block" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Lines of text, separated by a line break.", "default": "HI, FRIEND!\nIT IS NICE TO\nMEET YOU."}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Long lines shrink to fit the frame.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"}, {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}, {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#2447e6"}, {"id": "align", "type": "enum", "role": "style", "label": "Align", "description": "Alignment of the lines.", "default": "left", "options": [{"value": "left", "label": "Left"}, {"value": "center", "label": "Center"}]}, {"id": "tracking", "type": "number", "role": "style", "label": "Tracking", "description": "Letter spacing in em.", "default": 0.04, "min": -0.1, "max": 0.4, "step": 0.01, "unit": "em"}, {"id": "split_by", "type": "enum", "role": "motion", "label": "Split by", "description": "What slides as one piece.", "default": "characters", "options": [{"value": "characters", "label": "Characters"}, {"value": "words", "label": "Words"}, {"value": "lines", "label": "Lines"}]}, {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring pieces.", "default": 0.025, "min": 0, "max": 0.6, "step": 0.005, "unit": "s"}, {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of pieces starts.", "default": "first", "options": [{"value": "first", "label": "First"}, {"value": "last", "label": "Last"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]}, {"id": "reverse", "type": "boolean", "role": "motion", "label": "Reverse", "description": "Pieces slide in from above instead of from below.", "default": false}, {"id": "line_delay", "type": "number", "role": "motion", "label": "Line delay", "description": "Seconds between one line starting and the next (letters and words). Lines mode uses the stagger instead.", "default": 0.5, "min": 0, "max": 2, "step": 0.05, "unit": "s"}, {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first piece moves.", "default": 0.2, "min": 0, "max": 3, "step": 0.05, "unit": "s"}, {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness.", "default": 200, "min": 50, "max": 600, "step": 10}, {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping.", "default": 21, "min": 5, "max": 60, "step": 1}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "4");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var block = document.getElementById("vc-block");
            var text = V("text") || "HI, FRIEND!";
            var lines = text.split("\n");
            block.setAttribute("aria-label", text);
            var longest = 1; lines.forEach(function (l) { longest = Math.max(longest, fitText(l).length); });
            var tracking = V("tracking");
            block.style.fontSize = "min(" + V("font_size") + "px, calc(88cqw / " + (longest * (0.62 + tracking)).toFixed(2) + "))";
            block.style.fontWeight = V("font_weight"); block.style.color = V("color"); block.style.letterSpacing = tracking + "em";
            var left = V("align") === "left"; block.style.alignItems = left ? "flex-start" : "center";
            var splitBy = V("split_by"), reverse = V("reverse");
            var rows = lines.map(function (l, li) {
              var row = document.createElement("div"); row.className = "vc-row"; row.id = "vc-row-" + li; row.setAttribute("aria-hidden", "true");
              var pieces = [];
              if (splitBy === "lines") {
                var w = document.createElement("span"); w.className = "vc-word"; var c = document.createElement("span"); c.className = "vc-piece"; c.textContent = l || " ";
                w.appendChild(c); row.appendChild(w); pieces.push(c);
              } else {
                var words = l.split(" ");
                words.forEach(function (word, wi) {
                  var w = document.createElement("span"); w.className = "vc-word";
                  (splitBy === "characters" ? fitText(word) : [word]).forEach(function (ch) {
                    var c = document.createElement("span"); c.className = "vc-piece"; c.textContent = ch; w.appendChild(c); pieces.push(c);
                  });
                  row.appendChild(w);
                  if (wi < words.length - 1) { var s = document.createElement("span"); s.className = "vc-piece"; s.textContent = " "; row.appendChild(s); }
                });
              }

              return pieces;
            });
            var step = V("stagger"), start = V("start"), lineDelay = V("line_delay"), from = V("stagger_from");
            var sp = spring({ stiffness: V("stiffness"), damping: V("damping") });

                var base = start + (splitBy === "lines" ? 0 : li * lineDelay);
                for (var i = 0; i < rows[li].length; i++) {
                  var p = sp.at(t - base - delays[li][i]);
                  rows[li][i].style.transform = "translateY(" + (sign * 100 * (1 - p)).toFixed(3) + "%)";
                }
              }
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["vertical-cut-reveal"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
