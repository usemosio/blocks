<!doctype html>
<!--
  Variant Picker

  A product card with colour swatches and sizes: a cursor taps one colour and one size, the product shape changes tint, a ring moves to the chosen swatch and the chosen size fills. Product, price, colours, sizes and the two choices are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="variant-picker"
  data-composition-duration="6"
  data-composition-variables='[
  {
    "id": "product",
    "type": "string",
    "role": "content",
    "label": "Product name",
    "description": "Product name on the card.",
    "default": "Kaos Polos"
  },
  {
    "id": "price",
    "type": "string",
    "role": "content",
    "label": "Price",
    "description": "Price on the card.",
    "default": "Rp89.000"
  },
  {
    "id": "colors",
    "type": "string",
    "role": "content",
    "label": "Colours",
    "description": "Colours separated by semicolons, each as name|#hex, two to five.",
    "default": "Hitam|#171717; Krem|#e5dcc8; Sage|#8da08b"
  },
  {
    "id": "color_pick",
    "type": "number",
    "role": "content",
    "label": "Colour tapped",
    "description": "Which colour the cursor taps (1 is the first).",
    "default": 3,
    "min": 1,
    "max": 5,
    "step": 1
  },
  {
    "id": "sizes",
    "type": "string",
    "role": "content",
    "label": "Sizes",
    "description": "Sizes separated by semicolons, two to five.",
    "default": "S; M; L; XL"
  },
  {
    "id": "size_pick",
    "type": "number",
    "role": "content",
    "label": "Size tapped",
    "description": "Which size the cursor taps (1 is the first).",
    "default": 3,
    "min": 1,
    "max": 5,
    "step": 1
  },
  {
    "id": "color_label",
    "type": "string",
    "role": "content",
    "label": "Colour label",
    "description": "Label above the swatches.",
    "default": "Warna"
  },
  {
    "id": "size_label",
    "type": "string",
    "role": "content",
    "label": "Size label",
    "description": "Label above the sizes.",
    "default": "Ukuran"
  },
  {
    "id": "panel_color",
    "type": "color",
    "role": "style",
    "label": "Panel colour",
    "description": "Background behind the product shape.",
    "default": "#f4f4f5"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The selected swatch ring and size: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Variant Picker</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--vp-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--vp-bg);
        }
        #root * { box-sizing: border-box; }
        .vp-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .vp-wrap { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
        .vp-card { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; border-radius: calc(var(--u) * 48); background: #fff; border: calc(var(--u) * 2) solid rgba(10,10,10,0.1); box-shadow: 0 calc(var(--u) * 16) calc(var(--u) * 40) rgba(0,0,0,0.09); overflow: hidden; }
        .vp-panel { flex: none; background: var(--vp-panel); display: flex; align-items: center; justify-content: center; }
        .vp-panel svg { width: 78%; height: 78%; max-width: calc(var(--u) * 520); }
        .vp-det { flex: 1; padding: calc(var(--u) * 48); display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 34); min-width: 0; }
        .vp-nr { display: flex; align-items: baseline; justify-content: space-between; gap: calc(var(--u) * 20); }
        .vp-name { font-size: calc(var(--u) * 62); font-weight: 700; letter-spacing: -0.04em; }
        .vp-price { font-size: calc(var(--u) * 52); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
        .vp-lr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: calc(var(--u) * 18); font-size: calc(var(--u) * 34); font-weight: 600; }
        .vp-lr .vp-v { position: relative; display: inline-block; color: var(--vp-muted); font-weight: 500; }
        .vp-v span { display: inline-block; white-space: nowrap; }
        .vp-v .vp-b { position: absolute; right: 0; top: 0; opacity: 0; color: var(--vp-text); font-weight: 600; }
        .vp-sw { position: relative; display: flex; gap: calc(var(--u) * 26); }
        .vp-sw i { display: block; width: calc(var(--u) * 80); height: calc(var(--u) * 80); border-radius: 50%; border: calc(var(--u) * 2) solid rgba(10,10,10,0.16); }
        .vp-ring { position: absolute; left: 0; top: 0; width: calc(var(--u) * 100); height: calc(var(--u) * 100); margin: calc(var(--u) * -10) 0 0 calc(var(--u) * -10); border-radius: 50%; border: calc(var(--u) * 5) solid var(--vp-main); }
        .vp-sz { display: flex; gap: calc(var(--u) * 18); }
        .vp-chip { position: relative; min-width: calc(var(--u) * 118); height: calc(var(--u) * 88); padding: 0 calc(var(--u) * 24); display: flex; align-items: center; justify-content: center; border-radius: calc(var(--u) * 24); border: calc(var(--u) * 3) solid rgba(10,10,10,0.16); font-size: calc(var(--u) * 38); font-weight: 600; background: #fff; color: var(--vp-text); }
        .vp-chip b { position: absolute; inset: calc(var(--u) * -3); border-radius: calc(var(--u) * 24); background: var(--vp-main); opacity: 0; }
        .vp-chip span { position: relative; }
        .vp-cur { position: absolute; left: 0; top: 0; width: calc(var(--u) * 64); height: calc(var(--u) * 64); z-index: 9; transform-origin: 0 0; filter: drop-shadow(0 calc(var(--u) * 4) calc(var(--u) * 6) rgba(0,0,0,0.25)); }
        .vp-tap { position: absolute; width: calc(var(--u) * 90); height: calc(var(--u) * 90); margin: calc(var(--u) * -45) 0 0 calc(var(--u) * -45); border-radius: 50%; border: calc(var(--u) * 4) solid var(--vp-text); opacity: 0; z-index: 8; }

      </style>

      <div id="root" data-composition-id="variant-picker" data-duration="6" data-fps="30">
        <div id="vp-clip" class="vp-stage clip" data-start="0" data-duration="6" data-track-index="0">

          <div class="vp-wrap" id="vp-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("vp", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", panel: "#f4f4f5" });


            var u = U, wrap = document.getElementById("vp-wrap");
            root.style.setProperty("--vp-panel", colr(vars.panel_color, "#f4f4f5"));
            var colors = list(vars.colors, "Hitam|#171717; Krem|#e5dcc8; Sage|#8da08b").slice(0, 5).map(function (s) { var a = s.split("|"); return { name: (a[0] || "").trim(), hex: colr(a[1], "#8da08b") }; });
            if (colors.length < 2) colors = [{ name: "Hitam", hex: "#171717" }, { name: "Sage", hex: "#8da08b" }];
            var sizes = list(vars.sizes, "S; M; L; XL").slice(0, 5); if (sizes.length < 2) sizes = ["M", "L"];
            var cp = Math.min(colors.length, Math.round(num(vars.color_pick, 3, 1, 5))) - 1, sp = Math.min(sizes.length, Math.round(num(vars.size_pick, 3, 1, 5))) - 1;
            var gw = PORTRAIT ? 880 * u : 1500 * u, gh = PORTRAIT ? 1060 * u : 700 * u;
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            var card = el("div", "vp-card", wrap);
            var panel = el("div", "vp-panel", card);
            if (PORTRAIT) { card.style.flexDirection = "column"; panel.style.height = 520 * u + "px"; panel.style.width = "100%"; } else { panel.style.width = 640 * u + "px"; panel.style.height = "100%"; }
            var tsv = svg("svg", { viewBox: "0 0 200 200" }, panel);
            var shape = svg("path", { d: "M70 22 L38 36 L8 74 L38 96 L52 82 L52 178 L148 178 L148 82 L162 96 L192 74 L162 36 L130 22 C124 38 112 46 100 46 C88 46 76 38 70 22 Z" }, tsv);
            svg("path", { d: "M70 22 C76 38 88 46 100 46 C112 46 124 38 130 22 C124 50 76 50 70 22 Z", fill: "rgba(0,0,0,0.16)" }, tsv);
            shape.style.fill = colors[0].hex;
            var det = el("div", "vp-det", card);
            var nr = el("div", "vp-nr", det); el("span", "vp-name", nr).textContent = str(vars.product, "Kaos Polos"); el("span", "vp-price", nr).textContent = str(vars.price, "Rp89.000");
            function labelRow(label, a, b) {
              var blk = el("div", "", det), lr = el("div", "vp-lr", blk);
              el("span", "", lr).textContent = label;
              var v = el("span", "vp-v", lr); var sa = el("span", "vp-a", v); sa.textContent = a; var sb = el("span", "vp-b", v); sb.textContent = b;
              return { blk: blk, a: sa, b: sb };
            }
            var rc = labelRow(str(vars.color_label, "Warna"), colors[0].name, colors[cp].name);
            var sw = el("div", "vp-sw", rc.blk), swEls = colors.map(function (c) { var i = el("i", "", sw); i.style.background = c.hex; return i; });
            var ring = el("div", "vp-ring", sw);
            var rs = labelRow(str(vars.size_label, "Ukuran"), "Pilih", sizes[sp]);
            var sz = el("div", "vp-sz", rs.blk), chips = sizes.map(function (s) { var c = el("div", "vp-chip", sz); el("b", "", c); el("span", "", c).textContent = s; return c; });

            // Measure target points (in wrap coordinates) before scaling.
            var wr = wrap.getBoundingClientRect();
            function centre(e) { var r = e.getBoundingClientRect(); return { x: r.left - wr.left + r.width / 2, y: r.top - wr.top + r.height / 2 }; }
            var pSw = centre(swEls[cp]), pChip = centre(chips[sp]), p0 = centre(swEls[0]);
            var S = Math.min(1.3, (H * 0.88) / gh, (W * 0.94) / gw);
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });
            ring.style.left = swEls[0].offsetLeft + "px";
            var ringDx = swEls[cp].offsetLeft - swEls[0].offsetLeft;

            var cur = el("div", "vp-cur", wrap);
            cur.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M3 2 L3 18.5 L7.6 14.4 L10.6 21 L13.4 19.8 L10.5 13.3 L16.6 13 Z" fill="#0a0a0a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"></path></svg>';
            var tap = el("div", "vp-tap", wrap);
            var startX = gw - 140 * u, startY = gh - 120 * u;
            gsap.set(cur, { x: startX, y: startY, opacity: 0 });

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(card, { y: 50 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
            tl.fromTo(tsv, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.35);
            tl.fromTo(det.children, { y: 24 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.1 }, 0.5);
            tl.fromTo(ring, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.0);
            // Cursor to the colour swatch.
            var t1 = 1.4, d1 = 0.8;
            tl.to(cur, { opacity: 1, duration: 0.2 }, t1 - 0.1);
            tl.to(cur, { x: pSw.x - 6 * u, y: pSw.y - 4 * u, duration: d1, ease: "power2.inOut" }, t1);
            var tt = t1 + d1;
            function press(t, pt) {
              tl.to(cur, { scale: 0.82, duration: 0.09, ease: "power2.out" }, t);
              tl.to(cur, { scale: 1, duration: 0.18, ease: "back.out(2)" }, t + 0.09);
              tl.fromTo(tap, { x: pt.x, y: pt.y, scale: 0.4, opacity: 0.45 }, { x: pt.x, y: pt.y, scale: 1.3, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.04);
            }
            press(tt, pSw);
            if (cp !== 0) {
              tl.to(ring, { x: ringDx, duration: 0.3, ease: "power3.out" }, tt + 0.06);
              tl.to(shape, { fill: colors[cp].hex, duration: 0.5, ease: "power2.out" }, tt + 0.06);
              tl.fromTo(tsv, { rotation: 0 }, { rotation: 0, duration: 0.01 }, tt);
              tl.to(tsv, { scale: 1.05, duration: 0.18, ease: "power2.out" }, tt + 0.08);
              tl.to(tsv, { scale: 1, duration: 0.3, ease: "power2.out" }, tt + 0.26);
              tl.to(rc.a, { opacity: 0, duration: 0.2 }, tt + 0.06); tl.to(rc.b, { opacity: 1, duration: 0.2 }, tt + 0.1);
              tl.set(rc.a, { opacity: 1 }, 0); 
            } else { tl.to(rc.a, { opacity: 0, duration: 0.01 }, tt); tl.to(rc.b, { opacity: 1, duration: 0.01 }, tt); }
            // Cursor to the size chip.
            var t2 = tt + 0.55, d2 = 0.75;
            tl.to(cur, { x: pChip.x - 6 * u, y: pChip.y - 4 * u, duration: d2, ease: "power2.inOut" }, t2);
            var t3 = t2 + d2;
            press(t3, pChip);
            tl.to(chips[sp].firstChild, { opacity: 1, duration: 0.2, ease: "power2.out" }, t3 + 0.06);
            tl.to(chips[sp].lastChild, { color: "#ffffff", duration: 0.2 }, t3 + 0.06);
            tl.fromTo(chips[sp], { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out" }, t3 + 0.08);
            tl.to(chips[sp], { scale: 1, duration: 0.3, ease: "back.out(2)" }, t3 + 0.2);
            tl.to(rs.a, { opacity: 0, duration: 0.2 }, t3 + 0.06); tl.to(rs.b, { opacity: 1, duration: 0.2 }, t3 + 0.1);
            tl.to(cur, { x: "+=" + 90 * u, y: "+=" + 70 * u, opacity: 0, duration: 0.6, ease: "power2.in" }, t3 + 0.9);

            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["variant-picker"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
