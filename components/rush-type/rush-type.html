              scratch.height = HALF_H;
              var U = {};
              ["uText", "uRes", "uHalfPx", "uAtlasRows", "uSx", "uSyQ", "uCenterY", "uSwapU", "uHalfA", "uHalfB", "uK", "uSwapScl",
               "uShape", "uRoll", "uLag", "uThin", "uBloom", "uGain", "uExp", "uFocal", "uPos", "uRot", "uCrt", "uTime", "uGlow",
               "uGlowAmp", "uColor", "uBg"].forEach(function (n) { U[n] = gl.getUniformLocation(program, n); });
              gl.viewport(0, 0, cw, ch);
              gl.uniform1i(U.uText, 0);
              gl.uniform2f(U.uRes, cw, ch);
              gl.uniform2f(U.uHalfPx, ATLAS_W, HALF_H);
              gl.uniform1f(U.uAtlasRows, rows);
              var weight = Number(V.font_weight);
              // Draw each word once into its own row of the atlas (re-run when the font finishes loading).
              rasterize = function () {
                var ctx = scratch.getContext("2d");
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                words.forEach(function (word, row) {
                  ctx.fillStyle = "#000";
                  ctx.fillRect(0, 0, ATLAS_W, HALF_H);
                  var size = CAP_H * 1.4;
                  ctx.font = weight + " " + size + "px " + FONT;
                  var cap = ctx.measureText("H").actualBoundingBoxAscent || size * 0.72;
                  size *= CAP_H / cap;
                  ctx.font = weight + " " + size + "px " + FONT;
                  var measured = ctx.measureText(word).width;
                  if (measured > ATLAS_W * 0.92) {
                    size *= (ATLAS_W * 0.92) / measured;
                    ctx.font = weight + " " + size + "px " + FONT;
                  }
                  ctx.fillStyle = "#fff";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "alphabetic";
                  ctx.fillText(word, ATLAS_W / 2, HALF_H / 2 + CAP_H / 2);
                  halfWidths[row] = ctx.measureText(word).width / 2;
                  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, row * HALF_H, gl.RGBA, gl.UNSIGNED_BYTE, scratch);
                  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                });
                gl.generateMipmap(gl.TEXTURE_2D);
              };
              var textColor = rgb(V.color);
              var bgColor = rgb(V.background_color);
              // remocn sizes things in pixels of a 1280x720 frame; scale to this frame, then to the canvas.
              var k = Math.min(H / 720, W / 640);
              var fontPx = V.font_size * k * res;
              var focal = ch * FOCAL;
              gl.uniform1f(U.uShape, SHUTTER_SHAPE);
              gl.uniform1f(U.uRoll, ROLL_U);
              gl.uniform1f(U.uLag, LAG_U);
              gl.uniform1f(U.uExp, EXPOSURE);
              gl.uniform1f(U.uFocal, focal);
              gl.uniform3f(U.uColor, textColor[0], textColor[1], textColor[2]);
              gl.uniform3f(U.uBg, bgColor[0], bgColor[1], bgColor[2]);
              gl.clearColor(bgColor[0], bgColor[1], bgColor[2], 1);
              paint = function (frame) {
                var c = compute(frame);
                var unit = Math.max(fontPx, 1) / CAP_H;
                var stretch = Math.max(V.vertical_stretch, 1);
                function scaleY(p) { return unit * (1 + p.p * (stretch - 1)); }
                var sBefore = scaleY(c.before), sCurrent = scaleY(c.here), sAfter = scaleY(c.after);
                var qa = sCurrent;
                var qc = 2 * (sAfter + sBefore - 2 * sCurrent);
                var tangent = sAfter - sBefore;
                var peakSmear = SMEAR_GAIN * c.here.p * sCurrent;
                var magnitude = Math.sqrt(tangent * tangent + peakSmear * peakSmear);
                var qb = tangent < 0 ? -magnitude : magnitude;
                var scaleX = unit * (1 + c.here.p * (HORIZONTAL_STRETCH - 1));
                var direction = DRIFT_DIRECTION[mod(c.here.cycle, DRIFT_DIRECTION.length)];
                var psi = c.here.psi * (Math.sign(direction) || 1);
                var amp = Math.abs(direction);
                var z = focal * (1 - ORBIT_DEPTH * (1 + Math.cos(psi)) * 0.5);
                var x = 0;
                var y = focal * ORBIT_RISE * amp * Math.sin(psi);
                var yaw = orbitTurn(psi, ORBIT_YAW, ORBIT_YAW_LAG);
                var pitch = orbitTurn(psi, ORBIT_PITCH, ORBIT_PITCH_LAG);
                var pivot = PIVOT_FRAC * c.here.p;
                var perspective = focal / z;
                var glowX = cw / 2 + (focal * x) / z;
                var glowY = ch * (0.5 + pivot) + (focal * y) / z;
                var wordHalf = Math.max(halfWidths[c.before.wordIndex] || 1, halfWidths[c.after.wordIndex] || 1);
                var wordWidth = wordHalf * scaleX * perspective;
                var wordHeight = CAP_H * sCurrent * perspective;
                gl.uniform1f(U.uSx, scaleX);
                gl.uniform3f(U.uSyQ, qa, qb, qc);
                gl.uniform1f(U.uCenterY, 0.5 + pivot);
                gl.uniform1f(U.uSwapU, c.swapU);
                gl.uniform1f(U.uHalfA, c.before.wordIndex);
                gl.uniform1f(U.uHalfB, c.after.wordIndex);
                gl.uniform3f(U.uK, c.k[0], c.k[1], c.k[2]);
                gl.uniform2f(U.uSwapScl, 1 + SWAP_SPREAD * c.swapAmount, 1 - SWAP_SPREAD * c.swapAmount);
                gl.uniform1f(U.uThin, THIN * c.here.p);
                gl.uniform1f(U.uBloom, BLOOM_GAIN * c.here.p);
                gl.uniform1f(U.uGain, (1 + SPEED_GAIN * c.here.p) * (1 + SWAP_FLASH * c.swapAmount));
                gl.uniform3f(U.uPos, x, y, z);
                gl.uniform4f(U.uRot, Math.sin(yaw), Math.cos(yaw), Math.sin(pitch), Math.cos(pitch));
                gl.uniform1f(U.uCrt, CRT_GAIN * c.here.p);
                gl.uniform1f(U.uTime, frame / 30);
                gl.uniform4f(U.uGlow, glowX, glowY,
                  Math.max(wordWidth * GLOW_SPREAD, cw * GLOW_MIN),
                  Math.min(Math.max(wordHeight * GLOW_SPREAD, ch * GLOW_MIN), ch * GLOW_MAX_Y));
                gl.uniform1f(U.uGlowAmp, GROUND_SPEED * c.here.p);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
              };
            } catch (err) {
              stage.classList.add("rsh-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The atlas is redrawn whenever the web font finishes loading, so no word keeps a fallback face.
            var fontEpoch = 0;
            var atlasEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              var effective = frame * V.speed;
              if (paint) {
                if (atlasEpoch !== fontEpoch) {
                  atlasEpoch = fontEpoch;
                  rasterize();
                }
                paint(effective);
              } else {
                fallback.textContent = words[pose(effective).wordIndex] || words[0];
              }
            }
            if (document.fonts && document.fonts.load) {
              document.fonts.load(V.font_weight + " 100px Geist").then(function () { fontEpoch++; render(lastFrame); }, function () {});
            }

            var total = parseFloat(root.dataset.duration || "3.4667");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
