<!doctype html>
<!--
  Security Cam

  A scene run through a cheap recorder: macroblocks, collapsed colour, crushed blacks and
  crawling noise. The scene here is a render queue.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/security-cam/index.tsx

  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR

  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a render queue) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="security-cam"
  data-composition-duration="3"
  data-composition-variables='[{"id": "title", "type": "string", "role": "content", "label": "Title", "description": "Small heading above the list in the sample scene.", "default": "Render queue"}, {"id": "items", "type": "string", "role": "content", "label": "Rows", "description": "Rows of the list as name | status, separated by semicolons (up to 5).", "default": "intro-scene.mp4 | Done; feature-tour.mp4 | Rendering; pricing-outro.mp4 | Queued"}, {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Background of the list scene.", "default": "#101828"}, {"id": "compression", "type": "number", "role": "style", "label": "Compression", "description": "How hard luma and colour collapse into blocks.", "default": 0.7, "min": 0, "max": 1, "step": 0.05}, {"id": "block_size", "type": "number", "role": "style", "label": "Block size", "description": "Size of one macroblock. Pixel sizes are for a 1280×720 frame and scale with the frame.", "default": 10, "min": 4, "max": 32, "step": 1, "unit": "px"}, {"id": "noise", "type": "number", "role": "style", "label": "Noise", "description": "Strength of the crawling noise.", "default": 0.6, "min": 0, "max": 2, "step": 0.05}, {"id": "intensity", "type": "number", "role": "style", "label": "Intensity", "description": "0 shows the scene, 1 the full recorder look.", "default": 1, "min": 0, "max": 1, "step": 0.05}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Blocks are coarse; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Security Cam</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .scm-stage {
          position: absolute;
          inset: 0;
        }
        .scm-canvas,
        .scm-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .scm-scene {
          display: none;
        }
        .scm-off .scm-canvas {
          display: none;
        }
        .scm-off .scm-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="security-cam" data-duration="3" data-fps="30">
        <div id="scm-clip" class="scm-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <canvas id="scm-scene0" class="scm-scene scm-fb"></canvas>
          <canvas id="scm-canvas" class="scm-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "security-cam";
            var root = document.getElementById("root");
            var stage = document.getElementById("scm-clip");
            var canvas = document.getElementById("scm-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "title", "type": "string", "default": "Render queue"}, {"id": "items", "type": "string", "default": "intro-scene.mp4 | Done; feature-tour.mp4 | Rendering; pricing-outro.mp4 | Queued"}, {"id": "background", "type": "color", "default": "#101828"}, {"id": "compression", "type": "number", "default": 0.7, "min": 0, "max": 1}, {"id": "block_size", "type": "number", "default": 10, "min": 4, "max": 32}, {"id": "noise", "type": "number", "default": 0.6, "min": 0, "max": 2}, {"id": "intensity", "type": "number", "default": 1, "min": 0, "max": 1}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["scm-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "B": a render queue (remocn's CanvasSceneB), laid out for any frame size.
            var rows = pairs(V.items, 5);
            function drawB(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, V.background);
              var s = S, pad = 96 * s, inner = W - pad * 2;
              var titleH = 41 * s, rowH = 120 * s, line = Math.max(1, s);
              var total = titleH + 34 * s + rows.length * (rowH + line);
              var y = (H - total) / 2;
              ctx.fillStyle = MUTED;
              fitFont(ctx, V.title, inner, 400, 34 * s, SANS);
              ctx.fillText(V.title, pad, y + titleH / 2);
              y += titleH + 34 * s;
              rows.forEach(function (row, i) {
                ctx.fillStyle = "#23304a";
                ctx.fillRect(pad, y, inner, line);
                var mid = y + line + rowH / 2;
                var label = row[1] || "";
                var pillW = 0;
                if (label) {
                  var labelSize = fitFont(ctx, label, inner * 0.4, 500, 30 * s, SANS);
                  pillW = ctx.measureText(label).width + 52 * s;
                  var pillH = labelSize * 1.2 + 24 * s;
                  var px = pad + inner - pillW;
                  ctx.fillStyle = TONES[i % TONES.length];
                  ctx.beginPath();
                  ctx.roundRect(px, mid - pillH / 2, pillW, pillH, pillH / 2);
                  ctx.fill();
                  ctx.fillStyle = V.background;
                  ctx.textAlign = "center";
                  ctx.fillText(label, px + pillW / 2, mid);
                  ctx.textAlign = "left";
                }
                ctx.fillStyle = INK;
                fitFont(ctx, row[0], inner - pillW - 24 * s, 400, 44 * s, MONO);
                ctx.fillText(row[0], pad, mid);
                y += rowH + line;
              });
            }

            function drawScenes() {
              drawB(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform float u_frame;
uniform vec2 u_cell;
uniform float u_compression;
uniform float u_noise;
uniform float u_intensity;

in vec2 v_uv;
out vec4 outColor;

const float PI = 3.141592653589793;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);
}

float lumaOf(vec3 c) {
  return dot(c, vec3(0.299, 0.587, 0.114));
}

vec2 chromaOf(vec3 c) {
  return vec2(c.b - lumaOf(c), c.r - lumaOf(c));
}

vec3 fromLumaChroma(float y, vec2 cbcr) {
  return vec3(y + cbcr.y, y - 0.194 * cbcr.x - 0.509 * cbcr.y, y + cbcr.x);
}

vec3 blockMean(vec2 origin, vec2 cell) {
  vec3 total = vec3(0.0);
  for (int y = 0; y < 2; y++) {
    for (int x = 0; x < 2; x++) {
      vec2 at = origin + (vec2(float(x), float(y)) + 0.5) * cell * 0.5;
      total += texture(u_scene, at).rgb;
    }
  }
  return total * 0.25;
}

void main() {
  vec4 src = texture(u_scene, v_uv);
  float amount = clamp(u_intensity, 0.0, 1.0);

  if (!(amount > 0.001)) {
    outColor = src;
    return;
  }

  vec2 cell = max(u_cell, vec2(0.0008));
  vec2 wide = cell * 2.0;

  vec3 lumaBlock = blockMean(floor(v_uv / cell) * cell, cell);
  vec3 chromaBlock = blockMean(floor(v_uv / wide) * wide, wide);

  float squeeze = clamp(u_compression, 0.0, 1.0) * amount;

  float y = mix(lumaOf(src.rgb), lumaOf(lumaBlock), squeeze * 0.8);
  float levels = mix(255.0, 20.0, squeeze);
  y = floor(y * levels + 0.5) / levels;

  vec2 cbcr = mix(chromaOf(src.rgb), chromaOf(chromaBlock), squeeze);
  cbcr *= mix(1.0, 0.62, amount);

  vec3 color = fromLumaChroma(y, cbcr);

  float pump = 1.0 + 0.03 * sin(u_frame * PI / 45.0) * amount;
  color = clamp((color * pump - 0.05 * amount) / (1.0 - 0.14 * amount), 0.0, 1.0);

  float clock = mod(u_frame, 64.0);
  float shadow = 1.0 - smoothstep(0.0, 0.55, y);
  float grain =
    hash(v_uv + vec2(clock * 0.017, clock * 0.029)) - 0.5;
  color += grain * 0.16 * u_noise * amount * (0.25 + shadow);

  outColor = vec4(clamp(color, 0.0, 1.0), src.a);
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              var block = Math.max(V.block_size * S, 1);
              gl.uniform1f(u("u_compression"), V.compression);
              gl.uniform2f(u("u_cell"), block / W, block / H);
              gl.uniform1f(u("u_noise"), V.noise);
              gl.uniform1f(u("u_intensity"), V.intensity);

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("scm-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "3");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
