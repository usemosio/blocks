<!doctype html>
<!--
  Dock Text

  A pointer glides across a line of capitals and the letters near it stretch tall like a dock, the nearest one most, easing back to size when the pointer leaves.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/karthikmudunuri/eldoraui/blob/6bb8fd211ecbdfa983f5780bead27d9f3890f20a/apps/www/registry/eldoraui/dock-text.tsx

<html
  lang="en"
  data-composition-id="dock-text"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "A short word or phrase; it is shown in capitals.", "default": "Make it grow"},
    {"id": "down", "type": "boolean", "role": "motion", "label": "Grow downward", "description": "Anchor the stretch at the top so letters grow downward.", "default": false},
    {"id": "start", "type": "number", "role": "motion", "label": "Pointer enters", "description": "Seconds before the pointer reaches the first letter.", "default": 0.4, "min": 0, "max": 5, "step": 0.1, "unit": "s"},
    {"id": "sweep", "type": "number", "role": "motion", "label": "Sweep time", "description": "Seconds the pointer takes to cross the text.", "default": 2.2, "min": 0.5, "max": 6, "step": 0.1, "unit": "s"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels. The source is built for 72px type; its pixel offsets scale with this size.", "default": 120, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Dock Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .dkt-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .dkt-line { position: relative; display: flex; align-items: center; text-transform: uppercase; line-height: 1.1; letter-spacing: -0.01em; white-space: pre; }
        .dkt-ch { display: inline-block; }
      </style>

      <div id="root" data-composition-id="dock-text" data-duration="3.5" data-fps="30">
        <div id="dkt-clip" class="dkt-stage clip" data-start="0" data-duration="3.5" data-track-index="0">
          <div id="dkt-line" class="dkt-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "3.5");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("dkt-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["dock-text"] = tl;
            }


            var line = document.getElementById("dkt-line");
            var text = str(vars.text, "Make it grow"), down = bool(vars.down, false);
            var start = num(vars.start, 0.4, 0, 5), sweep = num(vars.sweep, 2.2, 0.5, 6);
            var size = num(vars.font_size, 120, 12, 260);
            line.style.fontSize = size + "px"; line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "700");
            line.setAttribute("aria-label", text);
            var spans = Array.from(text).map(function (ch) {
              var s = document.createElement("span"); s.className = "dkt-ch"; s.textContent = ch === " " ? " " : ch;
              s.style.transformOrigin = down ? "top" : "bottom"; line.appendChild(s); return s;
            });
            var maxW = root.clientWidth * 0.9;
            if (line.scrollWidth > maxW) { size = size * maxW / line.scrollWidth; line.style.fontSize = size + "px"; }
            var STEP = 1 / 120, steps = Math.ceil(total / STEP) + 1, sim = null, sig = "";
            function easeIO(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
            function simulate() {
              var centers = spans.map(function (s) { return s.offsetLeft + s.offsetWidth / 2; });
              var W = line.offsetWidth, thr = size * 0.1;
              var h = centers.join(",") + "|" + W + "|" + size; if (h === sig) return; sig = h;
              var n = spans.length, x = [], v = [], out = [], hovered = null;
              for (var i = 0; i < n; i++) { x.push(1); v.push(0); }
              for (var k = 0; k < steps; k++) {
                var t = k * STEP, p = Math.min(1, Math.max(0, (t - start) / sweep));
                var px = -0.08 * W + (1.16 * W) * easeIO(p);
                var inside = t >= start && t < start + sweep && px >= 0 && px <= W;
                if (!inside) hovered = null;
                else for (var i2 = 0; i2 < n; i2++) if (Math.abs(px - centers[i2]) <= thr) hovered = i2;
                for (var i3 = 0; i3 < n; i3++) {
                  var target = hovered === null ? 1 : Math.max(1, 1.3638 - Math.abs(i3 - hovered) * 0.1);
                  // Spring: stiffness 150, damping 20, mass 0.5.
                  v[i3] += ((-150 * (x[i3] - target) - 20 * v[i3]) / 0.5) * STEP; x[i3] += v[i3] * STEP;
                }
                out.push(x.slice());
              }
              sim = out;
            }
            function draw(t) {
              simulate();
              var i = Math.min(sim.length - 2, Math.max(0, t / STEP)), j = Math.floor(i), fr = i - j;
              spans.forEach(function (s, n) { s.style.transform = "scaleY(" + (sim[j][n] + (sim[j + 1][n] - sim[j][n]) * fr) + ")"; });
            }
            finish(gsap.timeline({ paused: true }), draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
