<!doctype html>
<!--
  Code Editor Typing

  A full code editor window (activity bar, explorer, tabs, terminal, status bar) types a snippet character by character with a caret, then tilts in 3D.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/code-editor-typing/code-editor-typing.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a block themed on a well-known code editor: generic title, project and window text and a generic highlighter palette; the code is a variable with a small built-in Python-style tokenizer instead of hand-built token lists; the photo backdrop became a two-colour gradient; fills the host frame (a 1920x1080 design for wide frames, a 1080x1920 one for tall frames without the explorer, scaled to fit), caret positions are measured before the entrance tweens run, and Inter and JetBrains Mono come from Google Fonts.
-->
<html
  lang="en"
  data-composition-id="code-editor-typing"
  data-composition-duration="11"
  data-composition-variables='[
  {
    "id": "code",
    "type": "string",
    "role": "content",
    "label": "Code",
    "description": "The code that gets typed, up to 18 lines (a small Python-style highlighter colours it).",
    "default": "# A small functional toolkit\ndef pluck_deep(key):\n    return lambda obj: reduce(lambda acc, k: acc[k], key.split(&#39;.&#39;), obj)\n\ndef compose(*fns):\n    return lambda res: reduce(lambda acc, fn: fn(acc), fns, res)\n\ndef unfold(f, seed):\n    \"\"\"Build a list by repeatedly applying f to a seed.\"\"\"\n    acc = []\n    while True:\n        result = f(seed)\n        if result is None:\n            return acc\n        acc.append(result[0])\n        seed = result[1]\n"
  },
  {
    "id": "file_name",
    "type": "string",
    "role": "content",
    "label": "File name",
    "description": "Name on the tab and in the file tree.",
    "default": "functional_toolkit.py"
  },
  {
    "id": "project_name",
    "type": "string",
    "role": "content",
    "label": "Project name",
    "description": "Name in the title bar, explorer and breadcrumbs.",
    "default": "functional-toolkit"
  },
  {
    "id": "kicker",
    "type": "string",
    "role": "content",
    "label": "Kicker",
    "description": "Small line above the title.",
    "default": "Editor theme preview"
  },
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Title",
    "description": "Big title above the window.",
    "default": "Midnight"
  },
  {
    "id": "note",
    "type": "string",
    "role": "content",
    "label": "Note",
    "description": "Small caption on the right of the title.",
    "default": "Typing a small file, with a tests terminal below."
  },
  {
    "id": "accent_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "Active tab, status bar and activity bar accent.",
    "default": "#0078d4"
  },
  {
    "id": "background_color",
    "type": "color",
    "role": "style",
    "label": "Background glow",
    "description": "Light colour of the backdrop behind the window.",
    "default": "#1d2a4a"
  },
  {
    "id": "background_color_2",
    "type": "color",
    "role": "style",
    "label": "Background base",
    "description": "Dark colour of the backdrop behind the window.",
    "default": "#0b0f1c"
  }
]'

            var term = document.getElementById("cse-term");
            [["<span class=\"prompt\">" + project.replace(/</g, "&lt;") + " %</span> python -m pytest"], ["collected 3 items"], ["tests/test_toolkit.py ... <span class=\"tok-comment\">passed</span>"]].forEach(function (r) { var d = document.createElement("div"); d.innerHTML = r[0]; term.appendChild(d); });

            // Background: two colours, with a soft glow, behind the window.
            var bgA = col(vars.background_color, "#1d2a4a"), bgB = col(vars.background_color_2, "#0b0f1c");
            root.style.background = "radial-gradient(120% 90% at 20% 15%, " + bgA + " 0%, " + bgB + " 70%), " + bgB;

            // Design size: 1920x1080 for wide frames, 1080x1920 for tall ones; the scene is scaled to fit.
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920;
            var portrait = H > W;
            var DW = portrait ? 1080 : 1920, DH = portrait ? 1920 : 1080;
            var s = Math.min(W / DW, H / DH);
            scene.style.width = DW + "px"; scene.style.height = DH + "px";
            scene.style.transform = "translate(" + (-DW * s / 2) + "px," + (-DH * s / 2) + "px) scale(" + s + ")";
            if (portrait) {
              scene.classList.add("cse-portrait");
              scene.style.setProperty("--wb-h", "1500px");
              scene.style.setProperty("--wb-cols", "1fr");
            }
            var CODE_LINE = portrait ? 34 : 28;
            if (portrait) scene.style.setProperty("--cse-line", CODE_LINE + "px");

            // A small Python-style tokenizer.
            var KEYWORDS = /^(def|return|lambda|while|if|elif|else|for|in|is|not|and|or|import|from|class|try|except|with|as|pass|yield|raise|break|continue|async|await)$/;
            var CONSTS = /^(True|False|None)$/;
            function tokenize(line) {
              var out = [], i = 0, prevDef = false;
              while (i < line.length) {
                var rest = line.slice(i), m;
                if ((m = /^#.*/.exec(rest))) { out.push([m[0], "comment"]); i += m[0].length; continue; }
                if ((m = /^("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/.exec(rest))) { out.push([m[0], "string"]); i += m[0].length; continue; }
                if ((m = /^\d+(\.\d+)?/.exec(rest))) { out.push([m[0], "number"]); i += m[0].length; continue; }
                if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
                  var w = m[0], after = line.charAt(i + w.length), kind;
                  if (KEYWORDS.test(w)) { kind = "keyword"; }
                  else if (CONSTS.test(w)) { kind = "class-name"; }
                  else if (prevDef || after === "(") { kind = "function"; }
                  else { kind = "variable"; }
                  prevDef = w === "def" || w === "class";
                  out.push([w, kind]); i += w.length; continue;
                }
                if ((m = /^\s+/.exec(rest))) { out.push([m[0], "plain"]); i += m[0].length; continue; }
                out.push([rest.charAt(0), /[=+\-*\/<>!%]/.test(rest.charAt(0)) ? "operator" : "punctuation"]); i += 1;
              }
              return out;
            }

            var tl = gsap.timeline({ paused: true });
            function build() {
              tl.clear();
              var codeEl = scene.querySelector(".code");
              var editor = scene.querySelector(".editor");
              codeEl.textContent = "";
              var oldCaret = editor.querySelector(".caret");
              if (oldCaret) oldCaret.remove();
              code.forEach(function (text, index) {
                var line = document.createElement("div");
                line.className = "line";
                if (portrait) line.style.height = CODE_LINE + "px";
                var num = document.createElement("span");
                num.className = "line-number";
                num.textContent = String(index + 1);
                line.appendChild(num);
                var lc = document.createElement("span");
                lc.className = "line-code";
                tokenize(text).forEach(function (seg) {
                  Array.from(seg[0]).forEach(function (ch) {
                    var sp = document.createElement("span");
                    sp.className = seg[1] === "plain" ? "char" : "char tok-" + seg[1];
                    sp.textContent = ch;
                    lc.appendChild(sp);
                  });
                });
                line.appendChild(lc);
                codeEl.appendChild(line);
              });
              var caret = document.createElement("span");
              caret.className = "caret";
              editor.appendChild(caret);
              if (portrait) { caret.style.height = "30px"; scene.querySelector(".active-line").style.height = CODE_LINE + "px"; }

              var activeLine = scene.querySelector(".active-line");
              var lineEls = gsap.utils.toArray(scene.querySelectorAll(".line"));
              gsap.set([scene.querySelector(".header"), scene.querySelector(".workbench"), scene.querySelector(".terminal"), term.children, activeLine], { clearProps: "all" });
              gsap.set(caret, { clearProps: "all" });
              // Measure first, before any entrance transform is applied. Rects are in screen px, so divide by the scale.
              var eb = editor.getBoundingClientRect();
              function atChar(el) { var b = el.getBoundingClientRect(); return { x: (b.right - eb.left) / s + 2, y: (b.top - eb.top) / s + 3 }; }
              function atLine(line) { var b = line.getBoundingClientRect(), c = line.querySelector(".line-code").getBoundingClientRect(); return { x: (c.left - eb.left) / s, y: (b.top - eb.top) / s + 3 }; }
              function lineY(line) { return (line.getBoundingClientRect().top - eb.top) / s; }
              var starts = [], sched = [], cursor = 0.95;
              lineEls.forEach(function (line, li) {
                var chars = gsap.utils.toArray(line.querySelectorAll(".char"));
                starts[li] = cursor;
                chars.forEach(function (ch, ci) { sched.push({ ch: ch, t: cursor + ci * 0.012, p: atChar(ch) }); });
                cursor += Math.max(chars.length * 0.012, 0.08) + 0.045;
              });
              var lineInfo = lineEls.map(function (l) { return { y: lineY(l), p: atLine(l) }; });

              gsap.set(activeLine, { y: lineInfo[0].y });
              gsap.set(caret, lineInfo[0].p);
              tl.from(scene.querySelector(".header"), { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" }, 0);
              tl.from(scene.querySelector(".workbench"), { y: 42, opacity: 0, scale: 0.986, duration: 0.58, ease: "power3.out" }, 0.1);
              tl.from(activeLine, { opacity: 0, duration: 0.22, ease: "power2.out" }, 0.74);
              starts.forEach(function (t, li) {
                tl.set(activeLine, { y: lineInfo[li].y }, t);
                tl.set(caret, lineInfo[li].p, t);
                tl.call(function () { lineEls.forEach(function (it) { it.classList.toggle("is-active", it === lineEls[li]); }); }, [], t);
              });
              sched.forEach(function (c) {
                tl.set(c.ch, { opacity: 1 }, c.t);
                tl.set(caret, c.p, c.t + 0.002);
              });
              tl.to(caret, { opacity: 0, duration: 0.34, repeat: 25, yoyo: true, ease: "steps(1)" }, 0.95);
              var tEnd = Math.max(cursor, 7.55);
              tl.from(scene.querySelector(".terminal"), { y: 140, opacity: 0, duration: 0.56, ease: "power3.out" }, tEnd);
              tl.from(term.children, { opacity: 0, y: 8, duration: 0.24, stagger: 0.16, ease: "power2.out" }, tEnd + 0.5);
              var wb = scene.querySelector(".workbench");
              tl.to(wb, { rotateY: -10.5, z: 74, duration: 0.72, ease: "power2.inOut" }, 9.35);
              tl.to(wb, { rotateY: 0, z: 0, duration: 0.62, ease: "power2.inOut" }, 10.08);
              if (tl.duration() < 11) tl.to({}, { duration: 11 - tl.duration() });
              tl.seek(0);
            }
            build();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { build(); }, function () {});
            window.__timelines = window.__timelines || {};
            window.__timelines["code-editor-typing"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
