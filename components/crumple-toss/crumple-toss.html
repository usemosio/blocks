const DEFAULT_STEP = 3;

const qf = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step) * step;

const qstep = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step);

const hash01 = (seed        )         => {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = Math.imul(h ^ (h >>> 13), 2246822519);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

const hashRange = (seed        , lo        , hi        )         =>
  lo + hash01(seed) * (hi - lo);

                                                           

const paperJitter = (
  frame        ,
  seed        ,
  options                                                   ,
)         => {
  const amp = options?.amp ?? 1.4;
  const rotAmp = options?.rotAmp ?? 0.35;
  const s = qstep(frame, options?.step ?? DEFAULT_STEP);
  return {
    x: hashRange(`${seed}:x:${s}`, -amp, amp),
    y: hashRange(`${seed}:y:${s}`, -amp, amp),
    rot: hashRange(`${seed}:r:${s}`, -rotAmp, rotAmp),
  };
};

const steppedRamp = (
  frame        ,
  from        ,
  to        ,
  options                                                  ,

  const f = qf(frame, options?.step ?? DEFAULT_STEP);
  if (f <= from) return 0;
  if (f >= to) return 1;
  const ease = options?.ease ?? ((t        ) => t);
  return ease((f - from) / (to - from));
};

const rayToEdge = (
  angle        ,
  halfWidth        ,
  halfHeight        ,
)                   => {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const t = Math.min(
    halfWidth / (Math.abs(cos) || 1e-9),
    halfHeight / (Math.abs(sin) || 1e-9),
  );
  return [cos * t, sin * t];
};

const normalize = (angle        ) => {
  const turn = Math.PI * 2;
  return ((angle % turn) + turn) % turn;
};

const shrinkToward = (
  [x, y]                  ,
  factor        ,
)                   => [x * factor, y * factor];

const averageOf = (points                    )                   => [
  points.reduce((sum, p) => sum + p[0], 0) / points.length,
  points.reduce((sum, p) => sum + p[1], 0) / points.length,
];

function crumpleSegments(args   
                
                 
                    
                  
                   
                      
                
 )                   {
  const count = Math.max(3, Math.round(args.segments ?? 9));
  const layers = Math.max(1, Math.round(args.layers ?? DEFAULT_LAYERS));
  const crushTo = args.crushTo ?? 0.34;
  const chaos = Math.min(1, Math.max(0, args.randomness ?? DEFAULT_RANDOMNESS));
  const seed = args.seed ?? "toss";
  const halfWidth = args.width / 2;
  const halfHeight = args.height / 2;
  const wad = Math.min(args.width, args.height) * crushTo;

  const angles = Array.from(
    { length: count },
    (_, i) =>
      (i / count) * Math.PI * 2 +
      hashRange(`${seed}:ang${i}`, -ANGLE_JITTER, ANGLE_JITTER) * chaos,
  );

  const corners                     = [
    [halfWidth, halfHeight],
    [-halfWidth, halfHeight],
    [-halfWidth, -halfHeight],
    [halfWidth, -halfHeight],
  ];

  const toPercent = ([x, y]                  )                   => [
    ((x + halfWidth) / args.width) * 100,
    ((y + halfHeight) / args.height) * 100,
  ];

  const panels                   = [];

  angles.forEach((angle, i) => {
    const nextAngle =
      angles[(i + 1) % count] + (i === count - 1 ? Math.PI * 2 : 0);
    const from = rayToEdge(angle, halfWidth, halfHeight);
    const to = rayToEdge(nextAngle, halfWidth, halfHeight);

    const span = normalize(nextAngle - angle);
    const between = corners
      .map((corner)                             => [
        corner,
        normalize(Math.atan2(corner[1], corner[0]) - angle),
      ])
      .filter(([, spanned]) => spanned > 0 && spanned < span)
      .sort((a, b) => a[1] - b[1])
      .map(([corner]) => corner);

    const rim                     = [from, ...between, to];

    for (let layer = 0; layer < layers; layer++) {
      const inner = layer / layers;
      const outer = (layer + 1) / layers;
      const depth = (layer + 1) / layers;
      const shape                     =
        layer === 0
          ? [[0, 0], ...rim.map((point) => shrinkToward(point, outer))]
          : [
              ...rim.map((point) => shrinkToward(point, outer)),
              ...[...rim].reverse().map((point) => shrinkToward(point, inner)),
            ];

      const centroid = averageOf(shape);
      const extent =
        Math.max(
          ...shape.map((point) =>
            Math.hypot(point[0] - centroid[0], point[1] - centroid[1]),
          ),
        ) || 1;
      const key = `${seed}:${i}:${layer}`;

      const reach =
        wad *
        (WAD_REACH * depth +
          hashRange(`${key}:reach`, -WAD_SPREAD, WAD_SPREAD) * chaos * depth);
      const heading = Math.atan2(centroid[1], centroid[0]);

      panels.push({
        clip: shape.map(toPercent),
        origin: toPercent(centroid),
        dx: Math.cos(heading) * reach - centroid[0],
        dy: Math.sin(heading) * reach - centroid[1],
        scale:
          Math.min(FACET_CAP, (wad * FACET_SIZE) / extent) *
          (1 + hashRange(`${key}:size`, -SCALE_SPREAD, SCALE_SPREAD) * chaos),
        rotate:
          chaos === 0
            ? 0
            : hashRange(`${seed}:tilt${i}`, -FOLD_TILT, FOLD_TILT) *
              chaos *
              (LAYER_TILT_FLOOR + (1 - LAYER_TILT_FLOOR) * depth),
        tone: Math.min(
          TONES.length - 1,
          TONE_PATTERN[panels.length % TONE_PATTERN.length] +
            Math.ceil((1 - depth) * 2),
        ),
        crease: 0.5 + hashRange(`${key}:crease`, -0.2, 0.2) * chaos,
      });
    }
  });

  return panels;
}

function creaseShading(
  piece                                                    ,
  crush        ,
)         {
  const tone = TONES[piece.tone];
  const fold = piece.crease * 100;
  const lit = Math.max(0, fold - CREASE_BLEND).toFixed(1);
  const dark = Math.min(100, fold + CREASE_BLEND).toFixed(1);
  const angle = (LIGHT_ANGLE - piece.rotate * crush).toFixed(1);
  return `linear-gradient(${angle}deg, ${tone.lit} 0%, ${tone.lit} ${lit}%, ${tone.dark} ${dark}%, ${tone.dark} 100%)`;
}

function crumpleTossLanding(options    
                     
                    
 )                           {
  const distance = options?.distance ?? 900;
  const radians = ((options?.direction ?? -35) * Math.PI) / 180;
  return {
    x: distance * Math.cos(radians),
    y: distance * Math.sin(radians) + GRAVITY * distance,
  };
}

function crumpleTossPose(
  args                                       ,
)              {
  const crumpleSteps = args.crumpleSteps ?? 4;
  const tossSteps = args.tossSteps ?? 5;
  const direction = args.direction ?? -35;
  const distance = args.distance ?? 900;
  const spin = args.spin ?? 220;
  const step = args.step ?? DEFAULT_STEP;

  if (args.frame < args.at) {
    return {
      phase: "idle",
      crush: 0,
      scale: 1,
      rotate: 0,
      x: 0,
      y: 0,
      opacity: 1,
    };
  }

  const pose = qstep(args.frame - args.at, step);

  if (pose < crumpleSteps) {
    return {
      phase: "crumple",
      crush: (pose + 1) / crumpleSteps,
      scale: 1,
      rotate: 0,
      x: 0,
      y: 0,
      opacity: 1,
    };
  }

  if (pose < crumpleSteps + tossSteps) {
    const t = (pose - crumpleSteps + 1) / tossSteps;
    const radians = (direction * Math.PI) / 180;
    return {
      phase: "toss",
      crush: 1,
      scale: 1 - FLIGHT_SHRINK * t,
      rotate: spin * t,
      x: distance * Math.cos(radians) * t,
      y: distance * Math.sin(radians) * t + GRAVITY * distance * t * t,
      opacity: t === 1 ? EXIT_OPACITY : 1,
    };
  }

  return {
    phase: "gone",
    crush: 1,
    scale: 0,
    rotate: 0,
    x: 0,
    y: 0,
    opacity: 0,
  };
}

            var wad = document.getElementById("cts-wad");
            var pieces = crumpleSegments({ width: W, height: H, segments: segments, layers: layers, randomness: randomness, crushTo: crushTo, seed: seed });
            var nodes = pieces.map(function (piece, i) {
              var el = document.createElement("div");
              el.id = "cts-piece-" + i;
              el.className = "cts-piece";
              el.style.clipPath = "polygon(" + piece.clip.map(function (p) { return p[0] + "% " + p[1] + "%"; }).join(", ") + ")";
              el.style.transformOrigin = piece.origin[0] + "% " + piece.origin[1] + "%";
              el.innerHTML = '<div class="cts-fill">' + cardHtml + '</div><div class="cts-shade"></div>';
              wad.appendChild(el);
              return { el: el, shade: el.lastChild, piece: piece };
            });
            var title = str(vars.card_title, "How it used to work"), body = str(vars.card_body, "Six steps and a wiki page");
            Array.prototype.forEach.call(wad.querySelectorAll(".cts-card-title"), function (e) { e.textContent = title; });
            Array.prototype.forEach.call(wad.querySelectorAll(".cts-card-body"), function (e) { e.textContent = body; });

            var landing = crumpleTossLanding({ direction: direction, distance: distance });
            var binLeft = W / 2 + landing.x - 75, binTop = H / 2 + landing.y;
            var rim = document.getElementById("cts-rim"), bin = document.getElementById("cts-bin");
            var gx = Math.min(0, binLeft), gw = Math.max(W, binLeft + 150) - gx, gh = Math.max(H, binTop + 170);
            rim.style.left = binLeft - gx + "px"; rim.style.top = binTop - 15 + "px";
            bin.style.left = binLeft - gx + "px"; bin.style.top = binTop + "px";
            wad.style.left = -gx + "px";
            var group = document.getElementById("cts-group");
            fit(group, gw, gh, 0.9);
            function draw(frame) {
              var pose = crumpleTossPose(Object.assign({ frame: frame }, timing));
              var binOut = pose.crush >= 1;
              rim.style.display = binOut ? "block" : "none";
              bin.style.display = binOut ? "block" : "none";
              if (pose.phase === "gone") { wad.style.display = "none"; return; }
              wad.style.display = "block";
              var c = pose.crush;
              wad.style.opacity = pose.opacity;
              wad.style.transformOrigin = "50% 50%";
              wad.style.transform = "translate(" + pose.x + "px, " + pose.y + "px) rotate(" + pose.rotate + "deg) scale(" + pose.scale + ")";
              nodes.forEach(function (n) {
                var p = n.piece;
                n.el.style.transform = "translate(" + p.dx * c + "px, " + p.dy * c + "px) rotate(" + p.rotate * c + "deg) scale(" + (1 + (p.scale - 1) * c) + ")";
                n.el.style.filter = c > 0 ? "drop-shadow(0 0 " + 0.6 * c + "px rgba(38,36,44,0.55))" : "none";
                n.shade.style.background = creaseShading(p, c);
                n.shade.style.opacity = c;
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 90, draw, 1);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["crumple-toss"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
