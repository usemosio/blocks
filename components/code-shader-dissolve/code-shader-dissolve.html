<!doctype html>
<!--
  Code Shader Dissolve

  A code snippet appears through a noise dissolve: a glowing cyan edge with a small colour fringe sweeps over the card as the syntax-highlighted lines resolve, then the card holds crisp. WebGL shader over a card the block draws from a code variable.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/code-shader-dissolve/code-shader-dissolve.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame; rewritten from three.js (not loaded) to raw WebGL2: the card is a full-screen-fitted quad and the dissolve shader is unchanged apart from GLSL ES 3.0 syntax; the baked Shiki tokens are replaced by a `code` variable highlighted by a small tokenizer in the same GitHub-dark colours; the font is JetBrains Mono from Google Fonts; the canvas is drawn at the `resolution` variable.
-->
<html
  lang="en"
  data-composition-id="code-shader-dissolve"
  data-composition-duration="7"
  data-composition-variables='[{"id": "code", "type": "string", "role": "content", "label": "Code", "description": "The snippet shown. Use line breaks; JavaScript-like syntax is highlighted with a GitHub-dark palette.", "default": "function compile(src) {\n  const ast = parse(src)\n  const ir = optimize(ast)\n  return emit(ir)\n}"},
    {"id": "card_color", "type": "color", "role": "style", "label": "Card colour", "default": "#0b0f17"},
    {"id": "backdrop", "type": "color", "role": "style", "label": "Backdrop", "default": "#05070b"},
    {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Code text needs 0.75.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Code Shader Dissolve</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .csd-stage {
          position: absolute;
          inset: 0;
        }
        .csd-canvas {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
      </style>

      <div id="root" data-composition-id="code-shader-dissolve" data-duration="7" data-fps="30">
        <div id="csd-clip" class="csd-stage clip" data-start="0" data-duration="7" data-track-index="0">
          <canvas id="csd-canvas" class="csd-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "code-shader-dissolve";
            var DUR = 7;
            var root = document.getElementById("root");
            var canvas = document.getElementById("csd-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#000000").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "code", "type": "string", "role": "content", "label": "Code", "description": "The snippet shown. Use line breaks; JavaScript-like syntax is highlighted with a GitHub-dark palette.", "default": "function compile(src) {\n  const ast = parse(src)\n  const ir = optimize(ast)\n  return emit(ir)\n}"}, {"id": "card_color", "type": "color", "role": "style", "label": "Card colour", "default": "#0b0f17"}, {"id": "backdrop", "type": "color", "role": "style", "label": "Backdrop", "default": "#05070b"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Code text needs 0.75.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else V[d.id] = typeof raw === "string" ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var cw = Math.max(2, Math.round(W * V.resolution));
            var ch = Math.max(2, Math.round(H * V.resolution));
            root.style.background = V.backdrop;
            canvas.width = cw;
            canvas.height = ch;
            var CODE_FONT = "'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace";
            var KEYWORDS = /^(async|await|function|const|let|var|return|if|else|import|from|export|new|class|for|of|in|while|true|false|null|undefined|try|catch|throw|default|switch|case|break|typeof|yield)$/;
            // A small highlighter in the GitHub-dark palette (keywords, function names, parameters, constants, strings, comments).
            function tokenize(src) {
              var lines = String(src).split("\n"), constSet = {}, paramSet = {}, out = [];
              var inParams = false, afterFn = false, afterDecl = false;
              lines.forEach(function (line) {
                var toks = [], re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)|(\d+(?:\.\d+)?)|([A-Za-z_$][\w$]*)|(\s+)|(=>|[=+\-*/<>!&|?:]+)|(.)/g, m;
                while ((m = re.exec(line))) {
                  var s = m[0], c = "#E1E4E8";
                  if (m[1]) c = "#6A737D";
                  else if (m[2]) c = "#9ECBFF";
                  else if (m[3]) c = "#79B8FF";
                  else if (m[4]) {
                    var rest = line.slice(re.lastIndex);
                    if (KEYWORDS.test(s)) { c = "#F97583"; afterFn = s === "function"; afterDecl = /^(const|let|var)$/.test(s); }
                    else if (afterFn) { c = "#B392F0"; afterFn = false; }
                    else if (afterDecl) { c = "#79B8FF"; constSet[s] = 1; afterDecl = false; }
                    else if (inParams) { c = "#FFAB70"; paramSet[s] = 1; }
                    else if (paramSet[s]) c = "#FFAB70";
                    else if (constSet[s] || /^[A-Z]/.test(s)) c = "#79B8FF";
                    else if (/^\s*\(/.test(rest)) c = "#B392F0";
                    else if (/^\s*[,)]/.test(rest) && /\($/.test(line.slice(0, line.length - rest.length - s.length).trim()) ) c = "#B392F0";
                  } else if (m[6]) c = "#F97583";
                  else if (m[7]) { if (s === "(" && /function\s+[\w$]+\s*$/.test(line.slice(0, m.index))) inParams = true; else if (s === ")") inParams = false; }
                  toks.push({ t: s, c: c });
                }
                out.push(toks);
              });
              return out;
            }
            // Draw the code onto a 2D canvas (the texture the shader works on).
            function drawCode(fontPx, lineH, padX, padY, weight, bg) {
              var lines = tokenize(V.code);
              var font = weight + " " + fontPx + "px " + CODE_FONT;
              var m = document.createElement("canvas").getContext("2d");
              m.font = font;
              var maxW = 0;
              lines.forEach(function (l) { var w = 0; l.forEach(function (k) { w += m.measureText(k.t).width; }); maxW = Math.max(maxW, w); });
              var cwid = Math.max(2, Math.ceil(maxW + padX * 2)), chei = Math.max(2, Math.ceil(lines.length * lineH + padY * 2));
              var c = document.createElement("canvas");
              c.width = cwid; c.height = chei;
              var ctx = c.getContext("2d");
              ctx.fillStyle = bg; ctx.fillRect(0, 0, cwid, chei);
              ctx.textBaseline = "top"; ctx.font = font;
              lines.forEach(function (l, i) {
                var x = padX;
                l.forEach(function (k) { ctx.fillStyle = k.c; ctx.fillText(k.t, x, padY + i * lineH); x += ctx.measureText(k.t).width; });
              });
              return { canvas: c, W: cwid, H: chei };
            }
            var BG = rgb(V.backdrop);
            var S = { progress: 0 };
            var code = null, upload = function () {};
            function build() { code = drawCode(40, 60, 90, 80, 600, V.card_color); }
            build();
            var codeEpoch = 0, rebuild = function () {};
            if (document.fonts && document.fonts.load) {
              document.fonts.load("600 40px 'JetBrains Mono'").then(function () { codeEpoch++; rebuild(); if (paint) paint(tl.time()); }, function () {});
            }

            var VERTEX = `#version 300 es
in vec2 aPos;
uniform vec2 uHalf;
out vec2 v_uv;
void main() { v_uv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5); gl_Position = vec4(aPos * uHalf, 0.0, 1.0); }`;
            var FRAGMENT = `#version 300 es
precision highp float;
out vec4 outColor;
in vec2 v_uv;
uniform sampler2D uTex;
uniform float uProgress;
uniform float uSeed;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.)); vec2 u=f*f*(3.-2.*f); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
void main(){
  // v_uv runs top-down; the noise field and texture use y up
  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);
  float n = noise(uv*16.0+uSeed)*0.6 + noise(uv*48.0+uSeed*1.7)*0.3 + noise(uv*120.0+uSeed*2.3)*0.1;
  float edge = 0.12;
  float reveal = smoothstep(n-edge, n+edge, uProgress);
  float band = reveal*(1.0-reveal)*4.0;
  float off = band*0.010;
  float r = texture(uTex, vec2(uv.x+off, 1.0-uv.y)).r;
  float g = texture(uTex, vec2(uv.x, 1.0-uv.y)).g;
  float b = texture(uTex, vec2(uv.x-off, 1.0-uv.y)).b;
  vec3 codeCol = vec3(r,g,b);
  vec3 glow = vec3(0.30,0.72,1.0) * band * 0.9;
  vec3 outc = codeCol*reveal + glow;
  float a = max(reveal, band*0.8);
  outColor = vec4(outc, a);
}
`;

            var gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var prog = gl.createProgram();
              gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.bindAttribLocation(prog, 0, "aPos");
              gl.linkProgram(prog);
              if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link failed");
              gl.useProgram(prog);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              gl.enableVertexAttribArray(0);
              gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
              gl.viewport(0, 0, cw, ch);
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
              function u(name) { return gl.getUniformLocation(prog, name); }
              var tex = gl.createTexture();
              gl.activeTexture(gl.TEXTURE0);
              gl.bindTexture(gl.TEXTURE_2D, tex);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              gl.uniform1i(u("uTex"), 0);
              gl.uniform1f(u("uSeed"), 11 * 13.37);
              var progressLoc = u("uProgress"), halfLoc = u("uHalf");
              // The card fills 82% of the frame, fitted by its own aspect (as the upstream camera does).
              function layout() {
                var aspect = code.W / code.H;
                var fit = 0.82, hw = fit, hh = fit * (W / H) / aspect;
                if (hh > fit) { hh = fit; hw = fit * aspect * (H / W); }
                gl.uniform2f(halfLoc, hw, hh);
                gl.activeTexture(gl.TEXTURE0);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, code.canvas);
              }
              layout();
              rebuild = function () { build(); layout(); };
              paint = function (t) {
                gl.uniform1f(progressLoc, S.progress);
                gl.clearColor(BG[0], BG[1], BG[2], 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              canvas.style.display = "none";
              if (window.console) console.warn(NAME + ":", err.message);
            }

            var tl = gsap.timeline({ paused: true, onUpdate: function () { if (paint) paint(tl.time()); } });
            // The code compiles in, then holds crisp; the 1.15 overshoot resolves even the highest-noise pixels.
            tl.to(S, { progress: 1.15, duration: DUR * 0.62, ease: "power1.inOut" }, 0);

            // The block lasts DUR seconds even when nothing is tweened at the end.
            tl.set({}, {}, DUR);
            if (paint) paint(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
