<!doctype html>
<!--
  Duotone Beat

  A two-ink halftone portrait that swaps its ink pair on every beat, punches in on the downbeat and shows a bar indicator. A built-in head-and-shoulders silhouette stands in for the photo: a host puts its own picture in by replacing the contents of the .db-picture layer (an img with object-fit: cover works); the duotone and halftone filter is applied to that layer.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/duotone-beat/index.tsx

<html
  lang="en"
  data-composition-id="duotone-beat"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "beat_frames", "type": "number", "role": "motion", "label": "Frames per beat", "description": "Frames per beat at 30 fps (15 is 120 BPM).", "default": 15, "min": 4, "max": 30, "step": 1, "unit": "frames"},
    {"id": "beats_per_bar", "type": "number", "role": "motion", "label": "Beats per bar", "description": "Beats per bar; the first beat of each bar gets the bigger punch-in.", "default": 4, "min": 1, "max": 8, "step": 1},
    {"id": "punch", "type": "number", "role": "motion", "label": "Punch", "description": "Scale added on the downbeat. Off-beats get a third of it.", "default": 0.07, "min": 0, "max": 0.2, "step": 0.01},
    {"id": "halftone", "type": "number", "role": "style", "label": "Halftone pitch", "description": "Halftone dot pitch in pixels at 720p. 0 keeps smooth tones.", "default": 8, "min": 0, "max": 20, "step": 1, "unit": "px"},
    {"id": "show_indicator", "type": "boolean", "role": "style", "label": "Bar indicator", "description": "Show the beat squares and BPM tag.", "default": true},
    {"id": "palettes", "type": "string", "role": "style", "label": "Ink pairs", "description": "JSON list of [shadow ink, highlight ink] hex pairs, one per beat, cycled.", "default": "[[\"#111111\",\"#FFFFFF\"],[\"#111111\",\"#E5322D\"],[\"#E5322D\",\"#FFFFFF\"],[\"#E5322D\",\"#111111\"]]"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed.", "default": 1, "min": 0.1, "max": 4, "step": 0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Duotone Beat</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #ffffff; }
        .db-stage { position: absolute; inset: 0; overflow: hidden; }
        .db-picture { position: absolute; inset: 0; }
        .db-pan { position: absolute; inset: 0; background: #ffffff; transform-origin: 50% 40%; }
        .db-pan svg, .db-pan img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .db-bar { position: absolute; display: flex; align-items: center; }
        .db-sq { box-sizing: border-box; }
        .db-bpm { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
      </style>

      <div id="root" data-composition-id="duotone-beat" data-duration="4" data-fps="30">
        <div id="db-clip" class="db-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="db-defs"></defs></svg>
          <div id="db-picture" class="db-picture"><div id="db-pan" class="db-pan"></div></div>
          <div id="db-bar" class="db-bar"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            var FPS = 30;
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;

            // Piecewise-linear map of x from inR to outR, optionally eased per segment and clamped.
            function interp(x, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var i = 0;
              if (x >= inR[n - 1]) i = n - 2;
              else if (x > inR[0]) { while (x > inR[i + 1]) i++; }
              var t = (x - inR[i]) / (inR[i + 1] - inR[i]);
              if (o.clamp !== false) t = Math.min(1, Math.max(0, t));
              if (o.easing) t = o.easing(t);
              return outR[i] + (outR[i + 1] - outR[i]) * t;
            }
            function clamp01(t) { return Math.min(1, Math.max(0, t)); }

            // Easings with Remotion's names; every one maps 0..1 to 0..1.
            var E = {
              linear: function (t) { return t; },
              quad: function (t) { return t * t; },
              cubic: function (t) { return t * t * t; },
              sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
              back: function (s) { return function (t) { return t * t * ((s + 1) * t - s); }; },
              out: function (f) { return function (t) { return 1 - f(1 - t); }; },
              inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; },
              bezier: function (x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var k = 0; k < 24; k++) {
                    var mt = 1 - t;
                    var bx = 3 * mt * mt * t * x1 + 3 * mt * t * t * x2 + t * t * t;
                    if (bx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var m = 1 - t;
                  return 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t;
                };
              }
            };

            var SVGNS = "http://www.w3.org/2000/svg";
            function el(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }

            var tl = gsap.timeline({ paused: true });
            // Runs draw(frame) from the timeline so seeking to a time always draws the same picture.
            function drive(frames, draw) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
              draw(0);
            }

            var beatFrames = num(vars.beat_frames, 15, 4, 30);
            var beatsPerBar = Math.max(1, Math.round(num(vars.beats_per_bar, 4, 1, 8)));
            var punch = num(vars.punch, 0.07, 0, 0.2);
            var halftone = num(vars.halftone, 8, 0, 20);
            var showIndicator = bool(vars.show_indicator, true);
            var speed = num(vars.speed, 1, 0.1, 4);
            var palettes = [["#111111", "#FFFFFF"], ["#111111", "#E5322D"], ["#E5322D", "#FFFFFF"], ["#E5322D", "#111111"]];
            try {
              var parsed = JSON.parse(str(vars.palettes, ""));
              if (Array.isArray(parsed) && parsed.length && parsed.every(function (p) { return Array.isArray(p) && p.length >= 2 && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(p[0]) && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(p[1]); })) palettes = parsed;
            } catch (e) { /* keep the default ink pairs */ }

            var u = Math.min(W, H) / 720;
            function hexToRgb(hex) {
              var h = hex.replace("#", "").trim();
              if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
              var n = parseInt(h.slice(0, 6), 16);
              return Number.isNaN(n) ? [0, 0, 0] : [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
            }

            // Built-in stand-in for the photo: a lit head and shoulders over a soft grey ground.
            var pan = document.getElementById("db-pan");
            (function () {
              var svg = el("svg", { viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" }, pan);
              var defs = el("defs", {}, svg);
              var rg = el("radialGradient", { id: "db-ground", cx: 0.5, cy: 0.4, r: 0.8 }, defs);
              [["0", "#FFFFFF"], ["0.5", "#F2F2F2"], ["1", "#C4C4C4"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, rg); });
              el("rect", { width: W, height: H, fill: "url(#db-ground)" }, svg);
              var lgS = el("linearGradient", { id: "db-skin", x1: 0, y1: 0, x2: 1, y2: 0.2 }, defs);
              [["0", "#121212"], ["0.55", "#3A3A3A"], ["1", "#9C9C9C"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, lgS); });
              var lgT = el("linearGradient", { id: "db-shirt", x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
              [["0", "#141414"], ["0.6", "#262626"], ["1", "#6A6A6A"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, lgT); });
              var h = H, cx = W / 2;
              function P(x, y) { return (cx + x * h) + " " + (y * h); }
              var head = ["M " + P(0, 0.17), "C " + P(0.075, 0.17) + " " + P(0.118, 0.23) + " " + P(0.118, 0.32), "C " + P(0.118, 0.4) + " " + P(0.095, 0.46) + " " + P(0.06, 0.49),
                "C " + P(0.035, 0.51) + " " + P(-0.035, 0.51) + " " + P(-0.06, 0.49), "C " + P(-0.095, 0.46) + " " + P(-0.118, 0.4) + " " + P(-0.118, 0.32), "C " + P(-0.118, 0.23) + " " + P(-0.075, 0.17) + " " + P(0, 0.17) + " Z"].join(" ");
              var hair = ["M " + P(-0.126, 0.34), "C " + P(-0.14, 0.17) + " " + P(-0.05, 0.125) + " " + P(0.02, 0.135), "C " + P(0.11, 0.14) + " " + P(0.145, 0.21) + " " + P(0.126, 0.32),
                "C " + P(0.11, 0.245) + " " + P(0.06, 0.215) + " " + P(-0.01, 0.222), "C " + P(-0.07, 0.228) + " " + P(-0.105, 0.26) + " " + P(-0.126, 0.34) + " Z"].join(" ");
              var torso = ["M " + P(-0.07, 0.585), "C " + P(-0.13, 0.62) + " " + P(-0.3, 0.63) + " " + P(-0.36, 0.7), "C " + P(-0.41, 0.76) + " " + P(-0.43, 0.88) + " " + P(-0.44, 1.01),
                "L " + P(0.44, 1.01), "C " + P(0.43, 0.88) + " " + P(0.41, 0.76) + " " + P(0.36, 0.7), "C " + P(0.3, 0.63) + " " + P(0.13, 0.62) + " " + P(0.07, 0.585) + " Z"].join(" ");
              var fig = el("g", {}, svg);
              fig.id = "db-figure";
              el("path", { d: "M " + P(-0.055, 0.45) + " L " + P(-0.065, 0.61) + " L " + P(0.065, 0.61) + " L " + P(0.055, 0.45) + " Z", fill: "#0C0C0C" }, fig);
              el("path", { d: torso, fill: "url(#db-shirt)" }, fig);
              el("path", { d: "M " + P(-0.075, 0.59) + " Q " + P(0, 0.67) + " " + P(0.075, 0.59), fill: "none", stroke: "#7A7A7A", "stroke-width": 0.012 * h }, fig);
              el("ellipse", { cx: cx - 0.12 * h, cy: 0.34 * h, rx: 0.018 * h, ry: 0.04 * h, fill: "#161616" }, fig);
              el("ellipse", { cx: cx + 0.12 * h, cy: 0.34 * h, rx: 0.018 * h, ry: 0.04 * h, fill: "#8A8A8A" }, fig);
              el("path", { d: head, fill: "url(#db-skin)" }, fig);
              el("path", { d: hair, fill: "#060606" }, fig);
              var rim = el("g", { fill: "none", stroke: "#D6D6D6", "stroke-width": 0.007 * h, "stroke-linecap": "round", style: "filter: blur(" + 0.003 * h + "px)" }, fig);
              el("path", { d: "M " + P(0.112, 0.27) + " C " + P(0.118, 0.36) + " " + P(0.105, 0.43) + " " + P(0.07, 0.475) }, rim);
              el("path", { d: "M " + P(0.14, 0.625) + " C " + P(0.3, 0.64) + " " + P(0.39, 0.72) + " " + P(0.42, 0.88) }, rim);
            })();
            var figure = document.getElementById("db-figure");

            // Duotone (grey, optional halftone screen, then a two-ink lookup) as one SVG filter.
            var defs = document.getElementById("db-defs");
            var f = el("filter", { id: "db-duotone", x: 0, y: 0, width: 1, height: 1, "color-interpolation-filters": "sRGB" }, defs);
            el("feColorMatrix", { type: "saturate", values: 0, result: "gray" }, f);
            var pitch = halftone * u;
            if (pitch > 0) {
              var tile = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="' + pitch + '" height="' + pitch + '"><defs><radialGradient id="g" r="0.71"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient></defs><rect width="' + pitch + '" height="' + pitch + '" fill="url(#g)"/></svg>');
              el("feImage", { href: tile, x: 0, y: 0, width: pitch, height: pitch, result: "dot" }, f);
              el("feTile", { in: "dot", result: "screen" }, f);
              el("feComposite", { in: "gray", in2: "screen", operator: "arithmetic", k1: 0, k2: 8, k3: -8, k4: 1 }, f);
            }
            var ct = el("feComponentTransfer", {}, f);
            var funcs = ["feFuncR", "feFuncG", "feFuncB"].map(function (n) { return el(n, { type: "table", tableValues: "0 1" }, ct); });
            document.getElementById("db-picture").style.filter = "url(#db-duotone)";

            var bar = document.getElementById("db-bar");
            bar.style.left = 48 * u + "px"; bar.style.bottom = 44 * u + "px"; bar.style.gap = 10 * u + "px";
            var squares = [];
            for (var i = 0; i < beatsPerBar; i++) {
              var sq = document.createElement("div");
              sq.className = "db-sq"; sq.style.width = sq.style.height = 26 * u + "px";
              bar.appendChild(sq); squares.push(sq);
            }
            var bpmEl = document.createElement("span");
            bpmEl.className = "db-bpm";
            bpmEl.style.cssText = "margin-left:" + 10 * u + "px;font-size:" + 20 * u + "px;letter-spacing:" + 2 * u + "px";
            bar.appendChild(bpmEl);
            if (!showIndicator) bar.style.display = "none";

            var period = Math.max(1, beatFrames);
            var outCubic = E.out(E.cubic);
            var lastBeat = -1;
            function draw(frame) {
              var t = frame * speed;
              var beat = Math.floor(t / period), local = t - beat * period, inBar = beat % beatsPerBar;
              var pair = palettes[beat % palettes.length];
              if (beat !== lastBeat) {
                lastBeat = beat;
                var dark = hexToRgb(pair[0]), light = hexToRgb(pair[1]);
                funcs.forEach(function (fn, c) { fn.setAttribute("tableValues", dark[c] + " " + light[c]); });
              }
              var strength = inBar === 0 ? punch : punch / 3;
              pan.style.transform = "scale(" + (1 + strength * Math.exp(-local / 3.2)) + ")";
              var rise = interp(t, [0, 12], [0.22, 0], { easing: outCubic });
              var intro = interp(t, [0, 12], [0, 1], { easing: outCubic });
              figure.setAttribute("transform", "translate(0 " + rise * H + ")");
              squares.forEach(function (sq, i) {
                sq.style.border = 2.5 * u + "px solid " + pair[0];
                sq.style.backgroundColor = i === inBar ? pair[0] : "transparent";
                sq.style.transform = "scale(" + (i === inBar ? 1 + 0.25 * Math.exp(-local / 3) : 1) + ")";
              });
              bpmEl.style.color = pair[0]; bpmEl.style.backgroundColor = pair[1];
              bpmEl.textContent = String(Math.round((30 * 60) / period)) + " BPM";
            }
            drive(Math.round(parseFloat(root.dataset.duration || "4") * FPS), draw);

            var total = parseFloat(root.dataset.duration || "4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["duotone-beat"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
