<!doctype html>
<!--
  Domain Warp Dissolve

  Cascaded fbm(p + fbm(p)) displaces both scenes along a warp field. Iridescent cosine-palette edge glow. A WebGL transition between two built-in panels.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/domain-warp-dissolve/domain-warp-dissolve.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame instead of a fixed 1920×1080 scene with a side
  panel; the two demo scenes are drawn on 2D canvases (text and colours from variables) instead of
  being captured from DOM elements; the fragment shader is unchanged apart from GLSL ES 3.0 syntax
  (WebGL2); the canvas is drawn at the `resolution` variable and its progress comes from the timeline;
  without WebGL the panels cross-fade. The block applies the look to its own two panels, not to the
  host's video.
-->
<html
  lang="en"
  data-composition-id="domain-warp-dissolve"
  data-composition-duration="4"
  data-composition-variables='[{"id": "label_a", "type": "string", "role": "content", "label": "Panel A label", "description": "Big word on the outgoing panel.", "default": "SCENE A"},
    {"id": "caption_a", "type": "string", "role": "content", "label": "Panel A caption", "description": "Small line under the label on the outgoing panel.", "default": "Outgoing scene"},
    {"id": "label_b", "type": "string", "role": "content", "label": "Panel B label", "description": "Big word on the incoming panel.", "default": "SCENE B"},
    {"id": "caption_b", "type": "string", "role": "content", "label": "Panel B caption", "description": "Small line under the label on the incoming panel.", "default": "Incoming scene"},
    {"id": "color_a", "type": "color", "role": "style", "label": "Panel A background", "description": "Background of the outgoing panel.", "default": "#0a0a0a"},
    {"id": "ink_a", "type": "color", "role": "style", "label": "Panel A ink", "description": "Text and line colour on the outgoing panel.", "default": "#fafafa"},
    {"id": "color_b", "type": "color", "role": "style", "label": "Panel B background", "description": "Background of the incoming panel.", "default": "#f5f5f5"},
    {"id": "ink_b", "type": "color", "role": "style", "label": "Panel B ink", "description": "Text and line colour on the incoming panel.", "default": "#0a0a0a"}, {"id": "caption_ink_a", "type": "color", "role": "style", "label": "Panel A caption colour", "description": "Colour of the small caption on the outgoing panel.", "default": "#a3a3a3"}, {"id": "caption_ink_b", "type": "color", "role": "style", "label": "Panel B caption colour", "description": "Colour of the small caption on the incoming panel.", "default": "#2563eb"},
    {"id": "hold", "type": "number", "role": "timing", "label": "Start of transition", "description": "Seconds the outgoing panel holds before the transition starts.", "default": 1, "min": 0, "max": 3, "step": 0.05, "unit": "s"},
    {"id": "length", "type": "number", "role": "timing", "label": "Transition length", "description": "Seconds the transition takes (the block lasts 4 seconds in all).", "default": 2, "min": 0.3, "max": 3.5, "step": 0.05, "unit": "s"},
    {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Lower renders faster; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Domain Warp Dissolve</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Space+Mono:wght@400;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .dwd-stage {
          position: absolute;
          inset: 0;
        }
        .dwd-canvas,
        .dwd-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .dwd-scene {
          display: none;
        }
        .dwd-off .dwd-canvas {
          display: none;
        }
        .dwd-off .dwd-scene {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="domain-warp-dissolve" data-duration="4" data-fps="30">
        <div id="dwd-clip" class="dwd-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <canvas id="dwd-scene0" class="dwd-scene"></canvas>
          <canvas id="dwd-scene1" class="dwd-scene"></canvas>
          <canvas id="dwd-canvas" class="dwd-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "domain-warp-dissolve";
            var TAG = "dwd";
            var root = document.getElementById("root");
            var stage = document.getElementById(TAG + "-clip");
            var canvas = document.getElementById(TAG + "-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            var DEFS = [{"id": "label_a", "type": "string", "role": "content", "label": "Panel A label", "description": "Big word on the outgoing panel.", "default": "SCENE A"}, {"id": "caption_a", "type": "string", "role": "content", "label": "Panel A caption", "description": "Small line under the label on the outgoing panel.", "default": "Outgoing scene"}, {"id": "label_b", "type": "string", "role": "content", "label": "Panel B label", "description": "Big word on the incoming panel.", "default": "SCENE B"}, {"id": "caption_b", "type": "string", "role": "content", "label": "Panel B caption", "description": "Small line under the label on the incoming panel.", "default": "Incoming scene"}, {"id": "color_a", "type": "color", "role": "style", "label": "Panel A background", "description": "Background of the outgoing panel.", "default": "#0a0a0a"}, {"id": "ink_a", "type": "color", "role": "style", "label": "Panel A ink", "description": "Text and line colour on the outgoing panel.", "default": "#fafafa"}, {"id": "color_b", "type": "color", "role": "style", "label": "Panel B background", "description": "Background of the incoming panel.", "default": "#f5f5f5"}, {"id": "ink_b", "type": "color", "role": "style", "label": "Panel B ink", "description": "Text and line colour on the incoming panel.", "default": "#0a0a0a"}, {"id": "caption_ink_a", "type": "color", "role": "style", "label": "Panel A caption colour", "description": "Colour of the small caption on the outgoing panel.", "default": "#a3a3a3"}, {"id": "caption_ink_b", "type": "color", "role": "style", "label": "Panel B caption colour", "description": "Colour of the small caption on the incoming panel.", "default": "#2563eb"}, {"id": "hold", "type": "number", "role": "timing", "label": "Start of transition", "description": "Seconds the outgoing panel holds before the transition starts.", "default": 1, "min": 0, "max": 3, "step": 0.05, "unit": "s"}, {"id": "length", "type": "number", "role": "timing", "label": "Transition length", "description": "Seconds the transition takes (the block lasts 4 seconds in all).", "default": 2, "min": 0.3, "max": 3.5, "step": 0.05, "unit": "s"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Lower renders faster; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var TOTAL = 4;
            var HOLD = Math.min(V.hold, TOTAL - 0.3);
            var LEN = Math.min(V.length, TOTAL - HOLD);

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var cw = Math.max(2, Math.round(W * V.resolution));
            var ch = Math.max(2, Math.round(H * V.resolution));
            var sceneCanvases = [0, 1].map(function (i) {
              var el = document.getElementById(TAG + "-scene" + i);
              el.width = cw;
              el.height = ch;
              return el;
            });

            // The two demo panels (the upstream "SCENE A" / "SCENE B"), laid out for any frame size.
            var DISPLAY = "'Bebas Neue', Impact, 'Arial Narrow', sans-serif";
            var MONO = "'Space Mono', ui-monospace, Menlo, monospace";
            var S = Math.min(W, H) / 1080;
            function drawScene(el, bg, ink, label, caption, capInk) {
              var ctx = el.getContext("2d");
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = bg;
              ctx.fillRect(0, 0, W, H);
              // faint blueprint grid and ring, so the shader has structure to bend
              ctx.globalAlpha = 0.09;
              ctx.strokeStyle = ink;
              ctx.lineWidth = Math.max(1, 2 * S);
              var step = 54 * S;
              ctx.beginPath();
              for (var x = (W / 2) % step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
              for (var y = (H / 2) % step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
              ctx.stroke();
              ctx.globalAlpha = 0.28;
              ctx.lineWidth = 3 * S;
              ctx.beginPath();
              ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.34, 0, Math.PI * 2);
              ctx.stroke();
              ctx.globalAlpha = 1;
              ctx.fillStyle = ink;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              var size = 190 * S;
              ctx.font = "400 " + size + "px " + DISPLAY;
              if ("letterSpacing" in ctx) ctx.letterSpacing = size * 0.06 + "px";
              var w = ctx.measureText(label).width;
              if (w > W * 0.82) { size *= (W * 0.82) / w; ctx.font = "400 " + size + "px " + DISPLAY; }
              ctx.fillText(label, W / 2, H / 2 - 10 * S);
              if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
              var csize = 36 * S;
              ctx.globalAlpha = 1;
              ctx.fillStyle = capInk;
              ctx.font = "700 " + csize + "px " + MONO;
              if ("letterSpacing" in ctx) ctx.letterSpacing = csize * 0.2 + "px";
              var cwid = ctx.measureText(caption.toUpperCase()).width;
              if (cwid > W * 0.82) { csize *= (W * 0.82) / cwid; ctx.font = "700 " + csize + "px " + MONO; }
              ctx.fillText(caption.toUpperCase(), W / 2, H / 2 + size * 0.5 + 40 * S);
              ctx.globalAlpha = 1;
              if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
            }
            function drawScenes() {
              drawScene(sceneCanvases[0], V.color_a, V.ink_a, V.label_a, V.caption_a, V.caption_ink_a);
              drawScene(sceneCanvases[1], V.color_b, V.ink_b, V.label_b, V.caption_b, V.caption_ink_b);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var HEAD = "#version 300 es\nprecision highp float;\nin vec2 v_uv;\nout vec4 outColor;\nuniform sampler2D u_from;\nuniform sampler2D u_to;\nuniform float u_progress;\nuniform vec2 u_resolution;\n";
            // Fragment shader from Hyperframes (the transition), in GLSL ES 3.0 syntax.
            var FRAGMENT = HEAD + `
float hash(vec2 p){
  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
}
float vnoise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.,a=.5;
  mat2 R=mat2(.8,.6,-.6,.8);
  for(int i=0;i<5;i++){
    v+=a*vnoise(p);
    p=R*p*2.02;
    a*=.5;
  }
  return v;
}
vec3 palette(float t,vec3 a,vec3 b,vec3 c,vec3 d){
  return a+b*cos(6.2832*(c*t+d));
}
void main(){
  vec2 q=vec2(fbm(v_uv*3.),fbm(v_uv*3.+vec2(5.2,1.3)));
  vec2 r=vec2(fbm(v_uv*3.+q*4.+vec2(1.7,9.2)),fbm(v_uv*3.+q*4.+vec2(8.3,2.8)));
  float n=fbm(v_uv*3.+r*2.);
  vec2 warpDir=(q-.5)*.4;
  vec4 A=texture(u_from,clamp(v_uv+warpDir*u_progress,0.,1.));
  vec4 B=texture(u_to,clamp(v_uv-warpDir*(1.-u_progress),0.,1.));
  float e=smoothstep(u_progress-.08,u_progress+.08,n);
  float ed=abs(n-u_progress);
  float em=smoothstep(.1,0.,ed)*(1.-step(1.,u_progress));
  vec3 ec=palette(ed*8.,vec3(.5),vec3(.5),vec3(1.),vec3(0.,.33,.67));
  outColor=vec4(mix(B,A,e).rgb+ec*em*2.,1.);
}
`;
            var PASS = HEAD + "void main() { outColor = u_progress < 0.5 ? texture(u_from, v_uv) : texture(u_to, v_uv); }";

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var vs = compile(gl.VERTEX_SHADER, VERTEX);
              function program(frag) {
                var p = gl.createProgram();
                gl.attachShader(p, vs);
                gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
                gl.bindAttribLocation(p, 0, "a_pos");
                gl.linkProgram(p);
                if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || "link failed");
                gl.useProgram(p);
                gl.uniform1i(gl.getUniformLocation(p, "u_from"), 0);
                gl.uniform1i(gl.getUniformLocation(p, "u_to"), 1);
                gl.uniform2f(gl.getUniformLocation(p, "u_resolution"), cw, ch);
                return { p: p, progress: gl.getUniformLocation(p, "u_progress") };
              }
              var trans = program(FRAGMENT);
              var pass = program(PASS);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              gl.enableVertexAttribArray(0);
              gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
              [0, 1].forEach(function (unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              });
              gl.viewport(0, 0, cw, ch);
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
              };
              paint = function (p) {
                // before the transition the outgoing panel shows as is, after it the incoming one
                var pick = p <= 0 || p >= 1;
                var use = pick ? pass : trans;
                gl.useProgram(use.p);
                gl.uniform1f(use.progress, p);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add(TAG + "-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The panels are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function progressAt(frame) {
              var t = frame / 30;
              var x = Math.min(1, Math.max(0, (t - HOLD) / LEN));
              return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
            }
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              var p = progressAt(frame);
              if (paint) paint(p);
              else sceneCanvases[1].style.opacity = String(p);
            }
            if (document.fonts && document.fonts.load) {
              ["400 100px 'Bebas Neue'", "700 30px 'Space Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var totalFrames = TOTAL * 30;
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: TOTAL,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
