  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="letter-3d-swap"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Words that roll.", "default": "Set your mind to it"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#111111"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "solid_faces", "type": "boolean", "role": "style", "label": "Solid faces", "description": "Fill each face with the face color so the outgoing letter is hidden behind the incoming one, as the source does. Turn off to see through.", "default": true},
    {"id": "face_color", "type": "color", "role": "style", "label": "Face color", "description": "Fill of the faces when solid. Match it to what sits behind the text.", "default": "#ffffff"},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Side the new face rolls in from.", "default": "top", "options": [{"value": "top", "label": "Top"}, {"value": "right", "label": "Right"}, {"value": "bottom", "label": "Bottom"}, {"value": "left", "label": "Left"}]},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.03, "min": 0, "max": 0.3, "step": 0.005, "unit": "s"},
    {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave starts.", "default": "first", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]},
    {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness of the roll.", "default": 160, "min": 20, "max": 600, "step": 5},
    {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping of the roll.", "default": 25, "min": 5, "max": 60, "step": 1},
    {"id": "swaps", "type": "number", "role": "motion", "label": "Swaps", "description": "How many times the wave plays.", "default": 3, "min": 1, "max": 6, "step": 1},
    {"id": "first_swap", "type": "number", "role": "motion", "label": "First swap", "description": "Seconds before the first wave.", "default": 0.4, "min": 0, "max": 4, "step": 0.05, "unit": "s"},
    {"id": "interval", "type": "number", "role": "motion", "label": "Interval", "description": "Seconds between the start of one wave and the next.", "default": 1.5, "min": 0.6, "max": 4, "step": 0.1, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Letter 3D Swap</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #111111; font-family: Geist, system-ui, sans-serif; }
        .l3-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .l3-line { display: flex; flex-wrap: wrap; justify-content: center; max-width: 90cqw; line-height: 1.2; }
        .l3-word { display: inline-flex; }
        .l3-space { display: inline-block; white-space: pre; }
        .l3-box { position: relative; display: inline-block; transform-style: preserve-3d; }
        .l3-size { display: inline-block; visibility: hidden; white-space: pre; }
        .l3-face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; text-align: center; white-space: pre; backface-visibility: hidden; }
      </style>

      <div id="root" data-composition-id="letter-3d-swap" data-duration="5" data-fps="30">
        <div id="l3-clip" class="l3-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div id="l3-line" class="l3-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Words that roll.", "default": "Set your mind to it"}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"}, {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#111111"}, {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]}, {"id": "solid_faces", "type": "boolean", "role": "style", "label": "Solid faces", "description": "Fill each face with the face color so the outgoing letter is hidden behind the incoming one, as the source does. Turn off to see through.", "default": true}, {"id": "face_color", "type": "color", "role": "style", "label": "Face color", "description": "Fill of the faces when solid. Match it to what sits behind the text.", "default": "#ffffff"}, {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Side the new face rolls in from.", "default": "top", "options": [{"value": "top", "label": "Top"}, {"value": "right", "label": "Right"}, {"value": "bottom", "label": "Bottom"}, {"value": "left", "label": "Left"}]}, {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.03, "min": 0, "max": 0.3, "step": 0.005, "unit": "s"}, {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave starts.", "default": "first", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]}, {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness of the roll.", "default": 160, "min": 20, "max": 600, "step": 5}, {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping of the roll.", "default": 25, "min": 5, "max": 60, "step": 1}, {"id": "swaps", "type": "number", "role": "motion", "label": "Swaps", "description": "How many times the wave plays.", "default": 3, "min": 1, "max": 6, "step": 1}, {"id": "first_swap", "type": "number", "role": "motion", "label": "First swap", "description": "Seconds before the first wave.", "default": 0.4, "min": 0, "max": 4, "step": 0.05, "unit": "s"}, {"id": "interval", "type": "number", "role": "motion", "label": "Interval", "description": "Seconds between the start of one wave and the next.", "default": 1.5, "min": 0.6, "max": 4, "step": 0.1, "unit": "s"}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "5");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var line = document.getElementById("l3-line");
            var text = V("text") || "Set your mind to it";
            var dir = V("direction"), vertical = dir === "top" || dir === "bottom";
            line.setAttribute("aria-label", text);
            line.style.color = V("color");
            line.style.fontWeight = V("font_weight");
            line.style.fontSize = "min(" + V("font_size") + "px, calc(88cqw / " + Math.max(2, text.length * 0.55).toFixed(2) + "))";
            var boxes = [];
            text.split(" ").forEach(function (word, wi, words) {
              var w = document.createElement("span"); w.className = "l3-word";
              fitText(word).forEach(function (ch) {
                var box = document.createElement("span"); box.className = "l3-box"; box.id = "l3-box-" + boxes.length;
                box.innerHTML = '<span class="l3-size"></span><span class="l3-face l3-f1"></span><span class="l3-face l3-f2"></span>';
                box.children[0].textContent = ch; box.children[1].textContent = ch; box.children[2].textContent = ch;
                w.appendChild(box); boxes.push(box);
              });
              line.appendChild(w);
              if (wi < words.length - 1) { var sp = document.createElement("span"); sp.className = "l3-space"; sp.textContent = " "; line.appendChild(sp); }
            });
            var delays = stagger(boxes.length, V("stagger_from"), V("stagger"));
            var sp = spring({ stiffness: V("stiffness"), damping: V("damping") });
            var swaps = V("swaps"), first = V("first_swap"), interval = V("interval");
            if (V("solid_faces")) boxes.forEach(function (b) { b.children[1].style.background = V("face_color"); b.children[2].style.background = V("face_color"); });
            var tl = gsap.timeline({ paused: true });
            var sign = dir === "top" || dir === "left" ? 1 : -1; // box roll angle sign (right/bottom handled below)
            var boxAngle = { right: -90, left: 90, top: -90, bottom: 90 }[dir];
            var axis = vertical ? "X" : "Y";
            var faceTurn = { right: "rotateY(90deg)", left: "rotateY(-90deg)", top: "rotateX(90deg)", bottom: "rotateX(-90deg)" }[dir];
            function draw(t) {
              for (var i = 0; i < boxes.length; i++) {
                var b = boxes[i], size = b.children[0];
                var d = vertical ? size.offsetHeight : size.offsetWidth;
                var el = t - first - delays[i], p = 0;
                if (el >= 0) {
                  var k = Math.min(swaps - 1, Math.floor(el / interval)), e = el - k * interval;
                  p = e >= sp.duration ? 0 : sp.at(e);
                }
                b.style.transform = "translateZ(" + (-d / 2) + "px) rotate" + axis + "(" + (boxAngle * p).toFixed(3) + "deg)";
                b.children[1].style.transform = "translateZ(" + d / 2 + "px)";
                b.children[2].style.transform = faceTurn + " translateZ(" + d / 2 + "px)";
              }
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["letter-3d-swap"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
