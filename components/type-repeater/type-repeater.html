<!--
  Type Repeater

<html
  lang="en"
  data-composition-id="type-repeater"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "One short word.", "default": "Repeat"},
    {"id": "mode", "type": "enum", "role": "style", "label": "Mode", "description": "How the copies unfold.", "default": "tunnel", "options": [{"value": "tunnel", "label": "Tunnel"}, {"value": "spiral", "label": "Spiral"}, {"value": "fan", "label": "Fan"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Word color", "description": "Color of the front word.", "default": "#111111"},
    {"id": "accent", "type": "color", "role": "style", "label": "Last copy", "description": "Color the copies step toward.", "default": "#fafafa"},
    {"id": "copies", "type": "number", "role": "style", "label": "Copies", "description": "Number of copies including the word.", "default": 12, "min": 2, "max": 24, "step": 1},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in reference pixels (720 high stage).", "default": 110, "min": 40, "max": 240, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "number", "role": "style", "label": "Weight", "description": "Font weight, 100 to 900.", "default": 800, "min": 100, "max": 900, "step": 100},
    {"id": "outline", "type": "boolean", "role": "style", "label": "Outline copies", "description": "Draw the copies as outlines.", "default": true},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Type Repeater</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .tr-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
        .tr-wrap { position: relative; }
        .tr-copy { line-height: 1; white-space: pre; }
      </style>

      <div id="root" data-composition-id="type-repeater" data-duration="3" data-fps="30">
        <div id="tr-clip" class="tr-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
              <filter id="tr-outline">
                <feMorphology id="tr-erode" in="SourceAlpha" operator="erode" radius="1.5" result="inner" />
                <feComposite in="SourceGraphic" in2="inner" operator="out" />
              </filter>
            </defs>
          </svg>
          <div id="tr-wrap" class="tr-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "3");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var wrap = document.getElementById("tr-wrap");
            var text = str(vars.text, "Repeat"), mode = pick(vars.mode, ["tunnel", "spiral", "fan"], "tunnel");
            var color = col(vars.color, "#111111"), accent = col(vars.accent, "#fafafa");
            var count = Math.max(1, Math.round(num(vars.copies, 12, 2, 24))), weight = num(vars.font_weight, 800, 100, 900);
            var outline = bool(vars.outline, true), speed = num(vars.speed, 1, 0.25, 4);
            var unit = Math.min(root.clientWidth / 1280, root.clientHeight / 720);
            var size = num(vars.font_size, 110, 40, 240) * unit;
            document.getElementById("tr-erode").setAttribute("radius", 1.5 * unit);
            var MODES = { fan: { rotate: 11, scale: 1, pivot: 2.6, sym: true }, spiral: { rotate: 12, scale: 1.1, pivot: 0, sym: false }, tunnel: { rotate: 0, scale: 1.2, pivot: 0, sym: false } };
            var M = MODES[mode];
            function rgb(c) {
              var h = c.replace("#", "");
              if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
              var n = parseInt(h, 16);
              return Number.isFinite(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : [255, 255, 255];
            }
            var c0 = rgb(color), c1 = rgb(accent);
            var copies = [];
            for (var i = count - 1; i >= 0; i--) {
              var d = document.createElement("div");
              d.className = "tr-copy"; d.textContent = text;
              d.style.fontSize = size + "px"; d.style.fontWeight = weight; d.style.fontVariationSettings = '"wght" ' + weight;
              d.style.position = i === 0 ? "relative" : "absolute";
              if (i > 0) { d.style.inset = "0"; d.setAttribute("aria-hidden", "true"); if (outline) d.style.filter = "url(#tr-outline)"; }
              d.style.transformOrigin = "50% calc(50% + " + M.pivot + "em)";
              wrap.appendChild(d); copies.push({ i: i, el: d });
            }
            var easeOutC = function (p) { return 1 - Math.pow(1 - p, 3); };
            var unfoldEase = function (p) { var q = 1 - p; return 1 - q * q * (2.4 * q - 1.4); };
            function spreadAt(t) {
              if (t < 34) return ip(t, 10, 34, 0, 1, unfoldEase);
              if (t < 70) return 1 + 0.06 * Math.sin(2 * Math.PI * ((t - 34) / 36));
              return ip(t, 70, 90, 1, 0, cubInOut);
            }
            tick(function (tt) {
              var t = tt * 30 * speed, spread = spreadAt(t), intro = ip(t, 0, 10, 0, 1, easeOutC);
              wrap.style.opacity = intro; wrap.style.transform = "scale(" + (0.9 + 0.1 * intro) + ")";
              copies.forEach(function (c) {
                var i = c.i, steps = M.sym ? Math.ceil(i / 2) : i, side = M.sym && i % 2 === 0 ? -1 : 1, reach = steps * spread;
                var op = i === 0 ? 1 : (1 - (0.85 * i) / count) * Math.min(1, Math.max(0, spread * 4));
                var tint = count > 1 ? i / (count - 1) : 0;
                c.el.style.opacity = op > 0 ? op : 0;
                c.el.style.color = "rgb(" + [0, 1, 2].map(function (k) { return Math.round(c0[k] + (c1[k] - c0[k]) * tint); }).join(",") + ")";
                c.el.style.transform = "rotate(" + (side * M.rotate * reach || 0) + "deg) scale(" + Math.pow(M.scale, reach) + ")";
              });
            });
            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["type-repeater"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
