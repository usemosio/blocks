<!doctype html>
<!--
  Stairs Column Reveal

  Five full-height columns grow down from the top in a right-to-left stagger to cover the frame, then drop away off the bottom in a second stagger while the next scene scales in from 120 percent.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://codepen.io/avipaul_/pen/myeGOyY

  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  Changes by usemosio/blocks: the replay button and page placeholder become two built-in scenes ('A' and 'B', text from variables) so the transition previews on its own: scene A stays until the columns cover it, scene B scales in as they drop; the column count, colour, stagger and texts are variables; the overlay display toggles are dropped.
-->
<html
  lang="en"
  data-composition-id="stairs-column-reveal"
  data-composition-duration="3.8"
  data-composition-variables='[
    {"id":"label_a","type":"string","role":"content","label":"Scene A text","description":"Text on the outgoing scene.","default":"Sebelum"},
    {"id":"label_b","type":"string","role":"content","label":"Scene B text","description":"Text on the incoming scene.","default":"Sesudah"},
    {"id":"stair_color","type":"color","role":"style","label":"Column color","description":"Colour of the columns.","default":"#0a0a0a"},
    {"id":"background_a","type":"color","role":"style","label":"Scene A background","description":"Background of the outgoing scene.","default":"#ffffff"},
    {"id":"background_b","type":"color","role":"style","label":"Scene B background","description":"Background of the incoming scene.","default":"#f5f5f4"},
    {"id":"text_color","type":"color","role":"style","label":"Text color","description":"Colour of both scene texts.","default":"#0a0a0a"},
    {"id":"columns","type":"number","role":"motion","label":"Columns","description":"Number of columns.","default":5,"min":2,"max":12,"step":1},
    {"id":"font_size","type":"number","role":"style","label":"Font size","description":"Maximum text size in pixels; it also shrinks with the frame width.","default":130,"min":24,"max":260,"step":1,"unit":"px"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Stairs Column Reveal</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;

        }
        .scr-stage {
          position: absolute;
          inset: 0;
        }

        .scr-scene { display: flex; align-items: center; justify-content: center; font-family: Geist, system-ui, sans-serif; font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: var(--scr-text, #0a0a0a); }
        .scr-scene span { display: block; font-size: min(var(--scr-fs, 130px), 15cqw); }
        #scr-b { opacity: 0; }
        #scr-stairs { position: absolute; inset: 0; display: flex; }
        .scr-stair { flex: 1 1 0; height: 100%; align-self: flex-start; will-change: transform; }
      </style>

      <div id="root" data-composition-id="stairs-column-reveal" data-duration="3.8" data-fps="30">
        <div id="scr-clip" class="scr-stage clip" data-start="0" data-duration="3.8" data-track-index="0">
          <div id="scr-a" class="scr-stage scr-scene"><span id="scr-ta"></span></div>
          <div id="scr-b" class="scr-stage scr-scene"><span id="scr-tb"></span></div>
          <div id="scr-stairs"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 3.8;

            root.style.setProperty("--scr-text", col(vars.text_color, "#0a0a0a"));
            root.style.setProperty("--scr-fs", num(vars.font_size, 130, 24, 260) + "px");
            var A = document.getElementById("scr-a"), B = document.getElementById("scr-b");
            A.style.background = col(vars.background_a, "#ffffff");
            B.style.background = col(vars.background_b, "#f5f5f4");
            document.getElementById("scr-ta").textContent = str(vars.label_a, "Sebelum");
            document.getElementById("scr-tb").textContent = str(vars.label_b, "Sesudah");
            var n = Math.round(num(vars.columns, 5, 2, 12));
            var wrap = document.getElementById("scr-stairs");
            var color = col(vars.stair_color, "#0a0a0a");
            var stairs = [];
            for (var i = 0; i < n; i++) {
              var d = document.createElement("div");
              d.className = "scr-stair";
              d.style.background = color;
              wrap.appendChild(d);
              stairs.push(d);
            }
            var T0 = 0.6;
            var tl = gsap.timeline({ paused: true });
            var span = function (amount, i) { return (n - 1 - i) * (amount / (n - 1)); };
            // grow downward from the top, right to left
            stairs.forEach(function (s, i) {
              tl.fromTo(s, { height: 0 }, { height: "100%", duration: 0.5, ease: "power2.out" }, T0 + span(0.2, i));
              tl.fromTo(s, { yPercent: 0 }, { yPercent: 100, duration: 0.6, ease: "power3.inOut", immediateRender: false }, T0 + 0.7 + span(0.25, i));
            });
            tl.set(A, { opacity: 0 }, T0 + 0.7);
            tl.fromTo(B, { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, T0 + 1.3);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["stairs-column-reveal"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
