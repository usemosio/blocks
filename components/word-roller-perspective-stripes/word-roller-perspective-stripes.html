<!--

<html
  lang="en"
  data-composition-id="word-roller-perspective-stripes"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "line_1", "type": "string", "role": "content", "label": "Line 1", "description": "First line of the phrase, also repeated in every other row.", "default": "Create your"},
    {"id": "line_2", "type": "string", "role": "content", "label": "Line 2", "description": "Second line of the phrase, also repeated in the other rows.", "default": "own video"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the centre phrase in pixels. Wide text shrinks to fit the frame.", "default": 64, "min": 20, "max": 240, "step": 1, "unit": "px"},
    {"id": "color_1", "type": "color", "role": "style", "label": "Line 1 color", "description": "Color of the first line and its rows.", "default": "#0a0a0a"},
    {"id": "color_2", "type": "color", "role": "style", "label": "Line 2 color", "description": "Color of the second line and its rows.", "default": "#2563eb"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Perspective Stripes</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wps-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: #0a0a0a; }
        .wps-plane { position: absolute; left: 50%; top: 50%; width: 200%; height: 150%; transform-style: preserve-3d; }
        .wps-row { position: absolute; left: 0; right: 0; display: flex; align-items: center; white-space: nowrap; font-weight: 700; font-size: 0.5625em; }
        .wps-row span { margin-right: 1.667em; }
        .wps-g { position: relative; text-align: center; line-height: 1.2; z-index: 2; }
        .wps-l { font-weight: 800; text-shadow: 0 0 0.625em var(--bg, #fafafa), 0 0 0.3em var(--bg, #fafafa); white-space: pre; }

      </style>

      <div id="root" data-composition-id="word-roller-perspective-stripes" data-duration="5" data-fps="30">
        <div id="wps-clip" class="wps-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div id="wps-plane" class="wps-plane"></div>
          <div id="wps-g" class="wps-g"><div id="wps-l1" class="wps-l"></div><div id="wps-l2" class="wps-l"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "5");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-perspective-stripes"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            root.style.setProperty("--bg", str(vars.background, "#fafafa"));
            
            var lines = [str(vars.line_1, "Create your"), str(vars.line_2, "own video")];
            var cols = [str(vars.color_1, "#0a0a0a"), str(vars.color_2, "#2563eb")];
            var stage = el("wps-clip"), plane = el("wps-plane"), g = el("wps-g");
            var l1 = el("wps-l1"), l2 = el("wps-l2");
            l1.textContent = lines[0]; l1.style.color = cols[0];
            l2.textContent = lines[1]; l2.style.color = cols[1];
            var base = num(vars.font_size, 64, 20, 240);
            function fit() {
              g.style.fontSize = base + "px";
              var w = Math.max(l1.offsetWidth, l2.offsetWidth, 1);
              var k = Math.min(1, root.clientWidth * 0.88 / w);
              g.style.fontSize = Math.max(6, base * k) + "px";
              // The stripes follow the frame height (64 px at 1080), not the title size.
              plane.style.fontSize = (root.clientHeight / 1080 * 64) + "px";
            }
            fit();
            onFonts(fit);

            var COUNT = 9, SH = 1.25;
            var rowEls = [];
            for (var i = 0; i < COUNT; i++) {
              var r = document.createElement("div");
              r.className = "wps-row";
              r.style.height = SH / 0.5625 + "em";
              var ph = i % 2;
              for (var j = 0; j < 14; j++) {
                var s = document.createElement("span");
                s.textContent = lines[ph];
                s.style.color = cols[ph];
                r.appendChild(s);
              }
              plane.appendChild(r);
              rowEls.push(r);
            }
            // remocn-scenes: rows scroll 3 px a frame at 64 px type (stripe height 80 px), each row slides
            // sideways at 2-4 px a frame, depth sets a faint opacity; plane = perspective 800 px, rotateX 45, rotateZ -15.
            function draw(t) {
              var U = 64, SP = COUNT * SH * 2;
              var off = t * 3 / U;
              plane.style.transform = "translate(-50%, -50%) perspective(12.5em) rotateX(45deg) rotateZ(-15deg)";
              rowEls.forEach(function (r, i) {
                var baseY = i * SH * 2 - off;
                var wrapped = ((baseY % SP) + SP) % SP;
                var y = wrapped - SH * 2;
                var xs = (2 + (i % 3)) / U;
                var xo = ((t * xs + i * 100 / U) % (2000 / U)) - 1000 / U;
                r.style.top = (y / 0.5625) + "em";
                r.style.transform = "translateX(" + (xo / 0.5625) + "em)";
                r.style.opacity = ip(wrapped, 0, COUNT * SH, 0.06, 0.3);
              });
              l1.style.opacity = ip(t, 20, 40, 0, 1);
              l2.style.opacity = ip(t, 30, 50, 0, 1);
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
