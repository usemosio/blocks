<!doctype html>
<!--
  Text Roll

  Every letter rolls over like a rotating drum: the front face tips away on the X axis while the same letter swings in from below, one letter after another, then the roll repeats.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/ibelick/motion-primitives/blob/120f64f6ca60348e251f929e9c81f11ccbe45eda/components/core/text-roll.tsx

<html
  lang="en"
  data-composition-id="text-roll"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short phrase that rolls.", "default": "Roll the text"},
    {"id": "duration", "type": "number", "role": "motion", "label": "Roll time", "description": "Seconds each half-turn takes.", "default": 0.5, "min": 0.1, "max": 2, "step": 0.05, "unit": "s"},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between one letter and the next.", "default": 0.1, "min": 0.02, "max": 0.5, "step": 0.01, "unit": "s"},
    {"id": "exit_offset", "type": "number", "role": "motion", "label": "Exit offset", "description": "Seconds the incoming face waits after the outgoing one starts.", "default": 0.2, "min": 0, "max": 1, "step": 0.05, "unit": "s"},
    {"id": "repeats", "type": "number", "role": "motion", "label": "Rolls", "description": "How many times the roll plays.", "default": 2, "min": 1, "max": 6, "step": 1},
    {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first roll.", "default": 0.3, "min": 0, "max": 5, "step": 0.1, "unit": "s"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 110, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Roll</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .trl-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .trl-line { white-space: pre; line-height: 1.15; letter-spacing: -0.02em; text-align: center; }
        .trl-letter { position: relative; display: inline-block; }
        .trl-a, .trl-b { position: absolute; left: 0; top: 0; display: inline-block; backface-visibility: hidden; }
        .trl-ghost { visibility: hidden; }
      </style>

      <div id="root" data-composition-id="text-roll" data-duration="5" data-fps="30">
        <div id="trl-clip" class="trl-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div id="trl-line" class="trl-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "5");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("trl-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-roll"] = tl;
            }


            var line = document.getElementById("trl-line");
            var text = str(vars.text, "Roll the text");
            var dur = num(vars.duration, 0.5, 0.1, 2), stg = num(vars.stagger, 0.1, 0.02, 0.5), off = num(vars.exit_offset, 0.2, 0, 1);
            var reps = Math.round(num(vars.repeats, 2, 1, 6)), start = num(vars.start, 0.3, 0, 5);
            var size = num(vars.font_size, 110, 12, 240);
            line.style.fontSize = size + "px";
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "700");
            line.setAttribute("aria-label", text);
            var A = [], Bs = [];
            Array.from(text).forEach(function (ch) {
              var g = ch === " " ? " " : ch;
              var w = document.createElement("span"); w.className = "trl-letter";
              var a = document.createElement("span"); a.className = "trl-a"; a.textContent = g; a.style.transformOrigin = "50% 25%";
              var b = document.createElement("span"); b.className = "trl-b"; b.textContent = g; b.style.transformOrigin = "50% 100%";
              var gh = document.createElement("span"); gh.className = "trl-ghost"; gh.textContent = g;
              w.appendChild(a); w.appendChild(b); w.appendChild(gh); line.appendChild(w); A.push(a); Bs.push(b);
            });
            var maxW = root.clientWidth * 0.92;
            if (line.scrollWidth > maxW) line.style.fontSize = (size * maxW / line.scrollWidth) + "px";
            gsap.set(A.concat(Bs), { transformPerspective: 10000 });
            // Motion easeIn.
            var EIN = CustomEase.create("trl-ein", "M0,0 C0.42,0 1,1 1,1");
            var n = A.length, run = (n - 1) * stg + off + dur, gap = 0.4;
            var tl = gsap.timeline({ paused: true });
            for (var r = 0; r < reps; r++) {
              var t0 = start + r * (run + gap);
              if (t0 > total) break;
              tl.set(A, { rotationX: 0 }, t0); tl.set(Bs, { rotationX: 90 }, t0);
              for (var i = 0; i < n; i++) {
                tl.fromTo(A[i], { rotationX: 0 }, { rotationX: 90, duration: dur, ease: EIN, immediateRender: r === 0 }, t0 + i * stg);
                tl.fromTo(Bs[i], { rotationX: 90 }, { rotationX: 0, duration: dur, ease: EIN, immediateRender: r === 0 }, t0 + i * stg + off);
              }
            }
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
