<!doctype html>
<!--
  Parallax Depth

  A layered landscape trucks sideways with a gentle push-in, near layers sliding faster than far ones. Built-in sun and hills preview on their own; a host adds its own full-frame layers by pushing an element and a depth (1 is nearest, larger moves less) onto LAYERS in the script.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/parallax-depth/index.tsx

<html
  lang="en"
  data-composition-id="parallax-depth"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "distance", "type": "number", "role": "motion", "label": "Distance", "description": "Sideways camera travel at depth 1, as a fraction of the frame width.", "default": 0.5, "min": 0, "max": 1.5, "step": 0.01},
    {"id": "push", "type": "number", "role": "motion", "label": "Push-in", "description": "Push-in toward the scene, in depth units.", "default": 0.16, "min": 0, "max": 0.6, "step": 0.01},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Truck direction: right or left.", "default": "1", "options": [{"value": "1", "label": "Right"}, {"value": "-1", "label": "Left"}]},
    {"id": "sky_color", "type": "color", "role": "style", "label": "Sky", "description": "Sky color.", "default": "#111111"},
    {"id": "sun_color", "type": "color", "role": "style", "label": "Sun", "description": "Sun color.", "default": "#E5322D"},
    {"id": "far_color", "type": "color", "role": "style", "label": "Far hills", "description": "Farthest hill layer.", "default": "#2C2C2C"},
    {"id": "mid_color", "type": "color", "role": "style", "label": "Mid hills", "description": "Middle hill layer.", "default": "#555555"},
    {"id": "near_color", "type": "color", "role": "style", "label": "Near hills", "description": "Nearest hill layer.", "default": "#8E8E8E"},
    {"id": "seed", "type": "number", "role": "motion", "label": "Seed", "description": "Seed for the hill outlines.", "default": 3, "min": 1, "max": 99, "step": 1},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Parallax Depth</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--sky); }
        .pd-stage { position: absolute; inset: 0; overflow: hidden; }
        .pd-layer { position: absolute; inset: 0; transform-origin: 50% 55%; }
        .pd-layer svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      </style>

      <div id="root" data-composition-id="parallax-depth" data-duration="3" data-fps="30">
        <div id="pd-clip" class="pd-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <!-- Layers are built in the script. A host adds its own by pushing { el, depth } onto LAYERS. -->
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "parallax-depth";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var stage = document.getElementById("pd-clip");
var distance = num(vars.distance, 0.5, 0, 1.5), push = num(vars.push, 0.16, 0, 0.6), direction = String(vars.direction) === "-1" ? -1 : 1, seed = Math.round(num(vars.seed, 3, 1, 99)), speed = num(vars.speed, 1, 0, 4);
var C = { sky: col(vars.sky_color, "#111111"), sun: col(vars.sun_color, "#E5322D"), far: col(vars.far_color, "#2C2C2C"), mid: col(vars.mid_color, "#555555"), near: col(vars.near_color, "#8E8E8E") };
root.style.setProperty("--sky", C.sky);
var W = root.clientWidth, H = root.clientHeight;
function hillPath(base, amp, waves, sd) {
  var oct = [0, 1, 2].map(function (o) { return { f: (waves * (o + 1) * (0.8 + rnd(sd + "-f" + o) * 0.4)) / W, a: amp / (o * 1.7 + 1), p: rnd(sd + "-p" + o) * Math.PI * 2 }; });
  var steps = 120, x0 = -W, x1 = W * 2, d = "M " + x0 + " " + H * 2;
  for (var i = 0; i <= steps; i++) {
    var x = x0 + ((x1 - x0) * i) / steps, y = base;
    oct.forEach(function (o) { y -= o.a * (0.5 + 0.5 * Math.sin(x * o.f * 6.283 + o.p)); });
    d += " L " + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d + " L " + x1 + " " + H * 2 + " Z";
}
var LAYERS = [];
function addLayer(depth, fill) {
  var el = document.createElement("div"); el.className = "pd-layer";
  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H }, el);
  stage.appendChild(el);
  LAYERS.push({ el: el, depth: depth });
  return svg;
}
svgEl("circle", { cx: W * 0.6, cy: H * 0.4, r: H * 0.17, fill: C.sun }, addLayer(9));
svgEl("path", { d: hillPath(H * 0.6, H * 0.24, 2.2, seed + "-far"), fill: C.far }, addLayer(6));
svgEl("path", { d: hillPath(H * 0.76, H * 0.16, 1.2, seed + "-mid"), fill: C.mid }, addLayer(2.6));
svgEl("path", { d: hillPath(H * 0.92, H * 0.14, 0.9, seed + "-near"), fill: C.near }, addLayer(1.2));
var DURATION = 60, moveEase = bez(0.45, 0, 0.2, 1);
function draw(frame) {
  var t = frame * speed;
  var move = interp(t, [0, DURATION], [0, 1], moveEase);
  var camX = (move - 0.5) * distance * W * direction, camZ = move * push;
  LAYERS.slice().sort(function (a, b) { return b.depth - a.depth; }).forEach(function (l, i) {
    var depth = Math.max(0.2, l.depth);
    var scale = depth / Math.max(0.05, depth - camZ);
    var x = (-camX * scale) / depth;
    l.el.style.zIndex = i;
    l.el.style.transform = "translateX(" + x + "px) scale(" + scale + ")";
  });
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
