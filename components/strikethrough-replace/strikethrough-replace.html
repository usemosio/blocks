<!doctype html>
<!--
  Strikethrough Replace

  Draws a strike line through the old text, then fades the new text in beneath it for an editorial correction.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/strikethrough-replace/index.tsx

<html
  lang="en"
  data-composition-id="strikethrough-replace"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "from_text", "type": "string", "role": "content", "label": "From text", "description": "Old text that gets struck out.", "default": "$49/mo"},
    {"id": "to_text", "type": "string", "role": "content", "label": "To text", "description": "New text that replaces it.", "default": "Free"},
    {"id": "line_color", "type": "color", "role": "style", "label": "Line color", "description": "Color of the strike line.", "default": "#ff5e3a"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 96, "min": 12, "max": 220, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Strikethrough Replace</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, -apple-system, BlinkMacSystemFont, sans-serif);
        }
        .str-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .str-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .str-text { letter-spacing: -0.03em; white-space: nowrap; line-height: 1.2; }
        .str-from { position: absolute; }
        .str-line { position: absolute; left: 0; top: 50%; width: 0; background: var(--line-color, #ff5e3a); border-radius: 2px; transform: translateY(-50%); }
      </style>

      <div id="root" data-composition-id="strikethrough-replace" data-duration="4" data-fps="30">
        <div id="str-clip" class="str-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="str-wrap">
            <span id="str-from" class="str-text str-from" role="img"></span>
            <span id="str-to" class="str-text" role="img"></span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            // Easing.bezier(x1, y1, x2, y2) as a function of t (Newton, then bisection).
            function bez(x1, y1, x2, y2) {
              function cx(s) { return 3 * x1 * s * (1 - s) * (1 - s) + 3 * x2 * s * s * (1 - s) + s * s * s; }
              function cy(s) { return 3 * y1 * s * (1 - s) * (1 - s) + 3 * y2 * s * s * (1 - s) + s * s * s; }
              return function (t) {
                if (t <= 0) return 0;
                if (t >= 1) return 1;
                var lo = 0, hi = 1, s = t;
                for (var i = 0; i < 40; i++) {
                  var x = cx(s);
                  if (Math.abs(x - t) < 1e-6) break;
                  if (x < t) lo = s; else hi = s;
                  s = (lo + hi) / 2;
                }
                return cy(s);
              };
            }
            // interpolate(f, [a, b], [from, to]) with both ends clamped, like Remotion's extrapolate "clamp".
            function interp(f, a, b, from, to, ease) {
              var t = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(t) : t);
            }
            // Fit one line to 90 % of the frame width: shrinks the font size when it overflows.
            function fit(root, line, size) {
              line.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * 0.9);
              if (line.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / line.scrollWidth));
                line.style.fontSize = size + "px";
              }
              return size;
            }
            // Drives draw(frame) from the paused timeline: frame = time * 30 * speed (Remotion's useCurrentFrame() * speed).
            function drive(tl, total, speed, draw) {
              var clock = { t: 0 };
              tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t * 30 * speed); } }, 0);
              draw(0);
            }

            var total = parseFloat(root.dataset.duration || "4");
            var fromText = str(vars.from_text, "$49/mo");
            var toText = str(vars.to_text, "Free");
            var speed = num(vars.speed, 1, 0.25, 4);
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "700");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            if (typeof vars.line_color === "string" && vars.line_color) root.style.setProperty("--line-color", vars.line_color);
            var fromEl = document.getElementById("str-from");
            var toEl = document.getElementById("str-to");
            [fromEl, toEl].forEach(function (el) { el.style.fontWeight = weight; });
            fromEl.textContent = fromText;
            toEl.textContent = toText;
            fromEl.setAttribute("aria-label", fromText);
            toEl.setAttribute("aria-label", toText);
            var strike = document.createElement("span");
            strike.id = "str-strike";
            strike.className = "str-line";
            strike.setAttribute("aria-hidden", "true");
            fromEl.appendChild(strike);

            // Both strings share one size: shrink so the wider fits 90 % of the frame width.
            var size = num(vars.font_size, 96, 12, 220);
            fromEl.style.fontSize = toEl.style.fontSize = size + "px";
            var widest = Math.max(fromEl.scrollWidth, toEl.scrollWidth);
            var maxWidth = Math.max(1, root.clientWidth * 0.9);
            if (widest > maxWidth) {
              size = Math.max(12, size * (maxWidth / widest));
              fromEl.style.fontSize = toEl.style.fontSize = size + "px";
            }
            strike.style.height = Math.max(2, Math.round(size * 0.08)) + "px";

            // remocn phases of the whole clip: 0-40 % draw the strike, 40-60 % cross-fade, then hold.
            var frames = total * 30;
            function draw(frame) {
              strike.style.width = interp(frame, 0, frames * 0.4, 0, 100) + "%";
              fromEl.style.opacity = interp(frame, frames * 0.4, frames * 0.6, 1, 0);
              toEl.style.opacity = interp(frame, frames * 0.4, frames * 0.6, 0, 1);
              toEl.style.transform = "translateY(" + interp(frame, frames * 0.4, frames * 0.6, 8, 0) + "px)";
            }
            var tl = gsap.timeline({ paused: true });
            drive(tl, total, speed, draw);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["strikethrough-replace"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
