<!doctype html>
<!--
  Spoiler Text

  A phrase inside a sentence is hidden under a shimmering field of drifting specks, like a chat-app spoiler; at the reveal a wave blows the specks away while the words come into focus.

<html
  lang="en"
  data-composition-id="spoiler-text"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "before", "type": "string", "role": "content", "label": "Text before", "description": "Visible text before the hidden phrase.", "default": "Same. When it turned out"},
    {"id": "spoiler", "type": "string", "role": "content", "label": "Hidden phrase", "description": "The phrase hidden under the specks until the reveal.", "default": "the lighthouse keeper had been writing the letters all along"},
    {"id": "after", "type": "string", "role": "content", "label": "Text after", "description": "Visible text after the hidden phrase.", "default": "I had to pause it for a minute."},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 56, "min": 16, "max": 160, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of the text.", "default": "#3f3f46"},
    {"id": "speck_color", "type": "color", "role": "style", "label": "Speck color", "description": "Color of the specks and the soft patch behind them.", "default": "#18181b"},
    {"id": "reveal_at", "type": "number", "role": "motion", "label": "Reveal at", "description": "Second the specks are blown away.", "default": 2.4, "min": 0.2, "max": 10, "step": 0.1, "unit": "s"},
    {"id": "reveal_from", "type": "enum", "role": "motion", "label": "Reveal from", "description": "Where the wave starts.", "default": "left", "options": [{"value": "left", "label": "Start of the phrase"}, {"value": "center", "label": "Middle of the phrase"}]},
    {"id": "seed", "type": "number", "role": "motion", "label": "Seed", "description": "Same seed scatters the same specks every time.", "default": 7, "min": 1, "max": 9999, "step": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Spoiler Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=block" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; }
        #root { color: var(--sp-color, #3f3f46); font-family: var(--font-display, Geist, system-ui, sans-serif); }
        .sp-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .sp-text { width: 82%; line-height: 1.5; font-weight: 500; text-wrap: pretty; }
        .sp-spoiler { position: relative; border-radius: 0.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: var(--sp-patch, rgba(24,24,27,0.06)); }
        .sp-phrase { display: inline; opacity: 0; filter: blur(6px); }
        .sp-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="spoiler-text" data-duration="5" data-fps="30">
        <div id="sp-clip" class="sp-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <p id="sp-text" class="sp-text"><span id="sp-before"></span> <span id="sp-spoiler" class="sp-spoiler"><span id="sp-phrase" class="sp-phrase"></span></span> <span id="sp-after"></span></p>
        </div>
        <canvas id="sp-canvas" class="sp-canvas"></canvas>


        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, a, b) { var x = Number(v); return Number.isFinite(x) ? Math.min(b, Math.max(a, x)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }


            var textEl = document.getElementById("sp-text");
            var spoiler = document.getElementById("sp-spoiler");
            var phrase = document.getElementById("sp-phrase");
            var canvas = document.getElementById("sp-canvas");
            document.getElementById("sp-before").textContent = str(vars.before, "Same. When it turned out");
            phrase.textContent = str(vars.spoiler, "the lighthouse keeper had been writing the letters all along");
            document.getElementById("sp-after").textContent = str(vars.after, "I had to pause it for a minute.");
            var size = num(vars.font_size, 56, 16, 160);
            var revealAt = num(vars.reveal_at, 2.4, 0.2, 10);
            var fromCenter = String(vars.reveal_from) === "center";
            var seed = num(vars.seed, 7, 1, 9999);
            var speckColor = col(vars.speck_color, "#18181b");
            root.style.setProperty("--sp-color", col(vars.color, "#3f3f46"));
            textEl.style.fontSize = size + "px";

            var W = root.clientWidth, H = root.clientHeight;
            canvas.width = W; canvas.height = H;
            var ctx = canvas.getContext("2d");

            // Measure each line of the hidden phrase, in root pixels.
            var rootBox = root.getBoundingClientRect();
            var k = W / (rootBox.width || W);
            var boxes = Array.prototype.map.call(spoiler.getClientRects(), function (r) {
              return { l: (r.left - rootBox.left) * k, t: (r.top - rootBox.top) * k, r: (r.right - rootBox.left) * k, b: (r.bottom - rootBox.top) * k };
            });
            var first = boxes[0];
            var origin = fromCenter
              ? { x: boxes.reduce(function (s, b) { return s + (b.l + b.r) / 2; }, 0) / boxes.length, y: boxes.reduce(function (s, b) { return s + (b.t + b.b) / 2; }, 0) / boxes.length }
              : { x: first.l + 4, y: (first.t + first.b) / 2 };
            var bounds = boxes.reduce(function (a, b) { return { l: Math.min(a.l, b.l), t: Math.min(a.t, b.t), r: Math.max(a.r, b.r), b: Math.max(a.b, b.b) }; }, { l: 1e9, t: 1e9, r: -1e9, b: -1e9 });
            var maxDist = Math.max(
              Math.hypot(origin.x - bounds.l, origin.y - bounds.t), Math.hypot(origin.x - bounds.r, origin.y - bounds.t),
              Math.hypot(origin.x - bounds.l, origin.y - bounds.b), Math.hypot(origin.x - bounds.r, origin.y - bounds.b));

            // Specks: seeded, so the same seed always scatters the same field.
            var rnd = mulberry32(seed);
            var dot = Math.max(1.5, size / 22);
            var DRIFT = size * 0.5, THROW = size * 1.6, WAVE = 0.52, FADE = 0.36;
            var specks = [];
            var area = boxes.reduce(function (s, b) { return s + (b.r - b.l) * (b.b - b.t); }, 0);
            var scale = Math.min(1, 7000 / Math.max(1, area / (dot * dot * 3)));
            boxes.forEach(function (b, bi) {
              var w = b.r - b.l, h = b.b - b.t;
              var n = Math.round((w * h / (dot * dot * 3)) * scale);
              for (var i = 0; i < n; i++) {
                var ang = rnd() * Math.PI * 2, sp = DRIFT * (0.3 + rnd() * 0.7);
                var s = { x: b.l + rnd() * w, y: b.t + rnd() * h, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, ph: rnd(), rate: 0.35 + rnd() * 0.9, size: rnd() < 0.18 ? dot * 1.5 : dot, box: b, push: THROW * (0.5 + rnd()) };
                var d = Math.hypot(s.x - origin.x, s.y - origin.y);
                // The wave radius is maxDist * easeOut(u), easeOut(u) = 1 - (1-u)^3, so a speck at distance d is hit at u = 1 - (1 - d/maxDist)^(1/3).
                var q = Math.min(1, d / maxDist);
                s.hit = revealAt + WAVE * (1 - Math.pow(1 - q, 1 / 3));
                specks.push(s);
              }
            });
            // A speck bounces around inside its own line until the wave reaches it.
            function bounce(v, lo, hi) {
              var span = hi - lo; if (span <= 0) return lo;
              var m = (v - lo) % (2 * span); if (m < 0) m += 2 * span;
              return lo + (m > span ? 2 * span - m : m);
            }
            function paint(t) {
              ctx.clearRect(0, 0, W, H);
              ctx.fillStyle = speckColor;
              for (var i = 0; i < specks.length; i++) {
                var s = specks[i];
                var tt = Math.min(t, s.hit);
                var x = bounce(s.x + s.vx * tt, s.box.l, s.box.r), y = bounce(s.y + s.vy * tt, s.box.t, s.box.b);
                var fade = 1;
                if (t > s.hit) {
                  var dt = t - s.hit;
                  fade = 1 - dt / FADE;
                  if (fade <= 0) continue;
                  var dx = x - origin.x, dy = y - origin.y, len = Math.hypot(dx, dy) || 1;
                  x += s.vx * dt + (dx / len) * s.push * dt;
                  y += s.vy * dt + (dy / len) * s.push * dt;
                }
                var f = (s.ph + s.rate * tt) % 1;
                var tw = 0.35 + 0.65 * Math.abs(Math.sin(f * Math.PI));
                ctx.globalAlpha = tw * fade * 0.9;
                ctx.fillRect(x, y, s.size, s.size);
              }
              ctx.globalAlpha = 1;
            }

            gsap.registerPlugin(CustomEase);
            var easeOut = CustomEase.create("sp-out", "M0,0 C0.23,1 0.32,1 1,1");
            var tl = gsap.timeline({ paused: true });
            // The words come into focus and the soft patch clears at the reveal (0.45 s).
            tl.to(phrase, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: easeOut }, revealAt);
            tl.to(spoiler, { "--sp-patch": "rgba(24,24,27,0)", duration: 0.45, ease: easeOut }, revealAt);
            var dur = parseFloat(root.dataset.duration || "5");
            var clock = { t: 0 };
            tl.to(clock, { t: dur, duration: dur, ease: "none", onUpdate: function () { paint(clock.t); } }, 0);
            paint(0);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["spoiler-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
