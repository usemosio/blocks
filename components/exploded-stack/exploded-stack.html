<!doctype html>
<!--
  Exploded Stack

  Isometric layer plates sit as one stack, explode apart along the vertical axis with labels drawing in beside each layer, hold, then collapse back so the clip loops. Four layers with their own glyph motifs and an accent colour.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/exploded-stack/exploded-stack.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (on a vertical frame the isometric view is widened and the title, labels and leader lines scale from the shorter side); rewritten from three.js (not loaded) to raw WebGL2 with an orthographic isometric camera: plates are square-cornered boxes with the same stacking, explode and collapse timing, the contact shadow and glyph motifs are drawn the same way, lighting is approximated with a hemisphere and one sun term; the font is Inter from Google Fonts; the canvas is drawn at the `resolution` variable.
-->
<html
  lang="en"
  data-composition-id="exploded-stack"
  data-composition-duration="5"
  data-composition-variables='[{"id": "title", "type": "string", "role": "content", "label": "Title", "default": "How a request moves"},
    {"id": "layer_1", "type": "string", "role": "content", "label": "Top layer", "default": "Interface"},
    {"id": "layer_2", "type": "string", "role": "content", "label": "Layer 2", "default": "API gateway"},
    {"id": "layer_3", "type": "string", "role": "content", "label": "Layer 3", "default": "Services"},
    {"id": "layer_4", "type": "string", "role": "content", "label": "Bottom layer", "default": "Data"},
    {"id": "accent", "type": "color", "role": "style", "label": "Accent", "default": "#0a84ff"},
    {"id": "background", "type": "color", "role": "style", "label": "Backdrop", "default": "#f4f4f5"},
    {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the plates are drawn at, then scaled up. Edges and hairlines need 0.75.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Exploded Stack</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .ges-stage {
          position: absolute;
          inset: 0;
        }
        .ges-canvas {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .ges-title {
          position: absolute;
          left: 11cqmin;
          top: 10cqmin;
          font: 700 5.6cqmin / 1.1 "Inter", system-ui, sans-serif;
          letter-spacing: -0.02em;
          color: #14161c;
        }
        .ges-leaders {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .ges-leaders line { stroke: rgba(27, 30, 39, 0.35); stroke-width: 2; }
        .ges-label {
          position: absolute;
          left: 0;
          top: 0;
          display: flex;
          align-items: center;
          gap: 1.7cqmin;
          font: 500 3.15cqmin / 1 "Inter", system-ui, sans-serif;
          color: #1b1e27;
          white-space: nowrap;
          opacity: 0;
        }
        .ges-index { font-size: 1.85cqmin; font-weight: 700; letter-spacing: 0.08em; }
      </style>

      <div id="root" data-composition-id="exploded-stack" data-duration="5" data-fps="30">
        <div id="ges-clip" class="ges-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <canvas id="ges-canvas" class="ges-canvas"></canvas>
          <svg id="ges-leaders" class="ges-leaders" aria-hidden="true"></svg>
          <div id="ges-title" class="ges-title"></div>
          <div id="ges-labels"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "exploded-stack";
            var DUR = 5;
            var root = document.getElementById("root");
            var canvas = document.getElementById("ges-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#000000").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "title", "type": "string", "role": "content", "label": "Title", "default": "How a request moves"}, {"id": "layer_1", "type": "string", "role": "content", "label": "Top layer", "default": "Interface"}, {"id": "layer_2", "type": "string", "role": "content", "label": "Layer 2", "default": "API gateway"}, {"id": "layer_3", "type": "string", "role": "content", "label": "Layer 3", "default": "Services"}, {"id": "layer_4", "type": "string", "role": "content", "label": "Bottom layer", "default": "Data"}, {"id": "accent", "type": "color", "role": "style", "label": "Accent", "default": "#0a84ff"}, {"id": "background", "type": "color", "role": "style", "label": "Backdrop", "default": "#f4f4f5"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the plates are drawn at, then scaled up. Edges and hairlines need 0.75.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else V[d.id] = typeof raw === "string" ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var cw = Math.max(2, Math.round(W * V.resolution));
            var ch = Math.max(2, Math.round(H * V.resolution));
            root.style.background = V.background;
            canvas.width = cw;
            canvas.height = ch;
            document.getElementById("ges-title").textContent = V.title;
            var names = [V.layer_1, V.layer_2, V.layer_3, V.layer_4];
            var U = Math.min(W, H) / 1080;
            var labelsBox = document.getElementById("ges-labels");
            var leaders = document.getElementById("ges-leaders");
            leaders.setAttribute("viewBox", "0 0 " + W + " " + H);
            var svgNS = "http://www.w3.org/2000/svg";
            var labelEls = [], indexEls = [], lines = [], dots = [];
            names.forEach(function (name, i) {
              var el = document.createElement("div");
              el.className = "ges-label";
              el.innerHTML = '<span class="ges-index">0' + (i + 1) + "</span><span></span>";
              el.lastChild.textContent = name;
              labelsBox.appendChild(el);
              labelEls.push(el); indexEls.push(el.firstChild);
              var line = document.createElementNS(svgNS, "line");
              var dot = document.createElementNS(svgNS, "circle");
              dot.setAttribute("r", String(6 * U));
              leaders.appendChild(line); leaders.appendChild(dot);
              lines.push(line); dots.push(dot);
            });
            var ACCENT = rgb(V.accent);
            // Isometric orthographic camera: 45 degrees round Y, looking down at arctan(1/sqrt 2); slid along
            // its right axis so the stack sits left and the labels get the right.
            var ASPECT = cw / ch;
            var HALF_W = ASPECT >= 16 / 9 ? 5.9 * ASPECT : (ASPECT >= 1 ? 5.9 * 16 / 9 : 6.6);
            var HALF_H = ASPECT >= 16 / 9 ? 5.9 : HALF_W / ASPECT;
            var EYE = [10 + 1.9, 10.7, 10 - 1.9];
            var FWD = [-1 / Math.sqrt(3), -1 / Math.sqrt(3), -1 / Math.sqrt(3)];
            function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
            function norm(v) { var l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }
            var RIGHT = norm(cross(FWD, [0, 1, 0])), UP = cross(RIGHT, FWD);
            function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
            var N0 = 0.1, F0 = 100;
            // view-projection (orthographic), column-major
            var VP = new Float32Array([
              RIGHT[0] / HALF_W, UP[0] / HALF_H, -FWD[0] * 2 / (F0 - N0) * -1 * -1, 0,
              RIGHT[1] / HALF_W, UP[1] / HALF_H, 0, 0,
              RIGHT[2] / HALF_W, UP[2] / HALF_H, 0, 0,
              -dot3(RIGHT, EYE) / HALF_W, -dot3(UP, EYE) / HALF_H, 0, 1
            ]);
            // depth: z_clip = (2 * (dot(FWD, p - EYE) - N0) / (F0 - N0)) - 1, so nearer is smaller
            var DK = 2 / (F0 - N0);
            VP[2] = FWD[0] * DK; VP[6] = FWD[1] * DK; VP[10] = FWD[2] * DK; VP[14] = -dot3(FWD, EYE) * DK - (2 * N0 / (F0 - N0)) - 1;
            function toScreen(p) {
              var x = (dot3(RIGHT, p) - dot3(RIGHT, EYE)) / HALF_W, y = (dot3(UP, p) - dot3(UP, EYE)) / HALF_H;
              return [(x * 0.5 + 0.5) * W, (-y * 0.5 + 0.5) * H];
            }
            // Plate textures: a white face with a hairline, and a glyph motif per layer (white on transparent).
            function tex2d(draw) { var c = document.createElement("canvas"); c.width = c.height = 512; draw(c.getContext("2d")); return c; }
            var faceCanvas = tex2d(function (g) { g.fillStyle = "#ffffff"; g.fillRect(0, 0, 512, 512); g.strokeStyle = "#d6d8dd"; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 509, 509); });
            var glyphCanvases = [0, 1, 2, 3].map(function (i) {
              return tex2d(function (g) {
                g.strokeStyle = g.fillStyle = "#ffffff"; g.lineWidth = 6;
                var k, x, y;
                if (i === 0) { for (k = 0; k < 3; k++) g.strokeRect(70 + k * 130, 150, 110, 212); }
                else if (i === 1) { for (k = 0; k < 5; k++) { g.beginPath(); g.moveTo(80, 110 + k * 72); g.lineTo(432, 110 + k * 72); g.stroke(); } }
                else if (i === 2) { for (y = 0; y < 3; y++) for (x = 0; x < 3; x++) g.fillRect(96 + x * 120, 96 + y * 120, 80, 80); }
                else { for (k = 0; k < 3; k++) { g.beginPath(); g.ellipse(256, 150 + k * 100, 150, 40, 0, 0, Math.PI * 2); g.stroke(); } }
              });
            });
            var LAYERS = 4, THICK = 0.22, GAP = 1.55, BASE = 5;
            var OPEN_AT = 0.3, OPEN_FOR = 0.9, OPEN_STAGGER = 0.06, LAND_AT = 1.25, LAND_EVERY = 0.7, DRAW = 0.3, FULL = 0.4, SETTLE = 0.3;
            var CLOSE_AT = LAND_AT + (LAYERS - 1) * LAND_EVERY + 0.7, CLOSE_FOR = 0.6, CLOSE_STAGGER = 0.05, LIFT = 0.08;
            function clamp01(x) { return Math.min(1, Math.max(0, x)); }
            function ease(x) { var v = clamp01(x); return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; }
            function easeOut(x) { return 1 - Math.pow(1 - clamp01(x), 3); }
            function easeOpen(x) { return easeOut(Math.pow(clamp01(x), 1.4)); }
            function focus(T, i) { var land = LAND_AT + i * LAND_EVERY; return easeOut((T - land + DRAW) / DRAW) * (1 - ease((T - land - FULL) / SETTLE)); }
            var GLYPH_REST = [0xc9 / 255, 0xcc / 255, 0xd3 / 255], INK_REST = [0x8b / 255, 0x90 / 255, 0x9a / 255];
            function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
            function css(c) { return "rgb(" + c.map(function (v) { return Math.round(v * 255); }).join(",") + ")"; }

            var VERTEX = `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aNormal;
in vec2 aUv;
in float aKind;
uniform mat4 uVP;
uniform float uY;
out vec2 vUv;
out vec3 vN;
out float vKind;
void main() {
  vUv = aUv;
  vN = aNormal;
  vKind = aKind;
  gl_Position = uVP * vec4(aPos + vec3(0.0, uY, 0.0), 1.0);
}`;
            var FRAGMENT = `#version 300 es
precision highp float;
out vec4 outColor;
in vec2 vUv;
in vec3 vN;
in float vKind;
uniform sampler2D uFace;
uniform sampler2D uGlyph;
uniform vec3 uGlyphCol;
void main() {
  if (vKind > 1.5) {
    // soft contact shadow under the stack: premultiplied
    float d = length(vUv - 0.5) * 2.0;
    float a = 0.22 * (1.0 - smoothstep(0.3125, 1.0, d));
    outColor = vec4(vec3(20.0, 24.0, 40.0) / 255.0 * a, a);
    return;
  }
  vec3 n = normalize(vN);
  float sky = n.y * 0.5 + 0.5;
  vec3 hemi = mix(vec3(0.839, 0.851, 0.894), vec3(1.0), sky);
  float sun = max(dot(n, normalize(vec3(-4.0, 10.0, 6.0))), 0.0);
  float light = 0.78 + 0.0;
  vec3 base = vec3(1.0);
  if (vKind < 0.5) {
    base = texture(uFace, vUv).rgb;
    vec4 g = texture(uGlyph, vUv);
    base = mix(base, uGlyphCol, g.a);
  }
  outColor = vec4(base * (hemi * light + sun * 0.3), 1.0);
}
`;

            var gl = canvas.getContext("webgl2", { alpha: true, antialias: true, depth: true, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var prog = gl.createProgram();
              gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(prog);
              if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link failed");
              gl.useProgram(prog);
              function boxVerts() {
                var x = 2.1, y = THICK / 2, z = 2.1, v = [], faces = [
                  [[-x, y, z], [x, y, z], [x, y, -z], [-x, y, -z], [0, 1, 0], 0],
                  [[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [0, -1, 0], 1],
                  [[-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1], 1],
                  [[x, -y, -z], [-x, -y, -z], [-x, y, -z], [x, y, -z], [0, 0, -1], 1],
                  [[x, -y, z], [x, -y, -z], [x, y, -z], [x, y, z], [1, 0, 0], 1],
                  [[-x, -y, -z], [-x, -y, z], [-x, y, z], [-x, y, -z], [-1, 0, 0], 1]
                ];
                var uvs = [[0, 1], [1, 1], [1, 0], [0, 0]], idx = [0, 1, 2, 0, 2, 3];
                faces.forEach(function (f) { idx.forEach(function (i) { v.push(f[i][0], f[i][1], f[i][2], f[4][0], f[4][1], f[4][2], uvs[i][0], uvs[i][1], f[5]); }); });
                // the contact shadow: a 7 x 7 plane under the stack
                var s = 3.5, sy = -2.4;
                [[-s, sy, s, 0, 0], [s, sy, s, 1, 0], [s, sy, -s, 1, 1], [-s, sy, s, 0, 0], [s, sy, -s, 1, 1], [-s, sy, -s, 0, 1]].forEach(function (p) { v.push(p[0], p[1], p[2], 0, 1, 0, p[3], p[4], 2); });
                return new Float32Array(v);
              }
              var buf = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buf);
              gl.bufferData(gl.ARRAY_BUFFER, boxVerts(), gl.STATIC_DRAW);
              [["aPos", 3, 0], ["aNormal", 3, 12], ["aUv", 2, 24], ["aKind", 1, 32]].forEach(function (s) {
                var loc = gl.getAttribLocation(prog, s[0]);
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, s[1], gl.FLOAT, false, 36, s[2]);
              });
              gl.viewport(0, 0, cw, ch);
              gl.enable(gl.DEPTH_TEST);
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
              function u(name) { return gl.getUniformLocation(prog, name); }
              function makeTex(unit, source) {
                var t = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, t);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
                return t;
              }
              makeTex(0, faceCanvas);
              var glyphTex = glyphCanvases.map(function (c) { return makeTex(1, c); });
              gl.uniform1i(u("uFace"), 0);
              gl.uniform1i(u("uGlyph"), 1);
              gl.uniformMatrix4fv(u("uVP"), false, VP);
              var yLoc = u("uY"), glyphColLoc = u("uGlyphCol");
              paint = function (t) {

                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                var T = (t / DUR) * BASE, i;
                // shadow first, then the plates (bottom to top)
                gl.uniform1f(yLoc, 0);
                gl.depthMask(false);
                gl.drawArrays(gl.TRIANGLES, 36, 6);
                gl.depthMask(true);
                for (i = 0; i < LAYERS; i++) {
                  var order = LAYERS - 1 - i;
                  var open = easeOpen((T - OPEN_AT - i * OPEN_STAGGER) / OPEN_FOR) - ease((T - CLOSE_AT - 0.05 - order * CLOSE_STAGGER) / CLOSE_FOR);
                  var w = focus(T, i);
                  var y = order * (THICK + 0.02 + open * GAP) - 2.2 + LIFT * w;
                  var gc = lerp3(GLYPH_REST, ACCENT, w);
                  gl.uniform1f(yLoc, y);
                  gl.uniform3f(glyphColLoc, gc[0], gc[1], gc[2]);
                  gl.activeTexture(gl.TEXTURE1);
                  gl.bindTexture(gl.TEXTURE_2D, glyphTex[i]);
                  gl.drawArrays(gl.TRIANGLES, 0, 36);
                  var ink = css(lerp3(INK_REST, ACCENT, w));
                  indexEls[i].style.color = ink;
                  dots[i].style.fill = ink;
                  var shown = easeOut((T - LAND_AT - i * LAND_EVERY + DRAW) / DRAW) * (1 - clamp01((T - CLOSE_AT) / 0.2));
                  // the plate's right-hand corner, where a label has open space beside it
                  var a = toScreen([2.1, y, -2.1]);
                  labelEls[i].style.opacity = shown.toFixed(3);
                  labelEls[i].style.transform = "translate(" + Math.round(a[0] + 90 * U + 24 * U + (1 - shown) * 16 * U) + "px, " + Math.round(a[1] - 1.5 * 15 * U) + "px)";
                  lines[i].setAttribute("x1", a[0].toFixed(1)); lines[i].setAttribute("y1", a[1].toFixed(1));
                  lines[i].setAttribute("x2", (a[0] + 90 * U * shown).toFixed(1)); lines[i].setAttribute("y2", a[1].toFixed(1));
                  lines[i].style.opacity = shown > 0 ? 1 : 0;
                  dots[i].setAttribute("cx", a[0].toFixed(1)); dots[i].setAttribute("cy", a[1].toFixed(1));
                  dots[i].style.opacity = shown.toFixed(3);
                }
              };
            } catch (err) {
              canvas.style.display = "none";
              if (window.console) console.warn(NAME + ":", err.message);
            }

            var tl = gsap.timeline({ paused: true, onUpdate: function () { if (paint) paint(tl.time()); } });

            // The block lasts DUR seconds even when nothing is tweened at the end.
            tl.set({}, {}, DUR);
            if (paint) paint(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
