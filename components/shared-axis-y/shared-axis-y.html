<!doctype html>
<!--
  Shared Axis Y

  Per-word hard-cut staircase: the outgoing phrase snaps off word by word, then the incoming
  phrase snaps on word by word. No fade, no motion: a sharp editorial swap.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/shared-axis-y/index.tsx

<html
  lang="en"
  data-composition-id="shared-axis-y"
  data-composition-duration="3"
  data-composition-variables='[
    { "id": "from_text", "type": "string", "role": "content", "label": "From text", "description": "Outgoing phrase, shown first, then cut off word by word.", "default": "Layered navigation." },
    { "id": "to_text", "type": "string", "role": "content", "label": "To text", "description": "Incoming phrase that snaps in word by word.", "default": "Hierarchy made clear." },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 220, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{ "value": "400", "label": "Regular" }, { "value": "500", "label": "Medium" }, { "value": "600", "label": "Semibold" }, { "value": "700", "label": "Bold" }] },
    { "id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shared Axis Y</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, -apple-system, BlinkMacSystemFont, sans-serif);
          pointer-events: none;
        }
        .say-stage { position: absolute; inset: 0; }
        .say-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .say-line { letter-spacing: -0.03em; white-space: nowrap; line-height: 1.2; }
        .say-word { display: inline-block; margin-right: 0.25em; }
      </style>

      <div id="root" data-composition-id="shared-axis-y" data-duration="3" data-fps="30">
        <div id="say-clip" class="say-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div class="say-layer"><span id="say-from" class="say-line"></span></div>
          <div class="say-layer"><span id="say-to" class="say-line"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // interpolate(frame, [a, b], [from, to]) with clamping and Remotion's Easing.step1:
            // the value jumps to `to` only once the frame reaches b.
            function step1(f, a, b, from, to) {
              return f >= b ? to : from;
            }

            var fromText = str(vars.from_text, "Layered navigation.");
            var toText = str(vars.to_text, "Hierarchy made clear.");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            var speed = num(vars.speed, 1, 0.25, 4);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);

            function build(line, text, prefix) {
              line.style.fontWeight = weight;
              line.setAttribute("aria-label", text);
              return text.split(" ").map(function (word, i) {
                var s = document.createElement("span");
                s.id = prefix + i;
                s.className = "say-word";
                s.textContent = word;
                line.appendChild(s);
                return s;
              });
            }
            var fromLine = document.getElementById("say-from");
            var toLine = document.getElementById("say-to");
            var fromWords = build(fromLine, fromText, "say-from-");
            var toWords = build(toLine, toText, "say-to-");

            // Both phrases share one size: shrink so the wider fits 90 % of the frame width.
            var size = num(vars.font_size, 72, 12, 220);
            fromLine.style.fontSize = toLine.style.fontSize = size + "px";
            var widest = Math.max(fromLine.scrollWidth, toLine.scrollWidth);
            var maxWidth = Math.max(1, root.clientWidth * 0.9);
            if (widest > maxWidth) {
              size = Math.max(12, size * (maxWidth / widest));
              fromLine.style.fontSize = toLine.style.fontSize = size + "px";
            }

            // remocn timings (frames at 30 fps): each outgoing word cuts 4 frames after its turn,
            // turns 2 frames apart; the incoming phrase starts one frame after the last cut and each
            // word snaps on 5 frames after its turn, 2 frames apart.
            var ENTER = 5, EXIT = 4, ENTER_STAGGER = 2, EXIT_STAGGER = 2, OVERLAP = 0, MICRO_DELAY = 1;
            var exitTotal = EXIT + (fromWords.length - 1) * EXIT_STAGGER;
            var newStart = Math.max(0, exitTotal - OVERLAP + MICRO_DELAY);

            function draw(frame) {
              fromWords.forEach(function (el, i) {
                var local = frame - i * EXIT_STAGGER;
                el.style.opacity = step1(local, 0, EXIT, 1, 0);
              });
              toWords.forEach(function (el, j) {
                var local = frame - newStart - j * ENTER_STAGGER;
                el.style.opacity = step1(local, 0, ENTER, 0, 1);
              });
            }

            var total = parseFloat(root.dataset.duration || "3");
            var clock = { t: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t * 30 * speed); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["shared-axis-y"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
