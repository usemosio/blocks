<!doctype html>
<!--
  News Caption Slam

  Captions-first social news over a plain or gradient backdrop: a kicker, a huge number in a yellow block that
  rolls to its value, a hard cut, then caption words slammed in one by one with the keyword wiped onto a block,
  a source tag and a second rolling number.

  Extracted from the Mosio recipe caption-news by usemosio/blocks.
  The recipe is adapted from the caption-news film style of lemomo-ai/lemo-opuscar
  (https://github.com/lemomo-ai/lemo-opuscar, MIT).

  furnished to do so, subject to the following conditions:

  The above copyright notice and this permission notice shall be included in all
  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
  IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,

  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  Changes by usemosio/blocks: rewritten as a standalone sub-composition without footage; colours, texts and
  numbers are variables; the layout adapts to vertical and horizontal frames.
-->
<html
  lang="en"
  data-composition-id="news-caption-slam"
  data-composition-duration="8"
  data-composition-variables='[
    {"id": "kicker", "type": "string", "role": "content", "label": "Kicker", "description": "Short line before the big number.", "default": "Dalam 3 hari,"},
    {"id": "number", "type": "number", "role": "content", "label": "Big number", "description": "Number in the yellow block; it rolls up to this value.", "default": 3240, "min": 0, "max": 999999999, "step": 1},
    {"id": "unit", "type": "string", "role": "content", "label": "Unit", "description": "Word inside the block after the number.", "default": "porsi"},
    {"id": "subject", "type": "string", "role": "content", "label": "Subject", "description": "Word slammed beside the block.", "default": "terjual"},
    {"id": "subline", "type": "string", "role": "content", "label": "Small line", "description": "Small line under the first scene.", "default": "dari satu dapur rumahan di Malang"},
    {"id": "caption", "type": "string", "role": "content", "label": "Caption", "description": "Caption of the second scene. Its words are slammed in one by one.", "default": "Hampir separuh pembeli balik lagi"},
    {"id": "keyword", "type": "string", "role": "content", "label": "Keyword", "description": "Words of the caption that get the yellow block. Must appear in the caption, otherwise the last word is used.", "default": "separuh"},
    {"id": "caption_sub", "type": "string", "role": "content", "label": "Caption second line", "description": "Small line under the caption.", "default": "Pelanggan lama memesan ulang dalam sebulan"},
    {"id": "stat", "type": "number", "role": "content", "label": "Rolling number", "description": "Second number of the second scene.", "default": 48, "min": 0, "max": 999999999, "step": 1},
    {"id": "stat_suffix", "type": "string", "role": "content", "label": "Rolling number suffix", "description": "Written after the second number.", "default": "%"},
    {"id": "stat_label", "type": "string", "role": "content", "label": "Rolling number label", "description": "Small label under the second number.", "default": "pembeli kembali"},
    {"id": "channel", "type": "string", "role": "content", "label": "Channel", "description": "Name in the channel bug at the top left of the second scene.", "default": "Kabar Dapur"},
    {"id": "channel_tag", "type": "string", "role": "content", "label": "Channel tag", "description": "Small block in front of the channel name.", "default": "BERITA"},
    {"id": "source", "type": "string", "role": "content", "label": "Source", "description": "Source line under the channel bug. Leave empty to hide the tag.", "default": "Catatan penjualan toko, Okt 2026"},
    {"id": "source_label", "type": "string", "role": "content", "label": "Source label", "description": "Small word before the source.", "default": "SUMBER"},
    {"id": "backdrop", "type": "enum", "role": "style", "label": "Backdrop", "description": "Plain colour or a soft gradient.", "default": "gradient", "options": [{"value": "gradient", "label": "Gradient"}, {"value": "plain", "label": "Plain"}]},
    {"id": "bg_color", "type": "color", "role": "style", "label": "Backdrop", "description": "Main backdrop colour.", "default": "#0e0e0c"},
    {"id": "bg2_color", "type": "color", "role": "style", "label": "Backdrop glow", "description": "Second backdrop colour for the gradient and the chart-style panels.", "default": "#1d1c18"},
    {"id": "primary_color", "type": "color", "role": "style", "label": "Block colour", "description": "The yellow block behind the number and the keyword.", "default": "#ffc21a"},
    {"id": "on_primary_color", "type": "color", "role": "style", "label": "Text on block", "description": "Text colour on the block.", "default": "#0e0e0c"},
    {"id": "accent_color", "type": "color", "role": "style", "label": "Accent", "description": "The source tag edge.", "default": "#ff4a3d"},
    {"id": "text_color", "type": "color", "role": "style", "label": "Text", "description": "Caption text.", "default": "#f7f5ef"},
    {"id": "muted_color", "type": "color", "role": "style", "label": "Muted text", "description": "Small labels.", "default": "#a9a69c"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>News Caption Slam</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=block" />
      <style>
        #root {
          --nc-bg: #0e0e0c; --nc-bg2: #1d1c18; --nc-primary: #ffc21a; --nc-on: #0e0e0c; --nc-accent: #ff4a3d; --nc-text: #f7f5ef; --nc-muted: #a9a69c;
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; background: var(--nc-bg); color: var(--nc-text);
          font-family: Inter, system-ui, sans-serif; font-weight: 600;
        }
        #root * { box-sizing: border-box; }
        #nc-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
        .nc-scene { position: absolute; inset: 0; overflow: hidden; }
        .nc-bg { position: absolute; inset: -4%; transform-origin: 40% 70%; }
        .nc-grad .nc-bg { background: radial-gradient(ellipse 90% 75% at 15% 85%, var(--nc-bg2), transparent 75%), radial-gradient(ellipse 60% 60% at 90% 10%, color-mix(in oklab, var(--nc-bg2) 70%, var(--nc-bg)), transparent 70%); }
        .nc-scrim { position: absolute; inset: 0; background: linear-gradient(transparent 50%, color-mix(in oklab, var(--nc-bg) 70%, transparent)); }
        .nc-h { font-weight: 800; white-space: nowrap; }
        .nc-shade { text-shadow: 0 2px 20px color-mix(in oklab, var(--nc-bg) 75%, transparent); }
        .nc-ch { display: inline-block; transform-origin: 50% 65%; }
        .nc-kw { position: relative; display: inline-block; padding: 0 0.12em; }
        .nc-blk { position: absolute; inset: 0; padding: 0 0.12em; background: var(--nc-primary); color: var(--nc-on); text-shadow: none; clip-path: inset(0 100% 0 0); }
        /* Scene one */
        #nc-hcap { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-58%); }
        .nc-kick { margin-left: 8px; font-size: 74px; line-height: 1.1; }
        .nc-row { display: flex; align-items: flex-end; flex-wrap: wrap; margin-top: 18px; }
        .nc-nblk { display: inline-flex; align-items: baseline; height: 280px; padding: 0 44px 0 34px; background: var(--nc-primary); color: var(--nc-on); transform-origin: 30% 60%; }
        .nc-num { font-size: 220px; line-height: 280px; letter-spacing: -0.02em; font-weight: 800; }
        .nc-num i, .nc-num b { display: inline-block; width: 0.61em; text-align: center; font-style: normal; } .nc-num b { width: 0.26em; }
        .nc-unit { margin-left: 16px; font-size: 80px; font-weight: 800; }
        .nc-subj { margin: 0 0 40px 40px; font-size: 104px; line-height: 1; }
        .nc-l2 { margin: 28px 0 0 8px; font-size: 38px; line-height: 1.25; color: var(--nc-text); }
        /* Scene two */
        #nc-bug { position: absolute; left: 70px; top: 90px; height: 62px; display: flex; font-size: 32px; white-space: nowrap; }
        #nc-bug b { padding: 0 14px; line-height: 62px; background: var(--nc-primary); color: var(--nc-on); letter-spacing: 0.04em; font-weight: 800; }
        #nc-bug span { display: flex; align-items: center; padding: 0 16px; background: color-mix(in oklab, var(--nc-bg2) 92%, transparent); font-weight: 800; }
        #nc-src { position: absolute; left: 70px; top: 166px; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; border-left: 4px solid var(--nc-accent);
          background: color-mix(in oklab, var(--nc-bg2) 92%, transparent); font-size: 26px; white-space: nowrap; }
        #nc-src em { font-style: normal; font-size: 20px; letter-spacing: 0.1em; color: var(--nc-muted); font-weight: 800; }
        #nc-stat { position: absolute; left: 70px; right: 70px; top: 420px; text-align: left; }
        #nc-angka { font-size: 300px; line-height: 1; letter-spacing: -0.02em; font-weight: 800; white-space: nowrap; }
        #nc-lbl { margin-top: 10px; font-size: 52px; font-weight: 600; color: var(--nc-muted); }
        #nc-cap { position: absolute; left: 70px; right: 70px; bottom: 330px; }
        .nc-l1 { white-space: normal; font-size: 112px; line-height: 1.08; letter-spacing: -0.015em; }
        #nc-cap .nc-l2 { margin: 24px 0 0 2px; font-size: 40px; color: var(--nc-text); }
        /* Landscape */
        #nc-stage.nc-land #nc-hcap { left: 100px; }
        #nc-stage.nc-land .nc-kick { font-size: 74px; }
        #nc-stage.nc-land .nc-nblk { height: 300px; }
        #nc-stage.nc-land .nc-num { font-size: 238px; line-height: 300px; }
        #nc-stage.nc-land .nc-unit { font-size: 86px; }
        #nc-stage.nc-land #nc-bug { left: 96px; top: 52px; height: 46px; font-size: 24px; }
        #nc-stage.nc-land #nc-bug b { line-height: 46px; }
        #nc-stage.nc-land #nc-src { height: 36px; font-size: 19px; }
        #nc-stage.nc-land #nc-src em { font-size: 15px; }
        #nc-stage.nc-land #nc-src { left: 96px; top: 108px; }
        #nc-stage.nc-land #nc-stat { left: 1000px; right: 90px; top: 280px; text-align: center; }
        #nc-stage.nc-land #nc-angka { font-size: 230px; }
        #nc-stage.nc-land #nc-lbl { font-size: 40px; }
        #nc-stage.nc-land #nc-cap { left: 120px; right: auto; width: 880px; bottom: 150px; }
        #nc-stage.nc-land .nc-l1 { font-size: 88px; }
        #nc-stage.nc-land #nc-cap .nc-l2 { font-size: 33px; }
      </style>

      <div id="root" data-composition-id="news-caption-slam" data-duration="8" data-fps="30">
        <div id="nc-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;inset:0">
          <div id="nc-stage">
            <div class="nc-scene" id="nc-s1">
              <div class="nc-bg" id="nc-bg1"></div><div class="nc-scrim"></div>
              <div id="nc-hcap">
                <div class="nc-h nc-shade nc-kick" id="nc-hk"></div>
                <div class="nc-row">
                  <span class="nc-h nc-nblk" id="nc-hn"><span class="nc-num" id="nc-num"></span><span class="nc-unit" id="nc-unit"></span></span>
                  <span class="nc-h nc-shade nc-subj" id="nc-hs"></span>
                </div>
                <div class="nc-l2" id="nc-hl"></div>
              </div>
            </div>
            <div class="nc-scene" id="nc-s2">
              <div class="nc-bg" id="nc-bg2"></div><div class="nc-scrim"></div>
              <div id="nc-bug"><b id="nc-tag"></b><span id="nc-chan"></span></div>
              <div id="nc-src"><em id="nc-srcl"></em><span id="nc-srct"></span></div>
              <div id="nc-stat"><div id="nc-angka" class="nc-h nc-shade"></div><div id="nc-lbl"></div></div>
              <div id="nc-cap"><div class="nc-l1 nc-h nc-shade" id="nc-l1"></div><div class="nc-l2" id="nc-l2b"></div></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var $ = function (id) { return document.getElementById(id); };
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v.trim() : d; }
            function txt(v, d) { return typeof v === "string" ? v.trim() : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            [["bg_color", "--nc-bg", "#0e0e0c"], ["bg2_color", "--nc-bg2", "#1d1c18"], ["primary_color", "--nc-primary", "#ffc21a"], ["on_primary_color", "--nc-on", "#0e0e0c"], ["accent_color", "--nc-accent", "#ff4a3d"], ["text_color", "--nc-text", "#f7f5ef"], ["muted_color", "--nc-muted", "#a9a69c"]]
              .forEach(function (c) { root.style.setProperty(c[1], colr(vars[c[0]], c[2])); });

            var stage = $("nc-stage"), W = root.clientWidth || 1080, H = root.clientHeight || 1920;
            var land = W > H * 1.05, RW, RH, k;
            if (land) { RH = 1080; RW = Math.round(1080 * W / H); k = H / RH; stage.classList.add("nc-land"); } else { RW = 1080; RH = Math.round(1080 * H / W); k = W / RW; }
            stage.style.width = RW + "px"; stage.style.height = RH + "px"; stage.style.transform = "scale(" + k + ")";
            if (String(vars.backdrop) !== "plain") { $("nc-s1").classList.add("nc-grad"); $("nc-s2").classList.add("nc-grad"); }

            $("nc-hk").textContent = str(vars.kicker, "Dalam 3 hari,");
            $("nc-unit").textContent = str(vars.unit, "porsi");
            $("nc-hs").textContent = str(vars.subject, "terjual");
            $("nc-hl").textContent = str(vars.subline, "dari satu dapur rumahan di Malang");
            $("nc-l2b").textContent = txt(vars.caption_sub, "");
            $("nc-lbl").textContent = str(vars.stat_label, "pembeli kembali");
            $("nc-tag").textContent = str(vars.channel_tag, "BERITA"); $("nc-chan").textContent = str(vars.channel, "Kabar Dapur");
            var source = txt(vars.source, "Catatan penjualan toko, Okt 2026");
            if (source) { $("nc-srct").textContent = source; $("nc-srcl").textContent = str(vars.source_label, "SUMBER"); } else $("nc-src").style.display = "none";

            var NF = function (v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, "."); };
            function setCells(el, v) { el.innerHTML = NF(v).replace(/\d/g, "<i>$&</i>").replace(/\./g, "<b>.</b>"); }
            var big = Math.round(num(vars.number, 3240, 0, 999999999)), stat = Math.round(num(vars.stat, 48, 0, 999999999)), suf = txt(vars.stat_suffix, "%");
            setCells($("nc-num"), 0);
            function setStat(v) { setCells($("nc-angka"), v); $("nc-angka").insertAdjacentHTML("beforeend", '<span class="nc-sfx"></span>'); $("nc-angka").lastChild.textContent = suf; }
            setStat(0);

            // Caption: chunks (the keyword stays whole), the keyword gets a block that wipes in.
            var caption = str(vars.caption, "Hampir separuh pembeli balik lagi"), kw = str(vars.keyword, "separuh");
            var at = caption.indexOf(kw);
            if (at < 0) { var li = caption.lastIndexOf(" "); at = li + 1; kw = caption.slice(li + 1); }
            var l1 = $("nc-l1"), chunks = [], blk = null;
            function addWords(s) { s.split(/\s+/).filter(Boolean).forEach(function (w) { var sp = document.createElement("span"); sp.className = "nc-ch"; sp.textContent = w; l1.appendChild(sp); l1.appendChild(document.createTextNode(" ")); chunks.push(sp); }); }
            addWords(caption.slice(0, at));
            var kwEl = document.createElement("span"); kwEl.className = "nc-ch nc-kw";
            kwEl.innerHTML = '<span></span><span class="nc-blk"></span>'; kwEl.children[0].textContent = kw; kwEl.children[1].textContent = kw; blk = kwEl.children[1];
            l1.appendChild(kwEl); l1.appendChild(document.createTextNode(" ")); chunks.push(kwEl);
            addWords(caption.slice(at + kw.length));
            var kwIndex = chunks.indexOf(kwEl);

            function slam(el, t) { tl.fromTo(el, { scale: 1.3 }, { scale: 1, duration: 0.13, ease: "back.out(1.6)" }, t).fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "none" }, t); }
            function rise(el, t) { tl.fromTo(el, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.18, ease: "power2.out" }, t); }
            function slide(el, t) { tl.fromTo(el, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.2, ease: "power2.out" }, t); }
            function roll(t, v, set, dur) { var o = { v: 0 }; tl.to(o, { v: v, duration: dur, ease: "power3.out", onUpdate: function () { set(Math.round(o.v)); } }, t); }

            var tl = gsap.timeline({ paused: true });
            // Scene one (0 - 3.4): kicker, number block rolling, subject, small line; slow push on the backdrop.
            tl.fromTo("#nc-bg1", { scale: 1 }, { scale: 1.06, duration: 3.4, ease: "none" }, 0);
            slam("#nc-hk", 0.1); slam("#nc-hn", 0.3); roll(0.3, big, function (v) { setCells($("nc-num"), v); }, 0.9);
            slam("#nc-hs", 0.7); rise("#nc-hl", 0.9);
            tl.to("#nc-hcap", { x: -RW, duration: 0.24, ease: "power2.in" }, 3.1).set("#nc-s1", { autoAlpha: 0 }, 3.4);
            // Scene two (3.4 - 8): hard cut, bug and source, caption words slam in, keyword block wipes, the number rolls.
            tl.set("#nc-s2", { autoAlpha: 1 }, 3.4).fromTo("#nc-bg2", { scale: 1 }, { scale: 1.07, duration: 4.6, ease: "none" }, 3.4);
            slide("#nc-bug", 3.55); slide("#nc-src", 3.8);
            var t0 = 4.0;
            chunks.forEach(function (c, i) { slam(c, t0 + i * 0.16); });
            tl.fromTo(blk, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.14, ease: "power2.out" }, t0 + kwIndex * 0.16 + 0.12);
            rise("#nc-l2b", t0 + chunks.length * 0.16 + 0.05);
            var ts = t0 + chunks.length * 0.16 + 0.5;
            slam("#nc-angka", ts); roll(ts, stat, setStat, 0.8); rise("#nc-lbl", ts + 0.15);
            tl.set("#nc-s2", { autoAlpha: 0 }, 0.0);
            var total = parseFloat(root.dataset.duration || "8");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["news-caption-slam"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
