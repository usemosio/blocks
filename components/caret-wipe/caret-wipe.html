<!--
  Caret Wipe

  A tall text caret sweeps across the frame: behind it the new scene is typed in, ahead of it the old scene is backspaced away.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="caret-wipe"
  data-composition-duration="1.3333"
  data-composition-variables='[
  {
    "id": "direction",
    "type": "enum",
    "role": "motion",
    "label": "Direction",
    "description": "Which way the caret sweeps.",
    "default": "right",
    "options": [
      {
        "value": "right",
        "label": "Right"
      },
      {
        "value": "left",
        "label": "Left"
      }
    ]
  },
  {
    "id": "caret_color",
    "type": "color",
    "role": "style",
    "label": "Caret color",
    "description": "Color of the caret bar.",
    "default": "#C3E88D"
  },
  {
    "id": "caret_width",
    "type": "number",
    "role": "style",
    "label": "Caret width",
    "description": "Width of the caret bar in pixels.",
    "default": 3,
    "min": 1,
    "max": 20,
    "step": 1,
    "unit": "px"
  },
  {
    "id": "caret_height",
    "type": "number",
    "role": "style",
    "label": "Caret height",
    "description": "Caret height as a fraction of the frame height.",
    "default": 0.5,
    "min": 0.1,
    "max": 1,
    "step": 0.05
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Caret Wipe</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .crw-stage { position: absolute; inset: 0; }
        .crw-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .crw-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .crw-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .crw-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .crw-pa { background: #141318; }
        .crw-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .crw-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .crw-caret { position: absolute; border-radius: 3px; translate: -50% 0; opacity: 0; z-index: 5; }
        .crw-pa { z-index: 1; } .crw-pb { z-index: 2; }

      </style>

      <div id="root" data-composition-id="caret-wipe" data-duration="1.3333" data-fps="30">
        <div id="crw-clip" class="crw-stage clip" data-start="0" data-duration="1.3333" data-track-index="0">
          <div id="crw-a" class="crw-panel crw-pa"><div class="crw-in"><span>Scene A</span><i class="crw-bar"></i></div></div>
          <div id="crw-b" class="crw-panel crw-pb"><div class="crw-in"><span>Scene B</span><i class="crw-bar"></i></div></div>
          <div id="crw-caret" class="crw-caret"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 1.3333;

var dir = pick(vars.direction, ["left", "right"], "right");
var caretColor = str(vars.caret_color, "#C3E88D"), cw = num(vars.caret_width, 3, 1, 20), ch = num(vars.caret_height, 0.5, 0.1, 1);
var A = document.getElementById("crw-a"), B = document.getElementById("crw-b"), caret = document.getElementById("crw-caret");
caret.style.width = cw + "px"; caret.style.background = caretColor; caret.style.borderRadius = cw + "px";
caret.style.top = (1 - ch) * 50 + "%"; caret.style.height = ch * 100 + "%";
caret.style.boxShadow = "0 0 18px " + caretColor + ", 0 0 6px " + caretColor;
var sweep = bez(0.65, 0, 0.35, 1);
function frame(p) {
  var e = sweep(p), x = dir === "right" ? e * 100 : (1 - e) * 100;
  var keep = dir === "right" ? "inset(0 0 0 " + x + "%)" : "inset(0 " + (100 - x) + "% 0 0)";
  var reveal = dir === "right" ? "inset(0 " + (100 - x) + "% 0 0)" : "inset(0 0 0 " + x + "%)";
  A.style.clipPath = keep;
  A.style.translate = "0 " + interp(p, [0, 1], [0, -6]) + "px";
  A.style.filter = "blur(" + interp(p, [0.1, 1], [0, 4]) + "px)";
  B.style.clipPath = reveal;
  B.style.translate = "0 " + interp(p, [0, 1], [3, 0]) + "px";
  B.style.filter = "blur(" + interp(p, [0, 0.8], [2, 0]) + "px)";
  caret.style.left = x + "%";
  caret.style.opacity = interp(p, [0, 0.08, 0.92, 1], [0, 1, 1, 0]);
}

            drive("caret-wipe", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
