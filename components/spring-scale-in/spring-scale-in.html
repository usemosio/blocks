<html
  lang="en"
  data-composition-id="spring-scale-in"
  data-composition-duration="2"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Words that pop in one after another.", "default": "Fast. Crisp. Fluid." },
    { "id": "stagger_delay", "type": "number", "role": "motion", "label": "Stagger", "description": "Frames between each word popping in (30 fps).", "default": 3, "min": 1, "max": 12, "step": 1, "unit": "frames" },
    { "id": "scale_from", "type": "number", "role": "motion", "label": "Scale from", "description": "Scale each word starts at before it springs to 1.", "default": 0.7, "min": 0.1, "max": 1, "step": 0.05 },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Spring Scale In</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .ssi-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .ssi-line { letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; }
        .ssi-word { display: inline-block; margin-right: 0.25em; transform-origin: 50% 50%; opacity: 0; white-space: pre; }
        .ssi-word:last-child { margin-right: 0; }
      </style>

      <div id="root" data-composition-id="spring-scale-in" data-duration="2" data-fps="30">
        <div id="ssi-clip" class="ssi-stage clip" data-start="0" data-duration="2" data-track-index="0">
          <span id="ssi-line" class="ssi-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("ssi-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["spring-scale-in"] = tl;
            }
            var text = str(vars.text, "Fast. Crisp. Fluid.");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);

            var stagger = num(vars.stagger_delay, 3, 1, 12);
            var scaleFrom = num(vars.scale_from, 0.7, 0.1, 1);
            var line = document.getElementById("ssi-line");
            line.style.fontWeight = weight;
            line.setAttribute("aria-label", text);
            var words = text.trim().split(/\s+/).map(function (w, i) {
              var s = document.createElement("span");
              s.id = "ssi-word-" + i;
              s.className = "ssi-word";
              s.textContent = w;
              line.appendChild(s);
              return s;
            });
            fit(line, num(vars.font_size, 72, 12, 160), 0.9);

            var ease = bz("spring", 0.34, 1.56, 0.64, 1);
            var tl = gsap.timeline({ paused: true });
            words.forEach(function (w, i) {
              var a = i * stagger;
              tw(tl, w, { opacity: 0 }, { opacity: 1 }, a, a + 11, ease);
              tw(tl, w, { scale: scaleFrom }, { scale: 1 }, a, a + 11, ease);
            });
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
