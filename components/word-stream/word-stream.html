<html
  lang="en"
  data-composition-id="word-stream"
  data-composition-duration="3.4"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Phrases separated by |. Words within a phrase are split on spaces.", "default": "introducing | one-tap checkout | for your store" },
    { "id": "word_gap", "type": "number", "role": "motion", "label": "Word gap", "description": "Frames between words of a phrase (30 fps).", "default": 6, "min": 2, "max": 30, "step": 1, "unit": "frames" },
    { "id": "hold", "type": "number", "role": "motion", "label": "Hold", "description": "Frames a finished phrase stays before the next one cuts in.", "default": 18, "min": 6, "max": 90, "step": 1, "unit": "frames" },
    { "id": "drift", "type": "number", "role": "motion", "label": "Drift", "description": "How fast the whole line crawls left, in px per frame at 72 px type.", "default": 2, "min": 0, "max": 6, "step": 0.1 },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Stream</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .wst-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .wst-phrase { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .wst-shift { display: flex; align-items: center; justify-content: center; }
        .wst-line { letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
        .wst-word { display: inline-block; white-space: pre; opacity: 0; margin-right: 0.28em; }
        .wst-word:last-child { margin-right: 0; }
      </style>

      <div id="root" data-composition-id="word-stream" data-duration="3.4" data-fps="30">
        <div id="wst-clip" class="wst-stage clip" data-start="0" data-duration="3.4" data-track-index="0"></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("wst-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "3.4");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-stream"] = tl;
            }
            var text = str(vars.text, "introducing | one-tap checkout | for your store");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "400");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var gap = num(vars.word_gap, 6, 2, 30);
            var hold = num(vars.hold, 18, 6, 90);
            var drift = num(vars.drift, 2, 0, 6);
            var clip = document.getElementById("wst-clip");
            var REVEAL = 3, ENTRY = 8, RUN_OUT = 5;
            var phrases = text.split("|").map(function (p) { return p.trim(); }).filter(Boolean);
            if (!phrases.length) phrases = ["introducing"];

            // Build every phrase, then size them all by the widest one.
            var cursor = 0;
            var items = phrases.map(function (p, i) {
              var words = p.split(/\s+/);
              var start = cursor;
              var exitStart = start + (words.length - 1) * gap + REVEAL + hold;
              cursor = exitStart;
              var outer = document.createElement("div");
              outer.className = "wst-phrase";
              var mid = document.createElement("div");
              mid.className = "wst-shift";
              var inner = document.createElement("div");
              inner.className = "wst-shift";
              var line = document.createElement("span");
              line.className = "wst-line";
              line.style.fontWeight = weight;
              var spans = words.map(function (w, j) {
                var s = document.createElement("span");
                s.id = "wst-word-" + i + "-" + j;
                s.className = "wst-word";
                s.textContent = w;
                line.appendChild(s);
                return s;
              });
              inner.appendChild(line);
              mid.appendChild(inner);
              outer.appendChild(mid);
              clip.appendChild(outer);
              return { outer: outer, mid: mid, inner: inner, line: line, spans: spans, start: start, exitStart: exitStart, last: i === phrases.length - 1 };
            });
            var size = num(vars.font_size, 72, 12, 160);
            items.forEach(function (it) { it.line.style.fontSize = size + "px"; });
            var widest = 1;
            items.forEach(function (it) { widest = Math.max(widest, it.line.scrollWidth); });
            if (widest > root.clientWidth * 0.85) size = Math.max(12, size * (root.clientWidth * 0.85 / widest));
            items.forEach(function (it) { it.line.style.fontSize = size + "px"; });

            var k = size / 72;
            var easeReveal = bz("reveal", 0.2, 0.8, 0.2, 1);
            var easeEntry = bz("entry", 0.2, 0.8, 0.3, 1);
            var easeRun = bz("run", 0.7, 0, 0.9, 0.4);
            var tl = gsap.timeline({ paused: true });
            items.forEach(function (it) {
              var life = it.exitStart - it.start;
              var crawl = k * drift;
              // Crawl: linear drift left over the phrase's life, then it holds.
              tw(tl, it.mid, { x: crawl * life / 2 }, { x: -crawl * life / 2 }, it.start, it.exitStart);
              tw(tl, it.inner, { x: k * 30 }, { x: 0 }, it.start, it.start + ENTRY, easeEntry);
              it.spans.forEach(function (s, j) {
                var at = it.start + j * gap;
                tw(tl, s, { opacity: 0 }, { opacity: 1 }, at, at + REVEAL, easeReveal);
              });
              if (!it.last) {
                tw(tl, it.line, { x: 0 }, { x: -k * 80 }, it.exitStart - RUN_OUT, it.exitStart, easeRun, true);
                tl.set(it.outer, { visibility: "hidden" }, it.exitStart / 30);
              }
            });
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
