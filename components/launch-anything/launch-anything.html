              var txt = center(revealCopy(second ? c.promise : c.industry, t, start, 43, false), "transform:perspective(700px) rotateY(" + tween(t, start, start + 0.5, -8, 0) + "deg) rotateZ(" + tween(t, start, start + 0.55, 4, 0) + "deg)");
              return { html: F("background:#122d24;color:#f7f1e4;overflow:hidden", arcs + txt), bg: "#122d24" };
            }

            // ---- space, address, mark
            function space(t) {
              var first = t < 20.62, inset = !first && t < 21.02;
              var age = t - (first ? 20.22 : inset ? 20.62 : 21.02);
              var img = L(inset ? 32 : 0, inset ? 20 : 0, inset ? 416 : 480, inset ? 230 : 270, "overflow:hidden;transform:translateX(" + tween(age, 0, 0.53, -3, 3) + "px) scale(" + tween(age, 0, 0.53, 1.07, 1.02) + ");filter:brightness(" + (first ? 0.8 : 0.68) + ")", photo(first ? "rocket" : "earth"));
              var o = F("overflow:hidden;background:#eee8d9", img + F("inset:18px;border:0.65px solid #f4f0e970;opacity:" + (inset ? 0 : 0.8)) + center(title(c.launch, 92, "letter-spacing:-0.05em;font-weight:400;color:#f8f2e5")));
              return { html: o, bg: inset ? "#eee8d9" : first ? "#0b1a1c" : "#02060c" };
            }
            function address(t) {
              var url = c.brand_url;
              var prefix = url.toLowerCase().indexOf(c.launch.toLowerCase()) === 0 ? c.launch.length : 0;
              var typing = clamp01((t - 21.94) / 0.59);
              var text = url.slice(0, prefix + Math.floor((url.length - prefix) * typing));
              var glow = tween(t, 22.15, 22.45) * (1 - tween(t, 22.6, 23.25));
              return { html: center(title(text, tween(t, 21.55, 21.9, 43, 32, smooth), "font-weight:400;letter-spacing:-0.06em;color:" + (glow > 0.5 ? "#d5e2bd" : "#fff9f3") + ";text-shadow:0 0 " + glow * 5 + "px #fff, 0 0 " + glow * 20 + "px #72935c, 0 0 " + glow * 32 + "px #496b4d"), "background:#122d24;color:#fff9f3"), bg: "#122d24" };
            }
            function mark(t) {
              return { html: center('<div style="transform:scale(' + tween(t, 23.717, 26.666, 1, 0.63, smooth) + ')">' + brandMark(64, "#245744") + "</div>", "background:linear-gradient(#f4efdf,#faf5e9);color:#245744"), bg: "#f6f1e3" };
            }

            function frame(t) {
              if (t < 3.8) return opening(t);
              if (t < 5.9) return action(t);
              if (t < 7.333) return portal(t);
              if (t < 15.117) return showcase(t);
              if (t < 17.017) return proof(t);
              if (t < 20.217) return industry(t);
              if (t < 21.55) return space(t);
              if (t < 23.717) return address(t);
              return mark(t);
            }
            function draw(t) {
              var f = frame(t);
              stage.innerHTML = f.html;
              root.style.background = f.bg;
            }

            var TOTAL = parseFloat(root.dataset.duration || "26.667");
            var tl = gsap.timeline({ paused: true });
            var clock = { t: 0 };
            tl.to(clock, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["launch-anything"] = tl;
          })();
        </script>
