<!doctype html>
<!--
  Halftone Print

  A scene printed onto paper: rotated dot screens per ink colour, slightly out of register.
  The scene here is a paper poster.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/halftone-print/index.tsx

  furnished to do so, subject to the following conditions:

  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR

  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a paper poster) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="halftone-print"
  data-composition-duration="3"
  data-composition-variables='[{"id": "kicker", "type": "string", "role": "content", "label": "Kicker", "description": "Small line above the headline in the sample poster.", "default": "Issue 04"}, {"id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Headline of the sample poster.", "default": "Ship the demo, not the deck"}, {"id": "body", "type": "string", "role": "content", "label": "Body", "description": "Paragraph under the headline.", "default": "A recorded product beats a rehearsed one. Cut it in the afternoon and send it before the meeting."}, {"id": "dot_size", "type": "number", "role": "style", "label": "Dot size", "description": "Spacing of the dot screen. Pixel sizes are for a 1280×720 frame and scale with the frame.", "default": 10, "min": 4, "max": 32, "step": 1, "unit": "px"}, {"id": "angle", "type": "number", "role": "style", "label": "Angle", "description": "Rotation of the whole screen set.", "default": 0, "min": 0, "max": 90, "step": 1, "unit": "deg"}, {"id": "misregistration", "type": "number", "role": "style", "label": "Misregistration", "description": "How far the plates sit out of register. Pixel sizes are for a 1280×720 frame and scale with the frame.", "default": 1.2, "min": 0, "max": 6, "step": 0.2, "unit": "px"}, {"id": "paper_tint", "type": "color", "role": "style", "label": "Paper", "description": "Colour of the paper.", "default": "#f4efe4"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Fine dots need 1; lower renders faster but the screen turns soft.", "default": 1, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Halftone Print</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .htp-stage {
          position: absolute;
          inset: 0;
        }
        .htp-canvas,
        .htp-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .htp-scene {
          display: none;
        }
        .htp-off .htp-canvas {
          display: none;
        }
        .htp-off .htp-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="halftone-print" data-duration="3" data-fps="30">
        <div id="htp-clip" class="htp-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <canvas id="htp-scene0" class="htp-scene htp-fb"></canvas>
          <canvas id="htp-canvas" class="htp-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "halftone-print";
            var root = document.getElementById("root");
            var stage = document.getElementById("htp-clip");
            var canvas = document.getElementById("htp-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "kicker", "type": "string", "default": "Issue 04"}, {"id": "headline", "type": "string", "default": "Ship the demo, not the deck"}, {"id": "body", "type": "string", "default": "A recorded product beats a rehearsed one. Cut it in the afternoon and send it before the meeting."}, {"id": "dot_size", "type": "number", "default": 10, "min": 4, "max": 32}, {"id": "angle", "type": "number", "default": 0, "min": 0, "max": 90}, {"id": "misregistration", "type": "number", "default": 1.2, "min": 0, "max": 6}, {"id": "paper_tint", "type": "color", "default": "#f4efe4"}, {"id": "resolution", "type": "number", "default": 1, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["htp-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "poster": a paper poster with a headline and three colour bars (remocn's CanvasScenePoster).
            function drawPoster(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, "#efe9dc");
              var s = S, pad, inner, headLines, bodyLines, total;
              var headSize, bodySize;
              for (var attempt = 0; attempt < 3; attempt++) {
                pad = 96 * s; inner = W - pad * 2;
                headSize = 92 * s; bodySize = 32 * s;
                setFont(ctx, 600, headSize, SANS);
                setSpacing(ctx, -0.035 * headSize);
                headLines = wrapLines(ctx, V.headline, Math.min(760 * s, inner));
                setSpacing(ctx, 0);
                setFont(ctx, 400, bodySize, SANS);
                bodyLines = wrapLines(ctx, V.body, Math.min(640 * s, inner));
                total = 36 * s + 18 * s + headLines.length * headSize * 1.02 + 28 * s + bodyLines.length * bodySize * 1.4 + 56 * s + 3 * 40 * s;
                if (total <= H * 0.94) break;
                s *= H * 0.94 / total;
              }
              var y = (H - total) / 2;
              ctx.fillStyle = "#8a7f6b";
              fitFont(ctx, V.kicker, inner, 500, 30 * s, SANS);
              ctx.fillText(V.kicker, pad, y + 18 * s);
              y += 36 * s + 18 * s;
              ctx.fillStyle = "#171410";
              setFont(ctx, 600, headSize, SANS);
              setSpacing(ctx, -0.035 * headSize);
              headLines.forEach(function (text, i) { ctx.fillText(text, pad, y + (i + 0.5) * headSize * 1.02); });
              setSpacing(ctx, 0);
              y += headLines.length * headSize * 1.02 + 28 * s;
              ctx.fillStyle = "#5c5346";
              setFont(ctx, 400, bodySize, SANS);
              bodyLines.forEach(function (text, i) { ctx.fillText(text, pad, y + (i + 0.5) * bodySize * 1.4); });
              y += bodyLines.length * bodySize * 1.4 + 56 * s;
              [["#1f7a72", 0.92], ["#e2673a", 0.68], ["#2c3f8f", 0.44]].forEach(function (bar, i) {
                ctx.fillStyle = bar[0];
                ctx.fillRect(pad, y + i * 40 * s, inner * bar[1], 26 * s);
              });
            }

            function drawScenes() {
              drawPoster(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform float u_aspect;
uniform float u_cell;
uniform float u_angle;
uniform float u_shift;
uniform vec3 u_paper;

in vec2 v_uv;
out vec4 outColor;

const vec3 CYAN_ABSORB = vec3(0.92, 0.12, 0.02);
const vec3 MAGENTA_ABSORB = vec3(0.10, 0.88, 0.06);
const vec3 YELLOW_ABSORB = vec3(0.03, 0.10, 0.90);

vec2 toSquare(vec2 uv) {
  return vec2(uv.x * u_aspect, uv.y);
}

vec2 fromSquare(vec2 p) {
  return vec2(p.x / u_aspect, p.y);
}

float screenInk(float angle, vec2 drift, vec3 pick) {
  vec2 p = toSquare(v_uv);
  float s = sin(angle);
  float c = cos(angle);
  vec2 r = vec2(p.x * c - p.y * s, p.x * s + p.y * c);

  vec2 center = (floor(r / u_cell) + 0.5) * u_cell;
  vec2 unrotated =
    vec2(center.x * c + center.y * s, -center.x * s + center.y * c);

  vec4 texel = texture(u_scene, fromSquare(unrotated + drift));
  vec3 straight = texel.rgb / max(texel.a, 0.004);
  float ink = clamp(1.0 - dot(straight, pick), 0.0, 1.0) * texel.a;

  float radius = sqrt(ink) * u_cell * 0.72;
  float aa = u_cell * 0.045;
  float coverage = 1.0 - smoothstep(radius - aa, radius + aa, length(r - center));
  return coverage * step(0.002, ink);
}

void main() {
  vec4 source = texture(u_scene, v_uv);

  float cyan =
    screenInk(u_angle + 0.2618, u_shift * vec2(1.0, 0.0), vec3(1.0, 0.0, 0.0));
  float magenta =
    screenInk(u_angle + 1.3090, u_shift * vec2(-0.5, 0.866), vec3(0.0, 1.0, 0.0));
  float yellow =
    screenInk(u_angle, u_shift * vec2(-0.5, -0.866), vec3(0.0, 0.0, 1.0));

  vec3 color = u_paper;
  color *= 1.0 - cyan * CYAN_ABSORB;
  color *= 1.0 - magenta * MAGENTA_ABSORB;
  color *= 1.0 - yellow * YELLOW_ABSORB;

  outColor = vec4(color * source.a, source.a);
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              gl.uniform1f(u("u_cell"), Math.max(V.dot_size * S, 1) / H);
              gl.uniform1f(u("u_angle"), V.angle * Math.PI / 180);
              gl.uniform1f(u("u_shift"), V.misregistration * S / H);
              var paper = rgb(V.paper_tint);
              gl.uniform3f(u("u_paper"), paper[0], paper[1], paper[2]);

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("htp-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "3");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
