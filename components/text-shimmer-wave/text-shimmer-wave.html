<!doctype html>
<!--
  Text Shimmer Wave

  A wave of light runs through muted text: each letter in turn lifts toward the viewer, tilts, grows slightly and brightens, then settles back, and the wave repeats.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/ibelick/motion-primitives/blob/120f64f6ca60348e251f929e9c81f11ccbe45eda/components/core/text-shimmer-wave.tsx

<html
  lang="en"
  data-composition-id="text-shimmer-wave"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The line of text.", "default": "Generating your story"},
    {"id": "duration", "type": "number", "role": "motion", "label": "Wave time", "description": "Seconds each letter takes for its lift.", "default": 1, "min": 0.3, "max": 3, "step": 0.05, "unit": "s"},
    {"id": "spread", "type": "number", "role": "motion", "label": "Spread", "description": "Higher values let the wave travel faster across the line.", "default": 1, "min": 0.3, "max": 3, "step": 0.05},
    {"id": "z_distance", "type": "number", "role": "motion", "label": "Z distance", "description": "Lift toward the viewer, in pixels.", "default": 10, "min": 0, "max": 60, "step": 1, "unit": "px"},
    {"id": "x_distance", "type": "number", "role": "motion", "label": "X distance", "description": "Sideways drift, in pixels.", "default": 2, "min": -30, "max": 30, "step": 1, "unit": "px"},
    {"id": "y_distance", "type": "number", "role": "motion", "label": "Y distance", "description": "Vertical drift, in pixels (negative is up).", "default": -2, "min": -30, "max": 30, "step": 1, "unit": "px"},
    {"id": "scale_distance", "type": "number", "role": "motion", "label": "Scale", "description": "Peak scale of a letter.", "default": 1.1, "min": 1, "max": 1.6, "step": 0.01},
    {"id": "rotate_y_distance", "type": "number", "role": "motion", "label": "Rotate Y", "description": "Peak tilt around the vertical axis.", "default": 10, "min": 0, "max": 60, "step": 1, "unit": "deg"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 80, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Base color", "description": "Resting color of the letters.", "default": "#a1a1aa"},
    {"id": "highlight_color", "type": "color", "role": "style", "label": "Highlight color", "description": "Color of a letter at the peak of the wave.", "default": "#000000"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Shimmer Wave</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #a1a1aa);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .tsw-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .tsw-line { position: relative; display: inline-block; perspective: 500px; white-space: pre; line-height: 1.2; letter-spacing: -0.02em; text-align: center; }
        .tsw-ch { display: inline-block; white-space: pre; transform-style: preserve-3d; }
      </style>

      <div id="root" data-composition-id="text-shimmer-wave" data-duration="4" data-fps="30">
        <div id="tsw-clip" class="tsw-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="tsw-line" class="tsw-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "4");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("tsw-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-shimmer-wave"] = tl;
            }


            var line = document.getElementById("tsw-line");
            var text = str(vars.text, "Generating your story");
            var dur = num(vars.duration, 1, 0.3, 3), spread = num(vars.spread, 1, 0.3, 3);
            var zd = num(vars.z_distance, 10, 0, 60), xd = num(vars.x_distance, 2, -30, 30), yd = num(vars.y_distance, -2, -30, 30);
            var sc = num(vars.scale_distance, 1.1, 1, 1.6), ry = num(vars.rotate_y_distance, 10, 0, 60);
            var base = str(vars.color, "#a1a1aa"), hi = str(vars.highlight_color, "#000000");
            var size = num(vars.font_size, 80, 12, 240);
            line.style.fontSize = size + "px"; line.style.color = base;
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "600");
            line.setAttribute("aria-label", text);
            var chars = Array.from(text).map(function (ch) { var s = document.createElement("span"); s.className = "tsw-ch"; s.textContent = ch; s.style.color = base; line.appendChild(s); return s; });
            var maxW = root.clientWidth * 0.9;
            if (line.scrollWidth > maxW) { size = size * maxW / line.scrollWidth; line.style.fontSize = size + "px"; }
            var n = chars.length, repeatDelay = (n * 0.05) / spread, period = dur + repeatDelay;
            var half = dur / 2, tl = gsap.timeline({ paused: true });
            chars.forEach(function (el, i) {
              var delay = (i * dur * (1 / spread)) / n;
              for (var t0 = delay; t0 < total; t0 += period) {
                tl.to(el, { z: zd, x: xd, y: yd, scale: sc, rotationY: ry, color: hi, duration: half, ease: EIO }, t0);
                tl.to(el, { z: 0, x: 0, y: 0, scale: 1, rotationY: 0, color: base, duration: half, ease: EIO }, t0 + half);
              }
            });
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
