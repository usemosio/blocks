<html
  lang="en"
  data-composition-id="isometric-build"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "grid", "type": "number", "role": "style", "label": "Tiles per side", "description": "Tiles along each side of the square grid.", "default": 5, "min": 2, "max": 9, "step": 1},
    {"id": "max_height", "type": "number", "role": "style", "label": "Max height", "description": "Tallest regular block, in tile widths. The accent tower rises above it.", "default": 2.2, "min": 0.5, "max": 4, "step": 0.1},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Frames between consecutive diagonals rising.", "default": 2, "min": 0, "max": 6, "step": 0.5, "unit": "frames"},
    {"id": "gap", "type": "number", "role": "style", "label": "Gap", "description": "Gap between neighbouring blocks, as a share of a tile.", "default": 0.04, "min": 0, "max": 0.3, "step": 0.01},
    {"id": "floors", "type": "boolean", "role": "style", "label": "Floor lines", "description": "Draw floor lines on the block faces.", "default": true},
    {"id": "seed", "type": "number", "role": "style", "label": "Seed", "description": "Changes the block heights and which tower is the accent.", "default": 4, "min": 1, "max": 50, "step": 1},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed of the build.", "default": 1, "min": 0.1, "max": 4, "step": 0.1},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Background color.", "default": "#111111"},
    {"id": "color", "type": "color", "role": "style", "label": "Blocks", "description": "Block color; side faces are this color shaded toward the background.", "default": "#FFFFFF"},
    {"id": "accent", "type": "color", "role": "style", "label": "Accent tower", "description": "Color of the single accent tower.", "default": "#E5322D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Isometric Build</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #111111; }
        .ib-stage { position: absolute; inset: 0; }
        .ib-stage svg { display: block; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="isometric-build" data-duration="3" data-fps="30">
        <div id="ib-clip" class="ib-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <svg id="ib-svg" role="img" aria-label="Isometric city build"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            var FPS = 30;
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;

            // Seeded random in [0, 1): a string hash, so the same key always gives the same value.
            function rnd(key) {
              var h = 1779033703 ^ key.length;
              for (var i = 0; i < key.length; i++) {
                h = Math.imul(h ^ key.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
              }
              h = Math.imul(h ^ (h >>> 16), 2246822507);
              h = Math.imul(h ^ (h >>> 13), 3266489909);
              h ^= h >>> 16;
              return (h >>> 0) / 4294967296;
            }

            // Piecewise-linear map of x from inR to outR, optionally eased per segment and clamped.
            function interp(x, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var i = 0;
              if (x >= inR[n - 1]) i = n - 2;
              else if (x > inR[0]) { while (x > inR[i + 1]) i++; }
              var t = (x - inR[i]) / (inR[i + 1] - inR[i]);
              if (o.clamp !== false) t = Math.min(1, Math.max(0, t));
              if (o.easing) t = o.easing(t);
              return outR[i] + (outR[i + 1] - outR[i]) * t;
            }
            function clamp01(t) { return Math.min(1, Math.max(0, t)); }

            // Closed-form damped spring from 0 to 1 (rest at 1), sampled at `frame` frames.
            function spring(frame, mass, stiffness, damping) {
              if (frame <= 0) return 0;
              var t = frame / FPS;
              var w0 = Math.sqrt(stiffness / mass);
              var z = damping / (2 * Math.sqrt(stiffness * mass));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }

            function fmt(n) { return Math.round(n * 10) / 10; }

            var SVGNS = "http://www.w3.org/2000/svg";
            function el(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }

            var tl = gsap.timeline({ paused: true });
            // Runs draw(frame) from the timeline so seeking to a time always draws the same picture.
            function drive(frames, draw) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
              draw(0);
            }

            var grid = Math.round(num(vars.grid, 5, 2, 9));
            var maxHeight = num(vars.max_height, 2.2, 0.5, 4);
            var stagger = num(vars.stagger, 2, 0, 6);
            var gap = num(vars.gap, 0.04, 0, 0.3);
            var floors = bool(vars.floors, true);
            var seed = Math.round(num(vars.seed, 4, 1, 50));
            var speed = num(vars.speed, 1, 0.1, 4);
            var background = str(vars.background, "#111111");
            root.style.background = background;
            var color = str(vars.color, "#FFFFFF");
            var accent = str(vars.accent, "#E5322D");

            var ISO_Y = Math.tan(Math.PI / 6), ISO_Z = 1 / Math.cos(Math.PI / 6);
            var FLOOR = 0.42, SHADE_LEFT = 0.32, SHADE_RIGHT = 0.6;
            var n = grid, inset = Math.min(0.45, Math.max(0, gap)) / 2;
            function r(key) { return rnd("isometric-build-" + seed + "-" + key); }

            // Blocks in painter order (back to front); front rows rise first.
            var inner = Math.max(1, n - 2);
            var ai = n > 2 ? 1 + Math.floor(r("ai") * inner) : 0;
            var aj = n > 2 ? 1 + Math.floor(r("aj") * inner) : 0;
            var blocks = [];
            for (var sum = 0; sum <= 2 * (n - 1); sum++) {
              for (var i = 0; i < n; i++) {
                var j = sum - i;
                if (j < 0 || j >= n) continue;
                var isAccent = i === ai && j === aj;
                // One compact mound that peaks in the middle, snapped to whole floors.
                var c = (n - 1) / 2;
                var centre = 1 - Math.hypot(i - c, j - c) / (Math.hypot(c, c) || 1);
                var raw = maxHeight * (0.2 + 0.8 * Math.pow(centre, 1.3)) * (0.75 + 0.5 * r("h" + i + "-" + j));
                var h = Math.max(FLOOR, Math.round(raw / FLOOR) * FLOOR);
                blocks.push({ i: i, j: j, accent: isAccent, height: isAccent ? maxHeight * 1.35 : h,
                  delay: (2 * (n - 1) - sum) * stagger + r("d" + i + "-" + j) * stagger });
              }
            }

            var tallest = maxHeight * 1.35;
            var a = Math.min((W * 0.64) / (2 * n), (H * 0.8) / (2 * n * ISO_Y + tallest * ISO_Z));
            var b = a * ISO_Y, hz = a * ISO_Z;
            var top = (H - (2 * n * b + tallest * hz)) / 2 + tallest * hz;
            var cx = W / 2;
            function P(u, v, z) { return fmt(cx + (u - v) * a) + " " + fmt(top + (u + v) * b - z * hz); }
            function poly() { return "M " + Array.prototype.slice.call(arguments).join(" L ") + " Z"; }
            var unit = Math.min(W, H) / 720;

            var svg = document.getElementById("ib-svg");
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            var ground = "";
            for (var k = 0; k <= n; k++) ground += "M " + P(k, 0, 0) + " L " + P(k, n, 0) + " M " + P(0, k, 0) + " L " + P(n, k, 0) + " ";
            el("path", { d: ground, fill: "none", stroke: color, "stroke-opacity": 0.12, "stroke-width": unit }, svg);

            blocks.forEach(function (blk) {
              var fill = blk.accent ? accent : color;
              var g = el("g", { opacity: 0 }, svg);
              blk.g = g;
              blk.left = el("path", { fill: fill }, g);
              el("path", { fill: background, "fill-opacity": SHADE_LEFT }, g); blk.leftShade = g.lastChild;
              blk.right = el("path", { fill: fill }, g);
              el("path", { fill: background, "fill-opacity": SHADE_RIGHT }, g); blk.rightShade = g.lastChild;
              blk.lines = el("path", { fill: "none", stroke: background, "stroke-opacity": 0.35, "stroke-width": unit * 1.2 }, g);
              blk.roof = el("path", { fill: fill, stroke: background, "stroke-opacity": 0.5, "stroke-width": unit, "stroke-linejoin": "round" }, g);
            });

            function draw(frame) {
              var time = frame * speed;
              blocks.forEach(function (blk) {
                var s = spring(time - blk.delay, 0.7, 140, 11);
                var opacity = interp(s, [0, 0.15], [0, 1]);
                if (opacity <= 0) { blk.g.setAttribute("opacity", 0); return; }
                var h = Math.max(0.02, blk.height * s);
                var u0 = blk.i + inset, u1 = blk.i + 1 - inset, v0 = blk.j + inset, v1 = blk.j + 1 - inset;
                var left = poly(P(u0, v1, 0), P(u1, v1, 0), P(u1, v1, h), P(u0, v1, h));
                var right = poly(P(u1, v0, 0), P(u1, v1, 0), P(u1, v1, h), P(u1, v0, h));
                var roof = poly(P(u0, v0, h), P(u1, v0, h), P(u1, v1, h), P(u0, v1, h));
                var lines = "";
                if (floors) for (var z = FLOOR; z < h - FLOOR * 0.5; z += FLOOR) lines += "M " + P(u0, v1, z) + " L " + P(u1, v1, z) + " L " + P(u1, v0, z) + " ";
                blk.g.setAttribute("opacity", opacity);
                blk.left.setAttribute("d", left); blk.leftShade.setAttribute("d", left);
                blk.right.setAttribute("d", right); blk.rightShade.setAttribute("d", right);
                blk.lines.setAttribute("d", lines);
                blk.roof.setAttribute("d", roof);
              });
            }
            drive(Math.round(parseFloat(root.dataset.duration || "3") * FPS), draw);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["isometric-build"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
