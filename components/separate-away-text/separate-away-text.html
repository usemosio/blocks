<!doctype html>
<!--
  Separate Away Text

  Two stacked lines fade in together while drifting slightly apart, the top one up and the bottom one down, opening a small gap between them.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/karthikmudunuri/eldoraui/blob/6bb8fd211ecbdfa983f5780bead27d9f3890f20a/apps/www/registry/eldoraui/seperate-away-text.tsx

<html
  lang="en"
  data-composition-id="separate-away-text"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "text_top", "type": "string", "role": "content", "label": "Top line", "description": "Line that drifts up.", "default": "Separate"},
    {"id": "text_bottom", "type": "string", "role": "content", "label": "Bottom line", "description": "Line that drifts down.", "default": "Away"},
    {"id": "duration", "type": "number", "role": "motion", "label": "Time", "description": "Seconds the fade and drift take.", "default": 1.5, "min": 0.3, "max": 5, "step": 0.1, "unit": "s"},
    {"id": "distance", "type": "number", "role": "motion", "label": "Drift", "description": "How far each line moves from the centre. Scales with font size (72px = source).", "default": 5, "min": 0, "max": 60, "step": 1, "unit": "px"},
    {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the fade.", "default": 0.2, "min": 0, "max": 5, "step": 0.1, "unit": "s"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels. The source is built for 72px type; its pixel offsets scale with this size.", "default": 130, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Separate Away Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .saw-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .saw-box { display: flex; flex-direction: column; align-items: center; }
        .saw-line { text-align: center; line-height: 1.2; letter-spacing: -0.02em; opacity: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.12); max-width: 92%; }
      </style>

      <div id="root" data-composition-id="separate-away-text" data-duration="3.5" data-fps="30">
        <div id="saw-clip" class="saw-stage clip" data-start="0" data-duration="3.5" data-track-index="0">
          <div class="saw-box"><div id="saw-a" class="saw-line"></div><div id="saw-b" class="saw-line"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "3.5");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("saw-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["separate-away-text"] = tl;
            }


            var a = document.getElementById("saw-a"), b = document.getElementById("saw-b");
            var size = num(vars.font_size, 72, 12, 260), f = size / 72;
var dur = num(vars.duration, 1.5, 0.3, 5), start = num(vars.start, 0.2, 0, 5), dist = num(vars.distance, 5, 0, 60) * f;
            [a, b].forEach(function (el) { el.style.fontSize = size + "px"; el.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "700"); });
            a.textContent = str(vars.text_top, "Separate"); b.textContent = str(vars.text_bottom, "Away");
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(a, { opacity: 0, y: 0 }, { opacity: 1, y: -dist, duration: dur, ease: EIO, immediateRender: true }, start);
            tl.fromTo(b, { opacity: 0, y: 0 }, { opacity: 1, y: dist, duration: dur, ease: EIO, immediateRender: true }, start);
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
