<!doctype html>
<!--
  Focus Blur Resolve

  Text starts blurred and resolves to crisp, holds, then drifts up and blurs out.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="focus-blur-resolve"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text that resolves into focus.", "default": "Focus resolves clearly."},
    {"id": "blur", "type": "number", "role": "motion", "label": "Blur", "description": "Starting blur radius in pixels.", "default": 14, "min": 0, "max": 40, "step": 1, "unit": "px"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Focus Blur Resolve</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: var(--color, #171717); font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; }
        .fbr-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .fbr-text { display: inline-block; transform-origin: 50% 50%; letter-spacing: -0.03em; line-height: 1.2; text-align: center; max-width: 92%; }
      </style>

      <div id="root" data-composition-id="focus-blur-resolve" data-duration="3" data-fps="30">
        <div id="fbr-clip" class="fbr-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <span id="fbr-text" class="fbr-text" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 3;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["focus-blur-resolve"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var text = str(vars.text, "Focus resolves clearly.");
            var blur0 = num(vars.blur, 14, 0, 40), size = num(vars.font_size, 72, 12, 240), speed = num(vars.speed, 1, 0.25, 4);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var el = document.getElementById("fbr-text");
            el.textContent = text; el.setAttribute("aria-label", text);
            el.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            fit(el, size, 0.9); onFonts(function () { fit(el, size, 0.9); });
            var enterDur = 23, exitDur = 16, exitStart = Math.max(enterDur, FRAMES - exitDur);
            var enterE = bezier(0.22, 1, 0.36, 1), exitE = bezier(0.64, 0, 0.78, 0);
            start(function (raw) {
              var f = raw * speed;
              var enP = ip(f, 0, enterDur, 0, 1, enterE), exP = ip(f, exitStart, FRAMES, 0, 1, exitE);
              var y = ip(f, 0, enterDur, 14, 0, enterE) + ip(f, exitStart, FRAMES, 0, -10, exitE);
              var blur = ip(f, 0, enterDur, blur0, 0, enterE) + ip(f, exitStart, FRAMES, 0, 10, exitE);
              el.style.opacity = enP * (1 - exP);
              el.style.transform = "translateY(" + y + "px) scale(" + ip(f, 0, enterDur, 1.01, 1, enterE) + ")";
              el.style.filter = blur > 0.01 ? "blur(" + blur + "px)" : "none";
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
