<!doctype html>
<!--
  QR Pay Scan

  A generic QR card (a drawn pattern from a seeded generator, not a real code) is swept by a scan line, then a success check appears with the amount and "Pembayaran berhasil". Shop, amount, texts and the pattern seed are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="qr-pay-scan"
  data-composition-duration="5"
  data-composition-variables='[
  {
    "id": "shop",
    "type": "string",
    "role": "content",
    "label": "Shop name",
    "description": "Shop shown next to the card.",
    "default": "Kopi Senja"
  },
  {
    "id": "hint",
    "type": "string",
    "role": "content",
    "label": "Hint",
    "description": "Line shown while the card waits to be scanned.",
    "default": "Pindai untuk membayar"
  },
  {
    "id": "amount",
    "type": "string",
    "role": "content",
    "label": "Amount",
    "description": "Amount shown on success. Digits count up with dots as thousands separators; a prefix such as Rp is kept.",
    "default": "Rp45.000"
  },
  {
    "id": "success",
    "type": "string",
    "role": "content",
    "label": "Success text",
    "description": "Line under the amount.",
    "default": "Pembayaran berhasil"
  },
  {
    "id": "seed",
    "type": "number",
    "role": "content",
    "label": "Pattern seed",
    "description": "Changes the drawn QR-like pattern.",
    "default": 7,
    "min": 1,
    "max": 999,
    "step": 1
  },
  {
    "id": "scan_at",
    "type": "number",
    "role": "motion",
    "label": "Scan start",
    "description": "Second the scan line starts to sweep.",
    "default": 1.0,
    "min": 0.5,
    "max": 3,
    "step": 0.1
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "Scan line and success check: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>QR Pay Scan</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--qp-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--qp-bg);
        }
        #root * { box-sizing: border-box; }
        .qp-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .qp-wrap { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; transform-origin: 50% 50%; }
        .qp-card { position: relative; flex: none; width: calc(var(--u) * 700); height: calc(var(--u) * 700); padding: calc(var(--u) * 56); border-radius: calc(var(--u) * 48); background: #fff; border: calc(var(--u) * 2) solid rgba(10,10,10,0.1); box-shadow: 0 calc(var(--u) * 14) calc(var(--u) * 34) rgba(0,0,0,0.08); }
        .qp-qr { position: relative; width: 100%; height: 100%; }
        .qp-qr > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .qp-scan { position: absolute; left: calc(var(--u) * -14); right: calc(var(--u) * -14); top: 0; height: calc(var(--u) * 6); background: var(--qp-main); border-radius: calc(var(--u) * 3); z-index: 2; }
        .qp-scan::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: calc(var(--u) * 150); background: linear-gradient(to bottom, rgba(0,0,0,0), color-mix(in srgb, var(--qp-main) 16%, transparent)); }
        .qp-br { position: absolute; width: calc(var(--u) * 56); height: calc(var(--u) * 56); border: solid var(--qp-text); border-width: 0; z-index: 1; }
        .qp-ok { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 250); height: calc(var(--u) * 250); margin: calc(var(--u) * -125) 0 0 calc(var(--u) * -125); border-radius: 50%; background: var(--qp-main); z-index: 3; }
        .qp-ok svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .qp-info { position: relative; flex: none; display: flex; flex-direction: column; justify-content: center; }
        .qp-shop { font-size: calc(var(--u) * 46); font-weight: 700; letter-spacing: -0.03em; }
        .qp-swap { position: relative; align-self: stretch; margin-top: calc(var(--u) * 14); height: calc(var(--u) * 190); }
        .qp-swap > div { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
        .qp-hint { font-size: calc(var(--u) * 40); font-weight: 500; color: var(--qp-muted); }
        .qp-amt { font-size: calc(var(--u) * 128); font-weight: 700; letter-spacing: -0.05em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .qp-done { font-size: calc(var(--u) * 42); font-weight: 600; color: var(--qp-main); margin-top: calc(var(--u) * 6); }

      </style>

      <div id="root" data-composition-id="qr-pay-scan" data-duration="5" data-fps="30">
        <div id="qp-clip" class="qp-stage clip" data-start="0" data-duration="5" data-track-index="0">

          <div class="qp-wrap" id="qp-wrap">
            <div class="qp-card" id="qp-card"><div class="qp-qr" id="qp-qr"><div class="qp-scan" id="qp-scan"></div></div><div class="qp-ok" id="qp-ok"></div></div>
            <div class="qp-info" id="qp-info">
              <div class="qp-shop" id="qp-shop"></div>
              <div class="qp-swap"><div id="qp-hintbox"><span class="qp-hint" id="qp-hint"></span></div><div id="qp-res"><span class="qp-amt" id="qp-amt"></span><span class="qp-done" id="qp-done"></span></div></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("qp", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb" });


            var u = U;
            var shop = str(vars.shop, "Kopi Senja"), hint = str(vars.hint, "Pindai untuk membayar");
            var amount = str(vars.amount, "Rp45.000"), success = str(vars.success, "Pembayaran berhasil");
            var seed = Math.round(num(vars.seed, 7, 1, 999)), scanAt = num(vars.scan_at, 1.0, 0.5, 3);
            document.getElementById("qp-shop").textContent = shop;
            document.getElementById("qp-hint").textContent = hint;
            document.getElementById("qp-done").textContent = success;
            var amt = document.getElementById("qp-amt");

            // A QR-like pattern: finder squares in three corners, a small alignment square, seeded noise elsewhere.
            var N = 25, rnd = mulberry(seed * 7919 + 13), grid = [];
            for (var y = 0; y < N; y++) { grid.push([]); for (var x = 0; x < N; x++) grid[y].push(rnd() < 0.5 ? 1 : 0); }
            function finder(ox, oy) {
              for (var y = -1; y <= 7; y++) for (var x = -1; x <= 7; x++) {
                var gx = ox + x, gy = oy + y; if (gx < 0 || gy < 0 || gx >= N || gy >= N) continue;
                var edge = x === -1 || y === -1 || x === 7 || y === 7;
                var ring = x === 0 || y === 0 || x === 6 || y === 6;
                var core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
                grid[gy][gx] = edge ? 0 : (ring || core) ? 1 : 0;
              }
            }
            finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
            for (var a = -2; a <= 2; a++) for (var b = -2; b <= 2; b++) grid[N - 7 + b][N - 7 + a] = (Math.max(Math.abs(a), Math.abs(b)) !== 1) ? 1 : 0;
            for (var t = 8; t < N - 8; t++) { grid[6][t] = t % 2 === 0 ? 1 : 0; grid[t][6] = t % 2 === 0 ? 1 : 0; }
            var d = "";
            for (var yy = 0; yy < N; yy++) for (var xx = 0; xx < N; xx++) if (grid[yy][xx]) d += "M" + xx + " " + yy + "h1v1h-1z";
            var qr = document.getElementById("qp-qr");
            var qsvg = svg("svg", { viewBox: "0 0 " + N + " " + N, "shape-rendering": "crispEdges" }, qr);
            qr.insertBefore(qsvg, qr.firstChild);
            var qg = svg("g", {}, qsvg);
            svg("path", { d: d, fill: colr(vars.text_color, "#0a0a0a") }, qg);
            // Corner brackets around the code.
            var bw = 7 * u;
            [["top", "left"], ["top", "right"], ["bottom", "left"], ["bottom", "right"]].forEach(function (c) {
              var e = el("div", "qp-br", document.getElementById("qp-card"));
              var o = -24 * u; e.style[c[0]] = 32 * u + "px"; e.style[c[1]] = 32 * u + "px";
              e.style["border" + c[0].charAt(0).toUpperCase() + c[0].slice(1) + "Width"] = bw + "px";
              e.style["border" + c[1].charAt(0).toUpperCase() + c[1].slice(1) + "Width"] = bw + "px";
              e.style["border" + c[0].charAt(0).toUpperCase() + c[0].slice(1) + c[1].charAt(0).toUpperCase() + c[1].slice(1) + "Radius"] = 16 * u + "px";
            });
            // Success check.
            var ok = document.getElementById("qp-ok");
            var osv = svg("svg", { viewBox: "0 0 100 100" }, ok);
            var chk = svg("path", { d: "M29 52 L44 67 L72 35", fill: "none", stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1 }, osv);
            chk.style.strokeDasharray = "1"; chk.style.strokeDashoffset = "1";

            // Layout: card then info, column in portrait, row in landscape.
            var wrap = document.getElementById("qp-wrap"), info = document.getElementById("qp-info");
            var gw, gh;
            if (PORTRAIT) {
              wrap.style.flexDirection = "column"; wrap.style.gap = 56 * u + "px"; info.style.alignItems = "center"; info.style.textAlign = "center"; info.style.width = 760 * u + "px";
              document.getElementById("qp-hintbox").style.alignItems = "center"; document.getElementById("qp-res").style.alignItems = "center";
              gw = 760 * u; gh = 700 * u + 56 * u + 270 * u;
            } else {
              wrap.style.gap = 80 * u + "px"; info.style.width = 700 * u + "px";
              gw = 700 * u + 80 * u + 700 * u; gh = 700 * u;
            }
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            var S = Math.min(1.4, (H * 0.88) / gh, (W * 0.92) / gw);
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });
            var cardH = 700 * u - 112 * u;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#qp-card", { y: 50 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
            tl.fromTo(["#qp-shop", "#qp-hint"], { y: 24 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.3);
            tl.fromTo(".qp-br", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.45);
            // Two sweeps: down, then back up.
            tl.fromTo("#qp-scan", { y: 0, opacity: 0 }, { opacity: 1, duration: 0.15 }, scanAt - 0.1);
            tl.fromTo("#qp-scan", { y: 0 }, { y: cardH, duration: 0.9, ease: "power1.inOut" }, scanAt);
            tl.to("#qp-scan", { y: 0, duration: 0.7, ease: "power1.inOut" }, scanAt + 0.9);
            tl.to("#qp-scan", { opacity: 0, duration: 0.15 }, scanAt + 1.6);
            var ts = scanAt + 1.75;
            tl.to(qg, { opacity: 0.1, duration: 0.35, ease: "power2.out" }, ts);
            tl.fromTo("#qp-ok", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, ts + 0.05);
            tl.fromTo(chk, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, ts + 0.3);
            tl.to("#qp-hintbox", { opacity: 0, y: -20 * u, duration: 0.25, ease: "power2.in" }, ts);
            tl.fromTo("#qp-res", { opacity: 0, y: 30 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, ts + 0.25);
            tl.fromTo("#qp-done", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, ts + 0.7);
            var m = /^(\D*)(\d[\d.,]*)(.*)$/.exec(amount), value = m ? parseInt(m[2].replace(/[.,]/g, ""), 10) : NaN;
            var step = value >= 10000 ? 1000 : value >= 1000 ? 100 : 1, ctr = { v: 0 };
            function show(v) { amt.textContent = !m || v >= value ? amount : m[1] + dots(Math.round(v / step) * step) + m[3]; }
            if (m && value) tl.fromTo(ctr, { v: 0 }, { v: value, duration: 0.8, ease: "power2.out", onUpdate: function () { show(ctr.v); } }, ts + 0.3);
            show(0);
            tl.set("#qp-res", { opacity: 0 }, 0);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["qr-pay-scan"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
