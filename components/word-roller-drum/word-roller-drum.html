<!doctype html>
<!--
  Word Roller Drum

  A word cycles on the face of a rotating 3D drum beside a fixed prefix: each spring turn brings the next word round, and the last one stays.

<html
  lang="en"
  data-composition-id="word-roller-drum"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words in order, separated by commas. The last one is where it settles.", "default": "Today, Tomorrow, Forever, Always"},
    {"id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Fixed text before the drum.", "default": "Start"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the drum words in pixels. A wide line shrinks to fit the frame.", "default": 56, "min": 16, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Word color", "description": "Color of the words on the drum.", "default": "#2563eb"},
    {"id": "prefix_color", "type": "color", "role": "style", "label": "Prefix color", "description": "Color of the fixed prefix.", "default": "#737373"},
    {"id": "turn_frames", "type": "number", "role": "motion", "label": "Frames per word", "description": "Length of one drum turn in 30 fps frames.", "default": 28, "min": 10, "max": 90, "step": 1, "unit": "f"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Drum</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wrd-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #2563eb); }
        .wrd-g { display: flex; align-items: center; gap: 0.357em; line-height: 1; }
        .wrd-pre { font-size: 0.857em; font-weight: 500; color: var(--pc, #737373); white-space: pre; }
        .wrd-drum { position: relative; perspective: 8.93em; height: 1.43em; }
        .wrd-cyl { position: absolute; inset: 0; transform-style: preserve-3d; }
        .wrd-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; white-space: pre; backface-visibility: hidden; }

        .wrd-sizer { display: grid; height: 0; overflow: hidden; visibility: hidden; pointer-events: none; }
        .wrd-sizer span { grid-area: 1 / 1; white-space: pre; }

        .wrd-sizer { padding: 0 0.15em; }
        .wrd-sizer span { font-size: 1.25em; font-weight: 700; }

      </style>

      <div id="root" data-composition-id="word-roller-drum" data-duration="4" data-fps="30">
        <div id="wrd-clip" class="wrd-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="wrd-g" class="wrd-g">
            <div id="wrd-pre" class="wrd-pre"></div>
            <div class="wrd-drum">
              <div id="wrd-sizer" class="wrd-sizer"></div>
              <div id="wrd-cyl" class="wrd-cyl"></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "4");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-drum"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var words = list(vars.words, ["Today", "Tomorrow", "Forever", "Always"], 8);
            var n = words.length, fi = n - 1, ang = 360 / n;
            var cd = num(vars.turn_frames, 28, 10, 90);
            var g = el("wrd-g"), pre = el("wrd-pre"), cyl = el("wrd-cyl");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--c", vars.color);
            if (typeof vars.prefix_color === "string" && vars.prefix_color) root.style.setProperty("--pc", vars.prefix_color);
            pre.textContent = txt(vars.prefix, "Start");
            fillSizer(el("wrd-sizer"), words);
            words.forEach(function (w, i) {
              var d = document.createElement("div");
              d.className = "wrd-face";
              d.textContent = w;
              d.style.transform = "rotateX(" + (i * ang) + "deg) translateZ(1.79em)";
              cyl.appendChild(d);
            });
            var base = num(vars.font_size, 56, 16, 240);
            function fit() { fitG(g, base, null, 0.88, 0.8); }
            fit();
            onFonts(fit);

            // remocn-scenes: spring({ damping: 15, stiffness: 150 }) per turn, 90 degrees per word.
            function draw(f) {
              var ci = Math.min(Math.floor(f / cd), fi);
              var cT = ci >= fi ? cd : f % cd;
              var rp = spring(cT * 28 / cd, { damping: 15, stiffness: 150 });
              var rot = ci >= fi ? fi * ang : ci * ang + rp * ang;
              cyl.style.transform = "rotateX(" + (-rot) + "deg)";
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
