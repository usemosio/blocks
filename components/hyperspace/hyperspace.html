<html
  lang="en"
  data-composition-id="hyperspace"
  data-composition-duration="1.8667"
  data-composition-variables='[
  {
    "id": "stars",
    "type": "number",
    "role": "style",
    "label": "Stars",
    "description": "Number of stars in the field.",
    "default": 260,
    "min": 40,
    "max": 600,
    "step": 10
  },
  {
    "id": "streak_color",
    "type": "color",
    "role": "style",
    "label": "Streak color",
    "description": "Main streak color.",
    "default": "#FFFFFF"
  },
  {
    "id": "accent_color",
    "type": "color",
    "role": "style",
    "label": "Accent color",
    "description": "Color of the occasional tinted streak.",
    "default": "#E5322D"
  },
  {
    "id": "accent_ratio",
    "type": "number",
    "role": "style",
    "label": "Accent ratio",
    "description": "Share of stars drawn in the accent color, 0 to 1.",
    "default": 0.14,
    "min": 0,
    "max": 1,
    "step": 0.02
  },
  {
    "id": "flash",
    "type": "boolean",
    "role": "style",
    "label": "Flash",
    "description": "White flash at the cut. Off gives a hard cut through the streaks.",
    "default": true
  },
  {
    "id": "flash_color",
    "type": "color",
    "role": "style",
    "label": "Flash color",
    "description": "Color of the flash.",
    "default": "#FFFFFF"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Hyperspace</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .hsp-stage { position: absolute; inset: 0; }
        .hsp-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .hsp-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .hsp-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .hsp-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .hsp-pa { background: #141318; }
        .hsp-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .hsp-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .hsp-stage { background: #000; }
        .hsp-wrap { position: absolute; inset: 0; overflow: hidden; background: #000; }
        .hsp-pa, .hsp-pb { z-index: 1; }
        .hsp-stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        .hsp-white { position: absolute; inset: 0; z-index: 3; opacity: 0; }

      </style>

      <div id="root" data-composition-id="hyperspace" data-duration="1.8667" data-fps="30">
        <div id="hsp-clip" class="hsp-stage clip" data-start="0" data-duration="1.8667" data-track-index="0">
          <div class="hsp-wrap"><div id="hsp-a" class="hsp-panel hsp-pa"><div class="hsp-in"><span>Scene A</span><i class="hsp-bar"></i></div></div>
          <div id="hsp-b" class="hsp-panel hsp-pb"><div class="hsp-in"><span>Scene B</span><i class="hsp-bar"></i></div></div>
          <svg id="hsp-stars" class="hsp-stars"></svg><div id="hsp-white" class="hsp-white"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 1.8667;

var count = Math.round(num(vars.stars, 260, 40, 600)), streakColor = str(vars.streak_color, "#FFFFFF"), accentColor = str(vars.accent_color, "#E5322D");
var accentRatio = num(vars.accent_ratio, 0.14, 0, 1), flash = vars.flash === false || vars.flash === "false" ? false : true, flashColor = str(vars.flash_color, "#FFFFFF");
var A = document.getElementById("hsp-a"), B = document.getElementById("hsp-b"), svg = document.getElementById("hsp-stars"), white = document.getElementById("hsp-white");
var W = root.clientWidth, H = root.clientHeight, cx = W / 2, cy = H / 2, diag = Math.sqrt(W * W + H * H) / 2, unit = Math.min(W, H) / 720;
var JUMP = 3.2, COAST = 1.1, CUT = 0.62, SPOOL = 0.22, MAX_TAIL = 0.94, NS = "http://www.w3.org/2000/svg";
svg.setAttribute("viewBox", "0 0 " + W + " " + H);
white.style.background = flashColor;
var rnd = mulberry32(31337), minLog = Math.log(Math.max(2, diag * 0.015)), maxLog = Math.log(diag), stars = [];
for (var i = 0; i < count; i++) {
  var ang = rnd() * Math.PI * 2, lr = minLog + rnd() * (maxLog - minLog), acc = rnd() < accentRatio, wt = rnd();
  var ln = document.createElementNS(NS, "line");
  ln.setAttribute("stroke", acc ? accentColor : streakColor); ln.setAttribute("stroke-linecap", "round");
  svg.appendChild(ln); stars.push({ a: ang, lr: lr, w: wt, el: ln, cos: Math.cos(ang), sin: Math.sin(ang) });
}
function travelAt(p) {
  if (p <= CUT) { var t = p / CUT; return { travel: SPOOL * t + (JUMP - SPOOL) * Math.pow(t, 4), speed: Math.pow(t, 3) }; }
  var q = (p - CUT) / (1 - CUT);
  return { travel: JUMP + COAST * (1 - (1 - q) * (1 - q)), speed: 0.7 * (1 - q) };
}
function field(progress, opacity, stride) {
  var tr = travelAt(progress), tail = Math.min(MAX_TAIL, 0.006 + MAX_TAIL * tr.speed * tr.speed);
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i], el = s.el;
    if (i % stride !== 0) { el.style.display = "none"; continue; }
    var r = Math.exp(s.lr + tr.travel), r0 = r * (1 - tail);
    if (r0 > diag * 1.05) { el.style.display = "none"; continue; }
    var near = Math.min(1, r / (diag * 0.12));
    el.style.display = "block";
    el.setAttribute("x1", cx + s.cos * r0); el.setAttribute("y1", cy + s.sin * r0);
    el.setAttribute("x2", cx + s.cos * r); el.setAttribute("y2", cy + s.sin * r);
    el.setAttribute("stroke-opacity", (0.25 + 0.75 * near) * opacity);
    el.setAttribute("stroke-width", (0.8 + s.w * 2.4 * near) * unit);
  }
}
var soft = bez(0.22, 1, 0.36, 1);
function frame(p) {
  if (p < CUT) {
    var t = Math.min(1, p / CUT);
    A.style.display = "flex"; B.style.display = "none";
    A.style.transform = "scale(" + (1 + 0.42 * Math.pow(t, 4)) + ")";
    A.style.filter = "brightness(" + interp(t, [0, 1], [1, 0.45], inQuad) + ")";
    field(Math.min(p, CUT), interp(t, [0, 0.45], [0, 1], function (x) { return x < 0.5 ? 2 * x * x : 1 - 2 * (1 - x) * (1 - x); }), 1);
    white.style.opacity = flash ? interp(t, [0.72, 1], [0, 1], inQuad) : 0;
  } else {
    var q = (p - CUT) / (1 - CUT);
    A.style.display = "none"; B.style.display = "flex";
    B.style.transform = "scale(" + interp(q, [0, 1], [1.06, 1], soft) + ")";
    var bl = interp(q, [0, 0.75], [Math.min(W, H) * 0.018, 0], soft);
    B.style.filter = bl > 0.1 ? "blur(" + bl + "px)" : "none";
    field(p, interp(q, [0, 0.45], [0.8, 0], outQuad), 5);
    white.style.opacity = flash ? (q < 0.03 ? 1 : Math.pow(1 - (q - 0.03) / 0.97, 4)) : 0;
  }
}

            drive("hyperspace", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
