<!doctype html>
<!--
  Breathing Text

  Letters flex between two variable-font settings (weight and slant) in a staggered, mirrored loop, so the word appears to breathe.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="breathing-text"
  data-composition-duration="6"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short phrase that breathes.", "default": "breathing text"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 120, "min": 24, "max": 400, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#111111"},
    {"id": "from_weight", "type": "number", "role": "style", "label": "From weight", "description": "Variable-font weight (wght axis) the letters start from.", "default": 100, "min": 100, "max": 1000, "step": 10},
    {"id": "to_weight", "type": "number", "role": "style", "label": "To weight", "description": "Weight the letters breathe to.", "default": 800, "min": 100, "max": 1000, "step": 10},
    {"id": "from_slant", "type": "number", "role": "style", "label": "From slant", "description": "Slant axis value (slnt, 0 is upright) the letters start from.", "default": 0, "min": -10, "max": 0, "step": 1, "unit": "deg"},
    {"id": "to_slant", "type": "number", "role": "style", "label": "To slant", "description": "Slant the letters breathe to.", "default": -10, "min": -10, "max": 0, "step": 1, "unit": "deg"},
    {"id": "breath_duration", "type": "number", "role": "motion", "label": "Breath duration", "description": "Seconds for one breath in or out.", "default": 1.5, "min": 0.2, "max": 6, "step": 0.1, "unit": "s"},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.08, "min": 0, "max": 0.5, "step": 0.01, "unit": "s"},
    {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of breathing starts.", "default": "first", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}]},
    {"id": "repeat_delay", "type": "number", "role": "motion", "label": "Repeat delay", "description": "Pause between a breath in and the breath back.", "default": 0.1, "min": 0, "max": 2, "step": 0.05, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Breathing Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #111111; font-family: "Roboto Flex", system-ui, sans-serif; }
        .bt-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .bt-line { line-height: 1.15; white-space: pre; text-align: center; }
        .bt-char { display: inline-block; white-space: pre; }
      </style>

      <div id="root" data-composition-id="breathing-text" data-duration="6" data-fps="30">
        <div id="bt-clip" class="bt-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="bt-line" class="bt-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short phrase that breathes.", "default": "breathing text"}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 120, "min": 24, "max": 400, "step": 1, "unit": "px"}, {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#111111"}, {"id": "from_weight", "type": "number", "role": "style", "label": "From weight", "description": "Variable-font weight (wght axis) the letters start from.", "default": 100, "min": 100, "max": 1000, "step": 10}, {"id": "to_weight", "type": "number", "role": "style", "label": "To weight", "description": "Weight the letters breathe to.", "default": 800, "min": 100, "max": 1000, "step": 10}, {"id": "from_slant", "type": "number", "role": "style", "label": "From slant", "description": "Slant axis value (slnt, 0 is upright) the letters start from.", "default": 0, "min": -10, "max": 0, "step": 1, "unit": "deg"}, {"id": "to_slant", "type": "number", "role": "style", "label": "To slant", "description": "Slant the letters breathe to.", "default": -10, "min": -10, "max": 0, "step": 1, "unit": "deg"}, {"id": "breath_duration", "type": "number", "role": "motion", "label": "Breath duration", "description": "Seconds for one breath in or out.", "default": 1.5, "min": 0.2, "max": 6, "step": 0.1, "unit": "s"}, {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.08, "min": 0, "max": 0.5, "step": 0.01, "unit": "s"}, {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of breathing starts.", "default": "first", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}]}, {"id": "repeat_delay", "type": "number", "role": "motion", "label": "Repeat delay", "description": "Pause between a breath in and the breath back.", "default": 0.1, "min": 0, "max": 2, "step": 0.05, "unit": "s"}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "6");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var line = document.getElementById("bt-line");
            var text = V("text") || "breathing text";
            var chars = fitText(text).map(function (ch, i) {
              var s = document.createElement("span");
              s.id = "bt-char-" + i; s.className = "bt-char"; s.textContent = ch;
              line.appendChild(s); return s;
            });
            line.setAttribute("aria-label", text);
            line.style.color = V("color");
            line.style.fontSize = "min(" + V("font_size") + "px, calc(90cqw / " + Math.max(1, chars.length * 0.62).toFixed(2) + "))";
            var w0 = V("from_weight"), w1 = V("to_weight"), s0 = V("from_slant"), s1 = V("to_slant");
            var dur = V("breath_duration"), rep = V("repeat_delay");
            var delays = stagger(chars.length, V("stagger_from"), V("stagger"));
            gsap.registerPlugin(CustomEase);
            var ez = CustomEase.create("bt-ease", "M0,0 C0.42,0 0.58,1 1,1");
            var tl = gsap.timeline({ paused: true });
            function draw(t) {
              for (var i = 0; i < chars.length; i++) {
                var tt = t - delays[i], p = 0;
                if (tt > 0) {
                  var period = dur + rep, k = Math.floor(tt / period), ph = tt - k * period;
                  var e = ez(Math.min(1, ph / dur));
                  p = k % 2 === 0 ? e : 1 - e;
                }
                chars[i].style.fontVariationSettings = "'wght' " + (w0 + (w1 - w0) * p).toFixed(1) + ", 'slnt' " + (s0 + (s1 - s0) * p).toFixed(2);
              }
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["breathing-text"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
