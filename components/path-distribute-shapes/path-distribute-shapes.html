<!doctype html>
<!--
  Path Distribute Shapes

  Hand-drawn letter outlines draw on, small squares pop onto every line, then slide along their paths so each lands at its own distributed point, shift colour and size in waves, round into dots, flatten into bars, converge on the centre as a line, and a headline rises from beneath it.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://codepen.io/PointC/pen/XWrYmGq

  to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
  copies of the Software, and to permit persons to whom the Software is
  furnished to do so, subject to the following conditions:

  The above copyright notice and this permission notice shall be included in all
  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
  IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
  FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
  AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
  LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  Changes by usemosio/blocks: the demo is sped up (every duration and stagger runs at 0.35 of the pen's) and fills the host frame; the pen's random colours become a seeded pick from a four-colour palette variable set, its GSAP green becomes the accent; the GSAP branding in the closing title and caption becomes variables; the avatar and logo images are dropped; white-on-dark becomes dark-on-white.
-->
<html
  lang="en"
  data-composition-id="path-distribute-shapes"
  data-composition-duration="10"
  data-composition-variables='[
    {"id":"title","type":"string","role":"content","label":"Closing title","description":"Headline that rises at the end.","default":"Rapi dan merata"},
    {"id":"caption","type":"string","role":"content","label":"Caption","description":"Small line under the letters.","default":"Jalur | Jeda | Merata | Selang | Acak"},
    {"id":"accent","type":"color","role":"style","label":"Accent","description":"Main shape colour, the dots and the underline.","default":"#2563eb"},
    {"id":"color_2","type":"color","role":"style","label":"Palette 2","description":"Second colour in the random picks.","default":"#0a0a0a"},
    {"id":"color_3","type":"color","role":"style","label":"Palette 3","description":"Third colour in the random picks.","default":"#93b4f8"},
    {"id":"color_4","type":"color","role":"style","label":"Palette 4","description":"Fourth colour in the random picks.","default":"#64748b"},
    {"id":"line_color","type":"color","role":"style","label":"Line color","description":"Colour of the letter outlines and the text.","default":"#0a0a0a"},
    {"id":"background","type":"color","role":"style","label":"Background","description":"Frame background.","default":"#ffffff"},
    {"id":"seed","type":"number","role":"motion","label":"Seed","description":"Changes the random colour picks.","default":11,"min":1,"max":9999,"step":1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Path Distribute Shapes</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
background: var(--pds-bg, #fff); font-family: Geist, system-ui, sans-serif;
        }
        .pds-stage {
          position: absolute;
          inset: 0;
        }

        #pds-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        #pds-svg text { font-family: Geist, system-ui, sans-serif; font-weight: 700; text-anchor: middle; }
      </style>

      <div id="root" data-composition-id="path-distribute-shapes" data-duration="10" data-fps="30">
        <div id="pds-clip" class="pds-stage clip" data-start="0" data-duration="10" data-track-index="0">
          <svg id="pds-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs><clipPath id="pds-clip"><rect x="250" y="219" width="500" height="80" /></clipPath></defs>
            <text id="pds-caption" transform="translate(500 340)" font-size="30" font-weight="600"></text>
            <g id="pds-letters" fill="none" stroke-miterlimit="10" stroke-width="3">
            <path d="M50.48,206V94.16h44c31.52,0,57.28,25.12,57.28,56C151.76,180.88,126,206,94.48,206Z" />
            <path d="M183.44,94.16V206" />
            <path d="M280.4,104.88c-7.2-4.64-18.24-7.52-28.16-7.52-19.68,0-32.48,8.48-32.48,21.6,0,37.44,67.2,18.24,66.88,59.84,0,16.48-14.88,27.2-37.92,27.2-14.08,0-29-6.24-38.24-15.68" />
            <path d="M341,206V97" />
            <path d="M300.5,97h80" />
            <path d="M406.5,206V97.36h34.85c25.12,0,39.52,12,39.52,33.12,0,21.6-14.4,33.92-39.52,33.92l-34.35.1" />
            <path d="M480.07,206,449.5,164.5" />
            <path d="M522,97V206" />
            <path d="M563.11,206V97h45c21.6,0,34.08,7.24,34.08,24.84,0,14.08-8,23.52-22.08,25.92,17.76,2.08,28,12.48,28,28.32,0,19-14.56,29.92-40,29.92Z" />
            <path d="M677.19,97v63.56c0,29,16.16,45.44,44.32,45.44s44.32-16.48,44.32-45.44V97" />
            <path d="M825,206V97" />
            <path d="M784.5,97h80" />
            <path d="M958,97H888.06V206h72.16" />
            <path d="M950.5,148.5h-62" />
            </g>
            <line id="pds-underline" x1="480" y1="300" x2="520" y2="300" stroke-width="2" opacity="0" />
            <g id="pds-container"></g>
            <g clip-path="url(#pds-clip)"><text id="pds-end" transform="translate(500 284)" font-size="48"></text></g>
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/DrawSVGPlugin.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 10;

            root.style.setProperty("--pds-bg", col(vars.background, "#ffffff"));
            var accent = col(vars.accent, "#2563eb"), ink = col(vars.line_color, "#0a0a0a");
            var palette = [accent, col(vars.color_2, "#0a0a0a"), col(vars.color_3, "#93b4f8"), col(vars.color_4, "#64748b")];
            var lettersG = document.getElementById("pds-letters");
            lettersG.setAttribute("stroke", ink);
            document.getElementById("pds-underline").setAttribute("stroke", accent);
            var cap = document.getElementById("pds-caption"), end = document.getElementById("pds-end");
            cap.setAttribute("fill", ink); end.setAttribute("fill", ink);
            cap.textContent = typeof vars.caption === "string" ? vars.caption : "Jalur | Jeda | Merata | Selang | Acak";
            end.textContent = str(vars.title, "Rapi dan merata");
            gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
            var rand = rng(Math.round(num(vars.seed, 11, 1, 9999)));
            var F = 0.35, size = 10, fillFactor = 0.65, NS = "http://www.w3.org/2000/svg";
            var paths = Array.prototype.slice.call(lettersG.querySelectorAll("path"));
            var container = document.getElementById("pds-container"), targets = [], arrays = [];
            paths.forEach(function (p) {
              var raw = MotionPathPlugin.getRawPath(p)[0];
              var len = p.getTotalLength();
              var count = Math.floor(len / size * fillFactor), local = [];
              for (var j = 0; j < count; j++) {
                var r = document.createElementNS(NS, "rect");
                container.appendChild(r);
                gsap.set(r, { x: raw[0], y: raw[1], fill: accent, attr: { rx: 0, ry: 0, x: 0, y: 0, width: size, height: size } });
                local.push(r); targets.push(r);
              }
              arrays.push(local);
            });
            gsap.set(targets, { xPercent: -50, yPercent: -50, transformOrigin: "50% 50%", scale: 0 });
            var tl = gsap.timeline({ paused: true });
            tl.addLabel("start", 0.3);
            tl.from(paths, { drawSVG: 0, duration: 1 * F, stagger: { each: 0.1 * F }, ease: "none" }, "start");
            tl.to(targets, { scale: 1, ease: "elastic", duration: 1.25 * F });
            arrays.forEach(function (arr) {
              tl.to(arr, { motionPath: { path: paths[arrays.indexOf(arr)], autoRotate: true, start: 0, end: gsap.utils.distribute({ base: 0, amount: 1 }) }, duration: 0.4 * F });
            });
            var picks = targets.map(function () { return palette[Math.floor(rand() * palette.length)]; });
            tl.to(targets, { fill: function (i) { return picks[i]; }, duration: 0.45 * F, ease: "none", stagger: { amount: 2 * F, from: "end" } });
            tl.to(targets, { scale: gsap.utils.wrap([1.3, 1.6, 1.9, 2.2]), duration: 0.35 * F, ease: "power3.inOut", stagger: { amount: 3 * F, yoyo: true, repeat: 1 } });
            tl.to(targets, { rotation: "+=360", duration: 0.75 * F, fill: accent, attr: { rx: size / 2, ry: size / 2 }, stagger: { amount: 3 * F, from: "end" } });
            tl.to(targets, { attr: { rx: 0, ry: 0 }, duration: 0.5 * F });
            tl.to(targets, { x: 500, y: 300, rotation: 0, attr: { height: 2, width: 40 }, duration: 0.5 * F, stagger: { amount: 1.3 * F, from: "center" } }, "+=" + 0.5 * F);
            tl.set(targets, { opacity: 0 });
            tl.set("#pds-underline", { opacity: 1 });
            tl.to("#pds-underline", { attr: { x1: 250, x2: 750 }, duration: 0.5 * 1.4, ease: "power3.inOut" });
            tl.from(end, { duration: 0.65, y: 340 });
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["path-distribute-shapes"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
