<html
  lang="en"
  data-composition-id="perspective-squeeze"
  data-composition-duration="7.5"
  data-composition-variables='[
    {"id": "upper_text", "type": "string", "role": "content", "label": "Upper line", "description": "Top line, set large.", "default": "STUDIO"},
    {"id": "lower_text", "type": "string", "role": "content", "label": "Lower line", "description": "Bottom line.", "default": "BEST"},
    {"id": "fill", "type": "color", "role": "style", "label": "Fill", "description": "Text color.", "default": "#f2f2f2"},
    {"id": "upper_font", "type": "string", "role": "style", "label": "Upper font", "description": "CSS font-family of the upper line. Anton is loaded.", "default": "Anton, Impact, &#39;Arial Narrow&#39;, sans-serif"},
    {"id": "lower_font", "type": "string", "role": "style", "label": "Lower font", "description": "CSS font-family of the lower line.", "default": "Anton, Impact, &#39;Arial Narrow&#39;, sans-serif"},
    {"id": "line_gap", "type": "number", "role": "style", "label": "Line gap", "description": "Gap between the two lines inside the block, in stage pixels (1920×1080 stage).", "default": 50, "min": 0, "max": 200, "step": 1, "unit": "px"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Perspective Squeeze</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .ps-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        .ps-block { position: absolute; width: 990px; height: 546px; transform-origin: 0 0; }
        .ps-block svg { display: block; overflow: hidden; }
      </style>

      <div id="root" data-composition-id="perspective-squeeze" data-duration="7.5" data-fps="30">
        <div id="ps-clip" class="clip" data-start="0" data-duration="7.5" data-track-index="0">
          <div id="ps-stage" class="ps-stage">
            <div id="ps-upper" class="ps-block" style="left:465px;top:41px"><svg width="990" height="546" viewBox="0 0 990 546"><text id="ps-upper-text" x="0" y="0"></text></svg></div>
            <div id="ps-lower" class="ps-block" style="left:465px;top:587px"><svg width="990" height="546" viewBox="0 0 990 546"><text id="ps-lower-text" x="0" y="0"></text></svg></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "7.5");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var stage = document.getElementById("ps-stage");
            var fill = col(vars.fill, "#f2f2f2");
            var gap = num(vars.line_gap, 50, 0, 200);
            var BW = 990, BH = 546;
            function setup(id, text, font, size) {
              var el = document.getElementById(id);
              el.textContent = text;
              el.setAttribute("fill", fill);
              el.setAttribute("font-family", font);
              el.setAttribute("font-size", size);
              el.setAttribute("textLength", BW);
              el.setAttribute("lengthAdjust", "spacingAndGlyphs");
              return el;
            }
            var upT = setup("ps-upper-text", str(vars.upper_text, "STUDIO"), str(vars.upper_font, "Anton, Impact, sans-serif"), 603);
            var loT = setup("ps-lower-text", str(vars.lower_text, "BEST"), str(vars.lower_font, "Anton, Impact, sans-serif"), 124);
            var upD = document.getElementById("ps-upper"), loD = document.getElementById("ps-lower");
            var rest = [[0, 0], [990, 0], [0, 546], [990, 546]];
            var upMid = [[0, -326], [990, 0], [0, 546], [990, 546]];
            var upEnd = [[0, 352], [990, -428], [460, 546], [990, 546]];
            var loMid = [[0, 0], [990, 0], [0, 225], [990, 546]];
            var loEnd = [[0, 0], [990, 0], [0, 897], [990, 116]];
            function pin(src, dst) {
              // Solve the 8x8 system for the homography that maps the four src corners onto dst.
              var a = [], rhs = [], i, c, r;
              for (i = 0; i < 4; i++) {
                var x = src[i][0], y = src[i][1], u = dst[i][0], v = dst[i][1];
                a.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); rhs.push(u);
                a.push([0, 0, 0, x, y, 1, -v * x, -v * y]); rhs.push(v);
              }
              for (var col2 = 0; col2 < 8; col2++) {
                var p = col2;
                for (r = col2 + 1; r < 8; r++) if (Math.abs(a[r][col2]) > Math.abs(a[p][col2])) p = r;
                var tmp = a[col2]; a[col2] = a[p]; a[p] = tmp;
                tmp = rhs[col2]; rhs[col2] = rhs[p]; rhs[p] = tmp;
                var d = a[col2][col2];
                if (Math.abs(d) < 1e-12) continue;
                for (c = col2; c < 8; c++) a[col2][c] /= d;
                rhs[col2] /= d;
                for (r = 0; r < 8; r++) {
                  if (r === col2) continue;
                  var fct = a[r][col2];
                  if (fct === 0) continue;
                  for (c = col2; c < 8; c++) a[r][c] -= fct * a[col2][c];
                  rhs[r] -= fct * rhs[col2];
                }
              }
              return "matrix3d(" + [rhs[0], rhs[3], 0, rhs[6], rhs[1], rhs[4], 0, rhs[7], 0, 0, 1, 0, rhs[2], rhs[5], 0, 1].join(",") + ")";
            }
            function lerpC(a, b, k) { return a.map(function (p, i) { return [p[0] + (b[i][0] - p[0]) * k, p[1] + (b[i][1] - p[1]) * k]; }); }
            var squish = ease("ps-squish", 0.6, 0, 0.4, 1);
            var SK = [0, 60, 118, 161, 196, 225];
            var lowerSY = [100, 384.8, 270, 330, 150, 100];
            var upperSY = [100, 35.8, 64, 45, 110, 100];
            function cornersAt(f, mid, end) {
              if (f <= 0) return rest;
              if (f >= 70) return end;
              if (f <= 45) return lerpC(rest, mid, squish(f / 45));
              return lerpC(mid, end, squish((f - 45) / 25));
            }
            var stageScale = Math.min(root.clientWidth / 1920, root.clientHeight / 1080);
            stage.style.transform = "translate(" + (root.clientWidth - 1920 * stageScale) / 2 + "px," + (root.clientHeight - 1080 * stageScale) / 2 + "px) scale(" + stageScale + ")";
            tick(function (t) {
              var f = t * 30;
              var us = kf(f, SK, upperSY, squish) / 100, ls = kf(f, SK, lowerSY, squish) / 100;
              var uh = 603 * 0.65 * us, lh = 124 * 0.65 * ls;
              var top = (BH - (uh + gap + lh)) / 2;
              var ub = top + uh, lb = ub + gap + lh;
              upT.setAttribute("y", ub); upT.setAttribute("transform", "matrix(1,0,0," + us + ",0," + ub * (1 - us) + ")");
              loT.setAttribute("y", lb); loT.setAttribute("transform", "matrix(1,0,0," + ls + ",0," + lb * (1 - ls) + ")");
              upD.style.transform = pin(rest, cornersAt(f, upMid, upEnd));
              loD.style.transform = pin(rest, cornersAt(f, loMid, loEnd));
            });
            var total = parseFloat(root.dataset.duration || "7.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["perspective-squeeze"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
