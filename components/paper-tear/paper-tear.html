<!doctype html>
<!--
  Paper Tear

  The outgoing scene is printed on paper that strains, rips down the middle with a jolt of the camera and a flash, and is flung apart in two torn halves with flying scraps, revealing the next scene.

<html
  lang="en"
  data-composition-id="paper-tear"
  data-composition-duration="1.2"
  data-composition-variables='[
  {
    "id": "impact",
    "type": "number",
    "role": "motion",
    "label": "Impact",
    "description": "Strength of the shake, flash and debris. 0 turns them off.",
    "default": 1,
    "min": 0,
    "max": 2,
    "step": 0.1
  },
  {
    "id": "roughness",
    "type": "number",
    "role": "style",
    "label": "Roughness",
    "description": "How jagged the rip is, 0 to 1.",
    "default": 0.5,
    "min": 0,
    "max": 1,
    "step": 0.05
  },
  {
    "id": "seed",
    "type": "number",
    "role": "style",
    "label": "Seed",
    "description": "Seed for the shape of the rip.",
    "default": 7,
    "min": 0,
    "max": 9999,
    "step": 1
  },
  {
    "id": "edge_color",
    "type": "color",
    "role": "style",
    "label": "Edge color",
    "description": "Color of the fibrous torn edge.",
    "default": "#FFFFFF"
  },
  {
    "id": "shadow_color",
    "type": "string",
    "role": "style",
    "label": "Shadow color",
    "description": "CSS color of the shadow the torn halves cast.",
    "default": "rgba(0, 0, 0, 0.45)"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Paper Tear</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .ptr-stage { position: absolute; inset: 0; }
        .ptr-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .ptr-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .ptr-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .ptr-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .ptr-pa { background: #141318; }
        .ptr-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .ptr-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .ptr-pb { z-index: 1; }
        .ptr-shell { position: absolute; inset: 0; z-index: 2; }
        .ptr-half, .ptr-fill { position: absolute; inset: 0; }
        .ptr-shard { position: absolute; display: none; }
        .ptr-flash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

      </style>

      <div id="root" data-composition-id="paper-tear" data-duration="1.2" data-fps="30">
        <div id="ptr-clip" class="ptr-stage clip" data-start="0" data-duration="1.2" data-track-index="0">
          <div id="ptr-src" style="display:none"><div id="ptr-a" class="ptr-panel ptr-pa"><div class="ptr-in"><span>Scene A</span><i class="ptr-bar"></i></div></div></div>
          <div id="ptr-b" class="ptr-panel ptr-pb"><div class="ptr-in"><span>Scene B</span><i class="ptr-bar"></i></div></div>
          <div id="ptr-shell" class="ptr-shell"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 1.2;

var impact = num(vars.impact, 1, 0, 2), roughness = num(vars.roughness, 0.5, 0, 1), seed = Math.round(num(vars.seed, 7, 0, 9999));
var edgeColor = str(vars.edge_color, "#FFFFFF"), shadowColor = str(vars.shadow_color, "rgba(0, 0, 0, 0.45)");
if (!/^[#a-z0-9(),.% ]+$/i.test(shadowColor)) shadowColor = "rgba(0, 0, 0, 0.45)";
var src = document.getElementById("ptr-a"), B = document.getElementById("ptr-b"), shell = document.getElementById("ptr-shell");
var W = root.clientWidth, H = root.clientHeight, unit = Math.min(W, H), pad = unit;
var STRAIN = 0.2, IMPACT = 0.28, SEGMENTS = 44, DEBRIS = 28, NS = "http://www.w3.org/2000/svg";
var rnd = mulberry32(seed * 7919 + 13), r = roughness;
var tilt = (rnd() - 0.5) * W * 0.08, pa = rnd() * Math.PI * 2, pb = rnd() * Math.PI * 2, fiber = unit * (0.008 + r * 0.012), tear = [];
for (var i = 0; i <= SEGMENTS; i++) {
  var t = i / SEGMENTS, wander = Math.sin(t * Math.PI * 2.2 + pa) * W * 0.025 + Math.sin(t * Math.PI * 5.3 + pb) * W * 0.012;
  var zig = (i % 2 === 0 ? 1 : -1) * rnd();
  tear.push({ x: W / 2 + tilt * (t - 0.5) + wander * (0.4 + r) + zig * unit * 0.022 * r, y: -unit * 0.05 + t * (H + unit * 0.1),
    left: fiber * (0.35 + rnd() * 1.3), right: fiber * (0.2 + rnd() * 0.9) });
}
var minX = Infinity, maxX = -Infinity;
tear.forEach(function (q) { minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); });
function mk(cls, parent) { var d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }
function clone() { var c = stripIds(src.cloneNode(true)); c.style.position = "absolute"; c.style.inset = "0"; return c; }
var whole = mk("ptr-fill", shell); whole.appendChild(clone()); whole.style.zIndex = 1;
function half(origin) {
  var h = mk("ptr-half", shell); h.style.transformOrigin = origin;
  var paper = mk("ptr-fill", h); paper.style.background = edgeColor;
  var print = mk("ptr-fill", h); print.appendChild(clone());
  return { h: h, paper: paper, print: print };
}
var L = half("0% 50%"), R = half("100% 50%");
var svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "ptr-flash"); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
var seam = tear.map(function (q) { return q.x + "," + q.y; }).join(" ");
function line() { var l = document.createElementNS(NS, "polyline"); l.setAttribute("points", seam); l.setAttribute("fill", "none"); l.setAttribute("stroke", edgeColor); l.setAttribute("stroke-linejoin", "round"); svg.appendChild(l); return l; }
var glow = line(), core = line(); shell.appendChild(svg);
var shards = [];
for (var s = 0; s < DEBRIS; s++) {
  var at = tear[Math.floor(rnd() * tear.length)], side = rnd() < 0.5 ? -1 : 1, pts = [];
  var vx = side * unit * (0.25 + rnd() * 0.9), vy = -unit * (0.1 + rnd() * 0.55), spin = (rnd() - 0.5) * 1440, size = unit * (0.008 + Math.pow(rnd(), 2) * 0.026);
  for (var k = 0; k < 4; k++) { var ang = k / 4 * Math.PI * 2 + rnd() * 1.2, dd = 0.55 + rnd() * 0.45; pts.push(Math.round(50 + Math.cos(ang) * 50 * dd) + "% " + Math.round(50 + Math.sin(ang) * 50 * dd) + "%"); }
  var el = mk("ptr-shard", shell); el.style.background = edgeColor; el.style.clipPath = "polygon(" + pts.join(",") + ")";
  shards.push({ el: el, x: at.x, y: at.y, vx: vx, vy: vy, spin: spin, size: size });
}
var ripEase = inQuad, peelFrames = 30;
function poly(a) { return "polygon(" + a.join(",") + ")"; }
function px(x, y) { return x + "px " + y + "px"; }
function frame(p) {
  var tt = p - IMPACT, shk = { x: 0, y: 0, amp: 0 };
  if (tt >= 0 && impact > 0) { var amp = unit * 0.03 * impact * Math.exp(-tt * 11); shk = { x: Math.sin(tt * 95) * amp, y: Math.cos(tt * 120 + 0.6) * amp * 0.7, amp: amp }; }
  B.style.transform = "translate(" + shk.x + "px, " + shk.y + "px) scale(" + interp(p, [IMPACT, 1], [1 + 0.1 * impact, 1], outCubic) + ")";
  var strain = interp(p, [0, STRAIN, IMPACT], [0, 1, 1], inCubic);
  var tremble = p < IMPACT ? Math.sin(p * 260) * unit * 0.004 * strain * impact : 0, lean = 1 + 0.025 * strain * (p < IMPACT ? 1 : 0);
  var front = -unit * 0.1 + ripEase(interp(p, [STRAIN, IMPACT], [0, 1])) * (H + unit * 0.25);
  shell.style.transform = "translate(" + (shk.x + tremble) + "px, " + shk.y + "px) scale(" + (lean + 2.2 * shk.amp / unit) + ")";
  function open(y) { return interp(front - y, [0, unit * 0.12], [0, 1]); }
  var edge = tear.map(function (q) { return px(q.x, q.y); });
  var lInk = tear.map(function (q) { return px(q.x - q.left * open(q.y), q.y); });
  var rInk = tear.map(function (q) { return px(q.x + q.right * open(q.y), q.y); });
  var lOut = [px(-pad, H + pad), px(-pad, -pad)], rOut = [px(W + pad, H + pad), px(W + pad, -pad)];
  L.paper.style.clipPath = poly(edge.concat(lOut)); L.print.style.clipPath = poly(lInk.concat(lOut));
  R.paper.style.clipPath = poly(edge.concat(rOut)); R.print.style.clipPath = poly(rInk.concat(rOut));
  if (front < H + unit * 0.05) {
    whole.style.display = "block";
    whole.style.clipPath = poly([px(-pad, front), px(W + pad, front), px(W + pad, H + pad), px(-pad, H + pad)]);
  } else whole.style.display = "none";
  var peel = spring(Math.max(0, (p - IMPACT) / (1 - IMPACT)) * peelFrames / 30, 15, 150, 0.8);
  var lt = (maxX + unit * 0.12) * 1.3, rt = (W - minX + unit * 0.12) * 1.3, curl = peel * 24, lens = "perspective(" + unit * 2.6 + "px)";
  var cast = interp(p, [IMPACT, IMPACT + 0.1], [0, 1]);
  var sh = cast > 0 ? "drop-shadow(0 " + unit * 0.012 * cast + "px " + unit * 0.04 * cast + "px " + shadowColor + ")" : "none";
  L.h.style.transform = lens + " translateX(" + -peel * lt + "px) rotateY(" + -curl + "deg)"; L.h.style.filter = sh;
  R.h.style.transform = lens + " translateX(" + peel * rt + "px) rotateY(" + curl + "deg)"; R.h.style.filter = sh;
  var flash = impact > 0 ? interp(p, [IMPACT - 0.03, IMPACT, IMPACT + 0.14], [0, 1, 0]) * Math.min(1, impact) : 0;
  svg.style.display = flash > 0.01 ? "block" : "none";
  glow.setAttribute("stroke-opacity", flash * 0.35); glow.setAttribute("stroke-width", unit * 0.06 * flash);
  core.setAttribute("stroke-opacity", flash); core.setAttribute("stroke-width", unit * 0.012);
  var age = p - IMPACT, dt = age * 1.1, grav = unit * 2.6;
  for (var i = 0; i < shards.length; i++) {
    var sd = shards[i], fade = interp(age, [0.35, 0.6], [1, 0]);
    if (impact <= 0 || age <= 0 || fade <= 0) { sd.el.style.display = "none"; continue; }
    var sz = sd.size * (0.5 + 0.5 * Math.min(1, impact)), x = sd.x + sd.vx * dt * impact, y = sd.y + sd.vy * dt * impact + 0.5 * grav * dt * dt;
    sd.el.style.display = "block"; sd.el.style.left = x - sz / 2 + "px"; sd.el.style.top = y - sz / 2 + "px";
    sd.el.style.width = sz + "px"; sd.el.style.height = sz + "px"; sd.el.style.opacity = fade; sd.el.style.transform = "rotate(" + sd.spin * dt + "deg)";
  }
}

            drive("paper-tear", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
