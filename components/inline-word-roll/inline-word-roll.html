<!doctype html>
<!--
  Inline Word Roll

  Switch words beside a fixed prefix with an accelerating vertical roll; the whole line recenters as word lengths change.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="inline-word-roll"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "prefix", "type": "string", "role": "content", "label": "Fixed text", "description": "Text that stays in place before the rolling word.", "default": "Looking for"},
    {"id": "text", "type": "string", "role": "content", "label": "Words", "description": "Words or phrases separated by |.", "default": "leads | customers | subscribers | appointments | demos | quotes | registrants | trials | conversions"},
    {"id": "suffix", "type": "string", "role": "content", "label": "Word suffix", "description": "Text attached to every word.", "default": "?"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels at full size. Wide lines scale down to fit.", "default": 60, "min": 16, "max": 260, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "700", "label": "Bold"}]},
    {"id": "interval", "type": "number", "role": "motion", "label": "Initial frames per word", "description": "Frames the first word holds (30 fps).", "default": 12, "min": 6, "max": 60, "step": 1, "unit": "frames"},
    {"id": "acceleration", "type": "number", "role": "motion", "label": "Interval multiplier", "description": "Each following hold is multiplied by this; 1 keeps a steady pace.", "default": 0.9, "min": 0.5, "max": 1, "step": 0.01},
    {"id": "transition_frames", "type": "number", "role": "motion", "label": "Roll duration", "description": "Frames each roll takes (30 fps).", "default": 6, "min": 1, "max": 20, "step": 1, "unit": "frames"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#f5f5f5"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Inline Word Roll</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .iwr-stage { position: absolute; inset: 0; overflow: hidden; font-family: Arimo, Arial, Helvetica, sans-serif; letter-spacing: -0.035em; line-height: 1.2; white-space: pre; }
        .iwr-measure { position: absolute; visibility: hidden; left: 0; top: 0; white-space: pre; }
        .iwr-measure span { display: inline-block; }
        .iwr-anchor { position: absolute; left: 50%; top: 50%; }
        .iwr-row { position: absolute; }
        .iwr-prefix { position: absolute; left: 0; top: 0; }
        .iwr-slot { position: absolute; top: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent); mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent); }
        .iwr-word { position: absolute; left: 0; top: 0; }
      </style>

      <div id="root" data-composition-id="inline-word-roll" data-duration="3.5" data-fps="30">
        <div id="iwr-clip" class="iwr-stage clip" data-start="0" data-duration="3.5" data-track-index="0">
          <div id="iwr-measure" class="iwr-measure"></div>
          <div id="iwr-anchor" class="iwr-anchor">
            <div id="iwr-row" class="iwr-row">
              <span id="iwr-prefix" class="iwr-prefix"></span>
              <div id="iwr-slot" class="iwr-slot"><span id="iwr-from" class="iwr-word"></span><span id="iwr-to" class="iwr-word"></span></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "3.5");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var stage = document.getElementById("iwr-clip");
            var prefix = typeof vars.prefix === "string" ? vars.prefix : "Looking for";
            var suffix = typeof vars.suffix === "string" ? vars.suffix : "?";
            var words = str(vars.text, "leads | customers | subscribers | appointments | demos | quotes | registrants | trials | conversions").split(/[|\n\r]+/).map(function (w) { return w.trim(); }).filter(Boolean);
            if (!words.length) words = ["leads"];
            var size = num(vars.font_size, 60, 16, 260);
            var interval = num(vars.interval, 12, 6, 60), accel = num(vars.acceleration, 0.9, 0.5, 1), trans = num(vars.transition_frames, 6, 1, 20);
            stage.style.color = col(vars.color, "#f5f5f5");
            stage.style.fontSize = size + "px";
            stage.style.fontWeight = pick(vars.font_weight, ["400", "700"], "400");
            var meas = document.getElementById("iwr-measure");
            var mp = document.createElement("span"); mp.textContent = prefix; meas.appendChild(mp);
            var mw = words.map(function (w) { var s = document.createElement("span"); s.textContent = w + suffix; meas.appendChild(s); return s; });
            var prefixW = mp.getBoundingClientRect().width;
            var widths = mw.map(function (s) { return s.getBoundingClientRect().width; });
            var rowH = size * 1.2, gap = prefix ? size * 0.23 : 0;
            var widest = prefixW + gap + Math.max.apply(null, widths);
            var fitS = Math.min(1, (root.clientWidth * 0.84) / Math.max(1, widest), (root.clientHeight * 0.5) / rowH);
            var anchor = document.getElementById("iwr-anchor"), row = document.getElementById("iwr-row"), slot = document.getElementById("iwr-slot");
            var elPrefix = document.getElementById("iwr-prefix"), elFrom = document.getElementById("iwr-from"), elTo = document.getElementById("iwr-to");
            anchor.style.transform = "scale(" + fitS + ")";
            row.style.height = rowH + "px"; row.style.top = -rowH / 2 + "px";
            elPrefix.textContent = prefix;
            slot.style.height = rowH + "px"; slot.style.left = prefixW + gap + "px";
            var rollEase = ease("iwr-roll", 0.22, 0.75, 0.25, 1);
            var pace = Math.max(trans, interval), rate = accel;
            function stateAt(f) {
              var start = 0;
              for (var index = 1; index < words.length; index++) {
                start += Math.max(trans, pace * Math.pow(rate, index - 1));
                if (f < start) return { from: index - 1, to: index - 1, p: 1 };
                if (f < start + trans) return { from: index - 1, to: index, p: Math.min(1, Math.max(0, (f - start) / trans)) };
              }
              var last = words.length - 1;
              return { from: last, to: last, p: 1 };
            }
            tick(function (t) {
              var st = stateAt(t * 30), moving = st.from !== st.to, p = rollEase(st.p);
              var fw = widths[st.from], tw = widths[st.to], slotW = fw + (tw - fw) * p;
              var total = prefixW + gap + slotW;
              row.style.left = -total / 2 + "px";
              slot.style.width = Math.max(fw, tw) + size * 0.12 + "px";
              elFrom.textContent = words[st.from] + suffix;
              elFrom.style.transform = "translateY(" + (moving ? -p * rowH : 0) + "px)";
              elFrom.style.opacity = moving ? 1 - Math.min(1, p * 1.2) : 1;
              elTo.style.display = moving ? "block" : "none";
              if (moving) {
                elTo.textContent = words[st.to] + suffix;
                elTo.style.transform = "translateY(" + (1 - p) * rowH + "px)";
                elTo.style.opacity = Math.min(1, p * 1.6);
              }
            });
            var total = parseFloat(root.dataset.duration || "3.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["inline-word-roll"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
