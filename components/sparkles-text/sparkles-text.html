<!doctype html>
<!--
  Sparkles Text

  Bold text with four-point stars that twinkle in and out at random spots over the letters, in two colours.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/magicuidesign/magicui/blob/166367b4e31a27f166fd6c2b71d7be290fe0c1bc/apps/www/registry/magicui/sparkles-text.tsx
  Changes by usemosio/blocks: the stars are drawn from a seeded generator and twinkle for the whole block (the source also moves each star to a new spot after 5 to 15 seconds).

<html
  lang="en"
  data-composition-id="sparkles-text"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The word or phrase the sparkles sit on.", "default": "Shine bright"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 120, "min": 12, "max": 280, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text colour", "description": "Colour of the letters.", "default": "#0a0a0a"},
    {"id": "color_first", "type": "color", "role": "style", "label": "Sparkle colour 1", "description": "First sparkle colour.", "default": "#9E7AFF"},
    {"id": "color_second", "type": "color", "role": "style", "label": "Sparkle colour 2", "description": "Second sparkle colour.", "default": "#FE8BBB"},
    {"id": "sparkles_count", "type": "number", "role": "motion", "label": "Sparkles", "description": "How many stars twinkle at once.", "default": 10, "min": 1, "max": 40, "step": 1},
    {"id": "sparkle_size", "type": "number", "role": "style", "label": "Sparkle size", "description": "Star size relative to the source, which draws 21 px stars beside 60 px text (1 = source).", "default": 1.6, "min": 0.5, "max": 4, "step": 0.1},
    {"id": "seed", "type": "number", "role": "motion", "label": "Seed", "description": "Changes where the stars appear.", "default": 7, "min": 1, "max": 9999, "step": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Sparkles Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700;800&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .spk-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .spk-wrap { position: relative; display: inline-block; font-family: var(--font-display, Geist, system-ui, sans-serif); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; white-space: pre; }
        .spk-star { position: absolute; opacity: 0; pointer-events: none; z-index: 20; }
      </style>

      <div id="root" data-composition-id="sparkles-text" data-duration="5" data-fps="30">
        <div id="spk-clip" class="spk-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <span id="spk-wrap" class="spk-wrap"><strong id="spk-text"></strong></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Shrink an element's font until it fits a share of the frame width.
            function fit(el, size, share) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * share);
              if (el.scrollWidth > max) {
                size = Math.max(12, size * (max / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            // A seeded random generator, so every seek draws the same thing.
            function mulberry32(a) {
              return function () {
                a |= 0; a = (a + 0x6d2b79f5) | 0;
                var t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
            gsap.registerPlugin(CustomEase);
            var TAG = "spk";
            var bezN = 0;
            function bez(x1, y1, x2, y2) {
              return CustomEase.create(TAG + "-" + bezN++, "M0,0 C" + x1 + "," + y1 + " " + x2 + "," + y2 + " 1,1");
            }
            var tl = gsap.timeline({ paused: true });
            function finish() {
              var total = parseFloat(root.dataset.duration || "5");
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["sparkles-text"] = tl;
            }

            var wrap = document.getElementById("spk-wrap");
            var textEl = document.getElementById("spk-text");
            var c1 = col(vars.color_first, "#9E7AFF");
            var c2 = col(vars.color_second, "#FE8BBB");
            var count = Math.round(num(vars.sparkles_count, 10, 1, 40));
            textEl.textContent = str(vars.text, "Shine bright");
            wrap.style.color = col(vars.color, "#0a0a0a");
            var size = fit(wrap, num(vars.font_size, 120, 12, 280), 0.9);
            // The source draws 21 px stars next to 60 px text (text-6xl); keep that ratio.
            var starPx = (21 * size) / 60 * num(vars.sparkle_size, 1.6, 0.5, 4);
            var rnd = mulberry32(Math.round(num(vars.seed, 7, 1, 9999)));
            var SPARK = "M9.82531 0.843845C10.0553 0.215178 10.9446 0.215178 11.1746 0.843845L11.8618 2.72026C12.4006 4.19229 12.3916 6.39157 13.5 7.5C14.6084 8.60843 16.8077 8.59935 18.2797 9.13822L20.1561 9.82534C20.7858 10.0553 20.7858 10.9447 20.1561 11.1747L18.2797 11.8618C16.8077 12.4007 14.6084 12.3916 13.5 13.5C12.3916 14.6084 12.4006 16.8077 11.8618 18.2798L11.1746 20.1562C10.9446 20.7858 10.0553 20.7858 9.82531 20.1562L9.13819 18.2798C8.59932 16.8077 8.60843 14.6084 7.5 13.5C6.39157 12.3916 4.19225 12.4007 2.72023 11.8618L0.843814 11.1747C0.215148 10.9447 0.215148 10.0553 0.843814 9.82534L2.72023 9.13822C4.19225 8.59935 6.39157 8.60843 7.5 7.5C8.60843 6.39157 8.59932 4.19229 9.13819 2.72026L9.82531 0.843845Z";
            var NS = "http://www.w3.org/2000/svg";
            var stars = [];
            for (var i = 0; i < count; i++) {
              var s = { x: rnd() * 100, y: rnd() * 100, color: rnd() > 0.5 ? c1 : c2, delay: rnd() * 2, scale: rnd() * 1 + 0.3 };
              rnd(); // lifespan in the source
              var svg = document.createElementNS(NS, "svg");
              svg.setAttribute("viewBox", "0 0 21 21");
              svg.setAttribute("width", starPx);
              svg.setAttribute("height", starPx);
              svg.setAttribute("class", "spk-star");
              svg.id = "spk-star-" + i;
              svg.style.left = s.x + "%";
              svg.style.top = s.y + "%";
              var p = document.createElementNS(NS, "path");
              p.setAttribute("d", SPARK);
              p.setAttribute("fill", s.color);
              svg.appendChild(p);
              wrap.appendChild(svg);
              s.el = svg;
              stars.push(s);
            }
            // Source: opacity [0,1,0], scale [0,s,0], rotate [75,120,150] over 0.8 s, repeating, ease-in-out per half.
            var inOut = bez(0.42, 0, 0.58, 1);
            var total = parseFloat(root.dataset.duration || "5");
            var clock = { t: 0 };
            function draw(t) {
              stars.forEach(function (s) {
                var u = t - s.delay;
                if (u < 0) { s.el.style.opacity = 0; return; }
                u = (u % 0.8) / 0.8;
                var first = u < 0.5;
                var h = inOut(first ? u / 0.5 : (u - 0.5) / 0.5);
                var op = first ? h : 1 - h;
                var sc = s.scale * op;
                var rot = first ? 75 + 45 * h : 120 + 30 * h;
                s.el.style.opacity = op.toFixed(3);
                s.el.style.transform = "rotate(" + rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")";
              });
            }
            tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);

            finish();
          })();
        </script>
      </div>
    </template>
  </body>
</html>
