<!doctype html>
<!--
  Split Line Reveal

  Two big left-aligned words arrive from opposite directions, one dropping in from above and one rising from below, while a rule draws across the gap and a thin vertical line grows at the right.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/lifeprompt-team/remotion-scenes/blob/02c7a84241da7010b5f59c420b0110aafd1d6f0d/src/scenes/TextAnimations/TextSplit.tsx

<html
  lang="en"
  data-composition-id="text-split"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text_top", "type": "string", "role": "content", "label": "Top text", "description": "First line, drops in from above.", "default": "SPLIT"},
    {"id": "text_bottom", "type": "string", "role": "content", "label": "Bottom text", "description": "Second line, rises from below.", "default": "REVEAL"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the text in pixels. Wide text shrinks to fit the frame.", "default": 140, "min": 30, "max": 400, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of both lines.", "default": "#0a0a0a"},
    {"id": "accent", "type": "color", "role": "style", "label": "Rule color", "description": "Color of the rule.", "default": "#2563eb"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Split Line Reveal</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .slr-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #0a0a0a); }
        .slr-stage { display: block; }
        .slr-t { position: absolute; left: 5.2%; font-weight: 800; letter-spacing: -0.0286em; line-height: 1; white-space: pre; transform: translateY(-50%); }
        .slr-rule { position: absolute; left: 5.2%; top: 50%; height: 0.0286em; width: 0; background: var(--ac, #2563eb); transform: translateY(-50%); }
        .slr-bar { position: absolute; right: 7.8%; top: 30%; width: 0.0214em; height: 0; background: #d4d4d4; }

      </style>

      <div id="root" data-composition-id="text-split" data-duration="3" data-fps="30">
        <div id="slr-clip" class="slr-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="slr-top" class="slr-t"></div>
          <div id="slr-rule" class="slr-rule"></div>
          <div id="slr-bot" class="slr-t"></div>
          <div id="slr-bar" class="slr-bar"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "3");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-split"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var stage = el("slr-clip"), top = el("slr-top"), bot = el("slr-bot"), rule = el("slr-rule"), bar = el("slr-bar");
            root.style.setProperty("--c", str(vars.color, "#0a0a0a"));
            root.style.setProperty("--ac", str(vars.accent, "#2563eb"));
            top.textContent = txt(vars.text_top, "SPLIT");
            bot.textContent = txt(vars.text_bottom, "REVEAL");
            var base = num(vars.font_size, 140, 30, 400);
            function fit() {
              stage.style.fontSize = base + "px";
              var w = Math.max(top.offsetWidth, bot.offsetWidth, 1);
              var k = Math.min(1, root.clientWidth * 0.76 / w);
              stage.style.fontSize = Math.max(6, base * k) + "px";
            }
            fit();
            onFonts(fit);

            // remocn-scenes: the top line travels 100 px down over 30 frames, the bottom one starts 5 frames
            // later and travels 100 px up over 30; the rule reaches 600 px at frame 50, the bar 300 px at 60.
            // Vertical places (35 % and 55 % tops of a 1080 frame) become em offsets from the middle.
            function draw(f) {
              var U = 140;
              var ty = ip(f, 0, 30, -100, 0, E.out), by = ip(f, 5, 35, 100, 0, E.out);
              top.style.top = "calc(50% - 0.55em)";
              bot.style.top = "calc(50% + 0.99em)";
              top.style.transform = "translateY(calc(-50% + " + (ty / U) + "em))";
              bot.style.transform = "translateY(calc(-50% + " + (by / U) + "em))";
              top.style.opacity = ip(f, 0, 20, 0, 1);
              bot.style.opacity = ip(f, 5, 25, 0, 1);
              rule.style.width = (ip(f, 20, 50, 0, 600, E.out) / U) + "em";
              bar.style.height = (ip(f, 30, 60, 0, 300, E.out) / U) + "em";
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
