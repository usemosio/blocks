const DEFAULT_STEP = 3;

const qf = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step) * step;

const qstep = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step);

const hash01 = (seed        )         => {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = Math.imul(h ^ (h >>> 13), 2246822519);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

const hashRange = (seed        , lo        , hi        )         =>
  lo + hash01(seed) * (hi - lo);

                                                           

const paperJitter = (
  frame        ,
  seed        ,
  options                                                   ,
)         => {
  const amp = options?.amp ?? 1.4;
  const rotAmp = options?.rotAmp ?? 0.35;
  const s = qstep(frame, options?.step ?? DEFAULT_STEP);
  return {
    x: hashRange(`${seed}:x:${s}`, -amp, amp),
    y: hashRange(`${seed}:y:${s}`, -amp, amp),
    rot: hashRange(`${seed}:r:${s}`, -rotAmp, rotAmp),
  };
};

const steppedSpring = (args   
                
              
                 
                
                                                                   
 )         =>
  spring({
    frame: qf(
      Math.max(0, args.frame - (args.delay ?? 0)),
      args.step ?? DEFAULT_STEP,
    ),
    fps: args.fps,
    config: args.config,
  });

const steppedRamp = (
  frame        ,
  from        ,
  to        ,
  options                                                  ,
)         => {
  const f = qf(frame, options?.step ?? DEFAULT_STEP);
  if (f <= from) return 0;
  if (f >= to) return 1;
  const ease = options?.ease ?? ((t        ) => t);
  return ease((f - from) / (to - from));
};

            

const GRAIN_RATIO = 0.5;
const GRAIN_FREQUENCY = 0.7;
const GRAIN_OCTAVES = 3;

                                                  

                          
                      
                    
                   
  

function brushHalfWidth(taper            , t        )         {
  const pressure = taper.pressure ?? 0.2;
  const release = taper.release ?? 1;
  return (taper.strokeWidth / 2) * (pressure + (release - pressure) * t);
}

function brushGrainScale(strokeWidth        , grain        )         {
  return strokeWidth * GRAIN_RATIO * grain;
}

function brushReach(strokeWidth        , grain        )         {
  return strokeWidth / 2 + brushGrainScale(strokeWidth, grain) / 2;
}

function brushFilterId(
  seed        ,
  strokeWidth        ,
  grain        ,
)         {
  return `remocn-brush-${Math.floor(hash01(`${seed}:${strokeWidth}:${grain}`) * 1e9)}`;
}

function sampleCubic(
  from            ,
  c1            ,
  c2            ,
  to            ,
  points = 32,
)               {
  const count = Math.max(2, points);
  return Array.from({ length: count }, (_, i) => {
    const t = i / (count - 1);
    const u = 1 - t;
    const a = u * u * u;
    const b = 3 * u * u * t;
    const c = 3 * u * t * t;
    const d = t * t * t;
    return {
      x: a * from.x + b * c1.x + c * c2.x + d * to.x,
      y: a * from.y + b * c1.y + c * c2.y + d * to.y,
    };
  });
}

function sampleLine(
  from            ,
  to            ,
  points = 8,
)               {
  const count = Math.max(2, points);
  return Array.from({ length: count }, (_, i) => {
    const t = i / (count - 1);
    return {
      x: from.x + (to.x - from.x) * t,
      y: from.y + (to.y - from.y) * t,
    };
  });
}

const normalAt = (points              , i        )             => {
  const before = points[i - 1] ?? points[i];
  const after = points[i + 1] ?? points[i];
  const tx = after.x - before.x;
  const ty = after.y - before.y;
  const length = Math.hypot(tx, ty) || 1;
  return { x: -ty / length, y: tx / length };
};

const curveSegments = (points              )         =>
  points
    .slice(0, -1)
    .map((p1, i) => {
      const p0 = points[i - 1] ?? p1;
      const p2 = points[i + 1];
      const p3 = points[i + 2] ?? p2;
      return `C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
    })
    .join(" ");

function brushRibbon(
  spine              ,
  options                                    ,
)         {
  const progress = options.progress ?? 1;
  const drawn = Math.max(2, Math.round(progress * (spine.length - 1)) + 1);

  const left               = [];
  const right               = [];
  for (let i = 0; i < drawn; i++) {
    const half = brushHalfWidth(options, i / (spine.length - 1));
    const normal = normalAt(spine, i);
    left.push({
      x: spine[i].x + normal.x * half,
      y: spine[i].y + normal.y * half,
    });
    right.push({
      x: spine[i].x - normal.x * half,
      y: spine[i].y - normal.y * half,
    });
  }
  const back = right.slice().reverse();

  return `M ${left[0].x} ${left[0].y} ${curveSegments(left)} L ${back[0].x} ${back[0].y} ${curveSegments(back)} Z`;
}


            

const HEAD_ANGLE = 0.72;
const SHAFT_SAMPLES = 40;
const ARM_SAMPLES = 10;
const ARM_TAPER = 0.6;
const ARM_OVERSHOOT = 0.16;
const HEAD_MIN_RATIO = 2.6;

                                       

function inkArrowControls(
  from               ,
  to               ,
  curvature        ,
  seed        ,
)                                           {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const distance = Math.hypot(dx, dy) || 1;
  const normalX = -dy / distance;
  const normalY = dx / distance;
  const bow = curvature * distance;
  const wobble = distance * 0.06;

  const at = (t        , key        )                => ({
    x:
      from.x +
      dx * t +
      normalX * bow +
      hashRange(`${seed}:${key}:x`, -wobble, wobble),
    y:
      from.y +
      dy * t +
      normalY * bow +
      hashRange(`${seed}:${key}:y`, -wobble, wobble),
  });

  return { c1: at(0.3, "c1"), c2: at(0.7, "c2") };
}

function inkArrowHead(
  c2               ,
  to               ,
  headSize        ,
)                                                {
  const dx = to.x - c2.x;
  const dy = to.y - c2.y;
  const length = Math.hypot(dx, dy) || 1;
  const backX = -dx / length;
  const backY = -dy / length;

  const arm = (angle        )                => ({
    x: to.x + headSize * (backX * Math.cos(angle) - backY * Math.sin(angle)),
    y: to.y + headSize * (backX * Math.sin(angle) + backY * Math.cos(angle)),
  });

  return { left: arm(HEAD_ANGLE), right: arm(-HEAD_ANGLE) };
}

function inkArrowArmWidth(strokeWidth        , release        )         {
  return strokeWidth * release;
}

function inkArrowApex(
  c2               ,
  to               ,
  reach        ,
)                {
  const dx = to.x - c2.x;
  const dy = to.y - c2.y;
  const length = Math.hypot(dx, dy) || 1;
  return {
    x: to.x + (dx / length) * reach * ARM_OVERSHOOT,
    y: to.y + (dy / length) * reach * ARM_OVERSHOOT,
  };
}

function inkArrowHeadReach(
  headSize        ,
  strokeWidth        ,
)         {
  return Math.max(headSize, strokeWidth * HEAD_MIN_RATIO);
}

function inkArrowViewport(
  from               ,
  to               ,
  curvature        ,
  headSize        ,
  strokeWidth        ,
  grain = 1,
)                                    {
  const distance = Math.hypot(to.x - from.x, to.y - from.y);
  const margin =
    inkArrowHeadReach(headSize, strokeWidth) +
    Math.abs(curvature) * distance +
    brushReach(strokeWidth, grain);
  return {
    width: Math.max(margin, Math.max(from.x, to.x) + margin),
    height: Math.max(margin, Math.max(from.y, to.y) + margin),
  };
}

              var leftArm = steppedRamp(frame, headStart, headMid, { step: step });
              var rightArm = steppedRamp(frame, headMid, headStart + headDur, { step: step });
              svg.style.opacity = progress > 0 ? 1 : 0;
              shaft.setAttribute("d", progress > 0 ? brushRibbon(spine, { strokeWidth: strokeWidth, pressure: pressure, release: release, progress: progress }) : "");
              leftP.setAttribute("d", leftArm > 0 ? armRibbon(head.left, leftArm) : "");
              rightP.setAttribute("d", rightArm > 0 ? armRibbon(head.right, rightArm) : "");
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 150, draw, 1);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["ink-arrow"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
