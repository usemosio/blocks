<html
  lang="en"
  data-composition-id="shader-spiral-pass"
  data-composition-duration="2.4"
  data-composition-variables='[
  {
    "id": "spirals",
    "type": "number",
    "role": "style",
    "label": "Spirals",
    "description": "Number of spiral ribbons around the tunnel.",
    "default": 3,
    "min": 1,
    "max": 6,
    "step": 1
  },
  {
    "id": "twist",
    "type": "number",
    "role": "style",
    "label": "Twist",
    "description": "How strongly the ribbons wind.",
    "default": 0.7,
    "min": 0,
    "max": 2,
    "step": 0.05
  },
  {
    "id": "zoom",
    "type": "number",
    "role": "motion",
    "label": "Zoom",
    "description": "Magnification reached while passing through the center.",
    "default": 14,
    "min": 2,
    "max": 24,
    "step": 1
  },
  {
    "id": "softness",
    "type": "number",
    "role": "style",
    "label": "Softness",
    "description": "Feather of the revealing aperture, as a fraction of the shorter side.",
    "default": 0.12,
    "min": 0.02,
    "max": 0.3,
    "step": 0.01
  },
  {
    "id": "speed",
    "type": "number",
    "role": "motion",
    "label": "Speed",
    "description": "Multiplier for the tunnel’s own motion.",
    "default": 1,
    "min": 0,
    "max": 5,
    "step": 0.1
  },
  {
    "id": "time_offset",
    "type": "number",
    "role": "motion",
    "label": "Time offset",
    "description": "Starting shader time in seconds.",
    "default": 0,
    "min": -100,
    "max": 100,
    "step": 0.5,
    "unit": "s"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shader Spiral Pass</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .ssp-stage { position: absolute; inset: 0; }
        .ssp-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .ssp-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .ssp-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .ssp-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .ssp-pa { background: #141318; }
        .ssp-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .ssp-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .ssp-field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; }
        .ssp-pa { z-index: 1; } .ssp-pb { z-index: 3; }

      </style>

      <div id="root" data-composition-id="shader-spiral-pass" data-duration="2.4" data-fps="30">
        <div id="ssp-clip" class="ssp-stage clip" data-start="0" data-duration="2.4" data-track-index="0">
          <div id="ssp-a" class="ssp-panel ssp-pa"><div class="ssp-in"><span>Scene A</span><i class="ssp-bar"></i></div></div>
          <div id="ssp-b" class="ssp-panel ssp-pb"><div class="ssp-in"><span>Scene B</span><i class="ssp-bar"></i></div></div>
          <canvas id="ssp-field" class="ssp-field"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

function hex(c, f) {
  c = String(c || "").trim().replace("#", "");
  if (c.length === 3) c = c.split("").map(function (x) { return x + x; }).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(c)) c = f || "000000";
  var n = parseInt(c, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function palette(v, fallback) {
  var list = String(v || fallback).split(",").map(function (s) { return hex(s, "808080"); });
  return list.length ? list : [hex(fallback)];
}
function hash2(x, y, s) {
  var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  var sum = 0, amp = 0.5, tot = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x, y, s + i * 17);
    tot += amp; x = x * 2.03 + 11.3; y = y * 2.03 - 7.1; amp *= 0.5;
  }
  return sum / tot;
}
function mixc(o, a, b, t) {
  o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t;
}
// ramp through a list of colours with t in 0..1
function ramp(o, list, t) {
  t = clamp01(t) * (list.length - 1);
  var i = Math.min(list.length - 2, Math.floor(t));
  if (list.length === 1) { o[0] = list[0][0]; o[1] = list[0][1]; o[2] = list[0][2]; return; }
  var f = t - i; f = f * f * (3 - 2 * f);
  mixc(o, list[i], list[i + 1], f);
}
// Low-resolution 2D canvas filled per pixel; fn(u, v, out) gets centred coordinates (v spans -0.5..0.5).
function makeField(canvas, cell) {
  var W = Math.max(8, Math.round(root.clientWidth / cell)), H = Math.max(8, Math.round(root.clientHeight / cell));
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var img = ctx.createImageData(W, H);
  var out = [0, 0, 0];
  return {
    W: W, H: H,
    paint: function (fn) {
      var d = img.data, i = 0;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          fn((x + 0.5 - W / 2) / H, (y + 0.5 - H / 2) / H, out, x, y);
          d[i++] = out[0]; d[i++] = out[1]; d[i++] = out[2]; d[i++] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
  };
}

            var D = 2.4;

var spirals = Math.round(num(vars.spirals, 3, 1, 6)), twist = num(vars.twist, 0.7, 0, 2), zoomMax = num(vars.zoom, 14, 2, 24);
var soft = num(vars.softness, 0.12, 0.02, 0.3), speed = num(vars.speed, 1, 0, 5), offset = num(vars.time_offset, 0, -100, 100);
var A = document.getElementById("ssp-a"), B = document.getElementById("ssp-b"), canvas = document.getElementById("ssp-field");
var W = root.clientWidth, H = root.clientHeight, diag = Math.sqrt(W * W + H * H) / 2;
var cv = makeField(canvas, 4), NEON = [[90, 50, 235], [225, 70, 215], [70, 215, 255]];
function frame(p) {
  var dive = clamp01((p - 0.08) / 0.84), zoom = Math.exp(Math.log(zoomMax) * dive * dive);
  var cover = smooth(0, 0.18, p), showNext = p >= 0.2, aperture = Math.pow(smooth(0.64, 1, p), 2);
  var t = offset + p * D * (1 + 0.8 * p * p) * speed;
  cv.paint(function (u, v, o) {
    var r = Math.sqrt(u * u + v * v) / zoom + 1e-4, a = Math.atan2(v, u), lg = Math.log(r);
    var ph = a * spirals + twist * 2.4 * lg - t * 1.1;
    var line = Math.pow(0.5 + 0.5 * Math.cos(ph), 5);
    var ring = 0.5 + 0.5 * Math.cos(lg * 7 - t * 1.6);
    var b = line * (0.5 + 0.7 * ring), h = lg * 0.3 + a / 6.2832 + t * 0.04;
    var glow = 0.12 + b * 1.5 + 0.35 * Math.exp(-r * 7);
    ramp(o, NEON, 0.5 + 0.5 * Math.cos(6.2832 * h));
    o[0] = 8 + o[0] * glow; o[1] = 6 + o[1] * glow; o[2] = 20 + o[2] * glow;
  });
  canvas.style.opacity = cover;
  A.style.visibility = showNext ? "hidden" : "visible";
  A.style.scale = 1 + 0.5 * smooth(0, 0.22, p);
  var feather = Math.min(W, H) * soft, radius = (diag + feather) * aperture, edge = Math.min(feather, radius * 0.12);
  var mask = "radial-gradient(circle at center, black " + Math.max(0, radius - edge) + "px, transparent " + radius + "px)";
  B.style.visibility = showNext ? "visible" : "hidden";
  B.style.opacity = smooth(0.64, 0.72, p);
  B.style.webkitMaskImage = mask; B.style.maskImage = mask;
  B.style.scale = 1 + 0.12 * (1 - smooth(0.55, 1, p));
}

            drive("shader-spiral-pass", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
