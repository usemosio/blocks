<html
  lang="en"
  data-composition-id="life-grid"
  data-composition-duration="10"
  data-composition-variables='[
    {"id": "cols", "type": "number", "role": "style", "label": "Columns", "description": "Columns of cells; rows follow the frame aspect ratio.", "default": 48, "min": 12, "max": 96, "step": 2},
    {"id": "density", "type": "number", "role": "style", "label": "Density", "description": "Share of cells alive in the seeded first generation.", "default": 0.24, "min": 0.05, "max": 0.6, "step": 0.01},
    {"id": "frames_per_generation", "type": "number", "role": "motion", "label": "Frames per generation", "description": "Frames each generation is held.", "default": 5, "min": 1, "max": 15, "step": 1, "unit": "frames"},
    {"id": "gap", "type": "number", "role": "style", "label": "Gap", "description": "Gap between tiles, as a fraction of the cell.", "default": 0.16, "min": 0, "max": 0.4, "step": 0.01},
    {"id": "show_grid", "type": "boolean", "role": "style", "label": "Lattice", "description": "Draw the faint lattice of empty cells.", "default": true},
    {"id": "seed", "type": "number", "role": "style", "label": "Seed", "description": "Changes the first generation.", "default": 7, "min": 1, "max": 50, "step": 1},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed of the simulation.", "default": 1, "min": 0.1, "max": 4, "step": 0.1},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Background color.", "default": "#111111"},
    {"id": "color", "type": "color", "role": "style", "label": "Cells", "description": "Living cell color.", "default": "#FFFFFF"},
    {"id": "accent", "type": "color", "role": "style", "label": "Newborns", "description": "Flash color for newborn cells.", "default": "#E5322D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Life Grid</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #111111; }
        .lg-stage { position: absolute; inset: 0; }
        .lg-stage svg { display: block; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="life-grid" data-duration="10" data-fps="30">
        <div id="lg-clip" class="lg-stage clip" data-start="0" data-duration="10" data-track-index="0">
          <svg id="lg-svg" role="img" aria-label="Game of Life grid">
            <path id="lg-lattice" />
            <path id="lg-fresh" />
            <path id="lg-alive" />
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            var FPS = 30;
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;

            // Seeded random in [0, 1): a string hash, so the same key always gives the same value.
            function rnd(key) {
              var h = 1779033703 ^ key.length;
              for (var i = 0; i < key.length; i++) {
                h = Math.imul(h ^ key.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
              }
              h = Math.imul(h ^ (h >>> 16), 2246822507);
              h = Math.imul(h ^ (h >>> 13), 3266489909);
              h ^= h >>> 16;
              return (h >>> 0) / 4294967296;
            }

            // Piecewise-linear map of x from inR to outR, optionally eased per segment and clamped.
            function interp(x, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var i = 0;
              if (x >= inR[n - 1]) i = n - 2;
              else if (x > inR[0]) { while (x > inR[i + 1]) i++; }
              var t = (x - inR[i]) / (inR[i + 1] - inR[i]);
              if (o.clamp !== false) t = Math.min(1, Math.max(0, t));
              if (o.easing) t = o.easing(t);
              return outR[i] + (outR[i + 1] - outR[i]) * t;
            }
            function clamp01(t) { return Math.min(1, Math.max(0, t)); }

            // Easings with Remotion's names; every one maps 0..1 to 0..1.
            var E = {
              linear: function (t) { return t; },
              quad: function (t) { return t * t; },
              cubic: function (t) { return t * t * t; },
              sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
              back: function (s) { return function (t) { return t * t * ((s + 1) * t - s); }; },
              out: function (f) { return function (t) { return 1 - f(1 - t); }; },
              inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; },
              bezier: function (x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var k = 0; k < 24; k++) {
                    var mt = 1 - t;
                    var bx = 3 * mt * mt * t * x1 + 3 * mt * t * t * x2 + t * t * t;
                    if (bx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var m = 1 - t;
                  return 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t;
                };
              }
            };

            function fmt(n) { return Math.round(n * 10) / 10; }

            var SVGNS = "http://www.w3.org/2000/svg";
            function el(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }

            var tl = gsap.timeline({ paused: true });
            // Runs draw(frame) from the timeline so seeking to a time always draws the same picture.
            function drive(frames, draw) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
              draw(0);
            }

            var cols = Math.round(num(vars.cols, 48, 12, 96));
            var density = num(vars.density, 0.24, 0.05, 0.6);
            var fpg = Math.max(1, Math.round(num(vars.frames_per_generation, 5, 1, 15)));
            var gap = num(vars.gap, 0.16, 0, 0.4);
            var showGrid = bool(vars.show_grid, true);
            var seed = Math.round(num(vars.seed, 7, 1, 50));
            var speed = num(vars.speed, 1, 0.1, 4);
            root.style.background = str(vars.background, "#111111");
            var color = str(vars.color, "#FFFFFF");
            var accent = str(vars.accent, "#E5322D");

            var svg = document.getElementById("lg-svg");
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            document.getElementById("lg-lattice").setAttribute("fill", color);
            document.getElementById("lg-lattice").setAttribute("fill-opacity", "0.05");
            document.getElementById("lg-fresh").setAttribute("fill", accent);
            document.getElementById("lg-alive").setAttribute("fill", color);
            var pLattice = document.getElementById("lg-lattice"), pFresh = document.getElementById("lg-fresh"), pAlive = document.getElementById("lg-alive");

            var nx = cols, ny = Math.max(4, Math.round((nx * H) / W));
            var durationFrames = Math.round(parseFloat(root.dataset.duration || "10") * FPS);
            var count = Math.ceil((durationFrames * speed) / fpg) + 2;

            // Every generation, computed up front from the seed alone (the grid wraps around its edges).
            var gens = [];
            var first = new Uint8Array(nx * ny);
            for (var i = 0; i < first.length; i++) first[i] = rnd("life-grid-" + seed + "-" + i) < density ? 1 : 0;
            gens.push(first);
            while (gens.length < count) {
              var prev = gens[gens.length - 1], next = new Uint8Array(nx * ny);
              for (var y = 0; y < ny; y++) {
                for (var x = 0; x < nx; x++) {
                  var n = 0;
                  for (var dy = -1; dy <= 1; dy++) {
                    for (var dx = -1; dx <= 1; dx++) {
                      if (dx === 0 && dy === 0) continue;
                      n += prev[((y + dy + ny) % ny) * nx + ((x + dx + nx) % nx)];
                    }
                  }
                  var alive = prev[y * nx + x] === 1;
                  next[y * nx + x] = n === 3 || (alive && n === 2) ? 1 : 0;
                }
              }
              gens.push(next);
            }

            var cell = Math.min(W / nx, H / ny);
            var ox = (W - cell * nx) / 2, oy = (H - cell * ny) / 2;
            var tile = cell * (1 - gap);
            var grow = E.out(E.back(2)), shrink = E.cubic, settle = E.inOut(E.cubic);
            function square(index, size) {
              var x = ox + (index % nx) * cell + (cell - size) / 2;
              var y = oy + Math.floor(index / nx) * cell + (cell - size) / 2;
              var s = fmt(size);
              return "M " + fmt(x) + " " + fmt(y) + " h " + s + " v " + s + " h " + -s + " Z ";
            }
            var lattice = "";
            if (showGrid) for (var c = 0; c < nx * ny; c++) lattice += square(c, tile);
            pLattice.setAttribute("d", lattice);

            function draw(frame) {
              var time = Math.max(0, frame * speed);
              var g = Math.min(gens.length - 1, Math.floor(time / fpg));
              var local = Math.min(1, (time - g * fpg) / fpg);
              var now = gens[g], before = g > 0 ? gens[g - 1] : now;
              var bornSize = tile * (0.35 + 0.65 * grow(local));
              var dyingSize = tile * (1 - shrink(Math.min(1, local * 1.6)));
              // Newborns pop in as accent tiles, then a tile in the cell color grows from their centre.
              var coreSize = tile * settle(clamp01((local - 0.35) / 0.65));
              var alivePath = "", fresh = "";
              for (var i = 0; i < now.length; i++) {
                if (now[i]) {
                  if (!before[i] && g > 0) {
                    fresh += square(i, bornSize);
                    if (coreSize > 0.5) alivePath += square(i, coreSize);
                  } else alivePath += square(i, tile);
                } else if (before[i] && dyingSize > 0.5) alivePath += square(i, dyingSize);
              }
              pFresh.setAttribute("d", fresh);
              pAlive.setAttribute("d", alivePath);
            }
            drive(durationFrames, draw);

            var total = parseFloat(root.dataset.duration || "10");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["life-grid"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
