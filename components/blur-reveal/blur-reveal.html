<html
  lang="en"
  data-composition-id="blur-reveal"
  data-composition-duration="3"
  data-composition-variables='[
    [
      {
        "id": "label_a",
        "type": "string",
        "role": "content",
        "label": "Panel A title",
        "description": "Headline of the outgoing panel.",
        "default": "Before"
      },
      {
        "id": "sub_a",
        "type": "string",
        "role": "content",
        "label": "Panel A text",
        "description": "Supporting line of the outgoing panel.",
        "default": "A busy, scattered start."
      },
      {
        "id": "label_b",
        "type": "string",
        "role": "content",
        "label": "Panel B title",
        "description": "Headline of the incoming panel.",
        "default": "After"
      },
      {
        "id": "sub_b",
        "type": "string",
        "role": "content",
        "label": "Panel B text",
        "description": "Supporting line of the incoming panel.",
        "default": "Calm, clear and focused."
      },
      {
        "id": "color_a",
        "type": "color",
        "role": "style",
        "label": "Panel A color",
        "description": "Background of the outgoing panel.",
        "default": "#1d4ed8"
      },
      {
        "id": "color_b",
        "type": "color",
        "role": "style",
        "label": "Panel B color",
        "description": "Background of the incoming panel.",
        "default": "#0f766e"
      },
      {
        "id": "text_color",
        "type": "color",
        "role": "style",
        "label": "Text color",
        "description": "Colour of the panel text.",
        "default": "#ffffff"
      },
      {
        "id": "font_size",
        "type": "number",
        "role": "style",
        "label": "Font size",
        "description": "Panel headline size in pixels.",
        "default": 96,
        "min": 24,
        "max": 260,
        "step": 1,
        "unit": "px"
      },
      {
        "id": "font",
        "type": "enum",
        "role": "style",
        "label": "Font",
        "description": "Typeface.",
        "default": "geist",
        "options": [
          {
            "value": "geist",
            "label": "Geist"
          },
          {
            "value": "poppins",
            "label": "Poppins"
          },
          {
            "value": "playfair",
            "label": "Playfair Display"
          },
          {
            "value": "grotesk",
            "label": "Space Grotesk"
          }
        ]
      },
      {
        "id": "max_blur",
        "type": "number",
        "role": "motion",
        "label": "Max blur",
        "description": "Peak blur of a scene in pixels.",
        "default": 24,
        "min": 0,
        "max": 80,
        "step": 1,
        "unit": "px"
      },
      {
        "id": "scale_by",
        "type": "number",
        "role": "motion",
        "label": "Scale drift",
        "description": "How far a scene drifts in scale while it blurs.",
        "default": 0.03,
        "min": 0,
        "max": 0.3,
        "step": 0.005
      },
      {
        "id": "start_frame",
        "type": "number",
        "role": "motion",
        "label": "Transition start",
        "description": "Frame (30 per second) the transition starts on.",
        "default": 30,
        "min": 0,
        "max": 300,
        "step": 1,
        "unit": "frames"
      },
      {
        "id": "transition_frames",
        "type": "number",
        "role": "motion",
        "label": "Transition length",
        "description": "Frames the transition lasts.",
        "default": 22,
        "min": 4,
        "max": 90,
        "step": 1,
        "unit": "frames"
      },
      {
        "id": "blur_out_exiting",
        "type": "boolean",
        "role": "motion",
        "label": "Blur the outgoing scene",
        "description": "Off keeps the outgoing scene sharp underneath.",
        "default": true
      }
    ]
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Blur Reveal</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Poppins:wght@400;600;800&amp;family=Playfair+Display:wght@400..900&amp;family=Space+Grotesk:wght@300..700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #f4f4f5; }
        .brv-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .brv-panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2em; text-align: center; padding: 0 8%; }
        .brv-bg { position: absolute; inset: -15%; z-index: -1; }
        .brv-panel { isolation: isolate; }
        .brv-sub { font-size: 0.34em; opacity: 0.8; font-weight: 500; }
        .brv-title { font-weight: 800; line-height: 1.05; }
      </style>

      <div id="root" data-composition-id="blur-reveal" data-duration="3" data-fps="30">
        <div id="brv-clip" class="brv-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="brv-a" class="brv-panel"><div class="brv-bg" id="brv-bga"></div><div class="brv-title" id="brv-ta"></div><div class="brv-sub" id="brv-sa"></div></div>
          <div id="brv-b" class="brv-panel"><div class="brv-bg" id="brv-bgb"></div><div class="brv-title" id="brv-tb"></div><div class="brv-sub" id="brv-sb"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) && v !== "" && v !== null ? Math.min(max, Math.max(min, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function bool(v, f) { if (v === undefined || v === null || v === "") return f; return !(v === false || v === "false" || v === 0 || v === "0"); }
            function pick(v, list, f) { v = String(v); return list.indexOf(v) >= 0 ? v : f; }
            function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
            function lerp(a, b, t) { return a + (b - a) * t; }
            function ramp(v, a, b, from, to, ease) { var p = b === a ? 1 : clamp01((v - a) / (b - a)); if (ease) p = ease(p); return from + (to - from) * p; }
            function bez(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 30; i++) {
                  var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
              };
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function mk(tag, parent, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; if (parent) parent.appendChild(e); return e; }
            var TOTAL = parseFloat(root.dataset.duration || "3");
            // Every frame is drawn from the frame number alone, so seeking anywhere draws the same frame.
            function drive(name, frameFn) {
              var clock = { f: 0 };
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: function () { frameFn(clock.f); } }, 0);
              frameFn(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines[name] = tl;
            }

            var FONTS = { geist: "Geist, system-ui, sans-serif", poppins: "Poppins, system-ui, sans-serif", playfair: '"Playfair Display", Georgia, serif', grotesk: '"Space Grotesk", system-ui, sans-serif' };
            var fontKey = pick(vars.font, ["geist", "poppins", "playfair", "grotesk"], "geist");
            root.style.fontFamily = FONTS[fontKey];
            var a = document.getElementById("brv-a"), b = document.getElementById("brv-b");
            document.getElementById("brv-ta").textContent = str(vars.label_a, "Before");
            document.getElementById("brv-sa").textContent = str(vars.sub_a, "A busy, scattered start.");
            document.getElementById("brv-tb").textContent = str(vars.label_b, "After");
            document.getElementById("brv-sb").textContent = str(vars.sub_b, "Calm, clear and focused.");
            document.getElementById("brv-bga").style.background = str(vars.color_a, "#1d4ed8");
            document.getElementById("brv-bgb").style.background = str(vars.color_b, "#0f766e");
            var fs = num(vars.font_size, 96, 24, 260) + "px";
            [a, b].forEach(function (p) { p.style.color = str(vars.text_color, "#ffffff"); p.style.fontSize = fs; });
            var maxBlur = num(vars.max_blur, 24, 0, 80), scaleBy = num(vars.scale_by, 0.03, 0, 0.3);
            var start = num(vars.start_frame, 30, 0, 300), len = num(vars.transition_frames, 22, 4, 90), blurOut = bool(vars.blur_out_exiting, true);
            var editorial = bez(0.45, 0, 0.55, 1), fadeEase = bez(0.16, 1, 0.3, 1);
            // presentationProgress 0 to 1: the incoming scene resolves in the last part, the outgoing one leaves in the first.
            function draw(frame) {
              var p = editorial(clamp01((frame - start) / len));
              // Incoming: opacity done 74 % in; outgoing: gone 70 % in. displace is 0 at rest.
              var inOpacity = fadeEase(clamp01(p / 0.74)), inDisplace = 1 - inOpacity;
              var outOpacity = 1 - clamp01(p / 0.7), outDisplace = clamp01(p / 0.7);
              b.style.opacity = String(inOpacity);
              b.style.filter = inDisplace > 0.002 ? "blur(" + (inDisplace * maxBlur).toFixed(2) + "px)" : "";
              b.style.transform = "scale(" + (1 + inDisplace * scaleBy).toFixed(4) + ")";
              if (!blurOut) { a.style.opacity = "1"; a.style.filter = ""; a.style.transform = ""; return; }
              a.style.opacity = String(p >= 1 ? 0 : outOpacity);
              a.style.filter = outDisplace > 0.002 ? "blur(" + (outDisplace * maxBlur).toFixed(2) + "px)" : "";
              a.style.transform = "scale(" + (1 - outDisplace * scaleBy * 0.66).toFixed(4) + ")";
            }
            drive("blur-reveal", draw);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
