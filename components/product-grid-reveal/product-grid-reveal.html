<!doctype html>
<!--
  Product Grid Reveal

  A mosaic of 6 or 9 product tiles, each with a name and a price, flips in with a stagger. One tile then scales up as the highlight and gets a Terlaris badge while the rest dim. Tiles show a drawn placeholder or your own images.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="product-grid-reveal"
  data-composition-duration="5"
  data-composition-variables='[
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Title",
    "description": "Line above the grid. Leave empty to hide it.",
    "default": "Kue basah favorit"
  },
  {
    "id": "products",
    "type": "string",
    "role": "content",
    "label": "Products",
    "description": "One per line, Name|Price. 6 or fewer lines make a 6-tile grid, more make 9.",
    "default": "Kue lapis|Rp3.000\nKlepon|Rp2.500\nDadar gulung|Rp3.500\nLemper ayam|Rp4.000\nBika ambon|Rp6.000\nOnde-onde|Rp2.500\nSerabi|Rp3.000\nCenil|Rp2.500\nLupis|Rp3.500"
  },
  {
    "id": "highlight",
    "type": "number",
    "role": "content",
    "label": "Highlight",
    "description": "Which tile (1 = first) scales up. 0 for none.",
    "default": 5,
    "min": 0,
    "max": 9,
    "step": 1
  },
  {
    "id": "badge",
    "type": "string",
    "role": "content",
    "label": "Badge",
    "description": "Text on the highlighted tile.",
    "default": "Terlaris"
  },
  {
    "id": "images",
    "type": "string",
    "role": "content",
    "label": "Images",
    "description": "Optional image URLs, one per line in tile order. Empty tiles stay drawn.",
    "default": ""
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Main colour",
    "description": "Badge and highlight outline: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Tile names and title.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Prices.",
    "default": "#737373"
  },
  {
    "id": "tile_color",
    "type": "color",
    "role": "style",
    "label": "Tile colour",
    "description": "Tile background.",
    "default": "#f4f4f2"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Google Fonts family name; Geist is loaded, others only if the host loads them.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Product Grid Reveal</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          background: var(--pgr-bg); color: var(--pgr-text); font-family: var(--pgr-font);
        }
        #root * { box-sizing: border-box; }
        .pgr-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .pgr-title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.04em; white-space: nowrap; }
        .pgr-grid { position: absolute; display: grid; perspective: calc(var(--u) * 1800); }
        .pgr-tile { position: relative; display: flex; flex-direction: column; min-height: 0; border-radius: calc(var(--u) * 28); background: var(--pgr-tile); padding: calc(var(--u) * 14); gap: calc(var(--u) * 10); outline: 0 solid var(--pgr-main); backface-visibility: hidden; }
        .pgr-art { flex: 1; min-height: 0; border-radius: calc(var(--u) * 18); display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
        .pgr-art svg { width: 56%; height: 56%; }
        .pgr-meta { display: flex; flex-direction: column; gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 8) calc(var(--u) * 6); }
        .pgr-name { font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pgr-price { font-weight: 500; color: var(--pgr-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .pgr-badge { position: absolute; left: calc(var(--u) * 24); top: calc(var(--u) * 24); padding: calc(var(--u) * 8) calc(var(--u) * 22); border-radius: calc(var(--u) * 60); background: var(--pgr-main); color: #fff; font-weight: 600; font-size: calc(var(--u) * 28); white-space: nowrap; opacity: 0; }

      </style>

      <div id="root" data-composition-id="product-grid-reveal" data-duration="5" data-fps="30">
        <div id="pgr-clip" class="pgr-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div class="pgr-title" id="pgr-title"></div>
          <div class="pgr-grid" id="pgr-grid"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function lines(v, d) { var s = typeof v === "string" && v.trim() ? v : d; return s.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ease(n, a, b) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            var PAL = [["bg", "bg_color", "#ffffff"], ["main", "main_color", "#2563eb"], ["text", "text_color", "#0a0a0a"], ["muted", "muted_color", "#737373"], ["tile", "tile_color", "#f4f4f2"]];
            PAL.forEach(function (c) { root.style.setProperty("--pgr-" + c[0], colr(vars[c[1]], c[2])); });
            root.style.setProperty("--pgr-font", '"' + str(vars.font_family, "Geist") + '", Geist, system-ui, sans-serif');
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            var items = lines(vars.products, "").map(function (l) { var a = l.split("|"); return { name: (a[0] || "").trim(), price: (a[1] || "").trim() }; });
            var n = items.length > 6 ? 9 : 6; items = items.slice(0, n);
            var imgs = String(vars.images || "").split(/\r?\n/).map(function (x) { return x.trim(); });
            var cols = n === 9 ? 3 : PORTRAIT ? 2 : 3, rows = n / cols;
            var titleEl = document.getElementById("pgr-title"), t = typeof vars.title === "string" ? vars.title.trim() : "Kue basah favorit";
            titleEl.textContent = t;
            var gridTop = t ? (PORTRAIT ? 300 : 190) : (PORTRAIT ? 120 : 60);
            titleEl.style.top = 150 * U + "px"; titleEl.style.fontSize = 76 * U + "px";
            var grid = document.getElementById("pgr-grid"), mx = (PORTRAIT ? 56 : 60) * U, bot = (PORTRAIT ? 120 : 60) * U;
            if (!PORTRAIT) {
              titleEl.style.cssText += "left:" + 90 * U + "px;right:auto;width:" + (W * 0.34 - 90 * U) + "px;top:0;bottom:0;display:flex;align-items:center;text-align:left;white-space:normal;font-size:" + 92 * U + "px;line-height:1.05";
              titleEl.style.fontSize = 92 * U + "px"; gridTop = 60;
            }
            grid.style.left = (PORTRAIT ? mx : W * 0.4) + "px"; grid.style.right = mx + "px"; grid.style.top = gridTop * U + "px"; grid.style.bottom = bot + "px";
            var gp = 26 * U; grid.style.gap = gp + "px";
            grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)"; grid.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
            var tones = ["#e4e1da", "#dcd9d2", "#e9e6df"], shapes = [
              '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff" opacity=".7"/><circle cx="50" cy="50" r="18" fill="#fff"/></svg>',
              '<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="22" fill="#fff" opacity=".7"/><rect x="34" y="34" width="32" height="32" rx="10" fill="#fff"/></svg>',
              '<svg viewBox="0 0 100 100"><path d="M50 8 L92 50 L50 92 L8 50 Z" fill="#fff" opacity=".7"/><circle cx="50" cy="50" r="14" fill="#fff"/></svg>'];
            var big = cols === 2 ? 1 : 0, tiles = [];
            items.forEach(function (it, i) {
              var tile = el("div", "pgr-tile", grid);
              var art = el("div", "pgr-art", tile, imgs[i] ? "" : shapes[i % 3]); art.style.backgroundColor = tones[i % 3];
              if (imgs[i]) art.style.backgroundImage = 'url("' + imgs[i].replace(/"/g, "") + '")';
              var meta = el("div", "pgr-meta", tile, '<span class="pgr-name">' + esc(it.name) + '</span><span class="pgr-price">' + esc(it.price) + '</span>');
              meta.firstChild.style.fontSize = (big ? 44 : PORTRAIT ? 32 : 38) * U + "px"; meta.lastChild.style.fontSize = (big ? 38 : PORTRAIT ? 28 : 32) * U + "px";
              tiles.push(tile);
            });
            var hi = Math.round(num(vars.highlight, 5, 0, 9)) - 1, badgeText = typeof vars.badge === "string" ? vars.badge.trim() : "Terlaris";
            var badge = null;
            if (hi >= 0 && hi < n) { badge = el("span", "pgr-badge", tiles[hi], esc(badgeText)); if (!badgeText) badge.style.display = "none"; }
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#pgr-title", { opacity: 0, x: PORTRAIT ? 0 : -30 * U, y: PORTRAIT ? -20 * U : 0 }, { opacity: 1, x: 0, y: PORTRAIT ? 0 : 0, duration: 0.5, ease: "power3.out" }, 0.1);
            tiles.forEach(function (tile, i) {
              tl.fromTo(tile, { rotationY: -90, opacity: 0, transformOrigin: "50% 50%" }, { rotationY: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3 + i * 0.09);
            });
            if (badge) {
              var hiT = 0.3 + (n - 1) * 0.09 + 0.6 + 0.5;
              tiles.forEach(function (tile, i) { if (i !== hi) tl.to(tile, { opacity: 0.45, duration: 0.4, ease: "power2.out" }, hiT); });
              tl.set(tiles[hi], { zIndex: 5 }, hiT);
              tl.to(tiles[hi], { scale: 1.12, duration: 0.5, ease: "expo.out", outlineWidth: 4 * U }, hiT);
              tl.fromTo(badge, { scale: 0.4, opacity: 0, y: -10 * U }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, hiT + 0.3);
            }

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["product-grid-reveal"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
