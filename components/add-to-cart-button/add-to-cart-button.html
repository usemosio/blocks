<!--
  Add To Cart Button

  A button is pressed and squashes; a shirt pops out of its top, drops into a cart icon that ticks and drives off to the right while the label returns, with morphing shapes and an elastic settle.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR

  FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE

  SOFTWARE.

  Changes by usemosio/blocks: the click becomes a timed press at 0.7 s; the button is scaled to the host frame; CSS-variable keyframes with onComplete/clearProps become explicit timeline tweens and sets; the CSS transition is removed; the chest logo on the shirt is a plain dot; sample label is Indonesian; colours and label are variables; the pen's footer links are dropped.
-->
<html
  lang="en"
  data-composition-id="add-to-cart-button"
  data-composition-duration="4"
  data-composition-variables='[
    {"id":"label","type":"string","role":"content","label":"Label","description":"Button text (keep it short).","default":"Ke keranjang"},
    {"id":"button_color","type":"color","role":"style","label":"Button color","description":"Button background.","default":"#0a0a0a"},
    {"id":"text_color","type":"color","role":"style","label":"Text color","description":"Label colour.","default":"#ffffff"},
    {"id":"accent","type":"color","role":"style","label":"Tick color","description":"Colour of the check mark in the cart.","default":"#2563eb"},
    {"id":"background","type":"color","role":"style","label":"Background","description":"Frame background.","default":"#ffffff"},
    {"id":"size","type":"number","role":"style","label":"Size","description":"Multiplier on the automatic button size.","default":1,"min":0.5,"max":1.6,"step":0.05,"unit":"x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Add To Cart Button</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
background: var(--atc-bg, #fff); font-family: Inter, system-ui, sans-serif;
        }
        .atc-stage {
          position: absolute;
          inset: 0;
        }

        .atc-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .atc-scaler { width: 164px; height: 48px; transform-origin: 50% 50%; }
        .add-to-cart { --background-default: #0a0a0a; --background-scale: 1; --text-color: #fff; --text-o: 1; --text-x: 12px; --cart: #fff; --cart-x: -48px; --cart-y: 0px; --cart-rotate: 0deg; --cart-scale: .75; --cart-clip: 0px; --cart-clip-x: 0px; --cart-tick-offset: 10px; --cart-tick-color: #2563eb; --shirt-y: -16px; --shirt-scale: 0; --shirt-color: #0a0a0a; --shirt-logo: #fff; --shirt-second-y: 24px; --shirt-second-color: #fff; --shirt-second-logo: #0a0a0a; outline: none; background: none; border: none; padding: 12px 0; width: 164px; margin: 0; position: relative; font-family: inherit; display: block; }
        .add-to-cart:before { content: ""; display: block; position: absolute; inset: 0; border-radius: 5px; background: var(--background-default); transform: scaleX(var(--background-scale)) translateZ(0); }
        .add-to-cart span { display: block; text-align: center; position: relative; z-index: 1; font-size: 14px; font-weight: 600; line-height: 24px; color: var(--text-color); opacity: var(--text-o); transform: translateX(var(--text-x)) translateZ(0); white-space: nowrap; }
        .add-to-cart svg { display: block; width: var(--svg-width, 24px); height: var(--svg-height, 24px); position: var(--svg-position, relative); left: var(--svg-left, 0); top: var(--svg-top, 0); stroke-linecap: round; stroke-linejoin: round; }
        .add-to-cart svg path, .add-to-cart svg circle { fill: var(--svg-fill, none); stroke: var(--svg-stroke, none); stroke-width: var(--svg-stroke-width, 2); }
        .add-to-cart .morph { --svg-width: 64px; --svg-height: 13px; --svg-left: 50%; --svg-top: -12px; --svg-position: absolute; --svg-fill: var(--background-default); pointer-events: none; margin-left: -32px; }
        .add-to-cart .shirt, .add-to-cart .cart { pointer-events: none; position: absolute; left: 50%; }
        .add-to-cart .shirt { margin: -12px 0 0 -12px; top: 0; transform-origin: 50% 100%; transform: translateY(var(--shirt-y)) scale(var(--shirt-scale)); }
        .add-to-cart .shirt svg { --svg-fill: var(--shirt-color); }
        .add-to-cart .shirt svg g { --svg-fill: var(--svg-g-fill, var(--shirt-logo)); }
        .add-to-cart .shirt svg g circle { stroke: none; }
        .add-to-cart .shirt svg.second { --svg-fill: var(--shirt-second-color); --svg-g-fill: var(--shirt-second-logo); --svg-position: absolute; clip-path: polygon(0 var(--shirt-second-y), 24px var(--shirt-second-y), 24px 24px, 0 24px); }
        .add-to-cart .cart { --svg-width: 36px; --svg-height: 26px; --svg-stroke: var(--cart); top: 10px; margin-left: -18px; transform: translate(var(--cart-x), var(--cart-y)) rotate(var(--cart-rotate)) scale(var(--cart-scale)) translateZ(0); }
        .add-to-cart .cart:before { content: ""; display: block; width: 22px; height: 12px; position: absolute; left: 7px; top: 7px; background: var(--cart); clip-path: polygon(0 0, 22px 0, calc(22px - var(--cart-clip-x)) var(--cart-clip), var(--cart-clip-x) var(--cart-clip)); }
        .add-to-cart .cart path.wheel { --svg-stroke-width: 1.5; }
        .add-to-cart .cart path.tick { --svg-stroke: var(--cart-tick-color); stroke-dasharray: 10px; stroke-dashoffset: var(--cart-tick-offset); }
      </style>

      <div id="root" data-composition-id="add-to-cart-button" data-duration="4" data-fps="30">
        <div id="atc-clip" class="atc-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="atc-center"><div class="atc-scaler" id="atc-scaler">
            <div class="add-to-cart" id="atc-btn">
              <span id="atc-label">Ke keranjang</span>
              <svg class="morph" viewBox="0 0 64 13"><path id="atc-morph" d="M0 12C6 12 17 12 32 12C47.9024 12 58 12 64 12V13H0V12Z" /></svg>
              <div class="shirt">
                <svg class="first" viewBox="0 0 24 24"><path class="atc-shirt" d="M4.99997 3L8.99997 1.5C8.99997 1.5 10.6901 3 12 3C13.3098 3 15 1.5 15 1.5L19 3L22.5 8L19.5 10.5L19 9.5L17.1781 18.6093C17.062 19.1901 16.778 19.7249 16.3351 20.1181C15.4265 20.925 13.7133 22.3147 12 23C10.2868 22.3147 8.57355 20.925 7.66487 20.1181C7.22198 19.7249 6.93798 19.1901 6.82183 18.6093L4.99997 9.5L4.5 10.5L1.5 8L4.99997 3Z" /><g><circle cx="15.2" cy="8.2" r="1.5" /></g></svg>
                <svg class="second" viewBox="0 0 24 24"><path class="atc-shirt" d="M4.99997 3L8.99997 1.5C8.99997 1.5 10.6901 3 12 3C13.3098 3 15 1.5 15 1.5L19 3L22.5 8L19.5 10.5L19 9.5L17.1781 18.6093C17.062 19.1901 16.778 19.7249 16.3351 20.1181C15.4265 20.925 13.7133 22.3147 12 23C10.2868 22.3147 8.57355 20.925 7.66487 20.1181C7.22198 19.7249 6.93798 19.1901 6.82183 18.6093L4.99997 9.5L4.5 10.5L1.5 8L4.99997 3Z" /><g><circle cx="15.2" cy="8.2" r="1.5" /></g></svg>
              </div>
              <div class="cart"><svg viewBox="0 0 36 26">
                <path d="M1 2.5H6L10 18.5H25.5L28.5 7.5L7.5 7.5" />
                <path d="M11.5 25C12.6046 25 13.5 24.1046 13.5 23C13.5 21.8954 12.6046 21 11.5 21C10.3954 21 9.5 21.8954 9.5 23C9.5 24.1046 10.3954 25 11.5 25Z" class="wheel" />
                <path d="M24 25C25.1046 25 26 24.1046 26 23C26 21.8954 25.1046 21 24 21C22.8954 21 22 21.8954 22 23C22 24.1046 22.8954 25 24 25Z" class="wheel" />
                <path d="M14.5 13.5L16.5 15.5L21.5 10.5" class="tick" />
              </svg></div>
            </div>
          </div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MorphSVGPlugin.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 4;

            root.style.setProperty("--atc-bg", col(vars.background, "#ffffff"));
            var btn = document.getElementById("atc-btn");
            var btnColor = col(vars.button_color, "#0a0a0a"), textColor = col(vars.text_color, "#ffffff");
            btn.style.setProperty("--background-default", btnColor);
            btn.style.setProperty("--text-color", textColor);
            btn.style.setProperty("--cart", textColor);
            btn.style.setProperty("--cart-tick-color", col(vars.accent, "#2563eb"));
            btn.style.setProperty("--shirt-color", btnColor);
            btn.style.setProperty("--shirt-logo", textColor);
            btn.style.setProperty("--shirt-second-color", textColor);
            btn.style.setProperty("--shirt-second-logo", btnColor);
            document.getElementById("atc-label").textContent = str(vars.label, "Ke keranjang");
            var size = Math.min((W * 0.7) / 164, (H * 0.3) / 60) * num(vars.size, 1, 0.5, 1.6);
            document.getElementById("atc-scaler").style.transform = "scale(" + size + ")";
            gsap.registerPlugin(MorphSVGPlugin);
            var morph = document.getElementById("atc-morph");
            var shirts = Array.prototype.slice.call(btn.querySelectorAll(".atc-shirt"));
            var BUMP = "M0 12C6 12 20 10 32 0C43.9024 9.99999 58 12 64 12V13H0V12Z";
            var FLAT = "M0 12C6 12 17 12 32 12C47.9024 12 58 12 64 12V13H0V12Z";
            var SH2 = "M4.99997 3L8.99997 1.5C8.99997 1.5 10.6901 3 12 3C13.3098 3 15 1.5 15 1.5L19 3L23.5 8L20.5 11L19 9.5L18 22.5C18 22.5 14 21.5 12 21.5C10 21.5 5.99997 22.5 5.99997 22.5L4.99997 9.5L3.5 11L0.5 8L4.99997 3Z";
            var SH3 = "M4.99997 3L8.99997 1.5C8.99997 1.5 10.6901 3 12 3C13.3098 3 15 1.5 15 1.5L19 3L22.5 8L19.5 10.5L19 9.5L18.5 22.5C18.5 22.5 13.5 22.5 12 22.5C10.5 22.5 5.5 22.5 5.5 22.5L4.99997 9.5L3.5 11L0.5 8L4.99997 3Z";
            var tl = gsap.timeline({ paused: true });
            var T0 = 0.7;
            function K(from, to, dur, ease, at) {
              var o = { duration: dur, ease: ease || "none", immediateRender: false };
              for (var k in to) o[k] = to[k];
              tl.fromTo(btn, from, o, T0 + at);
            }
            // press and elastic release
            tl.fromTo(btn, { "--background-scale": 1 }, { "--background-scale": 0.97, duration: 0.15, ease: "none", immediateRender: false }, T0 - 0.2);
            tl.fromTo(btn, { "--background-scale": 0.97 }, { "--background-scale": 1, duration: 1.2, ease: "elastic.out(1, .6)", immediateRender: false }, T0 + 0.275);
            // shirt pops out and drops into the cart
            K({ "--shirt-scale": 0, "--shirt-y": "-16px", "--cart-x": "-48px", "--cart-scale": 0.75 }, { "--shirt-scale": 1, "--shirt-y": "-42px", "--cart-x": "0px", "--cart-scale": 1 }, 0.4, "power1.in", 0);
            K({ "--shirt-y": "-42px" }, { "--shirt-y": "-40px" }, 0.3, "none", 0.4);
            K({ "--shirt-y": "-40px", "--shirt-scale": 1 }, { "--shirt-y": "16px", "--shirt-scale": 0.9 }, 0.25, "none", 0.7);
            K({ "--shirt-scale": 0.9 }, { "--shirt-scale": 0 }, 0.3, "none", 0.95);
            K({ "--shirt-second-y": "24px" }, { "--shirt-second-y": "0px" }, 0.12, "none", 0.835);
            // cart ticks and drives off, label returns
            K({ "--cart-clip": "0px", "--cart-clip-x": "0px" }, { "--cart-clip": "12px", "--cart-clip-x": "3px" }, 0.06, "none", 0.9);
            K({ "--cart-y": "0px" }, { "--cart-y": "2px" }, 0.1, "none", 0.96);
            K({ "--cart-tick-offset": "10px", "--cart-y": "2px" }, { "--cart-tick-offset": "0px", "--cart-y": "0px" }, 0.2, "none", 1.06);
            tl.set(btn, { overflow: "hidden" }, T0 + 1.26);
            K({ "--cart-x": "0px", "--cart-rotate": "0deg" }, { "--cart-x": "52px", "--cart-rotate": "-15deg" }, 0.2, "none", 1.26);
            K({ "--cart-x": "52px", "--cart-rotate": "-15deg" }, { "--cart-x": "104px", "--cart-rotate": "0deg" }, 0.2, "none", 1.46);
            tl.set(btn, { "--text-o": 0, "--text-x": "0px", "--cart-x": "-104px", "--cart-scale": 1 }, T0 + 1.66);
            K({ "--text-o": 0, "--text-x": "0px", "--cart-x": "-104px", "--cart-scale": 1 }, { "--text-o": 1, "--text-x": "12px", "--cart-x": "-48px", "--cart-scale": 0.75 }, 0.25, "none", 1.66);
            K({ "--text-o": 1 }, { "--text-o": 0 }, 0.3, "none", 0);
            // button bump and shirt morphs
            tl.to(morph, { morphSVG: BUMP, duration: 0.25, ease: "power1.out" }, T0);
            tl.to(morph, { morphSVG: FLAT, duration: 0.15, ease: "none" }, T0 + 0.25);
            tl.to(shirts, { morphSVG: SH2, duration: 0.25 }, T0 + 0.25);
            tl.to(shirts, { morphSVG: SH3, duration: 0.85, ease: "elastic.out(1, .5)" }, T0 + 0.5);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["add-to-cart-button"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
