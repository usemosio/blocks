<html
  lang="en"
  data-composition-id="media-between-text"
  data-composition-duration="4.5"
  data-composition-variables='[
    {"id": "first_text", "type": "string", "role": "content", "label": "First text", "description": "Text before the media.", "default": "that&#39;s a nice ("},
    {"id": "second_text", "type": "string", "role": "content", "label": "Second text", "description": "Text after the media.", "default": ") chair!"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. The row shrinks to fit the frame.", "default": 96, "min": 24, "max": 260, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "300", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Text color.", "default": "#e11d48"},
    {"id": "media_width", "type": "number", "role": "style", "label": "Media width", "description": "Width of the opened media tile, in em of the font size.", "default": 1.7, "min": 0.3, "max": 4, "step": 0.05, "unit": "em"},
    {"id": "media_height", "type": "number", "role": "style", "label": "Media height", "description": "Height of the media tile, in em of the font size.", "default": 1.7, "min": 0.3, "max": 4, "step": 0.05, "unit": "em"},
    {"id": "media_radius", "type": "number", "role": "style", "label": "Media radius", "description": "Corner radius of the tile, in em.", "default": 0.12, "min": 0, "max": 1, "step": 0.01, "unit": "em"},
    {"id": "gradient_from", "type": "color", "role": "style", "label": "Gradient from", "description": "First color of the drawn tile.", "default": "#fda4af"},
    {"id": "gradient_to", "type": "color", "role": "style", "label": "Gradient to", "description": "Second color of the drawn tile.", "default": "#6d28d9"},
    {"id": "image", "type": "string", "role": "content", "label": "Image", "description": "Optional image path (for example assets/media/upl_xxx.jpg) drawn over the gradient, cover-fitted. Empty keeps the drawn gradient.", "default": ""},
    {"id": "open_at", "type": "number", "role": "motion", "label": "Open at", "description": "Seconds when the tile opens.", "default": 0.5, "min": 0, "max": 3, "step": 0.05, "unit": "s"},
    {"id": "close_at", "type": "number", "role": "motion", "label": "Close at", "description": "Seconds when the tile closes again. 0 keeps it open.", "default": 3.2, "min": 0, "max": 8, "step": 0.05, "unit": "s"},
    {"id": "spring_duration", "type": "number", "role": "motion", "label": "Spring duration", "description": "Perceived duration of the opening spring.", "default": 0.4, "min": 0.1, "max": 2, "step": 0.05, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Media Between Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #e11d48; font-family: Geist, system-ui, sans-serif; }
        .mbt-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .mbt-row { display: flex; align-items: center; justify-content: center; white-space: pre; line-height: 1.2; }
        .mbt-media { position: relative; overflow: hidden; flex: none; width: 0; }
        .mbt-art { position: absolute; inset: 0; }
        .mbt-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      </style>

      <div id="root" data-composition-id="media-between-text" data-duration="4.5" data-fps="30">
        <div id="mbt-clip" class="mbt-stage clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div id="mbt-row" class="mbt-row"><span id="mbt-first"></span><div id="mbt-media" class="mbt-media"><div id="mbt-art" class="mbt-art"></div></div><span id="mbt-second"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "first_text", "type": "string", "role": "content", "label": "First text", "description": "Text before the media.", "default": "that's a nice ("}, {"id": "second_text", "type": "string", "role": "content", "label": "Second text", "description": "Text after the media.", "default": ") chair!"}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. The row shrinks to fit the frame.", "default": 96, "min": 24, "max": 260, "step": 1, "unit": "px"}, {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "300", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}]}, {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Text color.", "default": "#e11d48"}, {"id": "media_width", "type": "number", "role": "style", "label": "Media width", "description": "Width of the opened media tile, in em of the font size.", "default": 1.7, "min": 0.3, "max": 4, "step": 0.05, "unit": "em"}, {"id": "media_height", "type": "number", "role": "style", "label": "Media height", "description": "Height of the media tile, in em of the font size.", "default": 1.7, "min": 0.3, "max": 4, "step": 0.05, "unit": "em"}, {"id": "media_radius", "type": "number", "role": "style", "label": "Media radius", "description": "Corner radius of the tile, in em.", "default": 0.12, "min": 0, "max": 1, "step": 0.01, "unit": "em"}, {"id": "gradient_from", "type": "color", "role": "style", "label": "Gradient from", "description": "First color of the drawn tile.", "default": "#fda4af"}, {"id": "gradient_to", "type": "color", "role": "style", "label": "Gradient to", "description": "Second color of the drawn tile.", "default": "#6d28d9"}, {"id": "image", "type": "string", "role": "content", "label": "Image", "description": "Optional image path (for example assets/media/upl_xxx.jpg) drawn over the gradient, cover-fitted. Empty keeps the drawn gradient.", "default": ""}, {"id": "open_at", "type": "number", "role": "motion", "label": "Open at", "description": "Seconds when the tile opens.", "default": 0.5, "min": 0, "max": 3, "step": 0.05, "unit": "s"}, {"id": "close_at", "type": "number", "role": "motion", "label": "Close at", "description": "Seconds when the tile closes again. 0 keeps it open.", "default": 3.2, "min": 0, "max": 8, "step": 0.05, "unit": "s"}, {"id": "spring_duration", "type": "number", "role": "motion", "label": "Spring duration", "description": "Perceived duration of the opening spring.", "default": 0.4, "min": 0.1, "max": 2, "step": 0.05, "unit": "s"}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "4.5");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var row = document.getElementById("mbt-row"), media = document.getElementById("mbt-media"), art = document.getElementById("mbt-art");
            var a = V("first_text"), b = V("second_text");
            document.getElementById("mbt-first").textContent = a; document.getElementById("mbt-second").textContent = b;
            var mw = V("media_width"), mh = V("media_height");
            row.style.fontSize = "min(" + V("font_size") + "px, calc(90cqw / " + ((fitText(a + b).length * 0.5 + mw + 0.2)).toFixed(2) + "))";
            row.style.fontWeight = V("font_weight"); row.style.color = V("color");
            media.style.height = mh + "em"; media.style.borderRadius = V("media_radius") + "em";
            media.style.margin = "0.08em 0 0 0";
            var g0 = V("gradient_from"), g1 = V("gradient_to");
            art.style.background = "radial-gradient(circle at 70% 28%, rgba(255,255,255,0.55) 0, rgba(255,255,255,0) 32%), linear-gradient(135deg, " + g0 + ", " + g1 + ")";
            var src = String(V("image") || "").trim();
            if (src) { var img = document.createElement("img"); img.className = "mbt-img"; img.id = "mbt-img"; img.src = src; img.alt = ""; media.appendChild(img); }
            var sp = spring({ duration: V("spring_duration"), bounce: 0 });
            var openAt = V("open_at"), closeAt = V("close_at");
            var tl = gsap.timeline({ paused: true });
            function draw(t) {
              var p = sp.at(t - openAt);
              if (closeAt > 0 && t >= closeAt) p = 1 - sp.at(t - closeAt);
              if (closeAt > 0 && t >= closeAt && t < closeAt + sp.duration) p = Math.min(p, 1);
              media.style.width = (mw * Math.max(0, p)).toFixed(4) + "em";
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["media-between-text"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
