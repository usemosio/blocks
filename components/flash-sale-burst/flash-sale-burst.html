<!doctype html>
<!--
  Flash Sale Burst

  A bursting percent figure, two crossed running ribbons and a stamped deadline.

  Extracted from the Mosio recipe flash-sale by usemosio/blocks.
-->
<html
  lang="en"
  data-composition-id="flash-sale-burst"
  data-composition-duration="6.5"
  data-composition-variables='[
  {
    "id": "word_1",
    "type": "string",
    "role": "content",
    "label": "First word",
    "description": "First headline word.",
    "default": "Flash"
  },
  {
    "id": "word_2",
    "type": "string",
    "role": "content",
    "label": "Second word",
    "description": "Second headline word.",
    "default": "Sale!"
  },
  {
    "id": "percent",
    "type": "string",
    "role": "content",
    "label": "Percent",
    "description": "The bursting figure, e.g. 50% or Rp5rb.",
    "default": "50%"
  },
  {
    "id": "percent_suffix",
    "type": "string",
    "role": "content",
    "label": "Word after the figure",
    "description": "Short word under the figure. Leave empty to hide it.",
    "default": "OFF"
  },
  {
    "id": "ribbon_1",
    "type": "string",
    "role": "content",
    "label": "Ribbon 1",
    "description": "Text that runs along the first ribbon.",
    "default": "SEMUA MENU DISKON"
  },
  {
    "id": "ribbon_2",
    "type": "string",
    "role": "content",
    "label": "Ribbon 2",
    "description": "Text that runs along the second ribbon.",
    "default": "SAMPAI MINGGU"
  },
  {
    "id": "deadline_label",
    "type": "string",
    "role": "content",
    "label": "Deadline label",
    "description": "Small spaced line above the stamped deadline.",
    "default": "Berakhir"
  },
  {
    "id": "deadline",
    "type": "string",
    "role": "content",
    "label": "Deadline",
    "description": "The stamped deadline, written as text.",
    "default": "Minggu, 23.59 WIB"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "accent_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "Percent figure: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Headline, \"OFF\", the black ribbon and the deadline.",
    "default": "#0a0a0a"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Flash Sale Burst</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
        }
        #root * { box-sizing: border-box; }
        .fs-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        #root { background: var(--fs-bg); color: var(--fs-text); font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
        .fs-head { position: absolute; left: 5cqw; right: 5cqw; top: 8%; display: flex; justify-content: center; }
        .fs-headin { display: inline-block; text-align: center; white-space: nowrap; font-size: calc(var(--u) * 170); font-weight: 600; letter-spacing: -0.05em; line-height: 0.95; }
        .fs-headin span { display: block; }
        .fs-mid { position: absolute; left: 0; right: 0; top: 27%; height: 46%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fs-pctw { position: relative; width: 90cqw; display: flex; justify-content: center; }
        .fs-pct { display: inline-block; white-space: nowrap; font-size: calc(var(--u) * 440); font-weight: 700; line-height: 1; letter-spacing: -0.06em; color: var(--fs-accent); }
        .fs-off { position: relative; display: inline-block; font-size: calc(var(--u) * 96); font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--fs-text); margin-top: calc(var(--u) * -10); }
        .fs-tape { position: absolute; left: -20cqw; width: 140cqw; top: 72%; height: calc(var(--u) * 120); margin-top: calc(var(--u) * -60); overflow: hidden; display: flex; align-items: center; }
        .fs-run { white-space: nowrap; font-size: calc(var(--u) * 56); font-weight: 600; letter-spacing: 0.04em; display: inline-block; }
        .fs-run span { display: inline-block; }
        .fs-t1 { background: var(--fs-text); color: var(--fs-bg); transform: rotate(-7deg); }
        .fs-t2 { background: var(--fs-bg); color: var(--fs-text); border-top: 2px solid var(--fs-text); border-bottom: 2px solid var(--fs-text); transform: rotate(5deg); margin-top: calc(var(--u) * -50); }
        .fs-info { position: absolute; left: 5cqw; right: 5cqw; top: 70%; display: flex; flex-direction: column; align-items: center; }
        .fs-label { font-size: calc(var(--u) * 44); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #737373; }
        .fs-stampw { margin-top: calc(var(--u) * 18); width: 100%; display: flex; justify-content: center; }
        .fs-stamp { display: inline-block; padding: calc(var(--u) * 16) calc(var(--u) * 40); border-radius: calc(var(--u) * 20); border: 2px solid var(--fs-text); color: var(--fs-text); font-size: calc(var(--u) * 72); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; }
        @container (aspect-ratio > 1) {
          .fs-head { top: 5%; }
          .fs-headin { font-size: calc(var(--u) * 120); }
          .fs-headin span { display: inline-block; margin: 0 0.18em; }
          .fs-mid { top: 17%; height: 52%; }
          .fs-pct { font-size: calc(var(--u) * 360); letter-spacing: calc(var(--u) * -10); }
          .fs-off { font-size: calc(var(--u) * 76); }
          .fs-tape { top: 83%; }
          .fs-run { font-size: calc(var(--u) * 50); }
          .fs-tape { height: calc(var(--u) * 104); margin-top: calc(var(--u) * -52); }
          .fs-t2 { margin-top: calc(var(--u) * -40); }
          .fs-info { top: 76%; }
          .fs-label { font-size: calc(var(--u) * 38); }
          .fs-stamp { font-size: calc(var(--u) * 64); }
        }

      </style>

      <div id="root" data-composition-id="flash-sale-burst" data-duration="6.5" data-fps="30">
        <div id="fs-clip" class="fs-stage clip" data-start="0" data-duration="6.5" data-track-index="0">
          <div class="fs-head"><div class="fs-headin" id="fs-headin"><span id="fs-w1"></span><span class="fs-b" id="fs-w2"></span></div></div>
          <div class="fs-mid">
            <div class="fs-pctw" id="fs-pctw"><span class="fs-pct" id="fs-pct"></span></div>
            <span class="fs-off" id="fs-off"></span>
          </div>
          <div class="fs-tape fs-t2" id="fs-t2"><div class="fs-run" id="fs-run2"></div></div>
          <div class="fs-tape fs-t1" id="fs-t1"><div class="fs-run" id="fs-run1"></div></div>
          <div class="fs-info" id="fs-info">
            <div class="fs-label" id="fs-label"></div>
            <div class="fs-stampw" id="fs-stampw"><span class="fs-stamp" id="fs-stamp"></span></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ink(c, thr) {
              var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c).trim());
              if (!m) return "#14161a";
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
              return 0.299 * r + 0.587 * g + 0.114 * b > (thr || 150) ? "#14161a" : "#ffffff";
            }
            function setColors(p, list) {
              list.forEach(function (c) { root.style.setProperty("--" + p + "-" + c[0], colr(vars[c[1]], c[2])); });
            }
            // Shrink a one-line element's wrapper (flex, centred) when its content is wider than the wrapper.
            var fitList = [];
            function fit(wrap) { fitList.push(wrap); refit(); }
            function refit() {
              fitList.forEach(function (w) {
                w.style.transform = "";
                var c = w.firstElementChild, cw = c ? c.offsetWidth : 0, aw = w.clientWidth;
                if (cw > aw && aw > 0) w.style.transform = "scale(" + (aw / cw).toFixed(4) + ")";
              });
            }
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080;
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            setColors("fs", [["bg", "bg_color", "#ffffff"], ["accent", "accent_color", "#2563eb"], ["text", "text_color", "#0a0a0a"]]);
            var w1 = str(vars.word_1, "Flash"), w2 = str(vars.word_2, "Sale!");
            var pct = str(vars.percent, "50%");
            var suffix = typeof vars.percent_suffix === "string" ? vars.percent_suffix.trim() : "OFF";
            var r1 = str(vars.ribbon_1, "SEMUA MENU DISKON"), r2 = str(vars.ribbon_2, "SAMPAI MINGGU");
            var dl = typeof vars.deadline_label === "string" ? vars.deadline_label.trim() : "Berakhir";
            var dd = str(vars.deadline, "Minggu, 23.59 WIB");
            document.getElementById("fs-w1").textContent = w1;
            document.getElementById("fs-w2").textContent = w2;
            document.getElementById("fs-pct").textContent = pct;
            var off = document.getElementById("fs-off"); off.textContent = suffix; if (!suffix) off.style.display = "none";
            document.getElementById("fs-label").textContent = dl;
            document.getElementById("fs-stamp").textContent = dd;
            fit(document.getElementById("fs-pctw"));
            fit(document.getElementById("fs-stampw"));
            var headWrap = root.querySelector(".fs-head"); fit(headWrap);

            // Each ribbon repeats its text; the run slides by exactly the width of two repeats, so it loops without a jump.
            function fillRun(id, text) {
              var run = document.getElementById(id), html = "";
              for (var i = 0; i < 16; i++) html += "<span>" + esc(text) + "&nbsp;&nbsp;•&nbsp;&nbsp;</span>";
              run.innerHTML = html;
              return run.firstElementChild.offsetWidth;
            }
            var run1 = document.getElementById("fs-run1"), run2 = document.getElementById("fs-run2");
            var unit1 = fillRun("fs-run1", r1), unit2 = fillRun("fs-run2", r2);
            document.fonts && document.fonts.ready && document.fonts.ready.then(function () { unit1 = fillRun("fs-run1", r1); unit2 = fillRun("fs-run2", r2); });

            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#fs-headin span", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out", stagger: 0.22, transformOrigin: "50% 50%" }, 0.15);
            tl.fromTo("#fs-pct", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.6);
            tl.to("#fs-pct", { x: 8 * U, duration: 0.05, yoyo: true, repeat: 9, ease: "none" }, 1.3);
            tl.fromTo("#fs-off", { x: 300 * U, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.4);
            tl.fromTo("#fs-t1", { xPercent: -100 }, { xPercent: 0, duration: 0.6, ease: "expo.out" }, 1.8);
            tl.fromTo("#fs-t2", { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: "expo.out" }, 2.0);
            tl.fromTo(run1, { x: 0 }, { x: function () { return -2 * unit1; }, duration: 6, ease: "none" }, 1.8);
            tl.fromTo(run2, { x: function () { return -2 * unit2; } }, { x: 0, duration: 6, ease: "none" }, 2.0);
            tl.to(["#fs-t1", "#fs-t2"], { yPercent: -200, opacity: 0, duration: 0.4, ease: "power2.in" }, 4.2);
            tl.fromTo("#fs-label", { y: 80 * U, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.5);
            tl.fromTo("#fs-stamp", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 4.7);

            var total = parseFloat(root.dataset.duration || "6.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["flash-sale-burst"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
