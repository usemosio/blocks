<!doctype html>
<!--
  Messenger Chat Flow

  A scripted messaging conversation with delivery details: timestamps and read ticks or a delivered receipt, a typing status in the header, a send button that morphs from mic to send, typing dots and reactions that pop onto bubbles.

  Adapted as an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn-ui/imessage-chat-flow/index.tsx
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn-ui/telegram-chat-flow/index.tsx
  Both remocn components run the same schedule as chat-flow (type, send, typing, reveal, react); they became the two styles of one block, adding the delivery details chat-flow does not show. The motion follows the sources. The look was made generic: no product names, bubble tails, signature colours (no blue and green pair), icons or fonts; the contact, messages, accent and theme are variables.

    {\"from\": \"me\", \"text\": \"Hey — ready for the demo?\", \"time\": \"9:40\"},

  ]"},

    {"value": "ticks", "label": "Timestamps and ticks"},
    {"value": "receipt", "label": "Delivered receipt"}
  ]},
    {"id": "accent_color", "type": "color", "role": "style", "label": "Accent", "description": "Colour of outgoing bubbles, the send button and the online status.", "default": "#7c5cff"},

  ]'

              if (status) {
                var themTyping = items.some(function (it) { return !it.out && f >= it.typingStart && f < it.revealAt; });
                status.textContent = themTyping ? "typing…" : "online"; status.style.fontStyle = themTyping ? "italic" : "normal";
              }
              rows.forEach(function (r) {
                var it = r.it;
                if (f < it.presenceStart) { r.row.style.display = "none"; return; }
                r.row.style.display = "flex";
                var showTyping = !!r.typ && f < it.revealAt;
                var enter = spring(f - (showTyping ? it.typingStart : it.revealAt), { damping: 16, stiffness: 200, mass: 0.7 });
                r.row.style.opacity = clamp(enter, 0, 1);
                r.row.style.transform = "translateY(" + 10 * (1 - enter) + "px) scale(" + (0.92 + 0.08 * enter) + ")";
                if (r.typ) {
                  r.typ.style.display = showTyping ? "block" : "none"; r.real.style.display = showTyping ? "none" : "block";
                  if (showTyping) for (var i = 0; i < 3; i++) { var ph = f / 30 * 6 - i * 0.9; r.typ.dots[i].style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(ph * 1.5)); }
                }
                if (r.rc) {
                  var rs = it.reactAt === undefined ? 0 : spring(f - it.reactAt, { damping: 11, stiffness: 220, mass: 0.6 });
                  r.rc.style.opacity = it.reactAt === undefined ? 0 : interp(f, it.reactAt, it.reactAt + 5, 0, 1);
                  r.rc.style.transform = "scale(" + Math.max(0, rs) + ")";
                }
                if (r.dl) r.dl.style.display = !showTyping && f > it.revealAt + REVEAL ? "inline" : "none";
              });
            }

            var seconds = parseFloat(root.dataset.duration || "12");
            var clock = { f: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { f: seconds * FPS * speed, duration: seconds, ease: "none", onUpdate: function () { draw(clock.f); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["messenger-chat-flow"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
