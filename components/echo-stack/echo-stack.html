<!--

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="echo-stack"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "One short word or phrase.", "default": "Bold."},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of the centre word.", "default": "#fafafa"},
    {"id": "echo_color", "type": "color", "role": "style", "label": "Echo color", "description": "Color of the outline copies.", "default": "#fafafa"},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which way the echoes drift.", "default": "up", "options": [{"value": "up", "label": "Up"}, {"value": "down", "label": "Down"}]},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in reference pixels (1280×720 stage).", "default": 170, "min": 60, "max": 300, "step": 1, "unit": "px"},
    {"id": "echoes", "type": "number", "role": "style", "label": "Echoes per side", "description": "Outline copies above and below the word.", "default": 3, "min": 1, "max": 6, "step": 1},
    {"id": "echo_opacity", "type": "number", "role": "style", "label": "Echo opacity", "description": "Opacity of the strongest echo.", "default": 0.35, "min": 0.05, "max": 1, "step": 0.01},
    {"id": "cycle", "type": "number", "role": "motion", "label": "Frames per row", "description": "Frames the drift takes to move one row (30 fps).", "default": 60, "min": 15, "max": 240, "step": 1, "unit": "frames"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Echo Stack</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .es-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
        .es-wrap { position: relative; }
        .es-line { line-height: 1; white-space: pre; font-weight: 800; font-variation-settings: "wght" 800; }
        .es-echo { position: absolute; left: 50%; top: 50%; }
      </style>

      <div id="root" data-composition-id="echo-stack" data-duration="4" data-fps="30">
        <div id="es-clip" class="es-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
              <filter id="es-outline">
                <feMorphology id="es-erode" in="SourceAlpha" operator="erode" radius="1.5" result="inner" />
                <feComposite in="SourceAlpha" in2="inner" operator="out" result="ring" />
                <feFlood id="es-flood" flood-color="#fafafa" />
                <feComposite in2="ring" operator="in" />
              </filter>
            </defs>
          </svg>
          <div id="es-wrap" class="es-wrap">
            <div id="es-main" class="es-line"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "4");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var text = str(vars.text, "Bold.");
            var color = col(vars.color, "#fafafa"), echoColor = col(vars.echo_color, color);
            var echoes = Math.round(num(vars.echoes, 3, 1, 6)), echoOpacity = num(vars.echo_opacity, 0.35, 0.05, 1);
            var cycle = num(vars.cycle, 60, 15, 240), speed = num(vars.speed, 1, 0.25, 4);
            var sign = pick(vars.direction, ["up", "down"], "up") === "down" ? 1 : -1;
            var unit = Math.min(root.clientWidth / 1280, root.clientHeight / 720);
            var size = num(vars.font_size, 170, 60, 300) * unit;
            var wrap = document.getElementById("es-wrap"), main = document.getElementById("es-main");
            // Keep the word inside the frame: shrink when it is wider than 90 % of the width.
            main.textContent = text; main.style.fontSize = size + "px"; main.style.color = color;
            if (main.scrollWidth > root.clientWidth * 0.9) size = size * (root.clientWidth * 0.9) / main.scrollWidth;
            main.style.fontSize = size + "px";
            document.getElementById("es-erode").setAttribute("radius", 1.5 * unit);
            document.getElementById("es-flood").setAttribute("flood-color", echoColor);
            var pitch = 1.05 * size, reach = echoes + 2, pool = [];
            for (var k = -reach; k <= reach; k++) {
              var d = document.createElement("div");
              d.className = "es-line es-echo"; d.textContent = text; d.style.fontSize = size + "px";
              d.style.color = echoColor; d.style.filter = "url(#es-outline)"; d.style.opacity = 0;
              wrap.insertBefore(d, main); pool.push({ k: k, el: d });
            }
            var easeOutCubic = function (p) { return 1 - Math.pow(1 - p, 3); };
            function smooth(x) { var c = Math.min(1, Math.max(0, x)); return c * c * (3 - 2 * c); }
            function fade(distance) {
              var dd = Math.abs(distance);
              if (dd < 0.55) return 0;
              if (dd < 1) return smooth((dd - 0.55) / 0.45);
              var r = Math.max(1, echoes + 0.5);
              return Math.max(0, 1 - (dd - 1) / (r - 1));
            }
            tick(function (tt) {
              var t = tt * 30 * speed;
              var k1 = ip(t, 0, 14, 0, 1, easeOutCubic);
              main.style.opacity = k1;
              main.style.filter = 12 * (1 - k1) > 0.05 ? "blur(" + 12 * (1 - k1) * unit + "px)" : "none";
              main.style.transform = "scale(" + (1.04 - 0.04 * k1) + ")";
              var phase = sign * ((t / cycle) % 1);
              var spread = ip(t, 8, 26, 0.6, 1, easeOutCubic), fadeIn = ip(t, 8, 24, 0, 1, easeOutCubic);
              pool.forEach(function (p) {
                var offset = p.k + phase;
                var op = echoOpacity * fadeIn * fade(offset);
                p.el.style.opacity = op > 0 ? op : 0;
                p.el.style.transform = "translate(-50%, calc(-50% + " + offset * spread * pitch + "px))";
              });
            });
            var total = parseFloat(root.dataset.duration || "4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["echo-stack"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
