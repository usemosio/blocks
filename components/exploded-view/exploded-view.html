<html
  lang="en"
  data-composition-id="exploded-view"
  data-composition-duration="2.333"
  data-composition-variables='[
    {"id": "layers", "type": "number", "role": "style", "label": "Layers", "description": "Number of slabs, 2 to 6.", "default": 4, "min": 2, "max": 6, "step": 1},
    {"id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "One label per slab, top slab first, comma separated.", "default": "Interface, Engine, Storage, Hardware"},
    {"id": "highlight", "type": "number", "role": "style", "label": "Highlight", "description": "Index of the highlighted slab, counted from the top (0 is the top slab).", "default": 1, "min": 0, "max": 5, "step": 1},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Background color.", "default": "#111111"},
    {"id": "top_color", "type": "color", "role": "style", "label": "Top face", "description": "Top face of a slab.", "default": "#F4F4F4"},
    {"id": "left_color", "type": "color", "role": "style", "label": "Left face", "description": "Left face of a slab.", "default": "#A6A6A6"},
    {"id": "right_color", "type": "color", "role": "style", "label": "Right face", "description": "Right face of a slab.", "default": "#747474"},
    {"id": "highlight_top_color", "type": "color", "role": "style", "label": "Highlight top", "description": "Top face of the highlighted slab.", "default": "#E5322D"},
    {"id": "highlight_left_color", "type": "color", "role": "style", "label": "Highlight left", "description": "Left face of the highlighted slab.", "default": "#B5231F"},
    {"id": "highlight_right_color", "type": "color", "role": "style", "label": "Highlight right", "description": "Right face of the highlighted slab.", "default": "#8A1A17"},
    {"id": "line_color", "type": "color", "role": "style", "label": "Leader lines", "description": "Leader line color.", "default": "#FFFFFF"},
    {"id": "label_color", "type": "color", "role": "style", "label": "Labels", "description": "Label text color.", "default": "#FFFFFF"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Exploded View</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--background); }
        .ev-stage { position: absolute; inset: 0; overflow: hidden; }
        .ev-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .ev-svg text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      </style>

      <div id="root" data-composition-id="exploded-view" data-duration="2.333" data-fps="30">
        <div id="ev-clip" class="ev-stage clip" data-start="0" data-duration="2.333" data-track-index="0">
          <svg class="ev-svg" id="ev-svg"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "exploded-view";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var svg = document.getElementById("ev-svg");
var n = Math.round(num(vars.layers, 4, 2, 6)), highlight = Math.round(num(vars.highlight, 1, 0, 5)), speed = num(vars.speed, 1, 0, 4);
var labels = (typeof vars.labels === "string" && vars.labels.trim() ? vars.labels : "Interface, Engine, Storage, Hardware").split(",").map(function (s) { return s.trim(); });
var C = { background: col(vars.background_color, "#111111"), top: col(vars.top_color, "#F4F4F4"), left: col(vars.left_color, "#A6A6A6"), right: col(vars.right_color, "#747474"), hTop: col(vars.highlight_top_color, "#E5322D"), hLeft: col(vars.highlight_left_color, "#B5231F"), hRight: col(vars.highlight_right_color, "#8A1A17"), line: col(vars.line_color, "#FFFFFF"), label: col(vars.label_color, "#FFFFFF") };
root.style.setProperty("--background", C.background);
var W = root.clientWidth, H0 = root.clientHeight;
// Landscape frames use the frame height as the unit; tall frames use a width-based unit so the stack and labels fit.
var H = Math.min(H0, W * 0.6);
svg.setAttribute("viewBox", "0 0 " + W + " " + H0);
var OPEN = 3, CLOSE = 38, COS30 = Math.cos(Math.PI / 6);
var side = H * 0.36, thick = H * 0.036, gap = (H * 0.27) / (n - 1), cx = W * 0.4, cy = H0 * 0.5;
var labelX = W * 0.66, fontSize = H * 0.042, h = side / 2, inset = h * 0.78;
function iso(X, Y, Z) { return [(X - Y) * COS30, (X + Y) * 0.5 - Z]; }
function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "); }
var shadow = svgEl("ellipse", { rx: side * COS30 * 1.05, ry: side * 0.16, fill: "#000000", opacity: 0.5, cx: cx }, svg);
var stack = svgEl("g", {}, svg);
var slabs = [], leaders = [];
for (var i = 0; i < n; i++) {
  var fromTop = n - 1 - i, hot = fromTop === highlight, ink = hot ? "#FFFFFF" : "#111111";
  var g = svgEl("g", {}, stack);
  var s = { fromTop: fromTop, hot: hot, g: g };
  s.left = svgEl("polygon", { fill: hot ? C.hLeft : C.left }, g);
  s.right = svgEl("polygon", { fill: hot ? C.hRight : C.right }, g);
  s.top = svgEl("polygon", { fill: hot ? C.hTop : C.top }, g);
  s.inner = svgEl("polygon", { fill: "none", stroke: ink, "stroke-opacity": 0.18, "stroke-width": H * 0.002 }, g);
  s.bars = [-0.4, 0, 0.4].map(function (k) { return { k: k, el: svgEl("line", { stroke: ink, "stroke-opacity": 0.22, "stroke-width": H * 0.006, "stroke-linecap": "round" }, g) }; });
  slabs.push(s);
  var label = labels[fromTop];
  if (label) {
    var lg = svgEl("g", {}, svg);
    var L = { fromTop: fromTop, hot: hot, g: lg };
    L.dot = svgEl("circle", { r: H * 0.006, fill: C.line }, lg);
    L.line = svgEl("line", { stroke: C.line, "stroke-opacity": 0.6, "stroke-width": Math.max(1, H * 0.0022) }, lg);
    L.text = svgEl("g", {}, lg);
    var num_ = svgEl("text", { y: -fontSize * 0.62, fill: hot ? C.hTop : C.label, "fill-opacity": hot ? 1 : 0.5, "font-size": fontSize * 0.5, "font-weight": 600, "letter-spacing": "0.12em" }, L.text);
    num_.textContent = "0" + (fromTop + 1);
    var nm = svgEl("text", { y: fontSize * 0.42, fill: C.label, "font-size": fontSize, "font-weight": 700, "letter-spacing": "-0.02em" }, L.text);
    nm.textContent = label;
    L.slab = i;
    leaders.push(L);
  }
}
function draw(frame) {
  var t = frame * speed;
  var close = spring(t - CLOSE, { damping: 26, stiffness: 320, mass: 0.8 });
  var spread = [];
  for (var i = 0; i < n; i++) spread.push(Math.max(0, spring(t - OPEN - (n - 1 - i) * 1.5, { damping: 12, stiffness: 110 }) * (1 - close)));
  var offsets = [], z = 0;
  for (i = 0; i < n; i++) { offsets.push(z); z += thick + (i < n - 1 ? gap * Math.max(spread[i + 1], 0) : 0); }
  var total = z;
  var knock = interp(t, [CLOSE + 5, CLOSE + 7, CLOSE + 12], [0, 1, 0], outQuad) * H * 0.008;
  var baseY = cy + side * 0.02 + total / 2 + knock;
  var labelOut = interp(t, [CLOSE - 5, CLOSE], [1, 0]);
  shadow.setAttribute("cy", baseY + side * 0.5 + H * 0.035);
  stack.setAttribute("transform", "translate(" + cx + " " + baseY + ")");
  slabs.forEach(function (s, i) {
    var z0 = offsets[i], z1 = z0 + thick;
    s.top.setAttribute("points", pts([iso(-h, -h, z1), iso(h, -h, z1), iso(h, h, z1), iso(-h, h, z1)]));
    s.left.setAttribute("points", pts([iso(-h, h, z1), iso(h, h, z1), iso(h, h, z0), iso(-h, h, z0)]));
    s.right.setAttribute("points", pts([iso(h, -h, z1), iso(h, h, z1), iso(h, h, z0), iso(h, -h, z0)]));
    s.inner.setAttribute("points", pts([iso(-inset, -inset, z1), iso(inset, -inset, z1), iso(inset, inset, z1), iso(-inset, inset, z1)]));
    s.bars.forEach(function (b) {
      var a = iso(-inset * 0.7, b.k * inset, z1), c = iso(inset * (s.fromTop % 2 ? 0.2 : 0.7), b.k * inset, z1);
      setA(b.el, { x1: a[0], y1: a[1], x2: c[0], y2: c[1] });
    });
  });
  leaders.forEach(function (L) {
    var i = L.slab, z0 = offsets[i], z1 = z0 + thick, anchor = iso(h, -h, (z0 + z1) / 2);
    var draw_ = interp(t, [14 + L.fromTop * 2.5, 24 + L.fromTop * 2.5], [0, 1], inOutCubic);
    var show = interp(t, [19 + L.fromTop * 2.5, 27 + L.fromTop * 2.5], [0, 1], outCubic) * labelOut;
    var ax = cx + anchor[0] + H * 0.012, ay = baseY + anchor[1], length = (labelX - ax) * draw_ * labelOut;
    setA(L.dot, { cx: ax, cy: ay, opacity: Math.min(1, draw_ * 3) * labelOut });
    setA(L.line, { x1: ax, y1: ay, x2: ax + length, y2: ay });
    setA(L.text, { opacity: show, transform: "translate(" + (labelX + H * 0.02 + (1 - show) * H * 0.03) + " " + ay + ")" });
  });
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
