<!--
  Stretch In

  Letters fly in from off-canvas and smear horizontally on the way: a vertex-lag deformation, not a scale.

<html
  lang="en"
  data-composition-id="stretch-in"
  data-composition-duration="2"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Heavy display word.", "default": "STUDIO" },
    { "id": "fill", "type": "color", "role": "style", "label": "Fill", "description": "Color of the letters.", "default": "#ffffff" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Type size in px at a 1920×1080 frame.", "default": 510, "min": 100, "max": 700, "step": 1, "unit": "px" },
    { "id": "entry_stagger", "type": "number", "role": "motion", "label": "Entry stagger", "description": "Frames between letters (30 fps).", "default": 3, "min": 0, "max": 12, "step": 1, "unit": "frames" },
    { "id": "travel_frames", "type": "number", "role": "motion", "label": "Travel frames", "description": "Frames each letter takes to arrive.", "default": 33, "min": 4, "max": 40, "step": 1, "unit": "frames" },
    { "id": "vertex_lag_frames", "type": "number", "role": "motion", "label": "Vertex lag", "description": "Frames the right edge of a letter lags its left edge. More lag, longer smear.", "default": 3.5, "min": 0, "max": 8, "step": 0.1, "unit": "frames" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Stretch In</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: Anton, Impact, sans-serif;
          pointer-events: none;
        }
        .sti-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .sti-font { position: absolute; left: 0; top: 0; opacity: 0; font-size: 20px; }
      </style>

      <div id="root" data-composition-id="stretch-in" data-duration="2" data-fps="30">
        <div id="sti-clip" class="clip" data-start="0" data-duration="2" data-track-index="0" style="position:absolute;inset:0">
          <canvas id="sti-canvas" class="sti-canvas"></canvas>
          <span class="sti-font" aria-hidden="true">STUDIO</span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("sti-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["stretch-in"] = tl;
            }
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var text = str(vars.text, "STUDIO");
            var fill = str(vars.fill, "#ffffff");
            var W = root.clientWidth, H = root.clientHeight;
            // The design is a 1920 x 1080 frame, centered and fitted ("meet") into the host frame.
            var s = Math.min(W / 1920, H / 1080);
            var ox = (W - 1920 * s) / 2, oy = (H - 1080 * s) / 2;
            var fontSize = num(vars.font_size, 510, 100, 700);
            var stagger = num(vars.entry_stagger, 3, 0, 12);
            var travelFrames = num(vars.travel_frames, 33, 4, 40);
            var lag = num(vars.vertex_lag_frames, 3.5, 0, 8);
            var TRAVEL = 1500;
            var px = fontSize * s;
            var FAMILY = "Anton, Impact, sans-serif";
            var canvas = document.getElementById("sti-canvas");
            canvas.width = W;
            canvas.height = H;
            var ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = false;

            var chars = Array.from(text);
            var letters = [], srcCanvas = document.createElement("canvas"), srcH = Math.ceil(px * 1.5), base = Math.round(px * 1.1), total = 0;
            function layout() {
              var m = document.createElement("canvas").getContext("2d");
              m.font = px + "px " + FAMILY;
              var x = 0;
              letters = chars.map(function (ch) {
                var w = m.measureText(ch).width;
                var it = { ch: ch, left: x, width: w };
                x += w;
                return it;
              });
              total = x;
              srcCanvas.width = Math.max(1, Math.ceil(total) + 2);
              srcCanvas.height = srcH;
              var c = srcCanvas.getContext("2d");
              c.clearRect(0, 0, srcCanvas.width, srcH);
              c.font = px + "px " + FAMILY;
              c.fillStyle = fill;
              c.textBaseline = "alphabetic";
              letters.forEach(function (l) { c.fillText(l.ch, l.left, base); });
            }
            var ease = bz("fly", 0.2, 0.9, 0.25, 1);
            var run = Math.max(1, travelFrames - lag);
            var P = { f: 0 };
            function draw() {
              ctx.clearRect(0, 0, W, H);
              var startX = ox + (1920 * s - total) / 2;
              // baseline of the 1920 x 1080 design: (height + 0.72 em) / 2
              var top = oy + ((1080 + fontSize * 0.72) / 2) * s - base;
              letters.forEach(function (l, i) {
                var entry = stagger * i;
                var x0 = null;
                var w = Math.ceil(l.width);
                for (var c = 0; c < w; c++) {
                  var d0 = x0 === null ? dest(c) : x0;
                  var d1 = dest(c + 1);
                  x0 = d1;
                  var a = Math.round(d0), b = Math.round(d1);
                  if (b <= a) continue;
                  ctx.drawImage(srcCanvas, l.left + c, 0, 1, srcH, a, top, b - a, srcH);
                }
                function dest(c) {
                  var u = l.width === 0 ? 0 : Math.min(1, Math.max(0, c / l.width));
                  var rem = ip(P.f, entry + u * lag, entry + u * lag + run, 1, 0, ease);
                  return startX + l.left + c + TRAVEL * s * rem;
                }
              });
            }
            layout();
            draw();
            function refresh() { layout(); draw(); }
            if (document.fonts) {
              document.fonts.load(px + "px Anton").then(refresh, function () {});
              document.fonts.ready.then(refresh, function () {});
            }
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: draw }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
