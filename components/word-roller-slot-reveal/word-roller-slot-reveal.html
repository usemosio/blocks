<!doctype html>
<!--
  Word Roller Slot Reveal

  A list of ten words scrolls through a masked window beside a fixed prefix: slow start, a fast stretch, then a very long, gentle slowdown onto the last word, which lands larger in the accent colour.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="word-roller-slot-reveal"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words in order, separated by commas (up to 14). The last one is where it settles.", "default": "Feature, Product, Design, Service, Solution, Platform, Experience, Vision, Future, Beginning"},
    {"id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Fixed text before the roller.", "default": "New"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the rolling words in pixels. A wide line shrinks to fit the frame.", "default": 64, "min": 16, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Word color", "description": "Color of the words while they roll.", "default": "#0a0a0a"},
    {"id": "accent", "type": "color", "role": "style", "label": "Final color", "description": "Color of the last word.", "default": "#2563eb"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Slot Reveal</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wsr-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #0a0a0a); }
        .wsr-g { display: flex; align-items: center; gap: 0.3125em; line-height: 1; }
        .wsr-pre { font-weight: 500; white-space: pre; }
        .wsr-win { position: relative; overflow: hidden; height: 1.5625em; }
        .wsr-mask { position: absolute; left: 0; right: 0; height: 0.3125em; z-index: 1; }
        .wsr-mask.t { top: 0; }
        .wsr-mask.b { bottom: 0; }
        .wsr-strip { position: absolute; left: 0; top: 0; right: 0; }
        .wsr-item { height: 1.5625em; display: flex; align-items: center; white-space: pre; }

        .wsr-sizer { display: grid; height: 0; overflow: hidden; visibility: hidden; pointer-events: none; }
        .wsr-sizer span { grid-area: 1 / 1; white-space: pre; }

        .wsr-sizer span { font-size: 1.25em; font-weight: 800; }

      </style>

      <div id="root" data-composition-id="word-roller-slot-reveal" data-duration="4" data-fps="30">
        <div id="wsr-clip" class="wsr-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="wsr-g" class="wsr-g">
            <div id="wsr-pre" class="wsr-pre"></div>
            <div class="wsr-win">
              <div id="wsr-sizer" class="wsr-sizer"></div>
              <div id="wsr-mt" class="wsr-mask t"></div>
              <div id="wsr-mb" class="wsr-mask b"></div>
              <div id="wsr-strip" class="wsr-strip"><div id="wsr-i0" class="wsr-item"></div><div id="wsr-i1" class="wsr-item"></div></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "4");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-slot-reveal"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var words = list(vars.words, ["Feature", "Product", "Design", "Service", "Solution", "Platform", "Experience", "Vision", "Future", "Beginning"], 14);
            var fi = words.length - 1;
            var g = el("wsr-g"), pre = el("wsr-pre"), strip = el("wsr-strip"), i0 = el("wsr-i0"), i1 = el("wsr-i1");
            var color = str(vars.color, "#0a0a0a"), accent = str(vars.accent, "#2563eb");
            root.style.setProperty("--c", color);
            var bg = str(vars.background, "#fafafa");
            el("wsr-mt").style.background = "linear-gradient(" + bg + ", transparent)";
            el("wsr-mb").style.background = "linear-gradient(transparent, " + bg + ")";
            pre.textContent = txt(vars.prefix, "New");
            fillSizer(el("wsr-sizer"), words);
            var base = num(vars.font_size, 64, 16, 240);
            function fit() { fitG(g, base, null, 0.88, 0.8); }
            fit();
            onFonts(fit);

            function sty(node, idx) {
              var fin = idx === fi;
              setText(node, words[idx]);
              node.style.fontSize = fin ? "1.25em" : "1em";
              node.style.height = (1.5625 / (fin ? 1.25 : 1)) + "em";
              node.style.fontWeight = fin ? 700 : 600;
              node.style.color = fin ? accent : color;
            }
            // remocn-scenes: one eased scroll over 85 frames (very slow, fast, then a long ease-out),
            // with a spring blending the last 15 frames onto the end position. wordHeight = 100 px at 64 px type.
            function ease(x) {
              if (x < 0.15) return 0.02 * Math.pow(x / 0.15, 2);
              if (x < 0.3) return 0.02 + 0.45 * ((x - 0.15) / 0.15);
              return 0.47 + 0.53 * (1 - Math.pow(1 - (x - 0.3) / 0.7, 7));
            }
            function draw(f) {
              var WH = 100, D = 85, total = fi * WH;
              var scrollY = ease(clamp01(f / D)) * total;
              var stopping = f >= D - 15;
              var sp = stopping ? spring(f - (D - 15), { damping: 20, stiffness: 150 }) : 0;
              var fs = stopping ? scrollY + (total - scrollY) * sp : scrollY;
              var di = Math.min(Math.floor(fs / WH), fi);
              var off = fs % WH;
              sty(i0, di);
              i1.style.display = di < fi ? "" : "none";
              if (di < fi) sty(i1, Math.min(di + 1, fi));
              strip.style.transform = "translateY(" + (-off / 64) + "em)";
              pre.style.opacity = ip(f, 0, 15, 0, 1);
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
