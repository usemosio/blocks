<!--
  Bottom-Up Letters

  Letters rise from below in a pronounced staircase, one symbol at a time.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="bottom-up-letters"
  data-composition-duration="2"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Short word or acronym that rises in.", "default": "Shift"},
    {"id": "stagger_delay", "type": "number", "role": "motion", "label": "Stagger", "description": "Frames between one letter and the next.", "default": 3, "min": 1, "max": 12, "step": 1, "unit": "frames"},
    {"id": "distance", "type": "number", "role": "motion", "label": "Distance", "description": "How far below its place each letter starts.", "default": 46, "min": 0, "max": 120, "step": 1, "unit": "px"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Bottom-Up Letters</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: var(--color, #171717); font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; }
        .bul-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .bul-line { letter-spacing: -0.05em; line-height: 1.2; white-space: pre; }
        .bul-char { display: inline-block; white-space: pre; opacity: 0; backface-visibility: hidden; transform-origin: 50% 55%; }
      </style>

      <div id="root" data-composition-id="bottom-up-letters" data-duration="2" data-fps="30">
        <div id="bul-clip" class="bul-stage clip" data-start="0" data-duration="2" data-track-index="0">
          <span id="bul-line" class="bul-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            // cubic-bezier(x1, y1, x2, y2) as an easing function (Remotion's Easing.bezier), solved by bisection.
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            // interpolate(x, [a, b], [from, to], { easing, extrapolateLeft: "clamp", extrapolateRight: "clamp" }).
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : Math.min(1, Math.max(0, (x - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            var TOTAL = parseFloat(root.dataset.duration || "2");
            var FRAMES = TOTAL * 30;
            // Drive draw(frame) from the timeline, so seeking to a time always draws the same picture.
            var clock = { frame: 0 };
            function frameNow() {
              return Math.round(clock.frame * 1000) / 1000;
            }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["bottom-up-letters"] = tl;
            }
            // Re-measure once the web font is in, then redraw the current frame.
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }

            // Shrink an element's font size so it fits a fraction of the frame.
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) {
                size = Math.max(8, size * k);
                el.style.fontSize = size + "px";
              }
              return size;
            }

            var text = str(vars.text, "Shift");
            var stagger = num(vars.stagger_delay, 3, 1, 12);
            var distance = num(vars.distance, 46, 0, 120);
            var size = num(vars.font_size, 72, 12, 240);
            var speed = num(vars.speed, 1, 0.25, 4);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);

            var line = document.getElementById("bul-line");
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            line.setAttribute("aria-label", text);
            var chars = Array.from(text).map(function (ch, i) {
              var span = document.createElement("span");
              span.id = "bul-char-" + i;
              span.className = "bul-char";
              span.textContent = ch;
              line.appendChild(span);
              return span;
            });
            fit(line, size, 0.9);
            onFonts(function () { fit(line, size, 0.9); });

            // Each letter fades over 12 frames and travels over 7, `stagger` frames after the previous one.
            var ease = bezier(0.18, 1, 0.32, 1);
            start(function (raw) {
              var frame = raw * speed;
              chars.forEach(function (span, i) {
                var local = frame - i * stagger;
                span.style.opacity = ip(local, 0, 12, 0, 1, ease);
                span.style.transform = "translateY(" + ip(local, 0, 7, distance, 0, ease) + "px)";
              });
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
