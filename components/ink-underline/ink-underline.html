<html
  lang="en"
  data-composition-id="ink-underline"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "width", "type": "number", "role": "style", "label": "Width", "description": "Stroke length in pixels (capped to 90% of the frame).", "default": 420, "min": 100, "max": 1600, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Ink color", "description": "Color of the stroke.", "default": "#6f7f35"},
    {"id": "thickness", "type": "number", "role": "style", "label": "Brush width", "description": "Stroke thickness in pixels.", "default": 9, "min": 2, "max": 40, "step": 1, "unit": "px"},
    {"id": "pressure", "type": "number", "role": "style", "label": "Opening pressure", "description": "Width at the start of the stroke, 0 to 1.", "default": 1, "min": 0.05, "max": 1, "step": 0.05},
    {"id": "release", "type": "number", "role": "style", "label": "Closing pressure", "description": "Width at the end of the stroke, 0 to 1.", "default": 0.15, "min": 0.05, "max": 1, "step": 0.05},
    {"id": "grain", "type": "number", "role": "style", "label": "Grain", "description": "How rough the brush edge is.", "default": 1, "min": 0, "max": 2, "step": 0.05},
    {"id": "delay", "type": "number", "role": "motion", "label": "Delay", "description": "Frames before the stroke starts (30 fps).", "default": 0, "min": 0, "max": 120, "step": 1, "unit": "frames"},
    {"id": "duration_steps", "type": "number", "role": "motion", "label": "Poses to draw", "description": "Stop-motion poses the stroke takes to draw.", "default": 5, "min": 2, "max": 10, "step": 1},
    {"id": "seed", "type": "string", "role": "style", "label": "Seed", "description": "Any text; changes the stroke wobble and grain.", "default": "ink"},
    {"id": "step", "type": "number", "role": "motion", "label": "Frames per pose", "description": "Stop-motion clock, in frames at 30 fps.", "default": 3, "min": 1, "max": 6, "step": 1, "unit": "frames"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ink Underline</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .iu-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .iu-box { position: relative; }
        .iu-svg { position: absolute; display: block; overflow: visible; }
      </style>

      <div id="root" data-composition-id="ink-underline" data-duration="4" data-fps="30">
        <div id="iu-clip" class="iu-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="iu-box" class="iu-box">
            <svg id="iu-svg" class="iu-svg">
              <defs>
                <filter id="iu-grain" x="-30%" y="-30%" width="160%" height="160%">
                  <feTurbulence id="iu-turb" type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="1" result="brushGrain" />
                  <feDisplacementMap id="iu-disp" in="SourceGraphic" in2="brushGrain" scale="0" xChannelSelector="R" yChannelSelector="G" />
                </filter>
              </defs>
              <path id="iu-path" d="" opacity="0.85" />
            </svg>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "4");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var box = document.getElementById("iu-box");
            var svg = document.getElementById("iu-svg");
            var pathEl = document.getElementById("iu-path");
            var width = Math.min(num(vars.width, 420, 100, 1600), root.clientWidth * 0.9);
            var thick = num(vars.thickness, 9, 2, 40);
            var pressure = num(vars.pressure, 1, 0.05, 1);
            var release = num(vars.release, 0.15, 0.05, 1);
            var grain = num(vars.grain, 1, 0, 2);
            var delay = num(vars.delay, 0, 0, 120);
            var poses = num(vars.duration_steps, 5, 2, 10);
            var step = num(vars.step, 3, 1, 6);
            var seed = str(vars.seed, "ink");
            var grainScale = thick * 0.5 * grain;
            var reach = thick / 2 + grainScale / 2;
            var height = thick + 4;
            box.style.width = width + "px"; box.style.height = height + "px";
            svg.setAttribute("width", width + reach * 2); svg.setAttribute("height", height + reach * 2);
            svg.setAttribute("viewBox", -reach + " " + -reach + " " + (width + reach * 2) + " " + (height + reach * 2));
            svg.style.left = -reach + "px"; svg.style.top = -reach + "px";
            pathEl.setAttribute("fill", col(vars.color, "#6f7f35"));
            document.getElementById("iu-turb").setAttribute("seed", Math.floor(hash01(seed + ":grain") * 1000));
            document.getElementById("iu-disp").setAttribute("scale", grainScale);
            if (grain > 0) pathEl.setAttribute("filter", "url(#iu-grain)");
            // Spine: a gentle cubic, sampled at 40 points.
            var wob = hashRange(seed + ":w", -1.2, 1.2), mid = thick / 2 + 2, N = 40, spine = [];
            for (var i = 0; i < N; i++) {
              var u = i / (N - 1), v = 1 - u;
              var c1x = width * 0.3, c2x = width * 0.7, c1y = mid + wob, c2y = mid - wob, ey = mid + wob * 0.6;
              spine.push({ x: v * v * v * 2 + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * (width - 2), y: v * v * v * mid + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * ey });
            }
            function normal(k) {
              var a = spine[k - 1] || spine[k], b = spine[k + 1] || spine[k];
              var tx = b.x - a.x, ty = b.y - a.y, len = Math.hypot(tx, ty) || 1;
              return { x: -ty / len, y: tx / len };
            }
            function curve(pts) {
              var out = [];
              for (var k = 0; k < pts.length - 1; k++) {
                var p1 = pts[k], p0 = pts[k - 1] || p1, p2 = pts[k + 1], p3 = pts[k + 2] || p2;
                out.push("C " + (p1.x + (p2.x - p0.x) / 6) + " " + (p1.y + (p2.y - p0.y) / 6) + ", " + (p2.x - (p3.x - p1.x) / 6) + " " + (p2.y - (p3.y - p1.y) / 6) + ", " + p2.x + " " + p2.y);
              }
              return out.join(" ");
            }
            function ribbon(progress) {
              var drawn = Math.max(2, Math.round(progress * (spine.length - 1)) + 1), left = [], right = [];
              for (var k = 0; k < drawn; k++) {
                var half = (thick / 2) * (pressure + (release - pressure) * (k / (spine.length - 1)));
                var n = normal(k);
                left.push({ x: spine[k].x + n.x * half, y: spine[k].y + n.y * half });
                right.push({ x: spine[k].x - n.x * half, y: spine[k].y - n.y * half });
              }
              var back = right.slice().reverse();
              return "M " + left[0].x + " " + left[0].y + " " + curve(left) + " L " + back[0].x + " " + back[0].y + " " + curve(back) + " Z";
            }
            tick(function (t) {
              var f = qf(Math.floor(t * 30 + 1e-6), step);
              var progress = f <= delay ? 0 : f >= delay + poses * step ? 1 : (f - delay) / (poses * step);
              box.style.opacity = progress > 0 ? 1 : 0;
              pathEl.setAttribute("d", ribbon(progress));
            });
            var total = parseFloat(root.dataset.duration || "4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["ink-underline"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
