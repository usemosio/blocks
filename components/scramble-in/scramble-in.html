<html
  lang="en"
  data-composition-id="scramble-in"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Lines of text, separated by a line break.", "default": "1. Opening Titles - 2:14\n2. Slow Motion - 3:27\n3. Night Drive - 4:58\n4. Paper Planes - 3:45\n5. Interlude - 1:44\n6. Golden Hour - 3:57\n7. Open Road - 3:22\n8. Something About Us - 3:51\n9. Last Light - 5:44\n10. Short Circuit - 3:26"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Long lines shrink to fit the frame.", "default": 34, "min": 12, "max": 120, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Color of the letters that have resolved.", "default": "#111111"},
    {"id": "scrambled_color", "type": "color", "role": "style", "label": "Scrambled color", "description": "Color of the random glyphs ahead of the cursor.", "default": "#9ca3af"},
    {"id": "characters", "type": "string", "role": "content", "label": "Characters", "description": "Pool the random glyphs come from.", "default": "abcdefghijklmnopqrstuvwxyz!@#$%^&amp;*()_+"},
    {"id": "line_height", "type": "number", "role": "style", "label": "Line height", "description": "Line height as a multiple of the font size.", "default": 1.6, "min": 1, "max": 3, "step": 0.05},
    {"id": "scramble_speed", "type": "number", "role": "motion", "label": "Scramble speed", "description": "Milliseconds per step: each step reveals one more letter.", "default": 25, "min": 10, "max": 200, "step": 5, "unit": "ms"},
    {"id": "scrambled_letters", "type": "number", "role": "motion", "label": "Scrambled letters", "description": "How many random glyphs run ahead of the cursor.", "default": 5, "min": 0, "max": 16, "step": 1},
    {"id": "line_delay", "type": "number", "role": "motion", "label": "Line delay", "description": "Seconds between the start of one line and the next.", "default": 0.05, "min": 0, "max": 1, "step": 0.01, "unit": "s"},
    {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first line starts.", "default": 0.2, "min": 0, "max": 3, "step": 0.05, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Scramble In</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #111111; font-family: "Geist Mono", ui-monospace, monospace; }
        .si-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .si-block { text-align: left; }
        .si-line { white-space: pre; }
        .si-ch { display: inline-block; }
      </style>

      <div id="root" data-composition-id="scramble-in" data-duration="4" data-fps="30">
        <div id="si-clip" class="si-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="si-block" class="si-block" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Lines of text, separated by a line break.", "default": "1. Opening Titles - 2:14\n2. Slow Motion - 3:27\n3. Night Drive - 4:58\n4. Paper Planes - 3:45\n5. Interlude - 1:44\n6. Golden Hour - 3:57\n7. Open Road - 3:22\n8. Something About Us - 3:51\n9. Last Light - 5:44\n10. Short Circuit - 3:26"}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Long lines shrink to fit the frame.", "default": 34, "min": 12, "max": 120, "step": 1, "unit": "px"}, {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}]}, {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Color of the letters that have resolved.", "default": "#111111"}, {"id": "scrambled_color", "type": "color", "role": "style", "label": "Scrambled color", "description": "Color of the random glyphs ahead of the cursor.", "default": "#9ca3af"}, {"id": "characters", "type": "string", "role": "content", "label": "Characters", "description": "Pool the random glyphs come from.", "default": "abcdefghijklmnopqrstuvwxyz!@#$%^&*()_+"}, {"id": "line_height", "type": "number", "role": "style", "label": "Line height", "description": "Line height as a multiple of the font size.", "default": 1.6, "min": 1, "max": 3, "step": 0.05}, {"id": "scramble_speed", "type": "number", "role": "motion", "label": "Scramble speed", "description": "Milliseconds per step: each step reveals one more letter.", "default": 25, "min": 10, "max": 200, "step": 5, "unit": "ms"}, {"id": "scrambled_letters", "type": "number", "role": "motion", "label": "Scrambled letters", "description": "How many random glyphs run ahead of the cursor.", "default": 5, "min": 0, "max": 16, "step": 1}, {"id": "line_delay", "type": "number", "role": "motion", "label": "Line delay", "description": "Seconds between the start of one line and the next.", "default": 0.05, "min": 0, "max": 1, "step": 0.01, "unit": "s"}, {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first line starts.", "default": 0.2, "min": 0, "max": 3, "step": 0.05, "unit": "s"}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "4");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var block = document.getElementById("si-block");
            var text = V("text") || "Scramble in";
            var lines = text.split("\n");
            block.setAttribute("aria-label", text);
            var longest = 1;
            lines.forEach(function (l) { longest = Math.max(longest, fitText(l).length); });
            block.style.fontSize = "min(" + V("font_size") + "px, calc(88cqw / " + (longest * 0.6).toFixed(2) + "))";
            block.style.fontWeight = V("font_weight");
            block.style.lineHeight = V("line_height");
            block.style.color = V("color");
            var scrambledColor = V("scrambled_color");
            var pool = Array.from(V("characters") || "abc");
            var rows = lines.map(function (l, li) {
              var row = document.createElement("div"); row.className = "si-line"; row.id = "si-line-" + li; row.setAttribute("aria-hidden", "true");
              var chars = fitText(l).map(function (ch, j) {
                var s = document.createElement("span"); s.className = "si-ch"; s.id = "si-ch-" + li + "-" + j;
                s.textContent = ch; s.style.visibility = "hidden";
                row.appendChild(s); return { el: s, ch: ch };
              });
              if (!chars.length) row.textContent = " ";
              block.appendChild(row);
              return chars;
            });
            var count = V("scrambled_letters"), step = V("scramble_speed") / 1000, lineDelay = V("line_delay"), start = V("start");
            var tl = gsap.timeline({ paused: true });
            function draw(t) {
              for (var li = 0; li < rows.length; li++) {
                var chars = rows[li], L = chars.length;
                var n = Math.floor((t - start - li * lineDelay) / step + 1e-6);
                var v = Math.max(0, Math.min(n, L));
                var scr = n < 0 ? 0 : Math.min(L - v, count);
                for (var j = 0; j < L; j++) {
                  var c = chars[j].el;
                  if (n >= 0 && j < v) { c.style.visibility = "visible"; c.style.color = ""; c.textContent = chars[j].ch; }
                  else if (j < v + scr) { c.style.visibility = "visible"; c.style.color = scrambledColor; c.textContent = pool[Math.floor(hash3(li, j, n) * pool.length)]; }
                  else c.style.visibility = "hidden";
                }
              }
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scramble-in"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
