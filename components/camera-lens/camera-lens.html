<!doctype html>
<!--
  Camera Lens

  A scene behind real glass: resolution falling toward the corners, blooming highlights and
  edge fringing. The scene here is a render queue.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/camera-lens/index.tsx

  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR

  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a render queue) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="camera-lens"
  data-composition-duration="3"
  data-composition-variables='[{"id": "title", "type": "string", "role": "content", "label": "Title", "description": "Small heading above the list in the sample scene.", "default": "Render queue"}, {"id": "items", "type": "string", "role": "content", "label": "Rows", "description": "Rows of the list as name | status, separated by semicolons (up to 5).", "default": "intro-scene.mp4 | Done; feature-tour.mp4 | Rendering; pricing-outro.mp4 | Queued"}, {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Background of the list scene.", "default": "#101828"}, {"id": "softness", "type": "number", "role": "style", "label": "Softness", "description": "How soft the corners get.", "default": 0.5, "min": 0, "max": 2, "step": 0.05}, {"id": "bloom", "type": "number", "role": "style", "label": "Bloom", "description": "Glow around bright areas.", "default": 0.5, "min": 0, "max": 2, "step": 0.05}, {"id": "aberration", "type": "number", "role": "style", "label": "Aberration", "description": "Red and blue fringing toward the edges.", "default": 0.5, "min": 0, "max": 3, "step": 0.1}, {"id": "vignette", "type": "number", "role": "style", "label": "Vignette", "description": "Falloff of the light toward the corners.", "default": 0.5, "min": 0, "max": 1.5, "step": 0.05}, {"id": "distortion", "type": "number", "role": "style", "label": "Distortion", "description": "Barrel bend of the lens.", "default": 0.05, "min": 0, "max": 0.6, "step": 0.01}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. The lens look is soft; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Camera Lens</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .cml-stage {
          position: absolute;
          inset: 0;
        }
        .cml-canvas,
        .cml-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .cml-scene {
          display: none;
        }
        .cml-off .cml-canvas {
          display: none;
        }
        .cml-off .cml-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="camera-lens" data-duration="3" data-fps="30">
        <div id="cml-clip" class="cml-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <canvas id="cml-scene0" class="cml-scene cml-fb"></canvas>
          <canvas id="cml-canvas" class="cml-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "camera-lens";
            var root = document.getElementById("root");
            var stage = document.getElementById("cml-clip");
            var canvas = document.getElementById("cml-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "title", "type": "string", "default": "Render queue"}, {"id": "items", "type": "string", "default": "intro-scene.mp4 | Done; feature-tour.mp4 | Rendering; pricing-outro.mp4 | Queued"}, {"id": "background", "type": "color", "default": "#101828"}, {"id": "softness", "type": "number", "default": 0.5, "min": 0, "max": 2}, {"id": "bloom", "type": "number", "default": 0.5, "min": 0, "max": 2}, {"id": "aberration", "type": "number", "default": 0.5, "min": 0, "max": 3}, {"id": "vignette", "type": "number", "default": 0.5, "min": 0, "max": 1.5}, {"id": "distortion", "type": "number", "default": 0.05, "min": 0, "max": 0.6}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["cml-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "B": a render queue (remocn's CanvasSceneB), laid out for any frame size.
            var rows = pairs(V.items, 5);
            function drawB(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, V.background);
              var s = S, pad = 96 * s, inner = W - pad * 2;
              var titleH = 41 * s, rowH = 120 * s, line = Math.max(1, s);
              var total = titleH + 34 * s + rows.length * (rowH + line);
              var y = (H - total) / 2;
              ctx.fillStyle = MUTED;
              fitFont(ctx, V.title, inner, 400, 34 * s, SANS);
              ctx.fillText(V.title, pad, y + titleH / 2);
              y += titleH + 34 * s;
              rows.forEach(function (row, i) {
                ctx.fillStyle = "#23304a";
                ctx.fillRect(pad, y, inner, line);
                var mid = y + line + rowH / 2;
                var label = row[1] || "";
                var pillW = 0;
                if (label) {
                  var labelSize = fitFont(ctx, label, inner * 0.4, 500, 30 * s, SANS);
                  pillW = ctx.measureText(label).width + 52 * s;
                  var pillH = labelSize * 1.2 + 24 * s;
                  var px = pad + inner - pillW;
                  ctx.fillStyle = TONES[i % TONES.length];
                  ctx.beginPath();
                  ctx.roundRect(px, mid - pillH / 2, pillW, pillH, pillH / 2);
                  ctx.fill();
                  ctx.fillStyle = V.background;
                  ctx.textAlign = "center";
                  ctx.fillText(label, px + pillW / 2, mid);
                  ctx.textAlign = "left";
                }
                ctx.fillStyle = INK;
                fitFont(ctx, row[0], inner - pillW - 24 * s, 400, 44 * s, MONO);
                ctx.fillText(row[0], pad, mid);
                y += rowH + line;
              });
            }

            function drawScenes() {
              drawB(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform float u_aspect;
uniform float u_softness;
uniform float u_bloom;
uniform float u_aberration;
uniform float u_vignette;
uniform float u_distortion;

in vec2 v_uv;
out vec4 outColor;

const int SOFT_TAPS = 6;
const int GLARE_TAPS = 8;
const float GOLDEN = 2.39996323;

vec2 lensUv(vec2 direction, float distance) {
  vec2 q = direction * distance;
  q.x /= u_aspect;
  return q * 0.5 + 0.5;
}

vec2 spiral(int index, int count, float radius, float turn) {
  float angle = float(index) * GOLDEN + turn;
  float step = sqrt((float(index) + 0.5) / float(count)) * radius;
  return vec2(cos(angle) * step / u_aspect, sin(angle) * step);
}

vec4 softSample(vec2 uv, float radius) {
  vec4 sum = texture(u_scene, uv);
  if (radius <= 0.00002) {
    return sum;
  }
  for (int i = 0; i < SOFT_TAPS; i++) {
    sum += texture(u_scene, uv + spiral(i, SOFT_TAPS, radius, 0.0));
  }
  return sum / float(SOFT_TAPS + 1);
}

void main() {
  vec2 p = (v_uv - 0.5) * 2.0;
  p.x *= u_aspect;

  float span = sqrt(u_aspect * u_aspect + 1.0);
  float reach = length(p);
  float radius = reach / span;
  vec2 direction = reach > 0.0001 ? p / reach : vec2(0.0);

  float bend = 1.0 / (1.0 + clamp(u_distortion, 0.0, 1.0) * radius * radius);
  float focused = reach * bend;
  vec2 base = lensUv(direction, focused);

  float soft = u_softness * 0.011 * smoothstep(0.22, 1.0, radius);
  float split = u_aberration * 0.0035 * radius;

  vec4 mid = softSample(base, soft);
  float red = softSample(lensUv(direction, focused * (1.0 + split)), soft).r;
  float blue = softSample(lensUv(direction, focused * (1.0 - split)), soft).b;
  vec3 color = vec3(red, mid.g, blue);

  vec3 glare = vec3(0.0);
  for (int i = 0; i < GLARE_TAPS; i++) {
    vec3 tap =
      texture(u_scene, base + spiral(i, GLARE_TAPS, u_bloom * 0.026, 0.7)).rgb;
    glare += max(tap - 0.62, vec3(0.0));
  }
  color += (glare / float(GLARE_TAPS)) * u_bloom * 1.4;

  float falloff = pow(cos(min(radius, 1.0) * 0.55), 4.0);
  color *= mix(1.0, falloff, clamp(u_vignette, 0.0, 1.5));

  outColor = vec4(clamp(color, 0.0, 1.0), mid.a);
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              gl.uniform1f(u("u_softness"), V.softness);
              gl.uniform1f(u("u_bloom"), V.bloom);
              gl.uniform1f(u("u_aberration"), V.aberration);
              gl.uniform1f(u("u_vignette"), V.vignette);
              gl.uniform1f(u("u_distortion"), V.distortion);

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("cml-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "3");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
