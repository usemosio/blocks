<!--

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="pixelate-text"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading line.", "default": "Ari Yu"},
    {"id": "subtitle", "type": "string", "role": "content", "label": "Subtitle", "description": "Line under the heading.", "default": "Creative Director &amp; Writer"},
    {"id": "body", "type": "string", "role": "content", "label": "Body", "description": "Paragraph under the subtitle.", "default": "Selected works: Dreamweaver #93, Starlight #87 “digital dreams”, The Quantum Mirror, Holograph Vol. 5, Byte Flow Vol. 12, Neural Canvas #9, Nebula #4 and the Binary Pulse zine."},
    {"id": "title_size", "type": "number", "role": "style", "label": "Title size", "description": "Title size in pixels.", "default": 96, "min": 16, "max": 260, "step": 1, "unit": "px"},
    {"id": "body_size", "type": "number", "role": "style", "label": "Body size", "description": "Body text size in pixels.", "default": 34, "min": 12, "max": 120, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Text color.", "default": "#111111"},
    {"id": "muted_color", "type": "color", "role": "style", "label": "Muted color", "description": "Color of the subtitle and body.", "default": "#6b7280"},
    {"id": "swatch", "type": "boolean", "role": "style", "label": "Swatch", "description": "Show a gradient square next to the text, pixelated along with it.", "default": true},
    {"id": "swatch_from", "type": "color", "role": "style", "label": "Swatch from", "description": "First color of the swatch.", "default": "#ff9a8b"},
    {"id": "swatch_to", "type": "color", "role": "style", "label": "Swatch to", "description": "Second color of the swatch.", "default": "#4f46e5"},
    {"id": "start_size", "type": "number", "role": "motion", "label": "Start pixel size", "description": "Size of the pixel blocks at the start, in pixels.", "default": 40, "min": 4, "max": 120, "step": 1, "unit": "px"},
    {"id": "hold", "type": "number", "role": "motion", "label": "Hold", "description": "Seconds the block holds at its coarsest before resolving.", "default": 0.3, "min": 0, "max": 3, "step": 0.05, "unit": "s"},
    {"id": "resolve", "type": "number", "role": "motion", "label": "Resolve", "description": "Seconds the blocks take to shrink to one pixel (ease out).", "default": 1.4, "min": 0.2, "max": 5, "step": 0.05, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pixelate Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #111111; font-family: Geist, system-ui, sans-serif; }
        .px-defs { position: absolute; width: 0; height: 0; }
        .px-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .px-col { width: min(80cqw, 1000px); display: flex; flex-direction: column; gap: 1.6em; }
        .px-title { font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
        .px-sub { font-weight: 600; line-height: 1.25; margin-top: 0.4em; }
        .px-body { line-height: 1.45; }
        .px-swatch { width: 34cqmin; aspect-ratio: 1; border-radius: 0.6cqmin; }
      </style>

      <div id="root" data-composition-id="pixelate-text" data-duration="3.5" data-fps="30">
        <svg class="px-defs" aria-hidden="true"><defs>
          <filter id="px-filter" x="0" y="0" width="1" height="1">
            <feConvolveMatrix kernelMatrix="1 1 1 1 1 1 1 1 1" result="AVG" />
            <feFlood x="1" y="1" width="1" height="1" />
            <feComposite id="px-tile" operator="arithmetic" k1="0" k2="1" k3="0" k4="0" width="16" height="16" />
            <feTile result="TILE" />
            <feComposite in="AVG" in2="TILE" operator="in" k1="0" k2="1" k3="0" k4="0" />
            <feMorphology id="px-dilate" operator="dilate" radius="8" />
          </filter>
        </defs></svg>
        <div id="px-clip" class="px-stage clip" data-start="0" data-duration="3.5" data-track-index="0">
          <div id="px-col" class="px-col">
            <div id="px-swatch" class="px-swatch"></div>
            <div><div id="px-title" class="px-title"></div><div id="px-sub" class="px-sub"></div></div>
            <p id="px-body" class="px-body"></p>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading line.", "default": "Ari Yu"}, {"id": "subtitle", "type": "string", "role": "content", "label": "Subtitle", "description": "Line under the heading.", "default": "Creative Director & Writer"}, {"id": "body", "type": "string", "role": "content", "label": "Body", "description": "Paragraph under the subtitle.", "default": "Selected works: Dreamweaver #93, Starlight #87 “digital dreams”, The Quantum Mirror, Holograph Vol. 5, Byte Flow Vol. 12, Neural Canvas #9, Nebula #4 and the Binary Pulse zine."}, {"id": "title_size", "type": "number", "role": "style", "label": "Title size", "description": "Title size in pixels.", "default": 96, "min": 16, "max": 260, "step": 1, "unit": "px"}, {"id": "body_size", "type": "number", "role": "style", "label": "Body size", "description": "Body text size in pixels.", "default": 34, "min": 12, "max": 120, "step": 1, "unit": "px"}, {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Text color.", "default": "#111111"}, {"id": "muted_color", "type": "color", "role": "style", "label": "Muted color", "description": "Color of the subtitle and body.", "default": "#6b7280"}, {"id": "swatch", "type": "boolean", "role": "style", "label": "Swatch", "description": "Show a gradient square next to the text, pixelated along with it.", "default": true}, {"id": "swatch_from", "type": "color", "role": "style", "label": "Swatch from", "description": "First color of the swatch.", "default": "#ff9a8b"}, {"id": "swatch_to", "type": "color", "role": "style", "label": "Swatch to", "description": "Second color of the swatch.", "default": "#4f46e5"}, {"id": "start_size", "type": "number", "role": "motion", "label": "Start pixel size", "description": "Size of the pixel blocks at the start, in pixels.", "default": 40, "min": 4, "max": 120, "step": 1, "unit": "px"}, {"id": "hold", "type": "number", "role": "motion", "label": "Hold", "description": "Seconds the block holds at its coarsest before resolving.", "default": 0.3, "min": 0, "max": 3, "step": 0.05, "unit": "s"}, {"id": "resolve", "type": "number", "role": "motion", "label": "Resolve", "description": "Seconds the blocks take to shrink to one pixel (ease out).", "default": 1.4, "min": 0.2, "max": 5, "step": 0.05, "unit": "s"}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "3.5");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var col = document.getElementById("px-col");
            document.getElementById("px-title").textContent = V("title");
            document.getElementById("px-sub").textContent = V("subtitle");
            document.getElementById("px-body").textContent = V("body");
            var title = document.getElementById("px-title"), sub = document.getElementById("px-sub"), body = document.getElementById("px-body"), sw = document.getElementById("px-swatch");
            title.style.fontSize = V("title_size") + "px"; title.style.color = V("color");
            sub.style.fontSize = Math.round(V("title_size") * 0.34) + "px"; sub.style.color = V("color");
            body.style.fontSize = V("body_size") + "px"; body.style.color = V("muted_color");
            if (V("swatch")) sw.style.background = "linear-gradient(135deg, " + V("swatch_from") + ", " + V("swatch_to") + ")"; else sw.style.display = "none";
            var tile = document.getElementById("px-tile"), dil = document.getElementById("px-dilate");
            var size0 = V("start_size"), hold = V("hold"), resolve = V("resolve");
            gsap.registerPlugin(CustomEase);
            var easeOut = CustomEase.create("px-out", "M0,0 C0,0 0.58,1 1,1");
            var tl = gsap.timeline({ paused: true });
            var lastSize = -1;
            function draw(t) {
              var p = Math.min(1, Math.max(0, (t - hold) / resolve));
              var size = size0 + (1 - size0) * easeOut(p);
              if (size < 1.5) { if (lastSize !== 0) col.style.filter = ""; lastSize = 0; return; }
              size = Math.round(size * 4) / 4;
              if (size !== lastSize) { tile.setAttribute("width", size); tile.setAttribute("height", size); dil.setAttribute("radius", (size / 2).toFixed(2)); lastSize = size; }
              col.style.filter = "url(#px-filter)";
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["pixelate-text"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
