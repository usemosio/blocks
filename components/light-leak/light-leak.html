  Light Leak

<html
  lang="en"
  data-composition-id="light-leak"
  data-composition-duration="0.6667"
  data-composition-variables='[
    {"id": "origin", "type": "enum", "role": "motion", "label": "Origin", "description": "Edge the leak drifts in from.", "default": "left", "options": [{"value": "left", "label": "Left"}, {"value": "right", "label": "Right"}, {"value": "top", "label": "Top"}, {"value": "bottom", "label": "Bottom"}]},
    {"id": "intensity", "type": "number", "role": "motion", "label": "Intensity", "description": "Strength of the leak and the blow-out, 0 to 1.", "default": 1, "min": 0, "max": 1, "step": 0.05},
    {"id": "leak_color", "type": "color", "role": "style", "label": "Leak color", "description": "Color that leads the leak.", "default": "#FF5A1F"},
    {"id": "blowout_color", "type": "color", "role": "style", "label": "Blow-out color", "description": "Tint the frame blows out to at the cut.", "default": "#FFF3E0"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Light Leak</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #0a0a0a; }
        .ll-stage { position: absolute; inset: 0; }
        .ll-scene { position: absolute; inset: 0; }
        .ll-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .ll-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .ll-in span { font-family: Geist, system-ui, sans-serif; font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .ll-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .ll-pa { background: #141318; }
        .ll-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .ll-flare { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0; }
        .ll-flash { position: absolute; inset: 0; opacity: 0; }
      </style>

      <div id="root" data-composition-id="light-leak" data-duration="0.6667" data-fps="30">
        <div id="ll-clip" class="ll-stage clip" data-start="0" data-duration="0.6667" data-track-index="0">
          <div id="ll-scene" class="ll-scene">
            <div id="ll-a" class="ll-panel ll-pa"><div class="ll-in"><span>Scene A</span><i class="ll-bar"></i></div></div>
            <div id="ll-b" class="ll-panel ll-pb"><div class="ll-in"><span>Scene B</span><i class="ll-bar"></i></div></div>
          </div>
          <div id="ll-flares"></div>
          <div id="ll-flash" class="ll-flash"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 0.6667;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["light-leak"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var origin = pick(vars.origin, ["left", "right", "top", "bottom"], "left");
            var intensity = num(vars.intensity, 1, 0, 1);
            var palette = [str(vars.leak_color, "#FF5A1F"), "#E5322D", "#FFB347", str(vars.blowout_color, "#FFF3E0")];
            var blowout = palette[palette.length - 1];
            var FLARES = [
              { along: 0, across: 0.3, size: 0.85, alpha: 1 },
              { along: -0.18, across: 0.78, size: 0.7, alpha: 0.85 },
              { along: 0.12, across: 0.55, size: 0.55, alpha: 0.9 },
              { along: -0.32, across: 0.12, size: 0.6, alpha: 0.7 },
              { along: 0.05, across: 0.95, size: 0.5, alpha: 0.6 }
            ];
            var host = document.getElementById("ll-flares");
            var flareEls = FLARES.map(function (f, i) {
              var d = document.createElement("div");
              d.id = "ll-flare-" + i; d.className = "ll-flare";
              host.appendChild(d); return d;
            });
            var sceneEl = document.getElementById("ll-scene"), flash = document.getElementById("ll-flash");
            var a = document.getElementById("ll-a"), b = document.getElementById("ll-b");
            flash.style.background = blowout;
            var driftE = bezier(0.3, 0.1, 0.5, 0.9);
            function heat(p) {
              if (p <= 0.5) { var q = p / 0.5; return q * q; }
              var r = (p - 0.5) / 0.5; return 1 - (1 - (1 - r) * (1 - r));
            }
            var W = root.clientWidth, H = root.clientHeight, span = Math.max(W, H);
            start(function (frame) {
              var p = clamp01(frame / FRAMES);
              var k = heat(p) * intensity;
              // Hard cut under the blow-out: the incoming scene owns the frame from the midpoint.
              a.style.visibility = p < 0.5 ? "visible" : "hidden";
              b.style.visibility = p >= 0.5 ? "visible" : "hidden";
              sceneEl.style.filter = "brightness(" + (1 + k * k * 1.6) + ") saturate(" + (1 + k * 0.4) + ")";
              var drift = -0.25 + (1.05 + 0.25) * driftE(p);
              var show = k > 0.001;
              flareEls.forEach(function (el, i) {
                var f = FLARES[i];
                if (!show) { el.style.opacity = 0; return; }
                var along = drift + f.along;
                if (origin === "right" || origin === "bottom") along = 1 - along;
                var horizontal = origin === "left" || origin === "right";
                var x = (horizontal ? along : f.across) * W, y = (horizontal ? f.across : along) * H;
                var color = palette[i % Math.max(1, palette.length - 1)];
                el.style.opacity = Math.min(1, Math.sqrt(k) * f.alpha * 1.1);
                el.style.background = "radial-gradient(circle " + (span * f.size) + "px at " + x + "px " + y + "px, color-mix(in srgb, " + color + " 55%, " + blowout + ") 0%, " + color + " 22%, color-mix(in srgb, " + color + " 55%, transparent) 45%, transparent 72%)";
              });
              var fl = Math.exp(-Math.pow((p - 0.5) / 0.1, 2)) * intensity;
              flash.style.opacity = show ? Math.min(0.96, fl) : 0;
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
