<!doctype html>
<!--
  Word Roller Typewriter

<html
  lang="en"
  data-composition-id="word-roller-typewriter"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words in order, separated by commas. The last one is where it settles.", "default": "amazing, stunning, powerful, seamless"},
    {"id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Fixed text before the typed word.", "default": "Create something"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the text in pixels. A wide line shrinks to fit the frame.", "default": 48, "min": 16, "max": 200, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of the fixed text.", "default": "#0a0a0a"},
    {"id": "accent", "type": "color", "role": "style", "label": "Word color", "description": "Color of the typed word and the cursor.", "default": "#2563eb"},
    {"id": "cycle_frames", "type": "number", "role": "motion", "label": "Frames per word", "description": "How long each word is shown, in 30 fps frames.", "default": 35, "min": 24, "max": 120, "step": 1, "unit": "f"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Typewriter</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wty-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #0a0a0a); }
        .wty-stage { justify-content: flex-start; padding: 0 5.2%; }
        .wty-g { line-height: 1.2; white-space: pre; position: relative; font-weight: 500; }
        .wty-w { color: var(--ac, #2563eb); }
        .wty-cur { display: inline-block; width: 0.0625em; height: 1em; background: var(--ac, #2563eb); margin-left: 0.04em; vertical-align: middle; }

      </style>

      <div id="root" data-composition-id="word-roller-typewriter" data-duration="5" data-fps="30">
        <div id="wty-clip" class="wty-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div id="wty-g" class="wty-g"><span id="wty-pre"></span> <span class="wty-w"><span id="wty-t"></span><span id="wty-cur" class="wty-cur"></span></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "5");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-typewriter"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var words = list(vars.words, ["amazing", "stunning", "powerful", "seamless"], 10);
            var fi = words.length - 1;
            var cd = num(vars.cycle_frames, 35, 24, 120);
            var g = el("wty-g"), pre = el("wty-pre"), t = el("wty-t"), cur = el("wty-cur");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--c", vars.color);
            if (typeof vars.accent === "string" && vars.accent) root.style.setProperty("--ac", vars.accent);
            pre.textContent = txt(vars.prefix, "Create something");
            var longest = words.slice().sort(function (a, b) { return b.length - a.length; })[0];
            var probe = document.createElement("div");
            probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:0;top:0";
            probe.textContent = pre.textContent + " " + longest;
            g.appendChild(probe);
            var base = num(vars.font_size, 48, 16, 200);
            function fit() {
              g.style.fontSize = base + "px";
              var k = Math.min(1, root.clientWidth * 0.84 / Math.max(1, probe.offsetWidth * 1.03));
              if (k < 1) g.style.fontSize = Math.max(6, base * k) + "px";
            }
            fit();
            onFonts(fit);

            // remocn-scenes: 12 frames deleting the previous word at 1.2 letters a frame, a pause,
            // typing from frame 15 at 0.8 letters a frame; the last word stays with a blinking cursor.
            function draw(f) {
              var ci = Math.min(Math.floor(f / cd), fi);
              var word = words[ci];
              var cT = ci >= fi ? cd : f % cd;
              var shown = "", showCursor = true, ff = Math.floor(f);
              if (ci >= fi) {
                shown = word;
                showCursor = Math.floor(ff / 15) % 2 === 0;
              } else if (cT < 12) {
                var prev = words[Math.max(0, ci - 1)];
                shown = prev.slice(0, Math.max(0, prev.length - Math.floor(cT * 1.2)));
              } else if (cT >= 15) {
                var typed = Math.min(word.length, Math.floor((cT - 15) * 0.8));
                shown = word.slice(0, typed);
                showCursor = typed < word.length || Math.floor(ff / 8) % 2 === 0;
              }
              setText(t, shown);
              cur.style.visibility = showCursor ? "visible" : "hidden";
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
