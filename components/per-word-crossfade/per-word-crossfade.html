<!--
  Per Word Crossfade

  A sentence dissolves word by word into a new one, each word rising slightly as it arrives.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="per-word-crossfade"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "from_text", "type": "string", "role": "content", "label": "From text", "description": "Text that fades out word by word.", "default": "Beautifully simple."},
    {"id": "to_text", "type": "string", "role": "content", "label": "To text", "description": "Text that fades in word by word.", "default": "Designed for focus."},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Per Word Crossfade</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: var(--color, #171717); font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; }
        .pwc-stage { position: absolute; inset: 0; }
        .pwc-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .pwc-line { letter-spacing: -0.03em; line-height: 1.2; text-align: center; max-width: 92%; }
        .pwc-word { display: inline-block; margin-right: 0.25em; transform-origin: 50% 55%; }
      </style>

      <div id="root" data-composition-id="per-word-crossfade" data-duration="3" data-fps="30">
        <div id="pwc-clip" class="pwc-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div class="pwc-layer"><span id="pwc-from" class="pwc-line"></span></div>
          <div class="pwc-layer"><span id="pwc-to" class="pwc-line"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              var q = Math.sqrt(z * z - 1), r1 = w0 * (-z + q), r2 = w0 * (-z - q);
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 3;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["per-word-crossfade"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var fromText = str(vars.from_text, "Beautifully simple."), toText = str(vars.to_text, "Designed for focus.");
            var size = num(vars.font_size, 72, 12, 240), speed = num(vars.speed, 1, 0.25, 4);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var wt = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            function build(host, text, tag) {
              host.style.fontWeight = wt; host.setAttribute("aria-label", text);
              return text.split(" ").map(function (w, i) {
                var sp = document.createElement("span");
                sp.id = "pwc-" + tag + "-" + i; sp.className = "pwc-word"; sp.textContent = w;
                host.appendChild(sp); return sp;
              });
            }
            var hostA = document.getElementById("pwc-from"), hostB = document.getElementById("pwc-to");
            var fromSpans = build(hostA, fromText, "a"), toSpans = build(hostB, toText, "b");
            function fitBoth() {
              var m = Math.min(fit(hostA, size, 0.9), fit(hostB, size, 0.9));
              hostA.style.fontSize = hostB.style.fontSize = m + "px";
            }
            fitBoth(); onFonts(fitBoth);
            var enterDur = 21, enterTravel = 5, exitDur = 15, exitTravelFrom = 6, enterStagger = 2, exitStagger = 1, overlap = 5, micro = 2;
            var enterE = bezier(0.16, 1, 0.3, 1), exitE = bezier(0.7, 0, 0.84, 0);
            var exitTotal = exitDur + (fromSpans.length - 1) * exitStagger;
            var newStart = Math.max(0, exitTotal - overlap + micro);
            start(function (raw) {
              var f = raw * speed;
              fromSpans.forEach(function (sp, i) {
                var loc = f - i * exitStagger;
                sp.style.opacity = ip(loc, 0, exitDur, 1, 0, exitE);
                sp.style.transform = "translateY(" + ip(loc, exitTravelFrom, exitDur, 0, -6, exitE) + "px)";
              });
              toSpans.forEach(function (sp, j) {
                var loc = f - newStart - j * enterStagger;
                sp.style.opacity = ip(loc, 0, enterDur, 0, 1, enterE);
                sp.style.transform = "translateY(" + ip(loc, 0, enterTravel, 8, 0, enterE) + "px)";
              });
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
