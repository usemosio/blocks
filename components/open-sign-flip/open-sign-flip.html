<!doctype html>
<!--
  Open Sign Flip

  A shop sign hangs from two cords and swings in, then flips from "TUTUP" to "BUKA" and settles with a little sway. The opening hours slide up below it. Shop, both words and the hours are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="open-sign-flip"
  data-composition-duration="5"
  data-composition-variables='[
  {
    "id": "shop",
    "type": "string",
    "role": "content",
    "label": "Shop name",
    "description": "Small line at the top of the sign.",
    "default": "Kopi Senja"
  },
  {
    "id": "closed",
    "type": "string",
    "role": "content",
    "label": "Closed word",
    "description": "Word on the front of the sign.",
    "default": "TUTUP"
  },
  {
    "id": "open",
    "type": "string",
    "role": "content",
    "label": "Open word",
    "description": "Word on the back of the sign, shown after the flip.",
    "default": "BUKA"
  },
  {
    "id": "days",
    "type": "string",
    "role": "content",
    "label": "Days",
    "description": "Small line above the hours. Leave empty to hide it.",
    "default": "Setiap hari"
  },
  {
    "id": "hours",
    "type": "string",
    "role": "content",
    "label": "Opening hours",
    "description": "Hours shown under the sign.",
    "default": "08.00 – 21.00"
  },
  {
    "id": "flip_at",
    "type": "number",
    "role": "motion",
    "label": "Flip time",
    "description": "Second the sign flips.",
    "default": 1.9,
    "min": 1,
    "max": 3.5,
    "step": 0.1
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The open side of the sign: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Open Sign Flip</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--os-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--os-bg);
        }
        #root * { box-sizing: border-box; }
        .os-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .os-wrap { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
        .os-rail { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 14); border-radius: calc(var(--u) * 7); background: var(--os-text); }
        .os-swing { position: absolute; left: 0; top: calc(var(--u) * 7); width: 100%; transform-origin: 50% 0%; }
        .os-cords { position: absolute; left: 0; top: 0; width: 100%; overflow: visible; }
        .os-persp { position: absolute; left: 50%; top: calc(var(--u) * 200); width: calc(var(--u) * 760); height: calc(var(--u) * 340); margin-left: calc(var(--u) * -380); perspective: 1600px; }
        .os-flip { position: absolute; inset: 0; transform-style: preserve-3d; }
        .os-face { position: absolute; inset: 0; border-radius: calc(var(--u) * 40); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; box-shadow: 0 calc(var(--u) * 14) calc(var(--u) * 28) rgba(0,0,0,0.16); }
        .os-front { background: var(--os-text); }
        .os-back { background: var(--os-main); transform: rotateY(180deg); }
        .os-face::before, .os-face::after { content: ""; position: absolute; top: calc(var(--u) * 26); width: calc(var(--u) * 16); height: calc(var(--u) * 16); border-radius: 50%; background: rgba(255,255,255,0.85); }
        .os-face::before { left: calc(var(--u) * 26); } .os-face::after { right: calc(var(--u) * 26); }
        .os-shop { font-size: calc(var(--u) * 34); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; margin-bottom: calc(var(--u) * 10); }
        .os-word { font-size: calc(var(--u) * 190); font-weight: 700; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
        .os-hours { position: absolute; left: 0; right: 0; top: calc(var(--u) * 640); text-align: center; }
        .os-mask { display: block; overflow: hidden; padding-bottom: calc(var(--u) * 10); }
        .os-days { display: inline-block; font-size: calc(var(--u) * 40); font-weight: 500; color: var(--os-muted); }
        .os-time { display: inline-block; font-size: calc(var(--u) * 100); font-weight: 700; letter-spacing: -0.045em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }

      </style>

      <div id="root" data-composition-id="open-sign-flip" data-duration="5" data-fps="30">
        <div id="os-clip" class="os-stage clip" data-start="0" data-duration="5" data-track-index="0">

          <div class="os-wrap" id="os-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("os", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb" });


            var u = U, wrap = document.getElementById("os-wrap");
            var shop = str(vars.shop, "Kopi Senja"), closed = str(vars.closed, "TUTUP"), open = str(vars.open, "BUKA");
            var days = typeof vars.days === "string" ? vars.days.trim() : "Setiap hari", hours = str(vars.hours, "08.00 – 21.00");
            var flipAt = num(vars.flip_at, 1.9, 1, 3.5);
            var gw = 900 * u, gh = 640 * u + 100 * u + (days ? 70 * u : 0) + 30 * u;
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            var S = Math.min(1.25, (H * 0.88) / gh, (W * 0.94) / gw);
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });
            el("div", "os-rail", wrap);
            var swing = el("div", "os-swing", wrap); swing.style.height = 560 * u + "px";
            var cs = svg("svg", { width: gw, height: 220 * u, viewBox: "0 0 " + gw + " " + 220 * u, class: "os-cords" }, swing);
            var cx = gw / 2, tcol = colr(vars.text_color, "#0a0a0a");
            [-1, 1].forEach(function (s) { svg("line", { x1: cx, y1: 0, x2: cx + s * 354 * u, y2: 193 * u + 34 * u, stroke: tcol, "stroke-width": 5 * u, "stroke-linecap": "round" }, cs); });
            svg("circle", { cx: cx, cy: 4 * u, r: 13 * u, fill: tcol }, cs);
            var persp = el("div", "os-persp", swing);
            persp.style.top = 193 * u + "px";
            var flip = el("div", "os-flip", persp);
            function face(cls, word) {
              var f = el("div", "os-face " + cls, flip);
              el("div", "os-shop", f).textContent = shop;
              var w = el("div", "os-word", f); w.textContent = word;
              var avail = 760 * u - 90 * u;
              if (w.offsetWidth > avail) w.style.fontSize = parseFloat(getComputedStyle(w).fontSize) * avail / w.offsetWidth + "px";
              return f;
            }
            face("os-front", closed); face("os-back", open);
            var hb = el("div", "os-hours", wrap), dm, tm;
            if (days) { dm = el("span", "os-mask", hb); el("span", "os-days", dm).textContent = days; }
            var tmask = el("span", "os-mask", hb); var tspan = el("span", "os-time", tmask); tspan.textContent = hours;
            if (tspan.offsetWidth > gw - 40 * u) tspan.style.fontSize = parseFloat(getComputedStyle(tspan).fontSize) * (gw - 40 * u) / tspan.offsetWidth + "px";
            var swingEl = swing;
            swingEl.style.transformOrigin = "50% 0px";

            // Damped swing about the hook: a function of time only.
            function angle(t) {
              var a = 0;
              if (t >= 0) a += 22 * Math.exp(-2.1 * t) * Math.cos(2 * Math.PI * 0.85 * t);
              var t2 = t - (flipAt + 0.35);
              if (t2 >= 0) a += 3.6 * Math.exp(-2.4 * t2) * Math.sin(2 * Math.PI * 0.95 * t2);
              return a;
            }
            var clock = { t: 0 }, T0 = 0.1;
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(clock, { t: 0 }, { t: 4.5, duration: 4.5, ease: "none", onUpdate: function () { gsap.set(swingEl, { rotation: angle(clock.t) }); } }, T0);
            tl.fromTo(wrap.querySelector(".os-rail"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.05);
            tl.fromTo(swingEl, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, T0);
            tl.fromTo(flip, { rotationY: 0, scale: 1 }, { rotationY: 180, duration: 0.8, ease: "power3.inOut" }, flipAt);
            tl.fromTo(persp, { y: 0 }, { y: -16 * u, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, flipAt);
            var hs = flipAt + 0.75;
            var masks = [tspan]; if (dm) masks.unshift(dm.firstChild);
            tl.fromTo(masks, { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: 0.12 }, hs);
            tl.set(masks, { yPercent: 115 }, 0);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["open-sign-flip"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
