<html
  lang="en"
  data-composition-id="typed-split-wipe"
  data-composition-duration="2.5"
  data-composition-variables='[
    { "id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Words typed before the anchor. It wipes out to the left.", "default": "Introducing" },
    { "id": "anchor", "type": "string", "role": "content", "label": "Anchor", "description": "Short word that stays visible while the rest is erased.", "default": "Nova" },
    { "id": "suffix", "type": "string", "role": "content", "label": "Suffix", "description": "Words typed after the anchor. They wipe out one by one.", "default": "Smart Notes" },
    { "id": "type_frames", "type": "number", "role": "motion", "label": "Type frames", "description": "Frames the typing takes (30 fps).", "default": 30, "min": 6, "max": 60, "step": 1, "unit": "frames" },
    { "id": "exit_at", "type": "number", "role": "motion", "label": "Exit at", "description": "Frame where the wipes start.", "default": 50, "min": 20, "max": 90, "step": 1, "unit": "frames" },
    { "id": "exit_frames", "type": "number", "role": "motion", "label": "Exit frames", "description": "Frames the exit takes.", "default": 20, "min": 6, "max": 40, "step": 1, "unit": "frames" },
    { "id": "word_stagger", "type": "number", "role": "motion", "label": "Word stagger", "description": "Frames between each suffix word wiping out.", "default": 4, "min": 0, "max": 12, "step": 1, "unit": "frames" },
    { "id": "anchor_shift", "type": "number", "role": "motion", "label": "Anchor shift", "description": "Pixels the anchor slides left at 42 px type, as the prefix wipes away.", "default": -72, "min": -200, "max": 0, "step": 1, "unit": "px" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Type size in pixels. Longer text shrinks to fit the frame.", "default": 42, "min": 12, "max": 120, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#e8e8e8" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Typed Split Wipe</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #e8e8e8);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .tsw-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .tsw-text { letter-spacing: -0.03em; line-height: 1; white-space: pre; }
        .tsw-split { display: none; align-items: baseline; gap: 0.25em; }
        .tsw-part { display: inline-block; }
      </style>

      <div id="root" data-composition-id="typed-split-wipe" data-duration="2.5" data-fps="30">
        <div id="tsw-clip" class="tsw-stage clip" data-start="0" data-duration="2.5" data-track-index="0">
          <span id="tsw-typed" class="tsw-text"></span>
          <span id="tsw-split" class="tsw-text tsw-split"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("tsw-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2.5");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["typed-split-wipe"] = tl;
            }
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            var prefix = typeof vars.prefix === "string" ? vars.prefix : "Introducing";
            var anchor = typeof vars.anchor === "string" ? vars.anchor : "Nova";
            var suffix = typeof vars.suffix === "string" ? vars.suffix : "Smart Notes";
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "400");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var typeFrames = num(vars.type_frames, 30, 6, 60);
            var exitAt = num(vars.exit_at, 50, 20, 90);
            var exitFrames = num(vars.exit_frames, 20, 6, 40);
            var wordStagger = num(vars.word_stagger, 4, 0, 12);
            var anchorShift = num(vars.anchor_shift, -72, -200, 0);
            var typed = document.getElementById("tsw-typed");
            var split = document.getElementById("tsw-split");
            var fullText = [prefix, anchor, suffix].filter(Boolean).join(" ");
            var chars = Array.from(fullText);
            typed.textContent = fullText;
            typed.style.fontWeight = weight;
            split.style.fontWeight = weight;
            var size = fit(typed, num(vars.font_size, 42, 12, 120), 0.9);
            split.style.fontSize = size + "px";
            typed.textContent = "";
            var k = size / 42;

            var inout = bz("wipe", 0.455, 0.03, 0.515, 0.955);
            var partPrefix = null, partAnchor = null, words = [];
            if (prefix) { partPrefix = document.createElement("span"); partPrefix.className = "tsw-part"; partPrefix.textContent = prefix; split.appendChild(partPrefix); }
            if (anchor) { partAnchor = document.createElement("span"); partAnchor.className = "tsw-part"; partAnchor.textContent = anchor; split.appendChild(partAnchor); }
            suffix.trim().split(/\s+/).filter(Boolean).forEach(function (w, i) {
              var s = document.createElement("span");
              s.className = "tsw-part";
              s.id = "tsw-word-" + i;
              s.textContent = w;
              split.appendChild(s);
              words.push(s);
            });
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              if (f < exitAt) {
                var tp = ip(f, 0, Math.max(typeFrames, 0.001), 0, chars.length);
                var n = Math.min(chars.length, Math.max(1, Math.floor(tp) + 1));
                typed.textContent = chars.slice(0, n).join("");
                typed.style.display = "inline";
                split.style.display = "none";
                return;
              }
              typed.style.display = "none";
              split.style.display = "inline-flex";
              var pe = ip(f, exitAt, exitAt + exitFrames, 0, 1, inout);
              var as = exitAt + Math.max(exitFrames - 6, 0);
              var ae = ip(f, as, as + 6, 0, 1, inout);
              if (partPrefix) partPrefix.style.clipPath = "inset(0 " + pe * 100 + "% 0 0)";
              if (partAnchor) {
                partAnchor.style.clipPath = "inset(0 " + ae * 50 + "% 0 " + ae * 50 + "%)";
                partAnchor.style.transform = "translateX(" + anchorShift * k * pe + "px)";
              }
              words.forEach(function (w, i) {
                var st = exitAt + 2 + i * wordStagger;
                w.style.clipPath = "inset(0 0 0 " + ip(f, st, st + exitFrames * 0.65, 0, 1, inout) * 100 + "%)";
              });
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
