<!doctype html>
<!--
  Ads Dashboard

  A dark metrics dashboard in two beats: an alert drops in and the key metric falls in red under a two-line
  question, then the scene slides over to cards that pop in, numbers that recover and count up, and a chart
  line that draws itself.

  Extracted from the Mosio recipe dasbor-iklan by usemosio/blocks.
-->
<html
  lang="en"
  data-composition-id="ads-dashboard"
  data-composition-duration="8"
  data-composition-variables='[
    {"id": "alert_text", "type": "string", "role": "content", "label": "Alert text", "description": "Text of the alert card that drops in first.", "default": "Saldo iklan habis"},
    {"id": "alert_value", "type": "string", "role": "content", "label": "Alert value", "description": "Red value at the right of the alert card.", "default": "Rp0"},
    {"id": "metric_label", "type": "string", "role": "content", "label": "Metric name", "description": "Name of the headline metric.", "default": "ROAS"},
    {"id": "metric_start", "type": "number", "role": "content", "label": "Metric before", "description": "Value the metric shows when the scene starts.", "default": 1.2, "min": 0, "max": 9999, "step": 0.1},
    {"id": "metric_low", "type": "number", "role": "content", "label": "Metric low", "description": "Value the metric falls to in red.", "default": 0.8, "min": 0, "max": 9999, "step": 0.1},
    {"id": "metric_high", "type": "number", "role": "content", "label": "Metric recovered", "description": "Value the metric counts up to on the dashboard.", "default": 4.6, "min": 0, "max": 9999, "step": 0.1},
    {"id": "metric_suffix", "type": "string", "role": "content", "label": "Metric suffix", "description": "Unit written after the metric number.", "default": "x"},
    {"id": "question", "type": "string", "role": "content", "label": "Question", "description": "Two lines separated by a vertical bar; the last word of the second line takes the main colour.", "default": "Iklan jalan…|omzet kok diem?"},
    {"id": "dash_title", "type": "string", "role": "content", "label": "Dashboard title", "description": "Small heading on the dashboard.", "default": "Dasbor real-time"},
    {"id": "cost_label", "type": "string", "role": "content", "label": "Card 2 label", "description": "Label of the first small card (a cost).", "default": "CPA"},
    {"id": "cost_value", "type": "number", "role": "content", "label": "Card 2 value", "description": "Rupiah amount the first small card counts up to.", "default": 32000, "min": 0, "max": 999999999999, "step": 1},
    {"id": "revenue_label", "type": "string", "role": "content", "label": "Card 3 label", "description": "Label of the second small card (revenue).", "default": "OMZET"},
    {"id": "revenue_value", "type": "number", "role": "content", "label": "Card 3 value", "description": "Rupiah amount the second small card counts up to; from a million up it is written as Rp48,9 jt.", "default": 48900000, "min": 0, "max": 999999999999, "step": 1},
    {"id": "bg_color", "type": "color", "role": "style", "label": "Background", "description": "Page background.", "default": "#07090c"},
    {"id": "surface_color", "type": "color", "role": "style", "label": "Cards", "description": "Card surface.", "default": "#12161c"},
    {"id": "primary_color", "type": "color", "role": "style", "label": "Main colour", "description": "Glow, chart line and the highlighted word.", "default": "#2ab8f8"},
    {"id": "accent_color", "type": "color", "role": "style", "label": "Recovery colour", "description": "Recovered numbers and the chart end dot.", "default": "#c6f432"},
    {"id": "danger_color", "type": "color", "role": "style", "label": "Alert red", "description": "The alert and the falling metric.", "default": "#ff5b5b"},
    {"id": "text_color", "type": "color", "role": "style", "label": "Text", "description": "Main text.", "default": "#f3f6f9"},
    {"id": "muted_color", "type": "color", "role": "style", "label": "Muted text", "description": "Labels.", "default": "#8a94a3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ads Dashboard</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@500;700&amp;display=block" />
      <style>
        #root {
          --ad-bg: #07090c; --ad-surface: #12161c; --ad-primary: #2ab8f8; --ad-accent: #c6f432; --ad-danger: #ff5b5b; --ad-text: #f3f6f9; --ad-muted: #8a94a3;
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; background: var(--ad-bg); color: var(--ad-text);
          font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500;
        }
        #root * { box-sizing: border-box; }
        #ad-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
        .ad-glow { position: absolute; left: 50%; top: 50%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%;
          background: radial-gradient(circle, color-mix(in oklab, var(--ad-primary) 22%, transparent), transparent 60%); }
        .ad-scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 90px; }
        .ad-num { font-family: "Archivo Black", "Space Grotesk", sans-serif; font-weight: 400; }
        .ad-card { background: var(--ad-surface); box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ad-text) 5%, transparent); }
        .ad-alert { width: 100%; max-width: 900px; height: 150px; border-radius: 30px; display: flex; align-items: center; gap: 30px; padding: 0 40px; font-size: 44px; font-weight: 700; white-space: nowrap; }
        .ad-alert i { width: 76px; height: 76px; border-radius: 20px; background: var(--ad-danger); flex: none; }
        .ad-alert em { margin-left: auto; font-style: normal; color: var(--ad-danger); font-family: "Archivo Black", sans-serif; }
        .ad-label { margin-top: 90px; font-size: 46px; letter-spacing: 12px; color: var(--ad-muted); text-align: center; }
        .ad-roas { font-size: 300px; line-height: 1.05; text-align: center; color: var(--ad-danger); white-space: nowrap; }
        .ad-ask { margin-top: 60px; text-align: center; font-size: 104px; font-weight: 700; line-height: 1.05; }
        .ad-ask .ad-line { display: block; overflow: hidden; padding-bottom: 6px; }
        .ad-ask .ad-line span { display: block; }
        .ad-ask b { color: var(--ad-primary); }
        .ad-dash { width: 100%; max-width: 900px; display: flex; flex-direction: column; }
        .ad-dash h3 { font-size: 46px; margin-bottom: 30px; font-weight: 700; }
        .ad-box { border-radius: 32px; padding: 40px; }
        .ad-box small { font-size: 40px; letter-spacing: 6px; color: var(--ad-muted); }
        .ad-big { font-size: 230px; line-height: 1.05; color: var(--ad-accent); margin-top: 10px; white-space: nowrap; }
        .ad-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
        .ad-pair b { display: block; margin-top: 14px; font-size: 64px; color: var(--ad-accent); font-family: "Archivo Black", sans-serif; font-weight: 400; white-space: nowrap; }
        .ad-chart { margin-top: 30px; padding: 30px 40px; }
        .ad-chart svg { width: 100%; height: auto; display: block; }
        .ad-grid { stroke: color-mix(in oklab, var(--ad-text) 8%, transparent); stroke-width: 2; }
        .ad-path { fill: none; stroke: var(--ad-primary); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
        .ad-dot { fill: var(--ad-accent); }
        /* Landscape: the dashboard splits into two columns. */
        #ad-stage.ad-land .ad-scene { padding: 0 110px; }
        #ad-stage.ad-land .ad-alert { max-width: 1000px; height: 120px; font-size: 40px; }
        #ad-stage.ad-land .ad-label { margin-top: 40px; font-size: 38px; }
        #ad-stage.ad-land .ad-roas { font-size: 230px; }
        #ad-stage.ad-land .ad-ask { margin-top: 30px; font-size: 84px; }
        #ad-stage.ad-land .ad-dash { max-width: 1700px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; align-items: stretch; }
        #ad-stage.ad-land .ad-dash h3 { grid-column: 1 / -1; margin-bottom: 24px; }
        #ad-stage.ad-land .ad-left { display: flex; flex-direction: column; }
        #ad-stage.ad-land .ad-big { font-size: 190px; }
        #ad-stage.ad-land .ad-pair { margin-top: 30px; }
        #ad-stage.ad-land .ad-chart { margin-top: 0; display: flex; align-items: center; }
      </style>

      <div id="root" data-composition-id="ads-dashboard" data-duration="8" data-fps="30">
        <div id="ad-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;inset:0">
          <div id="ad-stage">
            <div class="ad-glow" id="ad-glow"></div>
            <div class="ad-scene" id="ad-s1">
              <div class="ad-alert ad-card" id="ad-alert"><i></i><span id="ad-atext"></span><em id="ad-aval"></em></div>
              <div class="ad-label" id="ad-label"></div>
              <div class="ad-roas ad-num" id="ad-roas1"></div>
              <div class="ad-ask" id="ad-ask"></div>
            </div>
            <div class="ad-scene" id="ad-s2">
              <div class="ad-dash">
                <h3 id="ad-title"></h3>
                <div class="ad-left">
                  <div class="ad-box ad-card ad-c"><small id="ad-l1"></small><div class="ad-big ad-num" id="ad-roas2"></div></div>
                  <div class="ad-pair">
                    <div class="ad-box ad-card ad-c"><small id="ad-l2"></small><b id="ad-cost"></b></div>
                    <div class="ad-box ad-card ad-c"><small id="ad-l3"></small><b id="ad-rev"></b></div>
                  </div>
                </div>
                <div class="ad-box ad-card ad-chart ad-c">
                  <svg viewBox="0 0 800 300">
                    <line class="ad-grid" x1="0" y1="75" x2="800" y2="75" /><line class="ad-grid" x1="0" y1="150" x2="800" y2="150" /><line class="ad-grid" x1="0" y1="225" x2="800" y2="225" />
                    <path id="ad-path" class="ad-path" d="M10 260 L130 240 L250 250 L370 190 L490 170 L610 110 L730 40" />
                    <circle id="ad-dot" class="ad-dot" cx="730" cy="40" r="16" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var $ = function (id) { return document.getElementById(id); };
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v.trim() : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            [["bg_color", "--ad-bg", "#07090c"], ["surface_color", "--ad-surface", "#12161c"], ["primary_color", "--ad-primary", "#2ab8f8"], ["accent_color", "--ad-accent", "#c6f432"], ["danger_color", "--ad-danger", "#ff5b5b"], ["text_color", "--ad-text", "#f3f6f9"], ["muted_color", "--ad-muted", "#8a94a3"]]
              .forEach(function (c) { root.style.setProperty(c[1], colr(vars[c[0]], c[2])); });

            var stage = $("ad-stage"), W = root.clientWidth || 1080, H = root.clientHeight || 1920;
            var land = W > H * 1.05, RW, RH, k;
            if (land) { RH = 1080; RW = Math.round(1080 * W / H); k = H / RH; stage.classList.add("ad-land"); } else { RW = 1080; RH = Math.round(1080 * H / W); k = W / RW; }
            stage.style.width = RW + "px"; stage.style.height = RH + "px"; stage.style.transform = "scale(" + k + ")";

            var suffix = typeof vars.metric_suffix === "string" ? vars.metric_suffix : "x";
            var m0 = num(vars.metric_start, 1.2, 0, 9999), m1 = num(vars.metric_low, 0.8, 0, 9999), m2 = num(vars.metric_high, 4.6, 0, 9999);
            function fm(n) { return n.toFixed(1).replace(".", ",") + suffix; }
            function rp(n) { return "Rp" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rpShort(n) { return n >= 1e6 ? "Rp" + (n / 1e6).toFixed(1).replace(/\.0$/, "").replace(".", ",") + " jt" : rp(n); }
            $("ad-atext").textContent = str(vars.alert_text, "Saldo iklan habis");
            $("ad-aval").textContent = str(vars.alert_value, "Rp0");
            var label = str(vars.metric_label, "ROAS");
            $("ad-label").textContent = label; $("ad-l1").textContent = label;
            $("ad-title").textContent = str(vars.dash_title, "Dasbor real-time");
            $("ad-l2").textContent = str(vars.cost_label, "CPA"); $("ad-l3").textContent = str(vars.revenue_label, "OMZET");
            $("ad-roas1").textContent = fm(m0); $("ad-roas2").textContent = fm(m1); $("ad-cost").textContent = rp(0); $("ad-rev").textContent = rpShort(0);
            var ask = str(vars.question, "Iklan jalan…|omzet kok diem?").split("|").slice(0, 2), ah = $("ad-ask");
            ask.forEach(function (line, i) {
              var ln = document.createElement("span"); ln.className = "ad-line"; var inner = document.createElement("span");
              line = line.trim();
              if (i === ask.length - 1 && ask.length > 1 && line.indexOf(" ") > 0) {
                var j = line.lastIndexOf(" "); inner.appendChild(document.createTextNode(line.slice(0, j + 1)));
                var b = document.createElement("b"); b.textContent = line.slice(j + 1); inner.appendChild(b);
              } else inner.textContent = line;
              ln.appendChild(inner); ah.appendChild(ln);
            });
            var cost = num(vars.cost_value, 32000, 0, 999999999999), rev = num(vars.revenue_value, 48900000, 0, 999999999999);
            var path = $("ad-path"), len = path.getTotalLength();
            path.setAttribute("stroke-dasharray", len); path.setAttribute("stroke-dashoffset", len);

            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#ad-glow", { scale: 0.9 }, { scale: 1.15, duration: 8, ease: "sine.inOut" }, 0);
            // Scene 1: the alert drops, the metric falls in red, the question rises out of a mask.
            var a = { v: m0 };
            tl.from("#ad-alert", { y: -60, opacity: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.2)
              .from(["#ad-label", "#ad-roas1"], { scale: 0.7, opacity: 0, duration: 0.5, ease: "expo.out", stagger: 0.05 }, 0.5)
              .to(a, { v: m1, duration: 1.2, ease: "power2.inOut", onUpdate: function () { $("ad-roas1").textContent = fm(a.v); } }, 0.8)
              .from("#ad-ask .ad-line span", { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.14 }, 1.4)
              .to("#ad-s1", { xPercent: -100, duration: 0.6, ease: "power3.inOut" }, 3.5);
            // Scene 2: the dashboard slides in, cards pop, numbers recover, the line draws.
            var r = { v: m1 }, c = { v: 0 }, o = { v: 0 };
            tl.from("#ad-s2", { xPercent: 100, duration: 0.6, ease: "power3.inOut" }, 3.5)
              .from("#ad-title", { y: 40, opacity: 0, duration: 0.5, ease: "expo.out" }, 4.0)
              .from(".ad-c", { y: 70, opacity: 0, scale: 0.94, duration: 0.5, ease: "back.out(1.5)", stagger: 0.12 }, 4.1)
              .to(r, { v: m2, duration: 1.6, ease: "power3.out", onUpdate: function () { $("ad-roas2").textContent = fm(r.v); } }, 4.4)
              .to(c, { v: cost, duration: 1.4, ease: "power3.out", onUpdate: function () { $("ad-cost").textContent = rp(c.v); } }, 4.6)
              .to(o, { v: rev, duration: 1.6, ease: "power3.out", onUpdate: function () { $("ad-rev").textContent = rpShort(o.v); } }, 4.6)
              .fromTo("#ad-path", { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "power2.out" }, 4.7)
              .from("#ad-dot", { scale: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.4)" }, 6.2);
            var total = parseFloat(root.dataset.duration || "8");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["ads-dashboard"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
