<html
  lang="en"
  data-composition-id="drift"
  data-composition-duration="3"
  data-composition-variables='[{"id":"grow","type":"number","role":"motion","label":"Grow","description":"Final scale is 1 + grow. Negative values pull back instead. 0.03 to 0.05 reads as ambient motion.","default":0.035,"min":-0.1,"max":0.15,"step":0.005},{"id":"scene","type":"boolean","role":"content","label":"Placeholder scene","description":"Show the built-in placeholder scene. Turn off to leave the frame empty.","default":true},{"id":"duration","type":"number","role":"motion","label":"Duration","description":"Seconds the push-in takes (the block length).","default":3,"min":1,"max":10,"step":0.5,"unit":"s"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Drift</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: #141318; font-family: Geist, system-ui, sans-serif; color: #f4f3f7; }
        .dr-stage { position: absolute; inset: 0; }
        #dr-world { position: absolute; inset: 0; transform-origin: 50% 50%; display: flex; align-items: center; justify-content: center; }
        .dr-card { width: min(78cqw, 150cqh); padding: min(5cqw, 9cqh); border-radius: 24px; background: linear-gradient(160deg, #26242f, #1b1a22); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
        .dr-eyebrow { font-size: min(2.6cqw, 4.6cqh); letter-spacing: 0.18em; text-transform: uppercase; color: #8b86a3; font-weight: 500; }
        .dr-title { font-size: min(7cqw, 12.5cqh); font-weight: 600; letter-spacing: -0.04em; line-height: 1.02; margin-top: 0.4em; }
        .dr-row { display: flex; gap: 3%; margin-top: min(4cqw, 7cqh); }
        .dr-pill { flex: 1; height: min(9cqw, 16cqh); border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
        .dr-pill:first-child { background: linear-gradient(135deg, #6366f1, #a855f7); border: 0; }

      </style>

      <div id="root" data-composition-id="drift" data-duration="3" data-fps="30">
        <div id="dr-clip" class="dr-stage clip" data-start="0" data-duration="3" data-track-index="0">
<div id="dr-world"><div id="dr-card" class="dr-card"><div class="dr-eyebrow">Static scene</div><div class="dr-title">Never quite still</div><div class="dr-row"><div class="dr-pill"></div><div class="dr-pill"></div><div class="dr-pill"></div></div></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }


            var grow = num(vars.grow, 0.035, -0.1, 0.15);
            var dur = num(vars.duration, 3, 1, 10);
            var world = document.getElementById("dr-world");
            if (!bool(vars.scene, true)) world.style.display = "none";
            var tl = gsap.timeline({ paused: true });
            // Remotion: scale = interpolate(frame, [0, durationInFrames], [1, 1 + grow]), linear.
            tl.fromTo(world, { scale: 1 }, { scale: 1 + grow, duration: dur, ease: "none", immediateRender: true }, 0);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["drift"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
