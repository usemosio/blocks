<!doctype html>
<!--
  Puzzle Snap

  Geometric pieces spin in from scattered positions and snap into a mark with sparks, then the wordmark slides out beside it. The mark is a fixed set of shapes; the wordmark is the text variable.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="puzzle-snap"
  data-composition-duration="2.2"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Wordmark that slides out beside the mark. Leave empty for the mark alone.", "default": "studio"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Stage color.", "default": "#111111"},
    {"id": "primary_color", "type": "color", "role": "style", "label": "Primary", "description": "Fill of the quarter circle and the small square.", "default": "#E5322D"},
    {"id": "secondary_color", "type": "color", "role": "style", "label": "Secondary", "description": "Fill of the dot and the wedge, and the wordmark.", "default": "#FFFFFF"},
    {"id": "spark_color", "type": "color", "role": "style", "label": "Sparks", "description": "Spark burst color.", "default": "#FFFFFF"},
    {"id": "square", "type": "boolean", "role": "style", "label": "Square piece", "description": "Include the small square piece.", "default": true},
    {"id": "seed", "type": "number", "role": "motion", "label": "Seed", "description": "Seed for the scattered start positions.", "default": 3, "min": 1, "max": 99, "step": 1},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Puzzle Snap</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--bg); }
        .ps-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .ps-row { display: flex; align-items: center; }
        .ps-svg { flex-shrink: 0; overflow: visible; }
        .ps-word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.04em; color: var(--text); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="puzzle-snap" data-duration="2.2" data-fps="30">
        <div id="ps-clip" class="ps-stage clip" data-start="0" data-duration="2.2" data-track-index="0">
          <div class="ps-row" id="ps-row">
            <svg class="ps-svg" id="ps-svg"></svg>
            <span class="ps-word" id="ps-word"></span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "puzzle-snap";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var row = document.getElementById("ps-row"), svg = document.getElementById("ps-svg"), word = document.getElementById("ps-word");
var bg = col(vars.background_color, "#111111"), primary = col(vars.primary_color, "#E5322D"), secondary = col(vars.secondary_color, "#FFFFFF"), sparkC = col(vars.spark_color, "#FFFFFF");
var useSquare = bool(vars.square, true), seed = Math.round(num(vars.seed, 3, 1, 99)), speed = num(vars.speed, 1, 0, 4);
var wordText = typeof vars.text === "string" ? vars.text : "studio";
root.style.setProperty("--bg", bg); root.style.setProperty("--text", secondary);
var W = root.clientWidth, H = root.clientHeight, s = Math.min(W, H);
var size = Math.round(s * 0.2), c = size / 2, gap = c * 0.08;
var STAGGER = 3, DRIFT = 10, SNAP = 3, SPARK = 8, SLIDE = 11;
svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", "0 0 " + size + " " + size);
row.style.gap = size * 0.24 + "px";
word.textContent = wordText; word.style.fontSize = size * 0.5 + "px";
if (!wordText) word.style.display = "none";
var u = c;
var pieces = [
  { px: 0.6, py: 0.6, make: function (g) { svgEl("path", { d: "M " + (u - gap) + " " + (u - gap) + " L 0 " + (u - gap) + " A " + (u - gap) + " " + (u - gap) + " 0 0 1 " + (u - gap) + " 0 Z", fill: primary }, g); } },
  { px: 1.5, py: 0.5, make: function (g) { svgEl("circle", { cx: u * 1.5, cy: u * 0.5, r: u * 0.36, fill: secondary }, g); } },
  { px: 0.65, py: 1.35, make: function (g) { svgEl("path", { d: "M " + (u - gap) + " " + (u + gap) + " L " + (u - gap) + " " + 2 * u + " L 0 " + 2 * u + " Z", fill: secondary }, g); } }
];
if (useSquare) pieces.push({ px: 1.5, py: 1.5, make: function (g) { svgEl("rect", { x: u * 1.18, y: u * 1.18, width: u * 0.64, height: u * 0.64, rx: u * 0.08, fill: primary }, g); } });
pieces.forEach(function (pc, i) {
  pc.outer = svgEl("g", {}, svg);
  pc.body = svgEl("g", {}, pc.outer);
  pc.make(pc.body);
  pc.sparks = [];
  for (var k = 0; k < 6; k++) pc.sparks.push(svgEl("line", { stroke: sparkC, "stroke-linecap": "round", opacity: 0 }, pc.outer));
});
var lastContact = (pieces.length - 1) * STAGGER + DRIFT + SNAP;
var rowW = row.offsetWidth;
function draw(frame) {
  var t = frame * speed;
  var punch = spring(t - lastContact, { damping: 9, stiffness: 260, mass: 0.5 });
  var markScale = t < lastContact ? 1 : 1 + 0.08 * (1 - punch);
  var slide = interp(t, [lastContact + 2, lastContact + 2 + SLIDE], [0, 1], inOutCubic);
  var reveal = interp(t, [lastContact + 4, lastContact + 4 + SLIDE], [0, 1], outCubic);
  svg.style.transform = "scale(" + markScale + ")";
  pieces.forEach(function (pc, i) {
    var local = t - i * STAGGER;
    var angle = rnd("puzzle-snap-" + seed + "-" + i + "-a") * Math.PI * 2;
    var dist = s * (0.42 + 0.22 * rnd("puzzle-snap-" + seed + "-" + i + "-d"));
    var spin = (rnd("puzzle-snap-" + seed + "-" + i + "-r") > 0.5 ? 1 : -1) * (120 + 160 * rnd("puzzle-snap-" + seed + "-" + i + "-s"));
    var remain = local < DRIFT ? interp(local, [0, DRIFT], [1, 0.2], outCubic) : interp(local, [DRIFT, DRIFT + SNAP], [0.2, 0], inQuad);
    var ox = Math.cos(angle) * dist * remain, oy = Math.sin(angle) * dist * remain;
    var pvx = pc.px * c, pvy = pc.py * c;
    pc.body.setAttribute("opacity", interp(local, [0, 3], [0, 1]));
    pc.body.setAttribute("transform", "translate(" + ox + " " + oy + ") rotate(" + spin * remain + " " + pvx + " " + pvy + ")");
    var sparkT = (local - DRIFT - SNAP) / SPARK;
    pc.sparks.forEach(function (ln, k) {
      if (sparkT < 0 || sparkT >= 1) { ln.setAttribute("opacity", 0); return; }
      var a = (k / 6) * Math.PI * 2 + rnd("puzzle-snap-" + seed + "-" + i + "-spark") * Math.PI;
      var e = outCubic(sparkT);
      var r0 = c * (0.45 + 0.4 * e), r1 = r0 + c * 0.28 * (1 - 0.5 * e);
      setA(ln, { x1: pvx + Math.cos(a) * r0, y1: pvy + Math.sin(a) * r0, x2: pvx + Math.cos(a) * r1, y2: pvy + Math.sin(a) * r1, "stroke-width": Math.max(1, c * 0.05 * (1 - sparkT)), opacity: 1 - sparkT });
    });
  });
  if (wordText) {
    row.style.transform = "translateX(" + (rowW / 2 - size / 2) * (1 - slide) + "px)";
    word.style.opacity = reveal;
    word.style.clipPath = "inset(-30% " + (1 - reveal) * 100 + "% -30% -5%)";
    word.style.transform = "translateX(" + (1 - reveal) * -size * 0.3 + "px)";
  }
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
