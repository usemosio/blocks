<!doctype html>
<!--
  Split Screen Compare

  Two columns, Kami against Biasanya. Rows tick in on our side with a drawn check and cross out on theirs, staggered. Each row is one line of the rows variable: our text, then theirs.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="split-screen-compare"
  data-composition-duration="6"
  data-composition-variables='[
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Title",
    "description": "Line above the columns. Empty hides it.",
    "default": "Kenapa pilih kami?"
  },
  {
    "id": "ours_label",
    "type": "string",
    "role": "content",
    "label": "Our column",
    "description": "Heading of our side.",
    "default": "Kami"
  },
  {
    "id": "theirs_label",
    "type": "string",
    "role": "content",
    "label": "Their column",
    "description": "Heading of the other side.",
    "default": "Biasanya"
  },
  {
    "id": "rows",
    "type": "string",
    "role": "content",
    "label": "Rows",
    "description": "One per line, up to 6: our text|their text. With no | the same text is used on both sides.",
    "default": "Bahan segar tiap hari|Stok seminggu sekali\nTanpa pengawet buatan|Memakai pengawet\nDikemas saat dipesan|Dikemas sehari sebelumnya\nGaransi uang kembali|Tanpa garansi"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Main colour",
    "description": "Checks and the outline of our column: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Our text and the title.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Their text and crosses.",
    "default": "#8a8a8a"
  },
  {
    "id": "tint_color",
    "type": "color",
    "role": "style",
    "label": "Their column tint",
    "description": "Background of their column.",
    "default": "#f4f4f2"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Google Fonts family name; Geist is loaded, others only if the host loads them.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Split Screen Compare</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          background: var(--ssc-bg); color: var(--ssc-text); font-family: var(--ssc-font);
        }
        #root * { box-sizing: border-box; }
        .ssc-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .ssc-title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.04em; white-space: nowrap; }
        .ssc-col { position: absolute; display: flex; flex-direction: column; border-radius: calc(var(--u) * 44); }
        .ssc-ours { background: var(--ssc-bg); border: calc(var(--u) * 4) solid var(--ssc-main); }
        .ssc-theirs { background: var(--ssc-tint); }
        .ssc-head { font-weight: 600; letter-spacing: -0.03em; text-align: center; border-bottom: 1px solid rgba(10,10,10,0.1); white-space: nowrap; }
        .ssc-ours .ssc-head { color: var(--ssc-main); } .ssc-theirs .ssc-head { color: var(--ssc-muted); }
        .ssc-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .ssc-row { flex: 1; display: flex; align-items: center; min-height: 0; border-top: 1px solid rgba(10,10,10,0.07); }
        .ssc-row:first-child { border-top: 0; }
        .ssc-ic { flex: none; }
        .ssc-ic svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .ssc-t { font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
        .ssc-theirs .ssc-t { color: var(--ssc-muted); font-weight: 500; text-decoration: line-through; text-decoration-color: transparent; text-decoration-thickness: calc(var(--u) * 3); }

      </style>

      <div id="root" data-composition-id="split-screen-compare" data-duration="6" data-fps="30">
        <div id="ssc-clip" class="ssc-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div class="ssc-title" id="ssc-title"></div>
          <div class="ssc-col ssc-ours" id="ssc-ours"><div class="ssc-head" id="ssc-oh"></div><div class="ssc-rows" id="ssc-or"></div></div>
          <div class="ssc-col ssc-theirs" id="ssc-theirs"><div class="ssc-head" id="ssc-th"></div><div class="ssc-rows" id="ssc-tr"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function lines(v, d) { var s = typeof v === "string" && v.trim() ? v : d; return s.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ease(n, a, b) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            var PAL = [["bg", "bg_color", "#ffffff"], ["main", "main_color", "#2563eb"], ["text", "text_color", "#0a0a0a"], ["muted", "muted_color", "#8a8a8a"], ["tint", "tint_color", "#f4f4f2"]];
            PAL.forEach(function (c) { root.style.setProperty("--ssc-" + c[0], colr(vars[c[1]], c[2])); });
            root.style.setProperty("--ssc-font", '"' + str(vars.font_family, "Geist") + '", Geist, system-ui, sans-serif');
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            var rows = lines(vars.rows, "Bahan segar tiap hari|Stok seminggu sekali\nTanpa pengawet buatan|Memakai pengawet\nDikemas saat dipesan|Dikemas sehari sebelumnya\nGaransi uang kembali|Tanpa garansi").slice(0, 6).map(function (l) { var a = l.split("|"); return [a[0].trim(), (a[1] || a[0]).trim()]; });
            var n = rows.length, tt = typeof vars.title === "string" ? vars.title.trim() : "Kenapa pilih kami?";
            var te = document.getElementById("ssc-title"); te.textContent = tt;
            te.style.top = (PORTRAIT ? 140 : 52) * U + "px"; te.style.fontSize = (PORTRAIT ? 80 : 64) * U + "px";
            var top = (tt ? (PORTRAIT ? 300 : 170) : (PORTRAIT ? 160 : 60)) * U, bot = (PORTRAIT ? 140 : 60) * U, gap = (PORTRAIT ? 24 : 40) * U, mx = (PORTRAIT ? 48 : 200) * U;
            var hh = (PORTRAIT ? 120 : 100) * U, avail = H - top - bot, ch = Math.min(avail, hh + n * (PORTRAIT ? 250 : 190) * U); top += (avail - ch) / 2;
            var cw = (W - 2 * mx - gap) / 2;
            var oc = document.getElementById("ssc-ours"), tc = document.getElementById("ssc-theirs");
            [[oc, mx], [tc, mx + cw + gap]].forEach(function (c) { c[0].style.left = c[1] + "px"; c[0].style.top = top + "px"; c[0].style.width = cw + "px"; c[0].style.height = ch + "px"; });
            var hs = (PORTRAIT ? 52 : 46) * U, ic = (PORTRAIT ? 58 : 60) * U, ts = (PORTRAIT ? 39 : 44) * U, px = (PORTRAIT ? 24 : 36) * U;
            var oh = document.getElementById("ssc-oh"), th = document.getElementById("ssc-th");
            oh.textContent = str(vars.ours_label, "Kami"); th.textContent = str(vars.theirs_label, "Biasanya");
            [oh, th].forEach(function (h) { h.style.fontSize = hs + "px"; h.style.height = hh + "px"; h.style.lineHeight = hh + "px"; });
            var tick = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="var(--ssc-main)" class="ssc-bg"/><path d="M11 21 L18 28 L30 13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="ssc-d"/></svg>';
            var cross = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--ssc-muted)" stroke-width="2.5" class="ssc-bg"/><path d="M13 13 L27 27" stroke="var(--ssc-muted)" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="ssc-d"/><path d="M27 13 L13 27" stroke="var(--ssc-muted)" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="ssc-d"/></svg>';
            var or = document.getElementById("ssc-or"), tr = document.getElementById("ssc-tr"), tl = gsap.timeline({ paused: true });
            tl.fromTo(oc, { opacity: 0, x: -60 * U }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 0.1);
            tl.fromTo(tc, { opacity: 0, x: 60 * U }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 0.1);
            tl.fromTo("#ssc-title", { opacity: 0, y: -20 * U }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
            rows.forEach(function (r, i) {
              var a = el("div", "ssc-row", or), b = el("div", "ssc-row", tr);
              a.style.padding = b.style.padding = "0 " + px + "px"; a.style.gap = b.style.gap = px * 0.7 + "px";
              var ia = el("span", "ssc-ic", a, tick), ta = el("span", "ssc-t", a, esc(r[0]));
              var ib = el("span", "ssc-ic", b, cross), tb = el("span", "ssc-t", b, esc(r[1]));
              [ia, ib].forEach(function (x) { x.style.width = x.style.height = ic + "px"; }); ta.style.fontSize = tb.style.fontSize = ts + "px";
              var t0 = 1.0 + i * 0.6;
              tl.fromTo(ia, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(1.7)" }, t0);
              tl.fromTo(ia.querySelector(".ssc-d"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t0 + 0.12);
              tl.fromTo(ta, { opacity: 0, x: 18 * U }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.05);
              tl.fromTo(ib, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.5)" }, t0 + 0.22);
              ib.querySelectorAll(".ssc-d").forEach(function (d, k) { tl.fromTo(d, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, t0 + 0.36 + k * 0.12); });
              tl.fromTo(tb, { opacity: 0, x: 18 * U }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.25);
              tl.to(tb, { textDecorationColor: "#8a8a8a", duration: 0.3, ease: "power1.out" }, t0 + 0.55);
            });

            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["split-screen-compare"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
