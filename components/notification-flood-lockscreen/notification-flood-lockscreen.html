<!doctype html>
<!--
  Notification Flood Lock Screen

  A phone lock screen fills with a stack of escalating message notifications, then a last one answers the flood.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/slack-notification-ad/slack-notification-ad.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from an ad block built on a chat app's notifications on a phone's lock screen: generic icons drawn in SVG (a chat glyph, an initial tile) and a generic payoff sender, the phone's lock glyph is dropped, the wallpaper fills the whole host frame while the phone screen is scaled to fit it, messages, payoff, date and clock times are variables, and Inter comes from Google Fonts instead of bundled files.
-->
<html
  lang="en"
  data-composition-id="notification-flood-lockscreen"
  data-composition-duration="12"
  data-composition-variables='[
  {
    "id": "requests",
    "type": "string",
    "role": "content",
    "label": "Incoming messages",
    "description": "Up to 11 notifications, one per line, written as sender | message.",
    "default": "Sarah Chen | Hey! Any chance you could get the launch video done by Friday?\nMarcus Webb | also need a 30s demo cut for the keynote\n#social | Priya: can we get the launch video resized for vertical?\nDana Okafor | onboarding video needs a v2 with the new UI\n#sales | Tom: customer wants a 1-min walkthrough by EOD\nLeila Haddad | CEO is asking for a sizzle reel for the board deck\n#events | Jordan: offsite recap video??\nMiguel Reyes | can you do a Spanish version of the demo too?\n#marketing | Ava: we need 3 ad variants, portrait, square, landscape\nRaj Patel | investor update needs a quick video walkthrough\nBen Liu | one more: launch day video"
  },
  {
    "id": "payoff_title",
    "type": "string",
    "role": "content",
    "label": "Payoff sender",
    "description": "Sender of the last notification, the answer to the flood (the name of whoever the video promotes).",
    "default": "Studio North"
  },
  {
    "id": "payoff_text",
    "type": "string",
    "role": "content",
    "label": "Payoff message",
    "description": "Message of the last notification.",
    "default": "Heard you needed some videos?"
  },
  {
    "id": "date_text",
    "type": "string",
    "role": "content",
    "label": "Date line",
    "description": "Line above the clock.",
    "default": "Thursday, August 14"
  },
  {
    "id": "times",
    "type": "string",
    "role": "content",
    "label": "Clock times",
    "description": "Four clock readings, comma separated; the clock changes three times during the flood.",
    "default": "9:41, 9:42, 9:45, 9:51"
  },
  {
    "id": "request_color",
    "type": "color",
    "role": "style",
    "label": "Message icon colour 1",
    "description": "Start of the gradient of the message icon.",
    "default": "#6d5bd0"
  },
  {
    "id": "request_color_2",
    "type": "color",
    "role": "style",
    "label": "Message icon colour 2",
    "description": "End of the gradient of the message icon.",
    "default": "#3aa0e8"
  },
  {
    "id": "payoff_color",
    "type": "color",
    "role": "style",
    "label": "Payoff icon colour 1",
    "description": "Start of the gradient of the payoff tile.",
    "default": "#ff7a59"
  },
  {
    "id": "payoff_color_2",
    "type": "color",
    "role": "style",
    "label": "Payoff icon colour 2",
    "description": "End of the gradient of the payoff tile.",
    "default": "#e8317d"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Notification Flood Lock Screen</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=block" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; container-type: size; background: #090d1c; font-family: "Inter", system-ui, sans-serif; pointer-events: none; }
        #sna-scene { position: absolute; inset: 0; }
        #sna-stagewall { position: absolute; inset: 0; overflow: hidden; }
        .screen { position: absolute; left: 50%; top: 50%; width: 491.55px; height: 874px; margin-left: -245.775px; margin-top: -437px; transform-origin: 50% 50%; overflow: hidden; }
        #sna-wall .grad, #sna-wall .grain { inset: -30%; }
      /* ---- wallpaper (smooth iOS-like gradient; wrapper carries the slow push) ---- */
      #sna-wall { position: absolute; inset: 0; }
      #sna-wall .grad {
        position: absolute;
        inset: -6%;
        background:
          radial-gradient(90% 62% at 82% 8%, rgba(94, 66, 166, 0.85) 0%, rgba(94, 66, 166, 0) 60%),
          radial-gradient(110% 70% at 14% 30%, rgba(38, 76, 154, 0.9) 0%, rgba(38, 76, 154, 0) 65%),
          radial-gradient(
            120% 85% at 50% 96%,
            rgba(196, 108, 74, 0.55) 0%,
            rgba(196, 108, 74, 0) 55%
          ),
          radial-gradient(140% 100% at 50% 55%, #17203c 0%, #0d1226 70%, #090d1c 100%);
      }
      #sna-wall .grain {
        position: absolute;
        inset: -6%;
        opacity: 0.05;
        background-image: repeating-radial-gradient(
          circle at 30% 40%,
          rgba(255, 255, 255, 0.5) 0 0.5px,
          transparent 0.5px 2.4px
        );
      }

      /* ---- lock-screen chrome ---- */
      #sna-chrome {
        position: absolute;
        inset: 0;
        transform-origin: 50% 30%;
      }
      #sna-statusbar {
        position: absolute;
        top: 24px;
        right: 26px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #sna-statusbar svg {
        display: block;
      }
      #sna-lockglyph {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
      }
      #sna-date {
        position: absolute;
        top: 102px;
        width: 100%;
        text-align: center;
        font-family: "NotificationUI";
        font-weight: 600;
        font-size: 21px;
        letter-spacing: 0.1px;
        color: rgba(235, 240, 255, 0.92);
      }
      #sna-clockwrap {
        position: absolute;
        top: 118px;
        width: 100%;
        height: 116px;
      }
      .clock {
        position: absolute;
        inset: 0;
        text-align: center;
        font-family: "NotificationUI";
        font-weight: 700;
        font-size: 97px;
        line-height: 116px;
        letter-spacing: -1px;
        color: rgba(238, 243, 255, 0.95);
        font-variant-numeric: tabular-nums;
      }

      /* bottom controls */
      .cornerbtn {
        position: absolute;
        bottom: 46px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(64, 66, 78, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sna-btn-torch {
        left: 46px;
      }
      #sna-btn-camera {
        right: 46px;
      }
      #sna-homebar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        margin-left: -67px;
        width: 134px;
        height: 5px;
        border-radius: 2.5px;
        background: rgba(255, 255, 255, 0.92);
      }

      /* ---- notifications ---- */
      #sna-stack {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 254px;
        height: 0;
      }
      .ncard {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 98px; /* uniform card height — every notification the same slab */
        border-radius: 22px;
        padding: 13px 16px 13px 14px;
        background: rgba(43, 44, 51, 0.96);
        -webkit-backdrop-filter: blur(24px) saturate(1.6);
        backdrop-filter: blur(24px) saturate(1.6);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
        display: flex;
        align-items: center;
        gap: 11px;
        transform-origin: 50% 0%;
      }
      .nicon {
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nicon img {
        width: 24px;
        height: 24px;
        display: block;
      }
      .nbody {
        flex: 1 1 auto;
        min-width: 0;
        padding-top: 0.5px;
      }
      .nrow {
        display: flex;
        align-items: baseline;
      }
      .ntitle {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 600;
        font-size: 16.5px;
        line-height: 22px;
        color: rgba(255, 255, 255, 0.98);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ntime {
        flex: 0 0 auto;
        margin-left: 8px;
        font-size: 14.3px;
        line-height: 19px;
        color: rgba(235, 235, 245, 0.6);
      }
      .ntext {
        font-size: 16.5px;
        line-height: 22px;
        color: rgba(255, 255, 255, 0.96);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

        .nicon { overflow: hidden; background: transparent; }
        .nicon svg { width: 38px; height: 38px; display: block; }
      </style>
      <div id="root" data-composition-id="notification-flood-lockscreen" data-duration="12" data-fps="30">
        <div id="sna-scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
          <div id="sna-stagewall"><div id="sna-wall"><div class="grad"></div><div class="grain"></div></div></div>
          <div class="screen" id="sna-screen">
          <div id="sna-chrome">
            <div id="sna-statusbar">
              <!-- cellular bars -->
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                <rect
                 
                  x="0"
                  y="7.5"
                  width="3"
                  height="4.5"
                  rx="1"
                  fill="#fff"
                />
                <rect x="5" y="5" width="3" height="7" rx="1" fill="#fff" />
                <rect
                 
                  x="10"
                  y="2.5"
                  width="3"
                  height="9.5"
                  rx="1"
                  fill="#fff"
                />
                <rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" />
              </svg>
              <!-- wifi -->
              <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
                <path
                 
                  d="M8.5 2.4c2.7 0 5.2 1.03 7.06 2.72a.62.62 0 0 0 .87-.02l.93-.95a.65.65 0 0 0-.02-.93A12.47 12.47 0 0 0 8.5 0C5.28 0 2.34 1.22.66 3.22a.65.65 0 0 0-.02.93l.93.95c.24.24.62.25.87.02A10.4 10.4 0 0 1 8.5 2.4Z"
                  fill="#fff"
                />
                <path
                 
                  d="M8.5 6.6c1.48 0 2.84.55 3.88 1.45.26.22.64.21.88-.03l.93-.95a.65.65 0 0 0-.03-.94A8.3 8.3 0 0 0 8.5 4.2a8.3 8.3 0 0 0-5.66 1.93.65.65 0 0 0-.03.94l.93.95c.24.24.62.25.88.03A6.14 6.14 0 0 1 8.5 6.6Z"
                  fill="#fff"
                />
                <path
                 
                  d="M10.86 10.11c.3-.3.27-.8-.08-1.05a3.96 3.96 0 0 0-4.56 0c-.35.25-.38.75-.08 1.05l1.9 1.7c.25.25.67.25.92 0l1.9-1.7Z"
                  fill="#fff"
                />
              </svg>
              <!-- battery -->
              <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
                <rect
                 
                  x="0.5"
                  y="0.5"
                  width="23"
                  height="12"
                  rx="3.8"
                  stroke="#fff"
                  stroke-opacity="0.4"
                />
                <rect x="2" y="2" width="20" height="9" rx="2.4" fill="#fff" />
                <path
                 
                  d="M25.2 4.3v4.4c1.05-.32 1.8-1.2 1.8-2.2s-.75-1.88-1.8-2.2Z"
                  fill="#fff"
                  fill-opacity="0.4"
                />
              </svg>
            </div>

            <div id="sna-date">
              
            </div>
            <div id="sna-clockwrap" data-clocks>
                    </div>

            <div class="cornerbtn" id="sna-btn-torch">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                 
                  d="M6.5 1.5h7v3.2c0 .9-.5 1.6-1.1 2.3-.5.5-.9 1.1-.9 1.9v8.1a1.5 1.5 0 0 1-1.5 1.5h-.9a1.5 1.5 0 0 1-1.5-1.5V8.9c0-.8-.4-1.4-.9-1.9-.7-.7-1.2-1.4-1.2-2.3V1.5Z"
                  fill="#fff"
                />
                <rect
                 
                  x="9.2"
                  y="9.4"
                  width="1.6"
                  height="2.6"
                  rx="0.8"
                  fill="rgba(64,66,78,0.9)"
                />
              </svg>
            </div>
            <div class="cornerbtn" id="sna-btn-camera">
              <svg width="21" height="17" viewBox="0 0 21 17" fill="none">
                <path
                 
                  d="M2.8 3.4h2.9l1-1.6c.3-.5.8-.8 1.4-.8h4.8c.6 0 1.1.3 1.4.8l1 1.6h2.9A1.8 1.8 0 0 1 20 5.2v9a1.8 1.8 0 0 1-1.8 1.8H2.8A1.8 1.8 0 0 1 1 14.2v-9a1.8 1.8 0 0 1 1.8-1.8Z"
                  fill="#fff"
                />
                <circle cx="10.5" cy="9.5" r="3.6" fill="rgba(64,66,78,0.9)" />
                <circle cx="10.5" cy="9.5" r="2.5" fill="#fff" />
              </svg>
            </div>
            <div id="sna-homebar"></div>
          </div>

          <div id="sna-stack"></div>
          </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function str(x, f) { return typeof x === "string" && x.trim() ? x : f; }
            function col(x, f) { return typeof x === "string" && x.trim() ? x.trim() : f; }
            var DEFAULT_REQUESTS = [
              "Sarah Chen | Hey! Any chance you could get the launch video done by Friday?",
              "Marcus Webb | also need a 30s demo cut for the keynote",
              "#social | Priya: can we get the launch video resized for vertical?",
              "Dana Okafor | onboarding video needs a v2 with the new UI",
              "#sales | Tom: customer wants a 1-min walkthrough by EOD",
              "Leila Haddad | CEO is asking for a sizzle reel for the board deck",
              "#events | Jordan: offsite recap video??",
              "Miguel Reyes | can you do a Spanish version of the demo too?",
              "#marketing | Ava: we need 3 ad variants, portrait, square, landscape",
              "Raj Patel | investor update needs a quick video walkthrough",
              "Ben Liu | one more: launch day video"
            ];
            var lines = str(vars.requests, DEFAULT_REQUESTS.join("\n")).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 11);
            var notifs = lines.map(function (line) {
              var i = line.indexOf("|");
              return i < 0 ? { title: "Message", text: line } : { title: line.slice(0, i).trim() || "Message", text: line.slice(i + 1).trim() };
            });
            var payoffTitle = str(vars.payoff_title, "Studio North");
            notifs.push({ title: payoffTitle, text: str(vars.payoff_text, "Heard you needed some videos?"), payoff: true });
            var times = str(vars.times, "9:41, 9:42, 9:45, 9:51").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            while (times.length < 4) times.push(times[times.length - 1] || "9:41");
            document.getElementById("sna-date").textContent = str(vars.date_text, "Thursday, August 14");
            var clockWrap = document.getElementById("sna-clockwrap");
            times.slice(0, 4).forEach(function (t) { var d = document.createElement("div"); d.className = "clock"; d.textContent = t; clockWrap.appendChild(d); });
            var accent1 = col(vars.request_color, "#6d5bd0"), accent2 = col(vars.request_color_2, "#3aa0e8");
            var payA = col(vars.payoff_color, "#ff7a59"), payB = col(vars.payoff_color_2, "#e8317d");

            var W = root.clientWidth || 1080, H0 = root.clientHeight || 1920;
            var screenEl = document.getElementById("sna-screen");
            screenEl.style.transform = "scale(" + Math.min(W / 491.55, H0 / 874) + ")";

            var SVGNS = "http://www.w3.org/2000/svg";
            function iconFor(n, i) {
              var gid = "sna-g" + i;
              var a = n.payoff ? payA : accent1, b = n.payoff ? payB : accent2;
              var glyph = n.payoff
                ? '<text x="19" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#fff">' + (Array.from(n.title)[0] || "S").toUpperCase().replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</text>"
                : '<path d="M10 12.5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6.2L14 28v-4.5h-1a3 3 0 0 1-3-3Z" fill="#fff"/>';
              return '<svg viewBox="0 0 38 38"><defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="38" height="38" rx="9" fill="url(#' + gid + ')"/>' + glyph + "</svg>";
            }
            var stackEl = document.getElementById("sna-stack");
            notifs.forEach(function (n, i) {
              var card = document.createElement("div");
              card.className = "ncard";
              card.id = "sna-n" + i;
              card.innerHTML = '<div class="nicon">' + iconFor(n, i) + '</div><div class="nbody"><div class="nrow"><span class="ntitle"></span><span class="ntime">now</span></div><div class="ntext"></div></div>';
              card.querySelector(".ntitle").textContent = n.title;
              card.querySelector(".ntext").textContent = n.text;
              stackEl.appendChild(card);
            });
            var cards = notifs.map(function (_, i) { return document.getElementById("sna-n" + i); });
            var N = cards.length;
            // Arrival times: the design has 11 requests with shrinking gaps, then the payoff after a longer beat.
            var BASE = [1.15, 3.75, 4.6, 5.34, 5.98, 6.54, 7.02, 7.44, 7.8, 8.11, 8.38, 8.88];
            var arrivals = BASE.slice(0, N - 1).concat([BASE[BASE.length - 1]]);
            var swaps = [4.6, 6.54, 8.11];
            var END = 12;
            var PEEK = 8, DEPTH_SCALE = 0.045, MAX_PEEKS = 2, STACK_TOP = 254, ENTER_FROM = 874 - STACK_TOP, ENTER_DUR = 0.65, REDEPTH_DUR = 0.5;
            var hs = [];
            function stateAt(i, k) {
              var d = k - i;
              if (d === 0) return { y: 0, sx: 1, sy: 1, alpha: 1 };
              return { y: 0, sx: Math.max(0.001, 1 - DEPTH_SCALE * d), sy: (hs[k] + PEEK * d) / hs[i], alpha: d <= MAX_PEEKS ? 1 : 0 };
            }
            var wall = document.getElementById("sna-wall");
            var chromeEl = document.getElementById("sna-chrome");
            var clocks = Array.prototype.slice.call(document.querySelectorAll(".clock"));
            var chromeBits = ["sna-date", "sna-clockwrap", "sna-statusbar", "sna-btn-torch", "sna-btn-camera", "sna-homebar"].map(function (id) { return document.getElementById(id); });
            var tl = gsap.timeline({ paused: true });
            function build() {
              tl.clear();
              gsap.set(cards, { clearProps: "transform,opacity,visibility" });
              hs = cards.map(function (c) { return c.offsetHeight; });
              gsap.set(wall, { autoAlpha: 0, scale: 1, transformOrigin: "50% 42%" });
              gsap.set(chromeEl, { scale: 1.045 });
              gsap.set(chromeBits, { autoAlpha: 0, y: 16 });
              gsap.set(clocks, { autoAlpha: 0 });
              cards.forEach(function (c, i) { gsap.set(c, { autoAlpha: 0, y: ENTER_FROM, scaleX: 0.97, scaleY: 0.97, zIndex: 10 + i }); });
              var wake = 0.1;
              tl.to(wall, { autoAlpha: 1, duration: 0.55, ease: "power2.out" }, wake);
              tl.to(chromeEl, { scale: 1, duration: 0.8, ease: "expo.out" }, wake + 0.15);
              var wakeAt = [0.28, 0.3, 0.46, 0.5, 0.5, 0.54];
              chromeBits.forEach(function (el, i) { tl.to(el, { autoAlpha: 1, y: 0, duration: 0.55, ease: "expo.out" }, wake + wakeAt[i]); });
              tl.set(clocks[0], { autoAlpha: 1 }, wake + 0.3);
              tl.fromTo(wall, { scale: 1 }, { scale: 1.05, duration: END - wake, ease: "none", immediateRender: false }, wake);
              swaps.forEach(function (t, i) { tl.set(clocks[i], { autoAlpha: 0 }, t); tl.set(clocks[i + 1], { autoAlpha: 1 }, t); });
              arrivals.forEach(function (t, k) {
                var card = cards[k];
                tl.fromTo(card, { y: ENTER_FROM, scaleX: 0.97, scaleY: 0.97, autoAlpha: 0 }, { y: 0, scaleX: 1, scaleY: 1, autoAlpha: 1, duration: ENTER_DUR, ease: "expo.out", immediateRender: false }, t);
                tl.fromTo(card, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.12, ease: "none", immediateRender: false, overwrite: false }, t);
                for (var i = 0; i < k; i++) {
                  var from = stateAt(i, k - 1), to = stateAt(i, k);
                  tl.fromTo(cards[i], { y: from.y, scaleX: from.sx, scaleY: from.sy }, { y: to.y, scaleX: to.sx, scaleY: to.sy, duration: REDEPTH_DUR, ease: "power3.out", immediateRender: false }, t);
                  if (from.alpha !== to.alpha) tl.fromTo(cards[i], { autoAlpha: from.alpha }, { autoAlpha: to.alpha, duration: 0.3, ease: "power2.in", immediateRender: false }, t);
                }
              });
              tl.set({}, {}, END);
              tl.seek(0);
            }
            build();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { build(); }, function () {});
            window.__timelines = window.__timelines || {};
            window.__timelines["notification-flood-lockscreen"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
