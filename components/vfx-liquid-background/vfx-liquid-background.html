  Liquid Page Waves

  A page floats on a liquid surface: vertex waves and ripples roll across it with a slight camera tilt, intensify, and the page crossfades into a second one while the surface settles to still. WebGL over two built-in pages.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/vfx-liquid-background/vfx-liquid-background.html

  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (the wavy plane is sized from the frame and overfills the view by 4% instead of 16%, so page edges are not cropped); rewritten from three.js (not loaded) to raw WebGL2: the 100 x 60 grid, vertex and fragment shaders and the tilting perspective camera are the same, with the camera matrices computed in the file; the two pages are generic placeholders drawn on 2D canvases from variables (a balance dashboard and a post feed, replacing the upstream pages that imitated real apps); the font is Inter from Google Fonts; the canvas is drawn at the `resolution` variable.
-->
