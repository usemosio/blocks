<!--
  Text Burst Explode

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="text-explode"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word to blow up. Short words (3 to 8 letters) work best.", "default": "BOOM"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the letters in pixels. Wide text shrinks to fit the frame.", "default": 120, "min": 30, "max": 400, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of the letters.", "default": "#0a0a0a"},
    {"id": "accent", "type": "color", "role": "style", "label": "Ring color", "description": "Color of the shockwave ring.", "default": "#2563eb"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Burst Explode</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .tbe-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #0a0a0a); }
        .tbe-g { position: relative; display: flex; line-height: 1.2; font-weight: 800; }
        .tbe-ch { display: inline-block; white-space: pre; }
        .tbe-ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 0.025em solid var(--ac, #2563eb); transform: translate(-50%, -50%); opacity: 0; }

      </style>

      <div id="root" data-composition-id="text-explode" data-duration="3" data-fps="30">
        <div id="tbe-clip" class="tbe-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="tbe-g" class="tbe-g"><div id="tbe-ring" class="tbe-ring"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "3");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-explode"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var text = str(vars.text, "BOOM");
            var g = el("tbe-g"), ring = el("tbe-ring");
            root.style.setProperty("--c", str(vars.color, "#0a0a0a"));
            root.style.setProperty("--ac", str(vars.accent, "#2563eb"));
            var chars = Array.from(text).map(function (c) {
              var s = document.createElement("span");
              s.className = "tbe-ch";
              s.textContent = c;
              g.insertBefore(s, ring);
              return s;
            });
            var base = num(vars.font_size, 120, 30, 400);
            function fit() { fitG(g, base, null, 0.7, 0.6); }
            fit();
            onFonts(fit);

            // remocn-scenes: gather for 25 frames, explode at frame 30 (letters travel up to 300 px on
            // a damped spring at their own angle, spin 5 degrees a frame, scale 1.5 to 0.8, fade from 50 to 80),
            // ring up to 800 px. Here each letter starts from its own place in the word.
            function draw(f) {
              var U = 120, X = 30;
              var gather = ip(f, 0, 25, 0, 1, E.out);
              var exploding = f >= X;
              var dist = exploding ? spring(f - X, { damping: 20, stiffness: 100 }) * 300 : 0;
              chars.forEach(function (s, i) {
                var a = (i / chars.length) * Math.PI * 2;
                var x = exploding ? Math.cos(a) * dist : 0, y = exploding ? Math.sin(a) * dist : 0;
                var rot = exploding ? (f - X) * (i % 2 === 0 ? 5 : -5) : 0;
                var sc = exploding ? ip(f, X, X + 40, 1.5, 0.8) : gather;
                s.style.transform = "translate(" + (x / U) + "em, " + (y / U) + "em) rotate(" + rot + "deg) scale(" + sc + ")";
                s.style.opacity = exploding ? ip(f, X + 20, X + 50, 1, 0) : gather;
              });
              if (exploding) {
                var rs = spring(f - X, { damping: 30, stiffness: 80 }) * 800 / U;
                ring.style.width = ring.style.height = rs + "em";
                ring.style.opacity = ip(f, X, X + 30, 0.6, 0);
              } else {
                ring.style.opacity = 0;
              }
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
