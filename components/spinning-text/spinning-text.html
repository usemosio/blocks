<html
  lang="en"
  data-composition-id="spinning-text"
  data-composition-duration="6"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The phrase set around the circle. A space is added at the end to close the ring.", "default": "learn more • earn more • grow more •"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. The ring shrinks to fit the frame.", "default": 56, "min": 12, "max": 160, "step": 1, "unit": "px"},
    {"id": "radius", "type": "number", "role": "style", "label": "Radius", "description": "Ring radius in character widths (the source uses 5).", "default": 5, "min": 2, "max": 14, "step": 0.5, "unit": "ch"},
    {"id": "color", "type": "color", "role": "style", "label": "Colour", "description": "Text colour.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "500", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which way the ring turns.", "default": "clockwise", "options": [{"value": "clockwise", "label": "Clockwise"}, {"value": "counter", "label": "Counter-clockwise"}]},
    {"id": "rotation_seconds", "type": "number", "role": "motion", "label": "Rotation time", "description": "Seconds for one full turn (the source uses 10).", "default": 6, "min": 1, "max": 30, "step": 0.5, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Spinning Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .spt-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .spt-ring { position: relative; width: 0; height: 0; font-family: var(--font-display, Geist, system-ui, sans-serif); line-height: 1; }
        .spt-letter { position: absolute; top: 50%; left: 50%; display: inline-block; white-space: pre; transform-origin: center; }
      </style>

      <div id="root" data-composition-id="spinning-text" data-duration="6" data-fps="30">
        <div id="spt-clip" class="spt-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="spt-ring" class="spt-ring" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Shrink an element's font until it fits a share of the frame width.
            function fit(el, size, share) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * share);
              if (el.scrollWidth > max) {
                size = Math.max(12, size * (max / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            // A seeded random generator, so every seek draws the same thing.
            function mulberry32(a) {
              return function () {
                a |= 0; a = (a + 0x6d2b79f5) | 0;
                var t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
            gsap.registerPlugin(CustomEase);
            var TAG = "spt";
            var bezN = 0;
            function bez(x1, y1, x2, y2) {
              return CustomEase.create(TAG + "-" + bezN++, "M0,0 C" + x1 + "," + y1 + " " + x2 + "," + y2 + " 1,1");
            }
            var tl = gsap.timeline({ paused: true });
            function finish() {
              var total = parseFloat(root.dataset.duration || "6");
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["spinning-text"] = tl;
            }

            var ring = document.getElementById("spt-ring");
            var text = str(vars.text, "learn more \u2022 earn more \u2022 grow more \u2022");
            var radius = num(vars.radius, 5, 2, 14);
            var turn = num(vars.rotation_seconds, 6, 1, 30);
            var dir = vars.direction === "counter" ? -1 : 1;
            ring.setAttribute("aria-label", text);
            ring.style.color = col(vars.color, "#171717");
            ring.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "500");
            var letters = Array.from(text);
            letters.push(" ");
            // Fit the ring in the frame: its diameter is 2 radii (in ch) plus one letter.
            var size = num(vars.font_size, 56, 12, 160);
            ring.style.fontSize = size + "px";
            var probe = document.createElement("span");
            probe.style.cssText = "position:absolute;visibility:hidden;width:1ch";
            ring.appendChild(probe);
            var chRatio = probe.getBoundingClientRect().width / size;
            ring.removeChild(probe);
            var room = 0.92 * Math.min(root.clientWidth, root.clientHeight);
            size = Math.max(12, Math.min(size, room / (2 * radius * chRatio + 1.2)));
            ring.style.fontSize = size + "px";
            letters.forEach(function (ch, i) {
              var s = document.createElement("span");
              s.id = "spt-letter-" + i;
              s.className = "spt-letter";
              s.setAttribute("aria-hidden", "true");
              s.textContent = ch;
              s.style.transform = "translate(-50%, -50%) rotate(" + (360 / letters.length) * i + "deg) translateY(" + (-radius) + "ch)";
              ring.appendChild(s);
            });
            var total = parseFloat(root.dataset.duration || "6");
            tl.fromTo(ring, { rotation: 0 }, { rotation: 360 * dir * (total / turn), duration: total, ease: "none", immediateRender: true }, 0);

            finish();
          })();
        </script>
      </div>
    </template>
  </body>
</html>
