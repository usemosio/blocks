<!doctype html>
<!--
  Store Location Pin

  An abstract map (a light street grid drawn with SVG lines, no real geography) draws itself, a pin drops and settles with a small bounce, then an address card rises with the shop name, street and opening hours.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="store-location-pin"
  data-composition-duration="5.5"
  data-composition-variables='[
  {
    "id": "shop",
    "type": "string",
    "role": "content",
    "label": "Shop name",
    "description": "Shop name on the address card.",
    "default": "Kopi Senja"
  },
  {
    "id": "street",
    "type": "string",
    "role": "content",
    "label": "Street",
    "description": "Address line on the card.",
    "default": "Jl. Melati No. 12, Bandung"
  },
  {
    "id": "hours",
    "type": "string",
    "role": "content",
    "label": "Hours",
    "description": "Opening hours line. Leave empty to hide it.",
    "default": "Buka 08.00–21.00"
  },
  {
    "id": "seed",
    "type": "number",
    "role": "content",
    "label": "Map seed",
    "description": "Changes the street layout.",
    "default": 5,
    "min": 1,
    "max": 999,
    "step": 1
  },
  {
    "id": "drop_at",
    "type": "number",
    "role": "motion",
    "label": "Pin drop time",
    "description": "Second the pin starts to fall.",
    "default": 1.5,
    "min": 0.8,
    "max": 3,
    "step": 0.1
  },
  {
    "id": "map_color",
    "type": "color",
    "role": "style",
    "label": "Street colour",
    "description": "Colour of the streets.",
    "default": "#e4e4e7"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The pin: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Store Location Pin</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--sl-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--sl-bg);
        }
        #root * { box-sizing: border-box; }
        .sl-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .sl-map { position: absolute; inset: 0; width: 100%; height: 100%; }
        .sl-pin { position: absolute; width: calc(var(--u) * 132); height: calc(var(--u) * 176); margin-left: calc(var(--u) * -66); margin-top: calc(var(--u) * -176); transform-origin: 50% 100%; z-index: 3; }
        .sl-pin svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 calc(var(--u) * 6) calc(var(--u) * 8) rgba(0,0,0,0.18)); }
        .sl-shadow { position: absolute; width: calc(var(--u) * 84); height: calc(var(--u) * 26); margin: calc(var(--u) * -13) 0 0 calc(var(--u) * -42); border-radius: 50%; background: rgba(0,0,0,0.2); z-index: 2; }
        .sl-ripple { opacity: 0; position: absolute; width: calc(var(--u) * 150); height: calc(var(--u) * 150); margin: calc(var(--u) * -75) 0 0 calc(var(--u) * -75); border-radius: 50%; border: calc(var(--u) * 4) solid var(--sl-main); z-index: 1; }
        .sl-card { position: absolute; left: 50%; width: calc(var(--u) * 900); margin-left: calc(var(--u) * -450); padding: calc(var(--u) * 46) calc(var(--u) * 52); border-radius: calc(var(--u) * 44); background: #fff; border: calc(var(--u) * 2) solid rgba(10,10,10,0.09); box-shadow: 0 calc(var(--u) * 16) calc(var(--u) * 40) rgba(0,0,0,0.12); z-index: 4; }
        .sl-shop { font-size: calc(var(--u) * 66); font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
        .sl-street { margin-top: calc(var(--u) * 12); font-size: calc(var(--u) * 38); font-weight: 500; color: var(--sl-muted); }
        .sl-hrs { margin-top: calc(var(--u) * 26); padding-top: calc(var(--u) * 24); border-top: calc(var(--u) * 2) solid rgba(10,10,10,0.09); display: flex; align-items: center; gap: calc(var(--u) * 16); font-size: calc(var(--u) * 42); font-weight: 600; font-variant-numeric: tabular-nums; }
        .sl-hrs svg { width: calc(var(--u) * 44); height: calc(var(--u) * 44); flex: none; }

      </style>

      <div id="root" data-composition-id="store-location-pin" data-duration="5.5" data-fps="30">
        <div id="sl-clip" class="sl-stage clip" data-start="0" data-duration="5.5" data-track-index="0">

          <svg class="sl-map" id="sl-map"></svg>
          <div class="sl-ripple" id="sl-ripple"></div>
          <div class="sl-shadow" id="sl-shadow"></div>
          <div class="sl-pin" id="sl-pin"></div>
          <div class="sl-card" id="sl-card">
            <div class="sl-shop" id="sl-shop"></div><div class="sl-street" id="sl-street"></div>
            <div class="sl-hrs" id="sl-hrs"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("sl", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", map: "#e4e4e7" });


            var u = U;
            var shop = str(vars.shop, "Kopi Senja"), street = str(vars.street, "Jl. Melati No. 12, Bandung");
            var hours = typeof vars.hours === "string" ? vars.hours.trim() : "Buka 08.00–21.00";
            var seed = Math.round(num(vars.seed, 5, 1, 999)), dropAt = num(vars.drop_at, 1.5, 0.8, 3);
            root.style.setProperty("--sl-map", colr(vars.map_color, "#e4e4e7"));
            document.getElementById("sl-shop").textContent = shop;
            document.getElementById("sl-street").textContent = street;
            var hrs = document.getElementById("sl-hrs");
            if (hours) hrs.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span></span>';
            if (hours) hrs.lastChild.textContent = hours; else hrs.style.display = "none";

            // Streets: a loose grid, rotated a little, with one diagonal avenue and a park block.
            var map = document.getElementById("sl-map");
            map.setAttribute("viewBox", "0 0 " + W + " " + H);
            var rnd = mulberry(seed * 4099 + 3), big = Math.max(W, H) * 1.5;
            var mc = colr(vars.map_color, "#e4e4e7");
            var g = svg("g", { transform: "rotate(-14 " + W / 2 + " " + H / 2 + ")" }, map);
            var lines = [];
            function street_(x1, y1, x2, y2, w) { var l = svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: mc, "stroke-width": w, "stroke-linecap": "round", pathLength: 1 }, g); l.style.strokeDasharray = "1"; l.style.strokeDashoffset = "0"; lines.push(l); return l; }
            var x0 = (W - big) / 2, y0 = (H - big) / 2;
            svg("rect", { x: W * 0.12, y: H * 0.5, width: 300 * u, height: 220 * u, rx: 28 * u, fill: mc, opacity: 0.45 }, g);
            for (var y = y0 + rnd() * 120 * u, i = 0; y < y0 + big; i++) { street_(x0, y, x0 + big, y + (rnd() - 0.5) * 30 * u, (i % 4 === 1 ? 26 : 10) * u); y += (150 + rnd() * 120) * u; }
            for (var x = x0 + rnd() * 120 * u, j = 0; x < x0 + big; j++) { street_(x, y0, x + (rnd() - 0.5) * 30 * u, y0 + big, (j % 4 === 2 ? 26 : 10) * u); x += (150 + rnd() * 120) * u; }
            street_(x0, y0 + big * 0.7, x0 + big, y0 + big * 0.25, 22 * u);

            // Pin.
            var cx = W / 2, cy = H * (PORTRAIT ? 0.36 : 0.37);
            var pin = document.getElementById("sl-pin"), sh = document.getElementById("sl-shadow"), rip = document.getElementById("sl-ripple");
            pin.style.left = cx + "px"; pin.style.top = cy + "px";
            [sh, rip].forEach(function (e) { e.style.left = cx + "px"; e.style.top = cy + "px"; });
            var psv = svg("svg", { viewBox: "0 0 132 176" }, pin);
            svg("path", { d: "M66 172 C66 172 8 106 8 64 C8 30 33 6 66 6 C99 6 124 30 124 64 C124 106 66 172 66 172 Z", fill: colr(vars.main_color, "#2563eb") }, psv);
            svg("circle", { cx: 66, cy: 64, r: 22, fill: "#fff" }, psv);

            var card = document.getElementById("sl-card");
            var cardH = card.offsetHeight;
            card.style.top = (H - cardH - (PORTRAIT ? 150 : 60) * u) + "px";

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(g, { scale: 1.1, transformOrigin: "50% 50%" }, { scale: 1, duration: 3, ease: "power2.out" }, 0);
            tl.fromTo(lines, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out", stagger: { each: 0.55 / lines.length, from: "random" } }, 0.1);
            var drop = cy + 180 * u;
            tl.fromTo(pin, { y: -drop, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power2.in" }, dropAt);
            tl.fromTo(sh, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power2.in" }, dropAt);
            var hit = dropAt + 0.42;
            tl.fromTo(pin, { scaleY: 1, scaleX: 1 }, { scaleY: 0.86, scaleX: 1.1, duration: 0.07, ease: "power2.out" }, hit);
            tl.to(pin, { scaleY: 1, scaleX: 1, y: -38 * u, duration: 0.2, ease: "power2.out" }, hit + 0.07);
            tl.to(pin, { y: 0, duration: 0.2, ease: "power2.in" }, hit + 0.27);
            tl.to(pin, { y: -12 * u, duration: 0.1, ease: "power1.out" }, hit + 0.47);
            tl.to(pin, { y: 0, duration: 0.1, ease: "power1.in" }, hit + 0.57);
            tl.fromTo(rip, { scale: 0.2, opacity: 0.55 }, { scale: 1.8, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, hit);
            tl.fromTo(card, { y: 340 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" }, hit + 0.55);
            tl.fromTo(["#sl-shop", "#sl-street", "#sl-hrs"], { y: 20 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.1 }, hit + 0.7);

            var total = parseFloat(root.dataset.duration || "5.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["store-location-pin"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
