  A rack focus between scenes: the outgoing scene defocuses and brightens, the incoming scene pulls into sharp focus.

<html
  lang="en"
  data-composition-id="focus-pull"
  data-composition-duration="1.5333"
  data-composition-variables='[
  {
    "id": "blur",
    "type": "number",
    "role": "motion",
    "label": "Blur",
    "description": "Peak blur of the defocused scene.",
    "default": 16,
    "min": 0,
    "max": 40,
    "step": 1,
    "unit": "px"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Focus Pull</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .fcp-stage { position: absolute; inset: 0; }
        .fcp-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .fcp-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .fcp-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .fcp-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .fcp-pa { background: #141318; }
        .fcp-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .fcp-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .fcp-pa { z-index: 1; } .fcp-pb { z-index: 2; }

      </style>

      <div id="root" data-composition-id="focus-pull" data-duration="1.5333" data-fps="30">
        <div id="fcp-clip" class="fcp-stage clip" data-start="0" data-duration="1.5333" data-track-index="0">
          <div id="fcp-a" class="fcp-panel fcp-pa"><div class="fcp-in"><span>Scene A</span><i class="fcp-bar"></i></div></div>
          <div id="fcp-b" class="fcp-panel fcp-pb"><div class="fcp-in"><span>Scene B</span><i class="fcp-bar"></i></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 1.5333;

var blur = num(vars.blur, 16, 0, 40);
var A = document.getElementById("fcp-a"), B = document.getElementById("fcp-b");
var quadIn = inQuad, quadOut = outQuad;
function frame(p) {
  A.style.opacity = interp(p, [0.42, 0.68], [1, 0], inOutEase);
  A.style.scale = interp(p, [0, 0.6], [1, 1.05], inOutEase);
  A.style.filter = "blur(" + interp(p, [0.05, 0.55], [0, blur], quadIn) + "px) brightness(" + interp(p, [0.1, 0.55], [1, 1.3]) + ")";
  B.style.opacity = interp(p, [0.32, 0.52], [0, 1]);
  B.style.scale = interp(p, [0.35, 1], [0.97, 1], outCubic);
  B.style.filter = "blur(" + interp(p, [0.35, 0.9], [blur, 0], quadOut) + "px) brightness(" + interp(p, [0.4, 0.85], [1.25, 1]) + ")";
}

            drive("focus-pull", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
