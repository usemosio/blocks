<!doctype html>
<!--
  Glass Hero

  A glass object rises in front of a giant headline and turns, bending the type: a lens or a ring with real refraction, a little colour dispersion, a tint and studio reflections on its edge. A subline fades in beneath.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/glass-hero/glass-hero.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (the glass is a little smaller on narrow frames); rewritten from three.js (not loaded) to one raw WebGL2 fragment shader that sphere-traces a flattened sphere or a torus, refracts through it per colour channel and reads the headline plane behind it; three.js physical transmission is approximated (Beer-Lambert tint, Fresnel, studio softbox reflections, a clear-coat layer and a key-light highlight), so the look is close but not identical; the headline is drawn on a 2D canvas; the font is Inter from Google Fonts; the canvas is drawn at the `resolution` variable.
-->
<html
  lang="en"
  data-composition-id="glass-hero"
  data-composition-duration="5"
  data-composition-variables='[{"id": "headline", "type": "string", "role": "content", "label": "Headline behind the glass", "default": "CLARITY"},
    {"id": "subline", "type": "string", "role": "content", "label": "Subline", "default": "See every detail, nothing in the way."},
    {"id": "shape", "type": "enum", "role": "style", "label": "Glass shape", "default": "lens", "options": [{"value": "lens", "label": "Lens"},
    {"value": "ring", "label": "Ring"}]},
    {"id": "glass_tint", "type": "color", "role": "style", "label": "Glass tint", "default": "#cfe9ff"},
    {"id": "type_color", "type": "color", "role": "style", "label": "Headline color", "default": "#f4efe4"},
    {"id": "background", "type": "color", "role": "style", "label": "Backdrop", "default": "#0b0b0c"},
    {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the glass is drawn at, then scaled up. Refraction edges are soft; 0.5 looks the same as 1 in the stills.", "default": 0.5, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Glass Hero</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .ghr-stage {
          position: absolute;
          inset: 0;
        }
        .ghr-canvas {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .ghr-sub {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 10.9cqh;
          padding: 0 6cqw;
          text-align: center;
          font: 500 min(3.33cqmin, 3.4cqw) / 1.2 "Inter", system-ui, sans-serif;
          letter-spacing: 0.01em;
          color: rgba(244, 239, 228, 0.78);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="glass-hero" data-duration="5" data-fps="30">
        <div id="ghr-clip" class="ghr-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <canvas id="ghr-canvas" class="ghr-canvas"></canvas>
          <div class="ghr-sub" id="ghr-sub"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "glass-hero";
            var DUR = 5;
            var root = document.getElementById("root");
            var canvas = document.getElementById("ghr-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#000000").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "headline", "type": "string", "role": "content", "label": "Headline behind the glass", "default": "CLARITY"}, {"id": "subline", "type": "string", "role": "content", "label": "Subline", "default": "See every detail, nothing in the way."}, {"id": "shape", "type": "enum", "role": "style", "label": "Glass shape", "default": "lens", "options": [{"value": "lens", "label": "Lens"}, {"value": "ring", "label": "Ring"}]}, {"id": "glass_tint", "type": "color", "role": "style", "label": "Glass tint", "default": "#cfe9ff"}, {"id": "type_color", "type": "color", "role": "style", "label": "Headline color", "default": "#f4efe4"}, {"id": "background", "type": "color", "role": "style", "label": "Backdrop", "default": "#0b0b0c"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the glass is drawn at, then scaled up. Refraction edges are soft; 0.5 looks the same as 1 in the stills.", "default": 0.5, "min": 0.25, "max": 1, "step": 0.05}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else V[d.id] = typeof raw === "string" ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var cw = Math.max(2, Math.round(W * V.resolution));
            var ch = Math.max(2, Math.round(H * V.resolution));
            root.style.background = V.background;
            canvas.width = cw;
            canvas.height = ch;
            var sub = document.getElementById("ghr-sub");
            sub.textContent = V.subline;
            var BG = rgb(V.background), TINT = rgb(V.glass_tint), RING = V.shape === "ring" ? 1 : 0;
            var A = cw / ch;
            // the glass scales down a little on narrow frames so it keeps its place in front of the headline
            var KP = A >= 16 / 9 ? 1 : Math.max(0.55, A / (16 / 9) * 1.5);
            // The headline is drawn into a texture at the frame's aspect (the glass can only refract what is in the scene).
            var headCanvas = document.createElement("canvas");
            var HW = 2048, HH = Math.round(HW / A);
            if (HH > 2048) { HH = 2048; HW = Math.round(HH * A); }
            headCanvas.width = HW; headCanvas.height = HH;
            function drawHead() {
              var g = headCanvas.getContext("2d");
              g.fillStyle = V.background; g.fillRect(0, 0, HW, HH);
              var text = String(V.headline).toUpperCase(), size = HH * 0.9;
              g.font = '900 ' + size + 'px "Inter", system-ui, sans-serif';
              while (g.measureText(text).width > HW * 0.81 && size > 40) { size -= 10; g.font = '900 ' + size + 'px "Inter", system-ui, sans-serif'; }
              g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = V.type_color;
              g.fillText(text, HW / 2, HH * 0.47);
            }
            drawHead();
            var upload = null;
            if (document.fonts && document.fonts.load) {
              document.fonts.load("900 100px Inter").then(function () { drawHead(); if (upload) upload(); if (paint) paint(tl.time()); }, function () {});
            }
            function easeOut(x) { return 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3); }
            // Euler XYZ rotation (R = Rx * Ry * Rz) as a column-major mat3
            function rot(rx, ry, rz) {
              var cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry), cz = Math.cos(rz), sz = Math.sin(rz);
              return new Float32Array([cy * cz, cx * sz + sx * sy * cz, sx * sz - cx * sy * cz, -cy * sz, cx * cz - sx * sy * sz, sx * cz + cx * sy * sz, sy, -sx * cy, cx * cy]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 aPos;",
              "out vec2 v_uv;",
              "void main() { v_uv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5); gl_Position = vec4(aPos, 0.0, 1.0); }"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;
out vec4 outColor;
in vec2 v_uv;
uniform sampler2D uHead;
uniform float uAspect;
uniform vec3 uC;
uniform float uS;
uniform mat3 uR;
uniform float uRing;
uniform vec3 uTint;
uniform vec3 uBg;

const float TAN_HALF_FOV = 0.2679491924; // tan(15 degrees): the camera's 30 degree field of view
const vec3 CAM = vec3(0.0, 0.0, 10.0);
const float PLANE_Z = -2.0;
const float IOR = 1.3;
const float DISPERSION = 0.6;

// Object space: a lens (a flattened sphere) or a ring (a torus whose hole runs along z).
float sdf(vec3 p) {
  if (uRing > 0.5) {
    vec2 q = vec2(length(p.xy) - 1.25, p.z);
    return length(q) - 0.46;
  }
  vec3 r = vec3(1.6, 1.6, 0.672);
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-4);
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(
    sdf(p + e.xyy) - sdf(p - e.xyy),
    sdf(p + e.yxy) - sdf(p - e.yxy),
    sdf(p + e.yyx) - sdf(p - e.yyx)));
}

// What the backdrop plane (the headline) shows along a world ray.
vec3 backdrop(vec3 ro, vec3 rd) {
  float t = (PLANE_Z - ro.z) / min(rd.z, -1e-4);
  vec3 p = ro + rd * t;
  float halfH = TAN_HALF_FOV * (CAM.z - PLANE_Z);
  vec2 uv = vec2(p.x / (2.0 * halfH * uAspect) + 0.5, 0.5 - p.y / (2.0 * halfH));
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return uBg;
  return texture(uHead, uv).rgb;
}

// A soft rectangular light seen from the object, like the studio softboxes of the original scene.
float softbox(vec3 dir, vec3 center, vec2 size, float level) {
  vec3 n = normalize(-center);
  float dn = dot(dir, n);
  if (dn <= 0.0) return 0.0;
  float t = dot(center, n) / dn;
  vec3 q = dir * t - center;
  vec3 u = normalize(cross(vec3(0.0, 1.0, 0.0), n));
  vec3 v = cross(n, u);
  vec2 d = abs(vec2(dot(q, u), dot(q, v))) - size * 0.5;
  float m = 1.0 - smoothstep(-0.05, 0.35, max(d.x, d.y));
  return m * level;
}

vec3 studio(vec3 dir) {
  float e = 0.08;
  e += softbox(dir, vec3(-1.0, 6.0, 2.0), vec2(8.0, 3.0), 2.5);
  e += softbox(dir, vec3(-7.0, 0.0, -1.0), vec2(1.2, 9.0), 4.0);
  e += softbox(dir, vec3(7.0, 0.0, -1.0), vec2(1.2, 9.0), 4.0);
  return vec3(e);
}

void main() {
  vec2 ndc = vec2(v_uv.x * 2.0 - 1.0, 1.0 - v_uv.y * 2.0);
  vec3 rd = normalize(vec3(ndc.x * TAN_HALF_FOV * uAspect, ndc.y * TAN_HALF_FOV, -1.0));
  vec3 bg = backdrop(CAM, rd);

  // to object space
  mat3 Rt = transpose(uR);
  vec3 ro = Rt * (CAM - uC) / uS;
  vec3 rdo = Rt * rd;

  // sphere-trace the surface, starting at the bounding sphere
  float b = dot(ro, rdo);
  float c = dot(ro, ro) - 1.8 * 1.8;
  float disc = b * b - c;
  if (disc < 0.0) { outColor = vec4(bg, 1.0); return; }
  float t = -b - sqrt(disc);
  bool hit = false;
  vec3 p = ro;
  for (int i = 0; i < 64; i++) {
    p = ro + rdo * t;
    float d = sdf(p);
    if (d < 0.0015) { hit = true; break; }
    t += d;
    if (t > -b + sqrt(disc)) break;
  }
  if (!hit) { outColor = vec4(bg, 1.0); return; }

  vec3 n = normalAt(p);
  float cosI = clamp(dot(-rdo, n), 0.0, 1.0);
  float F0 = pow((IOR - 1.0) / (IOR + 1.0), 2.0);
  float fres = F0 + (1.0 - F0) * pow(1.0 - cosI, 5.0);

  // refract per colour channel (dispersion), cross the glass, leave it, and read the backdrop
  float spread = (IOR - 1.0) * 0.025 * DISPERSION;
  vec3 iors = vec3(IOR - spread, IOR, IOR + spread);
  vec3 trans = vec3(0.0);
  float pathLen = 0.0;
  for (int ch = 0; ch < 3; ch++) {
    float ior = iors[ch];
    vec3 dir = refract(rdo, n, 1.0 / ior);
    if (dot(dir, dir) < 0.5) dir = reflect(rdo, n);
    vec3 q = p - n * 0.01;
    for (int i = 0; i < 40; i++) {
      float d = sdf(q);
      if (d > -0.002) break;
      q += dir * max(-d * 0.9, 0.01);
    }
    vec3 n2 = normalAt(q);
    vec3 out_dir = refract(dir, -n2, ior);
    if (dot(out_dir, out_dir) < 0.5) out_dir = reflect(dir, -n2);
    float len = length(q - p) * uS;
    // back to world space
    vec3 pw = uC + uR * (q * uS);
    vec3 dw = normalize(uR * out_dir);
    trans[ch] = backdrop(pw, dw)[ch];
    pathLen += len / 3.0;
  }
  // tint: Beer-Lambert absorption toward the glass colour over the path through the glass
  vec3 absorb = pow(uTint, vec3(pathLen / 2.2));
  trans *= absorb;

  // reflections: the studio lights in the glass, plus a clear coat on top
  vec3 refl = reflect(rdo, n);
  vec3 reflW = normalize(uR * refl);
  vec3 env = studio(reflW);
  float cc = 0.04 + 0.96 * pow(1.0 - cosI, 5.0);
  vec3 color = trans * (1.0 - fres) * (1.0 - 0.04) + env * fres * 1.0 + env * cc * 0.35;
  // a key light highlight
  vec3 key = normalize(vec3(-4.0, 5.0, 6.0));
  vec3 nw = normalize(uR * n);
  vec3 h = normalize(key - rd);
  color += vec3(pow(max(dot(nw, h), 0.0), 120.0)) * 0.6;
  outColor = vec4(color, 1.0);
}
`;

            var gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var prog = gl.createProgram();
              gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.bindAttribLocation(prog, 0, "aPos");
              gl.linkProgram(prog);
              if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link failed");
              gl.useProgram(prog);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
              gl.enableVertexAttribArray(0);
              gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(prog, name); }
              var tex = gl.createTexture();
              gl.activeTexture(gl.TEXTURE0);
              gl.bindTexture(gl.TEXTURE_2D, tex);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              upload = function () { gl.activeTexture(gl.TEXTURE0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, headCanvas); };
              upload();
              gl.uniform1i(u("uHead"), 0);
              gl.uniform1f(u("uAspect"), A);
              gl.uniform1f(u("uRing"), RING);
              gl.uniform3f(u("uTint"), TINT[0], TINT[1], TINT[2]);
              gl.uniform3f(u("uBg"), BG[0], BG[1], BG[2]);
              var cLoc = u("uC"), sLoc = u("uS"), rLoc = u("uR");
              paint = function (t) {
                // Rise and settle over the first 1.8 s, then keep turning; the turn never stops.
                var rise = easeOut(t / 1.8);
                gl.uniform3f(cLoc, Math.sin(t * 0.55) * 0.35 * KP, (-3.2 * (1 - rise) + Math.sin(t * 0.9) * 0.06) * KP, 1.2);
                gl.uniform1f(sLoc, (0.62 + 0.14 * rise) * KP);
                gl.uniformMatrix3fv(rLoc, false, RING ? rot(0.5 + t * 0.22, t * 0.34, 0.2 + t * 0.08) : rot(Math.sin(t * 0.7) * 0.35, Math.sin(t * 0.5) * 0.5 + 0.2, 0));
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
              };
            } catch (err) {
              canvas.style.display = "none";
              if (window.console) console.warn(NAME + ":", err.message);
            }

            var tl = gsap.timeline({ paused: true, onUpdate: function () { if (paint) paint(tl.time()); } });
            tl.fromTo(sub, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, Math.min(1.5, DUR * 0.3));

            // The block lasts DUR seconds even when nothing is tweened at the end.
            tl.set({}, {}, DUR);
            if (paint) paint(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
