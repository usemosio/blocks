<!--
  Marker Highlight

  A highlighter-pen bar springs across one word of a sentence, like a marker stroke.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="marker-highlight"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "before", "type": "string", "role": "content", "label": "Before", "description": "Text before the highlighted word.", "default": "Made for "},
    {"id": "highlight", "type": "string", "role": "content", "label": "Highlight", "description": "The word the marker covers.", "default": "builders"},
    {"id": "after", "type": "string", "role": "content", "label": "After", "description": "Text after the highlighted word.", "default": "."},
    {"id": "marker_color", "type": "color", "role": "style", "label": "Marker color", "description": "Color of the marker bar.", "default": "#facc15"},
    {"id": "base_color", "type": "color", "role": "style", "label": "Base color", "description": "Color of the sentence.", "default": "#171717"},
    {"id": "highlighted_text_color", "type": "color", "role": "style", "label": "Highlighted text color", "description": "Color the highlighted word fades to.", "default": "#171717"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Marker Highlight</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #ffffff; font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; }
        .mh-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .mh-line { letter-spacing: -0.03em; line-height: 1.2; text-align: center; max-width: 92%; white-space: pre-wrap; }
        .mh-word { position: relative; display: inline-block; }
        .mh-bar { position: absolute; inset: 0 -0.1em; transform-origin: left center; z-index: 0; transform: scaleX(0); }
        .mh-text { position: relative; z-index: 1; }
      </style>

      <div id="root" data-composition-id="marker-highlight" data-duration="3" data-fps="30">
        <div id="mh-clip" class="mh-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <span id="mh-line" class="mh-line" role="img"><span id="mh-before"></span><span class="mh-word"><span id="mh-bar" class="mh-bar" aria-hidden="true"></span><span id="mh-hl" class="mh-text"></span></span><span id="mh-after"></span></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 3;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["marker-highlight"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var before = typeof vars.before === "string" ? vars.before : "Made for ";
            var hl = str(vars.highlight, "builders");
            var after = typeof vars.after === "string" ? vars.after : ".";
            var size = num(vars.font_size, 72, 12, 240), speed = num(vars.speed, 1, 0.25, 4);
            var baseC = str(vars.base_color, "#171717"), hiC = str(vars.highlighted_text_color, "#171717");
            function rgb(c) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c.trim());
              if (!m) return [23, 23, 23];
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
            }
            var c0 = rgb(baseC), c1 = rgb(hiC);
            var line = document.getElementById("mh-line"), hlEl = document.getElementById("mh-hl"), bar = document.getElementById("mh-bar");
            document.getElementById("mh-before").textContent = before;
            hlEl.textContent = hl;
            document.getElementById("mh-after").textContent = after;
            bar.style.background = str(vars.marker_color, "#facc15");
            line.style.color = baseC;
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            line.setAttribute("aria-label", before + hl + after);
            fit(line, size, 0.9); onFonts(function () { fit(line, size, 0.9); });
            var cfg = { damping: 14, stiffness: 100, mass: 1 };
            start(function (raw) {
              var f = raw * speed;
              var s = spring(f - 15, cfg);
              bar.style.transform = "scaleX(" + s + ")";
              var p = ip(s, 0.5, 0.8, 0, 1);
              var c = c0.map(function (v, i) { return Math.round(v + (c1[i] - v) * p); });
              hlEl.style.color = "rgb(" + c.join(",") + ")";
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
