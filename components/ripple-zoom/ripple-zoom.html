<html
  lang="en"
  data-composition-id="ripple-zoom"
  data-composition-duration="2.9333"
  data-composition-variables='[
  {
    "id": "intensity",
    "type": "number",
    "role": "style",
    "label": "Intensity",
    "description": "How strongly the rings wobble.",
    "default": 0.5,
    "min": 0,
    "max": 1,
    "step": 0.05
  },
  {
    "id": "softness",
    "type": "number",
    "role": "style",
    "label": "Softness",
    "description": "Softness of the ring edges.",
    "default": 0.5,
    "min": 0,
    "max": 1,
    "step": 0.05
  },
  {
    "id": "noise",
    "type": "number",
    "role": "style",
    "label": "Grain",
    "description": "Amount of grain in the field.",
    "default": 0.5,
    "min": 0,
    "max": 1,
    "step": 0.05
  },
  {
    "id": "zoom",
    "type": "number",
    "role": "motion",
    "label": "Zoom",
    "description": "Final zoom of the ring pattern.",
    "default": 4,
    "min": 1,
    "max": 8,
    "step": 0.1
  },
  {
    "id": "color_back",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Backdrop color of the field.",
    "default": "#141318"
  },
  {
    "id": "colors",
    "type": "string",
    "role": "style",
    "label": "Colors",
    "description": "Comma-separated hex colors the rings move through.",
    "default": "#3a3a52,#4a4a68,#8f88ae"
  },
  {
    "id": "speed",
    "type": "number",
    "role": "motion",
    "label": "Speed",
    "description": "Multiplier for the rings’ own drift.",
    "default": 1,
    "min": 0,
    "max": 4,
    "step": 0.1
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ripple Zoom</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .rpz-stage { position: absolute; inset: 0; }
        .rpz-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .rpz-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .rpz-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .rpz-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .rpz-pa { background: #141318; }
        .rpz-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .rpz-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .rpz-field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; }
        .rpz-pa { z-index: 1; } .rpz-pb { z-index: 3; }

      </style>

      <div id="root" data-composition-id="ripple-zoom" data-duration="2.9333" data-fps="30">
        <div id="rpz-clip" class="rpz-stage clip" data-start="0" data-duration="2.9333" data-track-index="0">
          <div id="rpz-a" class="rpz-panel rpz-pa"><div class="rpz-in"><span>Scene A</span><i class="rpz-bar"></i></div></div>
          <div id="rpz-b" class="rpz-panel rpz-pb"><div class="rpz-in"><span>Scene B</span><i class="rpz-bar"></i></div></div>
          <canvas id="rpz-field" class="rpz-field"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

function hex(c, f) {
  c = String(c || "").trim().replace("#", "");
  if (c.length === 3) c = c.split("").map(function (x) { return x + x; }).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(c)) c = f || "000000";
  var n = parseInt(c, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function palette(v, fallback) {
  var list = String(v || fallback).split(",").map(function (s) { return hex(s, "808080"); });
  return list.length ? list : [hex(fallback)];
}
function hash2(x, y, s) {
  var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  var sum = 0, amp = 0.5, tot = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x, y, s + i * 17);
    tot += amp; x = x * 2.03 + 11.3; y = y * 2.03 - 7.1; amp *= 0.5;
  }
  return sum / tot;
}
function mixc(o, a, b, t) {
  o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t;
}
// ramp through a list of colours with t in 0..1
function ramp(o, list, t) {
  t = clamp01(t) * (list.length - 1);
  var i = Math.min(list.length - 2, Math.floor(t));
  if (list.length === 1) { o[0] = list[0][0]; o[1] = list[0][1]; o[2] = list[0][2]; return; }
  var f = t - i; f = f * f * (3 - 2 * f);
  mixc(o, list[i], list[i + 1], f);
}
// Low-resolution 2D canvas filled per pixel; fn(u, v, out) gets centred coordinates (v spans -0.5..0.5).
function makeField(canvas, cell) {
  var W = Math.max(8, Math.round(root.clientWidth / cell)), H = Math.max(8, Math.round(root.clientHeight / cell));
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var img = ctx.createImageData(W, H);
  var out = [0, 0, 0];
  return {
    W: W, H: H,
    paint: function (fn) {
      var d = img.data, i = 0;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          fn((x + 0.5 - W / 2) / H, (y + 0.5 - H / 2) / H, out, x, y);
          d[i++] = out[0]; d[i++] = out[1]; d[i++] = out[2]; d[i++] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
  };
}

            var D = 2.9333;

function grainValue(shape, x, y, t, intensity) {
  var w, r = Math.sqrt(x * x + y * y), wob = (fbm(x * 1.7 + t * 0.1, y * 1.7 - t * 0.08, 3, 3) - 0.5) * intensity * 2.2;
  if (shape === "ripple") w = 0.5 + 0.5 * Math.sin(r * 7 - t * 1.6 + wob * 3);
  else if (shape === "dots") {
    var gx = x * 5, gy = y * 5, fx = gx - Math.floor(gx) - 0.5, fy = gy - Math.floor(gy) - 0.5;
    w = hash2(Math.floor(gx), Math.floor(gy), 3) * 0.55 + (1 - Math.min(1, Math.sqrt(fx * fx + fy * fy) * 2)) * 0.45;
  } else if (shape === "truchet") {
    var tx = x * 4, ty = y * 4, ix = Math.floor(tx), iy = Math.floor(ty), px = tx - ix, py = ty - iy;
    if (hash2(ix, iy, 9) > 0.5) px = 1 - px;
    var d1 = Math.sqrt(px * px + py * py), d2 = Math.sqrt((1 - px) * (1 - px) + (1 - py) * (1 - py));
    w = 0.5 + 0.5 * Math.sin(Math.min(Math.abs(d1 - 0.5), Math.abs(d2 - 0.5)) * 18 - t * 1.2);
  } else if (shape === "corners") {
    var ax = Math.abs(x) - 0.3, ay = Math.abs(y) - 0.5;
    w = 0.5 + 0.5 * Math.sin(Math.sqrt(ax * ax + ay * ay) * 8 - t * 1.4 + wob * 3);
  } else if (shape === "blob") {
    var s = 0;
    for (var i = 0; i < 4; i++) {
      var bx = Math.sin(t * (0.5 + i * 0.17) + i * 1.9) * 0.3, by = Math.cos(t * (0.4 + i * 0.13) + i * 2.7) * 0.4;
      var dx = x - bx, dy = y - by;
      s += Math.exp(-(dx * dx + dy * dy) * 24);
    }
    w = clamp01(s * 0.85 + wob * 0.6);
  } else if (shape === "sphere") {
    var rr = r * 1.7;
    if (rr >= 1) w = 0.12 + 0.2 * wob; else { var z = Math.sqrt(1 - rr * rr); w = clamp01(0.15 + 0.9 * (x * 1.7 * Math.cos(t * 0.5) + y * 1.7 * Math.sin(t * 0.5) + z * 0.6)); }
  } else w = 0.5 + 0.5 * Math.sin(y * 5.5 + Math.sin(x * 3.6 + t * 0.8) * (0.8 + intensity * 2.4) + t * 0.6 + wob * 2);
  return w;
}
function grainPaint(cv, shape, scale, t, intensity, softness, noiseAmt, pal, back, offY, frameNo) {
  var k = 1 + (1 - softness) * 3, list = [back].concat(pal), tmp = [0, 0, 0];
  cv.paint(function (u, v, o, x, y) {
    var w = grainValue(shape, u / scale, (v + offY) / scale, t, intensity);
    ramp(o, list, clamp01((w - 0.5) * k + 0.5));
    var g = (hash2(x, y, frameNo) - 0.5) * noiseAmt * 110;
    o[0] += g; o[1] += g; o[2] += g;
  });
}

var intensity = num(vars.intensity, 0.5, 0, 1), soft = num(vars.softness, 0.5, 0, 1), noiseAmt = num(vars.noise, 0.5, 0, 1);
var zoom = num(vars.zoom, 4, 1, 8), speed = num(vars.speed, 1, 0, 4);
var back = hex(vars.color_back, "141318"), pal = palette(vars.colors, "#3a3a52,#4a4a68,#8f88ae");
var A = document.getElementById("rpz-a"), B = document.getElementById("rpz-b"), canvas = document.getElementById("rpz-field");
var cv = makeField(canvas, 4);
function frame(p) {
  var sc = interp(p, [0.32, 1], [0.2, zoom], bez(0.7, 0, 0.3, 1));
  grainPaint(cv, "ripple", sc, p * D * speed, intensity, soft, noiseAmt, pal, back, 0, Math.floor(p * D * 30));
  canvas.style.opacity = interp(p, [0.08, 0.32], [0, 1], inOutEase);
  A.style.opacity = interp(p, [0.35, 0.55], [1, 0], inOutEase);
  A.style.scale = interp(p, [0.3, 0.62], [1, 1.6], inCubic);
  B.style.opacity = interp(p, [0.45, 0.62], [0, 1]);
  B.style.scale = interp(p, [0.42, 0.97], [0.2, 1], bez(0.33, 1, 0.68, 1));
  B.style.filter = "blur(" + interp(p, [0.42, 0.8], [8, 0]) + "px)";
}

            drive("ripple-zoom", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
