<!doctype html>
<!--
  Scroll Menu Phone

  A generic phone frame with a menu list. The list scrolls with momentum, a touch dot taps an item, and the item expands to show its price and a Tambah button, which the dot then taps and a cart count appears. Names, descriptions and prices come from one variable.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="scroll-menu-phone"
  data-composition-duration="6"
  data-composition-variables='[
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Shop name",
    "description": "Header of the phone screen.",
    "default": "Warung Sambal Rina"
  },
  {
    "id": "caption",
    "type": "string",
    "role": "content",
    "label": "Caption",
    "description": "Line beside or above the phone. Empty hides it.",
    "default": "Pesan dari meja, tanpa antre"
  },
  {
    "id": "items",
    "type": "string",
    "role": "content",
    "label": "Menu items",
    "description": "One per line, Name|Description|Price. At least 5 lines work best.",
    "default": "Nasi ayam geprek|Sambal bawang, lalapan|Rp22.000\nNasi ayam bakar|Bumbu kecap, sambal terasi|Rp25.000\nMie goreng jawa|Telur, sayur, kerupuk|Rp18.000\nSoto ayam|Kuah bening, soun|Rp20.000\nGado-gado|Bumbu kacang, lontong|Rp17.000\nTempe mendoan|5 potong, sambal kecap|Rp10.000\nEs teh manis|Gelas besar|Rp5.000\nEs jeruk peras|Segar, tanpa pengawet|Rp8.000\nKopi tubruk|Gula aren|Rp7.000"
  },
  {
    "id": "tap_item",
    "type": "number",
    "role": "content",
    "label": "Tapped item",
    "description": "Which item (1 = first) is tapped and expanded.",
    "default": 6,
    "min": 1,
    "max": 12,
    "step": 1
  },
  {
    "id": "button",
    "type": "string",
    "role": "content",
    "label": "Button label",
    "description": "Text on the button.",
    "default": "Tambah"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Main colour",
    "description": "Button and price: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Item names and caption.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Descriptions.",
    "default": "#737373"
  },
  {
    "id": "phone_color",
    "type": "color",
    "role": "style",
    "label": "Phone colour",
    "description": "Bezel.",
    "default": "#0a0a0a"
  },
  {
    "id": "screen_color",
    "type": "color",
    "role": "style",
    "label": "Screen colour",
    "description": "Phone screen.",
    "default": "#ffffff"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Google Fonts family name; Geist is loaded, others only if the host loads them.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Scroll Menu Phone</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          background: var(--smp-bg); color: var(--smp-text); font-family: var(--smp-font);
        }
        #root * { box-sizing: border-box; }
        .smp-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .smp-cap { position: absolute; font-weight: 600; letter-spacing: -0.04em; }
        .smp-phone { position: absolute; background: var(--smp-phone); box-shadow: 0 calc(var(--u) * 30) calc(var(--u) * 70) rgba(10,10,10,0.16); }
        .smp-screen { position: absolute; overflow: hidden; background: var(--smp-screen); color: var(--smp-text); }
        .smp-notch { position: absolute; left: 50%; background: var(--smp-phone); z-index: 5; }
        .smp-head { position: absolute; left: 0; right: 0; top: 0; z-index: 3; background: var(--smp-screen); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(10,10,10,0.08); }
        .smp-head b { font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
        .smp-cart { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--smp-text); color: var(--smp-screen); font-weight: 600; font-variant-numeric: tabular-nums; }
        .smp-listbox { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
        .smp-list { position: absolute; left: 0; right: 0; top: 0; }
        .smp-row { position: relative; border-bottom: 1px solid rgba(10,10,10,0.07); overflow: hidden; }
        .smp-main { display: flex; align-items: center; }
        .smp-thumb { flex: none; display: flex; align-items: center; justify-content: center; }
        .smp-thumb svg { width: 56%; height: 56%; }
        .smp-txt { display: flex; flex-direction: column; min-width: 0; }
        .smp-name { font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .smp-desc { color: var(--smp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .smp-exp { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: space-between; }
        .smp-price { font-weight: 600; letter-spacing: -0.03em; color: var(--smp-main); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .smp-btn { background: var(--smp-main); color: #fff; font-weight: 600; text-align: center; white-space: nowrap; }
        .smp-touch { position: absolute; z-index: 9; left: 0; top: 0; border-radius: 50%; background: rgba(10,10,10,0.22); border: 2px solid rgba(10,10,10,0.5); }
        .smp-ripple { position: absolute; z-index: 8; left: 0; top: 0; border-radius: 50%; border: 3px solid var(--smp-main); opacity: 0; }

      </style>

      <div id="root" data-composition-id="scroll-menu-phone" data-duration="6" data-fps="30">
        <div id="smp-clip" class="smp-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div class="smp-cap" id="smp-cap"></div>
          <div class="smp-phone" id="smp-phone">
            <div class="smp-screen" id="smp-screen">
              <div class="smp-head" id="smp-head"><b id="smp-shop"></b><span class="smp-cart" id="smp-cart">0</span></div>
              <div class="smp-listbox" id="smp-lb"><div class="smp-list" id="smp-list"></div></div>
              <div class="smp-ripple" id="smp-rip"></div><div class="smp-touch" id="smp-touch"></div>
            </div>
            <div class="smp-notch" id="smp-notch"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function lines(v, d) { var s = typeof v === "string" && v.trim() ? v : d; return s.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ease(n, a, b) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            var PAL = [["bg", "bg_color", "#ffffff"], ["main", "main_color", "#2563eb"], ["text", "text_color", "#0a0a0a"], ["muted", "muted_color", "#737373"], ["phone", "phone_color", "#0a0a0a"], ["screen", "screen_color", "#ffffff"]];
            PAL.forEach(function (c) { root.style.setProperty("--smp-" + c[0], colr(vars[c[1]], c[2])); });
            root.style.setProperty("--smp-font", '"' + str(vars.font_family, "Geist") + '", Geist, system-ui, sans-serif');
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            var items = lines(vars.items, "").map(function (l) { var a = l.split("|"); return { n: (a[0] || "").trim(), d: (a[1] || "").trim(), p: (a[2] || "").trim() }; });
            if (items.length < 3) items = [{ n: "Nasi ayam geprek", d: "Sambal bawang", p: "Rp22.000" }, { n: "Mie goreng", d: "Telur, sayur", p: "Rp18.000" }, { n: "Soto ayam", d: "Kuah bening", p: "Rp20.000" }, { n: "Es teh manis", d: "Gelas besar", p: "Rp5.000" }];
            items = items.slice(0, 12);
            var tapI = Math.min(items.length, Math.max(1, Math.round(num(vars.tap_item, 6, 1, 12)))) - 1;
            var btnText = str(vars.button, "Tambah");
            var capText = typeof vars.caption === "string" ? vars.caption.trim() : "Pesan dari meja, tanpa antre";
            var PH = H * (PORTRAIT ? 0.76 : 0.88), PW = PH * 0.49, pu = PW / 480;
            function p(x) { return x * pu; }
            var cx = PORTRAIT ? W / 2 : W * 0.66, cy = PORTRAIT ? H * 0.56 : H * 0.5;
            var cap = document.getElementById("smp-cap"); cap.textContent = capText; if (!capText) cap.style.display = "none";
            if (PORTRAIT) { cap.style.cssText += "left:0;right:0;text-align:center;top:" + 140 * U + "px;font-size:" + 68 * U + "px;white-space:nowrap"; }
            else { cap.style.cssText += "left:" + 100 * U + "px;width:" + (W * 0.36) + "px;top:0;bottom:0;display:flex;align-items:center;font-size:" + 92 * U + "px;line-height:1.05"; }
            var phone = document.getElementById("smp-phone"), bz = p(12);
            phone.style.cssText += "left:" + (cx - PW / 2) + "px;top:" + (cy - PH / 2) + "px;width:" + PW + "px;height:" + PH + "px;border-radius:" + p(64) + "px";
            var scr = document.getElementById("smp-screen"), Sw = PW - 2 * bz, Sh = PH - 2 * bz;
            scr.style.cssText += "left:" + bz + "px;top:" + bz + "px;width:" + Sw + "px;height:" + Sh + "px;border-radius:" + p(54) + "px";
            var nt = document.getElementById("smp-notch"); nt.style.cssText += "width:" + p(110) + "px;height:" + p(30) + "px;margin-left:" + p(-55) + "px;top:" + (bz + p(10)) + "px;border-radius:" + p(16) + "px";
            var headH = p(150), head = document.getElementById("smp-head");
            head.style.height = headH + "px"; head.style.padding = p(46) + "px " + p(26) + "px 0"; head.style.fontSize = p(30) + "px";
            document.getElementById("smp-shop").textContent = str(vars.title, "Warung Sambal Rina");
            var cart = document.getElementById("smp-cart"); cart.style.cssText += "width:" + p(44) + "px;height:" + p(44) + "px;font-size:" + p(24) + "px;opacity:0";
            var lb = document.getElementById("smp-lb"); lb.style.top = headH + "px";
            var LH = Sh - headH, RH = p(128), EXP = p(112), list = document.getElementById("smp-list"), rows = [], exps = [];
            var tones = ["#e7e4dd", "#dedad2", "#ebe8e1"], shp = ['<circle cx="50" cy="50" r="38" fill="#fff" opacity=".85"/>', '<rect x="14" y="14" width="72" height="72" rx="20" fill="#fff" opacity=".85"/>', '<path d="M50 10 L90 50 L50 90 L10 50 Z" fill="#fff" opacity=".85"/>'];
            items.forEach(function (it, i) {
              var row = el("div", "smp-row", list); row.style.padding = "0 " + p(26) + "px";
              var main = el("div", "smp-main", row); main.style.height = RH + "px"; main.style.gap = p(20) + "px";
              var th = el("div", "smp-thumb", main, '<svg viewBox="0 0 100 100">' + shp[i % 3] + "</svg>"); th.style.cssText += "width:" + p(88) + "px;height:" + p(88) + "px;border-radius:" + p(22) + "px;background:" + tones[i % 3];
              var tx = el("div", "smp-txt", main, '<span class="smp-name">' + esc(it.n) + '</span><span class="smp-desc">' + esc(it.d) + "</span>");
              tx.firstChild.style.fontSize = p(30) + "px"; tx.lastChild.style.fontSize = p(22) + "px"; tx.style.gap = p(4) + "px";
              var ex = el("div", "smp-exp", row, '<span class="smp-price">' + esc(it.p) + '</span><span class="smp-btn">' + esc(btnText) + "</span>");
              ex.firstChild.style.fontSize = p(40) + "px"; var bt = ex.lastChild; bt.style.cssText += "font-size:" + p(26) + "px;width:" + p(180) + "px;line-height:" + p(60) + "px;border-radius:" + p(30) + "px";
              ex.style.opacity = 0; rows.push(row); exps.push(ex);
            });
            var rowTop = tapI * (RH + 1), total = items.length * (RH + 1) + EXP;
            var maxScroll = Math.max(0, total - LH), target = Math.min(maxScroll, Math.max(0, rowTop - LH * 0.22));
            var tchR = p(34), tx0 = Sw * 0.86, ty0 = Sh + tchR * 2;
            var rowY = headH + rowTop - target, tapX = Sw * 0.62, tapY = rowY + RH / 2;
            var btnX = Sw - p(26) - p(90), btnY = rowY + RH + EXP / 2;
            var touch = document.getElementById("smp-touch"), rip = document.getElementById("smp-rip");
            [touch, rip].forEach(function (e) { e.style.width = e.style.height = tchR * 2 + "px"; e.style.marginLeft = e.style.marginTop = -tchR + "px"; });
            gsap.set(touch, { x: tx0, y: ty0, opacity: 0 }); gsap.set(rip, { x: tapX, y: tapY, opacity: 0 });
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#smp-phone", { y: 120 * U, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.05);
            tl.fromTo("#smp-cap", { opacity: 0, y: 20 * U }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
            tl.to(list, { y: -target * 0.7, duration: 1.3, ease: "power4.out" }, 0.9);
            tl.to(list, { y: -target, duration: 0.9, ease: "power3.out" }, 2.1);
            tl.to(touch, { opacity: 1, duration: 0.2 }, 2.7);
            tl.to(touch, { x: tapX, y: tapY, duration: 0.6, ease: "power3.out" }, 2.7);
            tl.to(touch, { scale: 0.78, duration: 0.1, ease: "power2.in" }, 3.4);
            tl.to(touch, { scale: 1, duration: 0.2, ease: "power2.out" }, 3.5);
            tl.fromTo(rip, { scale: 0.6, opacity: 0.8 }, { scale: 2, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 3.4);
            tl.to(rows[tapI], { backgroundColor: "rgba(10,10,10,0.05)", duration: 0.2 }, 3.45);
            tl.to(exps[tapI], { height: EXP, duration: 0.5, ease: "power3.out" }, 3.6);
            tl.to(exps[tapI], { opacity: 1, duration: 0.35, ease: "power2.out" }, 3.75);
            tl.to(touch, { x: btnX, y: btnY, duration: 0.55, ease: "power2.inOut" }, 4.2);
            tl.to(touch, { scale: 0.78, duration: 0.1, ease: "power2.in" }, 4.85);
            tl.to(touch, { scale: 1, duration: 0.2, ease: "power2.out" }, 4.95);
            tl.fromTo(rip, { x: btnX, y: btnY, scale: 0.6, opacity: 0.8 }, { scale: 1.8, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.85);
            tl.to(exps[tapI].lastChild, { scale: 0.94, duration: 0.1, ease: "power2.in" }, 4.85);
            tl.to(exps[tapI].lastChild, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 4.95);
            tl.fromTo(cart, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 5.0);
            tl.to(touch, { opacity: 0, duration: 0.3 }, 5.3);
            cart.textContent = "1";

            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scroll-menu-phone"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
