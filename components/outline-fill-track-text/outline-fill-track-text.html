<!--
  Outline Fill Track Text

  A rising lead word gives way to an outlined value that fills as one continuous track moves left.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="outline-fill-track-text"
  data-composition-duration="2.667"
  data-composition-variables='[
    { "id": "lead_text", "type": "string", "role": "content", "label": "Lead text", "description": "Word that rises first.", "default": "Keep" },
    { "id": "value_text", "type": "string", "role": "content", "label": "Value text", "description": "Large value that is outlined, then fills.", "default": "1000000000%" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Type size in pixels at a 1920 px wide frame; it scales with the frame.", "default": 368, "min": 120, "max": 520, "step": 1, "unit": "px" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}] },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#f4f3f6" },
    { "id": "outline_color", "type": "color", "role": "style", "label": "Outline color", "description": "Color of the outline before the fill.", "default": "#e6e2ed" },
    { "id": "outline_width", "type": "number", "role": "style", "label": "Outline width", "description": "Outline thickness in pixels at 1920 px wide.", "default": 3, "min": 0, "max": 12, "step": 0.5, "unit": "px" },
    { "id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Color of the field behind the text.", "default": "#030012" },
    { "id": "glow_color", "type": "color", "role": "style", "label": "Glow color", "description": "Color of the soft glow the lead word rises through.", "default": "#64109a" },
    { "id": "enter_offset", "type": "number", "role": "motion", "label": "Enter offset", "description": "How far below its place the lead word starts.", "default": 240, "min": 0, "max": 420, "step": 1, "unit": "px" },
    { "id": "anchor_offset_x", "type": "number", "role": "motion", "label": "Anchor offset", "description": "Horizontal offset of the lead word from the center.", "default": -84, "min": -400, "max": 400, "step": 1, "unit": "px" },
    { "id": "track_distance", "type": "number", "role": "motion", "label": "Track distance", "description": "Distance the track moves left. 0 measures it from the text.", "default": 0, "min": 0, "max": 1800, "step": 1, "unit": "px" },
    { "id": "word_gap", "type": "number", "role": "style", "label": "Word gap", "description": "Gap between the lead word and the value.", "default": 220, "min": 0, "max": 500, "step": 1, "unit": "px" },
    { "id": "end_padding", "type": "number", "role": "motion", "label": "End padding", "description": "Space kept to the right of the value at the end.", "default": 96, "min": 0, "max": 320, "step": 1, "unit": "px" },
    { "id": "fill_duration", "type": "number", "role": "motion", "label": "Fill duration", "description": "Frames the fill takes to sweep across (30 fps).", "default": 38, "min": 8, "max": 45, "step": 1, "unit": "frames" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Outline Fill Track Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #f4f3f6);
          background: var(--bg, #030012);
          font-family: Arial, Helvetica, sans-serif;
          pointer-events: none;
        }
        .oft-glow { position: absolute; inset: 0; pointer-events: none; }
        .oft-track { position: absolute; top: 50%; }
        .oft-text { display: block; line-height: 0.86; white-space: nowrap; }
        .oft-lead { position: absolute; top: 0; left: 0; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
        .oft-value { position: absolute; top: 0; visibility: hidden; }
        .oft-outline { color: transparent; paint-order: stroke fill; }
        .oft-fill { position: absolute; inset: 0; }
        .oft-field { position: absolute; left: 0; pointer-events: none; }
      </style>

      <div id="root" data-composition-id="outline-fill-track-text" data-duration="2.667" data-fps="30">
        <div id="oft-clip" class="oft-stage clip" data-start="0" data-duration="2.667" data-track-index="0">
          <div id="oft-glow" class="oft-glow"></div>
          <div id="oft-track" class="oft-track">
            <div id="oft-lead" class="oft-text oft-lead"></div>
            <div id="oft-value" class="oft-value">
              <span id="oft-outline" class="oft-text oft-outline"></span>
              <span id="oft-fill" class="oft-text oft-fill"></span>
            </div>
            <div id="oft-field" class="oft-field"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("oft-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2.667");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["outline-fill-track-text"] = tl;
            }
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            var lead = str(vars.lead_text, "Keep");
            var value = str(vars.value_text, "1000000000%");
            var weight = pick(vars.font_weight, ["400", "600", "700", "900"], "700");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var bgColor = str(vars.background_color, "#030012");
            root.style.setProperty("--bg", bgColor);
            var glowColor = str(vars.glow_color, "#64109a");
            var outlineColor = str(vars.outline_color, "#e6e2ed");
            // Design units are px at a 1920 px wide frame.
            var u = root.clientWidth / 1920;
            var size = Math.max(1, num(vars.font_size, 368, 120, 520)) * u;
            var gap = num(vars.word_gap, 220, 0, 500) * u;
            var endPad = num(vars.end_padding, 96, 0, 320) * u;
            var anchorX = num(vars.anchor_offset_x, -84, -400, 400) * u;
            var enterOffset = num(vars.enter_offset, 240, 0, 420) * u;
            var fillDuration = Math.max(1, num(vars.fill_duration, 38, 8, 45));
            var trackOverride = num(vars.track_distance, 0, 0, 1800) * u;
            var strokeW = num(vars.outline_width, 3, 0, 12) * u;
            var track = document.getElementById("oft-track");
            var leadEl = document.getElementById("oft-lead");
            var valueBox = document.getElementById("oft-value");
            var outline = document.getElementById("oft-outline");
            var fill = document.getElementById("oft-fill");
            var glow = document.getElementById("oft-glow");
            var field = document.getElementById("oft-field");
            [leadEl, outline, fill].forEach(function (el) { el.style.fontSize = size + "px"; el.style.fontWeight = weight; });
            leadEl.textContent = lead;
            outline.textContent = value;
            fill.textContent = value;
            outline.style.webkitTextStroke = strokeW + "px " + outlineColor;
            function measure(s) {
              var ctx = document.createElement("canvas").getContext("2d");
              ctx.font = weight + " " + size + "px Arial";
              return ctx.measureText(s).width;
            }
            var leadW = measure(lead), valueW = measure(value);
            var valueOffset = trackOverride > 0 ? trackOverride : leadW / 2 + gap + valueW / 2;
            var anchor = root.clientWidth / 2 + anchorX;
            var overflow = Math.max(0, anchor + valueW / 2 - (root.clientWidth - endPad));
            var travel = valueOffset + overflow;
            track.style.left = "calc(50% + " + anchorX + "px)";
            valueBox.style.left = valueOffset + "px";
            valueBox.style.transform = "translate3d(-50%, -50%, 0)";
            glow.style.background = "radial-gradient(ellipse 118% 66% at 50% -12%, " + glowColor + " 0%, " + glowColor + " 14%, transparent 76%)";
            glow.style.filter = "blur(" + size * 0.15 + "px)";
            field.style.width = size * 2.8 + "px";
            field.style.height = size * 0.72 + "px";
            field.style.background = "radial-gradient(ellipse at center, " + bgColor + " 0%, " + bgColor + " 18%, transparent 74%)";
            field.style.filter = "blur(" + size * 0.07 + "px)";

            var ENTER_END = 16, TRACK_START = 16, TRACK_END = 72, FILL_START = 34, PREFILL = 10;
            var enterEase = bz("enter", 0.16, 0.84, 0.24, 1);
            var trackEase = bz("track", 0.42, 0, 0.58, 1);
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var enter = ip(f, 0, ENTER_END, 0, 1, enterEase);
              var tp = ip(f, TRACK_START, TRACK_END, 0, 1, trackEase);
              var fp = ip(f, FILL_START - PREFILL, FILL_START + fillDuration, 0, 1);
              var edge = enter * 112 - 8;
              var solid = Math.max(0, Math.min(100, edge - 10));
              var fade = Math.max(0, Math.min(100, edge + 10));
              var mask = "linear-gradient(180deg, #000 0%, #000 " + solid + "%, transparent " + fade + "%, transparent 100%)";
              var go = enter < 0.18 ? 0.92 + (1 - 0.92) * enter / 0.18 : enter < 0.72 ? 1 + (0.52 - 1) * (enter - 0.18) / 0.54 : 0.52 * (1 - (enter - 0.72) / 0.28);
              track.style.transform = "translate3d(" + -travel * tp + "px, -50%, 0)";
              leadEl.style.webkitMaskImage = leadEl.style.maskImage = mask;
              leadEl.style.transform = "translate3d(-50%, calc(-50% + " + enterOffset * (1 - enter) + "px), 0)";
              valueBox.style.visibility = f < FILL_START ? "hidden" : "visible";
              fill.style.clipPath = "inset(0 " + (100 - fp * 100) + "% 0 0)";
              glow.style.opacity = go;
              field.style.opacity = go;
              field.style.top = ip(enter, 0, 1, -42 * u, -210 * u) + "px";
              field.style.transform = "translate3d(-50%, -50%, 0)";
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
