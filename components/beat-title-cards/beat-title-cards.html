<!doctype html>
<!--
  Beat Title Cards

  Kinetic title cards that cut on a beat. Every beat swaps the word with a crisp snap scale, every few beats a card is inverted for emphasis, and the last word stays on screen. The words cycle from one variable and the cut rate follows the bpm variable, so it can be laid on music.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="beat-title-cards"
  data-composition-duration="5"
  data-composition-variables='[
  {
    "id": "words",
    "type": "string",
    "role": "content",
    "label": "Words",
    "description": "Words separated by | or new lines; they cycle, one per beat. Short words work best.",
    "default": "Segar|Murah|Cepat|Sampai|Rumahmu"
  },
  {
    "id": "bpm",
    "type": "number",
    "role": "motion",
    "label": "Beats per minute",
    "description": "How fast the cards cut. 120 is one cut every half second.",
    "default": 120,
    "min": 60,
    "max": 200,
    "step": 1,
    "unit": "bpm"
  },
  {
    "id": "invert_every",
    "type": "number",
    "role": "style",
    "label": "Invert every",
    "description": "Every Nth card is inverted. 0 turns it off.",
    "default": 4,
    "min": 0,
    "max": 8,
    "step": 1
  },
  {
    "id": "last_word",
    "type": "string",
    "role": "content",
    "label": "Last word",
    "description": "Optional word that replaces the final beat, e.g. a shop name. Empty keeps the cycle.",
    "default": "Dapur Rina"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Card background.",
    "default": "#ffffff"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Main colour",
    "description": "The final word and the current beat tick: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Words and inverted card background.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Counter and upcoming ticks.",
    "default": "#a3a3a3"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Google Fonts family name; Geist is loaded, others only if the host loads them.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Beat Title Cards</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          background: var(--btc-bg); color: var(--btc-text); font-family: var(--btc-font);
        }
        #root * { box-sizing: border-box; }
        .btc-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .btc-card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; visibility: hidden; }
        .btc-word { display: block; font-weight: 700; letter-spacing: -0.055em; line-height: 1; white-space: nowrap; transform-origin: 50% 55%; }
        .btc-hud { position: absolute; left: 0; right: 0; bottom: 0; }
        .btc-ticks { position: absolute; display: flex; gap: calc(var(--u) * 10); left: 50%; transform: translateX(-50%); }
        .btc-tick { height: calc(var(--u) * 8); width: calc(var(--u) * 38); border-radius: calc(var(--u) * 4); background: var(--btc-muted); opacity: 0.55; }
        .btc-count { position: absolute; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: var(--btc-muted); }

      </style>

      <div id="root" data-composition-id="beat-title-cards" data-duration="5" data-fps="30">
        <div id="btc-clip" class="btc-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <div id="btc-cards"></div>
          <div class="btc-count" id="btc-count"></div><div class="btc-ticks" id="btc-ticks"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function lines(v, d) { var s = typeof v === "string" && v.trim() ? v : d; return s.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ease(n, a, b) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            var PAL = [["bg", "bg_color", "#ffffff"], ["main", "main_color", "#2563eb"], ["text", "text_color", "#0a0a0a"], ["muted", "muted_color", "#a3a3a3"]];
            PAL.forEach(function (c) { root.style.setProperty("--btc-" + c[0], colr(vars[c[1]], c[2])); });
            root.style.setProperty("--btc-font", '"' + str(vars.font_family, "Geist") + '", Geist, system-ui, sans-serif');
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            var raw = typeof vars.words === "string" && vars.words.trim() ? vars.words : "Segar|Murah|Cepat|Sampai|Rumahmu";
            var words = raw.split(/[|\n]+/).map(function (w) { return w.trim(); }).filter(Boolean);
            if (!words.length) words = ["Segar", "Murah", "Cepat"];
            var bpm = num(vars.bpm, 120, 60, 200), beat = 60 / bpm, every = Math.round(num(vars.invert_every, 4, 0, 8));
            var total = parseFloat(root.dataset.duration || "5"), t0 = 0.1, nb = Math.max(2, Math.floor((total - t0) / beat));
            var lastW = typeof vars.last_word === "string" ? vars.last_word.trim() : "Dapur Rina";
            var cards = document.getElementById("btc-cards"), ticks = document.getElementById("btc-ticks"), count = document.getElementById("btc-count");
            var pad = (PORTRAIT ? 60 : 40) * U;
            count.style.left = pad + "px"; count.style.top = pad + "px"; count.style.fontSize = 30 * U + "px";
            ticks.style.bottom = pad * 1.2 + "px";
            var tl = gsap.timeline({ paused: true }), tickEls = [];
            for (var i = 0; i < nb; i++) { var tk = el("span", "btc-tick", ticks); tickEls.push(tk); }
            function digits(n) { return (n < 10 ? "0" : "") + n; }
            var cur = { i: -1 };
            for (var b = 0; b < nb; b++) {
              (function (b) {
                var last = b === nb - 1, w = last && lastW ? lastW : words[b % words.length], inv = every > 0 && !last && (b + 1) % every === 0;
                var card = el("div", "btc-card", cards); card.style.background = inv ? "var(--btc-text)" : "var(--btc-bg)";
                var wd = el("span", "btc-word", card, esc(w));
                wd.style.fontSize = Math.min((PORTRAIT ? 330 : 360) * U, W * (PORTRAIT ? 0.86 : 0.8) / Math.max(2, w.length * 0.58)) + "px";
                wd.style.color = last ? "var(--btc-main)" : inv ? "var(--btc-bg)" : "var(--btc-text)";
                var t = t0 + b * beat, end = last ? total + 1 : t0 + (b + 1) * beat;
                tl.set(card, { visibility: "visible" }, t); if (!last) tl.set(card, { visibility: "hidden" }, end);
                tl.fromTo(wd, { scale: last ? 1.3 : 1.14 }, { scale: 1, duration: last ? 0.35 : Math.min(0.22, beat * 0.6), ease: "power4.out", immediateRender: false }, t);
                tl.call(function () { count.textContent = digits(b + 1) + " / " + digits(nb); count.style.color = inv ? "var(--btc-bg)" : "var(--btc-muted)"; tickEls.forEach(function (e, k) { e.style.background = k === b ? "var(--btc-main)" : k < b ? "var(--btc-text)" : "var(--btc-muted)"; e.style.opacity = k <= b ? 1 : 0.55; }); }, null, t);
                if (inv) tl.call(function () { tickEls.forEach(function (e, k) { if (k < b) e.style.background = "var(--btc-bg)"; }); }, null, t + 0.001);
              })(b);
            }
            tickEls.forEach(function (e) { ticks.appendChild(e); }); ticks.style.zIndex = 4; count.style.zIndex = 4;

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["beat-title-cards"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
