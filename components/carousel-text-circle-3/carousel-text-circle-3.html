  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/carousel-text-circle-3/carousel-text-circle-3.html

  WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the
  specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (a 16:9 host shows the original 3840×2160 stage scaled
  to fit; a tall host gets a centred stage of the same scale), the twelve bundled photos are replaced by drawn cards (gradient
  panel, line glyph, title) whose titles and colours are variables, with an optional `images` variable
