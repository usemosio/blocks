<!doctype html>
<!--
  System Notification

  A frosted-glass notification banner with an app icon, app name, title and message slides in from the edge, holds, and slides out.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/macos-notification/macos-notification.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a block that showed a real product's interface (the real operating system's notification, with a real app name and logo on screen): it is now a generic system notification with a monogram icon and a neutral name, all text, colours and the icon letters are variables; fills the host frame (a small banner top right on wide frames, a wide one across a portrait frame, sized with container units); the slide uses percentages so it works at any size.
-->
<html
  lang="en"
  data-composition-id="system-notification"
  data-composition-duration="5"
  data-composition-variables='[
    {
      "id": "app_name",
      "type": "string",
      "role": "content",
      "label": "App name",
      "description": "Small uppercase name at the top.",
      "default": "Inbox"
    },
    {
      "id": "time_label",
      "type": "string",
      "role": "content",
      "label": "Time label",
      "description": "Text at the top right of the banner.",
      "default": "now"
    },
    {
      "id": "title",
      "type": "string",
      "role": "content",
      "label": "Title",
      "description": "Bold first line.",
      "default": "New message from Sam"
    },
    {
      "id": "body",
      "type": "string",
      "role": "content",
      "label": "Message",
      "description": "Text under the title, two lines at most.",
      "default": "The launch video looks great. Can we publish it tonight?"
    },
    {
      "id": "icon_text",
      "type": "string",
      "role": "content",
      "label": "Icon letters",
      "description": "One or two letters in the app icon.",
      "default": "IN"
    },
    {
      "id": "icon_from",
      "type": "color",
      "role": "style",
      "label": "Icon colour start",
      "description": "Start of the icon gradient.",
      "default": "#2563eb"
    },
    {
      "id": "icon_to",
      "type": "color",
      "role": "style",
      "label": "Icon colour end",
      "description": "End of the icon gradient.",
      "default": "#1e3a8a"
    },
    {
      "id": "card_color",
      "type": "color",
      "role": "style",
      "label": "Banner colour",
      "description": "Base colour of the frosted banner.",
      "default": "#1e1e1e"
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>System Notification</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=block" />
      <style>
        #root { --u: min(0.242cqw, 0.13cqh); position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; font-family: Inter, system-ui, sans-serif; }
        .sn-card {
          position: absolute; top: calc(24 * var(--u)); right: calc(24 * var(--u)); width: calc(380 * var(--u));
          background: rgba(var(--rgb, 30, 30, 30), 0.82);
          backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
          border-radius: calc(16 * var(--u)); padding: calc(16 * var(--u));
          box-shadow: 0 calc(8 * var(--u)) calc(32 * var(--u)) rgba(0, 0, 0, 0.4), inset 0 0 0 calc(0.5 * var(--u)) rgba(255, 255, 255, 0.1);
          display: flex; gap: calc(12 * var(--u)); align-items: flex-start; opacity: 0;
        }
        .sn-icon { width: calc(36 * var(--u)); height: calc(36 * var(--u)); border-radius: calc(8 * var(--u)); flex: none; display: flex; align-items: center; justify-content: center; font-size: calc(14 * var(--u)); font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--ic1, #2563eb), var(--ic2, #1e3a8a)); }
        .sn-main { flex: 1; min-width: 0; }
        .sn-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: calc(2 * var(--u)); font-size: calc(13 * var(--u)); }
        .sn-app { font-weight: 600; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 0.02em; }
        .sn-time { color: rgba(255, 255, 255, 0.35); }
        .sn-title { font-size: calc(15 * var(--u)); font-weight: 600; color: #fff; line-height: 1.3; margin-bottom: calc(2 * var(--u)); }
        .sn-body { font-size: calc(13 * var(--u)); color: rgba(255, 255, 255, 0.6); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      </style>

      <div id="root" data-composition-id="system-notification" data-duration="5" data-fps="30">
        <div id="sn-card" class="sn-card clip" data-start="0" data-duration="5" data-track-index="0">
          <div class="sn-icon" id="sn-icon"></div>
          <div class="sn-main">
            <div class="sn-head"><span class="sn-app" id="sn-app"></span><span class="sn-time" id="sn-time"></span></div>
            <div class="sn-title" id="sn-title"></div>
            <div class="sn-body" id="sn-body"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
          "use strict";
          var root = document.getElementById("root");
          var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          function txt(v, f) { return typeof v === "string" && v.trim() ? v : f; }
          function hex(c, f) { c = String(c || "").trim().replace("#", ""); if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2]; return /^[0-9a-fA-F]{6}$/.test(c) ? "#" + c : f; }
          function $(id) { return document.getElementById(id); }
          function finish(tl, name) {
            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[name] = tl;
          }
          $("sn-app").textContent = txt(vars.app_name, "Inbox");
          $("sn-time").textContent = txt(vars.time_label, "now");
          $("sn-title").textContent = txt(vars.title, "New message from Sam");
          $("sn-body").textContent = txt(vars.body, "The launch video looks great. Can we publish it tonight?");
          $("sn-icon").textContent = txt(vars.icon_text, "IN").slice(0, 2);
          root.style.setProperty("--ic1", hex(vars.icon_from, "#2563eb"));
          root.style.setProperty("--ic2", hex(vars.icon_to, "#1e3a8a"));
          var c = hex(vars.card_color, "#1e1e1e");
          root.style.setProperty("--rgb", parseInt(c.slice(1, 3), 16) + ", " + parseInt(c.slice(3, 5), 16) + ", " + parseInt(c.slice(5, 7), 16));
          var card = $("sn-card");
          var tl = gsap.timeline({ paused: true });
          gsap.set(card, { xPercent: 110, opacity: 0 });
          tl.to(card, { xPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
          tl.to(card, { xPercent: 110, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.2);
          finish(tl, "system-notification");
          })();
        </script>
      </div>
    </template>
  </body>
</html>
