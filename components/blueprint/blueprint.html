<!doctype html>
<!--
  Blueprint

  A product wipes left to right into a technical drawing with a blueprint grid, white linework, dimension lines and a red callout. The built-in red device is a stand-in for the product; the labels, colors and callout text are variables.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/blueprint/index.tsx

<html
  lang="en"
  data-composition-id="blueprint"
  data-composition-duration="2.5"
  data-composition-variables='[
    {"id": "blueprint_color", "type": "color", "role": "style", "label": "Blueprint", "description": "Blueprint paper color.", "default": "#173C8F"},
    {"id": "line_color", "type": "color", "role": "style", "label": "Lines", "description": "Linework and grid color.", "default": "#FFFFFF"},
    {"id": "callout_color", "type": "color", "role": "style", "label": "Callout", "description": "Callout color.", "default": "#E5322D"},
    {"id": "product_color", "type": "color", "role": "style", "label": "Product", "description": "Color of the built-in product before the wipe.", "default": "#E5322D"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Ground behind the product before the wipe.", "default": "#FFFFFF"},
    {"id": "width_label", "type": "string", "role": "content", "label": "Width label", "description": "Text on the horizontal dimension.", "default": "71.6 mm"},
    {"id": "height_label", "type": "string", "role": "content", "label": "Height label", "description": "Text on the vertical dimension.", "default": "147.5 mm"},
    {"id": "callout_label", "type": "string", "role": "content", "label": "Callout", "description": "Text next to the red callout.", "default": "SENSOR"},
    {"id": "title_label", "type": "string", "role": "content", "label": "Title block", "description": "Text in the drawing title block.", "default": "DWG A-01  SCALE 1:1"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed.", "default": 1, "min": 0.1, "max": 4, "step": 0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Blueprint</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #ffffff; }
        .bp-stage { position: absolute; inset: 0; overflow: hidden; }
        .bp-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .bp-drawing { position: absolute; inset: 0; }
        .bp-scan { position: absolute; top: 0; bottom: 0; opacity: 0; }
      </style>

      <div id="root" data-composition-id="blueprint" data-duration="2.5" data-fps="30">
        <div id="bp-clip" class="bp-stage clip" data-start="0" data-duration="2.5" data-track-index="0">
          <svg id="bp-product" aria-hidden="true"></svg>
          <div id="bp-drawing" class="bp-drawing"><svg id="bp-sheet" aria-hidden="true"></svg></div>
          <div id="bp-scan" class="bp-scan"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            var FPS = 30;
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;

            // Piecewise-linear map of x from inR to outR, optionally eased per segment and clamped.
            function interp(x, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var i = 0;
              if (x >= inR[n - 1]) i = n - 2;
              else if (x > inR[0]) { while (x > inR[i + 1]) i++; }
              var t = (x - inR[i]) / (inR[i + 1] - inR[i]);
              if (o.clamp !== false) t = Math.min(1, Math.max(0, t));
              if (o.easing) t = o.easing(t);
              return outR[i] + (outR[i + 1] - outR[i]) * t;
            }
            function clamp01(t) { return Math.min(1, Math.max(0, t)); }

            // Easings with Remotion's names; every one maps 0..1 to 0..1.
            var E = {
              linear: function (t) { return t; },
              quad: function (t) { return t * t; },
              cubic: function (t) { return t * t * t; },
              sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
              back: function (s) { return function (t) { return t * t * ((s + 1) * t - s); }; },
              out: function (f) { return function (t) { return 1 - f(1 - t); }; },
              inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; },
              bezier: function (x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var k = 0; k < 24; k++) {
                    var mt = 1 - t;
                    var bx = 3 * mt * mt * t * x1 + 3 * mt * t * t * x2 + t * t * t;
                    if (bx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var m = 1 - t;
                  return 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t;
                };
              }
            };

            var SVGNS = "http://www.w3.org/2000/svg";
            function el(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }

            var tl = gsap.timeline({ paused: true });
            // Runs draw(frame) from the timeline so seeking to a time always draws the same picture.
            function drive(frames, draw) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
              draw(0);
            }

            var blueprintColor = str(vars.blueprint_color, "#173C8F");
            var lineColor = str(vars.line_color, "#FFFFFF");
            var calloutColor = str(vars.callout_color, "#E5322D");
            var productColor = str(vars.product_color, "#E5322D");
            root.style.background = str(vars.background, "#FFFFFF");
            var text = {
              width: str(vars.width_label, "71.6 mm"), height: str(vars.height_label, "147.5 mm"),
              callout: str(vars.callout_label, "SENSOR"), title: str(vars.title_label, "DWG A-01  SCALE 1:1")
            };
            var speed = num(vars.speed, 1, 0.1, 4);

            var MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
            var u = Math.min(W, H) / 720;
            var box = [0.17, 0.6], calloutAt = [0.5, 0.11];
            var cx = W * 0.47, cy = H * 0.46, bw = box[0] * W, bh = box[1] * H;
            var x0 = cx - bw / 2, x1 = cx + bw / 2, y0 = cy - bh / 2, y1 = cy + bh / 2;
            var radius = Math.min(bw, bh) * 0.16;
            var dotP = { x: x0 + calloutAt[0] * bw, y: y0 + calloutAt[1] * bh };
            var stroke = 2.4 * u, thin = 1.2 * u, tick = 7 * u;
            var dimY = y1 + 0.08 * H, dimX = x1 + 0.06 * W;
            var ring = Math.min(bw, bh) * 0.11;
            var labelWidth = text.callout.length * 11.8 * u + 26 * u;
            var sideways = x0 - 0.14 * W - labelWidth > 0.03 * W;
            var lead = sideways ? { x: x0 - 0.14 * W, y: y0 + 0.06 * H } : { x: Math.max(0.06 * W, dotP.x - 0.1 * W), y: Math.max(0.08 * H, y0 - 0.1 * H) };
            var elbow = sideways ? "L " + (lead.x + 0.06 * W) + " " + lead.y + " H " + lead.x : "L " + lead.x + " " + lead.y;
            var minor = 22 * u;
            function setBox(svg) { svg.setAttribute("viewBox", "0 0 " + W + " " + H); }

            // Product before the wipe: a soft shadow, a rounded body and a dark sensor.
            var prod = document.getElementById("bp-product");
            setBox(prod);
            el("rect", { x: x0, y: y0 + 10 * u, width: bw, height: bh, rx: radius, fill: "#000", opacity: 0.12, style: "filter: blur(" + 14 * u + "px)" }, prod);
            el("rect", { x: x0, y: y0, width: bw, height: bh, rx: radius, fill: productColor }, prod);
            el("circle", { cx: dotP.x, cy: dotP.y, r: bw * 0.06, fill: "#111111" }, prod);

            // The technical drawing, revealed left to right.
            var sheet = document.getElementById("bp-sheet");
            setBox(sheet);
            var defs = el("defs", {}, sheet);
            var pat = el("pattern", { id: "bp-grid", width: minor * 5, height: minor * 5, patternUnits: "userSpaceOnUse" }, defs);
            var gd = "";
            for (var i = 0; i < 5; i++) gd += "M " + i * minor + " 0 V " + minor * 5 + " M 0 " + i * minor + " H " + minor * 5 + " ";
            el("path", { d: gd, stroke: lineColor, "stroke-opacity": 0.09, "stroke-width": u }, pat);
            el("path", { d: "M 0 0 V " + minor * 5 + " M 0 0 H " + minor * 5, stroke: lineColor, "stroke-opacity": 0.22, "stroke-width": u }, pat);
            el("rect", { width: W, height: H, fill: blueprintColor }, sheet);
            el("rect", { width: W, height: H, fill: "url(#bp-grid)" }, sheet);
            var g = el("g", { fill: "none", stroke: lineColor, "stroke-linecap": "round" }, sheet);
            function dashed(node) { node.setAttribute("pathLength", 1); node.setAttribute("stroke-dasharray", 1); return node; }
            var outlines = [
              dashed(el("rect", { x: x0, y: y0, width: bw, height: bh, rx: radius, "stroke-width": stroke }, g)),
              dashed(el("rect", { x: x0 + bw * 0.07, y: y0 + bw * 0.07, width: bw * 0.86, height: bh - bw * 0.14, rx: radius * 0.7, "stroke-width": thin, "stroke-opacity": 0.7 }, g)),
              dashed(el("circle", { cx: dotP.x, cy: dotP.y, r: bw * 0.06, "stroke-width": stroke }, g))
            ];
            var center = el("path", { d: "M " + cx + " " + (y0 - 0.05 * H) + " V " + (y1 + 0.05 * H) + " M " + (x0 - 0.04 * W) + " " + cy + " H " + (x1 + 0.04 * W), "stroke-width": thin, "stroke-dasharray": 14 * u + " " + 4 * u + " " + 3 * u + " " + 4 * u }, g);
            var ext = el("path", { "stroke-width": thin, "stroke-opacity": 0.8 }, g);
            var dimLines = el("path", { "stroke-width": thin * 1.3 }, g);
            var ticks = [[x0, dimY], [x1, dimY], [dimX, y0], [dimX, y1]].map(function (p) {
              return el("line", { x1: p[0] - tick, y1: p[1] + tick, x2: p[0] + tick, y2: p[1] - tick, "stroke-width": stroke, opacity: 0 }, g);
            });
            var labels = el("g", { "font-family": MONO, "font-size": 17 * u, "letter-spacing": 1.5 * u, fill: lineColor, opacity: 0 }, sheet);
            el("rect", { x: cx - 62 * u, y: dimY - 12 * u, width: 124 * u, height: 24 * u, fill: blueprintColor }, labels);
            el("text", { x: cx, y: dimY + 6 * u, "text-anchor": "middle" }, labels).textContent = text.width;
            if (bh > 190 * u) {
              var vg = el("g", { transform: "translate(" + dimX + " " + cy + ") rotate(-90)" }, labels);
              el("rect", { x: -66 * u, y: -12 * u, width: 132 * u, height: 24 * u, fill: blueprintColor }, vg);
              el("text", { y: 6 * u, "text-anchor": "middle" }, vg).textContent = text.height;
            } else el("text", { x: dimX + 16 * u, y: cy + 6 * u }, labels).textContent = text.height;
            var tb = el("g", { transform: "translate(" + (W - 0.05 * W) + " " + (H - 0.06 * H) + ")" }, labels);
            el("rect", { x: -290 * u, y: -40 * u, width: 290 * u, height: 40 * u, fill: "none", stroke: lineColor, "stroke-width": thin }, tb);
            el("text", { x: -276 * u, y: -14 * u, "font-size": 14 * u }, tb).textContent = text.title;
            // Red callout.
            var cg = el("g", { stroke: calloutColor, fill: "none", "stroke-width": stroke, "stroke-linecap": "round" }, sheet);
            var leaderParts = [
              dashed(el("circle", { cx: dotP.x, cy: dotP.y, r: ring }, cg)),
              dashed(el("path", { d: "M " + (dotP.x - ring * 0.72) + " " + (dotP.y - ring * 0.72) + " " + elbow }, cg))
            ];
            var bubbleEl = el("circle", { cx: lead.x, cy: lead.y, r: 0, fill: calloutColor, stroke: "none" }, cg);
            var ct = el("g", { "font-family": MONO, opacity: 0 }, sheet);
            el("text", { x: lead.x, y: lead.y + 6 * u, "text-anchor": "middle", "font-size": 16 * u, "font-weight": 700, fill: lineColor }, ct).textContent = "A";
            el("text", { x: sideways ? lead.x - 26 * u : lead.x + 26 * u, y: lead.y + 6 * u, "text-anchor": sideways ? "end" : "start", "font-size": 17 * u, "letter-spacing": 1.5 * u, fill: lineColor }, ct).textContent = text.callout;

            var scan = document.getElementById("bp-scan");
            scan.style.width = 4 * u + "px";
            scan.style.backgroundColor = lineColor;
            scan.style.boxShadow = "0 0 " + 24 * u + "px " + 6 * u + "px " + lineColor;
            var drawing = document.getElementById("bp-drawing");

            var inOut = E.inOut(E.cubic), popEase = E.out(E.back(2));
            function ease(t, a, b) { return interp(t, [a, b], [0, 1], { easing: inOut }); }
            function half(a, b, p) { return [(a + b) / 2 - ((b - a) / 2) * p, (a + b) / 2 + ((b - a) / 2) * p]; }
            function setDraw(node, p) { node.setAttribute("stroke-dashoffset", 1 - p); node.setAttribute("opacity", p > 0 ? 1 : 0); }

            function draw(frame) {
              var t = frame * speed;
              var wipe = interp(t, [6, 24], [-0.04, 1.04], { easing: inOut });
              var wipeX = wipe * W;
              var outline = ease(t, 8, 28), extension = ease(t, 22, 28), dims = ease(t, 24, 32);
              var label = ease(t, 30, 36), leader = ease(t, 32, 40), calloutText = ease(t, 38, 44);
              var bubble = interp(t, [36, 42], [0, 1], { easing: popEase });
              drawing.style.clipPath = "inset(0 " + (W - wipeX) + "px 0 0)";
              scan.style.left = wipeX - 2 * u + "px";
              scan.style.opacity = wipe > 0 && wipe < 1 ? 0.9 : 0;
              outlines.forEach(function (o) { setDraw(o, outline); });
              center.setAttribute("stroke-opacity", 0.55 * outline);
              ext.setAttribute("d", "M " + x0 + " " + (y1 + 8 * u) + " V " + (y1 + 8 * u + (dimY - y1) * extension) + " M " + x1 + " " + (y1 + 8 * u) + " V " + (y1 + 8 * u + (dimY - y1) * extension) +
                " M " + (x1 + 8 * u) + " " + y0 + " H " + (x1 + 8 * u + (dimX - x1) * extension) + " M " + (x1 + 8 * u) + " " + y1 + " H " + (x1 + 8 * u + (dimX - x1) * extension));
              var hh = half(x0, x1, dims), vv = half(y0, y1, dims);
              dimLines.setAttribute("d", "M " + hh[0] + " " + dimY + " H " + hh[1] + " M " + dimX + " " + vv[0] + " V " + vv[1]);
              ticks.forEach(function (tk) { tk.setAttribute("opacity", dims > 0.98 ? 1 : 0); });
              labels.setAttribute("opacity", label);
              leaderParts.forEach(function (o) { setDraw(o, leader); });
              bubbleEl.setAttribute("r", 16 * u * bubble);
              ct.setAttribute("opacity", calloutText);
            }
            drive(Math.round(parseFloat(root.dataset.duration || "2.5") * FPS), draw);

            var total = parseFloat(root.dataset.duration || "2.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["blueprint"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
