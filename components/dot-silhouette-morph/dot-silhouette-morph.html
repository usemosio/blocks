<!doctype html>
<!--
  Dot Silhouette Morph

  Two hundred and fifty dots gather at the centre, then flow through a series of outlines (circle, heart, star, house) in a rippling stagger on a sine ease, each dot pulsing in size as it goes.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://codepen.io/chrisgannon/pen/rNGwWdd

  to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
  copies of the Software, and to permit persons to whom the Software is
  furnished to do so, subject to the following conditions:

  The above copyright notice and this permission notice shall be included in all
  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
  IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
  FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
  AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
  LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  Changes by usemosio/blocks: the pen's festive silhouettes (and their red gradient, glow filter and dark page) are replaced by four neutral outlines (circle, heart, star, house) drawn from plain path data, in two accent colours on a white page; dots are placed on the outlines with MotionPath's path-position helper as in the pen; the endless delayedCall loop and the dot pulse are plain timeline tweens with a fixed repeat; the interval, dot count and colours are variables; fills the host frame.
-->
<html
  lang="en"
  data-composition-id="dot-silhouette-morph"
  data-composition-duration="8"
  data-composition-variables='[
    {"id":"color_1","type":"color","role":"style","label":"Dot color 1","description":"Colour of every other dot.","default":"#2563eb"},
    {"id":"color_2","type":"color","role":"style","label":"Dot color 2","description":"Colour of the remaining dots.","default":"#0a0a0a"},
    {"id":"background","type":"color","role":"style","label":"Background","description":"Frame background.","default":"#ffffff"},
    {"id":"dots","type":"number","role":"motion","label":"Dots","description":"Number of dots.","default":250,"min":60,"max":400,"step":10},
    {"id":"interval","type":"number","role":"motion","label":"Shape interval","description":"Seconds between one outline and the next.","default":2,"min":1.4,"max":3,"step":0.1,"unit":"s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Dot Silhouette Morph</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
background: var(--dsm-bg, #fff);
        }
        .dsm-stage {
          position: absolute;
          inset: 0;
        }

        #dsm-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="dot-silhouette-morph" data-duration="8" data-fps="30">
        <div id="dsm-clip" class="dsm-stage clip" data-start="0" data-duration="8" data-track-index="0">
          <svg id="dsm-svg" xmlns="http://www.w3.org/2000/svg" viewBox="150 100 500 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <g id="dsm-shapes" style="display:none">
              <path id="dsm-p1" d="M550 300 A150 150 0 1 1 250 300 A150 150 0 1 1 550 300 Z" />
              <path id="dsm-p2" d="M400 470 C250 360 200 260 250 200 C300 140 380 160 400 215 C420 160 500 140 550 200 C600 260 550 360 400 470 Z" />
              <path id="dsm-p3" d="" />
              <path id="dsm-p4" d="M250 300 L400 165 L550 300 L505 300 L505 450 L295 450 L295 300 Z M365 450 L365 370 L435 370 L435 450" />
            </g>
            <g id="dsm-dots"></g>
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 8;

            root.style.setProperty("--dsm-bg", col(vars.background, "#ffffff"));
            gsap.registerPlugin(MotionPathPlugin);
            var star = [];
            for (var k = 0; k < 10; k++) { var a = (-90 + k * 36) * Math.PI / 180, r = k % 2 ? 72 : 170; star.push((400 + r * Math.cos(a)).toFixed(2) + " " + (305 + r * Math.sin(a)).toFixed(2)); }
            document.getElementById("dsm-p3").setAttribute("d", "M" + star.join(" L") + " Z");
            var count = Math.round(num(vars.dots, 250, 60, 400));
            var interval = num(vars.interval, 2, 1.4, 3);
            var c1 = col(vars.color_1, "#2563eb"), c2 = col(vars.color_2, "#0a0a0a");
            var NS = "http://www.w3.org/2000/svg";
            var g = document.getElementById("dsm-dots"), dots = [];
            for (var i = 0; i < count; i++) {
              var d = document.createElementNS(NS, "circle");
              d.setAttribute("cx", 0); d.setAttribute("cy", 0); d.setAttribute("r", i % 2 ? 2 : 4);
              d.setAttribute("fill", i % 2 ? c2 : c1);
              g.appendChild(d); dots.push(d);
            }
            gsap.set(dots, { x: 400, y: 300 });
            var shapes = ["#dsm-p1", "#dsm-p2", "#dsm-p3", "#dsm-p4"].map(function (sel) {
              var raw = MotionPathPlugin.getRawPath(document.querySelector(sel));
              MotionPathPlugin.cacheRawPathMeasurements(raw);
              var pts = [];
              for (var j = 0; j < count; j++) pts.push(MotionPathPlugin.getPositionOnPath(raw, j / count, true));
              return pts;
            });
            var tl = gsap.timeline({ paused: true });
            shapes.forEach(function (pts, k) {
              tl.to(dots, { x: function (i) { return pts[i].x; }, y: function (i) { return pts[i].y; }, duration: 1, ease: "sine.inOut", stagger: { each: 0.0026 } }, 0.3 + k * interval);
            });
            tl.to(dots, { attr: { r: "+=4" }, ease: "none", duration: 0.25, stagger: { each: 0.01, repeat: Math.ceil(total / 0.25), yoyo: true } }, 0);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["dot-silhouette-morph"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
