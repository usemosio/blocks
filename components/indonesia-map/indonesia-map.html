<!--
  Indonesia Map

  Choropleth of Indonesia by province: provinces grow in from the centre, coloured by value, with abbreviations and a glow on the ones you name. Portrait frames stack a western and an eastern half so the archipelago stays large.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/spain-map/spain-map.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Map geometry: Natural Earth 1:10m Admin 1 - States, Provinces (public domain),
  https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-admin-1-states-provinces/
  (GeoJSON from https://github.com/nvkelso/natural-earth-vector). The Mercator projection (fitted to the
  archipelago) and the SVG paths were computed once with d3-geo and are embedded below, simplified
  and rounded; specks smaller than a few pixels are dropped. This edition lists 33 provinces.

  Changes by usemosio/blocks: replaces the Spain map this was ported from (the Spanish map data needs a CC BY credit): same motion, timings and variables, now for the provinces of Indonesia with Indonesian default text; fills the host frame (header, map and legend stack to fit); d3, topojson and the fetch are gone: province paths are embedded; title, subtitle, source, data (JSON of province code or name to value), the scale ends, highlighted provinces, colour ramp, legend labels and background are variables; in portrait frames the map is cut at the Makassar strait into a western and an eastern row, each at about twice the scale, so the wide archipelago stays legible.
-->
