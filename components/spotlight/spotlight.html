<html
  lang="en"
  data-composition-id="spotlight"
  data-composition-duration="2.667"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Placeholder lockup text the beam lands on.", "default": "studio"},
    {"id": "beam_color", "type": "color", "role": "style", "label": "Beam", "description": "Color of the light cone and floor pool, and of the placeholder lockup.", "default": "#FFFFFF"},
    {"id": "stage_color", "type": "color", "role": "style", "label": "Stage", "description": "Dark stage behind everything.", "default": "#111111"},
    {"id": "dim", "type": "number", "role": "style", "label": "Dim", "description": "Brightness of the unlit lockup, 0 to 1.", "default": 0.16, "min": 0, "max": 0.6, "step": 0.01},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Spotlight</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        .sp-lockup { display: flex; align-items: center; gap: 28px; }
        .sp-mark { width: 120px; height: 120px; border-radius: 32px; display: flex; align-items: center; justify-content: center; background: var(--mark); }
        .sp-dot { width: 36px; height: 36px; border-radius: 50%; background: var(--dot); }
        .sp-word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 104px; font-weight: 800; letter-spacing: -0.04em; color: var(--text); white-space: nowrap; }
        #root { background: var(--stage); }
        .sp-stage { position: absolute; inset: 0; }
        .sp-house { position: absolute; inset: 0; opacity: 0; }
        .sp-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .sp-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      </style>

      <div id="root" data-composition-id="spotlight" data-duration="2.667" data-fps="30">
        <div id="sp-clip" class="sp-stage clip" data-start="0" data-duration="2.667" data-track-index="0">
          <div class="sp-house" id="sp-house"></div>
          <svg class="sp-svg" id="sp-svg"></svg>
          <div class="sp-logo" id="sp-logo"><div class="sp-lockup" id="sp-lockup"><div class="sp-mark"><div class="sp-dot"></div></div><span class="sp-word" id="sp-word">studio</span></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "spotlight";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var house = document.getElementById("sp-house"), svg = document.getElementById("sp-svg"), logo = document.getElementById("sp-logo");
var beamC = col(vars.beam_color, "#FFFFFF"), stageC = col(vars.stage_color, "#111111");
var dim = num(vars.dim, 0.16, 0, 0.6), speed = num(vars.speed, 1, 0, 4);
root.style.setProperty("--stage", stageC); root.style.setProperty("--mark", beamC); root.style.setProperty("--dot", stageC); root.style.setProperty("--text", beamC);
document.getElementById("sp-word").textContent = str(vars.text, "studio");
house.style.background = "radial-gradient(ellipse 80% 70% at 50% 40%, " + beamC + " 0%, transparent 70%)";
var W = root.clientWidth, H = root.clientHeight;
svg.setAttribute("viewBox", "0 0 " + W + " " + H);
var SEARCH = 12, SWING = 26, HOUSE = 38;
var apexX = W / 2, apexY = -H * 0.12, floorY = H * 0.8, spread = W * 0.27, apexHalf = W * 0.012;
var defs = svgEl("defs", {}, svg);
var bg = svgEl("linearGradient", { id: "sp-beam", gradientUnits: "userSpaceOnUse", x1: 0, y1: apexY, x2: 0, y2: floorY }, defs);
[[0, 0.55], [0.6, 0.2], [1, 0.12]].forEach(function (s) { svgEl("stop", { offset: s[0], "stop-color": beamC, "stop-opacity": s[1] }, bg); });
var pg = svgEl("radialGradient", { id: "sp-pool" }, defs);
[[0, 0.45], [0.6, 0.14], [1, 0]].forEach(function (s) { svgEl("stop", { offset: s[0], "stop-color": beamC, "stop-opacity": s[1] }, pg); });
var flt = svgEl("filter", { id: "sp-soft", x: -W, y: -H, width: W * 3, height: H * 3, filterUnits: "userSpaceOnUse" }, defs);
svgEl("feGaussianBlur", { stdDeviation: W * 0.012 }, flt);
var grp = svgEl("g", {}, svg);
var pool = svgEl("ellipse", { cy: floorY, rx: spread * 1.25, ry: H * 0.07, fill: "url(#sp-pool)" }, grp);
var beam = svgEl("polygon", { fill: "url(#sp-beam)", filter: "url(#sp-soft)" }, grp);
function draw(frame) {
  var t = frame * speed, target;
  if (t < SEARCH) target = interp(t, [0, SEARCH], [0.14, 0.27], inOutSin);
  else if (t < SWING) target = interp(t, [SEARCH, SWING], [0.27, 0.74], inOutCubic);
  else target = 0.74 + (0.5 - 0.74) * spring(t - SWING, { damping: 11, stiffness: 120, mass: 0.8 });
  var tx = target * W;
  var beamOn = interp(t, [0, 5], [0, 1], outQuad);
  var hs = interp(t, [HOUSE, HOUSE + 12], [0, 1], inOutSin);
  var coverage = Math.max(0, 1 - Math.abs(target - 0.5) / 0.3);
  var lit = Math.max(dim, dim + (1 - dim) * inOutQuad(Math.min(1, coverage)) * beamOn);
  var brightness = t >= SWING + 10 ? Math.max(lit, Math.min(1, lit + hs)) : lit;
  house.style.opacity = 0.09 * hs;
  grp.setAttribute("opacity", beamOn * (1 - 0.35 * hs));
  pool.setAttribute("cx", tx);
  beam.setAttribute("points", [apexX - apexHalf, apexY, apexX + apexHalf, apexY, tx + spread, floorY, tx - spread, floorY].reduce(function (a, v, i) { return a + (i % 2 ? "," : i ? " " : "") + v.toFixed(2); }, ""));
  logo.style.filter = "brightness(" + brightness + ")";
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
