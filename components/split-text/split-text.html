<!doctype html>
<!--
  Split Text

  A pointer sweeps along a word and each letter it touches splits along its middle: the top half lifts and the bottom half drops, and the neighbours part by less.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/codse/animata/blob/25c27e5a874c60a56dcc1609df3b2c4f5f8456f8/animata/text/split-text.tsx

<html
  lang="en"
  data-composition-id="split-text"
  data-composition-duration="5.5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word whose letters split.", "default": "SPLIT TEXT"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 190, "min": 12, "max": 360, "step": 1, "unit": "px"},
    {"id": "spread", "type": "number", "role": "style", "label": "Spread", "description": "How far the touched letter splits, as a fraction of the font size (the neighbours get 60 % and 20 %).", "default": 0.16, "min": 0.02, "max": 0.5, "step": 0.01, "unit": "em"},
    {"id": "dwell", "type": "number", "role": "motion", "label": "Dwell", "description": "Seconds the pointer spends on each letter.", "default": 0.22, "min": 0.05, "max": 1, "step": 0.01, "unit": "s"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#eab308"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "900", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Split Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .spl-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .spl-row { display: flex; line-height: 1; text-transform: uppercase; white-space: pre; }
        .spl-l { position: relative; display: inline-block; line-height: 1; white-space: pre; }
        .spl-sizer { visibility: hidden; }
        .spl-half { position: absolute; left: 0; top: 0; white-space: pre; }
        .spl-top { clip-path: inset(0 0 50% 0); }
        .spl-bot { clip-path: inset(50% 0 0 0); }
      </style>

      <div id="root" data-composition-id="split-text" data-duration="5.5" data-fps="30">
        <div id="spl-clip" class="spl-stage clip" data-start="0" data-duration="5.5" data-track-index="0">
          <div id="spl-row" class="spl-row" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function opt(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { return typeof v === "boolean" ? v : v === "true" ? true : v === "false" ? false : f; }
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > max) { size = Math.max(12, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            
            var row = document.getElementById("spl-row");
            var text = str(vars.text, "SPLIT TEXT");
            var spread = num(vars.spread, 0.16, 0.02, 0.5), dwell = num(vars.dwell, 0.22, 0.05, 1);
            root.style.color = col(vars.color, "#eab308");
            root.style.fontWeight = opt(vars.font_weight, ["300","400","500","600","700","900"], "900");
            row.setAttribute("aria-label", text);
            var chars = Array.from(text), tops = [], bots = [];
            chars.forEach(function (c) {
              var l = document.createElement("span"); l.className = "spl-l";
              var s = document.createElement("span"); s.className = "spl-sizer"; s.textContent = c;
              var t = document.createElement("span"); t.className = "spl-half spl-top"; t.textContent = c;
              var bt = document.createElement("span"); bt.className = "spl-half spl-bot"; bt.textContent = c;
              l.appendChild(s); l.appendChild(t); l.appendChild(bt); row.appendChild(l); tops.push(t); bots.push(bt);
            });
            var size = fit(row, num(vars.font_size, 190, 12, 360), 0.9);
            var n = chars.length;
            // Pointer path: left to right, away, then right to left (the original splits letters on hover).
            var steps = [], t0 = 0.4, i;
            for (i = 0; i < n; i++) steps.push({ t: t0 + i * dwell, a: i });
            steps.push({ t: t0 + n * dwell, a: -1 });
            var t1 = t0 + n * dwell + 0.7;
            for (i = n - 1; i >= 0; i--) steps.push({ t: t1 + (n - 1 - i) * dwell, a: i });
            steps.push({ t: t1 + n * dwell, a: -1 });
            function target(j, a) { if (a < 0) return 0; var d = Math.abs(j - a); return d === 0 ? 1 : d === 1 ? 0.6 : d === 2 ? 0.2 : 0; }
            function ease(p) { p = Math.min(1, Math.max(0, p)); var x = p; for (var q = 0; q < 6; q++) { var cx = 3 * 0.2 * 0 + 0; } return 1 - Math.pow(1 - p, 2.2); }
            function valueAt(j, t) {
              var from = 0, to = 0, s0 = -1e9;
              for (var k = 0; k < steps.length; k++) {
                if (steps[k].t > t) break;
                from = from + (to - from) * ease((steps[k].t - s0) / 0.3);
                to = target(j, steps[k].a); s0 = steps[k].t;
              }
              return from + (to - from) * ease((t - s0) / 0.3);
            }
            function draw(t) {
              for (var j = 0; j < n; j++) {
                var v = valueAt(j, t) * spread * size;
                tops[j].style.transform = "translateY(" + (-v) + "px)";
                bots[j].style.transform = "translateY(" + v + "px)";
              }
            }
            var clock = { t: 0 };
            var total0 = parseFloat(root.dataset.duration || "5.5");
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total0, duration: total0, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            var total = parseFloat(root.dataset.duration || "5.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["split-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
