<html
  lang="en"
  data-composition-id="pendulum-wave"
  data-composition-duration="15"
  data-composition-variables='[{"id":"count","type":"number","role":"layout","label":"Pendulums","description":"Number of pendulums in the row.","default":15,"min":2,"max":40,"step":1},{"id":"cycles","type":"number","role":"motion","label":"Cycles","description":"Swings the slowest pendulum makes per loop; pendulum i makes cycles + i.","default":10,"min":1,"max":30,"step":1},{"id":"loop_frames","type":"number","role":"motion","label":"Loop length","description":"Frames (at 30 fps) until every pendulum realigns.","default":450,"min":90,"max":900,"step":1,"unit":"frames"},{"id":"background","type":"color","role":"style","label":"Background","description":"Backdrop color.","default":"#111111"},{"id":"color","type":"color","role":"style","label":"Bobs","description":"Color of the bobs and guides.","default":"#FFFFFF"},{"id":"accent","type":"color","role":"style","label":"Wave line","description":"Color of the line threaded through the bobs.","default":"#E5322D"},{"id":"show_guides","type":"boolean","role":"style","label":"Guides","description":"Draw the faint per-pendulum tracks and centre line.","default":true}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pendulum Wave</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;

        }
        .pdw-stage { position: absolute; inset: 0; }
        .pdw-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      </style>

      <div id="root" data-composition-id="pendulum-wave" data-duration="15" data-fps="30">
        <div id="pdw-clip" class="pdw-stage clip" data-start="0" data-duration="15" data-track-index="0">
          <svg id="pdw-svg" class="pdw-svg" role="img" aria-label="Pendulum wave"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


            var count = Math.round(num(vars.count, 15, 2, 40));
            var cycles = num(vars.cycles, 10, 1, 30);
            var loopFrames = Math.max(1, num(vars.loop_frames, 450, 90, 900));
            var background = str(vars.background, "#111111");
            var color = str(vars.color, "#FFFFFF");
            var accent = str(vars.accent, "#E5322D");
            var guides = bool(vars.show_guides, true);
            root.style.background = background;

            var TAU = Math.PI * 2, SMEAR_FRAMES = 4, SMEAR_SAMPLES = 6;
            var width = root.clientWidth, height = root.clientHeight;
            var svg = document.getElementById("pdw-svg");
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            var n = count;
            var marginX = width * 0.1, gap = (width - marginX * 2) / (n - 1);
            var amp = height * 0.3, cy = height / 2;
            var r0 = Math.min(gap * 0.3, height * 0.022);
            var unit = Math.min(width, height) / 720;
            function fmt(v) { return Math.round(v * 10) / 10; }
            function circle(x, y, r) {
              return "M " + fmt(x - r) + " " + fmt(y) + " a " + fmt(r) + " " + fmt(r) + " 0 1 0 " + fmt(r * 2) + " 0 a " + fmt(r) + " " + fmt(r) + " 0 1 0 " + fmt(-r * 2) + " 0";
            }
            function smoothPath(p) {
              var d = "M " + fmt(p[0].x) + " " + fmt(p[0].y);
              for (var i = 0; i < p.length - 1; i++) {
                var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
                d += " C " + fmt(p1.x + (p2.x - p0.x) / 6) + " " + fmt(p1.y + (p2.y - p0.y) / 6) + " " + fmt(p2.x - (p3.x - p1.x) / 6) + " " + fmt(p2.y - (p3.y - p1.y) / 6) + " " + fmt(p2.x) + " " + fmt(p2.y);
              }
              return d;
            }
            var bobsX = [];
            for (var i = 0; i < n; i++) bobsX.push(marginX + i * gap);
            if (guides) {
              var g = svgEl("g", { stroke: color, fill: "none" }, svg);
              svgEl("path", { d: "M " + fmt(marginX - gap) + " " + cy + " H " + fmt(width - marginX + gap), "stroke-opacity": 0.14, "stroke-width": unit }, g);
              svgEl("path", { d: bobsX.map(function (x) { return "M " + fmt(x) + " " + fmt(cy - amp) + " V " + fmt(cy + amp); }).join(" "), "stroke-opacity": 0.08, "stroke-width": unit, "stroke-dasharray": 2 * unit + " " + 6 * unit }, g);
              svgEl("path", { d: bobsX.map(function (x) { return circle(x, cy - amp, 2.2 * unit) + " " + circle(x, cy + amp, 2.2 * unit); }).join(" "), fill: color, "fill-opacity": 0.25, stroke: "none" }, g);
            }
            var wave = svgEl("path", { fill: "none", stroke: accent, "stroke-width": 2.5 * unit, "stroke-linecap": "round", "stroke-opacity": 0.85 }, svg);
            var smearEl = svgEl("path", { fill: "none", stroke: color, "stroke-opacity": 0.13, "stroke-width": r0 * 0.9, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
            var bobEl = svgEl("path", { fill: color }, svg);

            function phaseAt(i, t) { return (TAU * t * (cycles + i)) / loopFrames; }
            function draw(time) {
              var bobs = [], smear = "";
              for (var i = 0; i < n; i++) {
                var c = Math.cos(phaseAt(i, time));
                bobs.push({ x: bobsX[i], y: cy - amp * c, r: r0 * (1 - 0.22 * c) });
              }
              for (var j = 0; j < n; j++) {
                var x = fmt(bobsX[j]);
                for (var s = 0; s <= SMEAR_SAMPLES; s++) {
                  var t = time - (SMEAR_FRAMES * s) / SMEAR_SAMPLES;
                  smear += (s === 0 ? "M" : "L") + " " + x + " " + fmt(cy - amp * Math.cos(phaseAt(j, t))) + " ";
                }
              }
              wave.setAttribute("d", smoothPath(bobs));
              smearEl.setAttribute("d", smear);
              bobEl.setAttribute("d", bobs.map(function (b) { return circle(b.x, b.y, b.r); }).join(" "));
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 450, draw);

            var total = parseFloat(root.dataset.duration || "15");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["pendulum-wave"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
