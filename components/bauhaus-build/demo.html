<!doctype html>
<!-- Bauhaus Build demo: a vertical 1080×1920 frame mounting the component full-frame. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Bauhaus Build Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f1eee7; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f1eee7; }
      .demo-mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bauhaus-build-demo" data-start="0" data-width="1080" data-height="1920" data-duration="5" data-fps="30">
      <div
        id="demo-mount"
        class="demo-mount clip"
        data-composition-id="bauhaus-build"
        data-composition-src="./bauhaus-build.html"
        data-variable-values='{}'
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div style="position:absolute;left:0;right:0;bottom:240px;text-align:center;color:#1c1a17;font:600 64px system-ui,sans-serif;letter-spacing:-0.03em">Built from shapes</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["bauhaus-build-demo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
