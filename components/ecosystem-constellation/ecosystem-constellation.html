<html
  lang="en"
  data-composition-id="ecosystem-constellation"
  data-composition-duration="8"
  data-composition-variables='[{"id":"satellite_count","type":"number","role":"content","label":"Satellites","description":"How many satellites orbit (3 to 8).","default":6,"min":3,"max":8,"step":1},{"id":"center_label","type":"string","role":"content","label":"Centre label","description":"Letter or short text on the central mark.","default":"V"},{"id":"accent_color","type":"color","role":"style","label":"Accent","description":"Colour of the hub, glow and lines.","default":"#a855f7"},{"id":"speed","type":"number","role":"motion","label":"Speed","description":"Playback speed multiplier.","default":1,"min":0.25,"max":4,"step":0.05,"unit":"x"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ecosystem Constellation</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: #09090b; font-family: Geist, system-ui, sans-serif; }
        .ec-stage { position: absolute; inset: 0; }
        #ec-world { overflow: hidden; }
        #ec-svg { position: absolute; left: 0; top: 0; }
        #ec-center { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 52px; letter-spacing: -0.05em; border: 1px solid rgba(255,255,255,0.15); box-sizing: border-box; }
        .ec-sat { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.12); box-sizing: border-box; }
        .ec-sat svg { width: 28px; height: 28px; }

      </style>

      <div id="root" data-composition-id="ecosystem-constellation" data-duration="8" data-fps="30">
        <div id="ec-clip" class="ec-stage clip" data-start="0" data-duration="8" data-track-index="0">
<div id="ec-world"><svg id="ec-svg"></svg><div id="ec-center"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var world = document.getElementById("ec-world"), svg = document.getElementById("ec-svg"), center = document.getElementById("ec-center");
            var sc = scaledStage(world, 1.5);
            var SW = root.clientWidth / sc, SH = root.clientHeight / sc;
            svg.setAttribute("width", SW); svg.setAttribute("height", SH); svg.setAttribute("viewBox", "0 0 " + SW + " " + SH);
            var accent = str(vars.accent_color, "#a855f7");
            var count = Math.max(3, Math.min(8, Math.floor(num(vars.satellite_count, 6, 3, 8)))), speed = num(vars.speed, 1, 0.25, 4);
            center.textContent = str(vars.center_label, "V");
            center.style.background = "linear-gradient(180deg, " + accent + " 0%, " + accent + "cc 100%)";
            center.style.boxShadow = "0 0 60px " + accent + "66, inset 0 1px 0 rgba(255,255,255,0.3)";
            var cx = SW / 2, cy = SH / 2;
            center.style.left = cx + "px"; center.style.top = cy + "px";
            // Eight generic marks drawn from primitive shapes.
            var BRANDS = [
              { bg: "#1f1f23", svg: '<path fill="#fff" d="M12 3c5 0 9 4 9 9s-4 9-9 9-9-4-9-9 4-9 9-9zm0 4a5 5 0 100 10 5 5 0 000-10z" fill-rule="evenodd"/>' },
              { bg: "#0a0a0a", svg: '<path fill="#fff" d="M12 3l9.5 17h-19z"/>' },
              { bg: "#635bff", svg: '<rect x="4" y="4" width="16" height="16" rx="4" fill="#fff"/>' },
              { bg: "#1a1d21", svg: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>' },
              { bg: "#2f7d6d", svg: '<circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="#fff"/>' },
              { bg: "#1e1e1e", svg: '<circle cx="9" cy="10" r="5" fill="#f4a261" opacity="0.9"/><circle cx="15" cy="10" r="5" fill="#2a9d8f" opacity="0.9"/><circle cx="12" cy="15" r="5" fill="#e76f9a" opacity="0.9"/>' },
              { bg: "#1a1a1a", svg: '<path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6z" fill="#fff"/>' },
              { bg: "#5865f2", svg: '<path d="M4 6h16v9H13l-4 4v-4H4z" fill="#fff"/>' }
            ];
            var sats = [];
            for (var i = 0; i < count; i++) {
              var b = BRANDS[i % BRANDS.length];
              var el = document.createElement("div"); el.id = "ec-sat-" + i; el.className = "ec-sat";
              el.style.background = "linear-gradient(180deg, " + b.bg + " 0%, " + b.bg + "dd 100%)";
              el.style.boxShadow = "0 8px 30px " + b.bg + "66, inset 0 1px 0 rgba(255,255,255,0.18)";
              el.innerHTML = '<svg viewBox="0 0 24 24">' + b.svg + "</svg>";
              world.appendChild(el);
              sats.push(el);
            }
            var lines = sats.map(function () { return svgEl("line", { x1: cx, y1: cy, x2: cx, y2: cy, stroke: accent, "stroke-width": 2, "stroke-linecap": "round", opacity: 0 }, svg); });
            var glow1 = svgEl("circle", { cx: cx, cy: cy, r: 70, fill: accent, opacity: 0.12 }, svg);
            var glow2 = svgEl("circle", { cx: cx, cy: cy, r: 50, fill: accent, opacity: 0.2 }, svg);
            function draw(f0) {
              var frame = f0 * speed;
              var pulse = (Math.sin(frame / 12) + 1) / 2;
              center.style.transform = "scale(" + (1 + pulse * 0.06) + ")";
              glow1.setAttribute("r", 70 + pulse * 8); glow2.setAttribute("r", 50 + pulse * 4);
              var active = Math.floor(frame / 30) % count, local = frame - Math.floor(frame / 30) * 30;
              sats.forEach(function (el, i) {
                var sp = spring({ frame: frame - i * 4, fps: 30, config: { mass: 1.1, damping: 16, stiffness: 70 }, durationInFrames: 50 });
                var rf = interpolate(sp, [0, 1], [1200, 1]);
                var rX = 230 + i * 22, rY = 180 + i * 22 * 0.7;
                var ang = (i / count) * Math.PI * 2 + frame * (0.012 - i * 0.0008);
                var x = cx + Math.cos(ang) * rX * rf, y = cy + Math.sin(ang) * rY * rf;
                var on = active === i, cl = { extrapolateLeft: "clamp", extrapolateRight: "clamp" };
                var lo = on ? interpolate(local, [0, 8, 22, 30], [0.15, 0.9, 0.9, 0.15], cl) : 0.15;
                var ss = on ? interpolate(local, [0, 8, 22, 30], [1, 1.1, 1.1, 1], cl) : 1;
                var vis = sp > 0.02;
                el.style.left = x + "px"; el.style.top = y + "px"; el.style.transform = "scale(" + ss + ")"; el.style.opacity = vis ? 1 : 0;
                lines[i].setAttribute("x2", x); lines[i].setAttribute("y2", y); lines[i].setAttribute("opacity", vis ? lo : 0);
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 240, draw);

            var total = parseFloat(root.dataset.duration || "8");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["ecosystem-constellation"] = tl;
          })();
        </script>
      </div>
    </template>
