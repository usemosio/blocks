<html
  lang="en"
  data-composition-id="paper-plane-route-draw"
  data-composition-duration="4.4"
  data-composition-variables='[
    {"id":"color_start","type":"color","role":"style","label":"Plane color","description":"Colour at the top of the plane and the route.","default":"#2563eb"},
    {"id":"color_end","type":"color","role":"style","label":"Plane color 2","description":"Colour at the bottom of the plane.","default":"#93b4f8"},
    {"id":"route_color","type":"color","role":"style","label":"Route color","description":"Colour of the route line.","default":"#2563eb"},
    {"id":"background","type":"color","role":"style","label":"Background","description":"Frame background.","default":"#ffffff"},
    {"id":"route_width","type":"number","role":"style","label":"Route width","description":"Width of the route line in the 1250-unit drawing.","default":4,"min":1,"max":12,"step":0.5,"unit":"px"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Paper Plane Route Draw</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
background: var(--ppr-bg, #fff);
        }
        .ppr-stage {
          position: absolute;
          inset: 0;
        }

        #ppr-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      </style>

      <div id="root" data-composition-id="paper-plane-route-draw" data-duration="4.4" data-fps="30">
        <div id="ppr-clip" class="ppr-stage clip" data-start="0" data-duration="4.4" data-track-index="0">
          <svg id="ppr-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-40 -180 1250 1100" preserveAspectRatio="xMidYMid meet" opacity="0" aria-hidden="true">
            <path class="ppr-mp" fill="none" stroke-width="4" stroke-linecap="round" d="M-92 17.713c154.32 237.253 348.7 486.913 585.407 466.93 137.542-17.257 247.733-123.595 279.259-239.307 27.368-100.43-21.323-229.59-140.017-241.76-118.693-12.172-208.268 98.897-231.122 199.803-34.673 151.333 12.324 312.301 125.096 429.074C639.395 749.225 815.268 819.528 995 819" />
            <g class="ppr-plane">
              <path fill="url(#ppr-grad)" opacity="0.3" d="m82.8 35 215.9 94.6L79 92l3.8-57Z" />
              <path fill="url(#ppr-grad)" d="m82.8 35 52-23.5 163.9 118.1-216-94.5Z" />
              <path fill="url(#ppr-grad)" opacity="0.3" d="m76.8 107.1 214.4 19.6L74.7 131l2.1-23.9Z" />
              <path fill="url(#ppr-grad)" d="M298.8 130.4 1.9 103.3l54-45 242.9 72.1Z" />
            </g>
            <defs><linearGradient id="ppr-grad" x1="154" x2="160" y1="49" y2="132" gradientUnits="userSpaceOnUse"><stop id="ppr-s1" offset="0" stop-color="#2563eb" /><stop id="ppr-s2" offset="1" stop-color="#93b4f8" /></linearGradient></defs>
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/DrawSVGPlugin.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 4.4;

            root.style.setProperty("--ppr-bg", col(vars.background, "#ffffff"));
            document.getElementById("ppr-s1").setAttribute("stop-color", col(vars.color_start, "#2563eb"));
            document.getElementById("ppr-s2").setAttribute("stop-color", col(vars.color_end, "#93b4f8"));
            var mp = root.querySelector(".ppr-mp");
            mp.setAttribute("stroke", col(vars.route_color, "#2563eb"));
            mp.setAttribute("stroke-width", num(vars.route_width, 4, 1, 12));
            gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
            var tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });
            tl.fromTo(".ppr-plane", { scale: 0.6 }, { duration: 4, scale: 1.2, motionPath: { path: ".ppr-mp", align: ".ppr-mp", alignOrigin: [0.5, 0.5], autoRotate: true } }, 0)
              .to("#ppr-svg", { duration: 0.7, opacity: 1 }, 0.25)
              .from(".ppr-mp", { duration: 3.8, drawSVG: 0 }, 0.28)
              .to(".ppr-mp", { duration: 2, drawSVG: "94% 94%", ease: "power2" }, "-=2")
              .to("#ppr-svg", { duration: 0.7, opacity: 0 }, "-=0.9");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["paper-plane-route-draw"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
