<!doctype html>
<!--
  Handwriting Along a Path

  Handwriting flows along any SVG path, one letter at a time, over a faint dotted guide.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/hw-path-text/hw-path-text.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: the Caveat font file becomes the same family from Google Fonts, the drawing space follows the frame (1920x1080 wide, 1080x1920 tall, each with its own default path), the shared helper functions are inlined, and the settings are variables. The overlay stays transparent; the demo supplies a dark plate.
-->
<html
  lang="en"
  data-composition-id="hw-path-text"
  data-composition-duration="6"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The line written along the path.", "default": "come on this wild journey with me..."},
    {"id": "path", "type": "string", "role": "content", "label": "Path (wide frame)", "description": "SVG path data in a 1920x1080 space, used on a landscape frame. The text follows it.", "default": "M 220 700 C 520 480, 900 820, 1230 560 S 1700 380, 1780 420"},
    {"id": "path_portrait", "type": "string", "role": "content", "label": "Path (tall frame)", "description": "SVG path data in a 1080x1920 space, used on a portrait frame.", "default": "M 120 1560 C 120 1100, 960 1300, 900 900 S 160 620, 960 260"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in the drawing space (1920 or 1080 wide).", "default": 92, "min": 24, "max": 220, "step": 1, "unit": "px"},
    {"id": "ink", "type": "color", "role": "style", "label": "Ink", "description": "Text color.", "default": "#f4f2ec"},
    {"id": "show_guide", "type": "boolean", "role": "style", "label": "Guide line", "description": "A faint dotted line draws along the path first.", "default": true},
    {"id": "char_delay", "type": "number", "role": "motion", "label": "Letter delay", "description": "Seconds between letters (it speeds up to fit long text).", "default": 0.05, "min": 0.01, "max": 0.2, "step": 0.005, "unit": "s"},
    {"id": "boil", "type": "boolean", "role": "motion", "label": "Boil", "description": "Jitter the writing a little every third frame, like a hand-drawn loop.", "default": true},
    {"id": "boil_amount", "type": "number", "role": "motion", "label": "Boil amount", "description": "How far the writing jitters, in pixels.", "default": 1.4, "min": 0, "max": 6, "step": 0.1, "unit": "px"},
    {"id": "seed", "type": "number", "role": "style", "label": "Seed", "description": "Changes the jitter pattern.", "default": 12, "min": 1, "max": 99, "step": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Handwriting Along a Path</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
          font-family: "Caveat", cursive;
        }
        .hwp-stage { position: absolute; inset: 0; }
        #hwp-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        /* The textPath carrier is geometry only; without fill:none it renders as a solid blob. */
        #hwp-path { fill: none; }
        #hwp-guide {
          fill: none;
          stroke-width: 3;
          stroke-linecap: round;
        }
        #hwp-svg text {
          font-family: "Caveat", cursive;
          font-weight: 700;
        }
        #hwp-svg tspan { opacity: 0; }
      </style>

      <div id="root" data-composition-id="hw-path-text" data-duration="6" data-fps="30">
        <div id="hwp-clip" class="hwp-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <svg id="hwp-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
            <path id="hwp-path" d=""></path>
            <path id="hwp-guide" d=""></path>
            <text id="hwp-text" font-size="92">
              <textPath id="hwp-tp" href="#hwp-path" startOffset="4%"></textPath>
            </text>
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (value === true || value === "true") return true;
              if (value === false || value === "false") return false;
              return fallback;
            }
            function hex(value, fallback) {
              return typeof value === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim()) ? value.trim() : fallback;
            }
            function rgba(h, a) {
              if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
              return "rgba(" + parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16) + "," + a + ")";
            }
            function hash(n, seed) {
              var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
              return (x - Math.floor(x)) * 2 - 1;
            }

            var DUR = 6;
            var text = str(vars.text, "come on this wild journey with me...");
            var portrait = root.clientWidth < root.clientHeight;
            var pathD = portrait
              ? str(vars.path_portrait, "M 120 1560 C 120 1100, 960 1300, 900 900 S 160 620, 960 260")
              : str(vars.path, "M 220 700 C 520 480, 900 820, 1230 560 S 1700 380, 1780 420");
            var fontSize = num(vars.font_size, 92, 24, 220);
            var ink = hex(vars.ink, "#f4f2ec");
            var showGuide = bool(vars.show_guide, true);
            var charDelay = num(vars.char_delay, 0.05, 0.01, 0.2);
            var boilOn = bool(vars.boil, true);
            var boilAmp = num(vars.boil_amount, 1.4, 0, 6);
            var seed = num(vars.seed, 12, 1, 99);

            // The drawing space is 1920x1080 on a wide frame and 1080x1920 on a tall one.
            var svg = document.getElementById("hwp-svg");
            svg.setAttribute("viewBox", portrait ? "0 0 1080 1920" : "0 0 1920 1080");
            var pathEl = document.getElementById("hwp-path");
            var guide = document.getElementById("hwp-guide");
            var textEl = document.getElementById("hwp-text");
            pathEl.setAttribute("d", pathD);
            textEl.setAttribute("font-size", fontSize);
            textEl.style.fill = ink;
            guide.style.stroke = rgba(ink, 0.22);
            if (showGuide) guide.setAttribute("d", pathD);

            var NS = "http://www.w3.org/2000/svg";
            var tp = document.getElementById("hwp-tp");
            Array.from(text).forEach(function (ch) {
              var t = document.createElementNS(NS, "tspan");
              t.textContent = ch;
              tp.appendChild(t);
            });

            var OUT = Math.min(0.6, Math.max(0.25, DUR * 0.06));
            var tl = gsap.timeline({ paused: true });
            if (showGuide) {
              var glen = guide.getTotalLength();
              gsap.set(guide, { strokeDasharray: "2 14", strokeDashoffset: glen });
              tl.to(guide, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.2);
            }
            var chars = tp.querySelectorAll("tspan");
            var delay = Math.min(charDelay, 2.6 / Math.max(1, chars.length));
            tl.to(chars, { opacity: 1, duration: 0.03, stagger: delay, ease: "none" }, 0.7);
            if (boilOn) {
              tl.eventCallback("onUpdate", function () {
                var step = Math.floor((tl.time() * 30) / 3);
                gsap.set(svg, { x: hash(step * 3, seed) * boilAmp, y: hash(step * 3 + 1, seed) * boilAmp, rotation: hash(step * 3 + 2, seed) * boilAmp * 0.22 });
              });
            }
            tl.to(svg, { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
            tl.set({}, {}, DUR);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["hw-path-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
