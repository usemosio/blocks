  Short Slide Down

  Words drop in from above and stack into a centered multi-line composition.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="short-slide-down"
  data-composition-duration="2"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Headline whose words stack one per line.", "default": "Build from above." },
    { "id": "entry_offset", "type": "number", "role": "motion", "label": "Entry offset", "description": "How far above its row each new word starts.", "default": 28, "min": 8, "max": 80, "step": 1, "unit": "px" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Type size in pixels. Larger text shrinks so the stack fits the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Short Slide Down</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .ssd-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .ssd-word { position: absolute; left: 50%; top: 50%; white-space: nowrap; letter-spacing: -0.03em; backface-visibility: hidden; opacity: 0; }
      </style>

      <div id="root" data-composition-id="short-slide-down" data-duration="2" data-fps="30">
        <div id="ssd-clip" class="ssd-stage clip" data-start="0" data-duration="2" data-track-index="0"></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("ssd-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["short-slide-down"] = tl;
            }
            var text = str(vars.text, "Build from above.");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var entryOffset = num(vars.entry_offset, 28, 8, 80);
            var clip = document.getElementById("ssd-clip");
            var words = text.trim().split(/\s+/).filter(Boolean);
            var n = words.length;
            var size = num(vars.font_size, 72, 12, 160);
            // Shrink so the whole stack fits the frame height and its widest word the width.
            var k = size / 72;
            var stackH = (size * n + 12 * k * (n - 1)) * 1.1;
            if (stackH > root.clientHeight * 0.85) size = size * root.clientHeight * 0.85 / stackH;
            var els = words.map(function (w, j) {
              var s = document.createElement("span");
              s.id = "ssd-word-" + j;
              s.className = "ssd-word";
              s.textContent = w;
              s.style.fontWeight = weight;
              s.style.fontSize = size + "px";
              clip.appendChild(s);
              return s;
            });
            var widest = 0;
            els.forEach(function (s) { widest = Math.max(widest, s.scrollWidth); });
            if (widest > root.clientWidth * 0.9) {
              size = size * root.clientWidth * 0.9 / widest;
              els.forEach(function (s) { s.style.fontSize = size + "px"; });
            }
            k = size / 72;
            var lineGap = 12 * k, rowH = size;
            var FIRST = 11, PUSH = 15, TRAVEL = 8, ENTRY_SCALE = 0.992, ENTRY_BLUR = 2.4 * k, REFLOW = 0.7 * k;
            var ease = bz("ease", 0.2, 0.8, 0.2, 1);
            function rowY(count, j) {
              var total = rowH * count + lineGap * (count - 1);
              return -total / 2 + rowH / 2 + j * (rowH + lineGap);
            }
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              els.forEach(function (el, j) {
                var es = j === 0 ? 0 : FIRST + (j - 1) * PUSH;
                var ee = es + (j === 0 ? FIRST : PUSH);
                var target = rowY(j + 1, j);
                var yFrom = j === 0 ? -14 * k : target - entryOffset * k;
                var y = target, opacity = 1, scale = 1, blur = 0;
                if (f < es) {
                  opacity = 0; y = yFrom; scale = ENTRY_SCALE; blur = ENTRY_BLUR;
                } else if (f <= ee) {
                  y = ip(f, es, Math.min(es + TRAVEL, ee), yFrom, target, ease);
                  opacity = ip(f, es, ee, 0, 1, ease);
                  scale = ip(f, es, ee, ENTRY_SCALE, 1, ease);
                  blur = ip(f, es, ee, ENTRY_BLUR, 0, ease);
                } else {
                  for (var w = j + 1; w < n; w++) {
                    var ps = FIRST + (w - 1) * PUSH, pe = ps + PUSH;
                    var fromY = rowY(w, j), toY = rowY(w + 1, j);
                    if (f >= pe) { y = toY; }
                    else if (f >= ps) {
                      y = ip(f, ps, Math.min(ps + TRAVEL, pe), fromY, toY, ease);
                      var mid = (ps + pe) / 2;
                      blur = f < mid ? ip(f, ps, mid, 0, REFLOW) : ip(f, mid, pe, REFLOW, 0);
                      break;
                    } else { y = fromY; break; }
                  }
                }
                el.style.opacity = opacity;
                el.style.filter = blur > 0.05 ? "blur(" + blur + "px)" : "none";
                el.style.transform = "translate(-50%, -50%) translate3d(0px, " + y + "px, 0) scale(" + scale + ")";
              });
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
