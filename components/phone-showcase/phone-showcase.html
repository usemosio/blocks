<!doctype html>
<!--
  Phone Showcase

  One phone on a pastel field, filmed in a single take: the camera pushes into the screen and scrolls the
  catalogue, a product card lifts out of it and is tapped into the cart, order notifications drop in above the
  phone and a count-up lands on a dark card.

  Extracted from the Mosio recipe etalase-hp by usemosio/blocks.
-->
<html
  lang="en"
  data-composition-id="phone-showcase"
  data-composition-duration="10"
  data-composition-variables='[
    {"id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Two lines separated by a vertical bar; the second line is set in the main colour.", "default": "Kue rumahan,|sekali geser."},
    {"id": "shop_name", "type": "string", "role": "content", "label": "Shop name", "description": "Name shown at the top of the phone screen.", "default": "Dapur Lumer"},
    {"id": "greeting", "type": "string", "role": "content", "label": "Greeting", "description": "Small line above the shop name on the screen.", "default": "Halo, mau kue apa?"},
    {"id": "search_hint", "type": "string", "role": "content", "label": "Search hint", "description": "Placeholder text in the screen search bar.", "default": "Cari brownies, nastar…"},
    {"id": "products", "type": "string", "role": "content", "label": "Products", "description": "Semicolon-separated entries \"Name|Description|Price\" (3 to 6). The third one is picked, lifts out of the screen and goes into the cart.", "default": "Bolu pandan|Lembut, wangi daun asli|Rp45.000; Lapis legit|18 lapis, mentega pilihan|Rp120.000; Brownies lumer|Cokelat leleh di tengah|Rp55.000; Nastar keju|Toples 500 gram|Rp85.000; Bolu stroberi|Krim segar, tanpa pengawet|Rp60.000"},
    {"id": "tag", "type": "string", "role": "content", "label": "Tag", "description": "Small badge on the lifted card.", "default": "Terlaris"},
    {"id": "button_label", "type": "string", "role": "content", "label": "Button label", "description": "Label of the add-to-cart button on the lifted card.", "default": "+ Keranjang"},
    {"id": "notifications", "type": "string", "role": "content", "label": "Notifications", "description": "Semicolon-separated entries \"Title|Detail|Amount\" (up to 3) that drop in above the phone.", "default": "Pesanan baru|Bu Rina · 2 item|Rp110rb; Pesanan baru|Mas Dimas · 1 item|Rp55rb; Pesanan baru|Kak Sinta · 3 item|Rp205rb"},
    {"id": "count_label", "type": "string", "role": "content", "label": "Count label", "description": "Caption of the dark count-up card.", "default": "Pesanan hari ini"},
    {"id": "count_value", "type": "number", "role": "content", "label": "Count value", "description": "Number the card counts up to.", "default": 1250000, "min": 0, "max": 999999999999, "step": 1},
    {"id": "count_prefix", "type": "string", "role": "content", "label": "Count prefix", "description": "Text before the number, for example Rp.", "default": "Rp"},
    {"id": "count_growth", "type": "string", "role": "content", "label": "Growth badge", "description": "Small badge on the count card. Leave empty to hide it.", "default": "+38%"},
    {"id": "bg_color", "type": "color", "role": "style", "label": "Field", "description": "Lightest tint of the pastel background.", "default": "#fbf1ec"},
    {"id": "surface_color", "type": "color", "role": "style", "label": "Cards", "description": "Cards, list items and the phone screen.", "default": "#ffffff"},
    {"id": "primary_color", "type": "color", "role": "style", "label": "Main colour", "description": "Prices, active chip, buttons, the selection ring, notification icons and chart bars.", "default": "#e8457a"},
    {"id": "accent_color", "type": "color", "role": "style", "label": "Accent", "description": "The small tag and one soft background blob.", "default": "#ffb547"},
    {"id": "text_color", "type": "color", "role": "style", "label": "Text", "description": "Headline and screen text; also the dark count card.", "default": "#23182b"},
    {"id": "muted_color", "type": "color", "role": "style", "label": "Muted text", "description": "Secondary lines.", "default": "#8a7d90"}
  ]'
>

            $("ps-clabel").textContent = str(vars.count_label, "Pesanan hari ini");
            var growth = txt(vars.count_growth, "+38%"); $("ps-growth").textContent = growth; if (!growth) $("ps-growth").style.display = "none";
            var cv = Math.round(num(vars.count_value, 1250000, 0, 999999999999)), prefix = txt(vars.count_prefix, "Rp");
            function fmt(n) { return prefix + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            $("ps-count").textContent = fmt(0);

            // Timeline. Camera = the world wrapper, origin at the phone centre; the headline lives in screen space.
            var tl = gsap.timeline({ paused: true });
            var cam = "#ps-world";
            gsap.set(cam, { scale: base, transformOrigin: "0px 0px" });
            gsap.set("#ps-phonebox", { scale: land ? 1 : 1 });
            gsap.set("#ps-badge", { scale: 0 });
            gsap.set(".ps-note, #ps-stat", { opacity: 0 });
            tl.fromTo("#ps-b1", { x: 0, y: 0 }, { x: 120, y: -140, duration: 10, ease: "sine.inOut" }, 0)
              .fromTo("#ps-b2", { x: 0, y: 0 }, { x: -100, y: 160, duration: 10, ease: "sine.inOut" }, 0);
            // 1. headline blurs in word by word, phone rises, camera pushes 1.12x
            tl.fromTo("#ps-headline .ps-w", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "circ.out", stagger: 0.09 }, 0.15)
              .from("#ps-phone", { y: 900, rotation: 8, scale: 0.9, duration: 1.15, ease: "circ.out" }, 0.25)
              .fromTo(cam, { scale: base }, { scale: base * 1.12, duration: 2.0, ease: "circ.out" }, 0.3)
              .to("#ps-headline .ps-w", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.35, ease: "power1.in", stagger: 0.04 }, 2.15);
            // 2. dive 1.5x into the screen, catalogue scrolls to the target
            tl.to(cam, { scale: base * 1.55, y: 330 * base, duration: 0.8, ease: "power2.inOut" }, 2.4)
              .to("#ps-feed", { y: -428, duration: 1.1, ease: "power2.inOut" }, 3.25)
              .to(cam, { y: 200 * base, duration: 1.1, ease: "power2.inOut" }, 3.25)
              .fromTo("#ps-ring", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.25, ease: "circ.out" }, 4.4);
            // The card lifts out, the phone defocuses behind it
            tl.to(cam, { scale: base * 0.92, y: 0, duration: 0.65, ease: "sine.out" }, 4.75)
              .to("#ps-phone", { filter: "blur(5px)", opacity: 0.55, duration: 0.5, ease: "sine.out" }, 4.85)
              .fromTo("#ps-lift", { opacity: 0, x: -40, y: 80, scale: 0.7, rotation: 0 }, { opacity: 1, x: 0, y: 0, scale: 1.18, rotation: -4, duration: 0.7, ease: "circ.out" }, 4.8)
              .to("#ps-lift", { y: -16, rotation: -3, duration: 1.05, ease: "sine.inOut" }, 5.5);
            // Tap the button
            tl.fromTo("#ps-tap", { opacity: 0, scale: 1.6, x: 60, y: 120 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.4, ease: "power2.out" }, 5.7)
              .to("#ps-tap", { scale: 0.8, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, 6.1)
              .to("#ps-btn", { scale: 0.93, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, 6.1)
              .fromTo("#ps-ripple", { opacity: 0.6, scale: 0 }, { opacity: 0, scale: 9, duration: 0.5, ease: "circ.out" }, 6.15)
              .to("#ps-tap", { opacity: 0, duration: 0.2 }, 6.45);
            // The card flies into the cart, the badge bounces
            tl.to("#ps-lift", { x: 200, y: -360, scale: 0.12, rotation: 12, opacity: 0, duration: 0.55, ease: "power2.in" }, 6.55)
              .to("#ps-phone", { filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "sine.out" }, 6.6)
              .to(cam, { scale: base, duration: 0.6, ease: "power2.inOut" }, 6.6)
              .to("#ps-badge", { scale: 1, duration: 0.4, ease: "back.out(3)" }, 7.05)
              .to("#ps-cart", { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" }, 7.05);
            // 3. notifications drop in, the dark count card rises and counts up
            tl.fromTo(".ps-note", { opacity: 0, y: -90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "circ.out", stagger: 0.16 }, 7.2)
              .to(cam, { scale: base * 0.94, y: -30 * base, duration: 0.9, ease: "sine.out" }, 7.2)
              .fromTo("#ps-stat", { opacity: 0, y: 140, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "circ.out" }, 8.0)
              .from(".ps-bars u", { scaleY: 0, duration: 0.45, ease: "circ.out", stagger: 0.07 }, 8.3);
            var acc = { v: 0 };
            tl.to(acc, { v: cv, duration: 1.1, ease: "power3.out", onUpdate: function () { $("ps-count").textContent = fmt(acc.v); } }, 8.25);
            var total = parseFloat(root.dataset.duration || "10");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["phone-showcase"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
