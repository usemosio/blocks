<!--

  Comic-book lettering: skewed uppercase letters with a halftone-dot fill, a heavy black outline and a stacked hard shadow, popping in with a small overshoot.

<html
  lang="en"
  data-composition-id="comic-text"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The lettering. It is set in capitals.", "default": "BOOM!"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 160, "min": 24, "max": 400, "step": 1, "unit": "px"},
    {"id": "fill_color", "type": "color", "role": "style", "label": "Fill colour", "description": "Background colour of the letters.", "default": "#FACC15"},
    {"id": "dot_color", "type": "color", "role": "style", "label": "Dot colour", "description": "Halftone dots in the letters and the second shadow.", "default": "#EF4444"},
    {"id": "outline_color", "type": "color", "role": "style", "label": "Outline colour", "description": "Outline and first shadow.", "default": "#000000"},
    {"id": "pop_seconds", "type": "number", "role": "motion", "label": "Pop time", "description": "Seconds the pop-in takes (the source uses 0.6).", "default": 0.6, "min": 0.2, "max": 2, "step": 0.05, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Comic Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bangers&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .cmt-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .cmt-pop { display: inline-block; opacity: 0; will-change: transform, opacity; }
        .cmt-text {
          display: inline-block;
          font-family: "Bangers", "Comic Sans MS", Impact, sans-serif;
          font-weight: 900;
          text-transform: uppercase;
          text-align: center;
          white-space: pre;
          line-height: 1.1;
          transform: skewX(-10deg);
          background-repeat: repeat;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }
      </style>

      <div id="root" data-composition-id="comic-text" data-duration="3" data-fps="30">
        <div id="cmt-clip" class="cmt-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="cmt-pop" class="cmt-pop"><span id="cmt-text" class="cmt-text"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Shrink an element's font until it fits a share of the frame width.
            function fit(el, size, share) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * share);
              if (el.scrollWidth > max) {
                size = Math.max(12, size * (max / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            // A seeded random generator, so every seek draws the same thing.
            function mulberry32(a) {
              return function () {
                a |= 0; a = (a + 0x6d2b79f5) | 0;
                var t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
            gsap.registerPlugin(CustomEase);
            var TAG = "cmt";
            var bezN = 0;
            function bez(x1, y1, x2, y2) {
              return CustomEase.create(TAG + "-" + bezN++, "M0,0 C" + x1 + "," + y1 + " " + x2 + "," + y2 + " 1,1");
            }
            var tl = gsap.timeline({ paused: true });
            function finish() {
              var total = parseFloat(root.dataset.duration || "3");
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["comic-text"] = tl;
            }

            var pop = document.getElementById("cmt-pop");
            var el = document.getElementById("cmt-text");
            var fill = col(vars.fill_color, "#FACC15");
            var dots = col(vars.dot_color, "#EF4444");
            var ink = col(vars.outline_color, "#000000");
            el.textContent = str(vars.text, "BOOM!");
            var size = fit(el, num(vars.font_size, 160, 24, 400), 0.8);
            // The source sets these in px at its 5rem (80 px) size; they scale with the text here.
            var k = size / 80;
            el.style.webkitTextStroke = (1.75 * k).toFixed(2) + "px " + ink;
            el.style.backgroundColor = fill;
            el.style.backgroundImage = "radial-gradient(circle at " + (1 * k) + "px " + (1 * k) + "px, " + dots + " " + (1 * k) + "px, transparent 0)";
            el.style.backgroundSize = 8 * k + "px " + 8 * k + "px";
            el.style.filter = "drop-shadow(" + 5 * k + "px " + 5 * k + "px 0 " + ink + ") drop-shadow(" + 3 * k + "px " + 3 * k + "px 0 " + dots + ")";
            // Remotion-style cubic-bezier overshoot from the source transition.
            var pe = bez(0.175, 0.885, 0.32, 1.275);
            var d = num(vars.pop_seconds, 0.6, 0.2, 2);
            tl.fromTo(pop, { opacity: 0, scale: 0.8, rotation: -2 }, { opacity: 1, scale: 1, rotation: 0, duration: d, ease: pe, immediateRender: true }, 0);

            finish();
          })();
        </script>
      </div>
    </template>
  </body>
</html>
