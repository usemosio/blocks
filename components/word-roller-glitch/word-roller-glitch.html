<!doctype html>
<!--
  Word Roller Glitch

<html
  lang="en"
  data-composition-id="word-roller-glitch"
  data-composition-duration="4.5"
  data-composition-variables='[
    {"id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words in order, separated by commas. The last one is where it settles.", "default": "HACK, CODE, SHIP, WIN"},
    {"id": "prefix", "type": "string", "role": "content", "label": "Lead-in", "description": "Small line above the word.", "default": "READY TO"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the word in pixels. A wide word shrinks to fit the frame.", "default": 100, "min": 20, "max": 320, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Word color", "description": "Color of the word.", "default": "#fafafa"},
    {"id": "prefix_color", "type": "color", "role": "style", "label": "Lead-in color", "description": "Color of the line above.", "default": "#a3a3a3"},
    {"id": "glitch_a", "type": "color", "role": "style", "label": "Glitch top", "description": "Color of the top half layer during a glitch.", "default": "#38bdf8"},
    {"id": "glitch_b", "type": "color", "role": "style", "label": "Glitch bottom", "description": "Color of the bottom half layer during a glitch.", "default": "#f43f5e"},
    {"id": "cycle_frames", "type": "number", "role": "motion", "label": "Frames per word", "description": "How long each word is shown, in 30 fps frames.", "default": 30, "min": 12, "max": 120, "step": 1, "unit": "f"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#0a0a0a"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Glitch</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wgl-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #fafafa); }
        .wgl-g { text-align: center; line-height: 1.1; }
        .wgl-lead { font-size: 0.24em; font-weight: 400; color: var(--pc, #a3a3a3); margin-bottom: 0.6em; white-space: pre; }
        .wgl-wrap { position: relative; display: grid; justify-items: center; font-weight: 800; }
        .wgl-wrap > * { grid-area: 1 / 1; }
        .wgl-word, .wgl-la, .wgl-lb { font-weight: 800; white-space: pre; }
        .wgl-word { position: relative; z-index: 1; }
        .wgl-sizer { grid-area: 1 / 1; }
        .wgl-la { color: var(--ga, #38bdf8); opacity: 0.9; clip-path: inset(0 0 50% 0); display: none; }
        .wgl-lb { color: var(--gb, #f43f5e); opacity: 0.9; clip-path: inset(50% 0 0 0); display: none; }

        .wgl-sizer { display: grid; height: 0; overflow: hidden; visibility: hidden; pointer-events: none; }
        .wgl-sizer span { grid-area: 1 / 1; white-space: pre; }

      </style>

      <div id="root" data-composition-id="word-roller-glitch" data-duration="4.5" data-fps="30">
        <div id="wgl-clip" class="wgl-stage clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div id="wgl-g" class="wgl-g">
            <div id="wgl-lead" class="wgl-lead"></div>
            <div class="wgl-wrap">
              <div id="wgl-sizer" class="wgl-sizer"></div>
              <div id="wgl-la" class="wgl-la"></div>
              <div id="wgl-lb" class="wgl-lb"></div>
              <div id="wgl-word" class="wgl-word"></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "4.5");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-glitch"] = tl;
            }

            root.style.background = str(vars.background, "#0a0a0a");
            
            var words = list(vars.words, ["HACK", "CODE", "SHIP", "WIN"], 10);
            var fi = words.length - 1;
            var cd = num(vars.cycle_frames, 30, 12, 120);
            var g = el("wgl-g"), lead = el("wgl-lead"), word = el("wgl-word"), la = el("wgl-la"), lb = el("wgl-lb");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--c", vars.color);
            if (typeof vars.prefix_color === "string" && vars.prefix_color) root.style.setProperty("--pc", vars.prefix_color);
            if (typeof vars.glitch_a === "string" && vars.glitch_a) root.style.setProperty("--ga", vars.glitch_a);
            if (typeof vars.glitch_b === "string" && vars.glitch_b) root.style.setProperty("--gb", vars.glitch_b);
            lead.textContent = txt(vars.prefix, "READY TO");
            lead.style.display = lead.textContent ? "" : "none";
            fillSizer(el("wgl-sizer"), words);
            var base = num(vars.font_size, 100, 20, 320);
            function fit() { fitG(g, base, null, 0.88, 0.8); }
            fit();
            onFonts(fit);

            // remocn-scenes: during the first 8 frames of every swap (not the last word) the two colour
            // layers shift by sin(frame * 2) * 5 px in opposite directions.
            function draw(f) {
              var ci = Math.min(Math.floor(f / cd), fi);
              var cT = ci >= fi ? cd : f % cd;
              var glitching = ci < fi && cT < 8;
              var gi = glitching ? Math.sin(cT * 2) * 5 : 0;
              setText(word, words[ci]);
              setText(la, words[ci]);
              setText(lb, words[ci]);
              la.style.display = lb.style.display = glitching ? "block" : "none";
              la.style.transform = "translateX(" + (gi / 100) + "em)";
              lb.style.transform = "translateX(" + (-gi / 100) + "em)";
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
