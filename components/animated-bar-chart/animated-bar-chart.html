<html
  lang="en"
  data-composition-id="animated-bar-chart"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "data", "type": "string", "role": "content", "label": "Data", "description": "Comma-separated bar values.", "default": "35, 60, 45, 80, 55, 70, 90, 65"},
    {"id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "Optional comma-separated labels under the bars.", "default": ""},
    {"id": "bar_color", "type": "color", "role": "style", "label": "Bar color", "description": "Bar color.", "default": "#0ea5e9"},
    {"id": "gap", "type": "number", "role": "style", "label": "Gap", "description": "Gap between bars (in a 1000 px wide chart).", "default": 16, "min": 0, "max": 80, "step": 2, "unit": "px"},
    {"id": "stagger_frames", "type": "number", "role": "motion", "label": "Stagger frames", "description": "Frames between one bar and the next.", "default": 6, "min": 0, "max": 30, "step": 1, "unit": "frames"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Animated Bar Chart</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { font-family: Geist, -apple-system, BlinkMacSystemFont, sans-serif; }
        .abc-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .abc-svg { display: block; overflow: visible; }
      </style>

      <div id="root" data-composition-id="animated-bar-chart" data-duration="3" data-fps="30">
        <div id="abc-clip" class="abc-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <svg id="abc-svg" class="abc-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 3;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["animated-bar-chart"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var data = String(str(vars.data, "35, 60, 45, 80, 55, 70, 90, 65")).split(",").map(function (s) { return Number(s.trim()); }).filter(function (n) { return Number.isFinite(n) && n >= 0; });
            if (!data.length) data = [35, 60, 45, 80, 55, 70, 90, 65];
            var labels = typeof vars.labels === "string" && vars.labels.trim() ? vars.labels.split(",").map(function (s) { return s.trim(); }) : null;
            var barColor = str(vars.bar_color, "#0ea5e9");
            var gapV = num(vars.gap, 16, 0, 80);
            var stagger = num(vars.stagger_frames, 6, 0, 30);
            var speed = num(vars.speed, 1, 0.25, 4);
            var NS = "http://www.w3.org/2000/svg";
            // remocn draws a 1000 x 500 chart; it is scaled up to fill the host frame.
            var W = root.clientWidth, H = root.clientHeight;
            var s = Math.min(W * 0.92, H * 0.85 * 2) / 1000;
            var width = 1000, height = 500;
            var svg = document.getElementById("abc-svg");
            svg.setAttribute("width", width * s);
            svg.setAttribute("height", height * s);
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            var padding = 60, labelSpace = labels ? 40 : 0;
            var innerW = width - padding * 2, innerH = height - padding * 2 - labelSpace;
            var max = Math.max.apply(null, data) || 1;
            var barW = (innerW - gapV * (data.length - 1)) / data.length;
            var baseY = padding + innerH;
            function el(tag, attrs) {
              var e = document.createElementNS(NS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              svg.appendChild(e);
              return e;
            }
            el("line", { x1: padding, x2: padding + innerW, y1: baseY, y2: baseY, stroke: "#27272a", "stroke-width": 2 });
            var bars = data.map(function (v, i) {
              var th = (v / max) * innerH, x = padding + i * (barW + gapV), y = baseY - th;
              var rect = el("rect", { id: "abc-bar-" + i, x: x, y: y, width: barW, height: th, rx: 6, fill: barColor });
              rect.style.filter = "drop-shadow(0 4px 16px " + barColor + "55)";
              var text = null;
              if (labels && labels[i]) {
                text = el("text", { x: x + barW / 2, y: baseY + 28, fill: "#a1a1aa", "font-size": 16, "text-anchor": "middle" });
                text.textContent = labels[i];
              }
              return { rect: rect, text: text, cx: x + barW / 2 };
            });
            var cfg = { damping: 12, stiffness: 100, mass: 0.8 };
            start(function (raw) {
              var frame = raw * speed;
              bars.forEach(function (b, i) {
                var sc = spring(frame - i * stagger, cfg);
                b.rect.setAttribute("transform", "translate(0 " + baseY * (1 - sc) + ") scale(1 " + sc + ")");
                if (b.text) b.text.style.opacity = sc;
              });
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
