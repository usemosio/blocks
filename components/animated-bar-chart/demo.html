<!doctype html>
<!-- Animated Bar Chart demo: a vertical 1080×1920 frame mounting the component full-frame. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Animated Bar Chart Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      .demo-mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="animated-bar-chart-demo" data-start="0" data-width="1080" data-height="1920" data-duration="3" data-fps="30">
      <div
        id="demo-mount"
        class="demo-mount clip"
        data-composition-id="animated-bar-chart"
        data-composition-src="./animated-bar-chart.html"
        data-variable-values='{"data": "35, 60, 45, 80, 55, 70, 90, 65", "labels": "Mon, Tue, Wed, Thu, Fri, Sat, Sun, Next"}'
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["animated-bar-chart-demo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
