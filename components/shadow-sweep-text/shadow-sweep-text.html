<!--
  Shadow Sweep Text

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="shadow-sweep-text"
  data-composition-duration="1.234"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Short statement revealed and removed by the shadow.", "default": "are abandoned" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 96, "min": 12, "max": 180, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#aaa6b5" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}] },
    { "id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Color of the field behind the text.", "default": "#030012" },
    { "id": "shadow_color", "type": "color", "role": "style", "label": "Shadow color", "description": "Color of the sweeping shadow. Match it to the background.", "default": "#030012" },
    { "id": "shadow_softness", "type": "number", "role": "style", "label": "Shadow softness", "description": "Width of the soft edge in pixels.", "default": 130, "min": 0, "max": 280, "step": 1, "unit": "px" },
    { "id": "rise", "type": "number", "role": "motion", "label": "Rise", "description": "How far below its place the text starts.", "default": 96, "min": 0, "max": 300, "step": 1, "unit": "px" },
    { "id": "drift_left", "type": "number", "role": "motion", "label": "Drift left", "description": "How far right of its place the text starts.", "default": 16, "min": 0, "max": 120, "step": 1, "unit": "px" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shadow Sweep Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #aaa6b5);
          background: var(--bg, #030012);
          font-family: Arial, Helvetica, sans-serif;
          pointer-events: none;
        }
        .sst-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .sst-box { position: relative; display: inline-block; }
        .sst-text { display: inline-block; line-height: 1; white-space: nowrap; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
        .sst-field { position: absolute; top: 50%; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); }
      </style>

      <div id="root" data-composition-id="shadow-sweep-text" data-duration="1.234" data-fps="30">
        <div id="sst-clip" class="sst-stage clip" data-start="0" data-duration="1.234" data-track-index="0">
          <div id="sst-box" class="sst-box">
            <span id="sst-text" class="sst-text"></span>
            <div id="sst-field" class="sst-field"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("sst-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "1.234");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["shadow-sweep-text"] = tl;
            }
            var text = str(vars.text, "are abandoned");
            var weight = pick(vars.font_weight, ["400", "600", "700", "900"], "700");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var bgColor = str(vars.background_color, "#030012");
            root.style.setProperty("--bg", bgColor);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var shadow = str(vars.shadow_color, "#030012");
            var soft = Math.max(num(vars.shadow_softness, 130, 0, 280), 0);
            var rise = num(vars.rise, 96, 0, 300);
            var drift = num(vars.drift_left, 16, 0, 120);
            var box = document.getElementById("sst-box");
            var el = document.getElementById("sst-text");
            var field = document.getElementById("sst-field");
            el.textContent = text;
            el.style.fontWeight = weight;
            var size = fit(el, num(vars.font_size, 96, 12, 180), 0.8);
            var fieldW = Math.max(soft * 3, 1);
            var fieldH = Math.max(size * 2.6, soft * 1.8, 1);
            field.style.width = fieldW + "px";
            field.style.height = fieldH + "px";
            field.style.background = "radial-gradient(ellipse at center, " + shadow + " 0%, " + shadow + " 14%, transparent 72%)";
            field.style.filter = "blur(" + soft * 0.08 + "px)";

            var LEN = 37, ENTER_END = 23, EXIT_START = 26, EXIT_END = LEN - 1;
            var out = bz("travel", 0.215, 0.61, 0.355, 1);
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var travel = ip(f, 0, LEN - 1, 0, 1, out);
              box.style.transform = "translate3d(" + (-20 + drift * (1 - travel)) + "px, " + (9 + rise * (1 - travel)) + "px, 0)";
              var entering = f < ENTER_END, exiting = f >= EXIT_START;
              var sp = entering ? ip(f, -3, ENTER_END, 0, 1) : exiting ? ip(f, EXIT_START, EXIT_END, 0, 1) : null;
              if (sp === null) {
                el.style.webkitMaskImage = el.style.maskImage = "none";
                field.style.opacity = 0;
                return;
              }
              var edge = (sp * 2 - 1) * (soft / 2);
              var start = "calc(" + sp * 100 + "% + " + (edge - soft / 2) + "px)";
              var end = "calc(" + sp * 100 + "% + " + (edge + soft / 2) + "px)";
              var mask = entering
                ? "linear-gradient(90deg, #000 0, #000 " + start + ", transparent " + end + ", transparent 100%)"
                : "linear-gradient(90deg, transparent 0, transparent " + start + ", #000 " + end + ", #000 100%)";
              el.style.webkitMaskImage = el.style.maskImage = mask;
              field.style.left = "calc(" + sp * 100 + "% + " + edge + "px)";
              var fo = sp < 0.08 ? sp / 0.08 : sp < 0.82 ? 1 : Math.max(0, (1 - sp) / 0.18);
              field.style.opacity = fo;
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
