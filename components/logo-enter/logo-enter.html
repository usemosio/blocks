<html
  lang="en"
  data-composition-id="logo-enter"
  data-composition-duration="3"
  data-composition-variables='[{"id":"count","type":"number","role":"content","label":"Chips","description":"How many chips (1 to 6). Each shows a generic placeholder mark.","default":4,"min":1,"max":6,"step":1},{"id":"diameter","type":"number","role":"style","label":"Diameter","description":"Chip diameter in pixels on a 1280x720 frame.","default":118,"min":48,"max":300,"step":1,"unit":"px"},{"id":"overlap","type":"number","role":"style","label":"Overlap","description":"How far each chip tucks under the previous one.","default":38,"min":0,"max":150,"step":1,"unit":"px"},{"id":"ring_color","type":"color","role":"style","label":"Ring","description":"Colour of the ring around each chip.","default":"#ffffff"},{"id":"orientation","type":"enum","role":"style","label":"Orientation","description":"Stack direction.","default":"horizontal","options":[{"value":"horizontal","label":"Horizontal"},{"value":"vertical","label":"Vertical"}]},{"id":"stagger","type":"number","role":"motion","label":"Stagger","description":"Frames between one chip and the next (30 fps).","default":7,"min":0,"max":30,"step":1,"unit":"frames"},{"id":"speed","type":"number","role":"motion","label":"Speed","description":"Playback speed multiplier.","default":1,"min":0.25,"max":4,"step":0.05,"unit":"x"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Logo Enter</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        .le-stage { position: absolute; inset: 0; }
        #le-scene { display: flex; align-items: center; justify-content: center; }
        #le-row { display: flex; }
        .le-chip { flex: none; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 48px rgba(0,0,0,0.5); }
        .le-mark { display: flex; }
        .le-mark svg { width: 100%; height: 100%; }

      </style>

      <div id="root" data-composition-id="logo-enter" data-duration="3" data-fps="30">
        <div id="le-clip" class="le-stage clip" data-start="0" data-duration="3" data-track-index="0">
<div id="le-scene"><div id="le-row"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var scene = document.getElementById("le-scene"), row = document.getElementById("le-row");
            scaledStage(scene, 1.6);
            var count = Math.round(num(vars.count, 4, 1, 6));
            var dia = num(vars.diameter, 118, 48, 300), overlap = num(vars.overlap, 38, 0, 150);
            var ring = str(vars.ring_color, "#ffffff"), stagger = num(vars.stagger, 7, 0, 30), speed = num(vars.speed, 1, 0.25, 4);
            var vertical = pick(vars.orientation, ["horizontal", "vertical"], "horizontal") === "vertical";
            row.style.flexDirection = vertical ? "column" : "row";
            // Generic placeholder marks, none of them a real brand.
            var MARKS = [
              { bg: "#F0EEE6", svg: '<svg viewBox="0 0 24 24"><path fill="#D9593B" d="M12 1.5l2.6 7.1 7.4.5-5.8 4.7 1.9 7.2L12 17.1 5.9 21l1.9-7.2L2 9.1l7.4-.5z"/></svg>' },
              { bg: "#0A0A0A", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></svg>' },
              { bg: "#0A0A0A", svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l9 5.2v10.6l-9 5.2-9-5.2V7.7zm0 4.1L6.6 9.7v4.6l5.4 3.1 5.4-3.1V9.7z" fill-rule="evenodd"/></svg>' },
              { bg: "#0A0A0A", svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3l9.5 17h-19z"/></svg>' },
              { bg: "#F0EEE6", svg: '<svg viewBox="0 0 24 24" fill="#2b3a67"><rect x="4" y="4" width="16" height="16" rx="5"/></svg>' },
              { bg: "#0A0A0A", svg: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>' }
            ];
            var chips = [];
            for (var i = 0; i < count; i++) {
              var m = MARKS[i % MARKS.length];
              var c = document.createElement("div");
              c.id = "le-chip-" + i; c.className = "le-chip";
              c.style.width = c.style.height = dia + "px";
              c.style.background = m.bg; c.style.border = "5px solid " + ring; c.style.zIndex = String(count - i);
              if (i > 0) { if (vertical) c.style.marginTop = -overlap + "px"; else c.style.marginLeft = -overlap + "px"; }
              var inner = document.createElement("div");
              inner.className = "le-mark"; inner.style.width = inner.style.height = dia * 0.52 + "px";
              inner.innerHTML = m.svg; c.appendChild(inner);
              row.appendChild(c); chips.push(c);
            }
            function draw(frame) {
              chips.forEach(function (c, i) {
                var s = spring({ fps: 30, frame: frame * speed - i * stagger, config: { damping: 13, stiffness: 130, mass: 0.8 } });
                var sc = interpolate(s, [0, 1], [0.5, 1]), off = interpolate(s, [0, 1], [22, 0]);
                c.style.opacity = s;
                c.style.transform = (vertical ? "translateX(" + off + "px)" : "translateY(" + off + "px)") + " scale(" + sc + ")";
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 90, draw);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["logo-enter"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
