<!doctype html>
<!--
  Staggered Letter

  Letters drop in from far above (or rise from far below) one by one and snap into place on a quick spring, over a pale ghost of the word.

<html
  lang="en"
  data-composition-id="staggered-letter"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word that assembles.", "default": "Staggered"},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Letters fall from above or rise from below.", "default": "drop", "options": [{"value": "drop", "label": "Drop"}, {"value": "up", "label": "Rise"}]},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 150, "min": 12, "max": 320, "step": 1, "unit": "px"},
    {"id": "delay", "type": "number", "role": "motion", "label": "Delay", "description": "Seconds between letters.", "default": 0.09, "min": 0, "max": 0.5, "step": 0.01, "unit": "s"},
    {"id": "ghost", "type": "boolean", "role": "style", "label": "Ghost", "description": "Show a pale copy of the word where the letters land.", "default": true},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "ghost_color", "type": "color", "role": "style", "label": "Ghost color", "description": "Color of the pale copy.", "default": "#9ca3af"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Staggered Letter</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .sl-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sl-wrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; line-height: 1.1; }
        .sl-gc { display: inline-block; white-space: pre; }
        .sl-ghost { position: absolute; display: flex; white-space: pre; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.04)) drop-shadow(0 4px 3px rgba(0,0,0,0.1)); }
        .sl-row { display: flex; white-space: pre; }
        .sl-ch { display: inline-block; white-space: pre; opacity: 0; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.04)) drop-shadow(0 4px 3px rgba(0,0,0,0.1)); }
      </style>

      <div id="root" data-composition-id="staggered-letter" data-duration="3" data-fps="30">
        <div id="sl-clip" class="sl-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="sl-wrap" class="sl-wrap" role="img"><div id="sl-ghost" class="sl-ghost"></div><div id="sl-row" class="sl-row"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function opt(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { return typeof v === "boolean" ? v : v === "true" ? true : v === "false" ? false : f; }
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > max) { size = Math.max(12, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            function spring(t, k, c, m) {
              if (t <= 0) return 0;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
              if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            var wrap = document.getElementById("sl-wrap");
            var ghost = document.getElementById("sl-ghost");
            var row = document.getElementById("sl-row");
            var text = str(vars.text, "Staggered");
            var dirSign = opt(vars.direction, ["drop", "up"], "drop") === "up" ? 1 : -1;
            var step = num(vars.delay, 0.09, 0, 0.5);
            root.style.color = col(vars.color, "#171717");
            wrap.setAttribute("aria-label", text);
            ghost.style.color = col(vars.ghost_color, "#9ca3af");
            Array.from(text).forEach(function (c) { var g = document.createElement("span"); g.className = "sl-gc"; g.textContent = c; ghost.appendChild(g); });
            ghost.style.display = bool(vars.ghost, true) ? "" : "none";
            var chars = Array.from(text).map(function (c) {
              var s = document.createElement("span"); s.className = "sl-ch"; s.textContent = c; row.appendChild(s); return s;
            });
            var size = fit(wrap, num(vars.font_size, 150, 12, 320), 0.9);
            var k = size / 72;
            var total0 = parseFloat(root.dataset.duration || "3");
            function draw(t) {
              chars.forEach(function (s, i) {
                var lt = t - i * step;
                var y = 150 * k * (-dirSign) * 1;
                y = (dirSign === 1 ? 150 : -150) * k * (1 - spring(lt, 500, 25, 1));
                var p = Math.min(1, Math.max(0, lt / 0.3));
                s.style.opacity = 1 - (1 - p) * (1 - p);
                s.style.transform = "translateY(" + y + "px)";
              });
            }
            var clock = { t: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total0, duration: total0, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["staggered-letter"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
