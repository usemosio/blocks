<!doctype html>
<!--
  Line Boil

  A hand-drawn outline draws itself, boils on threes like a cel animation, and fills with color while it keeps boiling. Give it any closed outline as SVG path data in the path variable; it defaults to a five-point star.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="line-boil"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "path", "type": "string", "role": "content", "label": "Path", "description": "Closed outline as SVG path data, in any coordinate space. It is fitted to the frame.", "default": "M 100.00 0.00 L 123.51 67.64 L 195.11 69.10 L 138.04 112.36 L 158.78 180.90 L 100.00 140.00 L 41.22 180.90 L 61.96 112.36 L 4.89 69.10 L 76.49 67.64 Z"},
    {"id": "boil_every", "type": "number", "role": "motion", "label": "Boil every", "description": "Frames each drawing holds before the next one (3 is on threes).", "default": 3, "min": 1, "max": 8, "step": 1, "unit": "frames"},
    {"id": "drawings", "type": "number", "role": "motion", "label": "Drawings", "description": "Distinct drawings the boil cycles through.", "default": 3, "min": 1, "max": 8, "step": 1},
    {"id": "amplitude", "type": "number", "role": "motion", "label": "Wobble", "description": "Wobble strength; 1 is a gentle hand-drawn boil.", "default": 1, "min": 0, "max": 3, "step": 0.1},
    {"id": "stroke_width", "type": "number", "role": "style", "label": "Line weight", "description": "Base line weight in pixels at 720p.", "default": 9, "min": 2, "max": 24, "step": 1, "unit": "px"},
    {"id": "size", "type": "number", "role": "style", "label": "Size", "description": "Shape size as a fraction of the short frame side.", "default": 0.66, "min": 0.2, "max": 0.9, "step": 0.02},
    {"id": "line", "type": "color", "role": "style", "label": "Line", "description": "Outline color.", "default": "#111111"},
    {"id": "fill", "type": "color", "role": "style", "label": "Fill", "description": "Shape fill color.", "default": "#E5322D"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Background color.", "default": "#FFFFFF"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed.", "default": 1, "min": 0.1, "max": 4, "step": 0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Line Boil</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #ffffff; }
        .lb-stage { position: absolute; inset: 0; }
        .lb-stage svg { display: block; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="line-boil" data-duration="3" data-fps="30">
        <div id="lb-clip" class="lb-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <svg id="lb-svg" role="img" aria-label="Boiling hand-drawn outline">
            <polygon id="lb-fill" />
            <g id="lb-lines" stroke-linecap="round" fill="none"></g>
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            var FPS = 30;
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;

            // Seeded random in [0, 1): a string hash, so the same key always gives the same value.
            function rnd(key) {
              var h = 1779033703 ^ key.length;
              for (var i = 0; i < key.length; i++) {
                h = Math.imul(h ^ key.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
              }
              h = Math.imul(h ^ (h >>> 16), 2246822507);
              h = Math.imul(h ^ (h >>> 13), 3266489909);
              h ^= h >>> 16;
              return (h >>> 0) / 4294967296;
            }

            // Piecewise-linear map of x from inR to outR, optionally eased per segment and clamped.
            function interp(x, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var i = 0;
              if (x >= inR[n - 1]) i = n - 2;
              else if (x > inR[0]) { while (x > inR[i + 1]) i++; }
              var t = (x - inR[i]) / (inR[i + 1] - inR[i]);
              if (o.clamp !== false) t = Math.min(1, Math.max(0, t));
              if (o.easing) t = o.easing(t);
              return outR[i] + (outR[i + 1] - outR[i]) * t;
            }
            function clamp01(t) { return Math.min(1, Math.max(0, t)); }

            // Easings with Remotion's names; every one maps 0..1 to 0..1.
            var E = {
              linear: function (t) { return t; },
              quad: function (t) { return t * t; },
              cubic: function (t) { return t * t * t; },
              sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
              back: function (s) { return function (t) { return t * t * ((s + 1) * t - s); }; },
              out: function (f) { return function (t) { return 1 - f(1 - t); }; },
              inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; },
              bezier: function (x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var k = 0; k < 24; k++) {
                    var mt = 1 - t;
                    var bx = 3 * mt * mt * t * x1 + 3 * mt * t * t * x2 + t * t * t;
                    if (bx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var m = 1 - t;
                  return 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t;
                };
              }
            };

            var SVGNS = "http://www.w3.org/2000/svg";
            function el(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }

            var tl = gsap.timeline({ paused: true });
            // Runs draw(frame) from the timeline so seeking to a time always draws the same picture.
            function drive(frames, draw) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
              draw(0);
            }

            var pathData = str(vars.path, 'M 100.00 0.00 L 123.51 67.64 L 195.11 69.10 L 138.04 112.36 L 158.78 180.90 L 100.00 140.00 L 41.22 180.90 L 61.96 112.36 L 4.89 69.10 L 76.49 67.64 Z');
            var boilEvery = Math.max(1, Math.round(num(vars.boil_every, 3, 1, 8)));
            var drawings = Math.max(1, Math.round(num(vars.drawings, 3, 1, 8)));
            var amplitude = num(vars.amplitude, 1, 0, 3);
            var strokeWidth = num(vars.stroke_width, 9, 2, 24);
            var size = num(vars.size, 0.66, 0.2, 0.9);
            var lineColor = str(vars.line, "#111111");
            var fillColor = str(vars.fill, "#E5322D");
            var background = str(vars.background, "#FFFFFF");
            var speed = num(vars.speed, 1, 0.1, 4);
            root.style.background = background;

            var SAMPLES = 160, DRAW_END = 22, FILL_START = 28, FILL_END = 40;
            var unit = Math.min(W, H) / 720;
            var svg = document.getElementById("lb-svg");
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            var fillEl = document.getElementById("lb-fill"), linesG = document.getElementById("lb-lines");
            fillEl.setAttribute("fill", fillColor);
            linesG.setAttribute("stroke", lineColor);

            // Sample the outline, then fit it to the frame.
            var measure = el("path", { d: pathData });
            svg.appendChild(measure);
            var length = measure.getTotalLength(), raw = [];
            for (var i = 0; i < SAMPLES; i++) { var q = measure.getPointAtLength((length * i) / SAMPLES); raw.push({ x: q.x, y: q.y }); }
            svg.removeChild(measure);
            var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            raw.forEach(function (p) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
            var bw = maxX - minX, bh = maxY - minY;
            var scale = (size * Math.min(W, H)) / Math.max(bw, bh, 1e-6);
            var ox = W / 2 - (bw * scale) / 2, oy = H / 2 - (bh * scale) / 2;
            var base = raw.map(function (p) { return { x: ox + (p.x - minX) * scale, y: oy + (p.y - minY) * scale }; });

            // Low-frequency integer harmonics keep the closed loop seamless while giving the rubbery wobble of a re-traced cel line.
            function boil(points, seed, amp) {
              var harmonics = [2, 4, 9, 15].map(function (k, j) {
                return { k: k, weight: [1, 0.7, 0.45, 0.3][j], px: rnd(seed + "-px-" + k) * Math.PI * 2, py: rnd(seed + "-py-" + k) * Math.PI * 2 };
              });
              return points.map(function (p, i) {
                var s = i / points.length, dx = 0, dy = 0;
                harmonics.forEach(function (h) {
                  dx += h.weight * Math.sin(Math.PI * 2 * h.k * s + h.px);
                  dy += h.weight * Math.sin(Math.PI * 2 * h.k * s + h.py);
                });
                var nx = rnd(seed + "-nx-" + i) - 0.5, ny = rnd(seed + "-ny-" + i) - 0.5;
                return { x: p.x + amp * (dx * 0.6 + nx * 0.14), y: p.y + amp * (dy * 0.6 + ny * 0.14) };
              });
            }
            var amp = amplitude * 6.5 * unit;
            var cache = {};
            function drawing(d) {
              if (!cache[d]) cache[d] = { line: boil(base, "line-boil-" + d, amp), fill: boil(base, "line-boil-fill-" + d, amp * 1.4), phase: rnd("line-boil-pressure-" + d) * Math.PI * 2 };
              return cache[d];
            }
            var cx = base.reduce(function (sum, p) { return sum + p.x; }, 0) / base.length;
            var cy = base.reduce(function (sum, p) { return sum + p.y; }, 0) / base.length;
            var segs = [];
            for (var n = 0; n < SAMPLES; n++) segs.push(el("line", {}, linesG));
            var drawEase = E.inOut(E.cubic), fillEase = E.out(E.back(1.6));

            function draw(frame) {
              var t = frame * speed;
              var d = Math.floor(t / boilEvery) % drawings;
              var shape = drawing(d);
              var prog = interp(t, [0, DRAW_END], [0, 1], { easing: drawEase });
              var visible = Math.round(prog * SAMPLES);
              var fill = interp(t, [FILL_START, FILL_END], [0, 1], { easing: fillEase });
              if (fill > 0) {
                fillEl.setAttribute("points", shape.fill.map(function (p) { return p.x + "," + p.y; }).join(" "));
                fillEl.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + fill + ") translate(" + -cx + " " + -cy + ")");
                fillEl.setAttribute("opacity", 1);
              } else fillEl.setAttribute("opacity", 0);
              for (var i = 0; i < SAMPLES; i++) {
                var seg = segs[i];
                if (i >= visible) { seg.setAttribute("stroke-width", 0); continue; }
                var p = shape.line[i], next = shape.line[(i + 1) % SAMPLES], s = i / SAMPLES;
                var pressure = 0.75 + 0.25 * Math.sin(Math.PI * 2 * 3 * s + shape.phase) + 0.12 * Math.sin(Math.PI * 2 * 7 * s - shape.phase);
                // Taper the pen in and out while the line is still being drawn.
                var taper = prog < 1 ? Math.min(1, (visible - i) / 10, (i + 4) / 10) : 1;
                seg.setAttribute("x1", p.x); seg.setAttribute("y1", p.y);
                seg.setAttribute("x2", next.x); seg.setAttribute("y2", next.y);
                seg.setAttribute("stroke-width", strokeWidth * unit * pressure * taper);
              }
            }
            drive(Math.round(parseFloat(root.dataset.duration || "3") * FPS), draw);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["line-boil"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
