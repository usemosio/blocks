<html
  lang="en"
  data-composition-id="animated-line-chart"
  data-composition-duration="3"
  data-composition-variables='[{"id":"data","type":"string","role":"content","label":"Data","description":"Comma-separated numbers, at least two.","default":"12, 19, 8, 15, 22, 18, 28, 25, 32"},{"id":"stroke_color","type":"color","role":"style","label":"Line colour","description":"Colour of the line and dot.","default":"#22c55e"},{"id":"stroke_width","type":"number","role":"style","label":"Line width","description":"Width of the line.","default":4,"min":1,"max":16,"step":1,"unit":"px"},{"id":"grid_color","type":"color","role":"style","label":"Grid colour","description":"Colour of the grid and axes.","default":"#27272a"},{"id":"show_dot","type":"boolean","role":"style","label":"Leading dot","description":"Show a dot at the drawing tip.","default":true},{"id":"speed","type":"number","role":"motion","label":"Speed","description":"Playback speed multiplier.","default":1,"min":0.25,"max":4,"step":0.05,"unit":"x"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Animated Line Chart</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: #09090b; font-family: Geist, system-ui, sans-serif; }
        .ac-stage { position: absolute; inset: 0; }
        #ac-chart { position: absolute; overflow: visible; }

      </style>

      <div id="root" data-composition-id="animated-line-chart" data-duration="3" data-fps="30">
        <div id="ac-clip" class="ac-stage clip" data-start="0" data-duration="3" data-track-index="0">
<svg id="ac-chart" width="1000" height="500" viewBox="0 0 1000 500" style="overflow:visible"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            var raw = str(vars.data, "12, 19, 8, 15, 22, 18, 28, 25, 32").split(",").map(Number).filter(Number.isFinite);
            var data = raw.length >= 2 ? raw : [12, 19, 8, 15, 22, 18, 28, 25, 32];
            var stroke = str(vars.stroke_color, "#22c55e"), sw = num(vars.stroke_width, 4, 1, 16), grid = str(vars.grid_color, "#27272a");
            var showDot = bool(vars.show_dot, true), speed = num(vars.speed, 1, 0.25, 4);
            var svg = document.getElementById("ac-chart");
            var Wc = 1000, Hc = 500;
            // Fit the chart into the frame (more fill on a tall frame).
            fit(svg, Wc, Hc, root.clientHeight > root.clientWidth ? 0.9 : 0.78);
            var pad = 60, iw = Wc - pad * 2, ih = Hc - pad * 2;
            var min = Math.min.apply(null, data), max = Math.max.apply(null, data), range = max - min || 1;
            var pts = data.map(function (v, i) { return { x: pad + (i / (data.length - 1)) * iw, y: pad + ih - ((v - min) / range) * ih }; });
            var len = 0;
            for (var i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
            var rows = 4, cols = data.length - 1;
            for (var r = 0; r <= rows; r++) { var gy = pad + (r / rows) * ih; svgEl("line", { x1: pad, x2: pad + iw, y1: gy, y2: gy, stroke: grid, "stroke-width": 1 }, svg); }
            for (var c = 0; c <= cols; c++) { var gx = pad + (c / cols) * iw; svgEl("line", { x1: gx, x2: gx, y1: pad, y2: pad + ih, stroke: grid, "stroke-width": 1 }, svg); }
            svgEl("line", { x1: pad, x2: pad, y1: pad, y2: pad + ih, stroke: grid, "stroke-width": 2 }, svg);
            svgEl("line", { x1: pad, x2: pad + iw, y1: pad + ih, y2: pad + ih, stroke: grid, "stroke-width": 2 }, svg);
            var d = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" ");
            var path = svgEl("path", { d: d, fill: "none", stroke: stroke, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": len, "stroke-dashoffset": len }, svg);
            path.style.filter = "drop-shadow(0 0 12px " + stroke + "55)";
            var dot = svgEl("circle", { cx: pts[0].x, cy: pts[0].y, r: sw * 2, fill: stroke }, svg);
            dot.style.filter = "drop-shadow(0 0 8px " + stroke + ")";
            var totalFrames = Math.round(parseFloat(root.dataset.duration || "3") * 30);
            function draw(frame) {
              var f = frame * speed;
              var p = spring({ frame: f, fps: 30, durationInFrames: Math.round(totalFrames * 0.85), config: { damping: 200 } });
              path.setAttribute("stroke-dashoffset", len * (1 - p));
              var target = len * p, traveled = 0, dx = pts[0].x, dy = pts[0].y;
              for (var i = 1; i < pts.length; i++) {
                var ax = pts[i].x - pts[i - 1].x, ay = pts[i].y - pts[i - 1].y, seg = Math.hypot(ax, ay);
                if (traveled + seg >= target) { var t = (target - traveled) / seg; dx = pts[i - 1].x + ax * t; dy = pts[i - 1].y + ay * t; break; }
                traveled += seg; dx = pts[i].x; dy = pts[i].y;
              }
              dot.setAttribute("cx", dx); dot.setAttribute("cy", dy);
              dot.style.display = showDot && p > 0 && p < 1 ? "" : "none";
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, totalFrames, draw);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["animated-line-chart"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
