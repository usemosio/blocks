<!doctype html>
<!--
  Pixelate Region

  Rectangles of a scene covered with an opaque mosaic, the rest left untouched. The scene
  here is a settings page whose key rows are covered.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/pixelate-region/index.tsx

  furnished to do so, subject to the following conditions:

  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR

  LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a settings page) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="pixelate-region"
  data-composition-duration="3"
  data-composition-variables='[{"id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading of the sample settings page.", "default": "Project credentials"}, {"id": "rows", "type": "string", "role": "content", "label": "Rows", "description": "Rows as label | value, separated by semicolons (up to 5).", "default": "Account | casey@example.com; API key | sk_live_4f8a2c9e1b7d; Webhook secret | whsec_71c0d4e8ab35"}, {"id": "note", "type": "string", "role": "content", "label": "Note", "description": "Footnote under the rows.", "default": "Rotate keys from the dashboard — old ones stay valid for 24 hours."}, {"id": "redact", "type": "string", "role": "content", "label": "Covered rows", "description": "Numbers of the rows whose value is covered, separated by commas.", "default": "2,3"}, {"id": "cell_size", "type": "number", "role": "style", "label": "Cell size", "description": "Size of one mosaic cell. Pixel sizes are for a 1280×720 frame and scale with the frame.", "default": 24, "min": 6, "max": 72, "step": 2, "unit": "px"}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Mosaic cells are large; 0.75 keeps the sharp text around them crisp.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pixelate Region</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .pxr-stage {
          position: absolute;
          inset: 0;
        }
        .pxr-canvas,
        .pxr-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .pxr-scene {
          display: none;
        }
        .pxr-off .pxr-canvas {
          display: none;
        }
        .pxr-off .pxr-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="pixelate-region" data-duration="3" data-fps="30">
        <div id="pxr-clip" class="pxr-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <canvas id="pxr-scene0" class="pxr-scene pxr-fb"></canvas>
          <canvas id="pxr-canvas" class="pxr-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "pixelate-region";
            var root = document.getElementById("root");
            var stage = document.getElementById("pxr-clip");
            var canvas = document.getElementById("pxr-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "title", "type": "string", "default": "Project credentials"}, {"id": "rows", "type": "string", "default": "Account | casey@example.com; API key | sk_live_4f8a2c9e1b7d; Webhook secret | whsec_71c0d4e8ab35"}, {"id": "note", "type": "string", "default": "Rotate keys from the dashboard — old ones stay valid for 24 hours."}, {"id": "redact", "type": "string", "default": "2,3"}, {"id": "cell_size", "type": "number", "default": 24, "min": 6, "max": 72}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["pxr-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "secrets": a settings page with credentials (remocn's CanvasSceneSecrets).
            // drawSecrets returns the rectangle of every value (frame pixels) so a filter can cover them.
            var secretRows = pairs(V.rows, 5);
            var secretRects = [];
            function drawSecrets(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, "#0d0f14");
              secretRects = [];
              var portrait = W < H;
              var n = secretRows.length;
              var s, ox = 0, oy = 0, titleY, rowY, pitch, valueX, valueW, noteY, noteMaxW;
              if (!portrait) {
                s = Math.min(W / 1280, H / 720);
                ox = (W - 1280 * s) / 2; oy = (H - 720 * s) / 2;
                titleY = 104; rowY = 220; pitch = 112; valueX = 504; valueW = 600; 
                noteY = rowY + n * pitch + 12; noteMaxW = 1088;
              } else {
                s = W / 760;
                var content = 104 + n * 168 + 12 + 28 + 70;
                ox = 0; oy = (H - content * s) / 2;
                titleY = 0; rowY = 104; pitch = 168; valueX = 64; valueW = 632; 
                noteY = rowY + n * pitch + 12; noteMaxW = 632;
              }
              var labelX = portrait ? 64 : 96;
              ctx.fillStyle = INK;
              setFont(ctx, 600, 44 * s, SANS);
              setSpacing(ctx, -0.02 * 44 * s);
              ctx.fillText(V.title, ox + labelX * s, oy + (titleY + 22) * s);
              setSpacing(ctx, 0);
              secretRows.forEach(function (row, i) {
                var top = rowY + i * pitch;
                ctx.fillStyle = MUTED;
                setFont(ctx, 400, 34 * s, SANS);
                var lx = ox + labelX * s;
                var ly = oy + (top + 36) * s;
                if (portrait) { setFont(ctx, 400, 30 * s, SANS); ly = oy + (top - 16) * s; }
                ctx.fillText(row[0], lx, ly);
                var vy = top + 36;
                ctx.fillStyle = INK;
                fitFont(ctx, row[1] || "", (valueW - 8) * s, 400, 34 * s, MONO);
                ctx.fillText(row[1] || "", ox + valueX * s, oy + vy * s);
                secretRects.push({ x: ox + valueX * s, y: oy + top * s, w: valueW * s, h: 72 * s });
              });
              var ny = oy + (noteY + 28) * s;
              ctx.fillStyle = "#1e222c";
              ctx.fillRect(ox + labelX * s, ny - 28 * s, W - (ox + labelX * s) * 2, Math.max(1, s));
              ctx.fillStyle = MUTED;
              setFont(ctx, 400, 28 * s, SANS);
              wrapLines(ctx, V.note, noteMaxW * s).forEach(function (text, i) {
                ctx.fillText(text, ox + labelX * s, ny + (i + 0.5) * 28 * s * 1.4);
              });
            }

            function drawScenes() {
              drawSecrets(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform vec4 u_regions[8];
uniform int u_region_count;
uniform vec2 u_cell;

in vec2 v_uv;
out vec4 outColor;

const int TAPS = 3;

vec4 cellAverage(vec2 center, vec2 cell) {
  vec4 sum = vec4(0.0);
  for (int y = 0; y < TAPS; y++) {
    for (int x = 0; x < TAPS; x++) {
      vec2 offset =
        (vec2(float(x), float(y)) + 0.5) / float(TAPS) - 0.5;
      sum += texture(u_scene, center + offset * cell);
    }
  }
  return sum / float(TAPS * TAPS);
}

void main() {
  vec4 result = texture(u_scene, v_uv);
  vec2 cell = max(u_cell, vec2(0.0005));

  for (int i = 0; i < 8; i++) {
    if (i >= u_region_count) {
      continue;
    }
    vec4 region = u_regions[i];
    vec2 lo = region.xy;
    vec2 hi = region.xy + region.zw;
    vec2 hit = step(lo, v_uv) * step(v_uv, hi);
    if (hit.x * hit.y < 0.5) {
      continue;
    }
    vec2 center = lo + (floor((v_uv - lo) / cell) + 0.5) * cell;
    result = vec4(cellAverage(center, cell).rgb, 1.0);
  }

  outColor = result;
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              var cover = String(V.redact).split(",").map(function (n) { return parseInt(n, 10) - 1; }).filter(function (n) { return n >= 0; });
              gl.uniform2f(u("u_cell"), Math.max(V.cell_size * S, 1) / W, Math.max(V.cell_size * S, 1) / H);
              var regionsLoc = u("u_regions[0]");
              var countLoc = u("u_region_count");
              frameFn = function () {
                var packed = new Float32Array(32);
                var count = 0;
                cover.forEach(function (index) {
                  var r = secretRects[index];
                  if (!r || count >= 8) return;
                  packed[count * 4] = r.x / W;
                  packed[count * 4 + 1] = r.y / H;
                  packed[count * 4 + 2] = r.w / W;
                  packed[count * 4 + 3] = r.h / H;
                  count++;
                });
                gl.uniform4fv(regionsLoc, packed);
                gl.uniform1i(countLoc, count);
              };

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("pxr-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "3");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
