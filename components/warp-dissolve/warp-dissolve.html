<html
  lang="en"
  data-composition-id="warp-dissolve"
  data-composition-duration="2.5333"
  data-composition-variables='[
  {
    "id": "distortion",
    "type": "number",
    "role": "style",
    "label": "Distortion",
    "description": "How strongly the color field warps.",
    "default": 0.8,
    "min": 0,
    "max": 2,
    "step": 0.05
  },
  {
    "id": "swirl",
    "type": "number",
    "role": "style",
    "label": "Swirl",
    "description": "How much the field twists around the center.",
    "default": 0.6,
    "min": 0,
    "max": 2,
    "step": 0.05
  },
  {
    "id": "softness",
    "type": "number",
    "role": "style",
    "label": "Softness",
    "description": "How soft the color transitions are.",
    "default": 1,
    "min": 0,
    "max": 1,
    "step": 0.05
  },
  {
    "id": "colors",
    "type": "string",
    "role": "style",
    "label": "Colors",
    "description": "Comma-separated hex colors the field moves through.",
    "default": "#141318,#3a3a5c,#1f1d29,#8f88ae"
  },
  {
    "id": "speed",
    "type": "number",
    "role": "motion",
    "label": "Speed",
    "description": "Multiplier for the field’s own drift.",
    "default": 1,
    "min": 0,
    "max": 4,
    "step": 0.1
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Warp Dissolve</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .wpd-stage { position: absolute; inset: 0; }
        .wpd-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .wpd-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .wpd-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .wpd-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .wpd-pa { background: #141318; }
        .wpd-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .wpd-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .wpd-field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; }
        .wpd-pa { z-index: 1; } .wpd-pb { z-index: 3; }

      </style>

      <div id="root" data-composition-id="warp-dissolve" data-duration="2.5333" data-fps="30">
        <div id="wpd-clip" class="wpd-stage clip" data-start="0" data-duration="2.5333" data-track-index="0">
          <div id="wpd-a" class="wpd-panel wpd-pa"><div class="wpd-in"><span>Scene A</span><i class="wpd-bar"></i></div></div>
          <div id="wpd-b" class="wpd-panel wpd-pb"><div class="wpd-in"><span>Scene B</span><i class="wpd-bar"></i></div></div>
          <canvas id="wpd-field" class="wpd-field"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

function hex(c, f) {
  c = String(c || "").trim().replace("#", "");
  if (c.length === 3) c = c.split("").map(function (x) { return x + x; }).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(c)) c = f || "000000";
  var n = parseInt(c, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function palette(v, fallback) {
  var list = String(v || fallback).split(",").map(function (s) { return hex(s, "808080"); });
  return list.length ? list : [hex(fallback)];
}
function hash2(x, y, s) {
  var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  var a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  var sum = 0, amp = 0.5, tot = 0;
  for (var i = 0; i < oct; i++) {
    sum += amp * vnoise(x, y, s + i * 17);
    tot += amp; x = x * 2.03 + 11.3; y = y * 2.03 - 7.1; amp *= 0.5;
  }
  return sum / tot;
}
function mixc(o, a, b, t) {
  o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t;
}
// ramp through a list of colours with t in 0..1
function ramp(o, list, t) {
  t = clamp01(t) * (list.length - 1);
  var i = Math.min(list.length - 2, Math.floor(t));
  if (list.length === 1) { o[0] = list[0][0]; o[1] = list[0][1]; o[2] = list[0][2]; return; }
  var f = t - i; f = f * f * (3 - 2 * f);
  mixc(o, list[i], list[i + 1], f);
}
// Low-resolution 2D canvas filled per pixel; fn(u, v, out) gets centred coordinates (v spans -0.5..0.5).
function makeField(canvas, cell) {
  var W = Math.max(8, Math.round(root.clientWidth / cell)), H = Math.max(8, Math.round(root.clientHeight / cell));
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var img = ctx.createImageData(W, H);
  var out = [0, 0, 0];
  return {
    W: W, H: H,
    paint: function (fn) {
      var d = img.data, i = 0;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          fn((x + 0.5 - W / 2) / H, (y + 0.5 - H / 2) / H, out, x, y);
          d[i++] = out[0]; d[i++] = out[1]; d[i++] = out[2]; d[i++] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
  };
}

            var D = 2.5333;

var distortion = num(vars.distortion, 0.8, 0, 2), swirl = num(vars.swirl, 0.6, 0, 2), soft = num(vars.softness, 1, 0, 1), speed = num(vars.speed, 1, 0, 4);
var pal = palette(vars.colors, "#141318,#3a3a5c,#1f1d29,#8f88ae");
var A = document.getElementById("wpd-a"), B = document.getElementById("wpd-b"), canvas = document.getElementById("wpd-field");
var cv = makeField(canvas, 5);
function frame(p) {
  var dist = interp(p, [0, 0.5, 1], [distortion * 0.3, distortion, distortion * 0.4]), t = p * D * speed;
  var k = 3.6 - 1.4 * soft;
  cv.paint(function (u, v, o) {
    var r = Math.sqrt(u * u + v * v), ang = swirl * 2.2 * (1 - Math.min(1, r * 1.3)) + t * 0.15;
    var c = Math.cos(ang), s = Math.sin(ang), x = (u * c - v * s) * 2.2, y = (u * s + v * c) * 2.2;
    for (var i = 1; i < 4; i++) {
      x += dist * 0.55 * Math.sin(y * 1.6 + i * 1.7 + t * 0.5) / i;
      y += dist * 0.55 * Math.sin(x * 1.4 - i * 2.1 - t * 0.4) / i;
    }
    var w = fbm(x * 0.9 + t * 0.08, y * 0.9, 31, 3) * 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(x * 1.3 + y * 0.9));
    ramp(o, pal, clamp01((w - 0.5) * k + 0.5));
  });
  canvas.style.opacity = interp(p, [0, 0.32], [0, 1], inOutEase);
  A.style.opacity = interp(p, [0.2, 0.38], [1, 0]);
  A.style.scale = interp(p, [0, 0.38], [1, 1.16], inCubic);
  A.style.filter = "blur(" + interp(p, [0.04, 0.38], [0, 18]) + "px)";
  B.style.opacity = interp(p, [0.66, 0.82], [0, 1]);
  B.style.scale = interp(p, [0.66, 1], [1.18, 1], outCubic);
  B.style.filter = "blur(" + interp(p, [0.66, 0.92], [16, 0]) + "px)";
}

            drive("warp-dissolve", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
