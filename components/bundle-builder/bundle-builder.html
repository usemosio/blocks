<!doctype html>
<!--
  Bundle Builder

  Three or four product tiles drop one by one into an open box while the total counts up, then a "Hemat" badge lands on the box and the total steps down to the bundle price. Products, prices and the saving are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="bundle-builder"
  data-composition-duration="6"
  data-composition-variables='[
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Box title",
    "description": "Printed on the front of the box.",
    "default": "Paket Hemat"
  },
  {
    "id": "products",
    "type": "string",
    "role": "content",
    "label": "Products",
    "description": "Three or four products separated by semicolons, each as name|price.",
    "default": "Kopi susu|Rp18.000; Roti bakar|Rp15.000; Cookies|Rp12.000"
  },
  {
    "id": "total_label",
    "type": "string",
    "role": "content",
    "label": "Total label",
    "description": "Small label above the running total.",
    "default": "Total"
  },
  {
    "id": "saving",
    "type": "string",
    "role": "content",
    "label": "Saving",
    "description": "Amount saved by buying the bundle. The total steps down by this at the end. Use 0 or leave empty for no saving.",
    "default": "Rp15.000"
  },
  {
    "id": "saving_label",
    "type": "string",
    "role": "content",
    "label": "Saving label",
    "description": "Word in front of the saving amount on the badge.",
    "default": "Hemat"
  },
  {
    "id": "drop_gap",
    "type": "number",
    "role": "motion",
    "label": "Gap between drops",
    "description": "Seconds between two products dropping.",
    "default": 0.7,
    "min": 0.4,
    "max": 1.4,
    "step": 0.05
  },
  {
    "id": "box_color",
    "type": "color",
    "role": "style",
    "label": "Box colour",
    "description": "The box.",
    "default": "#e4e4e7"
  },
  {
    "id": "tile_color",
    "type": "color",
    "role": "style",
    "label": "Tile colour",
    "description": "Product tiles.",
    "default": "#ffffff"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The saving badge: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Bundle Builder</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--bb-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--bb-bg);
        }
        #root * { box-sizing: border-box; }
        .bb-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .bb-wrap { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
        .bb-top { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
        .bb-tl { font-size: calc(var(--u) * 40); font-weight: 500; color: var(--bb-muted); }
        .bb-total { font-size: calc(var(--u) * 190); font-weight: 700; letter-spacing: -0.055em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .bb-stage { position: absolute; left: 0; right: 0; }
        .bb-back, .bb-front { position: absolute; left: 0; right: 0; }
        .bb-back { bottom: 0; height: calc(var(--u) * 230); border-radius: calc(var(--u) * 28) calc(var(--u) * 28) calc(var(--u) * 36) calc(var(--u) * 36); background: color-mix(in srgb, var(--bb-box) 82%, #000); }
        .bb-front { bottom: 0; height: calc(var(--u) * 150); border-radius: calc(var(--u) * 20) calc(var(--u) * 20) calc(var(--u) * 36) calc(var(--u) * 36); background: var(--bb-box); z-index: 5; display: flex; align-items: center; padding: 0 calc(var(--u) * 44); box-shadow: 0 calc(var(--u) * -6) calc(var(--u) * 14) rgba(0,0,0,0.06); }
        .bb-ft { font-size: calc(var(--u) * 52); font-weight: 700; letter-spacing: -0.03em; }
        .bb-tile { position: absolute; z-index: 3; height: calc(var(--u) * 330); border-radius: calc(var(--u) * 30); background: var(--bb-tile); border: calc(var(--u) * 2) solid rgba(10,10,10,0.1); box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(0,0,0,0.08); padding: calc(var(--u) * 24) calc(var(--u) * 20) 0; text-align: center; overflow: hidden; }
        .bb-tn { font-size: calc(var(--u) * 38); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
        .bb-tp { margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 34); font-weight: 500; color: var(--bb-muted); font-variant-numeric: tabular-nums; }
        .bb-tile svg { position: absolute; left: 50%; bottom: calc(var(--u) * 44); width: calc(var(--u) * 170); height: calc(var(--u) * 170); margin-left: calc(var(--u) * -85); }
        .bb-badge { position: absolute; z-index: 6; right: calc(var(--u) * 28); bottom: calc(var(--u) * 52); padding: calc(var(--u) * 16) calc(var(--u) * 36); border-radius: calc(var(--u) * 60); background: var(--bb-main); color: #fff; font-size: calc(var(--u) * 54); font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; transform: rotate(-6deg); font-variant-numeric: tabular-nums; box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 16) rgba(0,0,0,0.16); }

      </style>

      <div id="root" data-composition-id="bundle-builder" data-duration="6" data-fps="30">
        <div id="bb-clip" class="bb-stage clip" data-start="0" data-duration="6" data-track-index="0">

          <div class="bb-wrap" id="bb-wrap">
            <div class="bb-top"><div class="bb-tl" id="bb-tl"></div><div class="bb-total" id="bb-total"></div></div>
            <div class="bb-stage" id="bb-stage"><div class="bb-back"></div><div class="bb-front"><span class="bb-ft" id="bb-ft"></span></div><div class="bb-badge" id="bb-badge"></div></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("bb", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", box: "#e4e4e7", tile: "#ffffff" });


            var u = U;
            root.style.setProperty("--bb-box", colr(vars.box_color, "#e4e4e7"));
            root.style.setProperty("--bb-tile", colr(vars.tile_color, "#ffffff"));
            var prods = list(vars.products, "Kopi susu|Rp18.000; Roti bakar|Rp15.000; Cookies|Rp12.000").slice(0, 4).map(function (s) { var a = s.split("|"); return { name: (a[0] || "").trim(), price: money(a[1] || "0") }; });
            var n = prods.length, sum = prods.reduce(function (t, p) { return t + p.price; }, 0);
            var saving = Math.min(sum, money(typeof vars.saving === "string" ? vars.saving : "Rp15.000"));
            var savingLabel = str(vars.saving_label, "Hemat");
            var gap = num(vars.drop_gap, 0.7, 0.4, 1.4);
            document.getElementById("bb-tl").textContent = str(vars.total_label, "Total");
            document.getElementById("bb-ft").textContent = str(vars.title, "Paket Hemat");
            var totalEl = document.getElementById("bb-total"), badge = document.getElementById("bb-badge");
            badge.textContent = savingLabel + " " + rp(saving);
            if (!saving) badge.style.display = "none";
            var gw = 960 * u, topH = 280 * u, ah = 560 * u, gh = topH + ah;
            var wrap = document.getElementById("bb-wrap"), stage = document.getElementById("bb-stage");
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            stage.style.top = topH + "px"; stage.style.height = ah + "px";
            var S = Math.min(1.3, (H * 0.88) / gh, (W * 0.94) / gw);
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });

            var GLYPH = [
              '<path d="M22 34h50l-5 44a8 8 0 0 1-8 7H35a8 8 0 0 1-8-7z" fill="ART"></path><path d="M72 42h6a10 10 0 0 1 0 20h-9" fill="none" stroke="ART" stroke-width="6" stroke-linecap="round"></path><rect x="28" y="40" width="38" height="7" rx="3" fill="DET"></rect>',
              '<rect x="14" y="36" width="72" height="46" rx="20" fill="ART"></rect><path d="M34 40v30M50 40v30M66 40v30" stroke="DET" stroke-width="5" stroke-linecap="round"></path>',
              '<circle cx="50" cy="58" r="38" fill="ART"></circle><circle cx="38" cy="48" r="4.5" fill="DET"></circle><circle cx="60" cy="44" r="4.5" fill="DET"></circle><circle cx="64" cy="66" r="4.5" fill="DET"></circle><circle cx="42" cy="70" r="4.5" fill="DET"></circle>',
              '<rect x="24" y="30" width="52" height="12" rx="5" fill="DET"></rect><rect x="20" y="42" width="60" height="46" rx="12" fill="ART"></rect><rect x="30" y="56" width="40" height="16" rx="5" fill="DET"></rect>'
            ];
            var art = "#d4d4d8", det = "rgba(10,10,10,0.2)";
            var gap2 = 20 * u, tw = Math.min(250 * u, (gw - 40 * u - (n - 1) * gap2) / n);
            var rowW = n * tw + (n - 1) * gap2, x0 = (gw - rowW) / 2, rnd = mulberry(9);
            var tiles = [];
            prods.forEach(function (p, i) {
              var t = el("div", "bb-tile", stage);
              t.style.width = tw + "px"; t.style.left = x0 + i * (tw + gap2) + "px"; t.style.top = ah - 100 * u - 330 * u + "px";
              el("div", "bb-tn", t).textContent = p.name; el("div", "bb-tp", t).textContent = rp(p.price);
              var sv = svg("svg", { viewBox: "0 0 100 100" }, t); sv.innerHTML = GLYPH[i % 4].replace(/ART/g, art).replace(/DET/g, det);
              tiles.push({ el: t, rot: Math.round((rnd() - 0.5) * 5 * 10) / 10 });
            });

            var counter = { v: 0 };
            function show(v) { totalEl.textContent = rp(Math.round(v / 500) * 500); }
            show(0);
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(".bb-top", { y: -30 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
            tl.fromTo([".bb-back", ".bb-front"], { y: 80 * u, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.2);
            var cum = 0, t0 = 0.9, last = t0;
            tiles.forEach(function (o, i) {
              var t = t0 + i * gap, d = 0.42;
              tl.fromTo(o.el, { y: -(topH + ah + 900 * u), rotation: o.rot * 4, opacity: 1 }, { y: 0, rotation: o.rot, duration: d, ease: "power2.in" }, t);
              tl.to(o.el, { y: -16 * u, duration: 0.11, ease: "power2.out" }, t + d);
              tl.to(o.el, { y: 0, duration: 0.11, ease: "power2.in" }, t + d + 0.11);
              var from = cum; cum += prods[i].price;
              tl.fromTo(counter, { v: from }, { v: cum, duration: 0.35, ease: "power2.out", immediateRender: false, onUpdate: function () { show(counter.v); } }, t + d - 0.05);
              tl.fromTo(totalEl, { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out" }, t + d);
              tl.to(totalEl, { scale: 1, duration: 0.2, ease: "power2.out" }, t + d + 0.08);
              last = t + d + 0.3;
            });
            tl.set(totalEl, { transformOrigin: "50% 60%" }, 0);
            var tb = last + 0.15;
            if (saving) {
              tl.fromTo(badge, { scale: 2.2, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.22, ease: "power3.in" }, tb);
              tl.to(stage, { y: 6 * u, duration: 0.06, ease: "power2.out" }, tb + 0.22);
              tl.to(stage, { y: 0, duration: 0.3, ease: "back.out(2.4)" }, tb + 0.28);
              var c2 = { v: sum };
              tl.fromTo(c2, { v: sum }, { v: sum - saving, duration: 0.8, ease: "power2.inOut", immediateRender: false, onUpdate: function () { show(c2.v); } }, tb + 0.3);
            }

            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["bundle-builder"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
