<!--

<html
  lang="en"
  data-composition-id="aurora-text"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text_before", "type": "string", "role": "content", "label": "Lead-in", "description": "Plain text before the aurora word. Leave empty to show only the aurora word.", "default": "Ship"},
    {"id": "text", "type": "string", "role": "content", "label": "Aurora text", "description": "The word or phrase filled with the drifting gradient.", "default": "beautiful"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 96, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "color_1", "type": "color", "role": "style", "label": "Colour 1", "description": "First gradient colour (also closes the loop).", "default": "#FF0080"},
    {"id": "color_2", "type": "color", "role": "style", "label": "Colour 2", "description": "Second gradient colour.", "default": "#7928CA"},
    {"id": "color_3", "type": "color", "role": "style", "label": "Colour 3", "description": "Third gradient colour.", "default": "#0070F3"},
    {"id": "color_4", "type": "color", "role": "style", "label": "Colour 4", "description": "Fourth gradient colour.", "default": "#38bdf8"},
    {"id": "text_color", "type": "color", "role": "style", "label": "Lead-in colour", "description": "Colour of the plain lead-in text.", "default": "#0a0a0a"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "The drift takes 10 / speed seconds for one pass (source default speed 1 takes 10 s, so 2 fits the block).", "default": 2, "min": 0.25, "max": 6, "step": 0.25}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Aurora Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .aut-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .aut-line { font-family: var(--font-display, Geist, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.05em; line-height: 1.1; white-space: pre; }
        .aut-aurora {
          display: inline;
          background-size: 200% auto;
          background-repeat: no-repeat;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }
      </style>

      <div id="root" data-composition-id="aurora-text" data-duration="5" data-fps="30">
        <div id="aut-clip" class="aut-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <span id="aut-line" class="aut-line"><span id="aut-before"></span><span id="aut-aurora" class="aut-aurora"></span></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Shrink an element's font until it fits a share of the frame width.
            function fit(el, size, share) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * share);
              if (el.scrollWidth > max) {
                size = Math.max(12, size * (max / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            // A seeded random generator, so every seek draws the same thing.
            function mulberry32(a) {
              return function () {
                a |= 0; a = (a + 0x6d2b79f5) | 0;
                var t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
            gsap.registerPlugin(CustomEase);
            var TAG = "aut";
            var bezN = 0;
            function bez(x1, y1, x2, y2) {
              return CustomEase.create(TAG + "-" + bezN++, "M0,0 C" + x1 + "," + y1 + " " + x2 + "," + y2 + " 1,1");
            }
            var tl = gsap.timeline({ paused: true });
            function finish() {
              var total = parseFloat(root.dataset.duration || "5");
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["aurora-text"] = tl;
            }

            var line = document.getElementById("aut-line");
            var before = document.getElementById("aut-before");
            var aurora = document.getElementById("aut-aurora");
            var lead = typeof vars.text_before === "string" ? vars.text_before : "Ship";
            before.textContent = lead ? lead + " " : "";
            before.style.color = col(vars.text_color, "#0a0a0a");
            aurora.textContent = str(vars.text, "beautiful");
            var c1 = col(vars.color_1, "#FF0080");
            aurora.style.backgroundImage = "linear-gradient(135deg, " + c1 + ", " + col(vars.color_2, "#7928CA") + ", " +
              col(vars.color_3, "#0070F3") + ", " + col(vars.color_4, "#38bdf8") + ", " + c1 + ")";
            fit(line, num(vars.font_size, 96, 12, 260), 0.9);
            var cycle = 10 / num(vars.speed, 2, 0.25, 6);
            var total = parseFloat(root.dataset.duration || "5");
            // Source keyframes (aurora, ease-in-out between them, alternating direction): the
            // gradient slides 0 -> 50 -> 100 -> 50 -> 0 % of its overhang. Rotation and scale in
            // the source sit on an inline element and do not render, so only the slide is ported.
            var inOut = bez(0.42, 0, 0.58, 1);
            var path = [0, 50, 100, 50, 0];
            function slide(u) {
              var seg = Math.min(3, Math.floor(u * 4));
              var local = u * 4 - seg;
              return path[seg] + (path[seg + 1] - path[seg]) * inOut(local);
            }
            var clock = { t: 0 };
            function draw(t) {
              var k = Math.floor(t / cycle);
              var u = (t - k * cycle) / cycle;
              if (k % 2 === 1) u = 1 - u;
              aurora.style.backgroundPosition = slide(u).toFixed(3) + "% 50%";
            }
            tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);

            finish();
          })();
        </script>
      </div>
    </template>
  </body>
</html>
