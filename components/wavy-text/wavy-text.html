<!doctype html>
<!--
  Wavy Text

  Letters bob up and down in a continuous wave, each starting a beat after the one before, like a ripple running along the word.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/karthikmudunuri/eldoraui/blob/6bb8fd211ecbdfa983f5780bead27d9f3890f20a/apps/www/registry/eldoraui/wavy-text.tsx

<html
  lang="en"
  data-composition-id="wavy-text"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short phrase.", "default": "Wavy Text"},
    {"id": "amplitude", "type": "number", "role": "motion", "label": "Amplitude", "description": "How far each letter travels up and down from centre. Scales with font size (72px = source).", "default": 10, "min": 0, "max": 80, "step": 1, "unit": "px"},
    {"id": "duration", "type": "number", "role": "motion", "label": "Half-wave time", "description": "Seconds for a letter to go from bottom to top.", "default": 0.5, "min": 0.15, "max": 2, "step": 0.05, "unit": "s"},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between one letter and the next.", "default": 0.2, "min": 0.02, "max": 0.6, "step": 0.01, "unit": "s"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels. The source is built for 72px type; its pixel offsets scale with this size.", "default": 120, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Wavy Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .wvt-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .wvt-line { display: flex; justify-content: center; gap: 0.11em; line-height: 1.3; letter-spacing: -0.02em; white-space: pre; text-shadow: 0 1px 2px rgba(0,0,0,0.12); }
        .wvt-ch { display: inline-block; }
      </style>

      <div id="root" data-composition-id="wavy-text" data-duration="4" data-fps="30">
        <div id="wvt-clip" class="wvt-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="wvt-line" class="wvt-line" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "4");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("wvt-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["wavy-text"] = tl;
            }


            var line = document.getElementById("wvt-line");
            var text = str(vars.text, "Wavy Text");
            var size = num(vars.font_size, 72, 12, 260), f = size / 72;
var amp = num(vars.amplitude, 10, 0, 80) * f, dur = num(vars.duration, 0.5, 0.15, 2), stg = num(vars.stagger, 0.2, 0.02, 0.6);
            line.style.fontSize = size + "px"; line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "700");
            line.setAttribute("aria-label", text);
            var spans = Array.from(text).map(function (ch) { var s = document.createElement("span"); s.className = "wvt-ch"; s.textContent = ch === " " ? " " : ch; line.appendChild(s); return s; });
            var maxW = root.clientWidth * 0.92;
            if (line.scrollWidth > maxW) { var r = maxW / line.scrollWidth; size *= r; amp *= r; line.style.fontSize = size + "px"; }
            var tl = gsap.timeline({ paused: true });
            spans.forEach(function (s, i) {
              var t0 = i * stg, reps = Math.max(0, Math.floor((total - t0) / dur) - 1);
              gsap.set(s, { y: amp });
              tl.fromTo(s, { y: amp }, { y: -amp, duration: dur, ease: EIO, repeat: reps, yoyo: true, immediateRender: true }, t0);
            });
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
