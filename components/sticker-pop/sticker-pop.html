<!doctype html>
<!--
  Sticker Pop

  Flat, bright field with thick-outlined paper stickers that pop in with overshoot: a price tag that counts up,
  a BARU burst, a PROMO pill, small chips and a mascot sidekick who bounces in with a speech sticker. Everything
  is drawn with CSS and SVG, no images.

  Extracted from the Mosio recipe stiker-ceria by usemosio/blocks.
-->
<html
  lang="en"
  data-composition-id="sticker-pop"
  data-composition-duration="6"
  data-composition-variables='[
    {"id": "lead", "type": "string", "role": "content", "label": "Lead word", "description": "Small line above the price tag.", "default": "Cuma"},
    {"id": "price", "type": "string", "role": "content", "label": "Price", "description": "Price on the tag. A number in it counts up from zero (dots as thousands separators).", "default": "Rp18.000"},
    {"id": "unit", "type": "string", "role": "content", "label": "Under the price", "description": "Small line under the price on the tag.", "default": "per cup, dingin & segar"},
    {"id": "burst_text", "type": "string", "role": "content", "label": "Burst sticker", "description": "Word in the star burst on the corner of the tag.", "default": "BARU"},
    {"id": "pill_text", "type": "string", "role": "content", "label": "Pill sticker", "description": "Word on the tilted pill.", "default": "PROMO"},
    {"id": "chip_1", "type": "string", "role": "content", "label": "Chip 1", "description": "First small sticker.", "default": "Gratis antar"},
    {"id": "chip_2", "type": "string", "role": "content", "label": "Chip 2", "description": "Second small sticker.", "default": "Buka tiap hari"},
    {"id": "say", "type": "string", "role": "content", "label": "Mascot says", "description": "Speech sticker next to the mascot. Leave empty to hide it.", "default": "Siap antar!"},
    {"id": "show_mascot", "type": "boolean", "role": "style", "label": "Mascot", "description": "Show the small mascot sidekick.", "default": true},
    {"id": "field_color", "type": "color", "role": "style", "label": "Field", "description": "The flat background colour.", "default": "#ffd23f"},
    {"id": "paper_color", "type": "color", "role": "style", "label": "Paper", "description": "Sticker paper, mascot highlights.", "default": "#fff8ec"},
    {"id": "ink_color", "type": "color", "role": "style", "label": "Ink", "description": "Sticker outlines, hard shadows and text.", "default": "#1c1b22"},
    {"id": "accent_color", "type": "color", "role": "style", "label": "Accent", "description": "The burst, the pill and the mascot cheeks.", "default": "#ff5fa2"},
    {"id": "fresh_color", "type": "color", "role": "style", "label": "Fresh green", "description": "One chip.", "default": "#3ddc97"},
    {"id": "mascot_color", "type": "color", "role": "style", "label": "Mascot", "description": "The mascot body.", "default": "#a9ddff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Sticker Pop</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Poppins:wght@500;800&amp;display=block" />
      <style>
        #root {
          --sp-field: #ffd23f; --sp-paper: #fff8ec; --sp-ink: #1c1b22; --sp-accent: #ff5fa2; --sp-fresh: #3ddc97; --sp-mascot: #a9ddff;
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; background: var(--sp-field); color: var(--sp-ink);
          font-family: Poppins, system-ui, sans-serif; font-weight: 800;
        }
        #root * { box-sizing: border-box; }
        #sp-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
        .sp-bubble { position: absolute; border-radius: 50%; border: 6px solid var(--sp-ink); background: color-mix(in oklab, var(--sp-paper) 70%, transparent); }
        .sp-world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
        .sp-it { position: absolute; transform-origin: 50% 50%; }
        .sp-sticker { background: var(--sp-paper); color: var(--sp-ink); border: 8px solid var(--sp-ink); border-radius: 36px; box-shadow: 0 16px 0 var(--sp-ink); white-space: nowrap; }
        .sp-lead { left: -300px; width: 600px; top: -500px; text-align: center; font-size: 70px; font-weight: 800; }
        .sp-tag { left: -390px; top: -350px; width: 780px; height: 400px; border-radius: 60px; }
        .sp-hole { position: absolute; left: 44px; top: 50%; width: 56px; height: 56px; margin-top: -28px; border-radius: 50%; background: var(--sp-field); border: 7px solid var(--sp-ink); }
        .sp-price { position: absolute; left: 120px; right: 24px; top: 56px; text-align: center; font-family: "Archivo Black", Poppins, sans-serif; font-weight: 400; font-size: 112px; line-height: 1.5; letter-spacing: -3px; }
        .sp-unit { position: absolute; left: 120px; right: 24px; top: 262px; text-align: center; font-size: 46px; }
        .sp-burst { left: -470px; top: -490px; width: 250px; height: 250px; display: grid; place-items: center; }
        .sp-burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        .sp-burst span { position: relative; font-family: "Archivo Black", Poppins, sans-serif; font-weight: 400; font-size: 58px; letter-spacing: -1px; color: var(--sp-ink); transform: rotate(-4deg); }
        .sp-pill { left: 100px; top: 20px; padding: 18px 44px; font-family: "Archivo Black", Poppins, sans-serif; font-weight: 400; font-size: 62px; border-radius: 999px; background: var(--sp-accent); color: #14161a; }
        .sp-chip { padding: 22px 38px; font-size: 48px; border-radius: 999px; }
        .sp-c1 { left: -430px; top: 150px; }
        .sp-c2 { left: 20px; top: 270px; background: var(--sp-fresh); }
        .sp-mascot { left: -280px; top: 330px; width: 480px; height: 480px; }
        .sp-say { left: 120px; top: 440px; padding: 24px 36px; font-size: 48px; border-radius: 44px; transform-origin: 0 100%; }
        .sp-spark { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; }
        .sp-m-shadow { fill: var(--sp-ink); } .sp-m-body { fill: var(--sp-mascot); stroke: var(--sp-ink); } .sp-m-ink { fill: var(--sp-ink); }
        .sp-m-hl { fill: var(--sp-paper); } .sp-m-hlline { fill: none; stroke: var(--sp-paper); } .sp-m-cheek { fill: var(--sp-accent); } .sp-m-tongue { fill: none; stroke: var(--sp-accent); }
        /* Landscape */
        #sp-stage.sp-land .sp-lead { left: -760px; width: 760px; top: -380px; font-size: 62px; }
        #sp-stage.sp-land .sp-tag { left: -760px; top: -260px; width: 760px; height: 390px; }
        #sp-stage.sp-land .sp-burst { left: -850px; top: -400px; }
        #sp-stage.sp-land .sp-pill { left: -140px; top: -300px; }
        #sp-stage.sp-land .sp-c1 { left: 130px; top: -150px; }
        #sp-stage.sp-land .sp-c2 { left: 200px; top: -20px; }
        #sp-stage.sp-land .sp-mascot { left: 300px; top: 100px; width: 420px; height: 420px; }
        #sp-stage.sp-land .sp-say { left: 40px; top: 250px; }
      </style>

      <div id="root" data-composition-id="sticker-pop" data-duration="6" data-fps="30">
        <div id="sp-clip" class="clip" data-start="0" data-duration="6" data-track-index="0" style="position:absolute;inset:0">
          <div id="sp-stage">
            <div id="sp-bubbles"></div>
            <div class="sp-world" id="sp-world">
              <div class="sp-it sp-lead" id="sp-lead"></div>
              <div class="sp-it sp-sticker sp-tag" id="sp-tag"><div class="sp-hole"></div><div class="sp-price" id="sp-price"></div><div class="sp-unit" id="sp-unit"></div></div>
              <div class="sp-it sp-burst" id="sp-burst">
                <svg viewBox="0 0 100 100"><polygon id="sp-burstshape" points="" fill="var(--sp-accent)" stroke="var(--sp-ink)" stroke-width="3.2" stroke-linejoin="round" /></svg>
                <span id="sp-btext"></span>
              </div>
              <div class="sp-it sp-sticker sp-pill" id="sp-pill"></div>
              <div class="sp-it sp-sticker sp-chip sp-c1" id="sp-c1"></div>
              <div class="sp-it sp-sticker sp-chip sp-c2" id="sp-c2"></div>
              <svg class="sp-it sp-mascot" id="sp-mascot" viewBox="0 0 400 400">
                <ellipse class="sp-m-shadow" cx="200" cy="378" rx="120" ry="16" opacity="0.18" />
                <g class="sp-mb" id="sp-mb">
                  <path class="sp-m-body" d="M200 70 C300 70 352 140 352 228 C352 318 290 362 200 362 C110 362 48 318 48 228 C48 140 100 70 200 70Z" stroke-width="12" />
                  <path class="sp-m-hlline" d="M110 150 C125 118 152 102 182 98" stroke-width="16" stroke-linecap="round" />
                  <circle class="sp-m-hl" cx="95" cy="190" r="9" />
                  <g id="sp-eyes">
                    <ellipse class="sp-m-ink" cx="160" cy="215" rx="20" ry="28" /><ellipse class="sp-m-ink" cx="240" cy="215" rx="20" ry="28" />
                    <circle class="sp-m-hl" cx="166" cy="204" r="7" /><circle class="sp-m-hl" cx="246" cy="204" r="7" />
                  </g>
                  <ellipse class="sp-m-cheek" cx="120" cy="262" rx="24" ry="14" opacity="0.75" /><ellipse class="sp-m-cheek" cx="280" cy="262" rx="24" ry="14" opacity="0.75" />
                  <path class="sp-m-ink" d="M168 268 C182 298 218 298 232 268 Z" />
                  <path class="sp-m-tongue" d="M184 284 C194 292 206 292 216 284" stroke-width="8" stroke-linecap="round" />
                </g>
              </svg>
              <div class="sp-it sp-sticker sp-say" id="sp-say"></div>
              <div id="sp-sparks"></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var $ = function (id) { return document.getElementById(id); };
            var NS = "http://www.w3.org/2000/svg";
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function str(v, d) { return typeof v === "string" && v.trim() ? v.trim() : d; }
            function txt(v, d) { return typeof v === "string" ? v.trim() : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            [["field_color", "--sp-field", "#ffd23f"], ["paper_color", "--sp-paper", "#fff8ec"], ["ink_color", "--sp-ink", "#1c1b22"], ["accent_color", "--sp-accent", "#ff5fa2"], ["fresh_color", "--sp-fresh", "#3ddc97"], ["mascot_color", "--sp-mascot", "#a9ddff"]]
              .forEach(function (c) { root.style.setProperty(c[1], colr(vars[c[0]], c[2])); });

            var stage = $("sp-stage"), W = root.clientWidth || 1080, H = root.clientHeight || 1920;
            var land = W > H * 1.05, RW, RH, k;
            if (land) { RH = 1080; RW = Math.round(1080 * W / H); k = H / RH; stage.classList.add("sp-land"); } else { RW = 1080; RH = Math.round(1080 * H / W); k = W / RW; }
            stage.style.width = RW + "px"; stage.style.height = RH + "px"; stage.style.transform = "scale(" + k + ")";

            $("sp-lead").textContent = str(vars.lead, "Cuma");
            $("sp-unit").textContent = str(vars.unit, "per cup, dingin & segar");
            $("sp-btext").textContent = str(vars.burst_text, "BARU");
            $("sp-pill").textContent = str(vars.pill_text, "PROMO");
            $("sp-c1").textContent = str(vars.chip_1, "Gratis antar");
            $("sp-c2").textContent = str(vars.chip_2, "Buka tiap hari");
            var say = txt(vars.say, "Siap antar!"); $("sp-say").textContent = say;
            var mascotOn = bool(vars.show_mascot, true);
            if (!mascotOn) { $("sp-mascot").style.display = "none"; $("sp-say").style.display = "none"; }
            if (!say) $("sp-say").style.display = "none";
            // Burst outline: a 14-point star.
            var pts = []; for (var i = 0; i < 28; i++) { var a = (i / 28) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 40 : 49; pts.push((50 + Math.cos(a) * r).toFixed(1) + "," + (50 + Math.sin(a) * r).toFixed(1)); }
            $("sp-burstshape").setAttribute("points", pts.join(" "));
            // Price: a number in it counts up from zero.
            var price = str(vars.price, "Rp18.000"), pm = /^(\D*)([\d.,]+)(\D*)$/.exec(price), pTarget = null, pPre = "", pSuf = "";
            if (pm) { pTarget = parseInt(pm[2].replace(/[.,]/g, ""), 10); pPre = pm[1]; pSuf = pm[3]; }
            function fmtP(n) { return pPre + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + pSuf; }
            $("sp-price").textContent = pTarget === null || !Number.isFinite(pTarget) ? price : fmtP(0);
            // Price font shrinks for long strings
            var plen = price.length; if (plen > 8) $("sp-price").style.fontSize = Math.max(56, 112 * 8 / plen) + "px";

            // Bubbles
            var bub = $("sp-bubbles");
            [[0.1, 0.62, 90], [0.8, 0.5, 120], [0.84, 0.82, 70], [0.07, 0.8, 130], [0.2, 0.15, 60], [0.75, 0.1, 90]].forEach(function (b) {
              var d = document.createElement("div"); d.className = "sp-bubble"; d.style.left = Math.round(b[0] * RW - b[2] / 2) + "px"; d.style.top = Math.round(b[1] * RH - b[2] / 2) + "px"; d.style.width = d.style.height = b[2] + "px"; bub.appendChild(d);
            });

            var tl = gsap.timeline({ paused: true });
            var world = "#sp-world";
            // Sparks: six four-point stars around the tag, popping and fading.
            function sparks(cx, cy, radius, at) {
              var holder = $("sp-sparks");
              for (var i = 0; i < 6; i++) {
                var a = (i / 6) * Math.PI * 2 + 0.3, svg = document.createElementNS(NS, "svg");
                svg.setAttribute("viewBox", "0 0 90 90"); svg.setAttribute("class", "sp-spark");
                svg.style.left = (cx + Math.cos(a) * radius) + "px"; svg.style.top = (cy + Math.sin(a) * radius) + "px";
                var p = document.createElementNS(NS, "path"); p.setAttribute("d", "M45 0 C49 30 60 41 90 45 C60 49 49 60 45 90 C41 60 30 49 0 45 C30 41 41 30 45 0Z");
                p.style.fill = i % 2 ? "var(--sp-paper)" : "var(--sp-accent)"; p.style.stroke = "var(--sp-ink)"; p.style.strokeWidth = "5px"; svg.appendChild(p); holder.appendChild(svg);
                var s = i % 2 ? 0.6 : 1;
                tl.fromTo(svg, { scale: 0, rotation: -90 }, { scale: s, rotation: 0, duration: 0.35, ease: "back.out(3)" }, at + i * 0.03)
                  .to(svg, { scale: 0, duration: 0.25, ease: "power2.in" }, at + 0.75 + i * 0.03);
              }
            }
            gsap.set(["#sp-lead", "#sp-tag", "#sp-burst", "#sp-pill", "#sp-c1", "#sp-c2", "#sp-mascot", "#sp-say"], { autoAlpha: 0 });
            tl.fromTo(world, { scale: 1 }, { scale: 1.05, duration: 6, ease: "none" }, 0);
            tl.fromTo("#sp-lead", { scale: 1.9, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "circ.out" }, 0.1)
              .fromTo("#sp-tag", { scale: 0.3, rotation: -9, autoAlpha: 0 }, { scale: 1, rotation: -2, autoAlpha: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.4);
            var acc = { v: 0 };
            if (pTarget !== null && Number.isFinite(pTarget)) tl.to(acc, { v: pTarget, duration: 0.7, ease: "power3.out", onUpdate: function () { $("sp-price").textContent = fmtP(acc.v); } }, 0.6);
            var cxTag = land ? -380 : 0, cyTag = land ? -65 : -150;
            sparks(cxTag, cyTag, land ? 420 : 520, 0.95);
            tl.fromTo("#sp-burst", { scale: 0, rotation: 40, autoAlpha: 0 }, { scale: 1, rotation: -14, autoAlpha: 1, duration: 0.45, ease: "back.out(3)" }, 1.0)
              .fromTo("#sp-pill", { scale: 0, rotation: 30, autoAlpha: 0 }, { scale: 1, rotation: 7, autoAlpha: 1, duration: 0.45, ease: "back.out(2.6)" }, 1.3)
              .fromTo("#sp-c1", { scale: 0, rotation: -12, autoAlpha: 0 }, { scale: 1, rotation: -3, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 1.6)
              .fromTo("#sp-c2", { scale: 0, rotation: 12, autoAlpha: 0 }, { scale: 1, rotation: 3, autoAlpha: 1, duration: 0.4, ease: "back.out(2.4)" }, 1.85);
            if (mascotOn) {
              tl.fromTo("#sp-mascot", { y: 340, scale: 0.7, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.55, ease: "back.out(1.8)" }, 2.0);
              if (say) tl.fromTo("#sp-say", { scale: 0, rotation: -10, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2.6)" }, 2.5);
              tl.fromTo("#sp-mb", { y: 0 }, { y: -18, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.5);
              [3.2, 4.6, 5.4].forEach(function (t) { tl.to("#sp-eyes", { scaleY: 0.1, transformOrigin: "50% 60%", duration: 0.07, yoyo: true, repeat: 1, ease: "none" }, t); });
            }
            // Idle wobble so the stickers feel alive until the end.
            tl.to("#sp-tag", { rotation: 0.5, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 1.4)
              .to("#sp-pill", { rotation: 4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 2.0)
              .to("#sp-burst", { rotation: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 2.0);
            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["sticker-pop"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
