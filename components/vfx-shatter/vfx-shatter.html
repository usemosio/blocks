  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/vfx-shatter/vfx-shatter.html

  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame; rewritten from three.js (not loaded) to raw WebGL2 (the crack shader is unchanged apart from GLSL ES 3.0 syntax and the shard meshes are drawn with the same seeded Voronoi cells, fixed-step physics replayed from zero each frame, and Euler XYZ transforms); the two pages are drawn on 2D canvases from variables instead of being captured from live DOM with the experimental HTML-in-Canvas API, and their product copy is replaced by placeholders; the canvas is drawn at the `resolution` variable.

              "#version 300 es",
              "in vec2 aPos;",
              "out vec2 v_uv;",
              "void main() { v_uv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5); gl_Position = vec4(aPos, 0.0, 1.0); }"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;
out vec4 outColor;
in vec2 v_uv;
uniform sampler2D tPanel;
uniform float uCrackProgress;
uniform float uAspect;
uniform float uTime;
uniform float uOpacity;

// the panel texture is stored top-down; the shader works with y up
vec4 panel(vec2 uv) {
  return texture(tPanel, vec2(uv.x, 1.0 - uv.y));
}

// Hash functions for Voronoi
vec2 hash22(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

// Voronoi distance for crack pattern
float voronoi(vec2 p) {
  vec2 ip = floor(p);
  vec2 fp = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      vec2 neighbor = vec2(float(x), float(y));
      vec2 point = hash22(ip + neighbor);
      vec2 diff = neighbor + point - fp;
      float dist = length(diff);
      if (dist < d1) {
        d2 = d1;
        d1 = dist;
      } else if (dist < d2) {
        d2 = dist;
      }
    }
  }
  return d2 - d1;
}

void main() {
  vec2 vUv = vec2(v_uv.x, 1.0 - v_uv.y);
  vec4 color = panel(vUv);

  if (uCrackProgress <= 0.0) {
    outColor = vec4(color.rgb, uOpacity);
    return;
  }

  // Distance from center (in UV space, aspect-corrected)
  vec2 center = vec2(0.5, 0.5);
  vec2 uv_aspect = vec2((vUv.x - 0.5) * uAspect, vUv.y - 0.5);
  float distFromCenter = length(uv_aspect);

  // Crack wavefront: radiates outward based on progress
  float maxRadius = length(vec2(uAspect * 0.5, 0.5));
  float wavefront = uCrackProgress * maxRadius * 1.4;

  if (distFromCenter > wavefront) {
    outColor = vec4(color.rgb, uOpacity);
    return;
  }

  // Multi-scale Voronoi for cracks
  vec2 crackUV = vUv * vec2(uAspect, 1.0);
  float v1 = voronoi(crackUV * 8.0);
  float v2 = voronoi(crackUV * 16.0);
  float v3 = voronoi(crackUV * 4.0);

  // Blend scales based on distance from center
  float normalizedDist = distFromCenter / maxRadius;
  float crackPattern = mix(v1, v2, smoothstep(0.0, 0.5, normalizedDist));
  crackPattern = mix(crackPattern, v3, smoothstep(0.3, 0.8, normalizedDist) * 0.4);

  // Crack intensity: thinner = more crack-like
  float crackWidth = 0.04 + uCrackProgress * 0.02;
  float crack = smoothstep(crackWidth, 0.0, crackPattern);

  // Fade in based on wavefront proximity
  float waveFade = smoothstep(wavefront, wavefront * 0.6, distFromCenter);
  crack *= waveFade;

  // Impact point glow
  float impactGlow = exp(-distFromCenter * 6.0) * uCrackProgress * 0.6;

  // Refraction distortion along cracks
  vec2 distortUV = vUv;
  if (crack > 0.1) {
    vec2 offset = (hash22(floor(crackUV * 8.0)) - 0.5) * 0.008 * crack;
    distortUV += offset;
  }
  vec4 distortedColor = panel(distortUV);

  // Composite: panel + bright crack lines + refraction
  vec3 crackColor = vec3(0.85, 0.92, 1.0);
  vec3 result = mix(distortedColor.rgb, crackColor, crack * 0.7);
  result += vec3(impactGlow * 0.3, impactGlow * 0.4, impactGlow * 0.6);

  // Glass surface highlight along cracks
  float highlight = crack * 0.15 * (1.0 - normalizedDist);
  result += vec3(highlight);

  outColor = vec4(result, uOpacity);
}
`;

            var gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var prog = gl.createProgram();
              gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.bindAttribLocation(prog, 0, "aPos");
              gl.linkProgram(prog);
              if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link failed");
              gl.useProgram(prog);
              var quad = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, quad);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              gl.viewport(0, 0, cw, ch);
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
              gl.enable(gl.DEPTH_TEST);
              function u(name) { return gl.getUniformLocation(prog, name); }
              // second program: the shards (panel A cut into Voronoi cells, each with its own transform)
              var SHARD_VS = "#version 300 es\nin vec2 aPos;\nin vec2 aUv;\nuniform mat4 uModel;\nuniform vec2 uHalf;\nout vec2 vUv;\nvoid main() { vUv = aUv; vec4 p = uModel * vec4(aPos, 0.0, 1.0); gl_Position = vec4(p.x / uHalf.x, p.y / uHalf.y, p.z * -0.02, 1.0); }";
              var SHARD_FS = "#version 300 es\nprecision highp float;\nin vec2 vUv;\nout vec4 outColor;\nuniform sampler2D tPanel;\nuniform float uOpacity;\nvoid main() { outColor = vec4(texture(tPanel, vUv).rgb, uOpacity); }";
              var sprog = gl.createProgram();
              gl.attachShader(sprog, compile(gl.VERTEX_SHADER, SHARD_VS));
              gl.attachShader(sprog, compile(gl.FRAGMENT_SHADER, SHARD_FS));
              gl.bindAttribLocation(sprog, 0, "aPos");
              gl.bindAttribLocation(sprog, 1, "aUv");
              gl.linkProgram(sprog);
              if (!gl.getProgramParameter(sprog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(sprog) || "link failed");
              var shardBuf = shardGeo.map(function (g) { var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, g, gl.STATIC_DRAW); return b; });
              var texs = panels.map(function (c, unit) {
                var tx = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, tx);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
                return tx;
              });
              gl.useProgram(prog);
              gl.uniform1i(u("tPanel"), 0);
              gl.uniform1f(u("uAspect"), aspect);
              var crackLoc = u("uCrackProgress"), opacityLoc = u("uOpacity"), timeLoc = u("uTime");
              gl.useProgram(sprog);
              gl.uniform1i(gl.getUniformLocation(sprog, "tPanel"), 0);
              gl.uniform2f(gl.getUniformLocation(sprog, "uHalf"), aspect / 2, 0.5);
              var sModelLoc = gl.getUniformLocation(sprog, "uModel"), sOpacityLoc = gl.getUniformLocation(sprog, "uOpacity");
              function fullPlane(unit, crack, opacity, t) {
                gl.useProgram(prog);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texs[unit]);
                gl.uniform1f(crackLoc, crack);
                gl.uniform1f(opacityLoc, opacity);
                gl.uniform1f(timeLoc, t);
                gl.bindBuffer(gl.ARRAY_BUFFER, quad);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
                gl.disableVertexAttribArray(1);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              }
              paint = function (t) {

                gl.clearColor(BGC[0], BGC[1], BGC[2], 1);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                gl.disable(gl.DEPTH_TEST);
                if (t < SHATTER_START) {
                  // clean glass, then the cracks spread from the centre
                  var ct = t < CRACK_START ? 0 : Math.min(1, (t - CRACK_START) / (CRACK_END - CRACK_START));
                  fullPlane(0, ct * ct, 1, t);
                } else {
                  fullPlane(1, 0, smooth((t - SHATTER_START) / 1.5), t);
                  gl.enable(gl.DEPTH_TEST);
                  gl.useProgram(sprog);
                  gl.activeTexture(gl.TEXTURE0);
                  gl.bindTexture(gl.TEXTURE_2D, texs[0]);
                  var st = t - SHATTER_START, elapsed = t, fade = DURATION - SHATTER_SETTLE;
                  var op = elapsed > SHATTER_SETTLE ? Math.max(0, 1 - (elapsed - SHATTER_SETTLE) / fade) : 1;
                  gl.uniform1f(sOpacityLoc, op);
                  for (var i = 0; i < shardBuf.length; i++) {
                    gl.uniformMatrix4fv(sModelLoc, false, modelMatrix(shardState(phys[i], st)));
                    gl.bindBuffer(gl.ARRAY_BUFFER, shardBuf[i]);
                    gl.enableVertexAttribArray(0);
                    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
                    gl.enableVertexAttribArray(1);
                    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
                    gl.drawArrays(gl.TRIANGLES, 0, shardGeo[i].length / 4);
                  }
                }
              };
            } catch (err) {
              canvas.style.display = "none";
              if (window.console) console.warn(NAME + ":", err.message);
            }

            var tl = gsap.timeline({ paused: true, onUpdate: function () { if (paint) paint(tl.time()); } });

            // The block lasts DUR seconds even when nothing is tweened at the end.
            tl.set({}, {}, DUR);
            if (paint) paint(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
