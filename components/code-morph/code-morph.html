            // ---- layout and timeline ----

            var size = clamp(fontReq, MIN_FONT, MAX_FONT);

            var columns = Math.max.apply(null, versions.map(function (v) { return v.columns; }));

            var gutter = lineNumbersOn ? digits + GUTTER_GAP : 0;
            var header = windowDotsOn || filename !== "" ? HEADER : 0;
            var leading = size * LEADING;
