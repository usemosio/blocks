<!doctype html>
<!--
  Underwater Ripple

  A scene held under moving water: layered refraction that closes on a whole number of
  cycles. The scene here is a stat and a bar chart.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/underwater-ripple/index.tsx

  copies of the Software, and to permit persons to whom the Software is
  furnished to do so, subject to the following conditions:

  copies or substantial portions of the Software.

  THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
  IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,

  LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a stat and a bar chart) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="underwater-ripple"
  data-composition-duration="4"
  data-composition-variables='[{"id": "label", "type": "string", "role": "content", "label": "Label", "description": "Small caption above the number in the sample scene.", "default": "Deploys this week"}, {"id": "value", "type": "string", "role": "content", "label": "Value", "description": "The big number in the sample scene.", "default": "2,481"}, {"id": "bars", "type": "string", "role": "content", "label": "Bars", "description": "Bar heights as percentages, separated by commas (up to 12); the last bar is highlighted.", "default": "32,51,43,68,57,86,64,100"}, {"id": "accent", "type": "color", "role": "style", "label": "Highlight", "description": "Colour of the last bar.", "default": "#a1eebd"}, {"id": "amplitude", "type": "number", "role": "style", "label": "Amplitude", "description": "How far the picture is pushed by the ripples. Pixel sizes are for a 1280×720 frame and scale with the frame.", "default": 7, "min": 0, "max": 40, "step": 1, "unit": "px"}, {"id": "scale", "type": "number", "role": "style", "label": "Scale", "description": "Size of the ripples; higher is finer.", "default": 1, "min": 0.2, "max": 4, "step": 0.1}, {"id": "speed", "type": "number", "role": "style", "label": "Speed", "description": "Whole ripple cycles over the length of the block.", "default": 2, "min": 1, "max": 8, "step": 1}, {"id": "dispersion", "type": "number", "role": "style", "label": "Dispersion", "description": "Colour split at the ripples.", "default": 1, "min": 0, "max": 4, "step": 0.1}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Refraction is smooth; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Underwater Ripple</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .uwr-stage {
          position: absolute;
          inset: 0;
        }
        .uwr-canvas,
        .uwr-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .uwr-scene {
          display: none;
        }
        .uwr-off .uwr-canvas {
          display: none;
        }
        .uwr-off .uwr-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="underwater-ripple" data-duration="4" data-fps="30">
        <div id="uwr-clip" class="uwr-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <canvas id="uwr-scene0" class="uwr-scene uwr-fb"></canvas>
          <canvas id="uwr-canvas" class="uwr-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "underwater-ripple";
            var root = document.getElementById("root");
            var stage = document.getElementById("uwr-clip");
            var canvas = document.getElementById("uwr-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "label", "type": "string", "default": "Deploys this week"}, {"id": "value", "type": "string", "default": "2,481"}, {"id": "bars", "type": "string", "default": "32,51,43,68,57,86,64,100"}, {"id": "accent", "type": "color", "default": "#a1eebd"}, {"id": "amplitude", "type": "number", "default": 7, "min": 0, "max": 40}, {"id": "scale", "type": "number", "default": 1, "min": 0.2, "max": 4}, {"id": "speed", "type": "number", "default": 2, "min": 1, "max": 8}, {"id": "dispersion", "type": "number", "default": 1, "min": 0, "max": 4}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["uwr-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "A": a stat and a bar chart (remocn's CanvasSceneA), laid out for any frame size.
            var barValues = String(V.bars).split(",").map(function (n) { return Math.min(100, Math.max(4, Number(n) || 0)); }).slice(0, 12);
            if (!barValues.length) barValues = [32, 51, 43, 68, 57, 86, 64, 100];
            function drawA(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, "#0a0a0a");
              var s = S, pad = 96 * s, inner = W - pad * 2;
              var labelH = 41 * s, valueSize = 152 * s, barsH = 190 * s;
              var total = labelH + 6 * s + valueSize + 52 * s + barsH;
              var y = (H - total) / 2;
              ctx.fillStyle = MUTED;
              fitFont(ctx, V.label, inner, 400, 34 * s, SANS);
              ctx.fillText(V.label, pad, y + labelH / 2);
              y += labelH + 6 * s;
              ctx.fillStyle = INK;
              setSpacing(ctx, -0.04 * valueSize);
              fitFont(ctx, V.value, inner, 600, valueSize, SANS);
              ctx.fillText(V.value, pad, y + valueSize / 2);
              setSpacing(ctx, 0);
              y += valueSize + 52 * s;
              var n = barValues.length;
              var bs = Math.min(1, inner / ((n * 74 + (n - 1) * 16) * s));
              var bw = 74 * s * bs, gap = 16 * s * bs, base = y + barsH;
              barValues.forEach(function (v, i) {
                var h = barsH * v / 100;
                ctx.fillStyle = i === n - 1 ? V.accent : "#23262e";
                ctx.beginPath();
                ctx.roundRect(pad + i * (bw + gap), base - h, bw, h, 10 * s * bs);
                ctx.fill();
              });
            }

            function drawScenes() {
              drawA(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform float u_aspect;
uniform float u_phase;
uniform float u_amplitude;
uniform float u_scale;
uniform float u_dispersion;

in vec2 v_uv;
out vec4 outColor;

vec2 fieldGradient(vec2 p, float phase) {
  float scale = max(u_scale, 0.05);
  vec2 k1 = vec2(1.0, 0.35);
  vec2 k2 = vec2(-0.42, 1.0);
  vec2 k3 = vec2(0.78, -0.63);
  float f1 = 6.1 * scale;
  float f2 = 8.7 * scale;
  float f3 = 12.3 * scale;

  vec2 g = vec2(0.0);
  g += cos(dot(p, k1) * f1 + phase) * f1 * k1;
  g += cos(dot(p, k2) * f2 - phase * 2.0) * f2 * k2;
  g += cos(dot(p, k3) * f3 + phase * 3.0) * f3 * k3;

  return g / (3.0 * f2);
}

void main() {
  vec2 p = vec2(v_uv.x * u_aspect, v_uv.y);
  vec2 grad = fieldGradient(p, u_phase);

  vec2 offset = grad * u_amplitude;
  float strength = length(grad);
  vec2 direction = strength > 0.0001 ? grad / strength : vec2(0.0);
  float spread = u_dispersion * u_amplitude * 0.3 * min(strength, 2.0);

  vec2 base = v_uv + vec2(offset.x / u_aspect, offset.y);
  vec2 lead = vec2(direction.x / u_aspect, direction.y) * spread;

  vec4 center = texture(u_scene, base);
  float r = texture(u_scene, base + lead).r;
  float b = texture(u_scene, base - lead).b;

  outColor = vec4(r, center.g, b, center.a);
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              gl.uniform1f(u("u_amplitude"), V.amplitude * S / H);
              gl.uniform1f(u("u_scale"), V.scale);
              gl.uniform1f(u("u_dispersion"), V.dispersion);
              var phaseLoc = u("u_phase");
              frameFn = function (frame) {
                gl.uniform1f(phaseLoc, (frame / Math.max(totalFrames, 1)) * V.speed * Math.PI * 2);
              };

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("uwr-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "4");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
