<html
  lang="en"
  data-composition-id="staggered-fade-up"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Sentence whose words fade up one by one.", "default": "Ship faster with confidence"},
    {"id": "stagger_delay", "type": "number", "role": "motion", "label": "Stagger delay", "description": "Frames (30 per second) between one word and the next.", "default": 4, "min": 1, "max": 30, "step": 1, "unit": "frames"},
    {"id": "distance", "type": "number", "role": "motion", "label": "Distance", "description": "How far below its place each word starts.", "default": 20, "min": 0, "max": 120, "step": 1, "unit": "px"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 220, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Staggered Fade Up</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, -apple-system, BlinkMacSystemFont, sans-serif);
        }
        .sfu-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .sfu-line { letter-spacing: -0.03em; line-height: 1.2; white-space: nowrap; }
        .sfu-word { display: inline-block; margin-right: 0.25em; opacity: 0; }
      </style>

      <div id="root" data-composition-id="staggered-fade-up" data-duration="3" data-fps="30">
        <div id="sfu-clip" class="sfu-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <span id="sfu-line" class="sfu-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            // Easing.bezier(x1, y1, x2, y2) as a function of t (Newton, then bisection).
            function bez(x1, y1, x2, y2) {
              function cx(s) { return 3 * x1 * s * (1 - s) * (1 - s) + 3 * x2 * s * s * (1 - s) + s * s * s; }
              function cy(s) { return 3 * y1 * s * (1 - s) * (1 - s) + 3 * y2 * s * s * (1 - s) + s * s * s; }
              return function (t) {
                if (t <= 0) return 0;
                if (t >= 1) return 1;
                var lo = 0, hi = 1, s = t;
                for (var i = 0; i < 40; i++) {
                  var x = cx(s);
                  if (Math.abs(x - t) < 1e-6) break;
                  if (x < t) lo = s; else hi = s;
                  s = (lo + hi) / 2;
                }
                return cy(s);
              };
            }
            // interpolate(f, [a, b], [from, to]) with both ends clamped, like Remotion's extrapolate "clamp".
            function interp(f, a, b, from, to, ease) {
              var t = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(t) : t);
            }
            // Fit one line to 90 % of the frame width: shrinks the font size when it overflows.
            function fit(root, line, size) {
              line.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * 0.9);
              if (line.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / line.scrollWidth));
                line.style.fontSize = size + "px";
              }
              return size;
            }
            // Drives draw(frame) from the paused timeline: frame = time * 30 * speed (Remotion's useCurrentFrame() * speed).
            function drive(tl, total, speed, draw) {
              var clock = { t: 0 };
              tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t * 30 * speed); } }, 0);
              draw(0);
            }

            var text = str(vars.text, "Ship faster with confidence");
            var stagger = num(vars.stagger_delay, 4, 1, 30);
            var distance = num(vars.distance, 20, 0, 120);
            var speed = num(vars.speed, 1, 0.25, 4);
            var line = document.getElementById("sfu-line");
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            line.setAttribute("aria-label", text);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var words = text.split(" ").map(function (w, i) {
              var span = document.createElement("span");
              span.id = "sfu-word-" + i;
              span.className = "sfu-word";
              span.textContent = w;
              line.appendChild(span);
              return span;
            });
            fit(root, line, num(vars.font_size, 72, 12, 220));

            // remocn: each word fades and rises over 12 frames, linear, `stagger` frames apart.
            function draw(frame) {
              words.forEach(function (el, i) {
                var local = frame - i * stagger;
                el.style.opacity = interp(local, 0, 12, 0, 1);
                el.style.transform = "translateY(" + interp(local, 0, 12, distance, 0) + "px)";
              });
            }
            var total = parseFloat(root.dataset.duration || "3");
            var tl = gsap.timeline({ paused: true });
            drive(tl, total, speed, draw);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["staggered-fade-up"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
