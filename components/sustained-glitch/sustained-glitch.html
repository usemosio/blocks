<!doctype html>
<!--
  Sustained Glitch

  A scene held under scheduled bursts of broadcast corruption, resting clean in between.
  The scene here is a stat and a bar chart.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/sustained-glitch/index.tsx

  OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
  SOFTWARE.

  remocn captures its React children with the HTML-in-Canvas API, which a render machine does
  not have. This block draws remocn's preview scene (a stat and a bar chart) (text and colours from the variables) on a
  2D canvas and runs remocn's fragment shader over it, so it applies the look to its own content,
  not to the host video behind it.
-->
<html
  lang="en"
  data-composition-id="sustained-glitch"
  data-composition-duration="4"
  data-composition-variables='[{"id": "label", "type": "string", "role": "content", "label": "Label", "description": "Small caption above the number in the sample scene.", "default": "Deploys this week"}, {"id": "value", "type": "string", "role": "content", "label": "Value", "description": "The big number in the sample scene.", "default": "2,481"}, {"id": "bars", "type": "string", "role": "content", "label": "Bars", "description": "Bar heights as percentages, separated by commas (up to 12); the last bar is highlighted.", "default": "32,51,43,68,57,86,64,100"}, {"id": "accent", "type": "color", "role": "style", "label": "Highlight", "description": "Colour of the last bar.", "default": "#a1eebd"}, {"id": "intensity", "type": "number", "role": "style", "label": "Intensity", "description": "How hard a burst tears the picture.", "default": 1, "min": 0, "max": 2, "step": 0.05}, {"id": "frequency", "type": "number", "role": "style", "label": "Frequency", "description": "Bursts per second (one chance per slot, some slots stay clean).", "default": 1, "min": 0.1, "max": 6, "step": 0.1}, {"id": "slices", "type": "number", "role": "style", "label": "Slices", "description": "Number of horizontal bands that can tear.", "default": 24, "min": 6, "max": 48, "step": 1}, {"id": "seed", "type": "number", "role": "style", "label": "Seed", "description": "Changes when the bursts fire.", "default": 1, "min": 1, "max": 20, "step": 1}, {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Tears and blocks are coarse; 0.75 matches 1 in the stills.", "default": 0.75, "min": 0.25, "max": 1, "step": 0.05}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Sustained Glitch</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: #000;
          pointer-events: none;
        }
        .sgl-stage {
          position: absolute;
          inset: 0;
        }
        .sgl-canvas,
        .sgl-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        .sgl-scene {
          display: none;
        }
        .sgl-off .sgl-canvas {
          display: none;
        }
        .sgl-off .sgl-fb {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="sustained-glitch" data-duration="4" data-fps="30">
        <div id="sgl-clip" class="sgl-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <canvas id="sgl-scene0" class="sgl-scene sgl-fb"></canvas>
          <canvas id="sgl-canvas" class="sgl-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "sustained-glitch";
            var root = document.getElementById("root");
            var stage = document.getElementById("sgl-clip");
            var canvas = document.getElementById("sgl-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function clampNum(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function hex(value, fallback) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || "").trim());
              if (!m) return fallback;
              var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
              return "#" + h.toLowerCase();
            }
            function rgb(value) {
              var h = hex(value, "#ffffff").slice(1);
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
            }
            var DEFS = [{"id": "label", "type": "string", "default": "Deploys this week"}, {"id": "value", "type": "string", "default": "2,481"}, {"id": "bars", "type": "string", "default": "32,51,43,68,57,86,64,100"}, {"id": "accent", "type": "color", "default": "#a1eebd"}, {"id": "intensity", "type": "number", "default": 1, "min": 0, "max": 2}, {"id": "frequency", "type": "number", "default": 1, "min": 0.1, "max": 6}, {"id": "slices", "type": "number", "default": 24, "min": 6, "max": 48}, {"id": "seed", "type": "number", "default": 1, "min": 1, "max": 20}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];
            var V = {};
            DEFS.forEach(function (d) {
              var raw = vars[d.id];
              if (d.type === "number") V[d.id] = clampNum(raw, d.default, d.min, d.max);
              else if (d.type === "color") V[d.id] = hex(raw, d.default);
              else if (d.type === "boolean") V[d.id] = typeof raw === "boolean" ? raw : raw === "true" ? true : raw === "false" ? false : d.default;
              else if (d.type === "enum") V[d.id] = d.options.indexOf(raw) >= 0 ? raw : d.default;
              else V[d.id] = typeof raw === "string" && raw.trim() ? raw.trim() : d.default;
            });

            var W = Math.max(2, root.clientWidth);
            var H = Math.max(2, root.clientHeight);
            var res = V.resolution;
            var cw = Math.max(2, Math.round(W * res));
            var ch = Math.max(2, Math.round(H * res));
            var sceneCanvases = ["sgl-scene0"].map(function (id) {
              var el = document.getElementById(id);
              el.width = cw;
              el.height = ch;
              return el;
            });

            var SANS = "Geist, -apple-system, BlinkMacSystemFont, sans-serif";
            var MONO = "'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace";
            var INK = "#f2f2f2";
            var MUTED = "#8b8f9a";
            var TONES = ["#a1eebd", "#ffb38e", "#d4b3ff"];
            var S = Math.min(W / 940, H / 720);
            function setFont(ctx, weight, size, family) { ctx.font = weight + " " + size + "px " + family; }
            function fitFont(ctx, text, maxWidth, weight, size, family) {
              setFont(ctx, weight, size, family);
              var w = ctx.measureText(text).width;
              if (w > maxWidth) { size *= maxWidth / w; setFont(ctx, weight, size, family); }
              return size;
            }
            function setSpacing(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
            function wrapLines(ctx, text, maxWidth) {
              var words = String(text).split(/\s+/).filter(Boolean);
              var lines = [];
              var line = "";
              words.forEach(function (word) {
                var next = line ? line + " " + word : word;
                if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = word; }
                else line = next;
              });
              if (line) lines.push(line);
              return lines;
            }
            function pairs(text, max) {
              return String(text).split(";")
                .map(function (row) { return row.split("|").map(function (part) { return part.trim(); }); })
                .filter(function (row) { return row[0]; })
                .slice(0, max);
            }
            function begin(ctx, cw, ch, fill) {
              ctx.setTransform(cw / W, 0, 0, ch / H, 0, 0);
              ctx.fillStyle = fill;
              ctx.fillRect(0, 0, W, H);
              ctx.textBaseline = "middle";
              ctx.textAlign = "left";
              setSpacing(ctx, 0);
            }


            // Sample scene "A": a stat and a bar chart (remocn's CanvasSceneA), laid out for any frame size.
            var barValues = String(V.bars).split(",").map(function (n) { return Math.min(100, Math.max(4, Number(n) || 0)); }).slice(0, 12);
            if (!barValues.length) barValues = [32, 51, 43, 68, 57, 86, 64, 100];
            function drawA(canvas) {
              var ctx = canvas.getContext("2d");
              begin(ctx, canvas.width, canvas.height, "#0a0a0a");
              var s = S, pad = 96 * s, inner = W - pad * 2;
              var labelH = 41 * s, valueSize = 152 * s, barsH = 190 * s;
              var total = labelH + 6 * s + valueSize + 52 * s + barsH;
              var y = (H - total) / 2;
              ctx.fillStyle = MUTED;
              fitFont(ctx, V.label, inner, 400, 34 * s, SANS);
              ctx.fillText(V.label, pad, y + labelH / 2);
              y += labelH + 6 * s;
              ctx.fillStyle = INK;
              setSpacing(ctx, -0.04 * valueSize);
              fitFont(ctx, V.value, inner, 600, valueSize, SANS);
              ctx.fillText(V.value, pad, y + valueSize / 2);
              setSpacing(ctx, 0);
              y += valueSize + 52 * s;
              var n = barValues.length;
              var bs = Math.min(1, inner / ((n * 74 + (n - 1) * 16) * s));
              var bw = 74 * s * bs, gap = 16 * s * bs, base = y + barsH;
              barValues.forEach(function (v, i) {
                var h = barsH * v / 100;
                ctx.fillStyle = i === n - 1 ? V.accent : "#23262e";
                ctx.beginPath();
                ctx.roundRect(pad + i * (bw + gap), base - h, bw, h, 10 * s * bs);
                ctx.fill();
              });
            }

            function drawScenes() {
              drawA(sceneCanvases[0]);
            }

            var VERTEX = [
              "#version 300 es",
              "in vec2 a_pos;",
              "out vec2 v_uv;",
              "void main() {",
              "  v_uv = vec2(a_pos.x * 0.5 + 0.5, 0.5 - a_pos.y * 0.5);",
              "  gl_Position = vec4(a_pos, 0.0, 1.0);",
              "}"
            ].join("\n");
            var FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D u_scene;
uniform float u_frame;
uniform float u_intensity;
uniform float u_frequency;
uniform float u_slices;
uniform float u_seed;

in vec2 v_uv;
out vec4 outColor;

const float BLOCK_COLUMNS = 16.0;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

vec4 sampleSplit(vec2 uv, float split) {
  vec4 center = texture(u_scene, uv);
  float r = texture(u_scene, fract(vec2(uv.x + split, uv.y))).r;
  float b = texture(u_scene, fract(vec2(uv.x - split, uv.y))).b;
  return vec4(r, center.g, b, center.a);
}

void main() {
  float slotLength = max(30.0 / max(u_frequency, 0.1), 4.0);
  float slot = floor(u_frame / slotLength);
  float local = u_frame - slot * slotLength;

  float burstLength = 2.0 + floor(hash(vec2(slot, u_seed + 2.0)) * 4.0);
  float start =
    floor(hash(vec2(slot, u_seed + 1.0)) * max(slotLength - burstLength, 1.0));
  float fires = step(0.25, hash(vec2(slot, u_seed + 3.0)));

  float age = local - start;
  float live = fires * step(0.0, age) * step(age, burstLength - 1.0);
  float energy =
    max(u_intensity, 0.0) * live * (1.0 - age / burstLength);

  if (energy <= 0.0) {
    outColor = texture(u_scene, v_uv);
    return;
  }

  float clock = mod(u_frame, 512.0) + u_seed;
  float row = floor(v_uv.y * max(u_slices, 2.0));
  float torn = step(0.45, hash(vec2(row, clock)));
  float amount = hash(vec2(row + 17.0, clock * 1.7 + 3.0)) - 0.5;
  float sliceShift = amount * 0.28 * energy * torn;

  vec2 block = vec2(floor(v_uv.x * BLOCK_COLUMNS), row);
  float corrupt = step(1.0 - 0.45 * min(energy, 1.0), hash(block + clock * 7.3));
  vec2 jump =
    vec2(
      hash(block + clock * 3.1 + 5.0) - 0.5,
      hash(block + clock * 9.7 + 11.0) - 0.5
    ) *
    vec2(0.62, 0.34) *
    corrupt;

  vec2 uv = fract(v_uv + vec2(sliceShift, 0.0) + jump);
  float split = 0.02 * energy * (0.35 + abs(amount));

  vec4 color = sampleSplit(uv, split);
  color.rgb +=
    vec3(0.05, 0.015, 0.09) *
    energy *
    torn *
    hash(vec2(row, clock + 41.0)) *
    color.a;

  outColor = vec4(clamp(color.rgb, 0.0, 1.0), color.a);
}`;

            canvas.width = cw;
            canvas.height = ch;
            var gl = canvas.getContext("webgl2", { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
            function compile(type, source) {
              var shader = gl.createShader(type);
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
              return shader;
            }
            var paint = null;
            var upload = function () {};
            var extraUpload = function () {};
            var frameFn = function () {};
            var texUnits = [];
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var program = gl.createProgram();
              gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
              gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link failed");
              gl.useProgram(program);
              var buffer = gl.createBuffer();
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
              var aPos = gl.getAttribLocation(program, "a_pos");
              gl.enableVertexAttribArray(aPos);
              gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
              function makeTexture(unit) {
                var texture = gl.createTexture();
                gl.activeTexture(gl.TEXTURE0 + unit);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return texture;
              }
              gl.viewport(0, 0, cw, ch);
              function u(name) { return gl.getUniformLocation(program, name); }
              ["u_scene"].forEach(function (name, unit) {
                makeTexture(unit);
                gl.uniform1i(u(name), unit);
              });
              gl.uniform1f(u("u_aspect"), W / H);
              var frameLoc = u("u_frame");
              var timeLoc = u("u_time");
              upload = function () {
                sceneCanvases.forEach(function (el, unit) {
                  gl.activeTexture(gl.TEXTURE0 + unit);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
                });
                extraUpload();
              };

              gl.uniform1f(u("u_intensity"), V.intensity);
              gl.uniform1f(u("u_frequency"), V.frequency);
              gl.uniform1f(u("u_slices"), V.slices);
              gl.uniform1f(u("u_seed"), V.seed);

              paint = function (frame) {
                gl.uniform1f(frameLoc, frame);
                gl.uniform1f(timeLoc, frame / 30);
                frameFn(frame, frame / 30);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              };
            } catch (err) {
              stage.classList.add("sgl-off");
              if (window.console) console.warn(NAME + ":", err.message);
            }

            // The scenes are redrawn whenever a web font finishes loading, so no frame keeps a fallback face.
            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "4");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
