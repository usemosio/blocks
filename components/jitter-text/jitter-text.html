<!--
  Jitter Text

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="jitter-text"
  data-composition-duration="4.4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text that trembles.", "default": "Jitter Text"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "intensity", "type": "number", "role": "motion", "label": "Intensity", "description": "Multiplier for the size of the tremble (1 is the original, which is small).", "default": 1, "min": 0, "max": 6, "step": 0.1},
    {"id": "duration", "type": "number", "role": "motion", "label": "Tremble duration", "description": "Seconds of one tremble.", "default": 0.6, "min": 0.2, "max": 2, "step": 0.05, "unit": "s"},
    {"id": "pause", "type": "number", "role": "motion", "label": "Pause", "description": "Seconds of rest between trembles.", "default": 0.5, "min": 0, "max": 3, "step": 0.1, "unit": "s"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "900", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Jitter Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .jt-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .jt-text { display: inline-block; white-space: pre; line-height: 1.1; letter-spacing: -0.02em; }
      </style>

      <div id="root" data-composition-id="jitter-text" data-duration="4.4" data-fps="30">
        <div id="jt-clip" class="jt-stage clip" data-start="0" data-duration="4.4" data-track-index="0">
          <span id="jt-text" class="jt-text"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function opt(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { return typeof v === "boolean" ? v : v === "true" ? true : v === "false" ? false : f; }
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > max) { size = Math.max(12, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            
            var el = document.getElementById("jt-text");
            var text = str(vars.text, "Jitter Text");
            var d = num(vars.duration, 0.6, 0.2, 2);
            var pause = num(vars.pause, 0.5, 0, 3);
            var intensity = num(vars.intensity, 1, 0, 6);
            root.style.color = col(vars.color, "#171717");
            root.style.fontWeight = opt(vars.font_weight, ["300","400","500","600","700","900"], "900");
            el.textContent = text;
            var size = fit(el, num(vars.font_size, 72, 12, 260), 0.9);
            // The original is tuned for 60 px text: offsets are in px at that size.
            var k = (size / 60) * intensity;
            var X = [0, -1, 1.5, -1.5, 1, -1, 0.5, 0], Y = [1.5, 1, -1, 1.5, -1.5, 1, -0.5, 0], R = [0.5, -1.5, 1, -1.5, 1, -1, 1, 0];
            function kf(a, p) {
              var pos = p * (a.length - 1), i = Math.min(a.length - 2, Math.floor(pos)), u = pos - i;
              u = u * u * (3 - 2 * u);
              return a[i] + (a[i + 1] - a[i]) * u;
            }
            function draw(t) {
              var period = 2 * (d + pause), m = t % period, p;
              if (m < d) p = m / d; else if (m < d + pause) p = 1; else if (m < 2 * d + pause) p = 1 - (m - d - pause) / d; else p = 0;
              el.style.transform = "translate(" + kf(X, p) * k + "px," + kf(Y, p) * k + "px) rotate(" + kf(R, p) * Math.min(3, intensity) + "deg)";
            }
            var clock = { t: 0 };
            var total0 = parseFloat(root.dataset.duration || "4.4");
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total0, duration: total0, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            var total = parseFloat(root.dataset.duration || "4.4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["jitter-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
