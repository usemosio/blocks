  Text Cursor Rays

  A wordmark rises into frame and a cursor sweeps across it, throwing prismatic light rays through the letters (a 112-sample ray accumulation shader); the mark shrinks away into a frosted glass card where a word is typed, slides into place, and the headline changes to a closing line.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/vfx-text-cursor/vfx-text-cursor.html

  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (the card is laid out in container units and the headline is sized to fit a vertical frame); the upstream logo and announcement copy are replaced by a placeholder wordmark (drawn on 2D canvases, with text from variables) and generic headline text; the shader is unchanged apart from GLSL ES 3.0 syntax (WebGL2); typing and the slide of the typed word are computed from the timeline time instead of timeline callbacks; the canvas is drawn at the `resolution` variable; without WebGL the effect canvas is hidden.
-->
