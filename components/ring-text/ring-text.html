<!--

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="ring-text"
  data-composition-duration="6"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Phrase that runs around the ring.", "default": "Type in motion"},
    {"id": "separator", "type": "string", "role": "content", "label": "Separator", "description": "Mark between laps of the phrase.", "default": "•"},
    {"id": "color", "type": "color", "role": "style", "label": "Text color", "description": "Color of the letters.", "default": "#d4ff1f"},
    {"id": "band", "type": "color", "role": "style", "label": "Band color", "description": "Color of the band.", "default": "#0a0a0a"},
    {"id": "radius", "type": "number", "role": "style", "label": "Radius", "description": "Ring radius in reference pixels (1280×720 stage); a long phrase grows it.", "default": 210, "min": 80, "max": 340, "step": 1, "unit": "px"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Letter size in reference pixels.", "default": 40, "min": 16, "max": 90, "step": 1, "unit": "px"},
    {"id": "tilt", "type": "number", "role": "motion", "label": "Tilt", "description": "How far the ring leans toward the viewer, in degrees.", "default": 38, "min": 0, "max": 80, "step": 1, "unit": "deg"},
    {"id": "roll", "type": "number", "role": "motion", "label": "Roll", "description": "In-plane rotation of the ring, in degrees.", "default": -16, "min": -60, "max": 60, "step": 1, "unit": "deg"},
    {"id": "period", "type": "number", "role": "motion", "label": "Frames per turn", "description": "Frames for one full spin (30 fps).", "default": 240, "min": 60, "max": 900, "step": 1, "unit": "frames"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ring Text</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .rt-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
        .rt-ring { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
        .rt-panel { position: absolute; display: flex; align-items: center; justify-content: center; line-height: 1; white-space: pre; font-weight: 800; font-variation-settings: "wght" 800; backface-visibility: visible; }
      </style>

      <div id="root" data-composition-id="ring-text" data-duration="6" data-fps="30">
        <div id="rt-clip" class="rt-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="rt-ring" class="rt-ring"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "6");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var stage = document.getElementById("rt-clip"), ring = document.getElementById("rt-ring");
            var text = str(vars.text, "Type in motion"), sep = typeof vars.separator === "string" ? vars.separator : "•";
            var color = col(vars.color, "#d4ff1f"), band = col(vars.band, "#0a0a0a");
            var fontPx = num(vars.font_size, 40, 16, 90), radius0 = num(vars.radius, 210, 80, 340);
            var tilt = num(vars.tilt, 38, 0, 80), roll = num(vars.roll, -16, -60, 60);
            var period = num(vars.period, 240, 60, 900), speed = num(vars.speed, 1, 0.25, 4);
            var unit = Math.min(root.clientWidth / 1280, root.clientHeight / 720);
            var chars = Array.from(sep ? text + " " + sep + " " : text + " ");
            var fontSpec = "800 " + fontPx * unit + "px Inter";
            var panels = [], builtReal = false, built = false, bandH = 1.5 * fontPx * unit, bleed = 1.5 * Math.max(1, unit);
            var layoutRadius = radius0;
            function build() {
              ring.textContent = ""; panels = [];
              var probe = document.createElement("span");
              probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + fontSpec;
              stage.appendChild(probe);
              var adv = chars.map(function (c) { probe.textContent = c; return probe.getBoundingClientRect().width / unit; });
              stage.removeChild(probe);
              var tokenW = adv.reduce(function (s, a) { return s + Math.max(0, a); }, 0);
              var circ = Math.max(2 * Math.PI * radius0, tokenW);
              var repeats = Math.max(1, Math.floor(circ / tokenW));
              var spacing = (circ - repeats * tokenW) / (repeats * chars.length);
              layoutRadius = circ / (2 * Math.PI);
              var travelled = 0;
              for (var r = 0; r < repeats; r++) for (var c = 0; c < chars.length; c++) {
                var w = Math.max(0, adv[c]) + spacing, angle = (2 * Math.PI * (travelled + w / 2)) / circ;
                travelled += w;
                var wpx = w * unit, el = document.createElement("div");
                el.className = "rt-panel";
                el.style.cssText += "left:" + (-wpx / 2 - bleed) + "px;top:" + -bandH / 2 + "px;width:" + (wpx + 2 * bleed) + "px;height:" + bandH + "px;background:" + band + ";color:" + color + ";font-size:" + fontPx * unit + "px;transform:rotateY(" + angle + "rad) translateZ(" + layoutRadius * unit + "px)";
                var sp = document.createElement("span"); sp.textContent = chars[c]; el.appendChild(sp);
                ring.appendChild(el); panels.push({ el: sp, angle: angle });
              }
            }
            var easeOutCubic = function (p) { return 1 - Math.pow(1 - p, 3); };
            stage.style.perspective = 1600 * unit + "px";
            tick(function (tt) {
              var t = tt * 30 * speed;
              var ok = !document.fonts || document.fonts.check(fontSpec);
              if (!built || (ok && !builtReal)) { build(); built = true; builtReal = ok; }
              var settle = easeOutCubic(Math.min(1, Math.max(0, t / 30)));
              var spin = (360 * t) / period + 90 * settle;
              var tl2 = tilt + 6 * Math.sin((2 * Math.PI * t) / 150);
              stage.style.opacity = ip(t, 0, 12, 0, 1);
              ring.style.transform = "scale(" + (0.85 + 0.15 * settle) + ") rotateZ(" + roll + "deg) rotateX(" + -tl2 + "deg) rotateY(" + -spin + "deg)";
              panels.forEach(function (p) {
                var facing = Math.cos(p.angle - (spin * Math.PI) / 180);
                p.el.style.opacity = 0.55 + (0.45 * (facing + 1)) / 2;
              });
            });
            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["ring-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
