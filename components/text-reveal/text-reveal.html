<!doctype html>
<!--
  Text Reveal

  A paragraph in faint type that lights up word by word to full colour, like text being read aloud or scrolled into focus.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/magicuidesign/magicui/blob/166367b4e31a27f166fd6c2b71d7be290fe0c1bc/apps/www/registry/magicui/text-reveal.tsx
  Changes by usemosio/blocks: the source ties each word's opacity to the page scroll position; this block plays the same progress over time.

<html
  lang="en"
  data-composition-id="text-reveal"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "The paragraph that lights up.", "default": "This text lights up one word at a time as you read, until every word is clear."},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. The paragraph wraps inside 86 % of the frame width.", "default": 64, "min": 12, "max": 200, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Colour", "description": "Colour of the revealed words.", "default": "#0a0a0a"},
    {"id": "dim", "type": "number", "role": "style", "label": "Faint level", "description": "How visible unread words are, 0 to 1.", "default": 0.2, "min": 0, "max": 1, "step": 0.05},
    {"id": "start", "type": "number", "role": "motion", "label": "Start", "description": "Seconds before the first word starts to light up.", "default": 0.4, "min": 0, "max": 3, "step": 0.1, "unit": "s"},
    {"id": "reveal_seconds", "type": "number", "role": "motion", "label": "Reveal time", "description": "Seconds from the first word starting to the last word finished. The source ties this to scrolling.", "default": 3.8, "min": 0.5, "max": 20, "step": 0.1, "unit": "s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Reveal</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700;800&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .trv-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .trv-para { width: 86%; display: flex; flex-wrap: wrap; justify-content: flex-start; font-family: var(--font-display, Geist, system-ui, sans-serif); font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
        .trv-word { position: relative; margin: 0 0.3em 0.1em 0; white-space: pre; }
        .trv-base { position: absolute; left: 0; top: 0; }
        .trv-top { opacity: 0; }
      </style>

      <div id="root" data-composition-id="text-reveal" data-duration="5" data-fps="30">
        <div id="trv-clip" class="trv-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <p id="trv-para" class="trv-para"></p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Shrink an element's font until it fits a share of the frame width.
            function fit(el, size, share) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * share);
              if (el.scrollWidth > max) {
                size = Math.max(12, size * (max / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            // A seeded random generator, so every seek draws the same thing.
            function mulberry32(a) {
              return function () {
                a |= 0; a = (a + 0x6d2b79f5) | 0;
                var t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
            gsap.registerPlugin(CustomEase);
            var TAG = "trv";
            var bezN = 0;
            function bez(x1, y1, x2, y2) {
              return CustomEase.create(TAG + "-" + bezN++, "M0,0 C" + x1 + "," + y1 + " " + x2 + "," + y2 + " 1,1");
            }
            var tl = gsap.timeline({ paused: true });
            function finish() {
              var total = parseFloat(root.dataset.duration || "5");
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-reveal"] = tl;
            }

            var para = document.getElementById("trv-para");
            var text = str(vars.text, "This text lights up one word at a time as you read, until every word is clear.");
            var color = col(vars.color, "#0a0a0a");
            var dim = num(vars.dim, 0.2, 0, 1);
            var start = num(vars.start, 0.4, 0, 3);
            var span = num(vars.reveal_seconds, 3.8, 0.5, 20);
            para.style.color = color;
            para.setAttribute("aria-label", text);
            var words = text.split(" ").filter(Boolean);
            var tops = words.map(function (w, i) {
              var wrap = document.createElement("span");
              wrap.className = "trv-word";
              wrap.setAttribute("aria-hidden", "true");
              var ghost = document.createElement("span");
              ghost.style.visibility = "hidden";
              ghost.textContent = w;
              var base = document.createElement("span");
              base.className = "trv-base";
              base.style.opacity = dim;
              base.textContent = w;
              var top = document.createElement("span");
              top.className = "trv-base trv-top";
              top.id = "trv-top-" + i;
              top.textContent = w;
              wrap.appendChild(ghost); wrap.appendChild(base); wrap.appendChild(top);
              para.appendChild(wrap);
              return top;
            });
            var size = num(vars.font_size, 64, 12, 200);
            para.style.fontSize = size + "px";
            // Shrink until the paragraph is no taller than 70 % of the frame.
            var guard = 0;
            while (para.offsetHeight > root.clientHeight * 0.7 && size > 12 && guard++ < 40) {
              size *= 0.94; para.style.fontSize = size + "px";
            }
            // Source: word i goes 0 -> 1 across progress [i/n, (i+1)/n], linearly.
            var n = words.length;
            tops.forEach(function (el, i) {
              tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: span / n, ease: "none", immediateRender: true }, start + (i / n) * span);
            });

            finish();
          })();
        </script>
      </div>
    </template>
  </body>
</html>
