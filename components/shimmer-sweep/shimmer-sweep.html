<!--
  Shimmer Sweep

  A bright shine travels once across muted text: a metallic gleam that draws the eye to text that
  is already on screen.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="shimmer-sweep"
  data-composition-duration="4"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text the shine travels across.", "default": "Generating" },
    { "id": "base_color", "type": "color", "role": "style", "label": "Base color", "description": "Dim color of the text underneath the shine.", "default": "#3f3f46" },
    { "id": "shine_color", "type": "color", "role": "style", "label": "Shine color", "description": "Color of the moving highlight.", "default": "#fafafa" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 96, "min": 12, "max": 260, "step": 1, "unit": "px" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{ "value": "400", "label": "Regular" }, { "value": "500", "label": "Medium" }, { "value": "600", "label": "Semibold" }, { "value": "700", "label": "Bold" }] },
    { "id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier. The shine crosses in the first 80 % of the block at speed 1.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shimmer Sweep</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, -apple-system, BlinkMacSystemFont, sans-serif);
          pointer-events: none;
        }
        .shs-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .shs-wrap { position: relative; display: inline-block; }
        .shs-text { display: block; margin: 0; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
        .shs-shine {
          position: absolute;
          inset: 0;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          background-size: 200% 100%;
          background-repeat: no-repeat;
        }
      </style>

      <div id="root" data-composition-id="shimmer-sweep" data-duration="4" data-fps="30">
        <div id="shs-clip" class="shs-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="shs-wrap" class="shs-wrap">
            <span id="shs-base" class="shs-text"></span>
            <span id="shs-shine" class="shs-text shs-shine" aria-hidden="true"></span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value.trim() ? value.trim() : fallback;
            }
            function ip(f, a, b, from, to) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * p;
            }

            var text = str(vars.text, "Generating");
            var baseColor = col(vars.base_color, "#3f3f46");
            var shineColor = col(vars.shine_color, "#fafafa");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "700");
            var speed = num(vars.speed, 1, 0.25, 4);

            var wrap = document.getElementById("shs-wrap");
            var base = document.getElementById("shs-base");
            var shine = document.getElementById("shs-shine");
            base.textContent = shine.textContent = text;
            base.style.color = baseColor;
            base.style.fontWeight = shine.style.fontWeight = weight;
            shine.style.backgroundImage = "linear-gradient(110deg, transparent 30%, " + shineColor + " 50%, transparent 70%)";

            var size = num(vars.font_size, 96, 12, 260);
            base.style.fontSize = shine.style.fontSize = size + "px";
            var maxWidth = Math.max(1, root.clientWidth * 0.9);
            if (wrap.scrollWidth > maxWidth) {
              size = Math.max(12, size * (maxWidth / wrap.scrollWidth));
              base.style.fontSize = shine.style.fontSize = size + "px";
            }

            // remocn: the gradient's background-position runs linearly from 200 % to -100 % over
            // the first 80 % of the composition, so the shine crosses the text once, left to right.
            var total = parseFloat(root.dataset.duration || "4");
            var durationFrames = total * 30;
            function draw(frame) {
              var position = ip(frame, 0, durationFrames * 0.8, 200, -100);
              shine.style.backgroundPosition = position + "% 50%";
            }

            var clock = { t: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t * 30 * speed); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["shimmer-sweep"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
