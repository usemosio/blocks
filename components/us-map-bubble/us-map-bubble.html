  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

  the specific language governing permissions and limitations under the License.

  Map geometry: us-atlas states-10m (ISC licence, Copyright Mike Bostock), built from the US Census
  Bureau cartographic boundary files (public domain). The Albers USA projection and the SVG paths were
  computed once with d3-geo and are embedded below, simplified and rounded; the lower-48 projection is
  written out in the script so that cities given as latitude and longitude land on the same map.

  Changes by usemosio/blocks: fills the host frame (header, map and source note stack to fit portrait and landscape); d3, topojson and the us-atlas fetch are gone: the state paths are embedded and the Albers equal-area conic is written out in a few lines so cities in the lower 48 can be placed from latitude and longitude; title, subtitle, source, cities (JSON list of name, lat, lon, value), unit text, hub and its connections, number of callouts, colours and background are variables; the sample values are labelled as illustrative; the pulse repeats within the 12 seconds.
