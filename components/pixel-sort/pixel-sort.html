<!doctype html>
<!--
  Pixel Sort

  The outgoing scene melts downward in vertical columns of different speeds, smeared into bright streaks, and the incoming scene drops in column by column and snaps sharp.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/pixel-sort/index.tsx

<html
  lang="en"
  data-composition-id="pixel-sort"
  data-composition-duration="1.0"
  data-composition-variables='[
  {
    "id": "columns",
    "type": "number",
    "role": "style",
    "label": "Columns",
    "description": "Number of vertical columns the frame is sliced into.",
    "default": 40,
    "min": 2,
    "max": 120,
    "step": 1
  },
  {
    "id": "seed",
    "type": "number",
    "role": "style",
    "label": "Seed",
    "description": "Seed for per-column melt amount and timing.",
    "default": 5,
    "min": 0,
    "max": 9999,
    "step": 1
  },
  {
    "id": "streak_color",
    "type": "color",
    "role": "style",
    "label": "Streak color",
    "description": "Color of the bright smeared streaks.",
    "default": "#FFFFFF"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pixel Sort</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .pxs-stage { position: absolute; inset: 0; }
        .pxs-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .pxs-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .pxs-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .pxs-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .pxs-pa { background: #141318; }
        .pxs-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .pxs-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .pxs-col { position: absolute; top: 0; overflow: hidden; }
        .pxs-col > .pxs-copy { position: absolute; top: 0; }
        .pxs-streak { position: absolute; inset: 0; display: none; }

      </style>

      <div id="root" data-composition-id="pixel-sort" data-duration="1.0" data-fps="30">
        <div id="pxs-clip" class="pxs-stage clip" data-start="0" data-duration="1.0" data-track-index="0">
          <div id="pxs-src" style="display:none"><div id="pxs-a" class="pxs-panel pxs-pa"><div class="pxs-in"><span>Scene A</span><i class="pxs-bar"></i></div></div>
          <div id="pxs-b" class="pxs-panel pxs-pb"><div class="pxs-in"><span>Scene B</span><i class="pxs-bar"></i></div></div></div>
          <div id="pxs-cols-a" class="pxs-layer"></div><div id="pxs-cols-b" class="pxs-layer"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 1.0;

var count = Math.round(num(vars.columns, 40, 2, 120)), seed = Math.round(num(vars.seed, 5, 0, 9999)), streakColor = str(vars.streak_color, "#FFFFFF");
var srcA = document.getElementById("pxs-a"), srcB = document.getElementById("pxs-b");
var layA = document.getElementById("pxs-cols-a"), layB = document.getElementById("pxs-cols-b");
var W = root.clientWidth, H = root.clientHeight, MELT = 0.42, DROP = 0.14, SNAP = 0.12;
var meltEase = inCubic, snapEase = outBack(1.6);
function build(layer, src) {
  var cols = [];
  for (var i = 0; i < count; i++) {
    var rnd = mulberry32(seed * 1009 + i * 37 + 5), left = Math.floor(i * W / count), right = Math.floor((i + 1) * W / count);
    var c = { left: left, meltAt: rnd() * 0.2, amount: 0.25 + Math.pow(rnd(), 2) * 1.6, glow: 0.15 + rnd() * 0.75, from: 10 + rnd() * 50, snapAt: 0.5 + rnd() * (1 - 0.5 - DROP - SNAP) + DROP };
    var col = document.createElement("div");
    col.className = "pxs-col"; col.style.left = left + "px"; col.style.width = (right - left + (i < count - 1 ? 1 : 0)) + "px"; col.style.height = H + "px";
    var copy = stripIds(src.cloneNode(true));
    copy.classList.add("pxs-copy"); copy.style.position = "absolute"; copy.style.left = -left + "px"; copy.style.top = "0"; copy.style.width = W + "px"; copy.style.height = H + "px";
    var st = document.createElement("div"); st.className = "pxs-streak";
    st.style.background = "linear-gradient(to bottom, transparent " + c.from + "%, " + streakColor + " " + (c.from + 30) + "%, transparent 100%)";
    col.appendChild(copy); col.appendChild(st); layer.appendChild(col);
    c.col = col; c.copy = copy; c.st = st; cols.push(c);
  }
  return cols;
}
var colsA = build(layA, srcA), colsB = build(layB, srcB);
function frame(p) {
  colsA.forEach(function (c) {
    var m = meltEase(interp(p, [c.meltAt, c.meltAt + MELT], [0, 1]));
    c.copy.style.transformOrigin = "50% " + c.from + "%";
    c.copy.style.transform = "scaleY(" + (1 + m * c.amount * 4) + ")";
    var s = m * c.glow;
    c.st.style.display = s > 0.002 ? "block" : "none"; c.st.style.opacity = s;
  });
  colsB.forEach(function (c) {
    var drop = interp(p, [c.snapAt - DROP, c.snapAt], [0, 1]);
    if (drop <= 0) { c.col.style.display = "none"; return; }
    var snap = snapEase(interp(p, [c.snapAt, c.snapAt + SNAP], [0, 1]));
    var stretch = lerp(1 + c.amount * 3, 1, snap), shift = -(1 - outCubic(drop)) * H * 1.1;
    var s = (1 - clamp01(snap)) * Math.max(0.5, c.glow);
    c.col.style.display = "block"; c.col.style.opacity = interp(drop, [0, 0.3], [0, 1]);
    c.copy.style.transformOrigin = "50% 0%";
    c.copy.style.transform = "translateY(" + shift + "px) scaleY(" + stretch + ")";
    c.st.style.display = s > 0.002 ? "block" : "none"; c.st.style.opacity = s;
  });
}

            drive("pixel-sort", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
