<html
  lang="en"
  data-composition-id="paper-sticker"
  data-composition-duration="4"
  data-composition-variables='[{"id":"labels","type":"string","role":"content","label":"Labels","description":"Comma-separated labels, one sticker each.","default":"fresh, local, handmade, new, hot"},{"id":"at","type":"number","role":"motion","label":"Slap frame","description":"Frame (30 fps) where the first sticker lands.","default":0,"min":0,"max":60,"step":1,"unit":"frames"},{"id":"stagger","type":"number","role":"motion","label":"Stagger","description":"Frames between one sticker and the next.","default":6,"min":0,"max":20,"step":1,"unit":"frames"},{"id":"padding","type":"string","role":"style","label":"Padding","description":"CSS padding of each chip.","default":"10px 16px"},{"id":"background","type":"color","role":"style","label":"Paper","description":"Chip paper colour.","default":"#fbfaf6"},{"id":"color","type":"color","role":"style","label":"Ink","description":"Label colour.","default":"#26242c"},{"id":"max_tilt","type":"number","role":"motion","label":"Max tilt","description":"Largest resting tilt per sticker.","default":2.6,"min":0,"max":8,"step":0.2,"unit":"deg"},{"id":"seed","type":"string","role":"motion","label":"Seed","description":"Seed for tilt and jitter; each sticker gets its own.","default":"sticker"},{"id":"step","type":"number","role":"motion","label":"Frames per pose","description":"How many frames each pose is held (30 fps).","default":3,"min":1,"max":6,"step":1,"unit":"frames"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Paper Sticker</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
        .ps-stage { position: absolute; inset: 0; }
        #ps-scene { display: flex; flex-wrap: wrap; flex-direction: row; align-items: center; justify-content: center; align-content: center; gap: 24px; padding: 120px; }
        .ps-chip { display: inline-block; border-radius: 3px; box-shadow: 0 2px 5px rgba(38,36,44,0.14); font-size: 28px; white-space: nowrap; }

      </style>

      <div id="root" data-composition-id="paper-sticker" data-duration="4" data-fps="30">
        <div id="ps-clip" class="ps-stage clip" data-start="0" data-duration="4" data-track-index="0">
<div id="ps-scene"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            // Scale a 1280x720 design to the frame (bigger on a tall frame).
            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var scene = document.getElementById("ps-scene");
            scaledStage(scene, 2);
            var labels = str(vars.labels, "fresh, local, handmade, new, hot").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            var at0 = Math.round(num(vars.at, 0, 0, 60)), stagger = Math.round(num(vars.stagger, 6, 0, 20));
            var maxTilt = num(vars.max_tilt, 2.6, 0, 8), step = Math.round(num(vars.step, 3, 1, 6));
            var seed = str(vars.seed, "sticker");
            var ink = str(vars.color, "#26242c"), paper = str(vars.background, "#fbfaf6");
            var chips = labels.map(function (label, i) {
              var el = document.createElement("div");
              el.id = "ps-chip-" + i; el.className = "ps-chip";
              el.style.padding = str(vars.padding, "10px 16px");
              el.style.background = paper; el.style.color = ink;
              el.style.border = "1px solid rgba(38,36,44,0.55)";
              el.textContent = label;
              scene.appendChild(el);
              var s = seed + ":" + label;
              return { el: el, at: at0 + i * stagger, seed: s, tilt: hashRange(s + ":rot", -maxTilt, maxTilt) };
            });
            function draw(frame) {
              chips.forEach(function (c) {
                var p = steppedRamp(frame, c.at, c.at + 2 * step, { step: step });
                if (p === 0) { c.el.style.visibility = "hidden"; return; }
                c.el.style.visibility = "visible";
                var j = paperJitter(frame, "sticker:" + c.seed, { amp: 0.7, rotAmp: 0.2, step: step });
                c.el.style.transform = "translate(" + j.x + "px, " + j.y + "px) rotate(" + (c.tilt + j.rot) + "deg) scale(" + (p < 1 ? 1.12 : 1) + ")";
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 120, draw);

            var total = parseFloat(root.dataset.duration || "4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["paper-sticker"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
