<html
  lang="en"
  data-composition-id="anamorphic-flare"
  data-composition-duration="2.333"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Placeholder lockup text revealed behind the streak.", "default": "studio"},
    {"id": "tint", "type": "color", "role": "style", "label": "Tint", "description": "Warm tint of the streak glow and ghosts.", "default": "#E5322D"},
    {"id": "core_color", "type": "color", "role": "style", "label": "Core", "description": "Color of the hot core line.", "default": "#FFFFFF"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Stage color.", "default": "#111111"},
    {"id": "ghosts", "type": "number", "role": "style", "label": "Ghosts", "description": "Number of ghost orbs mirrored across the frame center.", "default": 4, "min": 0, "max": 12, "step": 1},
    {"id": "y", "type": "number", "role": "style", "label": "Streak height", "description": "Vertical position of the streak, 0 to 1.", "default": 0.5, "min": 0, "max": 1, "step": 0.01},
    {"id": "seed", "type": "number", "role": "motion", "label": "Seed", "description": "Seed for the ghost orbs.", "default": 2, "min": 1, "max": 99, "step": 1},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Anamorphic Flare</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        .af-lockup { display: flex; align-items: center; gap: 28px; }
        .af-mark { width: 120px; height: 120px; border-radius: 32px; display: flex; align-items: center; justify-content: center; background: var(--mark); }
        .af-dot { width: 36px; height: 36px; border-radius: 50%; background: var(--dot); }
        .af-word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 104px; font-weight: 800; letter-spacing: -0.04em; color: var(--text); white-space: nowrap; }
        #root { background: var(--bg); }
        .af-stage { position: absolute; inset: 0; }
        .af-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .af-svg.fx { mix-blend-mode: screen; }
        .af-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      </style>

      <div id="root" data-composition-id="anamorphic-flare" data-duration="2.333" data-fps="30">
        <div id="af-clip" class="af-stage clip" data-start="0" data-duration="2.333" data-track-index="0">
          <svg class="af-svg" id="af-trailsvg"></svg>
          <div class="af-logo" id="af-logo"><div class="af-lockup" id="af-lockup"><div class="af-mark"><div class="af-dot"></div></div><span class="af-word" id="af-word">studio</span></div></div>
          <svg class="af-svg fx" id="af-fx"></svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "anamorphic-flare";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var tsvg = document.getElementById("af-trailsvg"), fx = document.getElementById("af-fx"), logo = document.getElementById("af-logo");
var tint = col(vars.tint, "#E5322D"), coreC = col(vars.core_color, "#FFFFFF"), bg = col(vars.background_color, "#111111");
var ghosts = Math.round(num(vars.ghosts, 4, 0, 12)), yy = num(vars.y, 0.5, 0, 1), seed = Math.round(num(vars.seed, 2, 1, 99)), speed = num(vars.speed, 1, 0, 4);
root.style.setProperty("--bg", bg); root.style.setProperty("--mark", tint); root.style.setProperty("--dot", bg); root.style.setProperty("--text", coreC);
document.getElementById("af-word").textContent = str(vars.text, "studio");
var W = root.clientWidth, H = root.clientHeight;
tsvg.setAttribute("viewBox", "0 0 " + W + " " + H); fx.setAttribute("viewBox", "0 0 " + W + " " + H);
var IGNITE = 6, CROSS_START = 4, CROSS_END = 26;
var cy = yy * H, cx = W / 2, coreH = Math.max(2, H * 0.004), glowH = H * 0.05;
function grad(parent, id, x2, stops) {
  var g = svgEl(x2 === null ? "radialGradient" : "linearGradient", x2 === null ? { id: id } : { id: id, x1: 0, y1: 0, x2: 1, y2: 0 }, parent);
  stops.forEach(function (s) { svgEl("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] }, g); });
}
var d1 = svgEl("defs", {}, tsvg);
grad(d1, "af-trail", 1, [[0, tint, 0], [0.5, tint, 1], [1, tint, 0]]);
var resid = svgEl("rect", { x: 0, y: cy - 1, width: W, height: 2, fill: "url(#af-trail)" }, tsvg);
var d2 = svgEl("defs", {}, fx);
grad(d2, "af-trail2", 1, [[0, tint, 0], [0.5, tint, 1], [1, tint, 0]]);
grad(d2, "af-core", 1, [[0, coreC, 0], [0.5, coreC, 1], [1, coreC, 0]]);
grad(d2, "af-bloom", null, [[0, coreC, 1], [0.25, tint, 0.7], [1, tint, 0]]);
grad(d2, "af-ghost", null, [[0, tint, 0.15], [0.8, tint, 0.5], [1, tint, 0]]);
var flt = svgEl("filter", { id: "af-blur", x: -W, y: -H, width: W * 3, height: H * 3, filterUnits: "userSpaceOnUse" }, d2);
svgEl("feGaussianBlur", { stdDeviation: glowH * 0.35 }, flt);
var grp = svgEl("g", {}, fx);
var glowR = svgEl("rect", { y: cy - glowH / 2, height: glowH, fill: "url(#af-trail2)", opacity: 0.55, filter: "url(#af-blur)" }, grp);
var coreR = svgEl("rect", { y: cy - coreH / 2, height: coreH, fill: "url(#af-core)" }, grp);
var bloom = svgEl("ellipse", { cy: cy, rx: H * 0.16, ry: H * 0.1, fill: "url(#af-bloom)" }, grp);
var gh = [];
for (var i = 0; i < ghosts; i++) {
  gh.push({ k: -1.3 + rnd("anamorphic-flare-" + seed + "-" + i + "-k") * 2.2, r: H * (0.025 + 0.07 * rnd("anamorphic-flare-" + seed + "-" + i + "-r")), o: 0.12 + 0.18 * rnd("anamorphic-flare-" + seed + "-" + i + "-o"), dy: (rnd("anamorphic-flare-" + seed + "-" + i + "-y") - 0.5) * H * 0.05 });
  gh[i].el = svgEl("circle", { fill: "url(#af-ghost)", opacity: gh[i].o * 2 }, grp);
}
var headEase = bez(0.45, 0, 0.4, 1);
function draw(frame) {
  var t = frame * speed;
  var head = interp(t, [CROSS_START, CROSS_END], [0.07, 1.12], headEase), hx = head * W;
  var power = interp(t, [0, IGNITE], [0, 1], outCubic) * interp(t, [CROSS_END - 6, CROSS_END + 2], [1, 0]);
  var streakLen = W * interp(t, [0, 12], [0.04, 1.3], outQuad);
  var soft = W * 0.08;
  var mask = "linear-gradient(90deg, #000 0px, #000 " + (hx - soft) + "px, transparent " + hx + "px)";
  logo.style.webkitMaskImage = mask; logo.style.maskImage = mask;
  resid.setAttribute("opacity", interp(t, [CROSS_END - 2, CROSS_END + 14], [0, 0.14]));
  grp.setAttribute("opacity", power);
  setA(glowR, { x: hx - streakLen * 0.45, width: streakLen * 0.9 });
  setA(coreR, { x: hx - streakLen / 2, width: streakLen });
  setA(bloom, { cx: hx });
  gh.forEach(function (g) { setA(g.el, { cx: cx - (hx - cx) * g.k, cy: cy + g.dy, r: g.r }); });
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
