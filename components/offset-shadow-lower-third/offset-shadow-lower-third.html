<!doctype html>
<!--
  Offset Shadow Lower Third

  A bold news-style lower third: a white headline bar with a colored offset shadow over a colored sub-line with a white one. It holds still.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/lower-third-bild/lower-third-bild.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a German tabloid lower third: the outlet's name and wording are replaced with generic sample text, Barlow Condensed loads from Google Fonts, and sizes are container units so it fills any frame and sits higher on a tall one.
-->
<html
  lang="en"
  data-composition-id="offset-shadow-lower-third"
  data-composition-duration="8"
  data-composition-variables='[
    {"id": "main_text", "type": "string", "role": "content", "label": "Main line", "description": "Headline in the white bar (shown in capitals).", "default": "Exclusive report"},
    {"id": "sub_text", "type": "string", "role": "content", "label": "Sub line", "description": "Line in the colored bar under it.", "default": "Special coverage"},
    {"id": "accent", "type": "color", "role": "style", "label": "Accent", "description": "Color of the sub bar and of the headline&#39;s offset shadow.", "default": "#dd0000"},
    {"id": "main_color", "type": "color", "role": "style", "label": "Headline bar", "description": "Background of the headline bar and the sub bar&#39;s shadow.", "default": "#ffffff"},
    {"id": "main_ink", "type": "color", "role": "style", "label": "Headline ink", "description": "Headline text color.", "default": "#212529"},
    {"id": "sub_ink", "type": "color", "role": "style", "label": "Sub line ink", "description": "Sub line text color.", "default": "#ffffff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Offset Shadow Lower Third</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
          font-family: "Barlow Condensed", sans-serif;
        }
        .ost-stage { position: absolute; inset: 0; }
        #ost-main-outer {
          position: absolute;
          bottom: max(19.907cqmin, 14cqh);
          left: 7.407cqmin;
          padding-right: 1.296cqmin;
          padding-bottom: 1.296cqmin;
          max-width: 96cqw;
        }
        #ost-main {
          font-size: 8.148cqmin;
          font-weight: 800;
          line-height: 1.05;
          color: var(--ost-main-ink, #212529);
          background: var(--ost-main-bg, #ffffff);
          padding: 0.926cqmin 2.037cqmin 0.741cqmin;
          text-transform: uppercase;
          letter-spacing: 0.02em;
          box-shadow: 1.111cqmin 1.111cqmin 0 0 var(--ost-accent, #dd0000);
        }
        #ost-sub-outer {
          position: absolute;
          bottom: calc(max(19.907cqmin, 14cqh) - 7.407cqmin);
          left: 7.407cqmin;
          padding-right: 0.926cqmin;
          padding-bottom: 0.926cqmin;
          max-width: 96cqw;
        }
        #ost-sub {
          font-size: 4.444cqmin;
          font-weight: 700;
          line-height: 1.1;
          color: var(--ost-sub-ink, #ffffff);
          background: var(--ost-accent, #dd0000);
          padding: 0.556cqmin 1.667cqmin 0.463cqmin;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          box-shadow: 0.741cqmin 0.741cqmin 0 0 var(--ost-main-bg, #ffffff);
        }
      </style>

      <div id="root" data-composition-id="offset-shadow-lower-third" data-duration="8" data-fps="30">
        <div id="ost-clip" class="ost-stage clip" data-start="0" data-duration="8" data-track-index="0">
          <div id="ost-main-outer"><div id="ost-main"></div></div>
          <div id="ost-sub-outer"><div id="ost-sub"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function bool(value, fallback) {
              if (value === true || value === "true") return true;
              if (value === false || value === "false") return false;
              return fallback;
            }
            function hex(value, fallback) {
              return typeof value === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim()) ? value.trim() : fallback;
            }
            function rgba(h, a) {
              if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
              return "rgba(" + parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16) + "," + a + ")";
            }

            document.getElementById("ost-main").textContent = str(vars.main_text, "Exclusive report").trim();
            document.getElementById("ost-sub").textContent = str(vars.sub_text, "Special coverage").trim();
            root.style.setProperty("--ost-accent", hex(vars.accent, "#dd0000"));
            root.style.setProperty("--ost-main-bg", hex(vars.main_color, "#ffffff"));
            root.style.setProperty("--ost-main-ink", hex(vars.main_ink, "#212529"));
            root.style.setProperty("--ost-sub-ink", hex(vars.sub_ink, "#ffffff"));
            // Upstream holds still: the host decides how it enters and leaves.
            var tl = gsap.timeline({ paused: true });
            tl.set({}, {}, 8);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["offset-shadow-lower-third"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
