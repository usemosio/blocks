<!doctype html>
<!--
  Text Rotate

  A fixed phrase followed by a pill that cycles through a list of words: the old word's letters slide up and out, the pill springs to the new width and the next word's letters rise in, with a staggered wave.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="text-rotate"
  data-composition-duration="8"
  data-composition-variables='[
    {"id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Fixed text before the rotating word.", "default": "Make it"},
    {"id": "texts", "type": "string", "role": "content", "label": "Words", "description": "Words that rotate, separated by a vertical bar.", "default": "work!|fancy|right|fast|fun"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. A long line shrinks to fit the frame.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "color", "type": "color", "role": "style", "label": "Prefix color", "description": "Color of the fixed text.", "default": "#171717"},
    {"id": "pill_color", "type": "color", "role": "style", "label": "Pill color", "description": "Background of the rotating word.", "default": "#ff3b30"},
    {"id": "pill_text_color", "type": "color", "role": "style", "label": "Pill text color", "description": "Color of the rotating word.", "default": "#ffffff"},
    {"id": "split_by", "type": "enum", "role": "motion", "label": "Split by", "description": "Whether letters or whole words move as one.", "default": "characters", "options": [{"value": "characters", "label": "Characters"}, {"value": "words", "label": "Words"}]},
    {"id": "interval", "type": "number", "role": "motion", "label": "Interval", "description": "Seconds each word is on screen, from the start of one swap to the next.", "default": 1.6, "min": 0.8, "max": 6, "step": 0.1, "unit": "s"},
    {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.025, "min": 0, "max": 0.3, "step": 0.005, "unit": "s"},
    {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of letters starts.", "default": "last", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]},
    {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness of the movement.", "default": 400, "min": 50, "max": 900, "step": 10},
    {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping of the movement.", "default": 30, "min": 5, "max": 80, "step": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Rotate</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #171717; font-family: Geist, system-ui, sans-serif; }
        .tr-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .tr-row { display: flex; align-items: center; white-space: pre; line-height: 1.2; }
        .tr-pill { position: relative; overflow: hidden; border-radius: 0.22em; display: block; margin-left: 0.05em; }
        .tr-sizer { display: block; visibility: hidden; padding: 0.06em 0.3em 0.12em; white-space: pre; width: 0; }
        .tr-layer { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: max-content; display: flex; white-space: pre; padding: 0.06em 0 0.12em; }
        .tr-word { display: inline-flex; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.1em; }
        .tr-ch { display: inline-block; white-space: pre; }
      </style>

      <div id="root" data-composition-id="text-rotate" data-duration="8" data-fps="30">
        <div id="tr-clip" class="tr-stage clip" data-start="0" data-duration="8" data-track-index="0">
          <div id="tr-row" class="tr-row"><span id="tr-prefix"></span><span id="tr-pill" class="tr-pill"><span class="tr-sizer">&nbsp;</span></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var DEFS = [{"id": "prefix", "type": "string", "role": "content", "label": "Prefix", "description": "Fixed text before the rotating word.", "default": "Make it"}, {"id": "texts", "type": "string", "role": "content", "label": "Words", "description": "Words that rotate, separated by a vertical bar.", "default": "work!|fancy|right|fast|fun"}, {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. A long line shrinks to fit the frame.", "default": 110, "min": 24, "max": 300, "step": 1, "unit": "px"}, {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]}, {"id": "color", "type": "color", "role": "style", "label": "Prefix color", "description": "Color of the fixed text.", "default": "#171717"}, {"id": "pill_color", "type": "color", "role": "style", "label": "Pill color", "description": "Background of the rotating word.", "default": "#ff3b30"}, {"id": "pill_text_color", "type": "color", "role": "style", "label": "Pill text color", "description": "Color of the rotating word.", "default": "#ffffff"}, {"id": "split_by", "type": "enum", "role": "motion", "label": "Split by", "description": "Whether letters or whole words move as one.", "default": "characters", "options": [{"value": "characters", "label": "Characters"}, {"value": "words", "label": "Words"}]}, {"id": "interval", "type": "number", "role": "motion", "label": "Interval", "description": "Seconds each word is on screen, from the start of one swap to the next.", "default": 1.6, "min": 0.8, "max": 6, "step": 0.1, "unit": "s"}, {"id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Seconds between neighbouring letters.", "default": 0.025, "min": 0, "max": 0.3, "step": 0.005, "unit": "s"}, {"id": "stagger_from", "type": "enum", "role": "motion", "label": "Stagger from", "description": "Where the wave of letters starts.", "default": "last", "options": [{"value": "first", "label": "First letter"}, {"value": "last", "label": "Last letter"}, {"value": "center", "label": "Center"}, {"value": "random", "label": "Random"}]}, {"id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness of the movement.", "default": 400, "min": 50, "max": 900, "step": 10}, {"id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping of the movement.", "default": 30, "min": 5, "max": 80, "step": 1}];
            var root = document.getElementById("root");
            var raw = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var D = parseFloat(root.dataset.duration || "8");
            function V(id) {
              var d = null;
              for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) d = DEFS[i];
              var v = raw[id];
              if (v === undefined || v === null || (v === "" && d.type !== "string")) return d.default;
              if (d.type === "number") { var n = Number(v); return Number.isFinite(n) ? Math.min(d.max, Math.max(d.min, n)) : d.default; }
              if (d.type === "boolean") return v === true || v === "true";
              if (d.type === "enum") { for (var j = 0; j < d.options.length; j++) if (String(d.options[j].value) === String(v)) return d.options[j].value; return d.default; }
              if (d.type === "string") return typeof v === "string" ? v : d.default;
              return typeof v === "string" && v ? v : d.default;
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function hash3(a, b, c) { return mulberry32((a * 7919 + b * 104729 + c * 1299709) | 0)(); }
            // Stagger delays in seconds: "first", "last", "center", "random" (seeded shuffle) or an index.
            function stagger(n, from, step, seed) {
              var out = [], i;
              if (from === "random") {
                var rng = mulberry32(seed || 7), idx = [];
                for (i = 0; i < n; i++) idx.push(i);
                for (i = n - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
                for (i = 0; i < n; i++) out[idx[i]] = i * step;
                return out;
              }
              for (i = 0; i < n; i++) {
                var k = from === "last" ? n - 1 - i : from === "center" ? Math.abs(Math.floor(n / 2) - i) : typeof from === "number" ? Math.abs(from - i) : i;
                out.push(k * step);
              }
              return out;
            }
            // Damped spring from 0 to 1 (stiffness/damping/mass or duration/bounce, as Motion defines them).
            function spring(o) {
              var m = o.mass || 1, k, c;
              if (o.duration !== undefined) { var w = (2 * Math.PI) / o.duration; k = w * w * m; c = 2 * (1 - (o.bounce || 0)) * Math.sqrt(k * m); }
              else { k = o.stiffness; c = o.damping; }
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              function at(t) {
                if (t <= 0) return 0;
                if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
                if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
                var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
                return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
              }
              var settle = 6;
              for (var t = 0.02; t < 6; t += 0.02) {
                var ok = true;
                for (var u = t; u < Math.min(t + 0.3, 6); u += 0.05) if (Math.abs(1 - at(u)) > 0.002) { ok = false; break; }
                if (ok) { settle = t; break; }
              }
              return { at: at, duration: settle };
            }
            function fitText(text) { return Array.from(text); }

            var row = document.getElementById("tr-row"), pill = document.getElementById("tr-pill");
            var prefix = V("prefix");
            document.getElementById("tr-prefix").textContent = prefix ? prefix + " " : "";
            var texts = String(V("texts")).split("|").map(function (s) { return s.trim(); }).filter(Boolean);
            if (!texts.length) texts = ["work!"];
            var maxLen = prefix.length + 1;
            var longest = 0; texts.forEach(function (s) { longest = Math.max(longest, Array.from(s).length); });
            row.style.fontSize = "min(" + V("font_size") + "px, calc(86cqw / " + ((maxLen + longest + 1) * 0.56).toFixed(2) + "))";
            row.style.fontWeight = V("font_weight"); row.style.color = V("color");
            pill.style.background = V("pill_color"); pill.style.color = V("pill_text_color");
            var splitChars = V("split_by") === "characters";
            var padEm = 0.3;
            var sp = spring({ stiffness: V("stiffness"), damping: V("damping") });
            var layers = texts.map(function (s, k) {
              var layer = document.createElement("span"); layer.className = "tr-layer"; layer.id = "tr-layer-" + k;
              var units = [], words = s.split(" ");
              words.forEach(function (w, wi) {
                var ww = document.createElement("span"); ww.className = "tr-word";
                (splitChars ? fitText(w) : [w]).forEach(function (ch) {
                  var c = document.createElement("span"); c.className = "tr-ch"; c.textContent = ch; ww.appendChild(c); units.push(c);
                });
                layer.appendChild(ww);
                if (wi < words.length - 1) { var sps = document.createElement("span"); sps.className = "tr-ch"; sps.textContent = " "; layer.appendChild(sps); }
              });
              pill.appendChild(layer);
              return { el: layer, units: units, delays: stagger(units.length, V("stagger_from"), V("stagger"), 5 + k) };
            });
            var interval = V("interval"), n = texts.length;
            function widthOf(k) { return layers[k].el.offsetWidth + 2 * padEm * parseFloat(getComputedStyle(row).fontSize); }
            function maxDelay(k) { return Math.max.apply(null, layers[k].delays.concat([0])); }
            var tl = gsap.timeline({ paused: true });
            function setLayer(k, mode, local) {
              var L = layers[k];
              L.el.style.visibility = mode === "hide" ? "hidden" : "visible";
              if (mode === "hide") return;
              for (var i = 0; i < L.units.length; i++) {
                var y = 0;
                if (mode === "exit") y = -120 * sp.at(local - L.delays[i]);
                else if (mode === "enter") y = 100 * (1 - sp.at(local - L.delays[i]));
                L.units[i].style.transform = "translateY(" + y.toFixed(3) + "%)";
              }
            }
            function draw(t) {
              var idx = Math.floor(t / interval + 1e-9), local = t - idx * interval;
              var cur = idx % n, prev = (idx - 1 + n) % n;
              var wCur = widthOf(cur), width = wCur;
              for (var k = 0; k < n; k++) if (k !== cur && k !== prev) setLayer(k, "hide", 0);
              if (idx === 0 || n === 1) { setLayer(cur, "static", 0); if (prev !== cur) setLayer(prev, "hide", 0); }
              else {
                var exitEnd = maxDelay(prev) + sp.duration;
                if (local < exitEnd) { setLayer(prev, "exit", local); setLayer(cur, "hide", 0); width = widthOf(prev); }
                else {
                  setLayer(prev, "hide", 0); setLayer(cur, "enter", local - exitEnd);
                  var wPrev = widthOf(prev); width = wPrev + (wCur - wPrev) * sp.at(local - exitEnd);
                }
              }
              pill.style.width = width.toFixed(2) + "px";
            }

            var clock = { t: 0 };
            tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["text-rotate"] = tl;

          })();
        </script>
      </div>
    </template>
  </body>
</html>
