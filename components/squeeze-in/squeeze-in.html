<!doctype html>
<!--
  Squeeze In

  Characters are uncovered one by one by a clean wipe, then the whole word squeezes tighter as the last one lands.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="squeeze-in"
  data-composition-duration="2"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short title.", "default": "Studio" },
    { "id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Frames per character while the wipe uncovers it (30 fps).", "default": 3, "min": 1, "max": 8, "step": 1, "unit": "frames" },
    { "id": "squeeze", "type": "number", "role": "motion", "label": "Squeeze", "description": "How wide the letter gaps start, as a fraction of the font size. They close to zero.", "default": 0.03, "min": 0, "max": 0.2, "step": 0.005 },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Squeeze In</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .sqz-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sqz-line { display: inline-block; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
        .sqz-char { display: inline-block; white-space: pre; }
      </style>

      <div id="root" data-composition-id="squeeze-in" data-duration="2" data-fps="30">
        <div id="sqz-clip" class="sqz-stage clip" data-start="0" data-duration="2" data-track-index="0">
          <span id="sqz-line" class="sqz-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("sqz-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["squeeze-in"] = tl;
            }
            var text = str(vars.text, "Studio");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "400");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var stagger = num(vars.stagger, 3, 1, 8);
            var squeeze = num(vars.squeeze, 0.03, 0, 0.2);
            var line = document.getElementById("sqz-line");
            line.style.fontWeight = weight;
            line.setAttribute("aria-label", text);
            var chars = Array.from(text).map(function (ch, i) {
              var s = document.createElement("span");
              s.id = "sqz-char-" + i;
              s.className = "sqz-char";
              s.textContent = ch;
              line.appendChild(s);
              return s;
            });
            var size = fit(line, num(vars.font_size, 72, 12, 160), 0.9);

            var out = bz("out", 0.215, 0.61, 0.355, 1);
            var lastReveal = chars.length * stagger;
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var prog = ip(f, lastReveal, lastReveal + 16, 0, 1, out);
              var wipe = ip(f, 0, lastReveal, 100, 0);
              var gap = squeeze * size * (1 - prog);
              chars.forEach(function (c, j) {
                c.style.marginRight = j < chars.length - 1 ? gap + "px" : "0px";
              });
              line.style.transform = "translate(" + (-squeeze * size * prog * (chars.length - 1)) / 2 + "px, 0)";
              line.style.clipPath = "inset(-0.2em " + wipe + "% -0.25em -0.1em)";
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: lastReveal + 16, duration: (lastReveal + 16) / 30, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
