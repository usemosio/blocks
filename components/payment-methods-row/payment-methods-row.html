<!doctype html>
<!--
  Payment Methods Row

  A line ("Bayar pakai apa saja") and a row of generic payment chips (Transfer bank, Kode QR, E-wallet, COD, Kartu) that pop in one after another, each with a small drawn glyph. No brand names or logos. The line and the methods are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="payment-methods-row"
  data-composition-duration="4.5"
  data-composition-variables='[
  {
    "id": "heading",
    "type": "string",
    "role": "content",
    "label": "Heading",
    "description": "Line above the chips.",
    "default": "Bayar pakai apa saja"
  },
  {
    "id": "methods",
    "type": "string",
    "role": "content",
    "label": "Methods",
    "description": "Up to six method names separated by semicolons. Glyphs are chosen by position: bank, QR code, wallet, delivery box, card, then repeating.",
    "default": "Transfer bank; Kode QR; E-wallet; COD; Kartu"
  },
  {
    "id": "stagger",
    "type": "number",
    "role": "motion",
    "label": "Gap between chips",
    "description": "Seconds between two chips popping in.",
    "default": 0.14,
    "min": 0.06,
    "max": 0.4,
    "step": 0.01
  },
  {
    "id": "chip_color",
    "type": "color",
    "role": "style",
    "label": "Chip colour",
    "description": "Chip background.",
    "default": "#ffffff"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The glyph lines: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Payment Methods Row</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--pm-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--pm-bg);
        }
        #root * { box-sizing: border-box; }
        .pm-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .pm-wrap { position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 50%; }
        .pm-head { font-size: calc(var(--u) * 92); font-weight: 700; letter-spacing: -0.045em; line-height: 1.1; text-align: center; margin-bottom: calc(var(--u) * 70); }
        .pm-mask { display: block; overflow: hidden; padding-bottom: calc(var(--u) * 12); }
        .pm-mask > span { display: block; }
        .pm-row { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 28); }
        .pm-chip { display: flex; align-items: center; gap: calc(var(--u) * 20); height: calc(var(--u) * 134); padding: 0 calc(var(--u) * 42) 0 calc(var(--u) * 36); border-radius: calc(var(--u) * 62); background: var(--pm-chip); border: calc(var(--u) * 3) solid rgba(10,10,10,0.14); box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(0,0,0,0.06); font-size: calc(var(--u) * 50); font-weight: 600; letter-spacing: -0.025em; white-space: nowrap; }
        .pm-chip svg { width: calc(var(--u) * 74); height: calc(var(--u) * 74); flex: none; overflow: visible; }

      </style>

      <div id="root" data-composition-id="payment-methods-row" data-duration="4.5" data-fps="30">
        <div id="pm-clip" class="pm-stage clip" data-start="0" data-duration="4.5" data-track-index="0">

          <div class="pm-wrap" id="pm-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("pm", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", chip: "#ffffff" });


            var u = U, wrap = document.getElementById("pm-wrap");
            root.style.setProperty("--pm-chip", colr(vars.chip_color, "#ffffff"));
            var heading = typeof vars.heading === "string" ? vars.heading.trim() : "Bayar pakai apa saja";
            var methods = list(vars.methods, "Transfer bank; Kode QR; E-wallet; COD; Kartu").slice(0, 6);
            var gapT = num(vars.stagger, 0.14, 0.06, 0.4);
            var main = colr(vars.main_color, "#2563eb");
            var GL = [
              [["path", "M3 10 L12 4 L21 10 Z"], ["path", "M6 10v8"], ["path", "M10 10v8"], ["path", "M14 10v8"], ["path", "M18 10v8"], ["path", "M3 20h18"]],
              [["rect", { x: 3, y: 3, width: 7, height: 7, rx: 1 }], ["rect", { x: 14, y: 3, width: 7, height: 7, rx: 1 }], ["rect", { x: 3, y: 14, width: 7, height: 7, rx: 1 }], ["path", "M14 14h3v3h-3z"], ["path", "M20 14v1"], ["path", "M14 20h1"], ["path", "M19 19h2v2"]],
              [["path", "M3 9V6.5A2.5 2.5 0 0 1 5.5 4H17"], ["rect", { x: 3, y: 8, width: 18, height: 12, rx: 2.5 }], ["path", "M16.5 14h4.5"], ["path", "M16.6 14h.01"]],
              [["path", "M4 7.5 L12 3.5 L20 7.5 V16.5 L12 20.5 L4 16.5 Z"], ["path", "M4 7.5 L12 11.5 L20 7.5"], ["path", "M12 11.5V20.5"]],
              [["rect", { x: 2.5, y: 5, width: 19, height: 14, rx: 2.5 }], ["path", "M2.5 10h19"], ["path", "M6 15h4"]]
            ];
            var hEl = el("div", "pm-head", wrap), hm = null;
            if (heading) { var mk = el("span", "pm-mask", hEl); hm = el("span", "", mk); hm.textContent = heading; } else hEl.style.display = "none";
            var row = el("div", "pm-row", wrap), chips = [], strokes = [];
            methods.forEach(function (name, i) {
              var c = el("div", "pm-chip", row);
              var sv = svg("svg", { viewBox: "0 0 24 24", fill: "none", stroke: main, "stroke-width": 1.9, "stroke-linecap": "round", "stroke-linejoin": "round" }, c);
              GL[i % GL.length].forEach(function (g) {
                var e = typeof g[1] === "string" ? svg(g[0], { d: g[1], pathLength: 1 }, sv) : svg(g[0], Object.assign({ pathLength: 1 }, g[1]), sv);
                e.style.strokeDasharray = "1"; e.style.strokeDashoffset = "1"; strokes.push({ e: e, i: i });
              });
              el("span", "", c).textContent = name;
              chips.push(c);
            });
            var gw = (PORTRAIT ? 1000 : 1940) * u;
            wrap.style.width = gw + "px"; row.style.width = gw + "px";
            var gh = wrap.offsetHeight;
            var S = Math.min(1.3, (H * 0.88) / gh, (W * 0.94) / gw);
            wrap.style.height = gh + "px";
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });

            var tl = gsap.timeline({ paused: true });
            if (hm) tl.fromTo(hm, { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.15);
            var t0 = 0.8;
            chips.forEach(function (c, i) {
              tl.fromTo(c, { scale: 0.55, opacity: 0, y: 28 * u }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, t0 + i * gapT * 1.0);
              var mine = strokes.filter(function (s) { return s.i === i; }).map(function (s) { return s.e; });
              tl.fromTo(mine, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.06 }, t0 + i * gapT + 0.2);
            });

            var total = parseFloat(root.dataset.duration || "4.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["payment-methods-row"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
