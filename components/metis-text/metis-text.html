<!doctype html>
<!--
  Metis Line Underline

  A thin line draws under a word from the left, then leaves to the right; it repeats like a hover on a link.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/codse/animata/blob/25c27e5a874c60a56dcc1609df3b2c4f5f8456f8/animata/text/metis-text.tsx
  and animata/text/metis-text.css (after Codrops LineHoverStyles, which that file credits)

<html
  lang="en"
  data-composition-id="metis-text"
  data-composition-duration="5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Label that gets the underline.", "default": "about us"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 110, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "thickness", "type": "number", "role": "style", "label": "Line thickness", "description": "Thickness of the underline in pixels.", "default": 4, "min": 1, "max": 16, "step": 1, "unit": "px"},
    {"id": "gap", "type": "number", "role": "style", "label": "Line gap", "description": "Space between the text and the line in pixels.", "default": 10, "min": 0, "max": 60, "step": 1, "unit": "px"},
    {"id": "draw", "type": "number", "role": "motion", "label": "Draw time", "description": "Seconds for the line to come in or leave.", "default": 0.3, "min": 0.1, "max": 1.5, "step": 0.05, "unit": "s"},
    {"id": "hold", "type": "number", "role": "motion", "label": "Hold", "description": "Seconds the line stays under the text.", "default": 1, "min": 0, "max": 4, "step": 0.1, "unit": "s"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text and line color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "500", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Metis Line Underline</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .mt-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .mt-label { position: relative; display: inline-block; line-height: 1.1; white-space: pre; text-transform: lowercase; }
        .mt-line { position: absolute; left: 0; width: 100%; background: currentColor; transform-origin: 100% 50%; transform: scaleX(0); }
      </style>

      <div id="root" data-composition-id="metis-text" data-duration="5" data-fps="30">
        <div id="mt-clip" class="mt-stage clip" data-start="0" data-duration="5" data-track-index="0">
          <span id="mt-label" class="mt-label"><span id="mt-text"></span><span id="mt-line" class="mt-line"></span></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function opt(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { return typeof v === "boolean" ? v : v === "true" ? true : v === "false" ? false : f; }
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > max) { size = Math.max(12, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            
            var label = document.getElementById("mt-label");
            var line = document.getElementById("mt-line");
            document.getElementById("mt-text").textContent = str(vars.text, "about us");
            root.style.color = col(vars.color, "#171717");
            root.style.fontWeight = opt(vars.font_weight, ["300","400","500","600","700","900"], "500");
            fit(label, num(vars.font_size, 110, 12, 260), 0.85);
            line.style.height = num(vars.thickness, 4, 1, 16) + "px";
            line.style.top = "calc(100% + " + num(vars.gap, 10, 0, 60) + "px)";
            var d = num(vars.draw, 0.3, 0.1, 1.5), hold = num(vars.hold, 1, 0, 4);
            gsap.registerPlugin(CustomEase);
            var ease = CustomEase.create("mt-ease", "M0,0 C0.25,0.1 0.25,1 1,1");
            var tl = gsap.timeline({ paused: true });
            var t = 0.3, cycle = d + hold + d + 0.6;
            while (t + d + hold + d <= parseFloat(root.dataset.duration || "5") + 0.001) {
              tl.fromTo(line, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: d, ease: ease, immediateRender: false }, t);
              tl.fromTo(line, { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 0, transformOrigin: "100% 50%", duration: d, ease: ease, immediateRender: false }, t + d + hold);
              t += cycle;
            }
            gsap.set(line, { scaleX: 0, transformOrigin: "100% 50%" });
            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["metis-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
