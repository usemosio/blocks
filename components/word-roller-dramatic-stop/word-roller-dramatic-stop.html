<!doctype html>
<!--
  Word Roller Dramatic Stop

  A vertical roller that fakes you out: it eases almost to a stop on the wrong word, shudders, speeds up again and finally lands on the last word with a small bounce in the accent colour and two lines drawing out to its sides.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/lifeprompt-team/remotion-scenes/blob/02c7a84241da7010b5f59c420b0110aafd1d6f0d/src/scenes/RollerAnimations/RollerDramaticStop.tsx

<html
  lang="en"
  data-composition-id="word-roller-dramatic-stop"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words in order, separated by commas. The last one is where it settles.", "default": "Good, Better, Great, Amazing, LEGENDARY"},
    {"id": "prefix", "type": "string", "role": "content", "label": "Lead-in", "description": "Line above the roller.", "default": "Not just good, but..."},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the rolling words in pixels. A wide window shrinks to fit the frame.", "default": 64, "min": 16, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Word color", "description": "Color of the words while they roll.", "default": "#0a0a0a"},
    {"id": "accent", "type": "color", "role": "style", "label": "Final color", "description": "Color of the last word and the side lines.", "default": "#2563eb"},
    {"id": "prefix_color", "type": "color", "role": "style", "label": "Lead-in color", "description": "Color of the line above.", "default": "#737373"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#fafafa"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Dramatic Stop</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wds-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #0a0a0a); }
        .wds-g { text-align: center; line-height: 1; position: relative; }
        .wds-lead { font-size: 0.3125em; color: var(--pc, #737373); margin-bottom: 0.9em; white-space: pre; }
        .wds-win { position: relative; overflow: hidden; height: 1.5625em; min-width: 6.25em; display: inline-block; vertical-align: top; }
        .wds-mask { position: absolute; left: 0; right: 0; height: 0.39em; z-index: 1; }
        .wds-mask.t { top: 0; }
        .wds-mask.b { bottom: 0; }
        .wds-strip { position: absolute; left: 0; top: 0; right: 0; }
        .wds-item { height: 1.5625em; display: flex; align-items: center; justify-content: center; white-space: pre; }
        .wds-line { position: absolute; top: 50%; height: 0.047em; background: var(--ac, #2563eb); display: none; transform: translateY(-50%); }
        .wds-frame { position: relative; display: inline-block; }

        .wds-sizer { display: grid; height: 0; overflow: hidden; visibility: hidden; pointer-events: none; }
        .wds-sizer span { grid-area: 1 / 1; white-space: pre; }

        .wds-sizer { padding: 0 0.5em; }
        .wds-sizer span { font-size: 1.125em; font-weight: 700; }

      </style>

      <div id="root" data-composition-id="word-roller-dramatic-stop" data-duration="4" data-fps="30">
        <div id="wds-clip" class="wds-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="wds-g" class="wds-g">
            <div id="wds-lead" class="wds-lead"></div>
            <div class="wds-frame">
              <div class="wds-win">
                <div id="wds-sizer" class="wds-sizer"></div>
                <div id="wds-mt" class="wds-mask t"></div>
                <div id="wds-mb" class="wds-mask b"></div>
                <div id="wds-strip" class="wds-strip"><div id="wds-i0" class="wds-item"></div><div id="wds-i1" class="wds-item"></div></div>
              </div>
              <div id="wds-ll" class="wds-line"></div>
              <div id="wds-lr" class="wds-line"></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "4");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-dramatic-stop"] = tl;
            }

            root.style.background = str(vars.background, "#fafafa");
            
            var words = list(vars.words, ["Good", "Better", "Great", "Amazing", "LEGENDARY"], 10);
            var fi = words.length - 1;
            var g = el("wds-g"), lead = el("wds-lead"), strip = el("wds-strip"), i0 = el("wds-i0"), i1 = el("wds-i1"), ll = el("wds-ll"), lr = el("wds-lr");
            var color = str(vars.color, "#0a0a0a"), accent = str(vars.accent, "#2563eb");
            root.style.setProperty("--c", color);
            root.style.setProperty("--ac", accent);
            if (typeof vars.prefix_color === "string" && vars.prefix_color) root.style.setProperty("--pc", vars.prefix_color);
            var bg = str(vars.background, "#fafafa");
            el("wds-mt").style.background = "linear-gradient(" + bg + ", transparent)";
            el("wds-mb").style.background = "linear-gradient(transparent, " + bg + ")";
            lead.textContent = txt(vars.prefix, "Not just good, but...");
            lead.style.display = lead.textContent ? "" : "none";
            fillSizer(el("wds-sizer"), words);
            var base = num(vars.font_size, 64, 16, 240);
            function fit() {
              g.style.fontSize = base + "px";
              var need = g.offsetWidth + 3.4 * base;
              var k = Math.min(1, root.clientWidth * 0.9 / Math.max(1, need), root.clientHeight * 0.8 / Math.max(1, g.offsetHeight));
              g.style.fontSize = Math.max(6, base * k) + "px";
            }
            fit();
            onFonts(fit);

            function sty(node, idx, fin, emph) {
              var last = idx === fi;
              setText(node, words[idx]);
              node.style.fontSize = (last && fin ? 1.125 : 1) + "em";
              node.style.height = (1.5625 / (last && fin ? 1.125 : 1)) + "em";
              node.style.fontWeight = last ? 700 : 500;
              node.style.color = last ? accent : color;
              node.style.transform = last && fin ? "scale(" + (1 + emph * 0.1) + ")" : "none";
            }
            // remocn-scenes: four phases (slow start, a near stop around 20-25 %, a re-acceleration, then a
            // long ease-out), a damped bounce over the last 10 frames, and a spring-in emphasis at the end.
            function ease(x) {
              if (x < 0.25) return 0.2 * E.quadOut(x / 0.25);
              if (x < 0.4375) return 0.2 + 0.05 * (1 - Math.pow(1 - (x - 0.25) / 0.1875, 3));
              if (x < 0.5625) return 0.25 + 0.1 * E.quadIn((x - 0.4375) / 0.125);
              return 0.35 + 0.65 * (1 - Math.pow(1 - (x - 0.5625) / 0.4375, 4));
            }
            function draw(f) {
              var WH = 100, D = 80, total = fi * WH;
              var scrollY = ease(clamp01(f / D)) * total;
              if (f >= D - 10) {
                var bp = spring(f - (D - 10), { damping: 12, stiffness: 200 });
                scrollY = total + 15 * (1 - bp) * Math.sin((f - (D - 10)) * 0.5);
              }
              if (f >= D) scrollY = total;
              var di = Math.min(Math.floor(scrollY / WH), fi);
              var off = scrollY % WH;
              var fin = f >= D;
              var emph = fin ? spring(f - D, { damping: 8, stiffness: 150 }) : 0;
              sty(i0, di, fin, emph);
              i1.style.display = di < fi ? "" : "none";
              if (di < fi) sty(i1, Math.min(di + 1, fi), false, 0);
              strip.style.transform = "translateY(" + (-off / 64) + "em)";
              var shake = f >= 20 && f < 35 ? Math.sin(f * 2) * 2 * (1 - (f - 20) / 15) : 0;
              g.style.transform = "translateX(" + (shake / 64) + "em)";
              lead.style.opacity = ip(f, 0, 15, 0, 1);
              var show = fin && di === fi;
              ll.style.display = lr.style.display = show ? "block" : "none";
              ll.style.left = "-1.5625em";
              lr.style.right = "-1.5625em";
              ll.style.width = lr.style.width = (60 * emph / 64) + "em";
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
