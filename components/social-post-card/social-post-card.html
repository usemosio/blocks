<!doctype html>
<!--
  Social Post Card

  A dark social post card with avatar, name, handle, text, timestamp and a metrics row rises in, gets liked with a spring bounce and a count change, and drops out.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/x-post/x-post.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a block that showed a real product's interface (a real social network's logo, signature blue, post layout and icon set): it is now a generic social post card with a plain three-dot menu instead of the network's logo, its own simple icons drawn from strokes, and colours as variables; the like count change is a cross-fade between two spans on the timeline instead of text swapped in a callback; fills the host frame (the card is sized from container units, so it fits portrait and landscape frames).
-->
<html
  lang="en"
  data-composition-id="social-post-card"
  data-composition-duration="5"
  data-composition-variables='[
    {
      "id": "display_name",
      "type": "string",
      "role": "content",
      "label": "Display name",
      "description": "Bold name at the top.",
      "default": "Studio Nine"
    },
    {
      "id": "handle",
      "type": "string",
      "role": "content",
      "label": "Handle",
      "description": "Handle under the name.",
      "default": "@studionine"
    },
    {
      "id": "verified",
      "type": "enum",
      "role": "style",
      "label": "Verified badge",
      "description": "Show a round check badge next to the name.",
      "default": "yes",
      "options": [
        {
          "value": "yes",
          "label": "Show"
        },
        {
          "value": "no",
          "label": "Hide"
        }
      ]
    },
    {
      "id": "text",
      "type": "string",
      "role": "content",
      "label": "Post text",
      "description": "Body of the post, four lines at most.",
      "default": "Wrote a 15 second promo as plain text this morning and it rendered while I made coffee. Small shops, big motion."
    },
    {
      "id": "hashtag",
      "type": "string",
      "role": "content",
      "label": "Hashtag",
      "description": "Highlighted hashtag at the end of the text. Empty hides it.",
      "default": "#MadeWithMotion"
    },
    {
      "id": "timestamp",
      "type": "string",
      "role": "content",
      "label": "Timestamp",
      "description": "Line under the text.",
      "default": "1:10 PM · Apr 7, 2026"
    },
    {
      "id": "replies",
      "type": "string",
      "role": "content",
      "label": "Replies",
      "description": "Reply count.",
      "default": "34"
    },
    {
      "id": "reposts",
      "type": "string",
      "role": "content",
      "label": "Reposts",
      "description": "Repost count.",
      "default": "2.3K"
    },
    {
      "id": "likes",
      "type": "string",
      "role": "content",
      "label": "Likes",
      "description": "Like count before the like.",
      "default": "10.9K"
    },
    {
      "id": "likes_after",
      "type": "string",
      "role": "content",
      "label": "Likes after",
      "description": "Like count after the like lands.",
      "default": "11K"
    },
    {
      "id": "views",
      "type": "string",
      "role": "content",
      "label": "Views",
      "description": "View count.",
      "default": "150K"
    },
    {
      "id": "accent",
      "type": "color",
      "role": "style",
      "label": "Accent",
      "description": "Verified badge, hashtag and bottom glow.",
      "default": "#3b9cf5"
    },
    {
      "id": "like_color",
      "type": "color",
      "role": "style",
      "label": "Like colour",
      "description": "Colour of the liked heart and count.",
      "default": "#f91880"
    },
    {
      "id": "card_color",
      "type": "color",
      "role": "style",
      "label": "Card colour",
      "description": "Background of the card.",
      "default": "#15202b"
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Social Post Card</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=block" />
      <style>
        #root { --u: min(0.1045cqw, 0.1cqh); position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; font-family: Inter, system-ui, sans-serif; }
        .sp-card {
          position: absolute; inset: 0; margin: auto; height: fit-content; width: calc(880 * var(--u));
          background: var(--card, #15202b); border-radius: calc(20 * var(--u)); padding: calc(36 * var(--u)) calc(36 * var(--u)) calc(28 * var(--u));
          box-shadow: 0 calc(8 * var(--u)) calc(40 * var(--u)) rgba(0, 0, 0, 0.5); border: calc(1 * var(--u)) solid #38444d; overflow: hidden; opacity: 0;
        }
        .sp-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(80 * var(--u)); background: linear-gradient(to top, var(--glow, rgba(59, 156, 245, 0.1)), transparent); pointer-events: none; }
        .sp-head { display: flex; align-items: flex-start; gap: calc(14 * var(--u)); margin-bottom: calc(18 * var(--u)); position: relative; }
        .sp-avatar { width: calc(52 * var(--u)); height: calc(52 * var(--u)); flex: none; }
        .sp-avatar svg { width: 100%; height: 100%; display: block; }
        .sp-user { display: flex; flex-direction: column; gap: calc(2 * var(--u)); flex: 1; }
        .sp-name { display: flex; align-items: center; gap: calc(6 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 700; color: #e7e9ea; line-height: 1.3; }
        .sp-badge { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
        .sp-handle { font-size: calc(22 * var(--u)); color: #8b98a5; line-height: 1.3; }
        .sp-more { position: absolute; top: calc(10 * var(--u)); right: 0; display: flex; gap: calc(5 * var(--u)); }
        .sp-more i { width: calc(6 * var(--u)); height: calc(6 * var(--u)); border-radius: 50%; background: #8b98a5; }
        .sp-text { font-size: calc(30 * var(--u)); color: #e7e9ea; line-height: 1.45; margin-bottom: calc(12 * var(--u)); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .sp-tag { color: var(--acc, #3b9cf5); }
        .sp-time { font-size: calc(22 * var(--u)); color: #8b98a5; padding-bottom: calc(20 * var(--u)); border-bottom: calc(1 * var(--u)) solid #38444d; margin-bottom: calc(16 * var(--u)); }
        .sp-metrics { display: flex; align-items: center; position: relative; z-index: 1; }
        .sp-left { display: flex; align-items: center; flex: 1; justify-content: space-between; padding-right: calc(60 * var(--u)); }
        .sp-right { display: flex; align-items: center; gap: calc(20 * var(--u)); }
        .sp-m { display: flex; align-items: center; gap: calc(8 * var(--u)); font-size: calc(20 * var(--u)); color: #8b98a5; }
        .sp-ic { width: calc(35 * var(--u)); height: calc(35 * var(--u)); display: flex; align-items: center; justify-content: center; position: relative; }
        .sp-ic svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); display: block; }
        .sp-heart2 { position: absolute; inset: 0; opacity: 0; }
        .sp-heart2 svg { fill: var(--like, #f91880); stroke: var(--like, #f91880); }
        .sp-cnt { position: relative; min-width: calc(62 * var(--u)); height: calc(26 * var(--u)); }
        .sp-cnt span { position: absolute; left: 0; top: 0; line-height: calc(26 * var(--u)); white-space: nowrap; }
        .sp-cnt .after { opacity: 0; color: var(--like, #f91880); }
      </style>

      <div id="root" data-composition-id="social-post-card" data-duration="5" data-fps="30">
        <div id="sp-card" class="sp-card clip" data-start="0" data-duration="5" data-track-index="0">
          <div class="sp-head">
            <div class="sp-avatar"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#536471"/><circle cx="26" cy="21" r="10" fill="#8b98a5"/><ellipse cx="26" cy="42" rx="16" ry="12" fill="#8b98a5"/></svg></div>
            <div class="sp-user">
              <div class="sp-name"><span id="sp-name"></span><svg class="sp-badge" id="sp-badge" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11" fill="var(--acc, #3b9cf5)"/><path d="M9.5 14.25L6.25 11l1.06-1.06 2.19 2.19 4.69-4.69L15.25 8.5 9.5 14.25z" fill="#fff"/></svg></div>
              <span class="sp-handle" id="sp-handle"></span>
            </div>
            <div class="sp-more"><i></i><i></i><i></i></div>
          </div>
          <div class="sp-text"><span id="sp-text"></span> <span class="sp-tag" id="sp-tag"></span></div>
          <div class="sp-time" id="sp-time"></div>
          <div class="sp-metrics">
            <div class="sp-left">
              <div class="sp-m"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H11l-5 4v-4H4z"/></svg></div><span id="sp-replies"></span></div>
              <div class="sp-m"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l3-3 3 3M7 6v8a3 3 0 003 3h4M20 15l-3 3-3-3M17 18v-8a3 3 0 00-3-3h-4"/></svg></div><span id="sp-reposts"></span></div>
              <div class="sp-m" id="sp-like"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><div class="sp-heart2" id="sp-heart2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.4A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg></div></div><div class="sp-cnt"><span id="sp-l1"></span><span class="after" id="sp-l2"></span></div></div>
              <div class="sp-m"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></div><span id="sp-views"></span></div>
            </div>
            <div class="sp-right">
              <div class="sp-m"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div></div>
              <div class="sp-m"><div class="sp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4M5 14v5h14v-5"/></svg></div></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
          "use strict";
          var root = document.getElementById("root");
          var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          function txt(v, f) { return typeof v === "string" && v.trim() ? v : f; }
          function hex(c, f) { c = String(c || "").trim().replace("#", ""); if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2]; return /^[0-9a-fA-F]{6}$/.test(c) ? "#" + c : f; }
          function $(id) { return document.getElementById(id); }
          function finish(tl, name) {
            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[name] = tl;
          }
          $("sp-name").textContent = txt(vars.display_name, "Studio Nine");
          $("sp-handle").textContent = txt(vars.handle, "@studionine");
          $("sp-text").textContent = txt(vars.text, "Wrote a 15 second promo as plain text this morning and it rendered while I made coffee. Small shops, big motion.");
          $("sp-tag").textContent = typeof vars.hashtag === "string" ? vars.hashtag : "#MadeWithMotion";
          $("sp-time").textContent = txt(vars.timestamp, "1:10 PM \u00b7 Apr 7, 2026");
          $("sp-replies").textContent = txt(vars.replies, "34");
          $("sp-reposts").textContent = txt(vars.reposts, "2.3K");
          $("sp-l1").textContent = txt(vars.likes, "10.9K");
          $("sp-l2").textContent = txt(vars.likes_after, "11K");
          $("sp-views").textContent = txt(vars.views, "150K");
          if (vars.verified === "no") $("sp-badge").style.display = "none";
          var acc = hex(vars.accent, "#3b9cf5");
          root.style.setProperty("--acc", acc);
          root.style.setProperty("--glow", acc + "1a");
          root.style.setProperty("--like", hex(vars.like_color, "#f91880"));
          root.style.setProperty("--card", hex(vars.card_color, "#15202b"));
          var card = $("sp-card"), u = (card.offsetWidth || 880) / 880;
          var tl = gsap.timeline({ paused: true });
          gsap.set(card, { y: 400 * u, opacity: 0 });
          tl.to(card, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.to("#sp-like", { scale: 0.85, duration: 0.12, ease: "power2.out" }, 1.5);
          tl.to("#sp-like", { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.4)" }, 1.62);
          tl.to("#sp-heart2", { opacity: 1, duration: 0.12, ease: "none" }, 1.62);
          tl.to("#sp-l1", { opacity: 0, duration: 0.12, ease: "none" }, 1.62);
          tl.to("#sp-l2", { opacity: 1, duration: 0.12, ease: "none" }, 1.62);
          tl.to(card, { y: 400 * u, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.2);
          finish(tl, "social-post-card");
          })();
        </script>
      </div>
    </template>
  </body>
</html>
