<!doctype html>
<!--
  Turntable

  A product card with real thickness spins on an invisible turntable through front, edge and back, with face shading, a moving sheen and a floor shadow. The faces are placeholders; a host puts its own content in the .tt-front and .tt-back markup in the script.

<html
  lang="en"
  data-composition-id="turntable"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "thickness", "type": "number", "role": "style", "label": "Thickness", "description": "Card thickness in px at 720p.", "default": 22, "min": 4, "max": 80, "step": 1, "unit": "px"},
    {"id": "turns", "type": "number", "role": "motion", "label": "Turns", "description": "Full rotations per spin.", "default": 1, "min": 0.25, "max": 4, "step": 0.25},
    {"id": "tilt", "type": "number", "role": "motion", "label": "Tilt", "description": "Camera tilt in degrees; positive looks down on the card.", "default": 8, "min": -30, "max": 30, "step": 1, "unit": "deg"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Stage background.", "default": "#111111"},
    {"id": "front_color", "type": "color", "role": "style", "label": "Front", "description": "Default front face color.", "default": "#E5322D"},
    {"id": "back_color", "type": "color", "role": "style", "label": "Back", "description": "Default back face color.", "default": "#F2F2F2"},
    {"id": "edge_color", "type": "color", "role": "style", "label": "Edge", "description": "Card edge color.", "default": "#A3201C"},
    {"id": "mark_color", "type": "color", "role": "style", "label": "Mark", "description": "Color of the marks on the default front.", "default": "#FFFFFF"},
    {"id": "shadow_color", "type": "color", "role": "style", "label": "Shadow", "description": "Floor shadow color.", "default": "#000000"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Turntable</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: radial-gradient(ellipse 60% 40% at 50% var(--floor), rgba(255,255,255,0.07), rgba(255,255,255,0) 70%), var(--background); }
        .tt-stage { position: absolute; inset: 0; overflow: hidden; }
        .tt-shadow { position: absolute; border-radius: 50%; background: var(--shadow); }
        .tt-persp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .tt-card { position: relative; transform-style: preserve-3d; }
        .tt-face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; }
        .tt-sheen, .tt-dark { position: absolute; inset: 0; }
        .tt-dark { background: #000; }
        .tt-slab { position: absolute; background: var(--edge); }
        /* Default faces. A host replaces the contents of .tt-front / .tt-back with its own markup. */
        .tt-front { position: absolute; inset: 0; background: var(--front); padding: 9%; display: flex; flex-direction: column; justify-content: space-between; }
        .tt-ring { width: 22%; aspect-ratio: 1; border-radius: 50%; border: 0.6em solid var(--mark); }
        .tt-lines { display: flex; flex-direction: column; gap: 0.5em; }
        .tt-line { height: 0.9em; background: var(--mark); border-radius: 99px; }
        .tt-backf { position: absolute; inset: 0; background: var(--back); }
        .tt-strip { position: absolute; top: 16%; left: 0; right: 0; height: 18%; background: #111111; }
        .tt-chip { position: absolute; right: 9%; bottom: 12%; width: 16%; aspect-ratio: 1; border-radius: 28%; background: var(--front); }
      </style>

      <div id="root" data-composition-id="turntable" data-duration="3" data-fps="30">
        <div id="tt-clip" class="tt-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div class="tt-shadow" id="tt-shadow"></div>
          <div class="tt-persp" id="tt-persp">
            <div class="tt-card" id="tt-card"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "turntable";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var persp = document.getElementById("tt-persp"), card = document.getElementById("tt-card"), shadow = document.getElementById("tt-shadow");
var thickness = num(vars.thickness, 22, 4, 80), turns = num(vars.turns, 1, 0.25, 4), tilt = num(vars.tilt, 8, -30, 30), speed = num(vars.speed, 1, 0, 4);
var C = { background: col(vars.background_color, "#111111"), front: col(vars.front_color, "#E5322D"), back: col(vars.back_color, "#F2F2F2"), edge: col(vars.edge_color, "#A3201C"), mark: col(vars.mark_color, "#FFFFFF"), shadow: col(vars.shadow_color, "#000000") };
var W = root.clientWidth, H = root.clientHeight;
var unit = H / 720, cardH = H * 0.46, cardW = cardH * 1.58;
// Keep the card inside narrow frames.
if (cardW > W * 0.8) { cardW = W * 0.8; cardH = cardW / 1.58; }
var depth = thickness * unit, radius = Math.min(cardH * 0.06, depth * 1.2);
var floorY = H / 2 + cardH / 2 + H * 0.075;
root.style.setProperty("--background", C.background); root.style.setProperty("--front", C.front); root.style.setProperty("--back", C.back); root.style.setProperty("--edge", C.edge); root.style.setProperty("--mark", C.mark); root.style.setProperty("--shadow", C.shadow);
root.style.setProperty("--floor", (floorY / H) * 100 + "%");
persp.style.perspective = H * 2.4 + "px";
card.style.width = cardW + "px"; card.style.height = cardH + "px";
function slab(w, h) {
  var s = document.createElement("div"); s.className = "tt-slab";
  s.style.left = (cardW - w) / 2 + "px"; s.style.top = (cardH - h) / 2 + "px"; s.style.width = w + "px"; s.style.height = h + "px";
  card.appendChild(s); return s;
}
var sR = slab(depth, cardH - radius * 2), sL = slab(depth, cardH - radius * 2), sT = slab(cardW - radius * 2, depth), sB = slab(cardW - radius * 2, depth);
sR.style.transform = "rotateY(90deg) translateZ(" + cardW / 2 + "px)";
sL.style.transform = "rotateY(-90deg) translateZ(" + cardW / 2 + "px)";
sT.style.transform = "rotateX(90deg) translateZ(" + cardH / 2 + "px)"; sT.style.filter = "brightness(1.1)";
sB.style.transform = "rotateX(-90deg) translateZ(" + cardH / 2 + "px)"; sB.style.filter = "brightness(0.6)";
function face(inner, transform) {
  var f = document.createElement("div"); f.className = "tt-face";
  f.style.borderRadius = radius + "px"; f.style.transform = transform; f.style.fontSize = cardH / 30 + "px";
  f.innerHTML = '<div class="tt-content">' + inner + '</div><div class="tt-sheen"></div><div class="tt-dark"></div>';
  card.appendChild(f);
  return { sheen: f.querySelector(".tt-sheen"), dark: f.querySelector(".tt-dark") };
}
var fr = face('<div class="tt-front"><div class="tt-ring"></div><div class="tt-lines"><div class="tt-line" style="width:62%"></div><div class="tt-line" style="width:38%;opacity:.55"></div></div></div>', "translateZ(" + depth / 2 + "px)");
var bk = face('<div class="tt-backf"><div class="tt-strip"></div><div class="tt-chip"></div></div>', "rotateY(180deg) translateZ(" + depth / 2 + "px)");
shadow.style.top = floorY - H * 0.025 + "px"; shadow.style.height = H * 0.05 + "px"; shadow.style.filter = "blur(" + H * 0.018 + "px)";
var START = 6, END = 64, spinEase = bez(0.55, 0, 0.25, 1);
function light(nx, nz) { return 0.55 + 0.45 * Math.max(0, nz * 0.85 - nx * 0.5); }
function draw(frame) {
  var t = frame * speed;
  var angle = interp(t, [START, END], [0, 1], spinEase) * 360 * turns, rad = (angle * Math.PI) / 180;
  var cos = Math.cos(rad), sin = Math.sin(rad);
  var sheen = 50 + sin * 120;
  card.style.transform = "rotateX(" + -tilt + "deg) rotateY(" + angle + "deg)";
  sR.style.filter = "brightness(" + light(cos, -sin) + ")";
  sL.style.filter = "brightness(" + light(-cos, sin) + ")";
  [[fr, light(sin, cos)], [bk, light(-sin, -cos)]].forEach(function (f) {
    f[0].sheen.style.background = "linear-gradient(105deg, rgba(255,255,255,0) " + (sheen - 22) + "%, rgba(255,255,255,0.22) " + sheen + "%, rgba(255,255,255,0) " + (sheen + 22) + "%)";
    f[0].dark.style.opacity = 1 - f[1];
  });
  var footprint = Math.abs(cos) * cardW + Math.abs(sin) * depth, shadowW = Math.max(footprint, depth * 3);
  shadow.style.left = W / 2 - shadowW / 2 + "px"; shadow.style.width = shadowW + "px";
  shadow.style.opacity = 0.45 + 0.35 * Math.abs(cos);
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
