<!doctype html>
<!--
  Text Loop

  A list of words or phrases takes turns in one spot: the current one slides up and fades out while the next slides in from below, on a fixed interval, round and round.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/ibelick/motion-primitives/blob/120f64f6ca60348e251f929e9c81f11ccbe45eda/components/core/text-loop.tsx

<html
  lang="en"
  data-composition-id="text-loop"
  data-composition-duration="6.5"
  data-composition-variables='[
    {"id": "items", "type": "string", "role": "content", "label": "Items", "description": "Words or phrases separated by commas.", "default": "Design, Motion, Story, Craft"},
    {"id": "interval", "type": "number", "role": "motion", "label": "Interval", "description": "Seconds between swaps.", "default": 2, "min": 0.5, "max": 8, "step": 0.1, "unit": "s"},
    {"id": "transition", "type": "number", "role": "motion", "label": "Swap time", "description": "Seconds each slide takes.", "default": 0.3, "min": 0.1, "max": 1.5, "step": 0.05, "unit": "s"},
    {"id": "distance", "type": "number", "role": "motion", "label": "Distance", "description": "How far the text travels while it swaps.", "default": 40, "min": 0, "max": 200, "step": 1, "unit": "px"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 120, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Loop</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .tlp-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .tlp-wrap { display: grid; place-items: center; white-space: nowrap; line-height: 1.15; letter-spacing: -0.03em; }
        .tlp-item { grid-area: 1 / 1; opacity: 0; will-change: transform, opacity; }
      </style>

      <div id="root" data-composition-id="text-loop" data-duration="6.5" data-fps="30">
        <div id="tlp-clip" class="tlp-stage clip" data-start="0" data-duration="6.5" data-track-index="0">
          <div id="tlp-wrap" class="tlp-wrap" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "6.5");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("tlp-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-loop"] = tl;
            }


            var wrap = document.getElementById("tlp-wrap");
            var items = str(vars.items, "Design, Motion, Story, Craft").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            if (items.length < 2) items = ["Design", "Motion"];
            var interval = num(vars.interval, 2, 0.5, 8), dur = num(vars.transition, 0.3, 0.1, 1.5), dist = num(vars.distance, 40, 0, 200);
            wrap.style.fontSize = num(vars.font_size, 120, 12, 240) + "px";
            wrap.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "600");
            wrap.setAttribute("aria-label", items.join(", "));
            var els = items.map(function (t, i) { var s = document.createElement("div"); s.className = "tlp-item"; s.textContent = t; wrap.appendChild(s); return s; });
            var maxW = root.clientWidth * 0.9;
            if (wrap.scrollWidth > maxW) wrap.style.fontSize = (parseFloat(wrap.style.fontSize) * maxW / wrap.scrollWidth) + "px";
            var tl = gsap.timeline({ paused: true });
            gsap.set(els[0], { opacity: 1 });
            for (var k = 1; k * interval + dur <= total + 0.001; k++) {
              var out = els[(k - 1) % els.length], inn = els[k % els.length], at = k * interval;
              tl.fromTo(out, { y: 0, opacity: 1 }, { y: -dist, opacity: 0, duration: dur, ease: EIO, immediateRender: false }, at);
              tl.fromTo(inn, { y: dist, opacity: 0 }, { y: 0, opacity: 1, duration: dur, ease: EIO, immediateRender: false }, at);
            }
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
