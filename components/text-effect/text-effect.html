<!doctype html>
<!--
  Text Effect

  Text enters piece by piece with a preset (blur, fade-in-blur, scale, fade, slide) split per character, per word or per line, with the source's stagger times, and can leave in reverse.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/ibelick/motion-primitives/blob/120f64f6ca60348e251f929e9c81f11ccbe45eda/components/core/text-effect.tsx

<html
  lang="en"
  data-composition-id="text-effect"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text to reveal. A new line starts a new line when per is line.", "default": "Text that arrives with style"},
    {"id": "preset", "type": "enum", "role": "motion", "label": "Preset", "description": "How each piece appears.", "default": "fade-in-blur", "options": [{"value": "blur", "label": "Blur"}, {"value": "fade-in-blur", "label": "Fade in + blur"}, {"value": "scale", "label": "Scale"}, {"value": "fade", "label": "Fade"}, {"value": "slide", "label": "Slide"}]},
    {"id": "per", "type": "enum", "role": "motion", "label": "Split", "description": "Reveal per character, word or line.", "default": "word", "options": [{"value": "char", "label": "Character"}, {"value": "word", "label": "Word"}, {"value": "line", "label": "Line"}]},
    {"id": "delay", "type": "number", "role": "motion", "label": "Delay", "description": "Seconds before the first piece starts.", "default": 0.3, "min": 0, "max": 5, "step": 0.05, "unit": "s"},
    {"id": "speed_reveal", "type": "number", "role": "motion", "label": "Reveal speed", "description": "Higher values shorten the gap between pieces.", "default": 1, "min": 0.2, "max": 5, "step": 0.1},
    {"id": "speed_segment", "type": "number", "role": "motion", "label": "Segment speed", "description": "Higher values shorten the animation of each piece.", "default": 1, "min": 0.2, "max": 5, "step": 0.1},
    {"id": "exit", "type": "boolean", "role": "motion", "label": "Leave at the end", "description": "Play the reverse (last piece first) near the end.", "default": false},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "800", "label": "Extra bold"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Text Effect</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .tef-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .tef-text { width: 88%; text-align: center; line-height: 1.15; letter-spacing: -0.02em; }
        .tef-line { display: block; }
        .tef-seg, .tef-ch { display: inline-block; white-space: pre; }
      </style>

      <div id="root" data-composition-id="text-effect" data-duration="3.5" data-fps="30">
        <div id="tef-clip" class="tef-stage clip" data-start="0" data-duration="3.5" data-track-index="0">
          <div id="tef-text" class="tef-text" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "3.5");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("tef-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["text-effect"] = tl;
            }


            var box = document.getElementById("tef-text");
            var text = str(vars.text, "Text that arrives with style").replace(/\\n/g, "\n");
            var preset = pick(vars.preset, ["blur", "fade-in-blur", "scale", "fade", "slide"], "fade-in-blur");
            var per = pick(vars.per, ["char", "word", "line"], "word");
            var delay = num(vars.delay, 0.3, 0, 5), sr = num(vars.speed_reveal, 1, 0.2, 5), ss = num(vars.speed_segment, 1, 0.2, 5);
            var size = num(vars.font_size, 72, 12, 240);
            box.style.fontSize = size + "px";
            box.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700", "800"], "600");
            box.setAttribute("aria-label", text.replace(/\n/g, " "));
            var items = [];
            function add(cls, txt) { var s = document.createElement("span"); s.className = cls; s.textContent = txt; return s; }
            if (per === "line") {
              text.split("\n").forEach(function (l) { var s = add("tef-line", l || " "); box.appendChild(s); items.push(s); });
            } else {
              text.split(/(\s+)/).filter(function (s) { return s !== ""; }).forEach(function (seg) {
                var w = add("tef-seg", per === "word" ? seg : "");
                if (per === "char") Array.from(seg).forEach(function (ch) { var c = add("tef-ch", ch); w.appendChild(c); items.push(c); });
                else items.push(w);
                box.appendChild(w);
              });
            }
            // The source's pixel values are for body-size text; scale them with the type.
            var k = size / 36;
            var PRESETS = {
              "blur": { y: 0, s: 1, b: 12 }, "fade-in-blur": { y: 20, s: 1, b: 12 },
              "scale": { y: 0, s: 0, b: 0 }, "fade": { y: 0, s: 1, b: 0 }, "slide": { y: 20, s: 1, b: 0 }
            };
            var P = PRESETS[preset];
            function hidden() { var o = { opacity: 0, y: P.y * k, scale: P.s }; if (P.b) o.filter = "blur(" + P.b * k + "px)"; return o; }
            function shown() { var o = { opacity: 1, y: 0, scale: 1 }; if (P.b) o.filter = "blur(0px)"; return o; }
            var stagger = ({ char: 0.03, word: 0.05, line: 0.1 })[per] / sr, seg = 0.3 / ss;
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EIO, immediateRender: true }, delay);
            items.forEach(function (el, i) {
              var h = hidden(), s = shown();
              tl.fromTo(el, h, Object.assign({ duration: seg, ease: EIO, immediateRender: true }, s), delay + i * stagger);
            });
            if (bool(vars.exit, false)) {
              var spanEnd = (items.length - 1) * stagger + seg;
              var at = Math.max(delay + spanEnd, total - spanEnd - 0.15);
              items.forEach(function (el, i) {
                tl.to(el, Object.assign({ duration: seg, ease: EIO }, hidden()), at + (items.length - 1 - i) * stagger);
              });
            }
            finish(tl, null);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
