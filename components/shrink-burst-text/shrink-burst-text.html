  Shrink Burst Text

  A word squeezes tight and trembles, then bursts into letters that fly outward, spin and fade; the word slides back up into place and the cycle repeats.

<html
  lang="en"
  data-composition-id="shrink-burst-text"
  data-composition-duration="7.4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Short phrase that bursts.", "default": "Hello there"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 110, "min": 12, "max": 300, "step": 1, "unit": "px"},
    {"id": "spread", "type": "number", "role": "motion", "label": "Spread", "description": "Multiplier for how far the letters fly.", "default": 1, "min": 0.2, "max": 2, "step": 0.1},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "700", "options": [{"value": "300", "label": "Light"}, {"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}, {"value": "900", "label": "Black"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shrink Burst Text</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .sb-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sb-row { display: inline-flex; align-items: center; justify-content: center; line-height: 1.1; white-space: pre; transform-origin: 50% 50%; }
        .sb-ch { display: inline-block; white-space: pre; transform-origin: 50% 50%; }
      </style>

      <div id="root" data-composition-id="shrink-burst-text" data-duration="7.4" data-fps="30">
        <div id="sb-clip" class="sb-stage clip" data-start="0" data-duration="7.4" data-track-index="0">
          <div id="sb-row" class="sb-row" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function col(v, f) { return typeof v === "string" && v ? v : f; }
            function opt(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { return typeof v === "boolean" ? v : v === "true" ? true : v === "false" ? false : f; }
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > max) { size = Math.max(12, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            function spring(t, k, c, m) {
              if (t <= 0) return 0;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
              if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            var row = document.getElementById("sb-row");
            var text = str(vars.text, "Hello there");
            var spreadK = num(vars.spread, 1, 0.2, 2);
            root.style.color = col(vars.color, "#171717");
            root.style.fontWeight = opt(vars.font_weight, ["300","400","500","600","700","900"], "700");
            row.setAttribute("aria-label", text);
            var chars = Array.from(text).map(function (c) {
              var s = document.createElement("span"); s.className = "sb-ch"; s.textContent = c; row.appendChild(s); return s;
            });
            var n = chars.length;
            var size = fit(row, num(vars.font_size, 110, 12, 300), 0.8);
            var k = size / 30, CYCLE = 3.7;
            function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function sm(u) { return u * u * (3 - 2 * u); }
            function kf(a, p, times) {
              p = Math.min(1, Math.max(0, p));
              if (!times) { times = a.map(function (_, i) { return i / (a.length - 1); }); }
              for (var i = 0; i < a.length - 1; i++) {
                if (p <= times[i + 1] || i === a.length - 2) {
                  var u = (p - times[i]) / (times[i + 1] - times[i]); u = Math.min(1, Math.max(0, u));
                  return a[i] + (a[i + 1] - a[i]) * sm(u);
                }
              }
              return a[a.length - 1];
            }
            function params(cycle) {
              var out = [];
              for (var i = 0; i < n; i++) {
                var r = rng(cycle * 7919 + i * 104729 + 17);
                var j = [-3 + r() * 6, 3 - r() * 6, -2 + r() * 4, 2 - r() * 4];
                var dir = r() > r() ? -1 : 1;
                var x = r() * 10 * n * dir;
                var radius = n * 4, ang = n > 1 ? (i / (n - 1)) * Math.PI : 0;
                var y = radius * -Math.sin(ang) * r();
                var rot = r() * 360 * dir;
                out.push({ j: j, x: x * spreadK, y: y * spreadK, rot: rot, s3: 1 + r() + 0.2, s4: 1 + r() * 2 });
              }
              return out;
            }
            var cache = {};
            function draw(t) {
              var cycle = Math.floor(t / CYCLE), tc = t - cycle * CYCLE;
              var P = cache[cycle] || (cache[cycle] = params(cycle));
              var cx = 0, cy = 0, cs = 1, co = 1, ls = 0;
              var A = {}; // per-letter state
              chars.forEach(function (el, i) {
                var p = P[i], x = 0, y = 0, rot = 0, sc = 1, op = 1;
                if (tc < 1) {
                  var u = 1 - Math.pow(1 - tc, 2);
                  sc = 1 + 0.1 * u;
                  if (tc >= 0.1 && tc <= 0.6) { var q = (tc - 0.1) / 0.5; x = kf([0, p.j[0], p.j[1], 0], q) * k; y = kf([0, p.j[2], p.j[3], 0], q) * k; }
                } else if (tc < 1.8) {
                  var e = (tc - 1) / 0.8;
                  x = kf([0, p.x * 0.5, p.x * 0.7, p.x], e) * k; y = kf([0, p.y, -p.y / 5, 0, 5], e) * k;
                  rot = kf([0, p.rot * 0.4, p.rot * 0.8, p.rot], e); sc = kf([0.9, 1.2, p.s3, p.s4], e); op = kf([1, 0.8, 0.5, 0], e);
                } else if (tc < 2.65) { op = 0; }
                else { op = Math.min(1, Math.max(0, spring(tc - 2.65, 39.48, 9.42, 1))); }
                el.style.opacity = op;
                el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + rot + "deg) scale(" + sc + ")";
              });
              if (tc < 1) {
                var u2 = 1 - Math.pow(1 - tc, 2);
                cs = 1 - 0.2 * u2; ls = -0.05 * u2;
                if (tc >= 0.1 && tc <= 0.6) { var q2 = (tc - 0.1) / 0.5; cx = kf([0, -3, 3, -3, 3, 0], q2) * k; cy = kf([0, -2, 2, -2, 2, 0], q2) * k; }
              } else if (tc < 1.8) {
                var e2 = (tc - 1) / 0.8;
                cs = kf([0.7, 0.9, 1], e2, [0, 0.9, 1]); co = kf([1, 0.7, 0], e2, [0, 0.9, 1]);
              } else if (tc < 2.65) { co = 0; cy = 50 * k; }
              else { var s = spring(tc - 2.65, 39.48, 9.42, 1); cy = 50 * k * (1 - s); co = Math.min(1, Math.max(0, s)); }
              row.style.opacity = co;
              row.style.letterSpacing = ls + "em";
              row.style.transform = "translate(" + cx + "px," + cy + "px) scale(" + cs + ")";
            }
            var clock = { t: 0 };
            var total0 = parseFloat(root.dataset.duration || "7.4");
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, { t: total0, duration: total0, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            var total = parseFloat(root.dataset.duration || "7.4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["shrink-burst-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
