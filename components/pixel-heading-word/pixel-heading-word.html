<!doctype html>
<!--
  Pixel Heading Word

  A heading set in a pixel typeface that changes face as a pointer rests on it: either cycling through five pixel styles every few hundred milliseconds, or swapping once to a hover style, with the style name in a small label.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/nolly-studio/cult-ui/blob/d71b1428b811c2779d46ea41b7ef8c9f9c9991c2/apps/www/registry/default/ui/pixel-heading-word.tsx

-->
<html
  lang="en"
  data-composition-id="pixel-heading-word"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Heading text.", "default": "Pixel Perfect"},
    {"id": "initial_font", "type": "enum", "role": "style", "label": "Starting face", "description": "Pixel face shown before the pointer arrives.", "default": "square", "options": [{"value": "square", "label": "Square (Geist Pixel)"}, {"value": "grid", "label": "Grid (Pixelify Sans)"}, {"value": "circle", "label": "Circle (Silkscreen)"}, {"value": "triangle", "label": "Triangle (Jersey 10)"}, {"value": "line", "label": "Line (Tiny5)"}]},
    {"id": "hover_font", "type": "enum", "role": "style", "label": "Hover face", "description": "Swap once to this face on hover; leave on Cycle to step through all five.", "default": "cycle", "options": [{"value": "cycle", "label": "Cycle through all"}, {"value": "square", "label": "Square (Geist Pixel)"}, {"value": "grid", "label": "Grid (Pixelify Sans)"}, {"value": "circle", "label": "Circle (Silkscreen)"}, {"value": "triangle", "label": "Triangle (Jersey 10)"}, {"value": "line", "label": "Line (Tiny5)"}]},
    {"id": "cycle_interval", "type": "number", "role": "motion", "label": "Cycle interval", "description": "Milliseconds between face changes while cycling.", "default": 300, "min": 100, "max": 1500, "step": 10, "unit": "ms"},
    {"id": "hover_at", "type": "number", "role": "motion", "label": "Pointer enters", "description": "Seconds before the pointer rests on the heading.", "default": 0.6, "min": 0, "max": 5, "step": 0.1, "unit": "s"},
    {"id": "hover_until", "type": "number", "role": "motion", "label": "Pointer leaves", "description": "Seconds when the pointer leaves again.", "default": 3.4, "min": 0.5, "max": 8, "step": 0.1, "unit": "s"},
    {"id": "show_label", "type": "boolean", "role": "style", "label": "Show style label", "description": "Show the name of the current face under the heading.", "default": true},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 120, "min": 12, "max": 260, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pixel Heading Word</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Pixel&amp;family=Pixelify+Sans&amp;family=Silkscreen&amp;family=Jersey+10&amp;family=Tiny5&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, "Geist", system-ui, sans-serif);
          pointer-events: none;
        }
        .pxw-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pxh-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.5em; max-width: 92%; }
        .pxh-head { text-align: center; line-height: 1.1; letter-spacing: 0; margin: 0; font-weight: 400; }
        .pxh-label { font-family: "Geist", system-ui, sans-serif; font-size: 0.14em; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0; color: #71717a; }
        .pxh-preload { position: absolute; left: 0; top: 0; opacity: 0; font-size: 12px; pointer-events: none; }
      </style>

      <div id="root" data-composition-id="pixel-heading-word" data-duration="4" data-fps="30">
        <div id="pxw-clip" class="pxw-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="pxh-wrap"><h1 id="pxw-head" class="pxh-head" style="font-size:1em"></h1><output id="pxw-label" class="pxh-label"></output></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, mn, mx) { var n = Number(v); return Number.isFinite(n) ? Math.min(mx, Math.max(mn, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function pick(v, l, f) { return l.indexOf(String(v)) >= 0 ? String(v) : f; }
            function bool(v, f) { if (typeof v === "boolean") return v; if (v === "true") return true; if (v === "false") return false; return f; }
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            gsap.registerPlugin(CustomEase);
            var total = parseFloat(root.dataset.duration || "4");
            // Motion tweens with no easing named run easeInOut.
            var EIO = CustomEase.create("pxw-eio", "M0,0 C0.42,0 0.58,1 1,1");
            // Unit step response of a damped spring (semi-implicit Euler at 480 Hz), sampled once.
            function springTable(k, c, m, dur) {
              var dt = 1 / 480, x = 0, v = 0, out = [0];
              for (var t = 0; t < dur; t += dt) { v += ((-k * (x - 1) - c * v) / m) * dt; x += v * dt; out.push(x); }
              return out;
            }
            function springAt(tab, tau) {
              if (tau <= 0) return 0;
              var i = tau * 480; if (i >= tab.length - 1) return tab[tab.length - 1];
              var j = Math.floor(i); return tab[j] + (tab[j + 1] - tab[j]) * (i - j);
            }
            var clock = { t: 0 };
            function finish(tl, draw) {
              if (draw) { tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { draw(clock.t); } }, 0); draw(0); }
              if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["pixel-heading-word"] = tl;
            }


            // The source cycles five Geist Pixel faces; only one of them is on Google Fonts, so the five
            // slots (square, grid, circle, triangle, line) use five open pixel faces instead.
            var KEYS = ["square", "grid", "circle", "triangle", "line"];
            var FAMS = ["Geist Pixel", "Pixelify Sans", "Silkscreen", "Jersey 10", "Tiny5"];
            var LABELS = ["Square", "Grid", "Circle", "Triangle", "Line"];
            // Hidden samples make the browser load every face before it is first needed.
            FAMS.forEach(function (fam) { var g = document.createElement("span"); g.className = "pxh-preload"; g.style.fontFamily = '"' + fam + '"'; g.textContent = "Aa"; root.appendChild(g); });

            var head = document.getElementById("pxw-head"), label = document.getElementById("pxw-label");
            var text = str(vars.text, "Pixel Perfect");
            var initIdx = Math.max(0, KEYS.indexOf(pick(vars.initial_font, KEYS, "square")));
            var hv = String(vars.hover_font || "cycle"), hoverIdx = KEYS.indexOf(hv);   // -1 = cycle mode
            var interval = num(vars.cycle_interval, 300, 100, 1500) / 1000;
            var at = num(vars.hover_at, 0.6, 0, 5), until = Math.max(at + 0.2, num(vars.hover_until, 3.4, 0.5, 8));
            var showLabel = bool(vars.show_label, true);
            root.style.fontSize = num(vars.font_size, 120, 12, 260) + "px";
            head.textContent = text; head.style.fontSize = "1em";
            var last = -1, lastOn = null;
            function idxAt(t) {
              if (hoverIdx >= 0) return t >= at && t < until ? hoverIdx : initIdx;
              if (t < at) return initIdx;
              return (initIdx + Math.floor((Math.min(t, until) - at) / interval)) % 5;
            }
            function draw(t) {
              var i = idxAt(t), on = t >= at && t < until;
              if (i !== last) { last = i; head.style.fontFamily = '"' + FAMS[i] + '", monospace'; label.textContent = LABELS[i]; }
              if (on !== lastOn) { lastOn = on; label.style.opacity = showLabel && on ? "1" : "0"; }
            }
            var tl = gsap.timeline({ paused: true });
            finish(tl, draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
