<html

  data-composition-duration="8"
  data-composition-variables='[
    {"id": "prompt", "type": "string", "role": "content", "label": "Prompt", "description": "Text typed into the prompt field.", "default": "Summarize this thread"},
    {"id": "button_label", "type": "string", "role": "content", "label": "Button label", "description": "Label of the submit button.", "default": "Generate"},
    {"id": "answer_lines", "type": "string", "role": "content", "label": "Answer lines", "description": "JSON array of answer lines revealed at the end.", "default": "[\"The thread debates the Q3 roadmap: ship the editor first,\", \"defer billing to Q4, and pull the migration forward so\", \"infra is unblocked before the team scales next quarter.\"]"},

    {"id": "mode", "type": "enum", "role": "style", "label": "Mode", "description": "Light or dark neutral theme.", "default": "light", "options": [{"value": "light", "label": "Light"}, {"value": "dark", "label": "Dark"}]},

  <head>

  </head>
  <body>
    <template>
      <link
        rel="stylesheet"

      />
      <style>

#root {
  position: absolute;
  inset: 0;
  overflow: hidden;
  container-type: size;
  pointer-events: none;
  background: var(--ui-background, #fff);
  color: var(--ui-foreground, #0a0a0a);

  -webkit-font-smoothing: antialiased;
}

        #apf-clip {

          inset: 0;
        }
