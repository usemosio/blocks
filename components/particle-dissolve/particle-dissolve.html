  not have. This block draws remocn's preview scene (a stat and a bar chart and then a render queue) (text and colours from the variables) on a

            var DEFS = [{"id": "label", "type": "string", "default": "Deploys this week"}, {"id": "value", "type": "string", "default": "2,481"}, {"id": "bars", "type": "string", "default": "32,51,43,68,57,86,64,100"}, {"id": "accent", "type": "color", "default": "#a1eebd"}, {"id": "title", "type": "string", "default": "Render queue"}, {"id": "items", "type": "string", "default": "intro-scene.mp4 | Done; feature-tour.mp4 | Rendering; pricing-outro.mp4 | Queued"}, {"id": "background", "type": "color", "default": "#101828"}, {"id": "particle_size", "type": "number", "default": 4, "min": 1, "max": 16}, {"id": "scatter", "type": "number", "default": 0.08, "min": 0.01, "max": 0.4}, {"id": "shimmer", "type": "number", "default": 0.6, "min": 0, "max": 1.5}, {"id": "aberration", "type": "number", "default": 0.5, "min": 0, "max": 1.5}, {"id": "direction", "type": "enum", "default": "reveal", "options": ["reveal", "up", "down", "left", "right"]}, {"id": "stagger", "type": "number", "default": 0.55, "min": 0, "max": 0.9}, {"id": "resolution", "type": "number", "default": 0.75, "min": 0.25, "max": 1}];

uniform sampler2D u_from;

uniform float u_cells;
uniform float u_scatter;
uniform float u_shimmer;

const float PI = 3.141592653589793;

float hash(vec2 p) {

    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),

    p *= 2.03;

float luma(vec3 c) {

vec4 grab(sampler2D tex, vec2 uv, vec2 dir, float amount) {

  float b = texture(tex, uv - dir * amount).b;

            var fontEpoch = 0;
            var sceneEpoch = -1;
            var lastFrame = 0;
            function render(frame) {
              lastFrame = frame;
              if (sceneEpoch !== fontEpoch) {
                sceneEpoch = fontEpoch;
                drawScenes();
                upload();
              }
              if (paint) paint(frame);
            }
            if (document.fonts && document.fonts.load) {
              ["400 34px Geist", "500 30px Geist", "600 44px Geist", "400 44px 'Geist Mono'"].forEach(function (face) {
                document.fonts.load(face).then(function () { fontEpoch++; render(lastFrame); }, function () {});
              });
            }

            var total = parseFloat(root.dataset.duration || "5.2");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { render(Math.round(clock.frame)); }
            }, 0);
            render(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[NAME] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
