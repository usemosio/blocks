            function smoothNoise(frame, axis) {
              var s = frame / 6, idx = Math.floor(s), mix = smoothstep(s - idx);
              var a = random(seed + "-" + axis + "-" + idx) * 2 - 1, b = random(seed + "-" + axis + "-" + (idx + 1)) * 2 - 1;
              return a + (b - a) * mix;
            }
            function shakeAt(frame) {
              if (shake === 0) return { x: 0, y: 0, rotate: 0 };
              var ph0 = random(seed + "-phase") * Math.PI * 2;
              var xw = Math.sin(frame * 0.19 + ph0) * 0.58, yw = Math.sin(frame * 0.13 + ph0 * 1.37) * 0.5;
              var xf = Math.sin(frame * 0.047 + ph0 * 0.71) * 0.22, yf = Math.sin(frame * 0.071 + ph0 * 1.91) * 0.2;
              return { x: (xw + xf + smoothNoise(frame, "x") * 0.32) * 7 * shake, y: (yw + yf + smoothNoise(frame, "y") * 0.3) * 5 * shake,
                rotate: (Math.sin(frame * 0.083 + ph0 * 0.43) * 0.65 + smoothNoise(frame, "roll") * 0.35) * 0.28 * shake };
            }
            function draw(frame) {
              var settle = interpolate(frame, [0, 24], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: SETTLE_SOFT });
              var opacity = interpolate(frame, [0, 9], [0, 1], CLAMP);
              var po = pose(frame), hh = shakeAt(frame);
              var tx = pw * po.x, ty = ph * po.y;
              var entryY = interpolate(settle, [0, 1], [64, 0]);
              var sc = interpolate(settle, [0, 1], [scale * 0.94, scale]);
              var rx = interpolate(settle, [0, 1], [rotX + 8, rotX]), ry = interpolate(settle, [0, 1], [rotY - 5, rotY]);
              var dx = W / 2 - (pl + tx) - hh.x, dy = H / 2 - (pt + ty) + entryY - hh.y;
              plane.style.transformOrigin = tx + "px " + ty + "px";
              plane.style.transform = "translate3d(" + dx + "px," + dy + "px,0) scale(" + sc * po.zoom + ") rotateZ(" + (-po.rotate - hh.rotate) + "deg) rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
              elP.style.opacity = opacity;
              elRef.style.opacity = refl * opacity;
              elRef.style.transform = "perspective(650px) rotateX(58deg) translateY(" + entryY * 0.28 + "px)";
              elSh.style.background = "rgba(0,0,0," + 0.52 * shadowS * opacity + ")";
              elSh.style.filter = "blur(" + (20 + 30 * shadowS) + "px)";
              elSh.style.transform = "translateY(" + entryY * 0.35 + "px)";
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 300, draw);

            var total = parseFloat(root.dataset.duration || "10");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["stage"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
