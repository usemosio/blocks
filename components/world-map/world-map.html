  World Map

  Animated world choropleth: countries fade in from the centre outwards, coloured by a value, then the top ones pulse.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Map geometry: world-atlas countries-110m (ISC licence, Copyright Mike Bostock), built from Natural Earth
  (public domain). The Natural Earth projection and the SVG paths were computed once with d3-geo and are
  embedded below, simplified and rounded.

  Changes by usemosio/blocks: fills the host frame (header, map and legend stack to fit portrait and landscape); d3, topojson and the world-atlas fetch are gone: the Natural Earth projected country paths are embedded; title, subtitle, source, data (JSON of country name to value), highlighted countries, colour ramp, legend labels and background are variables; the sample values are labelled as illustrative instead of attributed to a named institution; the hover tooltip is dropped (a video has no pointer).
-->

    {

    {

      "default": "Switzerland, Norway, United States of America, Australia, Sweden"

    {
      "id": "ramp",

      "id": "legend_low",
