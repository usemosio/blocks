<!--

  Display text resolves out of fog center-out, sharpening from heavy blur as it tilts up on a spring.

<html
  lang="en"
  data-composition-id="fog-rise"
  data-composition-duration="2.4"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Big display word.", "default": "Studio" },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 304, "min": 12, "max": 560, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#004CFF" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] },
    { "id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Frames between each ring of characters, center first (30 fps).", "default": 5, "min": 0, "max": 15, "step": 1, "unit": "frames" },
    { "id": "blur", "type": "number", "role": "motion", "label": "Blur", "description": "Starting blur as a fraction of the font size.", "default": 0.17, "min": 0, "max": 0.5, "step": 0.01 },
    { "id": "tilt", "type": "number", "role": "motion", "label": "Tilt", "description": "Degrees the line is tipped back before it rises.", "default": 55, "min": 0, "max": 90, "step": 1, "unit": "deg" },
    { "id": "depth", "type": "number", "role": "motion", "label": "Depth", "description": "Perspective distance in font sizes.", "default": 5, "min": 1, "max": 8, "step": 0.1 },
    { "id": "lift", "type": "number", "role": "motion", "label": "Lift", "description": "How far below its place the line starts, in font sizes.", "default": 0.85, "min": 0, "max": 1, "step": 0.05 },
    { "id": "drift", "type": "number", "role": "motion", "label": "Drift", "description": "Slow upward creep per frame, in font sizes.", "default": 0.005, "min": 0, "max": 0.012, "step": 0.001 },
    { "id": "exit_at", "type": "number", "role": "motion", "label": "Exit at", "description": "Frame where the line starts to accelerate upward and out (30 fps).", "default": 60, "min": 0, "max": 200, "step": 1, "unit": "frames" },
    { "id": "exit_accel", "type": "number", "role": "motion", "label": "Exit acceleration", "description": "How hard the line accelerates out.", "default": 0.04, "min": 0.002, "max": 0.05, "step": 0.002 },
    { "id": "mass", "type": "number", "role": "motion", "label": "Mass", "description": "Spring mass.", "default": 1.3, "min": 0.3, "max": 3, "step": 0.1 },
    { "id": "stiffness", "type": "number", "role": "motion", "label": "Stiffness", "description": "Spring stiffness.", "default": 60, "min": 30, "max": 250, "step": 1 },
    { "id": "damping", "type": "number", "role": "motion", "label": "Damping", "description": "Spring damping.", "default": 13, "min": 5, "max": 30, "step": 1 },
    { "id": "spread_gap", "type": "number", "role": "style", "label": "Spread gap", "description": "Extra gap between letters at the start, in font sizes. It closes as the spring settles.", "default": 0.07, "min": 0, "max": 0.3, "step": 0.01 },
    { "id": "tracking", "type": "number", "role": "style", "label": "Tracking", "description": "Letter spacing in em.", "default": -0.07, "min": -0.12, "max": 0, "step": 0.01, "unit": "em" },
    { "id": "resolve_frames", "type": "number", "role": "motion", "label": "Resolve frames", "description": "Frames the blur takes to clear after the last ring starts.", "default": 22, "min": 8, "max": 50, "step": 1, "unit": "frames" },
    { "id": "fade_frames", "type": "number", "role": "motion", "label": "Fade frames", "description": "Frames each character takes to fade in.", "default": 18, "min": 2, "max": 25, "step": 1, "unit": "frames" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Fog Rise</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #004cff);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .fgr-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          padding-bottom: 6%;
          white-space: nowrap;
        }
        .fgr-line { display: inline-block; line-height: 1.15; white-space: nowrap; transform-origin: 50% 100%; }
        .fgr-char { display: inline-block; white-space: pre; opacity: 0; }
      </style>

      <div id="root" data-composition-id="fog-rise" data-duration="2.4" data-fps="30">
        <div id="fgr-clip" class="fgr-stage clip" data-start="0" data-duration="2.4" data-track-index="0">
          <span id="fgr-line" class="fgr-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("fgr-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "2.4");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["fog-rise"] = tl;
            }
            var text = str(vars.text, "Studio");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "400");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var stagger = num(vars.stagger, 5, 0, 15);
            var blur = num(vars.blur, 0.17, 0, 0.5);
            var tilt = num(vars.tilt, 55, 0, 90);
            var depth = num(vars.depth, 5, 1, 8);
            var lift = num(vars.lift, 0.85, 0, 1);
            var drift = num(vars.drift, 0.005, 0, 0.012);
            var exitAt = num(vars.exit_at, 60, 0, 200);
            var exitAccel = num(vars.exit_accel, 0.04, 0.002, 0.05);
            var mass = num(vars.mass, 1.3, 0.3, 3);
            var stiffness = num(vars.stiffness, 60, 30, 250);
            var damping = num(vars.damping, 13, 5, 30);
            var spreadGap = num(vars.spread_gap, 0.07, 0, 0.3);
            var tracking = num(vars.tracking, -0.07, -0.12, 0);
            var resolve = num(vars.resolve_frames, 22, 8, 50);
            var fade = num(vars.fade_frames, 18, 2, 25);
            var stage = document.getElementById("fgr-clip");
            var line = document.getElementById("fgr-line");
            line.style.fontWeight = weight;
            line.style.letterSpacing = tracking + "em";
            line.setAttribute("aria-label", text);
            var chars = Array.from(text).map(function (ch, i) {
              var s = document.createElement("span");
              s.id = "fgr-char-" + i;
              s.className = "fgr-char";
              s.textContent = ch;
              line.appendChild(s);
              return s;
            });
            var size = fit(line, num(vars.font_size, 304, 12, 560), 0.8);
            stage.style.perspective = depth * size + "px";

            // Damped spring from 0 to 1 (underdamped closed form), sampled per frame.
            var w0 = Math.sqrt(stiffness / mass);
            var zeta = damping / (2 * Math.sqrt(stiffness * mass));
            function spring(f) {
              var t = f / 30;
              if (zeta < 1) {
                var wd = w0 * Math.sqrt(1 - zeta * zeta);
                return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t));
              }
              return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
            }
            var center = (chars.length - 1) / 2;
            var minRing = chars.length % 2 === 0 ? 0.5 : 0;
            var maxRing = Math.floor(center);
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var c = spring(f);
              var angle = tilt * (1 - c);
              var liftY = lift * size * (1 - c);
              var driftY = drift * size * f;
              var exitT = exitAt > 0 ? Math.max(f - exitAt, 0) : 0;
              var exitY = 0.5 * exitAccel * exitT * exitT * size;
              var gap = spreadGap * size * (1 - c);
              line.style.transform = "translateY(" + (liftY - driftY - exitY) + "px) rotateX(" + -angle + "deg)";
              var b = blur * size * ip(f, 0, maxRing * stagger + resolve, 1, 0);
              chars.forEach(function (ch, j) {
                var start = (Math.abs(j - center) - minRing) * stagger;
                ch.style.opacity = ip(f, start, start + fade, 0, 1);
                ch.style.marginRight = j < chars.length - 1 ? gap + "px" : "0px";
                ch.style.filter = b > 0.05 ? "blur(" + b + "px)" : "none";
              });
            }
            apply();
            var tl = gsap.timeline({ paused: true });
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
