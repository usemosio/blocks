<!doctype html>
<!--
  Hand-Drawn Flowchart

  Wobbled boxes with handwritten labels joined by curved connectors, drawing on in sequence from a list of steps.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/hw-pipeline/hw-pipeline.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: fills the host frame (a row of boxes in landscape, a column in portrait, scaled to fit); steps, colours, background, boil and seed are variables; Caveat comes from Google Fonts instead of a bundled file; the family helper functions are inlined.
-->
<html
  lang="en"
  data-composition-id="hw-pipeline"
  data-composition-duration="7"
  data-composition-variables='[
  {
    "id": "nodes",
    "type": "string",
    "role": "content",
    "label": "Steps",
    "description": "Box labels in order, comma separated (1 to 6).",
    "default": "Idea, Record, Shine!"
  },
  {
    "id": "font_size",
    "type": "number",
    "role": "style",
    "label": "Label size",
    "description": "Label size in design pixels (shrinks when many boxes).",
    "default": 56,
    "min": 20,
    "max": 120,
    "step": 1,
    "unit": "px"
  },
  {
    "id": "ink_color",
    "type": "color",
    "role": "style",
    "label": "Ink",
    "description": "Box and label colour.",
    "default": "#f4f2ec"
  },
  {
    "id": "accent_color",
    "type": "color",
    "role": "style",
    "label": "Arrow colour",
    "description": "Connector colour.",
    "default": "#ffb020"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the drawing sits over your own scene.",
    "default": false
  },
  {
    "id": "background",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background colour when not transparent.",
    "default": "#1c1b18"
  },
  {
    "id": "boil",
    "type": "boolean",
    "role": "motion",
    "label": "Boil",
    "description": "Lines jitter slightly every third frame, like hand-redrawn animation.",
    "default": true
  },
  {
    "id": "seed",
    "type": "number",
    "role": "style",
    "label": "Seed",
    "description": "Changes the wobble of the hand-drawn lines.",
    "default": 11,
    "min": 1,
    "max": 999,
    "step": 1
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Hand-Drawn Flowchart</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=block" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; container-type: size; font-family: "Caveat", cursive; pointer-events: none; }
        #hwp-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
        #hwp-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        #hwp-svg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .hwp-box { stroke: var(--hwp-ink, #f4f2ec); stroke-width: 6; }
        .hwp-conn { stroke: var(--hwp-accent, #ffb020); stroke-width: 5; }
        .hwp-label { position: absolute; text-align: center; font-weight: 700; color: var(--hwp-ink, #f4f2ec); white-space: nowrap; opacity: 0; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4); }
      </style>
      <div id="root" data-composition-id="hw-pipeline" data-duration="7" data-fps="30">
        <div id="hwp-clip" class="clip" data-start="0" data-duration="7" data-track-index="0" style="position:absolute;inset:0">
          <div id="hwp-stage"><svg id="hwp-svg"></svg><div id="hwp-labels"></div></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(x, f, lo, hi) { var n = Number(x); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : f; }
            function col(x, f) { return typeof x === "string" && x.trim() ? x.trim() : f; }
            var nodes = (typeof vars.nodes === "string" && vars.nodes.trim() ? vars.nodes : "Idea, Record, Shine!")
              .split(",").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 6);
            var fontSize = num(vars.font_size, 56, 20, 120);
            var seed = num(vars.seed, 11, 1, 999);
            var boilOn = vars.boil !== false && vars.boil !== "false";
            var DUR = 7;
            root.style.setProperty("--hwp-ink", col(vars.ink_color, "#f4f2ec"));
            root.style.setProperty("--hwp-accent", col(vars.accent_color, "#ffb020"));
            if (!(vars.transparent === true || vars.transparent === "true")) root.style.background = col(vars.background, "#1c1b18");

            function hash(n, s) { var x = Math.sin(n * 127.1 + s * 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }
            function wobbleRect(w, h, r, s, amp) {
              function wob(n) { return hash(n, s) * amp; }
              return "M " + (r + wob(1)) + " " + wob(2) + " L " + (w / 2 + wob(3)) + " " + wob(4) + " L " + (w - r + wob(5)) + " " + wob(6) +
                " Q " + (w + wob(7)) + " " + wob(8) + " " + (w + wob(9)) + " " + (r + wob(10)) +
                " L " + (w + wob(11)) + " " + (h / 2 + wob(12)) + " L " + (w + wob(13)) + " " + (h - r + wob(14)) +
                " Q " + (w + wob(15)) + " " + (h + wob(16)) + " " + (w - r + wob(17)) + " " + (h + wob(18)) +
                " L " + (w / 2 + wob(19)) + " " + (h + wob(20)) + " L " + (r + wob(21)) + " " + (h + wob(22)) +
                " Q " + wob(23) + " " + (h + wob(24)) + " " + wob(25) + " " + (h - r + wob(26)) +
                " L " + wob(27) + " " + (h / 2 + wob(28)) + " L " + wob(29) + " " + (r + wob(30)) +
                " Q " + wob(31) + " " + wob(32) + " " + (r + wob(33)) + " " + wob(34);
            }

            // Design space: 1920 wide in landscape (boxes in a row), 1080 wide in portrait (boxes in a column).
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920;
            var portrait = H > W;
            var DW = portrait ? 1080 : 1920;
            var DH = DW * H / W;
            var n = nodes.length;
            var boxW = portrait ? 560 : 320, boxH = portrait ? 190 : 170, gap = portrait ? 170 : 190;
            var span = portrait ? n * boxH + (n - 1) * gap : n * boxW + (n - 1) * gap;
            var avail = (portrait ? DH : DW) * 0.9;
            var k = Math.min(1, avail / span);
            boxW *= k; boxH *= k; gap *= k; fontSize *= k;
            span *= k;
            var stage = document.getElementById("hwp-stage");
            stage.style.width = DW + "px"; stage.style.height = DH + "px";
            stage.style.transform = "scale(" + (W / DW) + ")";
            var svg = document.getElementById("hwp-svg");
            svg.setAttribute("viewBox", "0 0 " + DW + " " + DH);
            var labels = document.getElementById("hwp-labels");
            var NS = "http://www.w3.org/2000/svg";
            var x0 = portrait ? (DW - boxW) / 2 : (DW - span) / 2;
            var y0 = portrait ? (DH - span) / 2 : (DH - boxH) / 2;
            var boxes = [], conns = [], labelEls = [], boxGs = [];
            nodes.forEach(function (label, i) {
              var bx = portrait ? x0 : x0 + i * (boxW + gap);
              var by = portrait ? y0 + i * (boxH + gap) : y0;
              var gOuter = document.createElementNS(NS, "g");
              gOuter.setAttribute("transform", "translate(" + bx + " " + by + ")");
              var g = document.createElementNS(NS, "g");
              gOuter.appendChild(g);
              var p = document.createElementNS(NS, "path");
              p.setAttribute("class", "hwp-box");
              p.setAttribute("d", wobbleRect(boxW, boxH, 24 * k, seed + i, 3.5 * k));
              g.appendChild(p);
              svg.appendChild(gOuter);
              boxes.push(p); boxGs.push(g);
              var el = document.createElement("div");
              el.className = "hwp-label";
              el.textContent = label;
              el.style.left = bx + "px"; el.style.top = by + boxH / 2 - fontSize * 0.62 + "px";
              el.style.width = boxW + "px"; el.style.fontSize = fontSize + "px";
              labels.appendChild(el); labelEls.push(el);
              if (i < n - 1) {
                var sx, sy, tx, ty, qx, qy;
                if (portrait) {
                  sx = bx + boxW / 2; sy = by + boxH + 10; tx = sx; ty = by + boxH + gap - 10;
                  qx = sx + 46 * k + hash(i * 9 + 2, seed) * 14; qy = (sy + ty) / 2 + hash(i * 9 + 3, seed) * 10;
                } else {
                  sx = bx + boxW + 10; sy = by + boxH / 2; tx = bx + boxW + gap - 10; ty = sy;
                  qx = bx + boxW + gap / 2 + hash(i * 9 + 2, seed) * 16; qy = sy - 46 * k - hash(i * 9 + 3, seed) * 12;
                }
                var ang = Math.atan2(ty - qy, tx - qx) + Math.PI, BARB = 26 * k, SPREAD = 0.42;
                var b1x = tx + BARB * Math.cos(ang - SPREAD), b1y = ty + BARB * Math.sin(ang - SPREAD);
                var b2x = tx + BARB * Math.cos(ang + SPREAD), b2y = ty + BARB * Math.sin(ang + SPREAD);
                var c = document.createElementNS(NS, "path");
                c.setAttribute("class", "hwp-conn");
                c.setAttribute("d", "M " + sx + " " + sy + " Q " + qx + " " + qy + " " + tx + " " + ty +
                  " M " + tx + " " + ty + " L " + b1x + " " + b1y + " M " + tx + " " + ty + " L " + b2x + " " + b2y);
                svg.appendChild(c); conns.push(c);
              }
            });

            var tl = gsap.timeline({ paused: true });
            var t = 0.3;
            nodes.forEach(function (_, i) {
              var p = boxes[i], len = p.getTotalLength();
              gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
              tl.to(p, { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut" }, t);
              tl.to(labelEls[i], { opacity: 1, duration: 0.35, ease: "power2.out" }, t + 0.45);
              t += 0.7;
              if (i < conns.length) {
                var c = conns[i], cl = c.getTotalLength();
                gsap.set(c, { strokeDasharray: cl, strokeDashoffset: cl });
                tl.to(c, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, t);
                t += 0.5;
              }
            });
            // Boil: a small jitter that changes every third frame, a pure function of the timeline time.
            if (boilOn) {
              var jit = boxGs.concat(conns, labelEls);
              var amp = 1.6, rot = 0.4;
              var boil = function () {
                var step = Math.floor((tl.time() * 30) / 3);
                for (var i = 0; i < jit.length; i++) {
                  gsap.set(jit[i], { x: hash(step * 3 + i * 97, seed) * amp, y: hash(step * 3 + 1 + i * 97, seed) * amp, rotation: hash(step * 3 + 2 + i * 97, seed) * rot });
                }
              };
              tl.eventCallback("onUpdate", boil);
              boil();
            }
            var OUT = Math.min(0.6, Math.max(0.25, DUR * 0.06));
            tl.to([svg, labels], { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
            if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["hw-pipeline"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
