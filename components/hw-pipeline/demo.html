<!doctype html>
<!-- Hand-Drawn Flowchart demo: a vertical 1080×1920 frame mounting the component full-frame. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Hand-Drawn Flowchart Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1c1b18; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1c1b18; }
      .demo-mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hw-pipeline-demo" data-start="0" data-width="1080" data-height="1920" data-duration="7" data-fps="30">
      <div
        id="demo-mount"
        class="demo-mount clip"
        data-composition-id="hw-pipeline"
        data-composition-src="./hw-pipeline.html"
        data-variable-values='{"nodes": "Idea, Record, Edit, Shine!"}'
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["hw-pipeline-demo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
