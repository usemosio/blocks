                svg("path", { d: opts.variant === "pointer" ? POINTER : ARROW, fill: css(th.foreground), stroke: css(th.background), "stroke-width": 1.4, "stroke-linejoin": "round" }, s);
                return {
                  el: wrap,
                  draw: function (c) {
                    wrap.style.transform = "translate(" + c.x + "px," + c.y + "px)";
                    wrap.style.opacity = c.opacity;
                    rip.style.opacity = c.rippleOpacity;
                    rip.style.transform = "scale(" + c.rippleScale + ")";
                    s.style.transform = "scale(" + (0.9 + 0.1 * c.pressScale) + ")";
                  }
                };
              }

              /* ---------- driver ----------
                 drive(tl, seconds, speed, draw): puts one tween on the paused timeline that calls draw(frame)
                 with frame = time * 30 * speed (remocn's `useCurrentFrame() * speed`), draws frame 0, and pads the
                 timeline to `seconds`. Seeking anywhere redraws the same picture. */
              function drive(tl, seconds, speed, draw) {
                var clock = { f: 0 }, total = seconds * FPS * speed;
                tl.to(clock, { f: total, duration: seconds, ease: "none", onUpdate: function () { draw(clock.f); } }, 0);
                draw(0);
                if (tl.duration() < seconds) tl.to({}, { duration: seconds - tl.duration() });
              }

              return {
                FPS: FPS, FONT: FONT, clamp01: clamp01, lerp: lerp, num: num, str: str, oneOf: oneOf, bool: bool, vars: vars,
                ease: ease, springs: springs, spring: spring, parse: parse, css: css, mix: mix, isColor: isColor,
                theme: theme, boot: boot, stateAt: stateAt, tween: tween, styleAt: styleAt, h: h, svg: svg, icon: icon, spinner: spinner,
                fitScale: fitScale, layer: layer, box: box, cursorAt: cursorAt, cursor: cursor, drive: drive
              };
            })();

          /* ---- remocn-ui Button (state atom) ---- */
          var BTN_SIZES = { sm: { h: 32, pad: "0 12px", fs: 13, gap: 6 }, "default": { h: 40, pad: "0 20px", fs: 15, gap: 8 }, lg: { h: 48, pad: "0 28px", fs: 17, gap: 10 } };
          function btnTokens(variant, th) {
            var m = {
              secondary: { bg: th.secondary, fg: th.secondaryForeground, hoverBg: UI.mix(th.secondary, th.muted, 1), border: "transparent" },
              destructive: { bg: th.destructive, fg: th.destructiveForeground, hoverBg: UI.mix(th.destructive, th.foreground, 0.12), border: "transparent" },
              outline: { bg: "transparent", fg: th.foreground, hoverBg: th.accent, border: th.border },
              ghost: { bg: "transparent", fg: th.foreground, hoverBg: th.accent, border: "transparent" },
              "default": { bg: th.primary, fg: th.primaryForeground, hoverBg: UI.mix(th.primary, th.foreground, 0.1), border: "transparent" }
            };
            return m[variant] || m["default"];
          }
          function btnPreset(variant, th) {
            var tk = btnTokens(variant, th), clear = tk.bg === "transparent";
            var rest = clear ? th.background : tk.bg;
            var press = clear ? tk.hoverBg : UI.mix(tk.hoverBg, th.foreground, 0.08);
            return function (state) {
              if (state === "hover") return { ty: -1, sc: 1, bg: tk.hoverBg, lab: 1, spin: 0, chk: 0 };
              if (state === "press") return { ty: -1, sc: 0.97, bg: press, lab: 1, spin: 0, chk: 0 };
              if (state === "loading") return { ty: -1, sc: 1, bg: tk.hoverBg, lab: 0, spin: 1, chk: 0 };
              if (state === "success") return { ty: -1, sc: 1, bg: th.primary, lab: 0, spin: 0, chk: 1 };
              return { ty: 0, sc: 1, bg: rest, lab: 1, spin: 0, chk: 0 };
            };
          }
          function buildButton(parent, o) {
            var sz = BTN_SIZES[o.size || "default"], variant = o.variant || "default", tk = btnTokens(variant, o.th), ic = Math.round(sz.fs * 1.1);
            var el = UI.h("div", { position: "relative", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: sz.gap + "px", height: sz.h + "px", padding: sz.pad, fontSize: sz.fs + "px", fontWeight: "500", letterSpacing: "-0.01em", whiteSpace: "nowrap", color: UI.css(tk.fg), border: "1px solid " + (variant === "outline" ? UI.css(tk.border) : "transparent"), borderRadius: o.th.radius + "px" }, parent);
            var wrap = UI.h("span", { position: "relative", display: "inline-flex" }, el);
            var lab = UI.h("span", {}, wrap, { text: o.label });
            var over = { position: "absolute", left: "0", top: "0", right: "0", bottom: "0", display: "flex", alignItems: "center", justifyContent: "center" };
            var spinWrap = UI.h("span", over, wrap), spin = UI.spinner(spinWrap, ic, UI.css(tk.fg), 2.5);
            var chkWrap = UI.h("span", over, wrap), chk = UI.icon("check", ic, UI.css(variant === "default" ? tk.fg : o.th.primaryForeground), 2.6, chkWrap);
            return { el: el, draw: function (s, f) {
              el.style.transform = "translateY(" + s.ty + "px) scale(" + s.sc + ")";
              el.style.background = s.bg;
              lab.style.opacity = s.lab; spinWrap.style.opacity = s.spin; chkWrap.style.opacity = s.chk;
              spin.draw(f, 1);
            } };
          }

            var v = UI.vars();
            var boot = UI.boot(root, v), th = boot.theme;
            var label = UI.str(v.label, "Continue");
            var variant = UI.oneOf(v.variant, ["default", "secondary", "destructive", "outline", "ghost"], "default");
            var size = UI.oneOf(v.size, ["sm", "default", "lg"], "default");
            var showCursor = UI.bool(v.show_cursor, true);
            var W = 260, H = 130;
            var stage = UI.layer(clip, W, H);
            var holder = UI.h("div", {}, stage); holder.id = "btn-holder";
            var btn = buildButton(holder, { label: label, variant: variant, size: size, th: th });
            var cur = UI.cursor(stage, th);
            var preset = btnPreset(variant, th);
            // remocn button-example timeline: hover 12, press 30, loading 48 (6), success 96 (16).
            var steps = [{ at: 14, state: "hover" }, { at: 30, state: "press" }, { at: 48, state: "loading", duration: 6 }, { at: 96, state: "success", duration: 16 }];
            var tl = gsap.timeline({ paused: true });
            UI.drive(tl, 4.5, boot.speed, function (f) {
              btn.draw(UI.styleAt(preset, steps, f, "idle", 8), f);
              if (!showCursor) { cur.el.style.display = "none"; return; }
              var b = UI.box(btn.el, stage), x = b.cx + b.w * 0.18, y = b.cy + b.h * 0.2;
              cur.draw(UI.cursorAt([
                { at: 0, x: W - 24, y: H - 10 }, { at: 14, x: x, y: y, duration: 14 },
                { at: 30, x: x, y: y, click: true, duration: 0 }, { at: 90, x: W - 30, y: H - 6, duration: 30 }
              ], f, { fadeOutAt: 96, fadeOut: 12 }));
            });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["button"] = tl;
          })();
        </script>
      </div>
    </template>
