<!--
  Word Push

  Words drive in from the right and push the line left into its new center.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="word-push"
  data-composition-duration="3"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "A single phrase that builds word by word.", "default": "move at your own pace" },
    { "id": "word_gap", "type": "number", "role": "motion", "label": "Word gap", "description": "Frames before the second word arrives (30 fps).", "default": 10, "min": 3, "max": 30, "step": 1, "unit": "frames" },
    { "id": "accel", "type": "number", "role": "motion", "label": "Acceleration", "description": "Each gap is this fraction of the previous one: below 1 the words speed up.", "default": 0.8, "min": 0.5, "max": 1, "step": 0.05 },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "400", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Push</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .wpu-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .wpu-shift { display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .wpu-line { letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
        .wpu-word { display: inline-block; white-space: pre; opacity: 0; margin-right: 0.22em; }
        .wpu-word:last-child { margin-right: 0; }
      </style>

      <div id="root" data-composition-id="word-push" data-duration="3" data-fps="30">
        <div id="wpu-clip" class="wpu-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="wpu-shift" class="wpu-shift"><span id="wpu-line" class="wpu-line"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("wpu-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "3");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-push"] = tl;
            }
            var text = str(vars.text, "move at your own pace");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "400");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            // interpolate() with clamping, easing given as a function of progress.
            function ip(f, a, b, from, to, ease) {
              var p = b === a ? 1 : Math.min(1, Math.max(0, (f - a) / (b - a)));
              return from + (to - from) * (ease ? ease(p) : p);
            }

            var gap = num(vars.word_gap, 10, 3, 30);
            var accel = num(vars.accel, 0.8, 0.5, 1);
            var line = document.getElementById("wpu-line");
            var shift = document.getElementById("wpu-shift");
            line.style.fontWeight = weight;
            var list = text.trim().split(/\s+/).filter(Boolean);
            var spans = list.map(function (w, j) {
              var s = document.createElement("span");
              s.id = "wpu-word-" + j;
              s.className = "wpu-word";
              s.textContent = w;
              line.appendChild(s);
              return s;
            });
            var size = fit(line, num(vars.font_size, 72, 12, 160), 0.8);

            var REVEAL = 2, SLIDE = 12, OVER = 0.5;
            function revealFrame(i) {
              return accel === 1 ? i * gap : (gap * (1 - Math.pow(accel, i))) / (1 - accel);
            }
            var push = bz("push", 0.215, 0.61, 0.355, 1);
            var drive = bz("drive", 0.15, 0.7, 0.25, 1);
            var tl = gsap.timeline({ paused: true });
            spans.forEach(function (s, j) {
              var at = revealFrame(j);
              tw(tl, s, { opacity: 0 }, { opacity: 1 }, at, at + REVEAL);
              if (j > 0) tw(tl, s, { x: OVER * size }, { x: 0 }, at, at + SLIDE, drive);
              else s.style.opacity = 0;
            });
            // The whole line starts left of center, then is nudged half a word width at each arrival.
            var P = { f: 0 };
            function apply() {
              var f = P.f;
              var x = ip(f, 0, SLIDE, -OVER * size, 0, drive);
              for (var j = 1; j < list.length; j++) {
                var wordWidth = (list[j].length * 0.5 + 0.22) * size;
                var at = revealFrame(j);
                x += (wordWidth / 2) * (1 - ip(f, at + 1, at + 1 + SLIDE, 0, 1, push));
              }
              shift.style.transform = "translate(" + x + "px, 0)";
            }
            apply();
            tl.to(P, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
