<!doctype html>
<!--
  Value Swap

  Swap a value in place with a vertical slide so the layout never shifts. The remocn example scene (a status word that goes Draft, In review, Shipped) is built in.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/Remocn/remocn/blob/126221ae00ba86eb40b65731b125ff398687d3b7/registry/remocn/value-swap/index.tsx

<html
  lang="en"
  data-composition-id="value-swap"
  data-composition-duration="3.3333"
  data-composition-variables='[
    {"id": "values", "type": "string", "role": "content", "label": "Values", "description": "Comma-separated values; each swap shows the next one.", "default": "Draft, In review, Shipped"},
    {"id": "at", "type": "string", "role": "motion", "label": "Swap frames", "description": "Comma-separated frame numbers (30 fps) where each swap starts.", "default": "30, 60"},
    {"id": "duration", "type": "number", "role": "motion", "label": "Duration", "description": "Frames each swap takes (30 fps).", "default": 10, "min": 4, "max": 24, "step": 1, "unit": "frames"},
    {"id": "distance", "type": "number", "role": "motion", "label": "Distance", "description": "How far the values slide, in pixels.", "default": 12, "min": 4, "max": 32, "step": 2, "unit": "px"},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Slide direction of the outgoing value.", "default": "up", "options": [{"value": "up", "label": "Up"}, {"value": "down", "label": "Down"}]},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Text size in pixels.", "default": 40, "min": 12, "max": 200, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#f2f2f2"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Value Swap</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@600&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        .vs-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display, Geist, -apple-system, BlinkMacSystemFont, sans-serif); font-weight: 600; }
        .vs-slot { position: relative; display: inline-block; white-space: nowrap; }
        .vs-size { visibility: hidden; }
        .vs-item { position: absolute; left: 0; top: 0; white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="value-swap" data-duration="3.3333" data-fps="30">
        <div id="vs-clip" class="vs-stage clip" data-start="0" data-duration="3.3333" data-track-index="0">
          <span id="vs-slot" class="vs-slot"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function col(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              if (typeof value === "boolean") return value;
              if (value === "true") return true;
              if (value === "false") return false;
              return fallback;
            }
            function fit(el, maxPx, size, ratio) {
              // Shrink el's font size until its scrollWidth fits ratio of the frame width.
              el.style.fontSize = size + "px";
              var max = Math.max(1, root.clientWidth * (ratio || 0.9));
              if (el.scrollWidth > max) { size = Math.max(10, size * (max / el.scrollWidth)); el.style.fontSize = size + "px"; }
              return size;
            }
            gsap.registerPlugin(CustomEase);
            function ease(name, a, b, c, d) { return CustomEase.create(name, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1"); }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            var tl = gsap.timeline({ paused: true });
            var TOTAL = parseFloat(root.dataset.duration || "3.3333");
            function ip(t, a, b, from, to, e) {
              var p = b === a ? 1 : (t - a) / (b - a);
              p = Math.min(1, Math.max(0, p));
              if (e) p = e(p);
              return from + (to - from) * p;
            }
            function hash01(seed) {
              var h = 2166136261;
              for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            // Snap a frame number down to a stop-motion pose.
            function qf(frame, step) { return Math.floor(frame / step + 1e-6) * step; }
            function kf(t, keys, vals, e) {
              if (t <= keys[0]) return vals[0];
              for (var i = 0; i < keys.length - 1; i++) if (t <= keys[i + 1]) return ip(t, keys[i], keys[i + 1], vals[i], vals[i + 1], e);
              return vals[vals.length - 1];
            }
            // Per-frame drawing: a pure function of the timeline time, run from a tween's onUpdate.
            function tick(draw) {
              tl.to({}, { duration: TOTAL, ease: "none", onUpdate: function () { draw(tl.time()); } }, 0);
              draw(0);
            }
            var cubOut = ease("cub-out", 0.215, 0.61, 0.355, 1);
            var cubIn = ease("cub-in", 0.55, 0.055, 0.675, 0.19);
            var cubInOut = ease("cub-io", 0.645, 0.045, 0.355, 1);

            var slot = document.getElementById("vs-slot");
            var values = str(vars.values, "Draft, In review, Shipped").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            var ats = str(vars.at, "30, 60").split(",").map(Number).filter(Number.isFinite);
            var dur = num(vars.duration, 10, 4, 24);
            var dist = num(vars.distance, 12, 4, 32) * (pick(vars.direction, ["up", "down"], "up") === "down" ? -1 : 1);
            slot.style.color = col(vars.color, "#f2f2f2");
            var count = Math.max(1, Math.min(values.length, ats.length + 1));
            var shown = values.slice(0, count);
            var sz = document.createElement("span");
            sz.className = "vs-size";
            sz.textContent = shown.reduce(function (a, b) { return b.length > a.length ? b : a; }, "");
            slot.appendChild(sz);
            var els = shown.map(function (t, i) {
              var s = document.createElement("span");
              s.id = "vs-item-" + i;
              s.className = "vs-item";
              s.textContent = t;
              slot.appendChild(s);
              return s;
            });
            fit(slot, 0, num(vars.font_size, 40, 12, 200), 0.9);
            tick(function (t) {
              var f = t * 30;
              els.forEach(function (el, i) {
                var pIn = i > 0 ? ip(f, ats[i - 1], ats[i - 1] + dur, 0, 1, cubInOut) : 1;
                var pOut = i < count - 1 ? ip(f, ats[i], ats[i] + dur, 0, 1, cubInOut) : 0;
                var op = pIn * (1 - pOut);
                el.style.opacity = op <= 0.001 ? 0 : op;
                el.style.transform = "translateY(" + ((1 - pIn) * dist - pOut * dist) + "px)";
              });
            });
            var total = parseFloat(root.dataset.duration || "3.3333");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["value-swap"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
