<html

  <head>
    <meta charset="UTF-8" />
    <title>Glass Code Walk</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: #0b0c10; font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace; }
        .gw-stage { position: absolute; inset: 0; }
        #gw-world { transform-origin: 0 0; }
        #gw-aura { position: absolute; inset: 0; pointer-events: none; }
        #gw-ring { position: absolute; padding: 1px; border-radius: 16px; box-sizing: border-box; background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 100%); box-shadow: 0 50px 120px rgba(0,0,0,0.55); }
        #gw-glass { width: 100%; height: 100%; border-radius: 15px; backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); display: flex; flex-direction: column; overflow: hidden; }
        #gw-chrome { height: 40px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .gw-light { width: 12px; height: 12px; border-radius: 50%; opacity: 0.6; }
        #gw-title { flex: 1; text-align: center; color: #a1a1aa; font-size: 12px; letter-spacing: 0.02em; }
        #gw-body { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; line-height: 1.55; overflow: hidden; }
        .gw-line { white-space: pre; display: flex; color: #e4e4e7; }
        .gw-num { width: 28px; color: #3f3f46; flex: none; }

      </style>

      <div id="root" data-composition-id="glass-code-walk" data-duration="5" data-fps="30">
        <div id="gw-clip" class="gw-stage clip" data-start="0" data-duration="5" data-track-index="0">
<div id="gw-world"><div id="gw-aura"></div><div id="gw-ring"><div id="gw-glass"><div id="gw-chrome"><span id="gw-lights" style="display:flex;gap:8px"><span class="gw-light" style="background:#ff5f57"></span><span class="gw-light" style="background:#febc2e"></span><span class="gw-light" style="background:#28c840"></span></span><div id="gw-title"></div></div><div id="gw-body"></div></div></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var KEYWORDS = ["import", "from", "export", "function", "const", "let", "var", "return", "if", "else", "for", "while", "new", "class", "extends", "default", "true", "false", "null", "undefined"];
            var TOKEN_COLORS = { code: "#e4e4e7", comment: "#52525b", string: "#86efac", keyword: "#c4b5fd", number: "#fcd34d" };
            // Minimal tokenizer, not a real highlighter: comments, strings, keywords, numbers.
            function tokenizeLine(line) {
              if (line.replace(/^\s+/, "").indexOf("//") === 0) return [{ text: line, kind: "comment" }];
              var out = [], re = /("[^"]*"|'[^']*'|`[^`]*`|\b\d+\b|\b[A-Za-z_$][\w$]*\b|[^\w"']+)/g, m;
              while ((m = re.exec(line)) !== null) {
                var t = m[0], c = t.charAt(0), kind = "code";
                if (c === '"' || c === "'" || c === "`") kind = "string";
                else if (/^\d+$/.test(t)) kind = "number";
                else if (/^[A-Za-z_$][\w$]*$/.test(t) && KEYWORDS.indexOf(t) >= 0) kind = "keyword";
                out.push({ text: t, kind: kind });
              }
              return out;
            }
            function buildLines(host, lines, fontSize) {
              return lines.map(function (line, i) {
                var el = document.createElement("div");
                el.className = "gw-line"; el.id = "gw-line-" + i;
                var toks = tokenizeLine(line);
                if (toks.length === 0) { el.style.height = fontSize * 0.8 + "px"; }
                else {
                  var n = document.createElement("span"); n.className = "gw-num"; n.textContent = String(i + 1).padStart(2, " "); el.appendChild(n);
                  var body = document.createElement("span");
                  toks.forEach(function (t) { var s = document.createElement("span"); s.style.color = TOKEN_COLORS[t.kind]; s.textContent = t.text; body.appendChild(s); });
                  el.appendChild(body);
                }
                el.style.opacity = "0";
                host.appendChild(el);
                return el;
              });
            }

            var world = document.getElementById("gw-world");
            var sc = scaledStage(world, 1.3);
            var SW = root.clientWidth / sc, SH = root.clientHeight / sc;
            var code = typeof vars.code === "string" && vars.code.trim() ? vars.code : "import { Scene } from \"./scene\";\nimport { Typewriter } from \"./typewriter\";\n\nexport function Intro() {\n  return (\n    <Scene>\n      <Typewriter text=\"Ship it\" />\n    </Scene>\n  );\n}";
            var title = str(vars.title, "scene.tsx");
            var width = num(vars.width, 880, 300, 1100), height = num(vars.height, 420, 200, 700), fontSize = num(vars.font_size, 18, 10, 28);
            var stagger = num(vars.stagger_frames, 10, 1, 30), speed = num(vars.speed, 1, 0.25, 4);
            var aura = bool(vars.aura, false), lights = bool(vars.traffic_lights, true);
            var glassColor = str(vars.glass_color, "rgba(10, 10, 10, 0.6)");
            document.getElementById("gw-title").textContent = title;
            document.getElementById("gw-lights").style.display = lights ? "flex" : "none";
            document.getElementById("gw-glass").style.background = glassColor;
            var ring = document.getElementById("gw-ring"), body = document.getElementById("gw-body");
            ring.style.width = width + "px"; ring.style.height = height + "px";
            ring.style.left = (SW - width) / 2 + "px"; ring.style.top = (SH - height) / 2 + "px";
            body.style.fontSize = fontSize + "px";
            var aur = document.getElementById("gw-aura"); if (!aura) aur.style.display = "none";
            var lines = code.split("\n"), els = buildLines(body, lines, fontSize);

            var zoom = num(vars.zoom, 2.6, 1, 4);
            var RING = 1, CHROME = 40, PAD_TOP = 20, PAD_LEFT = 24, GAP = 4, ANCHOR_X = 110, TARGET_Y = SH / 2, PULL = 24;
            var blockLeft = (SW - width) / 2, blockTop = (SH - height) / 2, bodyTop = blockTop + RING + CHROME + PAD_TOP;
            var centers = [], walk = bodyTop;
            lines.forEach(function (ln) { var h = ln.trim() === "" ? fontSize * 0.8 : fontSize * 1.55; centers.push(walk + h / 2); walk += h + GAP; });
            var anchorX = blockLeft + RING + PAD_LEFT;
            var scanStagger = stagger / speed, scanEnd = (lines.length - 1) * scanStagger;
            function draw(frame) {
              els.forEach(function (el, i) {
                var f = frame - Math.round((i * stagger) / speed);
                el.style.opacity = interpolate(f, [0, 8], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" });
                el.style.transform = "translateY(" + interpolate(f, [0, 8], [4, 0], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }) + "px)";
              });
              var pos = interpolate(frame, [0, Math.max(scanEnd, 1e-6)], [0, lines.length - 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" });
              var lo = Math.floor(pos), up = Math.min(lo + 1, lines.length - 1);
              var trackedY = centers[lo] + (centers[up] - centers[lo]) * (pos - lo);
              var pinX = ANCHOR_X - zoom * anchorX, pinY = TARGET_Y - zoom * trackedY;
              var pull = interpolate(frame, [scanEnd, scanEnd + PULL / speed], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: Easing.inOut(Easing.cubic) });

              world.style.transform = "scale(" + sc + ") translate(" + (1 - pull) * pinX + "px," + (1 - pull) * pinY + "px) scale(" + scale + ")";
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 150, draw);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};

          })();
        </script>
      </div>
