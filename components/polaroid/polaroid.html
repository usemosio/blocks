  An instant-photo frame with a handwritten caption. The photo is a built-in live placeholder (a drifting sunrise gradient); layer your own video or image over the photo window to use it.

<html
  lang="en"
  data-composition-id="polaroid"
  data-composition-duration="5"
  data-composition-variables='[{"id":"caption","type":"string","role":"content","label":"Caption","description":"Handwritten caption under the photo.","default":"first light"},{"id":"caption_at","type":"number","role":"motion","label":"Caption starts","description":"Frame (30 fps) where the handwriting begins.","default":0,"min":0,"max":60,"step":1,"unit":"frames"},{"id":"width","type":"number","role":"style","label":"Card width","description":"Card width in pixels on a 1280x720 frame (scaled to the actual frame).","default":652,"min":320,"max":900,"step":4,"unit":"px"},{"id":"caption_size","type":"number","role":"style","label":"Caption size","description":"Caption size in pixels at 652 px card width.","default":36,"min":20,"max":56,"step":1,"unit":"px"},{"id":"frame_color","type":"color","role":"style","label":"Frame","description":"Paper colour of the card.","default":"#fdfcf8"},{"id":"caption_color","type":"color","role":"style","label":"Ink","description":"Caption colour.","default":"#26242c"},{"id":"step","type":"number","role":"motion","label":"Frames per pose","description":"How many frames each handwriting pose is held (30 fps).","default":3,"min":1,"max":6,"step":1,"unit":"frames"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Polaroid</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { font-family: Caveat, cursive; }
        .pl-stage { position: absolute; inset: 0; }
        #pl-scene { display: flex; align-items: center; justify-content: center; }
        #pl-card { box-sizing: border-box; border-radius: 4px; box-shadow: 0 8px 20px rgba(38,36,44,0.18), 0 2px 5px rgba(38,36,44,0.12); flex: none; }
        #pl-media { position: relative; margin: 0 auto; background: #100f14; overflow: hidden; }
        #pl-sun { position: absolute; top: 0; bottom: 0; left: -10%; right: -10%; background: linear-gradient(115deg, #2b3a67 0%, #6f7f35 45%, #b8642a 100%); }
        #pl-cap { position: relative; display: flex; align-items: center; justify-content: center; }
        .pl-text { display: inline-block; line-height: 1.15; font-weight: 600; white-space: pre-wrap; }
        .pl-ch { display: inline-block; white-space: pre; }

      </style>

      <div id="root" data-composition-id="polaroid" data-duration="5" data-fps="30">
        <div id="pl-clip" class="pl-stage clip" data-start="0" data-duration="5" data-track-index="0">
<div id="pl-scene"><div id="pl-card"><div id="pl-media" class="pl-media"><div id="pl-sun"></div></div><div id="pl-cap"><span id="pl-text" class="pl-text"></span></div></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            // Scale a 1280x720 design to the frame (bigger on a tall frame).
            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var scene = document.getElementById("pl-scene");
            scaledStage(scene);
            var caption = typeof vars.caption === "string" ? vars.caption : "first light";
            var captionAt = Math.round(num(vars.caption_at, 0, 0, 60));
            var width = num(vars.width, 652, 320, 900), step = Math.round(num(vars.step, 3, 1, 6));
            var k = width / 652;
            var pad = 16 * k, mw = 620 * k, mh = 349 * k, ch = 62 * k;
            var card = document.getElementById("pl-card"), media = document.getElementById("pl-media"), cap = document.getElementById("pl-cap");
            card.style.width = width + "px"; card.style.height = pad + mh + ch + "px";
            card.style.background = str(vars.frame_color, "#fdfcf8"); card.style.paddingTop = pad + "px";
            media.style.width = mw + "px"; media.style.height = mh + "px";
            cap.style.height = ch + "px";
            var text = document.getElementById("pl-text");
            text.style.fontSize = num(vars.caption_size, 36, 20, 56) * k + "px";
            text.style.color = str(vars.caption_color, "#26242c");
            var chars = Array.from(caption).map(function (c, i) {
              var s = document.createElement("span");
              s.className = "pl-ch"; s.textContent = c; s.style.opacity = "0";
              text.appendChild(s);
              return { el: s, rot: hashRange("hw:" + caption + ":" + i + ":r", -3.2, 3.2), dy: hashRange("hw:" + caption + ":" + i + ":y", -1.8, 1.8) };
            });
            var sun = document.getElementById("pl-sun");
            var perStep = 1.4;
            function draw(frame) {
              // The photo keeps playing on the real clock: drift left 0 to 40 px and zoom 1 to 1.08 over 120 frames.
              var f = Math.min(frame, 120) / 120;
              sun.style.transform = "translateX(" + (-40 * f * k) + "px) scale(" + (1 + 0.08 * f) + ")";
              // Handwriting in held poses.
              var steps = Math.max(0, qstep(Math.max(0, qf(frame, step) - captionAt), step));
              var shown = Math.floor(steps * perStep), fresh = shown - Math.ceil(perStep);
              chars.forEach(function (c, i) {
                var vis = i < shown;
                c.el.style.opacity = vis ? "1" : "0";
                c.el.style.transform = vis ? "translate(0," + c.dy + "px) rotate(" + c.rot + "deg) scale(" + (i >= fresh ? 1.06 : 1) + ")" : "none";
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 150, draw);

            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["polaroid"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
