<!doctype html>
<!--
  Rating Summary

  A big average rating ("4,9" with an Indonesian decimal comma) counts up while five stars fill, five bars (5 to 1 stars) grow to their shares, and the review count ("1.284 ulasan") counts up last. Score, shares and review count are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="rating-summary"
  data-composition-duration="5.5"
  data-composition-variables='[
  {
    "id": "score",
    "type": "string",
    "role": "content",
    "label": "Score",
    "description": "Average rating out of 5. A comma or a dot works as the decimal mark.",
    "default": "4,9"
  },
  {
    "id": "shares",
    "type": "string",
    "role": "content",
    "label": "Shares",
    "description": "Five numbers separated by commas: the percentage of 5-, 4-, 3-, 2- and 1-star ratings.",
    "default": "78,15,5,1,1"
  },
  {
    "id": "reviews",
    "type": "string",
    "role": "content",
    "label": "Review count",
    "description": "Shown last. Digits count up with dots as thousands separators; the words around them are kept.",
    "default": "1.284 ulasan"
  },
  {
    "id": "title",
    "type": "string",
    "role": "content",
    "label": "Title",
    "description": "Small line above the score. Leave empty to hide it.",
    "default": "Rating pelanggan"
  },
  {
    "id": "bar_color",
    "type": "color",
    "role": "style",
    "label": "Bar colour",
    "description": "The share bars.",
    "default": "#0a0a0a"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The stars: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Rating Summary</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--rs-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--rs-bg);
        }
        #root * { box-sizing: border-box; }
        .rs-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .rs-wrap { position: absolute; left: 50%; top: 50%; display: flex; transform-origin: 50% 50%; }
        .rs-left { display: flex; flex-direction: column; align-items: center; }
        .rs-title { font-size: calc(var(--u) * 40); font-weight: 500; color: var(--rs-muted); margin-bottom: calc(var(--u) * 8); }
        .rs-score { font-size: calc(var(--u) * 400); font-weight: 700; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; }
        .rs-stars { width: calc(var(--u) * 540); height: calc(var(--u) * 108); margin-top: calc(var(--u) * 6); }
        .rs-stars { position: relative; }
        .rs-stars svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .rs-sfill { position: absolute; left: 0; top: 0; height: 100%; overflow: hidden; }
        .rs-sfill svg { width: auto; height: auto; max-width: none; }
        .rs-rev { margin-top: calc(var(--u) * 28); font-size: calc(var(--u) * 52); font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .rs-bars { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 30); }
        .rs-row { display: flex; align-items: center; gap: calc(var(--u) * 22); font-size: calc(var(--u) * 40); font-weight: 600; font-variant-numeric: tabular-nums; }
        .rs-lab { width: calc(var(--u) * 84); display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--u) * 6); }
        .rs-lab svg { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
        .rs-track { flex: 1; height: calc(var(--u) * 26); border-radius: calc(var(--u) * 13); background: rgba(115,115,115,0.18); overflow: hidden; }
        .rs-fill { height: 100%; border-radius: calc(var(--u) * 13); background: var(--rs-bar); transform-origin: 0 50%; }
        .rs-pct { width: calc(var(--u) * 110); color: var(--rs-muted); font-weight: 500; }

      </style>

      <div id="root" data-composition-id="rating-summary" data-duration="5.5" data-fps="30">
        <div id="rs-clip" class="rs-stage clip" data-start="0" data-duration="5.5" data-track-index="0">

          <div class="rs-wrap" id="rs-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("rs", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", bar: "#0a0a0a" });


            var u = U, wrap = document.getElementById("rs-wrap");
            root.style.setProperty("--rs-bar", colr(vars.bar_color, "#0a0a0a"));
            var scoreTxt = str(vars.score, "4,9");
            var score = Math.min(5, Math.max(0, parseFloat(scoreTxt.replace(",", ".")) || 4.9));
            var shares = String(str(vars.shares, "78,15,5,1,1")).split(/[,;\s]+/).map(function (x) { return Math.max(0, Math.min(100, Number(x) || 0)); });
            while (shares.length < 5) shares.push(0); shares = shares.slice(0, 5);
            var reviews = str(vars.reviews, "1.284 ulasan"), title = typeof vars.title === "string" ? vars.title.trim() : "Rating pelanggan";
            function fmt(v) { return (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
            var STAR = "M50 6 L62.3 36.5 L95 39 L70 60.5 L77.8 92 L50 74.6 L22.2 92 L30 60.5 L5 39 L37.7 36.5 Z";
            var left = el("div", "rs-left", wrap);
            var tEl = el("div", "rs-title", left); tEl.textContent = title; if (!title) tEl.style.display = "none";
            var sEl = el("div", "rs-score", left); sEl.textContent = fmt(0);
            var stars = el("div", "rs-stars", left);
            var ssv = svg("svg", { viewBox: "0 0 500 100" }, stars);
            var gb = svg("g", { fill: "rgba(115,115,115,0.22)" }, ssv);
            var fillBox = el("div", "rs-sfill", stars);
            var fsv = svg("svg", { viewBox: "0 0 500 100" }, fillBox);
            var gf = svg("g", { fill: colr(vars.main_color, "#2563eb") }, fsv);
            for (var i = 0; i < 5; i++) { [gb, gf].forEach(function (g) { svg("path", { d: STAR, transform: "translate(" + i * 100 + " 0)" }, g); }); }
            var starsW = 540 * u;
            fsv.style.width = starsW + "px"; fsv.style.height = 108 * u + "px";
            var rev = el("div", "rs-rev", left);
            var bars = el("div", "rs-bars", wrap), rows = [];
            for (var k = 0; k < 5; k++) {
              var r = el("div", "rs-row", bars), lab = el("div", "rs-lab", r);
              lab.innerHTML = "<span>" + (5 - k) + '</span><svg viewBox="0 0 100 100"><path d="' + STAR + '" fill="currentColor"></path></svg>';
              var tr = el("div", "rs-track", r), f = el("div", "rs-fill", tr);
              var pc = el("div", "rs-pct", r); pc.textContent = String(shares[k]).replace(".", ",") + "%";
              rows.push({ r: r, f: f, p: pc, v: shares[k] });
            }
            var gw, gh;
            if (PORTRAIT) { wrap.style.flexDirection = "column"; wrap.style.alignItems = "center"; wrap.style.gap = 70 * u + "px"; bars.style.width = 860 * u + "px"; gw = 860 * u; gh = 400 * u + 108 * u + 130 * u + 70 * u + 5 * 56 * u + 4 * 30 * u + 80 * u; }
            else { wrap.style.alignItems = "center"; wrap.style.gap = 110 * u + "px"; bars.style.width = 780 * u + "px"; gw = 540 * u + 110 * u + 780 * u + 20 * u; gh = 640 * u; }
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            var S = Math.min(1.3, (H * 0.88) / gh, (W * 0.94) / gw);
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });

            var m = /^(\D*)(\d[\d.,]*)(.*)$/.exec(reviews), rv = m ? parseInt(m[2].replace(/[.,]/g, ""), 10) : NaN;
            function showRev(v) { rev.textContent = !m || v >= rv ? reviews : m[1] + dots(v) + m[3]; }
            showRev(0);
            var sc = { v: 0 }, rc = { v: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(tEl, { opacity: 0, y: 20 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
            tl.fromTo(sc, { v: 0 }, { v: score, duration: 1.2, ease: "power2.out", onUpdate: function () { sEl.textContent = fmt(sc.v); } }, 0.3);
            tl.fromTo(sEl, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.3);
            tl.fromTo(fillBox, { width: 0 }, { width: starsW * score / 5, duration: 1.2, ease: "power2.out" }, 0.45);
            rows.forEach(function (o, i) {
              var t = 1.3 + i * 0.12;
              tl.fromTo(o.f, { scaleX: 0 }, { scaleX: Math.max(0.0001, o.v / 100), duration: 0.8, ease: "expo.out" }, t);
              tl.fromTo([o.r.firstChild, o.p], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, t);
            });
            tl.fromTo(rev, { opacity: 0, y: 20 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.5);
            if (m && rv) tl.fromTo(rc, { v: 0 }, { v: rv, duration: 1.0, ease: "power2.out", immediateRender: false, onUpdate: function () { showRev(Math.round(rc.v)); } }, 2.5);
            tl.set(rev, { opacity: 0 }, 0);

            var total = parseFloat(root.dataset.duration || "5.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["rating-summary"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
