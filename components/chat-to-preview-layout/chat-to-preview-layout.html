<html
  lang="en"
  data-composition-id="chat-to-preview-layout"
  data-composition-duration="4"
  data-composition-variables='[{"id":"start_chat_ratio","type":"number","role":"motion","label":"Start chat ratio","description":"Share of the split the chat takes at the start.","default":0.5,"min":0.1,"max":0.9,"step":0.05},{"id":"end_chat_ratio","type":"number","role":"motion","label":"End chat ratio","description":"Share of the split the chat takes at the end.","default":0.25,"min":0.05,"max":0.9,"step":0.05},{"id":"chat_title","type":"string","role":"content","label":"Chat label","description":"Small label at the top of the chat panel.","default":"Chat"},{"id":"messages","type":"string","role":"content","label":"Messages","description":"Chat lines, one per line; start a line with > for the user (right, blue), otherwise it is the assistant.","default":"> Build me a landing page\nSure, what should it feature?\n> Hero, pricing, footer.\nOn it. Generating now..."},{"id":"headline","type":"string","role":"content","label":"Preview headline","description":"Headline in the placeholder preview.","default":"Ship faster."},{"id":"subline","type":"string","role":"content","label":"Preview text","description":"Supporting line in the placeholder preview.","default":"The fastest way to launch your idea."},{"id":"cta","type":"string","role":"content","label":"Preview button","description":"Button label in the placeholder preview.","default":"Get started"},{"id":"speed","type":"number","role":"motion","label":"Speed","description":"Playback speed multiplier.","default":1,"min":0.25,"max":4,"step":0.05,"unit":"x"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Chat to Preview Layout</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: #09090b; font-family: Geist, system-ui, sans-serif; }
        .cp-stage { position: absolute; inset: 0; }
        #cp-lay { box-sizing: border-box; padding: 32px; display: flex; gap: 16px; }
        .cp-col { flex: none; position: relative; overflow: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; }
        .cp-in { position: absolute; inset: 0; }
        #cp-chat-in { background: #111; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
        .cp-lab { color: #888; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
        .cp-msg { color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 14px; max-width: 85%; }
        .cp-msg.u { align-self: flex-end; background: #0ea5e9; } .cp-msg.a { align-self: flex-start; background: #262626; }
        #cp-prev-in { background: #fff; display: flex; flex-direction: column; }
        .cp-bar { height: 36px; background: #f4f4f5; border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; gap: 6px; padding: 0 12px; flex: none; }
        .cp-dot { width: 10px; height: 10px; border-radius: 999px; }
        .cp-page { flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
        .cp-h { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; color: #0a0a0a; }
        .cp-p { font-size: 16px; color: #71717a; max-width: 360px; }
        .cp-btn { margin-top: 12px; align-self: flex-start; background: #0a0a0a; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; }

      </style>

      <div id="root" data-composition-id="chat-to-preview-layout" data-duration="4" data-fps="30">
        <div id="cp-clip" class="cp-stage clip" data-start="0" data-duration="4" data-track-index="0">
<div id="cp-lay"><div id="cp-chat" class="cp-col"><div id="cp-chat-in" class="cp-in"><div id="cp-lab" class="cp-lab"></div></div></div><div id="cp-prev" class="cp-col"><div id="cp-prev-in" class="cp-in"><div class="cp-bar"><span class="cp-dot" style="background:#ef4444"></span><span class="cp-dot" style="background:#f59e0b"></span><span class="cp-dot" style="background:#22c55e"></span></div><div class="cp-page"><div id="cp-h" class="cp-h"></div><div id="cp-p" class="cp-p"></div><div id="cp-btn" class="cp-btn"></div></div></div></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


                        // Stop-motion helpers: poses are held for `step` frames.
            var DEFAULT_STEP = 3;
            function qf(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step) * step; }
            function qstep(frame, step) { step = step || DEFAULT_STEP; return Math.floor(frame / step); }
            function hash01(seed) { return random(seed); }
            function hashRange(seed, lo, hi) { return lo + hash01(seed) * (hi - lo); }
            function paperJitter(frame, seed, o) {
              o = o || {};
              var amp = o.amp != null ? o.amp : 1.4, rotAmp = o.rotAmp != null ? o.rotAmp : 0.35;
              var s = qstep(frame, o.step);
              return { x: hashRange(seed + ":x:" + s, -amp, amp), y: hashRange(seed + ":y:" + s, -amp, amp), rot: hashRange(seed + ":r:" + s, -rotAmp, rotAmp) };
            }
            function steppedRamp(frame, from, to, o) {
              o = o || {};
              var f = qf(frame, o.step);
              if (f <= from) return 0;
              if (f >= to) return 1;
              var ease = o.ease || function (t) { return t; };
              return ease((f - from) / (to - from));
            }


            function scaledStage(el, boost) {
              var W = root.clientWidth, H = root.clientHeight;
              var s = Math.min(W / 1280, H / 720) * (H > W ? (boost || 1.4) : 1);
              el.style.position = "absolute"; el.style.left = "0"; el.style.top = "0";
              el.style.width = W / s + "px"; el.style.height = H / s + "px";
              el.style.transformOrigin = "0 0"; el.style.transform = "scale(" + s + ")";
              return s;
            }

            var lay = document.getElementById("cp-lay");
            var s = scaledStage(lay, 1.4);
            var SW = root.clientWidth / s, SH = root.clientHeight / s;
            var tall = SH > SW;
            lay.style.flexDirection = tall ? "column" : "row";
            var chat = document.getElementById("cp-chat"), prev = document.getElementById("cp-prev");
            var chatIn = document.getElementById("cp-chat-in"), prevIn = document.getElementById("cp-prev-in");
            document.getElementById("cp-lab").textContent = str(vars.chat_title, "Chat");
            var msgs = str(vars.messages, "> Build me a landing page\nSure, what should it feature?\n> Hero, pricing, footer.\nOn it. Generating now...").split("\n").filter(function (l) { return l.trim(); });
            msgs.forEach(function (l) {
              var user = l.charAt(0) === ">";
              var m = document.createElement("div"); m.className = "cp-msg " + (user ? "u" : "a");
              m.textContent = user ? l.slice(1).trim() : l.trim();
              chatIn.appendChild(m);
            });
            document.getElementById("cp-h").textContent = str(vars.headline, "Ship faster.");
            document.getElementById("cp-p").textContent = str(vars.subline, "The fastest way to launch your idea.");
            document.getElementById("cp-btn").textContent = str(vars.cta, "Get started");
            var startR = num(vars.start_chat_ratio, 0.5, 0.1, 0.9), endR = num(vars.end_chat_ratio, 0.25, 0.05, 0.9), speed = num(vars.speed, 1, 0.25, 4);
            // Inner content keeps a fixed virtual size and is clipped, so text never reflows while the columns resize.
            if (tall) { chatIn.style.minHeight = "420px"; prevIn.style.minHeight = "560px"; }
            else { chatIn.style.minWidth = "520px"; prevIn.style.minWidth = "720px"; }
            var APPLE = Easing.bezier(0.16, 1, 0.3, 1);
            var totalFrames = Math.round(parseFloat(root.dataset.duration || "4") * 30);
            var avail = (tall ? SH : SW) - 64 - 16;
            function draw(frame) {
              var f = frame * speed, a = totalFrames * 0.1, b = totalFrames * 0.7;
              var o = { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: APPLE };
              var ratio = interpolate(f, [a, b], [startR, endR], o);
              var po = interpolate(f, [a, b], [0, 1], o), pt = interpolate(f, [a, b], [40, 0], o);
              // flex-basis as a percentage of the content box, as in the source.
              var prop = tall ? "height" : "width";
              chat.style[prop] = ratio * 100 + "%"; prev.style[prop] = (1 - ratio) * 100 + "%";
              chat.style[tall ? "width" : "height"] = "auto"; prev.style[tall ? "width" : "height"] = "auto";
              prev.style.opacity = po;
              prev.style.transform = tall ? "translateY(" + pt + "px)" : "translateX(" + pt + "px)";
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, totalFrames, draw);

            var total = parseFloat(root.dataset.duration || "4");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["chat-to-preview-layout"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
