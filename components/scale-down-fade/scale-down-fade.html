<html
  lang="en"
  data-composition-id="scale-down-fade"
  data-composition-duration="3"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text that settles in and fades out.", "default": "Quietly refined." },
    { "id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 160, "step": 1, "unit": "px" },
    { "id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#171717" },
    { "id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Scale Down Fade</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          color: var(--color, #171717);
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }
        .sdf-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .sdf-line { display: inline-block; letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; transform-origin: 50% 50%; opacity: 0; }
      </style>

      <div id="root" data-composition-id="scale-down-fade" data-duration="3" data-fps="30">
        <div id="sdf-clip" class="sdf-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <span id="sdf-line" class="sdf-line"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            gsap.registerPlugin(CustomEase);
            function bz(id, a, b, c, d) {
              return CustomEase.create("sdf-" + id, "M0,0 C" + a + "," + b + " " + c + "," + d + " 1,1");
            }
            // interpolate(frame, [a, b], [from, to], { easing }) as a tween (frames at 30 fps).
            function tw(tl, el, from, to, a, b, ease, keep) {
              var t = Object.assign({}, to, { duration: (b - a) / 30, ease: ease || "none", immediateRender: !keep });
              tl.fromTo(el, from, t, a / 30);
            }
            // Shrink an element's font size so it fits a fraction of the frame width.
            function fit(el, size, frac) {
              el.style.fontSize = size + "px";
              var maxWidth = Math.max(1, root.clientWidth * frac);
              if (el.scrollWidth > maxWidth) {
                size = Math.max(12, size * (maxWidth / el.scrollWidth));
                el.style.fontSize = size + "px";
              }
              return size;
            }
            var TOTAL = parseFloat(root.dataset.duration || "3");
            function finish(tl) {
              if (tl.duration() < TOTAL) tl.to({}, { duration: TOTAL - tl.duration() });
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["scale-down-fade"] = tl;
            }
            var text = str(vars.text, "Quietly refined.");
            var weight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);

            var line = document.getElementById("sdf-line");
            line.style.fontWeight = weight;
            line.textContent = text;
            fit(line, num(vars.font_size, 72, 12, 160), 0.9);

            // 16 frames in, 11 frames out at the end of the clip (90 frames).
            var enter = bz("in", 0.22, 1, 0.36, 1);
            var exit = bz("out", 0.64, 0, 0.78, 0);
            var exitStart = Math.max(16, TOTAL * 30 - 11);
            var tl = gsap.timeline({ paused: true });
            tw(tl, line, { opacity: 0 }, { opacity: 1 }, 0, 16, enter);
            tw(tl, line, { y: 8 }, { y: 0 }, 0, 16, enter);
            tw(tl, line, { scale: 1.04 }, { scale: 1 }, 0, 16, enter);
            tw(tl, line, { opacity: 1 }, { opacity: 0 }, exitStart, TOTAL * 30, exit, true);
            tw(tl, line, { y: 0 }, { y: -8 }, exitStart, TOTAL * 30, exit, true);
            tw(tl, line, { scale: 1 }, { scale: 0.94 }, exitStart, TOTAL * 30, exit, true);
            finish(tl);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
