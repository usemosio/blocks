<!doctype html>
<!-- Multi Direction Slide Text demo: a vertical 1080×1920 frame mounting the component full-frame. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Multi Direction Slide Text Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .demo-mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="multi-direction-slide-text-demo" data-start="0" data-width="1080" data-height="1920" data-duration="3" data-fps="30">
      <div
        id="demo-mount"
        class="demo-mount clip"
        data-composition-id="multi-direction-slide-text"
        data-composition-src="./multi-direction-slide-text.html"
        data-variable-values='{"font_size": 130}'
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["multi-direction-slide-text-demo"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
