<!doctype html>
<!--
  Matrix Decode

  Scrambled symbols resolve into the real text one character at a time, left to right, in a monospace face.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="matrix-decode"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Text that decodes.", "default": "DECRYPTED"},
    {"id": "charset", "type": "string", "role": "style", "label": "Charset", "description": "Symbols shown while a character is still scrambled.", "default": "!@#$%^&*()_+-=<>?/\\|"},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Maximum text size in pixels. Longer text shrinks to fit the frame.", "default": 72, "min": 12, "max": 240, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Color", "description": "Text color.", "default": "#22c55e"},
    {"id": "font_weight", "type": "enum", "role": "style", "label": "Font weight", "description": "Weight of the text.", "default": "600", "options": [{"value": "400", "label": "Regular"}, {"value": "500", "label": "Medium"}, {"value": "600", "label": "Semibold"}, {"value": "700", "label": "Bold"}]},
    {"id": "reveal_duration", "type": "number", "role": "motion", "label": "Reveal duration", "description": "Frames over which the whole text resolves.", "default": 60, "min": 10, "max": 240, "step": 1, "unit": "frames"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Matrix Decode</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { background: #ffffff; color: var(--color, #22c55e); font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
        .md-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .md-line { letter-spacing: 0.05em; white-space: pre; line-height: 1.2; }
      </style>

      <div id="root" data-composition-id="matrix-decode" data-duration="3" data-fps="30">
        <div id="md-clip" class="md-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <span id="md-line" class="md-line" role="img"></span>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function pick(value, list, fallback) {
              return list.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 to 1, rest at 0 velocity (mass, stiffness, damping), at `frame` of 30 fps.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass, k = cfg.stiffness, c = cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              var q = Math.sqrt(z * z - 1), r1 = w0 * (-z + q), r2 = w0 * (-z - q);
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var TOTAL = 3;
            var FRAMES = Math.round(TOTAL * 30);
            var clock = { frame: 0 };
            function frameNow() { return Math.round(clock.frame * 1000) / 1000; }
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: FRAMES, duration: TOTAL, ease: "none", onUpdate: function () { draw(frameNow()); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["matrix-decode"] = tl;
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            function fit(el, size, frac, hfrac) {
              el.style.fontSize = size + "px";
              var maxW = Math.max(1, root.clientWidth * frac);
              var maxH = Math.max(1, root.clientHeight * (hfrac || 0.9));
              var k = Math.min(1, maxW / Math.max(1, el.scrollWidth), maxH / Math.max(1, el.scrollHeight));
              if (k < 1) { size = Math.max(8, size * k); el.style.fontSize = size + "px"; }
              return size;
            }


            var text = str(vars.text, "DECRYPTED");
            var charset = Array.from(typeof vars.charset === "string" && vars.charset.length ? vars.charset : "!@#$%^&*()_+-=<>?/\\|");
            var size = num(vars.font_size, 72, 12, 240), speed = num(vars.speed, 1, 0.25, 4);
            var reveal = num(vars.reveal_duration, 60, 10, 240);
            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--color", vars.color);
            var line = document.getElementById("md-line");
            line.style.fontWeight = pick(vars.font_weight, ["400", "500", "600", "700"], "600");
            line.setAttribute("aria-label", text);
            var chars = Array.from(text);
            line.textContent = text;
            fit(line, size, 0.9); onFonts(function () { fit(line, size, 0.9); });
            // A string hash to [0, 1), stable for a given key (stands in for a seeded random).
            function rnd(key) {
              var h = 1779033703 ^ key.length;
              for (var i = 0; i < key.length; i++) { h = Math.imul(h ^ key.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
              h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
              return (h >>> 0) / 4294967296;
            }
            start(function (raw) {
              var frame = raw * speed, out = "";
              for (var i = 0; i < chars.length; i++) {
                var revealFrame = (i / Math.max(chars.length, 1)) * reveal;
                if (chars[i] === " ") out += " ";
                else if (frame >= revealFrame) out += chars[i];
                else out += charset[Math.floor(rnd(i + "-" + Math.floor(frame / 2)) * charset.length)];
              }
              line.textContent = out;
            });

          })();
        </script>
      </div>
    </template>
  </body>
</html>
