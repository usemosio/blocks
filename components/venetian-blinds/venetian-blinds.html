<html
  lang="en"
  data-composition-id="venetian-blinds"
  data-composition-duration="0.8667"
  data-composition-variables='[
  {
    "id": "slats",
    "type": "number",
    "role": "layout",
    "label": "Slats",
    "description": "Number of horizontal slats.",
    "default": 12,
    "min": 2,
    "max": 40,
    "step": 1
  },
  {
    "id": "stagger",
    "type": "number",
    "role": "motion",
    "label": "Stagger",
    "description": "Share of the transition spent rippling across slats, 0 to 0.9.",
    "default": 0.55,
    "min": 0,
    "max": 0.9,
    "step": 0.05
  },
  {
    "id": "direction",
    "type": "enum",
    "role": "motion",
    "label": "Direction",
    "description": "Which slat turns first.",
    "default": "top-down",
    "options": [
      {
        "value": "top-down",
        "label": "Top down"
      },
      {
        "value": "bottom-up",
        "label": "Bottom up"
      },
      {
        "value": "center",
        "label": "From the center"
      }
    ]
  },
  {
    "id": "shade_color",
    "type": "color",
    "role": "style",
    "label": "Shade color",
    "description": "Tint a slat picks up as it turns away from the light.",
    "default": "#000000"
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Venetian Blinds</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, sans-serif);
          pointer-events: none;
        }

        #root { background: #141318; }
        .vnb-stage { position: absolute; inset: 0; }
        .vnb-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .vnb-in { display: flex; flex-direction: column; align-items: center; gap: 2.4cqmin; }
        .vnb-in span { font-size: 9cqmin; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #f2f2f2; white-space: nowrap; }
        .vnb-bar { display: block; width: 14cqmin; height: 0.8cqmin; border-radius: 1cqmin; background: rgba(242, 242, 242, 0.55); }
        .vnb-pa { background: #141318; }
        .vnb-pb { background: linear-gradient(135deg, #3b3699 0%, #1e2a6b 55%, #0f4c75 100%); }
        .vnb-pc { background: linear-gradient(135deg, #7a2f5f 0%, #3a2250 55%, #1c1b3f 100%); }

        .vnb-slats { position: absolute; inset: 0; z-index: 2; }
        .vnb-slat { position: absolute; left: 0; overflow: hidden; transform-origin: 50% 50%; backface-visibility: hidden; }
        .vnb-slat > .vnb-copy { position: absolute; left: 0; }
        .vnb-shade { position: absolute; inset: 0; }
        .vnb-pb { z-index: 1; }
        #vnb-pa-src { display: none; }

      </style>

      <div id="root" data-composition-id="venetian-blinds" data-duration="0.8667" data-fps="30">
        <div id="vnb-clip" class="vnb-stage clip" data-start="0" data-duration="0.8667" data-track-index="0">
          <div id="vnb-src" style="display:none"><div id="vnb-a" class="vnb-panel vnb-pa"><div class="vnb-in"><span>Scene A</span><i class="vnb-bar"></i></div></div></div>
          <div id="vnb-b" class="vnb-panel vnb-pb"><div class="vnb-in"><span>Scene B</span><i class="vnb-bar"></i></div></div>
          <div id="vnb-slats" class="vnb-slats"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        
        <script>
          (function () {
            "use strict";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v.trim() : f; }
function pick(v, list, f) { return list.indexOf(String(v)) >= 0 ? String(v) : f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
// cubic-bezier easing, solved by bisection (pure function of x)
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lo = 0, hi = 1, t = x;
    for (var i = 0; i < 28; i++) {
      var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
var inOutEase = bez(0.42, 0, 0.58, 1);
function inCubic(x) { return x * x * x; }
function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
function inQuad(x) { return x * x; }
function outQuad(x) { return 1 - (1 - x) * (1 - x); }
function outBack(s) { return function (x) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; }
// interpolate(p, inputs, outputs, ease): clamped, eased per segment (like Remotion's interpolate)
function interp(p, xs, ys, ease) {
  var n = xs.length;
  if (p <= xs[0]) return ys[0];
  if (p >= xs[n - 1]) return ys[n - 1];
  for (var i = 1; i < n; i++) {
    if (p <= xs[i]) {
      var t = (p - xs[i - 1]) / (xs[i] - xs[i - 1]);
      if (ease) t = ease(t);
      return lerp(ys[i - 1], ys[i], t);
    }
  }
  return ys[n - 1];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// damped spring from 0 to 1 (zero initial velocity), t in seconds
function spring(t, damping, stiffness, mass) {
  if (t <= 0) return 0;
  var w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (Math.abs(z - 1) < 1e-4) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  var s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s);
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
function stripIds(node) {
  var all = node.querySelectorAll("[id]");
  for (var i = 0; i < all.length; i++) all[i].removeAttribute("id");
  node.removeAttribute("id");
  return node;
}
function drive(name, duration, frame) {
  var st = { p: 0 };
  frame(0);
  var tl = gsap.timeline({ paused: true });
  tl.to(st, { p: 1, duration: duration, ease: "none", onUpdate: function () { frame(st.p); } }, 0);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[name] = tl;
}

            var D = 0.8667;

var count = Math.round(num(vars.slats, 12, 2, 40)), spread = num(vars.stagger, 0.55, 0, 0.9);
var dir = pick(vars.direction, ["top-down", "bottom-up", "center"], "top-down");
var shade = str(vars.shade_color, "#000000");
var host = document.getElementById("vnb-slats"), src = document.getElementById("vnb-a"), B = document.getElementById("vnb-b");
var W = root.clientWidth, H = root.clientHeight;
host.style.perspective = H * 2.2 + "px";
host.style.perspectiveOrigin = "50% 50%";
var turn = bez(0.55, 0, 0.35, 1);
var slats = [];
for (var i = 0; i < count; i++) {
  var top = Math.floor(i * H / count), bottom = Math.floor((i + 1) * H / count);
  var el = document.createElement("div");
  el.className = "vnb-slat";
  el.style.top = top + "px"; el.style.width = W + "px";
  el.style.height = (bottom - top + (i < count - 1 ? 1 : 0)) + "px";
  var copy = stripIds(src.cloneNode(true));
  copy.classList.add("vnb-copy");
  copy.style.position = "absolute"; copy.style.top = -top + "px"; copy.style.left = "0"; copy.style.width = W + "px"; copy.style.height = H + "px";
  var sh = document.createElement("div");
  sh.className = "vnb-shade"; sh.style.background = shade; sh.style.opacity = 0;
  el.appendChild(copy); el.appendChild(sh); host.appendChild(el);
  var t = count > 1 ? i / (count - 1) : 0;
  var delay = dir === "bottom-up" ? 1 - t : dir === "center" ? Math.abs(t - 0.5) * 2 : t;
  slats.push({ el: el, sh: sh, start: delay * spread });
}
function frame(p) {
  var s = interp(p, [0, 1], [1.06, 1], outCubic);
  B.style.transform = "scale(" + s + ")";
  for (var i = 0; i < slats.length; i++) {
    var sl = slats[i];
    var local = turn(interp(p, [sl.start, sl.start + 1 - spread], [0, 1]));
    var angle = local * 90, fade = interp(angle, [76, 88], [1, 0]);
    sl.el.style.display = fade <= 0 ? "none" : "block";
    sl.el.style.transform = "rotateX(" + angle + "deg)";
    sl.el.style.opacity = fade;
    sl.sh.style.opacity = Math.sin(angle * Math.PI / 180) * 0.75;
  }
}

            drive("venetian-blinds", D, frame);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
