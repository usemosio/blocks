<!doctype html>
<!--
  Liquid Edge Wipe

  Three layered colour panels flood up the frame with wobbly liquid edges, each point on the edge with its own random delay, then peel away upward to reveal the next scene.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

  copies of the Software, and to permit persons to whom the Software is
  furnished to do so, subject to the following conditions:

  SOFTWARE.

  Note: the author's pen says it is adapted from the Codrops article Dynamic Shape Overlays with SVG (tympanus.net/codrops/2017/10/17/dynamic-shape-overlays-with-svg/); this port follows the pen.

  Changes by usemosio/blocks: fills the host frame (SVG stretched to the frame, viewBox 0-100); click-to-toggle becomes a timed cover-then-reveal sequence with two built-in placeholder scenes (title and subtitle text) so it previews on its own; Math.random() becomes a seeded generator; the edge is drawn from a pure function of time instead of tween state; gradient fills become solid colour variables; text and colours are variables.
-->
<html
  lang="en"
  data-composition-id="liquid-edge-wipe"
  data-composition-duration="4.6"
  data-composition-variables='[
    {"id":"title","type":"string","role":"content","label":"Scene A text","description":"Text on the outgoing scene.","default":"Menu baru hari ini"},
    {"id":"subtitle","type":"string","role":"content","label":"Scene B text","description":"Text on the incoming scene.","default":"Segar setiap hari"},
    {"id":"color_1","type":"color","role":"style","label":"Layer 1","description":"First (back) wipe layer.","default":"#cfdcfb"},
    {"id":"color_2","type":"color","role":"style","label":"Layer 2","description":"Second wipe layer.","default":"#2563eb"},
    {"id":"color_3","type":"color","role":"style","label":"Layer 3","description":"Third (front) wipe layer.","default":"#0a0a0a"},
    {"id":"background_a","type":"color","role":"style","label":"Scene A background","description":"Background of the outgoing scene.","default":"#ffffff"},
    {"id":"background_b","type":"color","role":"style","label":"Scene B background","description":"Background of the incoming scene.","default":"#f5f5f4"},
    {"id":"text_color","type":"color","role":"style","label":"Text color","description":"Colour of both scene texts.","default":"#0a0a0a"},
    {"id":"font_size","type":"number","role":"style","label":"Font size","description":"Maximum text size in pixels; it also shrinks with the frame width.","default":120,"min":24,"max":260,"step":1,"unit":"px"},
    {"id":"points","type":"number","role":"motion","label":"Edge points","description":"How many points shape the wobbly edge.","default":10,"min":4,"max":24,"step":1},
    {"id":"point_spread","type":"number","role":"motion","label":"Point delay","description":"Largest random delay of a single edge point, in seconds.","default":0.3,"min":0,"max":1,"step":0.01,"unit":"s"},
    {"id":"layer_delay","type":"number","role":"motion","label":"Layer delay","description":"Delay between one layer and the next, in seconds.","default":0.25,"min":0,"max":1,"step":0.01,"unit":"s"},
    {"id":"seed","type":"number","role":"motion","label":"Seed","description":"Changes the random edge shape.","default":7,"min":1,"max":9999,"step":1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Liquid Edge Wipe</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;

        }
        .lew-stage {
          position: absolute;
          inset: 0;
        }

        .lew-scene { display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 8cqw; font-family: Geist, system-ui, sans-serif; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; color: var(--lew-text, #0a0a0a); }
        .lew-scene span { display: block; font-size: min(var(--lew-fs, 120px), 13cqw); text-wrap: balance; }
        #lew-b { opacity: 0; }
        #lew-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      </style>

      <div id="root" data-composition-id="liquid-edge-wipe" data-duration="4.6" data-fps="30">
        <div id="lew-clip" class="lew-stage clip" data-start="0" data-duration="4.6" data-track-index="0">
          <div id="lew-a" class="lew-stage lew-scene"><span id="lew-ta"></span></div>
          <div id="lew-b" class="lew-stage lew-scene"><span id="lew-tb"></span></div>
          <svg id="lew-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path id="lew-p0" /><path id="lew-p1" /><path id="lew-p2" />
          </svg>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(v, f, min, max) {
              var n = Number(v);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f;
            }
            function str(v, f) {
              return typeof v === "string" && v.trim() ? v : f;
            }
            function col(v, f) {
              return typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-z]+)$/i.test(v.trim()) ? v.trim() : f;
            }
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            var W = root.clientWidth || 1080;
            var H = root.clientHeight || 1920;
            var total = 4.6;

            root.style.setProperty("--lew-text", col(vars.text_color, "#0a0a0a"));
            root.style.setProperty("--lew-fs", num(vars.font_size, 120, 24, 260) + "px");
            var A = document.getElementById("lew-a"), B = document.getElementById("lew-b");
            A.style.background = col(vars.background_a, "#ffffff");
            B.style.background = col(vars.background_b, "#f5f5f4");
            document.getElementById("lew-ta").textContent = str(vars.title, "Menu baru hari ini");
            document.getElementById("lew-tb").textContent = str(vars.subtitle, "Segar setiap hari");
            var fills = [col(vars.color_1, "#cfdcfb"), col(vars.color_2, "#2563eb"), col(vars.color_3, "#0a0a0a")];
            var paths = [0, 1, 2].map(function (i) { var p = document.getElementById("lew-p" + i); p.setAttribute("fill", fills[i]); return p; });
            var numPoints = Math.round(num(vars.points, 10, 4, 24));
            var spread = num(vars.point_spread, 0.3, 0, 1);
            var perLayer = num(vars.layer_delay, 0.25, 0, 1);
            var DUR = 0.9, ease = gsap.parseEase("power2.inOut");
            var rand = rng(Math.round(num(vars.seed, 7, 1, 9999)));
            var delayIn = [], delayOut = [];
            for (var j = 0; j < numPoints; j++) { delayIn.push(rand() * spread); delayOut.push(rand() * spread); }
            var T_IN = 0.4, T_OUT = 2.4, T_SWAP = T_OUT - 0.05;
            function pt(t, t0, layerOrder, j, delays) {
              var p = (t - (t0 + perLayer * layerOrder + delays[j])) / DUR;
              p = p < 0 ? 0 : p > 1 ? 1 : p;
              return 100 * (1 - ease(p));
            }
            function d(t) {
              var opened = t < T_SWAP;
              for (var i = 0; i < 3; i++) {
                var pts = [];
                for (var j = 0; j < numPoints; j++) {
                  pts.push(opened ? pt(t, T_IN, i, j, delayIn) : pt(t, T_OUT, 2 - i, j, delayOut));
                }
                var s = opened ? "M 0 0 V " + pts[0] + " C" : "M 0 " + pts[0] + " C";
                for (var k = 0; k < numPoints - 1; k++) {
                  var x = ((k + 1) / (numPoints - 1)) * 100;
                  var cp = x - (1 / (numPoints - 1)) * 50;
                  s += " " + cp + " " + pts[k] + " " + cp + " " + pts[k + 1] + " " + x + " " + pts[k + 1];
                }
                s += opened ? " V 100 H 0" : " V 0 H 0";
                paths[i].setAttribute("d", s);
              }
            }
            var clock = { t: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.set(A, { opacity: 0 }, T_SWAP);
            tl.set(B, { opacity: 1 }, T_SWAP);
            tl.to(clock, { t: total, duration: total, ease: "none", onUpdate: function () { d(clock.t); } }, 0);
            d(0);
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["liquid-edge-wipe"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
