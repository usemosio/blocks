<html
  lang="en"
  data-composition-id="rotate-in"
  data-composition-duration="3"
  data-composition-variables='[
    [
      {
        "id": "text",
        "type": "string",
        "role": "content",
        "label": "Text",
        "description": "The text. A line break starts a new line.",
        "default": "Swing into place."
      },
      {
        "id": "font_size",
        "type": "number",
        "role": "style",
        "label": "Font size",
        "description": "Text size in pixels.",
        "default": 84,
        "min": 24,
        "max": 260,
        "step": 1,
        "unit": "px"
      },
      {
        "id": "color",
        "type": "color",
        "role": "style",
        "label": "Color",
        "description": "Text color.",
        "default": "#f4f4f5"
      },
      {
        "id": "font_weight",
        "type": "number",
        "role": "style",
        "label": "Font weight",
        "description": "Weight of the text.",
        "default": 700,
        "min": 100,
        "max": 900,
        "step": 100
      },
      {
        "id": "font",
        "type": "enum",
        "role": "style",
        "label": "Font",
        "description": "Typeface.",
        "default": "geist",
        "options": [
          {
            "value": "geist",
            "label": "Geist"
          },
          {
            "value": "poppins",
            "label": "Poppins"
          },
          {
            "value": "playfair",
            "label": "Playfair Display"
          },
          {
            "value": "grotesk",
            "label": "Space Grotesk"
          }
        ]
      },
      {
        "id": "degrees",
        "type": "number",
        "role": "motion",
        "label": "Angle",
        "description": "Angle the text starts at, in degrees. Negative tilts anticlockwise.",
        "default": -12,
        "min": -180,
        "max": 180,
        "step": 1,
        "unit": "deg"
      },
      {
        "id": "axis",
        "type": "enum",
        "role": "motion",
        "label": "Axis",
        "description": "z spins in plane; x and y hinge in depth.",
        "default": "z",
        "options": [
          {
            "value": "z",
            "label": "In plane (z)"
          },
          {
            "value": "x",
            "label": "Hinge on x"
          },
          {
            "value": "y",
            "label": "Hinge on y"
          }
        ]
      },
      {
        "id": "perspective",
        "type": "number",
        "role": "motion",
        "label": "Perspective",
        "description": "Depth of the 3D projection for the x and y axes, in pixels.",
        "default": 1200,
        "min": 200,
        "max": 4000,
        "step": 50,
        "unit": "px"
      },
      {
        "id": "scale_from",
        "type": "number",
        "role": "motion",
        "label": "Scale from",
        "description": "Scale at the start; a rotation that also grows reads as one gesture.",
        "default": 0.96,
        "min": 0.2,
        "max": 1.5,
        "step": 0.01
      },
      {
        "id": "origin",
        "type": "enum",
        "role": "motion",
        "label": "Pivot",
        "description": "Point the rotation pivots around.",
        "default": "center",
        "options": [
          {
            "value": "center",
            "label": "Center"
          },
          {
            "value": "top",
            "label": "Top"
          },
          {
            "value": "bottom",
            "label": "Bottom"
          },
          {
            "value": "left",
            "label": "Left"
          },
          {
            "value": "right",
            "label": "Right"
          },
          {
            "value": "top left",
            "label": "Top left"
          },
          {
            "value": "top right",
            "label": "Top right"
          },
          {
            "value": "bottom left",
            "label": "Bottom left"
          },
          {
            "value": "bottom right",
            "label": "Bottom right"
          }
        ]
      },
      {
        "id": "duration_frames",
        "type": "number",
        "role": "motion",
        "label": "Duration",
        "description": "Frames (30 per second) the entrance takes.",
        "default": 30,
        "min": 4,
        "max": 120,
        "step": 1,
        "unit": "frames"
      },
      {
        "id": "delay_frames",
        "type": "number",
        "role": "motion",
        "label": "Delay",
        "description": "Frames before the entrance starts.",
        "default": 6,
        "min": 0,
        "max": 120,
        "step": 1,
        "unit": "frames"
      },
      {
        "id": "exit",
        "type": "boolean",
        "role": "motion",
        "label": "Exit",
        "description": "Play an exit at the end of the clip.",
        "default": true
      }
    ]
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Rotate In</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Poppins:wght@400;600;800&amp;family=Playfair+Display:wght@400..900&amp;family=Space+Grotesk:wght@300..700&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }
        #root { color: #f4f4f5; }
        .rti-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .rti-text { max-width: 88%; text-align: center; line-height: 1.15; white-space: pre-wrap; }
      </style>

      <div id="root" data-composition-id="rotate-in" data-duration="3" data-fps="30">
        <div id="rti-clip" class="rti-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="rti-text" class="rti-text" role="img"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) && v !== "" && v !== null ? Math.min(max, Math.max(min, n)) : f; }
            function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
            function bool(v, f) { if (v === undefined || v === null || v === "") return f; return !(v === false || v === "false" || v === 0 || v === "0"); }
            function pick(v, list, f) { v = String(v); return list.indexOf(v) >= 0 ? v : f; }
            function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
            function lerp(a, b, t) { return a + (b - a) * t; }
            function ramp(v, a, b, from, to, ease) { var p = b === a ? 1 : clamp01((v - a) / (b - a)); if (ease) p = ease(p); return from + (to - from) * p; }
            function bez(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 30; i++) {
                  var cx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
              };
            }
            function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function mk(tag, parent, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; if (parent) parent.appendChild(e); return e; }
            var TOTAL = parseFloat(root.dataset.duration || "3");
            // Every frame is drawn from the frame number alone, so seeking anywhere draws the same frame.
            function drive(name, frameFn) {
              var clock = { f: 0 };
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { f: TOTAL * 30, duration: TOTAL, ease: "none", onUpdate: function () { frameFn(clock.f); } }, 0);
              frameFn(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines[name] = tl;
            }

            var FONTS = { geist: "Geist, system-ui, sans-serif", poppins: "Poppins, system-ui, sans-serif", playfair: '"Playfair Display", Georgia, serif', grotesk: '"Space Grotesk", system-ui, sans-serif' };
            var fontKey = pick(vars.font, ["geist", "poppins", "playfair", "grotesk"], "geist");
            root.style.fontFamily = FONTS[fontKey];
            var ARRIVE = bez(0.33, 1, 0.68, 1), ENTER = bez(0.16, 1, 0.3, 1);
            function EXIT(t) { return t * t * t; }
            // Enter/exit contract of remotion-ui's motion primitives: light leads the move (opacity done 55 % in), an exit is shorter and accelerates away.
            function enterExit(frame, o) {
              var et = clamp01((frame - o.delay) / o.duration);
              var motion = ARRIVE(et), opacity = ENTER(clamp01(et / 0.55));
              if (!o.exit) return { motion: motion, opacity: opacity, exiting: false, exitProgress: 0 };
              var exitFrames = Math.max(6, Math.round(o.duration * 0.7));
              var exitStart = Math.max(TOTAL * 30 - exitFrames, o.delay + o.duration);
              var xt = clamp01((frame - exitStart) / exitFrames), xp = EXIT(xt);
              var exiting = frame >= exitStart;
              return { motion: exiting ? 1 - xp : motion, opacity: opacity * EXIT(1 - clamp01(xt / 0.7)), exiting: exiting, exitProgress: xp };
            }

            var text = str(vars.text, "Swing into place.");
            var el = document.getElementById("rti-text");
            el.textContent = text;
            el.setAttribute("aria-label", text);
            el.style.fontSize = num(vars.font_size, 84, 24, 260) + "px";
            el.style.fontWeight = String(num(vars.font_weight, 700, 100, 900));
            el.style.color = str(vars.color, "#f4f4f5");
            var degrees = num(vars.degrees, -12, -180, 180), axis = pick(vars.axis, ["z", "x", "y"], "z"), persp = num(vars.perspective, 1200, 200, 4000);
            var scaleFrom = num(vars.scale_from, 0.96, 0.2, 1.5);
            var o = { duration: num(vars.duration_frames, 30, 4, 120), delay: num(vars.delay_frames, 6, 0, 120), exit: bool(vars.exit, true) };
            el.style.transformOrigin = pick(vars.origin, ["center", "top", "bottom", "left", "right", "top left", "top right", "bottom left", "bottom right"], "center");
            function draw(frame) {
              var s = enterExit(frame, o);
              var rot = degrees * (1 - s.motion), sc = Math.pow(scaleFrom, 1 - s.motion);
              el.style.opacity = String(s.opacity);
              el.style.transform = axis === "z" ? "rotate(" + rot.toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")"
                : "perspective(" + persp + "px) rotate" + axis.toUpperCase() + "(" + rot.toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")";
            }
            drive("rotate-in", draw);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
