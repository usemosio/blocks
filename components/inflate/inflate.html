<!doctype html>
<!--
  Inflate

  A flat sliver puffs up like a balloon toy, squashes and settles into a glossy mark, then the wordmark slides out. The mark is a fixed rounded square with a dot; the wordmark is the text variable.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:

<html
  lang="en"
  data-composition-id="inflate"
  data-composition-duration="2.2"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Wordmark that slides out beside the mark. Leave empty for the mark alone.", "default": "studio"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Stage color.", "default": "#111111"},
    {"id": "color", "type": "color", "role": "style", "label": "Body", "description": "Body color of the mark.", "default": "#E5322D"},
    {"id": "highlight", "type": "color", "role": "style", "label": "Highlight", "description": "Specular highlight color.", "default": "#FFFFFF"},
    {"id": "dot_color", "type": "color", "role": "style", "label": "Dot", "description": "Dot inside the mark.", "default": "#111111"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Inflate</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--bg); }
        .in-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .in-row { display: flex; align-items: center; }
        .in-box { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .in-body { position: relative; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--color); }
        .in-gloss { position: absolute; left: 14%; top: 10%; width: 46%; height: 28%; border-radius: 50%; transform: rotate(-18deg); }
        .in-dot { border-radius: 50%; background: var(--dotc); }
        .in-word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.04em; color: var(--text); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="inflate" data-duration="2.2" data-fps="30">
        <div id="in-clip" class="in-stage clip" data-start="0" data-duration="2.2" data-track-index="0">
          <div class="in-row" id="in-row">
            <div class="in-box" id="in-box">
              <div class="in-body" id="in-body"><div class="in-gloss" id="in-gloss"></div><div class="in-dot" id="in-dot"></div></div>
            </div>
            <span class="in-word" id="in-word"></span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "inflate";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var row = document.getElementById("in-row"), box = document.getElementById("in-box"), body = document.getElementById("in-body"), gloss = document.getElementById("in-gloss"), dotEl = document.getElementById("in-dot"), word = document.getElementById("in-word");
var bg = col(vars.background_color, "#111111"), color = col(vars.color, "#E5322D"), hl = col(vars.highlight, "#FFFFFF"), dotC = col(vars.dot_color, "#111111"), speed = num(vars.speed, 1, 0, 4);
var wordText = typeof vars.text === "string" ? vars.text : "studio";
root.style.setProperty("--bg", bg); root.style.setProperty("--color", color); root.style.setProperty("--dotc", dotC); root.style.setProperty("--text", "#ffffff");
var W = root.clientWidth, H = root.clientHeight;
var size = Math.round(Math.min(W, H) * 0.22);
box.style.width = box.style.height = size + "px";
row.style.gap = size * 0.24 + "px";
dotEl.style.width = dotEl.style.height = size * 0.3 + "px";
gloss.style.background = "radial-gradient(ellipse at 45% 40%, " + hl + " 0%, transparent 70%)";
word.textContent = wordText; word.style.fontSize = size * 0.5 + "px";
if (!wordText) word.style.display = "none";
var rowW = row.offsetWidth;
var PUFF = 3, WOBBLE = 10, DOT = 15, SLIDE = 22;
function draw(frame) {
  var t = frame * speed;
  var puff = spring(t - PUFF, { damping: 8, stiffness: 150, mass: 0.6 });
  var w0 = t - WOBBLE;
  var wobble = w0 > 0 ? 0.2 * Math.exp(-w0 / 6) * Math.sin((w0 / 9) * Math.PI * 2) : 0;
  var grow = Math.max(0, puff);
  var sliverW = interp(t, [0, PUFF], [0.7, 1], outQuad);
  var bodyH = size * (0.05 + 0.95 * grow) * (1 - wobble);
  var bodyW = size * (sliverW + (Math.max(1, grow) - 1) * 0.8) * (1 + wobble);
  var roundness = interp(t, [PUFF, PUFF + 7, 26], [0.5, 0.46, 0.27], inOutQuad);
  var gl = interp(t, [PUFF + 2, PUFF + 9], [0, 1]);
  var dot = spring(t - DOT, { damping: 10, stiffness: 220, mass: 0.5 });
  var slide = interp(t, [SLIDE, SLIDE + 11], [0, 1], inOutCubic);
  var reveal = interp(t, [SLIDE + 2, SLIDE + 13], [0, 1], outCubic);
  body.style.width = bodyW + "px"; body.style.height = bodyH + "px";
  body.style.borderRadius = Math.min(bodyW, bodyH) * roundness + "px";
  body.style.opacity = interp(t, [0, 2], [0, 1]);
  body.style.boxShadow = "inset " + -size * 0.06 + "px " + -size * 0.08 + "px " + size * 0.14 + "px rgba(0,0,0," + 0.28 * gl + ")";
  gloss.style.opacity = 0.55 * gl;
  dotEl.style.transform = "scale(" + dot + ")";
  if (wordText) {
    row.style.transform = "translateX(" + (rowW / 2 - size / 2) * (1 - slide) + "px)";
    word.style.opacity = reveal;
    word.style.clipPath = "inset(-30% " + (1 - reveal) * 100 + "% -30% -5%)";
    word.style.transform = "translateX(" + (1 - reveal) * -size * 0.3 + "px)";
  }
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
