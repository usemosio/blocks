<!doctype html>
<!--
  Word Roller Outline Highlight

  The same word stacked seven times as an outline; a solid, slightly larger copy travels down the stack, slow, then fast, then easing, and settles on the last row with a spring.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/lifeprompt-team/remotion-scenes/blob/02c7a84241da7010b5f59c420b0110aafd1d6f0d/src/scenes/RollerAnimations/RollerOutlineHighlight.tsx

  Changes by usemosio/blocks: the outline strokes are 60 % of the highlight colour instead of 30 % so the stack stays visible on video.

<html
  lang="en"
  data-composition-id="word-roller-outline-highlight"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "word", "type": "string", "role": "content", "label": "Word", "description": "The word repeated down the stack.", "default": "Introducing"},
    {"id": "rows", "type": "number", "role": "style", "label": "Rows", "description": "How many copies are stacked.", "default": 7, "min": 3, "max": 9, "step": 1},
    {"id": "font_size", "type": "number", "role": "style", "label": "Font size", "description": "Size of the word in pixels. The stack shrinks to fit the frame.", "default": 90, "min": 20, "max": 300, "step": 1, "unit": "px"},
    {"id": "color", "type": "color", "role": "style", "label": "Highlight color", "description": "Color of the solid copy and the outlines.", "default": "#fafafa"},
    {"id": "background", "type": "color", "role": "style", "label": "Background", "description": "Fill behind the text. Use transparent to lay the block over your own footage.", "default": "#0a0a0a"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 4, "step": 0.05, "unit": "x"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Word Roller Outline Highlight</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=block"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: var(--font-display, Geist, system-ui, -apple-system, sans-serif);
          pointer-events: none;
        }
        .wol-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        #root { color: var(--c, #fafafa); }
        .wol-g { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .wol-row { height: 1.333em; display: flex; align-items: center; justify-content: center; font-weight: 800; white-space: pre; }

      </style>

      <div id="root" data-composition-id="word-roller-outline-highlight" data-duration="4" data-fps="30">
        <div id="wol-clip" class="wol-stage clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="wol-g" class="wol-g"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function el(id) { return document.getElementById(id); }
            function num(value, fallback, min, max) {
              var n = Number(value);
              return value !== "" && value !== null && value !== undefined && Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value.trim() ? value : fallback;
            }
            function txt(value, fallback) {
              return typeof value === "string" ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function list(value, fallback, max) {
              var a = (typeof value === "string" ? value : "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
              if (!a.length) a = fallback.slice();
              return a.slice(0, max || 12);
            }
            function bezier(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                var lo = 0, hi = 1, t = x;
                for (var i = 0; i < 32; i++) {
                  var u = 1 - t;
                  var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                  t = (lo + hi) / 2;
                }
                var v = 1 - t;
                return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
              };
            }
            var E = {
              out: bezier(0.16, 1, 0.3, 1), "in": bezier(0.7, 0, 0.84, 0), inOut: bezier(0.87, 0, 0.13, 1),
              overshoot: bezier(0.34, 1.56, 0.64, 1), smooth: bezier(0.4, 0, 0.2, 1),
              quadIn: function (x) { return x * x; },
              quadOut: function (x) { return 1 - (1 - x) * (1 - x); },
              cubicOut: function (x) { return 1 - Math.pow(1 - x, 3); },
              cubicInOut: function (x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
            };
            function clamp01(p) { return Math.min(1, Math.max(0, p)); }
            // Remotion interpolate with clamped ends, one input range and one output range.
            function ip(x, a, b, from, to, ease) {
              var p = b === a ? (x >= b ? 1 : 0) : clamp01((x - a) / (b - a));
              return from + (to - from) * (ease ? ease(p) : p);
            }
            // Damped spring from 0 towards 1 (mass, stiffness, damping), frame at 30 fps, in closed form.
            function spring(frame, cfg) {
              if (frame <= 0) return 0;
              var t = frame / 30, m = cfg.mass || 1, k = cfg.stiffness === undefined ? 100 : cfg.stiffness, c = cfg.damping === undefined ? 10 : cfg.damping;
              var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
              if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              if (z < 1) {
                var wd = w0 * Math.sqrt(1 - z * z);
                return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
              }
              var q = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + q, r2 = -z * w0 - q;
              return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
            }
            // Seeded generator (mulberry32).
            function rng(seed) {
              var a = seed >>> 0;
              return function () {
                a = (a + 0x6d2b79f5) >>> 0;
                var t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function onFonts(fn) {
              if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn, function () {});
            }
            // Sets the group's font size, then shrinks it so the group (or its probe) fits the frame.
            function fitG(g, size, probe, wf, hf, wmul) {
              g.style.fontSize = size + "px";
              var p = probe || g;
              var w = Math.max(1, p.offsetWidth * (wmul || 1)), h = Math.max(1, p.offsetHeight);
              var k = Math.min(1, root.clientWidth * (wf || 0.9) / w, root.clientHeight * (hf || 0.9) / h);
              if (k < 1) { size = Math.max(6, size * k); g.style.fontSize = size + "px"; }
              return size;
            }
            function fillSizer(sizer, words) {
              sizer.textContent = "";
              words.forEach(function (w) {
                var s = document.createElement("span");
                s.textContent = w;
                sizer.appendChild(s);
              });
            }
            function setText(node, value) {
              if (node.__t !== value) { node.__t = value; node.textContent = value; }
            }
            var speed = num(vars.speed, 1, 0.25, 4);
            var TOTAL = parseFloat(root.dataset.duration || "4");
            var clock = { frame: 0 };
            function start(draw) {
              var tl = gsap.timeline({ paused: true });
              tl.to(clock, { frame: Math.round(TOTAL * 30), duration: TOTAL, ease: "none", onUpdate: function () { draw(Math.round(clock.frame * speed * 1000) / 1000); } }, 0);
              draw(0);
              tl.seek(0);
              window.__timelines = window.__timelines || {};
              window.__timelines["word-roller-outline-highlight"] = tl;
            }

            root.style.background = str(vars.background, "#0a0a0a");
            
            var word = str(vars.word, "Introducing");
            var rows = Math.round(num(vars.rows, 7, 3, 9));
            var g = el("wol-g");
            var color = str(vars.color, "#fafafa");
            root.style.setProperty("--c", color);
            var els = [];
            for (var i = 0; i < rows; i++) {
              var d = document.createElement("div");
              d.className = "wol-row";
              d.textContent = word;
              g.appendChild(d);
              els.push(d);
            }
            var base = num(vars.font_size, 90, 20, 300);
            function fit() { fitG(g, base, null, 0.88, 0.88, 1.05); }
            fit();
            onFonts(fit);

            // remocn-scenes: the highlight position runs 0 to rows-1 over 90 frames on a cubic in-out ease,
            // and a spring takes over for the last 15 frames.
            function draw(f) {
              var D = 90;
              var hp = E.cubicInOut(clamp01(f / D)) * (rows - 1);
              var stopping = f >= D - 15;
              var sp = stopping ? spring(f - (D - 15), { damping: 15, stiffness: 200 }) : 0;
              var pos = stopping ? hp + (rows - 1 - hp) * sp : hp;
              els.forEach(function (d, i) {
                var dist = Math.abs(i - pos);
                var on = dist < 0.5;
                var op = on ? 1 : Math.max(0.28, 0.6 - dist * 0.08);
                var sc = on ? 1 + 0.05 * (1 - dist * 2) : 1 - dist * 0.02;
                d.style.transform = "scale(" + Math.max(0.8, sc) + ")";
                d.style.color = on ? color : "transparent";
                d.style.webkitTextStroke = on ? "0" : "0.014em color-mix(in srgb, " + color + " 60%, transparent)";
                d.style.opacity = op;
              });
            }
            start(draw);

          })();
        </script>
      </div>
    </template>
  </body>
</html>
