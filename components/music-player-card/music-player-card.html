<!doctype html>
<!--
  Music Player Card

  A frosted-glass now-playing card with a large gradient cover, track name, artist and a now-playing line rises in, staggers its text, breathes, and floats away.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/spotify-card/spotify-card.html

  Copyright HeyGen, Inc. and the Hyperframes contributors. Licensed under the Apache License, Version
  2.0 (the "License"); you may not use this file except in compliance with the License. You may obtain
  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a block that showed a real product's interface (a real music streaming service's name, logo and signature green on screen): it is now a generic music player card with a variable cover gradient and a 'now playing' line with a small equaliser icon instead of the service's logo; fills the host frame (the card is sized from container units, so it fits portrait and landscape frames); track, artist, line and colours are variables.
-->
<html
  lang="en"
  data-composition-id="music-player-card"
  data-composition-duration="5"
  data-composition-variables='[
    {
      "id": "track",
      "type": "string",
      "role": "content",
      "label": "Track name",
      "description": "Large first line.",
      "default": "Golden Hour"
    },
    {
      "id": "artist",
      "type": "string",
      "role": "content",
      "label": "Artist",
      "description": "Line under the track name.",
      "default": "The Placeholders"
    },
    {
      "id": "label",
      "type": "string",
      "role": "content",
      "label": "Now-playing line",
      "description": "Small line at the bottom, next to the equaliser icon.",
      "default": "Now playing"
    },
    {
      "id": "art_from",
      "type": "color",
      "role": "style",
      "label": "Cover colour start",
      "description": "Start of the cover gradient.",
      "default": "#2563eb"
    },
    {
      "id": "art_via",
      "type": "color",
      "role": "style",
      "label": "Cover colour middle",
      "description": "Middle of the cover gradient.",
      "default": "#1d4ed8"
    },
    {
      "id": "art_to",
      "type": "color",
      "role": "style",
      "label": "Cover colour end",
      "description": "End of the cover gradient.",
      "default": "#1e3a8a"
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Music Player Card</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=block" />
      <style>
        #root { --u: min(0.1128cqw, 0.0808cqh); position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; font-family: Inter, system-ui, sans-serif; }
        .mp-card {
          position: absolute; inset: 0; margin: auto; height: fit-content; width: calc(780 * var(--u));
          background: linear-gradient(165deg, rgba(140, 155, 170, 0.42) 0%, rgba(100, 115, 130, 0.35) 30%, rgba(75, 88, 105, 0.38) 60%, rgba(60, 72, 88, 0.44) 100%);
          border-radius: calc(28 * var(--u)); padding: calc(36 * var(--u)); border: calc(1 * var(--u)) solid rgba(255, 255, 255, 0.22);
          box-shadow: 0 calc(24 * var(--u)) calc(48 * var(--u)) rgba(0, 0, 0, 0.3), 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.12), inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, 0.32), inset 0 calc(-1 * var(--u)) 0 rgba(0, 0, 0, 0.12);
          backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
          overflow: hidden; opacity: 0;
        }
        .mp-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 55%; background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.07) 35%, transparent 100%); border-radius: calc(28 * var(--u)) calc(28 * var(--u)) 0 0; pointer-events: none; }
        .mp-art { position: relative; z-index: 1; width: calc(708 * var(--u)); height: calc(708 * var(--u)); border-radius: calc(16 * var(--u)); overflow: hidden; margin-bottom: calc(36 * var(--u)); background: linear-gradient(145deg, var(--a1, #2563eb) 0%, var(--a2, #1d4ed8) 45%, var(--a3, #1e3a8a) 100%); }
        .mp-art svg { position: absolute; top: 50%; left: 50%; width: calc(200 * var(--u)); height: calc(200 * var(--u)); margin: calc(-100 * var(--u)) 0 0 calc(-100 * var(--u)); opacity: 0.22; }
        .mp-info { position: relative; z-index: 1; margin-bottom: calc(28 * var(--u)); padding: 0 calc(8 * var(--u)); }
        .mp-track { font-size: calc(52 * var(--u)); font-weight: 700; color: #fff; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: calc(8 * var(--u)); }
        .mp-artist { font-size: calc(34 * var(--u)); color: rgba(255, 255, 255, 0.7); line-height: 1.3; }
        .mp-brand { position: relative; z-index: 1; display: flex; align-items: center; gap: calc(12 * var(--u)); padding: 0 calc(8 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 600; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.01em; }
        .mp-brand svg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); }
      </style>

      <div id="root" data-composition-id="music-player-card" data-duration="5" data-fps="30">
        <div id="mp-card" class="mp-card clip" data-start="0" data-duration="5" data-track-index="0">
          <div class="mp-art" id="mp-art"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#fff" stroke-width="1"/><circle cx="18" cy="16" r="3" stroke="#fff" stroke-width="1"/></svg></div>
          <div class="mp-info"><div class="mp-track" id="mp-track"></div><div class="mp-artist" id="mp-artist"></div></div>
          <div class="mp-brand" id="mp-brand"><svg viewBox="0 0 32 32" fill="rgba(255,255,255,0.55)"><rect x="3" y="14" width="5" height="14" rx="2.5"/><rect x="11" y="6" width="5" height="22" rx="2.5"/><rect x="19" y="11" width="5" height="17" rx="2.5"/><rect x="27" y="17" width="4" height="11" rx="2"/></svg><span id="mp-label"></span></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
          "use strict";
          var root = document.getElementById("root");
          var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
          function txt(v, f) { return typeof v === "string" && v.trim() ? v : f; }
          function hex(c, f) { c = String(c || "").trim().replace("#", ""); if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2]; return /^[0-9a-fA-F]{6}$/.test(c) ? "#" + c : f; }
          function $(id) { return document.getElementById(id); }
          function finish(tl, name) {
            var total = parseFloat(root.dataset.duration || "5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines[name] = tl;
          }
          $("mp-track").textContent = txt(vars.track, "Golden Hour");
          $("mp-artist").textContent = txt(vars.artist, "The Placeholders");
          $("mp-label").textContent = txt(vars.label, "Now playing");
          root.style.setProperty("--a1", hex(vars.art_from, "#2563eb"));
          root.style.setProperty("--a2", hex(vars.art_via, "#1d4ed8"));
          root.style.setProperty("--a3", hex(vars.art_to, "#1e3a8a"));
          var tl = gsap.timeline({ paused: true });
          gsap.set("#mp-card", { y: 60, opacity: 0, scale: 0.94 });
          gsap.set("#mp-track", { y: 20, opacity: 0 });
          gsap.set("#mp-artist", { y: 16, opacity: 0 });
          gsap.set("#mp-brand", { y: 12, opacity: 0 });
          tl.to("#mp-card", { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.1);
          tl.to("#mp-track", { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.55);
          tl.to("#mp-artist", { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.7);
          tl.to("#mp-brand", { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.85);
          tl.to("#mp-art", { scale: 1.015, duration: 1.5, ease: "power1.inOut", yoyo: true, repeat: 1 }, 1.2);
          tl.to("#mp-card", { y: -40, opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 4.2);
          finish(tl, "music-player-card");
          })();
        </script>
      </div>
    </template>
  </body>
</html>
