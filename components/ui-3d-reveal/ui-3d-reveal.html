  3D UI Reveal

  A logo mark draws on, then a design-tool window flies in, pushes in, tilts into 3D and flies away; the logo rebuilds with a tagline and a link pill.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/ui-3d-reveal/ui-3d-reveal.html

  a copy of the License at http://www.apache.org/licenses/LICENSE-2.0. Unless required by applicable
  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Changes by usemosio/blocks: adapted from a block that showed a real design tool and a real video product on screen: the window is now a generic design editor (toolbar, layers, canvas with a small sample app, properties) drawn in HTML and CSS with no images, the logo is a generic four-shape mark with colours as variables, and the tagline, link pill and all on-screen labels are variables; fills the host frame (the 1920x1080 scene is scaled to fit, by height in landscape and by width in portrait, with the dark background filling the rest); the intro, flat reveal, camera push, 3D tilt, fly-away and outro keep upstream's timings.
-->
