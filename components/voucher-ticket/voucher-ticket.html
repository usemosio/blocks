<!doctype html>
<!--
  Voucher Ticket

  A discount ticket with notched, perforated edges slides in, the headline ("DISKON 20%") lands, and the stub tears off while its code reveals with a short scramble. Horizontal in landscape, stacked in portrait. Headline, code, note and shop are variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="voucher-ticket"
  data-composition-duration="5.5"
  data-composition-variables='[
  {
    "id": "shop",
    "type": "string",
    "role": "content",
    "label": "Shop name",
    "description": "Small line at the top of the ticket.",
    "default": "Kopi Senja"
  },
  {
    "id": "headline",
    "type": "string",
    "role": "content",
    "label": "Headline",
    "description": "Big offer text, kept on one line.",
    "default": "DISKON 20%"
  },
  {
    "id": "note",
    "type": "string",
    "role": "content",
    "label": "Note",
    "description": "Conditions under the headline. Leave empty to hide it.",
    "default": "Min. belanja Rp50.000 · s/d 30 Nov"
  },
  {
    "id": "code_label",
    "type": "string",
    "role": "content",
    "label": "Code label",
    "description": "Small label above the code on the stub.",
    "default": "Kode voucher"
  },
  {
    "id": "code",
    "type": "string",
    "role": "content",
    "label": "Code",
    "description": "The code that scrambles into place. Letters and digits, up to 12 characters.",
    "default": "SENJA20"
  },
  {
    "id": "tear_at",
    "type": "number",
    "role": "motion",
    "label": "Tear time",
    "description": "Second the stub tears off.",
    "default": 1.9,
    "min": 1,
    "max": 3.5,
    "step": 0.1
  },
  {
    "id": "ticket_color",
    "type": "color",
    "role": "style",
    "label": "Ticket colour",
    "description": "Main part of the ticket.",
    "default": "#f4f4f5"
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background.",
    "default": "#ffffff"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Main text and outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Secondary text and hairlines.",
    "default": "#737373"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Accent",
    "description": "The headline: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Font family name. Geist is loaded by default; another family must be loaded by the host.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Voucher Ticket</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          color: var(--vt-text); font-family: var(--FAM, Geist), system-ui, sans-serif; background: var(--vt-bg);
        }
        #root * { box-sizing: border-box; }
        .vt-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .vt-wrap { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
        .vt-piece { position: absolute; filter: drop-shadow(0 calc(var(--u) * 8) calc(var(--u) * 16) rgba(0,0,0,0.13)); }
        .vt-piece svg { position: absolute; left: 0; top: 0; overflow: visible; }
        .vt-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--u) * 50); }
        .vt-shop { font-size: calc(var(--u) * 36); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--vt-muted); margin-bottom: calc(var(--u) * 22); }
        .vt-head { white-space: nowrap; font-size: calc(var(--u) * 150); font-weight: 700; letter-spacing: -0.05em; line-height: 1; color: var(--vt-main); }
        .vt-note { margin-top: calc(var(--u) * 28); font-size: calc(var(--u) * 33); font-weight: 500; color: var(--vt-muted); white-space: nowrap; }
        .vt-clabel { font-size: calc(var(--u) * 28); font-weight: 500; color: rgba(255,255,255,0.62); letter-spacing: 0.06em; margin-bottom: calc(var(--u) * 18); }
        .vt-code { font-family: "Geist Mono", ui-monospace, monospace; font-size: calc(var(--u) * 68); font-weight: 700; letter-spacing: 0.08em; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }

      </style>

      <div id="root" data-composition-id="voucher-ticket" data-duration="5.5" data-fps="30">
        <div id="vt-clip" class="vt-stage clip" data-start="0" data-duration="5.5" data-track-index="0">

          <div class="vt-wrap" id="vt-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function svg(tag, attrs, parent) { var e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function rp(n) { return "Rp" + dots(n); }
            function money(s) { var d = String(s).replace(/[^\d]/g, ""); return d ? parseInt(d, 10) : 0; }
            function list(s, d) { var a = String(str(s, d)).split(";").map(function (x) { return x.trim(); }).filter(Boolean); return a.length ? a : String(d).split(";").map(function (x) { return x.trim(); }); }
            function mulberry(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
            function setColors(p, c) { for (var k in c) root.style.setProperty("--" + p + "-" + k, colr(vars[k + "_color"], c[k])); }
            var fam = str(vars.font_family, "Geist");
            root.style.setProperty("--FAM", /^[\w\s-]+$/.test(fam) ? '"' + fam + '"' : "Geist");
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            if (bool(vars.transparent, false)) root.style.background = "transparent";

            setColors("vt", { bg: "#ffffff", text: "#0a0a0a", muted: "#737373", main: "#2563eb", ticket: "#f4f4f5" });


            root.style.setProperty("--vt-ticket", colr(vars.ticket_color, "#f4f4f5"));
            var u = U, wrap = document.getElementById("vt-wrap");
            var shop = str(vars.shop, "Kopi Senja");
            var headline = str(vars.headline, "DISKON 20%");
            var note = typeof vars.note === "string" ? vars.note.trim() : "Min. belanja Rp50.000 · s/d 30 Nov";
            var codeLabel = typeof vars.code_label === "string" ? vars.code_label.trim() : "Kode voucher";
            var code = (str(vars.code, "SENJA20").replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "SENJA20").slice(0, 12);
            var tear = num(vars.tear_at, 1.9, 1, 3.5);
            var cBg = colr(vars.bg_color, "#ffffff"), cText = colr(vars.text_color, "#0a0a0a"), cTicket = colr(vars.ticket_color, "#f4f4f5");
            var R = 40 * u, N = 36 * u;
            function path(w, h, c) {
              var r = function (k) { return c[k] === "n" ? N : R; }, s = function (k) { return c[k] === "n" ? 0 : 1; };
              return "M" + r("tl") + " 0 H" + (w - r("tr")) + " A" + r("tr") + " " + r("tr") + " 0 0 " + s("tr") + " " + w + " " + r("tr") +
                " V" + (h - r("br")) + " A" + r("br") + " " + r("br") + " 0 0 " + s("br") + " " + (w - r("br")) + " " + h +
                " H" + r("bl") + " A" + r("bl") + " " + r("bl") + " 0 0 " + s("bl") + " 0 " + (h - r("bl")) +
                " V" + r("tl") + " A" + r("tl") + " " + r("tl") + " 0 0 " + s("tl") + " " + r("tl") + " 0 Z";
            }
            var mw, mh, sw, sh, sx, sy, gw, gh, mc, sc;
            if (PORTRAIT) { mw = 880 * u; mh = 520 * u; sw = mw; sh = 230 * u; sx = 0; sy = mh; gw = mw; gh = mh + sh; mc = { tl: "r", tr: "r", br: "n", bl: "n" }; sc = { tl: "n", tr: "n", br: "r", bl: "r" }; }
            else { mw = 1020 * u; mh = 470 * u; sw = 400 * u; sh = mh; sx = mw; sy = 0; gw = mw + sw; gh = mh; mc = { tl: "r", tr: "n", br: "n", bl: "r" }; sc = { tl: "n", tr: "r", br: "r", bl: "n" }; }
            wrap.style.width = gw + "px"; wrap.style.height = gh + "px";
            var S = Math.min(1.5, (H * 0.8) / gh, (W * 0.9) / (gw + 70 * u));
            gsap.set(wrap, { xPercent: -50, yPercent: -50, scale: S });
            function piece(x, y, w, h, c, fill) {
              var p = el("div", "vt-piece", wrap); p.style.left = x + "px"; p.style.top = y + "px"; p.style.width = w + "px"; p.style.height = h + "px";
              var sv = svg("svg", { width: w, height: h, viewBox: "0 0 " + w + " " + h }, p);
              svg("path", { d: path(w, h, c), fill: fill }, sv);
              return { p: p, sv: sv };
            }
            var main = piece(0, 0, mw, mh, mc, cTicket);
            var stub = piece(sx, sy, sw, sh, sc, cText);
            // Perforation: a dashed line in the page colour on the stub's joining edge.
            var perf = PORTRAIT ? { x1: N + 8 * u, y1: 0, x2: sw - N - 8 * u, y2: 0 } : { x1: 0, y1: N + 8 * u, x2: 0, y2: sh - N - 8 * u };
            svg("line", { x1: perf.x1, y1: perf.y1, x2: perf.x2, y2: perf.y2, stroke: cBg, "stroke-width": 4 * u, "stroke-dasharray": 10 * u + " " + 12 * u, "stroke-linecap": "round" }, stub.sv);
            var mi = el("div", "vt-in", main.p);
            var shopEl = el("div", "vt-shop", mi); shopEl.textContent = shop;
            var headEl = el("div", "vt-head", mi); headEl.textContent = headline;
            var noteEl = el("div", "vt-note", mi); noteEl.textContent = note; if (!note) noteEl.style.display = "none";
            var si = el("div", "vt-in", stub.p);
            var clEl = el("div", "vt-clabel", si); clEl.textContent = codeLabel; if (!codeLabel) clEl.style.display = "none";
            var codeEl = el("div", "vt-code", si);
            if (PORTRAIT) { headEl.style.fontSize = 132 * u + "px"; codeEl.style.fontSize = 84 * u + "px"; }
            // Fit the headline and note inside the main part.
            var avail = mw - 110 * u;
            [headEl, noteEl].forEach(function (e) { if (e.offsetWidth > avail) { e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * avail / e.offsetWidth + "px"; } });

            var POOL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            function scrambled(p) {
              var out = "", step = Math.floor(p * 26);
              for (var i = 0; i < code.length; i++) {
                var done = p >= 1 || p > 0.18 + 0.82 * (i + 1) / code.length;
                if (done) out += code.charAt(i); else out += POOL.charAt(Math.floor(mulberry(i * 977 + step * 131 + 5)() * POOL.length));
              }
              return out;
            }
            codeEl.textContent = code;
            var sc2 = { p: 0 };

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(wrap, { x: W * 0.7 + gw * S * 0.5, rotation: 4 }, { x: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 0.1);
            tl.fromTo(headEl, { scale: 1.4, opacity: 0, y: 14 * u }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, 0.75);
            tl.fromTo([shopEl, noteEl], { opacity: 0, y: 20 * u }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.85);
            // Tear: a small pull back, then the stub falls away.
            var tx = PORTRAIT ? 0 : 26 * u, ty = PORTRAIT ? 34 * u : 30 * u, rot = PORTRAIT ? -3 : 6;
            stub.p.style.transformOrigin = PORTRAIT ? "0% 0%" : "0% 0%";
            tl.fromTo(stub.p, { x: 0, y: 0, rotation: 0 }, { x: PORTRAIT ? 0 : -8 * u, y: PORTRAIT ? -8 * u : 0, duration: 0.14, ease: "power2.out" }, tear - 0.14);
            tl.to(stub.p, { x: tx, y: ty, rotation: rot, duration: 0.5, ease: "back.out(1.6)" }, tear);
            tl.fromTo([clEl, codeEl], { opacity: 0 }, { opacity: 1, duration: 0.1 }, tear + 0.1);
            tl.fromTo(sc2, { p: 0 }, { p: 1, duration: 0.85, ease: "none", onUpdate: function () { codeEl.textContent = scrambled(sc2.p); } }, tear + 0.15);
            tl.fromTo(codeEl, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out" }, tear + 1.0);
            tl.to(codeEl, { scale: 1, duration: 0.25, ease: "power2.out" }, tear + 1.12);
            tl.fromTo(clEl, { opacity: 0 }, { opacity: 1, duration: 0.01 }, tear - 0.2);
            tl.fromTo([clEl, codeEl], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

            var total = parseFloat(root.dataset.duration || "5.5");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["voucher-ticket"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
