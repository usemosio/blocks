<!doctype html>
<!--
  Infinite Zoom Words

  The camera zooms through nested frames. Each frame holds one word of a phrase and a smaller frame with the next word inside it; the zoom steps in word by word and ends on the last frame, which holds the final word and a lockup line. Words and lockup come from variables.

  An original usemosio/blocks block (MIT, see LICENSE).
-->
<html
  lang="en"
  data-composition-id="infinite-zoom-words"
  data-composition-duration="6"
  data-composition-variables='[
  {
    "id": "words",
    "type": "string",
    "role": "content",
    "label": "Words",
    "description": "The phrase: words separated by | or new lines (a single line without | splits on spaces). 2 to 6 words; the last one is the final lockup frame.",
    "default": "Dari|biji|ke|gelasmu"
  },
  {
    "id": "lockup",
    "type": "string",
    "role": "content",
    "label": "Lockup line",
    "description": "Small line under the last word, e.g. the shop name. Empty hides it.",
    "default": "Kopi Senja · Jl. Melati 12"
  },
  {
    "id": "ratio",
    "type": "number",
    "role": "style",
    "label": "Frame ratio",
    "description": "Size of each nested frame relative to the one around it (smaller zooms deeper per step).",
    "default": 0.36,
    "min": 0.25,
    "max": 0.6,
    "step": 0.01
  },
  {
    "id": "bg_color",
    "type": "color",
    "role": "style",
    "label": "Background",
    "description": "Background and every other frame.",
    "default": "#ffffff"
  },
  {
    "id": "main_color",
    "type": "color",
    "role": "style",
    "label": "Main colour",
    "description": "The final word: the one accent.",
    "default": "#2563eb"
  },
  {
    "id": "text_color",
    "type": "color",
    "role": "style",
    "label": "Text colour",
    "description": "Words and frame outlines.",
    "default": "#0a0a0a"
  },
  {
    "id": "muted_color",
    "type": "color",
    "role": "style",
    "label": "Muted colour",
    "description": "Lockup line.",
    "default": "#737373"
  },
  {
    "id": "tint_color",
    "type": "color",
    "role": "style",
    "label": "Frame tint",
    "description": "Fill of every second frame.",
    "default": "#f1f1ef"
  },
  {
    "id": "font_family",
    "type": "string",
    "role": "style",
    "label": "Font",
    "description": "Google Fonts family name; Geist is loaded, others only if the host loads them.",
    "default": "Geist"
  },
  {
    "id": "transparent",
    "type": "boolean",
    "role": "style",
    "label": "Transparent",
    "description": "Leave the background clear so the block sits over your own scene.",
    "default": false
  }
]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Infinite Zoom Words</title>
  </head>
  <body>
    <template>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=block"
      />
      <style>
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none;
          -webkit-font-smoothing: antialiased;
          background: var(--izw-bg); color: var(--izw-text); font-family: var(--izw-font);
        }
        #root * { box-sizing: border-box; }
        .izw-stage { position: absolute; inset: 0; --u: calc(100cqmin / 1080); }

        .izw-frame { position: absolute; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 50%; will-change: transform; }
        .izw-box { position: absolute; inset: 0; border: calc(var(--u) * 6) solid var(--izw-text); border-radius: calc(var(--u) * 40); }
        .izw-word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
        .izw-lock { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; color: var(--izw-muted); white-space: nowrap; }

      </style>

      <div id="root" data-composition-id="infinite-zoom-words" data-duration="6" data-fps="30">
        <div id="izw-clip" class="izw-stage clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="izw-world"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() || {} : {};
            function num(v, d, a, b) { var n = Number(v); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; }
            function str(v, d) { return typeof v === "string" && v.trim() ? v : d; }
            function colr(v, d) { return typeof v === "string" && v.trim() && window.CSS && CSS.supports("color", v.trim()) ? v.trim() : d; }
            function bool(v, d) { return v === true || v === "true" ? true : v === false || v === "false" ? false : d; }
            function el(tag, cls, parent, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
            function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
            function lines(v, d) { var s = typeof v === "string" && v.trim() ? v : d; return s.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean); }
            function dots(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
            function ease(n, a, b) { return Math.min(1, Math.max(0, (n - a) / (b - a))); }
            var W = root.clientWidth || 1080, H = root.clientHeight || 1920, U = Math.min(W, H) / 1080, PORTRAIT = H > W;
            var PAL = [["bg", "bg_color", "#ffffff"], ["main", "main_color", "#2563eb"], ["text", "text_color", "#0a0a0a"], ["muted", "muted_color", "#737373"], ["tint", "tint_color", "#f1f1ef"]];
            PAL.forEach(function (c) { root.style.setProperty("--izw-" + c[0], colr(vars[c[1]], c[2])); });
            root.style.setProperty("--izw-font", '"' + str(vars.font_family, "Geist") + '", Geist, system-ui, sans-serif');
            if (bool(vars.transparent, false)) root.style.background = "transparent";


            var raw = typeof vars.words === "string" && vars.words.trim() ? vars.words : "Dari|biji|ke|gelasmu";
            var words = (/[|\n]/.test(raw) ? raw.split(/[|\n]+/) : raw.split(/\s+/)).map(function (w) { return w.trim(); }).filter(Boolean).slice(0, 6);
            if (words.length < 2) words = ["Dari", "biji", "ke", "gelasmu"];
            var N = words.length, r = num(vars.ratio, 0.36, 0.25, 0.6);
            var lockup = typeof vars.lockup === "string" ? vars.lockup.trim() : "Kopi Senja · Jl. Melati 12";
            var fw = (PORTRAIT ? 860 : 1300) * U, fh = (PORTRAIT ? 1180 : 800) * U, dy = fh * 0.14;
            var world = document.getElementById("izw-world"), frames = [];
            var cy = [0]; for (var k = 0; k < N - 1; k++) cy.push(cy[k] + Math.pow(r, k) * dy);
            words.forEach(function (w, i) {
              var f = el("div", "izw-frame", world); f.style.width = fw + "px"; f.style.height = fh + "px";
              f.style.left = (W - fw) / 2 + "px"; f.style.top = (H - fh) / 2 + "px";
              var box = el("div", "izw-box", f); box.style.background = i % 2 ? "var(--izw-tint)" : "var(--izw-bg)";
              var last = i === N - 1, wd = el("div", "izw-word", f, esc(w));
              var fs = Math.min(fh * (last ? 0.2 : 0.13), fw * 0.84 / Math.max(2, w.length * 0.56));
              wd.style.fontSize = fs + "px"; wd.style.top = (last ? fh * 0.5 - fs * 0.62 : fh * 0.17 - fs * 0.5) + "px";
              if (last) { wd.style.color = "var(--izw-main)"; if (lockup) { var lk = el("div", "izw-lock", f, esc(lockup)); lk.style.fontSize = Math.min(fh * 0.036, fw * 0.8 / (lockup.length * 0.5)) + "px"; lk.style.top = fh * 0.5 + fs * 0.62 + fh * 0.03 + "px"; } }
              frames.push(f);
            });
            var P = { p: 0 };
            function draw() {
              var i0 = Math.min(N - 2, Math.floor(P.p)), fr = P.p - i0, c = cy[i0] + (cy[i0 + 1] - cy[i0]) * fr, S = Math.pow(r, -P.p);
              frames.forEach(function (f, i) {
                var sc = Math.pow(r, i - P.p);
                if (sc > 3.6) { f.style.display = "none"; return; }
                f.style.display = "";
                f.style.transform = "translate(0px," + ((cy[i] - c) * S).toFixed(2) + "px) scale(" + sc.toFixed(5) + ")";
              });
            }
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#izw-world", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
            var t0 = 0.9, tail = 1.7, stepT = (parseFloat(root.dataset.duration || "6") - t0 - tail) / (N - 1), zt = stepT * 0.72;
            for (var s = 0; s < N - 1; s++) tl.to(P, { p: s + 1, duration: zt, ease: "power2.inOut", onUpdate: draw }, t0 + s * stepT + (stepT - zt));
            draw();

            var total = parseFloat(root.dataset.duration || "6");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["infinite-zoom-words"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
