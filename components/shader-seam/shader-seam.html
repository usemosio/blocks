<html
  lang="en"
  data-composition-id="shader-seam"
  data-composition-duration="5.2"
  data-composition-variables='[
    {"id": "softness", "type": "number", "role": "style", "label": "Softness", "description": "Softness of the dissolve edge.", "default": 0.18, "min": 0.02, "max": 0.4, "step": 0.01},
    {"id": "detail", "type": "number", "role": "style", "label": "Detail", "description": "Organic variation mixed into the material's brightness.", "default": 0.65, "min": 0, "max": 1, "step": 0.01},
    {"id": "speed", "type": "number", "role": "motion", "label": "Material speed", "description": "Animation speed of the material itself. 0 keeps it still.", "default": 0, "min": 0, "max": 3, "step": 0.25},
    {"id": "time_offset", "type": "number", "role": "style", "label": "Material start time", "description": "Starting time of the material, in seconds.", "default": 0, "min": 0, "max": 30, "step": 0.5},
    {"id": "a_label", "type": "string", "role": "content", "label": "Scene A label", "description": "Small label on the first scene.", "default": "01 / Current scene"},
    {"id": "a_title", "type": "string", "role": "content", "label": "Scene A title", "description": "Heading of the first scene.", "default": "Let it dissolve."},
    {"id": "a_subtitle", "type": "string", "role": "content", "label": "Scene A line", "description": "Line under the first heading.", "default": "A moment between two scenes."},
    {"id": "b_label", "type": "string", "role": "content", "label": "Scene B label", "description": "Small label on the second scene.", "default": "02 / Next scene"},
    {"id": "b_title", "type": "string", "role": "content", "label": "Scene B title", "description": "Heading of the second scene.", "default": "A new chapter."},
    {"id": "b_subtitle", "type": "string", "role": "content", "label": "Scene B line", "description": "Line under the second heading.", "default": "Same frame. Another perspective."},
    {"id": "resolution", "type": "number", "role": "quality", "label": "Resolution", "description": "Share of the frame size the shader is drawn at, then scaled up. Lower renders faster; the material is drawn once at this size and held.", "default": 0.5, "min": 0.25, "max": 1, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Shader Seam</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          background: var(--ssm-fallback, #14121c);
          pointer-events: none;
        }
        .ssm-stage {
          position: absolute;
          inset: 0;
        }
        .ssm-scene { position: absolute; inset: 0; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
        .ssm-a { background: #14121c; color: #f0ecf5; --ssm-line: #393040; }
        .ssm-b { background: #e9e5ee; color: #25212d; --ssm-line: #b9afc8; visibility: hidden; }
        .ssm-top { position: absolute; left: 5.6cqw; right: 5.6cqw; top: 5.6cqw; display: flex; justify-content: flex-end; font-size: 1.56cqw; opacity: 0.5; }
        .ssm-copy { position: absolute; left: 5.6cqw; right: 5.6cqw; top: 19.6cqw; }
        .ssm-title { font-size: 8.4cqw; letter-spacing: -0.47cqw; line-height: 1.05; font-weight: 600; }
        .ssm-sub { font-size: 1.95cqw; margin-top: 2cqw; opacity: 0.5; }
        .ssm-rings { position: absolute; right: -7.8cqw; bottom: -13.3cqw; width: 43.75cqw; height: 43.75cqw; border: 1px solid var(--ssm-line); border-radius: 50%; }
        .ssm-rings div { position: absolute; inset: 4.5cqw; border: 1px solid var(--ssm-line); border-radius: 50%; }
        .ssm-rings div + div { inset: 9cqw; }

        .ssm-canvas {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
      </style>

      <div id="root" data-composition-id="shader-seam" data-duration="5.2" data-fps="30">
        <div id="ssm-clip" class="ssm-stage clip" data-start="0" data-duration="5.2" data-track-index="0">
          <div id="ssm-scene-a" class="ssm-scene ssm-a">
            <div class="ssm-top"><span id="ssm-a-label"></span></div>
            <div class="ssm-copy"><div class="ssm-title" id="ssm-a-title"></div><div class="ssm-sub" id="ssm-a-sub"></div></div>
            <div class="ssm-rings"><div></div><div></div></div>
          </div>
          <div id="ssm-scene-b" class="ssm-scene ssm-b">
            <div class="ssm-top"><span id="ssm-b-label"></span></div>
            <div class="ssm-copy"><div class="ssm-title" id="ssm-b-title"></div><div class="ssm-sub" id="ssm-b-sub"></div></div>
            <div class="ssm-rings"><div></div><div></div></div>
          </div>
          <canvas id="ssm-canvas" class="ssm-canvas"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var canvas = document.getElementById("ssm-canvas");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function pick(value, allowed, fallback) {
              return allowed.indexOf(value) >= 0 ? value : fallback;
            }
            function parseColor(s) {
              var m = /^#?([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(String(s).trim());
              if (!m) return null;
              var h = m[1];
              if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
              var a = h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1;
              return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255, a];
            }
            function colorList(value, fallback, max) {
              var list = String(typeof value === "string" && value.trim() ? value : fallback)
                .split(",").map(parseColor).filter(Boolean).slice(0, max);
              return list.length ? list : fallback.split(",").map(parseColor).slice(0, max);
            }
            function color(value, fallback) {
              return parseColor(value) || parseColor(fallback);
            }
            function css(c) {
              return "rgba(" + Math.round(c[0] * 255) + "," + Math.round(c[1] * 255) + "," + Math.round(c[2] * 255) + "," + c[3] + ")";
            }
            function mulberry32(seed) {
              return function () {
                seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }
            function colorArray(list, max) {
              var flat = new Float32Array(max * 4);
              list.forEach(function (c, i) { flat.set(c, i * 4); });
              return flat;
            }
            var softness = num(vars.softness, 0.18, 0.02, 0.4);
            var detail = num(vars.detail, 0.65, 0, 1);
            var speed = num(vars.speed, 0, 0, 3);
            var timeOffset = num(vars.time_offset, 0, 0, 30);
            var aLabel = typeof vars.a_label === "string" ? vars.a_label.slice(0, 200) : "01 / Current scene";
            var aTitle = typeof vars.a_title === "string" ? vars.a_title.slice(0, 200) : "Let it dissolve.";
            var aSubtitle = typeof vars.a_subtitle === "string" ? vars.a_subtitle.slice(0, 200) : "A moment between two scenes.";
            var bLabel = typeof vars.b_label === "string" ? vars.b_label.slice(0, 200) : "02 / Next scene";
            var bTitle = typeof vars.b_title === "string" ? vars.b_title.slice(0, 200) : "A new chapter.";
            var bSubtitle = typeof vars.b_subtitle === "string" ? vars.b_subtitle.slice(0, 200) : "Same frame. Another perspective.";
            var resolution = num(vars.resolution, 0.5, 0.25, 1);
            var sceneA = document.getElementById("ssm-scene-a");
            var sceneB = document.getElementById("ssm-scene-b");
            document.getElementById("ssm-a-label").textContent = aLabel;
            document.getElementById("ssm-a-title").textContent = aTitle;
            document.getElementById("ssm-a-sub").textContent = aSubtitle;
            document.getElementById("ssm-b-label").textContent = bLabel;
            document.getElementById("ssm-b-title").textContent = bTitle;
            document.getElementById("ssm-b-sub").textContent = bSubtitle;
            // Without WebGL the block still shows its palette as a plain gradient.
            root.style.setProperty("--ssm-fallback", "#14121c");

            function L(p, name) {
              var m = p.__locs || (p.__locs = {});
              if (!(name in m)) m[name] = gl.getUniformLocation(p, name);
              return m[name];
            }

            var VERTEX = [
              "#version 300 es",
              "void main() {",
              "  vec2 position = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));",
              "  gl_Position = vec4(position * 2.0 - 1.0, 0.0, 1.0);",
              "}"
            ].join("\n");

            var FIELD = [
              "#version 300 es",
              "precision highp float;",
              "",
              "uniform vec2 iResolution;",
              "uniform float iTime;",
              "uniform float uLightMode;",
              "uniform vec3 uDarkBackground;",
              "uniform vec3 uLightBackground;",
              "out vec4 fragColor;",
              "",
              "const float HUE = 0.663466752;",
              "const float HUE_SPREAD = 0.314346701;",
              "const float HUE_TRAVEL = 1.65112376;",
              "const float CHROMA = 0.160295546;",
              "const float LIGHTNESS = 0.537409723;",
              "const float COLOUR_CYCLE = 0.124862425;",
              "const float THETA = 2.12986207;",
              "const float SHEAR = 0.968176901;",
              "const float SHRINK = 0.955401778;",
              "const float LAYERS = 72.0;",
              "const float WARP_FREQ_X = 0.439311415;",
              "const float WARP_FREQ_Y = 2.87923527;",
              "const float WARP_AMP_X = 0.156202048;",
              "const float WARP_AMP_Y = 0.0256033838;",
              "const float ASPECT_X = 2.23183894;",
              "const float ASPECT_Y = 0.15731883;",
              "const float OFFSET_X = 0.375628948;",
              "const float OFFSET_Y = -0.017801486;",
              "const float TILT = 1.63293767;",
              "const float ZOOM = 0.93135649;",
              "const float CENTRE_X = -0.0956316143;",
              "const float CENTRE_Y = -0.520057321;",
              "const float GLOW_SIZE = 0.00201825937;",
              "const float FALLOFF = 0.352821857;",
              "const float VIGNETTE = 0.136085436;",
              "const float FLOW_SPEED = 0.391012281;",
              "const float FLOW_DIRECTION = 1.0;",
              "const float BREATH_RATE = 0.382053256;",
              "const float BREATH_AMOUNT = 0.0873704553;",
              "const float PHASE = 56.3862724;",
              "const float ECHO = 0.0;",
              "const float ECHO_SHIFT = 0.178754866;",
              "const float SOFTNESS = 0.00164903817;",
              "const float LIGHT_SWING = 0.149726808;",
              "",
              "const float TAU = 6.28318530718;",
              "",
              "vec3 oklchToLinear(float L, float C, float h) {",
              "  float a = C * cos(h), b = C * sin(h);",
              "  float l_ = L + 0.3963377774 * a + 0.2158037573 * b;",
              "  float m_ = L - 0.1055613458 * a - 0.0638541728 * b;",
              "  float s_ = L - 0.0894841775 * a - 1.2914855480 * b;",
              "  vec3 lms = vec3(l_, m_, s_);",
              "  lms = lms * lms * lms;",
              "  return mat3(4.0767416621, -1.2684380046, -0.0041960863,",
              "              -3.3077115913, 2.6097574011, -0.7034186147,",
              "              0.2309699292, -0.3413193965, 1.7076147010) * lms;",
              "}",
              "",
              "float blueNoise(vec2 p, float frame) {",
              "  p += 5.588238 * mod(frame, 64.0);",
              "  return fract(52.9829189 * fract(0.06711056 * p.x + 0.00583715 * p.y));",
              "}",
              "",
              "void main() {",
              "  vec2 R = iResolution.xy;",
              "  vec2 pos = (gl_FragCoord.xy - 0.5 * R) / R.y;",
              "  float t = iTime * FLOW_SPEED * FLOW_DIRECTION + PHASE;",
              "  float breath = (-sin(iTime * BREATH_RATE * 1.5) + sin(iTime * BREATH_RATE + 1.0)) * 0.25 + 0.5;",
              "",
              "  vec2 u = (pos - vec2(CENTRE_X, CENTRE_Y)) * (ZOOM - breath * BREATH_AMOUNT);",
              "  float ct = cos(TILT), st = sin(TILT);",
              "  u = mat2(ct, st, -st, ct) * u;",
              "",
              "  mat2 fold = mat2(cos(THETA), sin(THETA), -SHEAR, cos(THETA));",
              "",
              "  float hue0 = HUE * TAU;",
              "  float hue1 = hue0 + HUE_SPREAD * TAU;",
              "  vec3 color = vec3(0.0);",
              "",
              "  for (float i = 1.0; i <= 96.0; i += 1.0) {",
              "    if (i > LAYERS) break;",
              "    u.x += -sin(u.y * WARP_FREQ_X + t + i * 0.007) * WARP_AMP_X;",
              "    u.y += -sin(u.x * WARP_FREQ_Y - t + i * 0.02) * WARP_AMP_Y;",
              "    u = fold * u * SHRINK;",
              "",
              "    vec2 q = u - vec2(OFFSET_X + breath * 0.1, OFFSET_Y);",
              "    vec2 s = vec2(q.x * ASPECT_X, q.y * ASPECT_Y);",
              "    float glow = GLOW_SIZE / (dot(s, s) + SOFTNESS);",
              "#ifndef SKIP_ECHO",
              "    vec2 e = vec2((q.x - ECHO_SHIFT) * ASPECT_X, s.y);",
              "    glow += ECHO * GLOW_SIZE / (dot(e, e) + SOFTNESS);",
              "#endif",
              "    glow *= 0.25 + breath * 0.4;",
              "",
              "    float r = length(u);",
              "    float k = sin(i * COLOUR_CYCLE + t * 1.2 + r * HUE_TRAVEL) * 0.5 + 0.5;",
              "    vec3 tint = clamp(oklchToLinear(LIGHTNESS + LIGHT_SWING * k, CHROMA * (0.75 + 0.35 * k), mix(hue0, hue1, k)), 0.0, 1.0);",
              "    color += glow * tint * exp2(-r * FALLOFF);",
              "  }",
              "",
              "  vec3 x = max(color, 0.0);",
              "  color = (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14);",
              "  color = pow(clamp(color, 0.0, 1.0), vec3(0.85, 0.92, 0.98));",
              "",
              "  float edge = smoothstep(0.5, 1.6, length(pos));",
              "  color *= 1.0 - edge * VIGNETTE;",
              "",
              "  vec3 dark = uDarkBackground + color * (1.0 - uDarkBackground);",
              "  float strength = max(color.r, max(color.g, color.b));",
              "  vec3 light = uLightBackground * (1.0 - strength) + color * 0.96;",
              "  color = mix(dark, light, uLightMode);",
              "",
              "  color += (blueNoise(gl_FragCoord.xy, floor(iTime * 24.0)) - 0.5) / 255.0;",
              "  fragColor = vec4(clamp(color, 0.0, 1.0), 1.0);",
              "}"
            ].join("\n");

            var RARITY = [
              "#version 300 es",
              "precision highp float;",
              "",
              "uniform sampler2D tScene;",
              "uniform vec2 iResolution;",
              "uniform float iTime;",
              "uniform float uLightMode;",
              "uniform vec3 uDarkBackground;",
              "uniform vec3 uLightBackground;",
              "uniform float uPixelRatio;",
              "out vec4 fragColor;",
              "",
              "const float uStrength = 0.797335207;",
              "const float uScale = 0.985214949;",
              "const float uSeed = 0.435611069;",
              "",
              "const float TAU = 6.28318530718;",
              "const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);",
              "",
              "vec3 toInk(vec3 c) { return mix(c - uDarkBackground, uLightBackground - c, uLightMode); }",
              "vec3 fromInk(vec3 ink) { return mix(uDarkBackground + ink, uLightBackground - ink, uLightMode); }",
              "vec3 sceneInk(vec2 uv) { return toInk(texture(tScene, clamp(uv, 0.0, 1.0)).rgb); }",
              "",
              "float blueNoise(vec2 p, float frame) {",
              "  p += 5.588238 * mod(frame, 64.0);",
              "  return fract(52.9829189 * fract(0.06711056 * p.x + 0.00583715 * p.y));",
              "}",
              "",
              "vec3 halftone(vec2 frag) {",
              "  float cell = max(3.0, uScale * 3.6 * uPixelRatio);",
              "  float angle = 0.26 + uSeed * 0.3;",
              "  mat2 turn = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));",
              "  vec2 rotated = turn * frag;",
              "  vec2 grid = floor(rotated / cell);",
              "  vec2 centre = (grid + 0.5) * cell;",
              "  vec2 source = transpose(turn) * centre;",
              "  vec3 soft = sceneInk(frag / iResolution);",
              "  vec3 ink = sceneInk(source / iResolution);",
              "  float level = clamp(dot(ink, LUMA), 0.0, 1.0);",
              "  float radius = cell * sqrt(pow(level, 0.9) / 3.14159265);",
              "  float dist = length(rotated - centre);",
              "  float aa = 0.7 * uPixelRatio;",
              "  float dot_ = 1.0 - smoothstep(radius - aa, radius + aa, dist);",
              "  vec3 dots = ink * min(0.8 / max(level, 1e-3), 2.2) * dot_;",
              "  float presence = smoothstep(0.03, 0.16, level) * (0.3 + 0.14 * uStrength);",
              "  return mix(soft, dots, presence);",
              "}",
              "",
              "void main() {",
              "  vec2 frag = gl_FragCoord.xy;",
              "  vec3 ink = halftone(frag);",
              "  vec3 color = fromInk(clamp(ink, 0.0, 1.0));",
              "  color += (blueNoise(frag, floor(iTime * 24.0)) - 0.5) / 255.0;",
              "  fragColor = vec4(clamp(color, 0.0, 1.0), 1.0);",
              "}"
            ].join("\n");

            var DISSOLVE = [
              "#version 300 es",
              "precision highp float;",
              "uniform vec2 iResolution;",
              "uniform sampler2D tScene;",
              "uniform sampler2D tField;",
              "uniform float uPresence;",
              "uniform float uDissolve;",
              "uniform float uSoftness;",
              "uniform float uDetail;",
              "out vec4 fragColor;",
              "",
              "float hash(vec2 p) {",
              "  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);",
              "}",
              "float noise(vec2 p) {",
              "  vec2 i = floor(p), f = fract(p);",
              "  f = f * f * (3.0 - 2.0 * f);",
              "  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),",
              "    mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);",
              "}",
              "void main() {",
              "  vec2 uv = gl_FragCoord.xy / iResolution;",
              "  vec2 p = gl_FragCoord.xy / iResolution.y;",
              "  vec3 field = texture(tField, uv).rgb;",
              "  float energy = max(field.r, max(field.g, field.b));",
              "  // Static, continuous noise breaks up the field without making it travel.",
              "  float grain = noise(p * 7.0) * 0.6 + noise(p * 19.0) * 0.28",
              "    + noise(p * 43.0) * 0.12;",
              "  float density = mix(smoothstep(0.025, 0.95, energy), grain, uDetail * 0.55);",
              "  float appear = mix(1.0 + uSoftness, -uSoftness, uPresence);",
              "  float disappear = mix(-uSoftness, 1.0 + uSoftness, uDissolve);",
              "  float alpha = smoothstep(appear - uSoftness, appear + uSoftness, density)",
              "    * smoothstep(disappear - uSoftness, disappear + uSoftness, density);",
              "  vec3 material = texture(tScene, uv).rgb;",
              "  fragColor = vec4(material * alpha, alpha);",
              "}"
            ].join("\n");

            // The canvas is drawn at `resolution` × the frame size and stretched to fill it.
            var width = Math.max(2, Math.round(root.clientWidth * resolution));
            var height = Math.max(2, Math.round(root.clientHeight * resolution));
            canvas.width = width;
            canvas.height = height;
            var gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });

            function compile(type, source) {
              var s = gl.createShader(type);
              gl.shaderSource(s, source);
              gl.compileShader(s);
              if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
              return s;
            }
            function program(vertex, fragment) {
              var p = gl.createProgram();
              gl.attachShader(p, compile(gl.VERTEX_SHADER, vertex));
              gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragment));
              gl.linkProgram(p);
              if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || "link failed");
              return p;
            }
            function texture(unit) {
              var t = gl.createTexture();
              gl.activeTexture(gl.TEXTURE0 + unit);
              gl.bindTexture(gl.TEXTURE_2D, t);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              return t;
            }
            // A texture the shader can render into.
            function target(unit) {
              var t = texture(unit);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
              var f = gl.createFramebuffer();
              gl.bindFramebuffer(gl.FRAMEBUFFER, f);
              gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
              if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error("incomplete framebuffer");
              gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              return { tex: t, fbo: f };
            }
            function bindTex(t, unit) {
              gl.activeTexture(gl.TEXTURE0 + unit);
              gl.bindTexture(gl.TEXTURE_2D, t);
            }
            var draw = function () {};
            try {
              if (!gl) throw new Error("WebGL2 is not available");
              var begin = function (p, time) {
                gl.useProgram(p);
                gl.viewport(0, 0, width, height);
                gl.uniform2f(L(p, "iResolution"), width, height);
                gl.uniform1f(L(p, "iTime"), time);
                gl.uniform1f(L(p, "uLightMode"), 0);
                gl.uniform3f(L(p, "uDarkBackground"), 9 / 255, 9 / 255, 9 / 255);
                gl.uniform3f(L(p, "uLightBackground"), 1, 1, 1);
                gl.uniform1f(L(p, "uPixelRatio"), resolution);
              };
              var field = program(VERTEX, FIELD);
              var post = program(VERTEX, RARITY);
              var composite = program(VERTEX, DISSOLVE);
              var full = target(0);
              var material = target(0);
              var cached = false;
              function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
              function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
              // The field and its halftone pass are drawn into textures; with speed 0 they never change, so draw them once.
              function renderMaterial(time) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, full.fbo);
                begin(field, time);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                gl.bindFramebuffer(gl.FRAMEBUFFER, material.fbo);
                begin(post, time);
                bindTex(full.tex, 0);
                gl.uniform1i(L(post, "tScene"), 0);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              }
              draw = function (frame) {
                // remocn: a 60-frame linear transition that starts at frame 48 of the 156-frame series.
                var p = clamp((frame - 48) / 60, 0, 1);
                var active = p > 0 && p < 1;
                var presence = smoother(clamp(p / 0.34, 0, 1));
                var dissolve = smoother(clamp((p - 0.46) / 0.54, 0, 1));
                var showNext = p >= 0.4;
                sceneA.style.visibility = showNext ? "hidden" : "visible";
                sceneB.style.visibility = showNext ? "visible" : "hidden";
                canvas.style.visibility = active ? "visible" : "hidden";
                if (!active) return;
                var time = timeOffset + p * 2 * speed;
                if (speed > 0 || !cached) { renderMaterial(time); cached = speed === 0; }
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                begin(composite, time);
                bindTex(material.tex, 0);
                bindTex(full.tex, 1);
                gl.uniform1i(L(composite, "tScene"), 0);
                gl.uniform1i(L(composite, "tField"), 1);
                gl.uniform1f(L(composite, "uPresence"), presence);
                gl.uniform1f(L(composite, "uDissolve"), dissolve);
                gl.uniform1f(L(composite, "uSoftness"), softness);
                gl.uniform1f(L(composite, "uDetail"), detail);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
              };
            } catch (err) {
              canvas.style.display = "none";
              if (window.console) console.warn("shader-seam:", err.message);
            }

            var total = parseFloat(root.dataset.duration || "5.2");
            var totalFrames = Math.round(total * 30);
            var clock = { frame: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.to(clock, {
              frame: totalFrames,
              duration: total,
              ease: "none",
              onUpdate: function () { draw(clock.frame); }
            }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["shader-seam"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
