<html
  lang="en"
  data-composition-id="paper-wobble"
  data-composition-duration="3"
  data-composition-variables='[{"id":"title","type":"string","role":"content","label":"Title","description":"Headline that wobbles on its own.","default":"Paper Wobble"},{"id":"card_title","type":"string","role":"content","label":"Card title","description":"Large line on the card.","default":"Shot on a desk"},{"id":"card_subtitle","type":"string","role":"content","label":"Card subtitle","description":"Small line on the card.","default":"Every pose is placed by hand"},{"id":"amp","type":"number","role":"motion","label":"Offset","description":"Largest jitter offset in pixels.","default":1.4,"min":0,"max":6,"step":0.1,"unit":"px"},{"id":"rot_amp","type":"number","role":"motion","label":"Rotation","description":"Largest jitter rotation in degrees.","default":0.35,"min":0,"max":2,"step":0.05,"unit":"deg"},{"id":"seed","type":"string","role":"motion","label":"Seed","description":"Seed for the jitter; each object gets its own.","default":"wobble"},{"id":"step","type":"number","role":"motion","label":"Frames per pose","description":"How many frames each pose is held (30 fps).","default":3,"min":1,"max":6,"step":1,"unit":"frames"},{"id":"color","type":"color","role":"style","label":"Ink","description":"Text color.","default":"#26242c"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Paper Wobble</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;display=block" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;

        }
        #root { color: var(--pwb-ink, #26242c); font-family: Geist, system-ui, sans-serif; }
        .pwb-stage { position: absolute; inset: 0; }
        .pwb-scene { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
        .pwb-wob { display: inline-block; }
        .pwb-title { font-size: 64px; font-weight: 600; white-space: nowrap; }
        .pwb-card { background: #fdfcf8; border: 1px solid rgba(38,36,44,0.12); border-radius: 4px; padding: 24px 32px; box-shadow: 0 8px 20px rgba(38,36,44,0.12); }
        .pwb-card-title { font-size: 28px; font-weight: 600; }
        .pwb-card-sub { font-size: 18px; color: rgba(38,36,44,0.55); margin-top: 6px; }
      </style>

      <div id="root" data-composition-id="paper-wobble" data-duration="3" data-fps="30">
        <div id="pwb-clip" class="pwb-stage clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="pwb-scene" class="pwb-scene">
            <div id="pwb-w1" class="pwb-wob"><div id="pwb-title" class="pwb-title"></div></div>
            <div id="pwb-w2" class="pwb-wob"><div class="pwb-card"><div id="pwb-ct" class="pwb-card-title"></div><div id="pwb-cs" class="pwb-card-sub"></div></div></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            function num(value, fallback, min, max) {
              var n = Number(value);
              return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
            }
            function str(value, fallback) {
              return typeof value === "string" && value ? value : fallback;
            }
            function bool(value, fallback) {
              return typeof value === "boolean" ? value : value === "true" ? true : value === "false" ? false : fallback;
            }
            function pick(value, options, fallback) {
              return options.indexOf(String(value)) >= 0 ? String(value) : fallback;
            }
            // Remotion-style helpers, written from their definitions.
            var Easing = (function () {
              function bezier(x1, y1, x2, y2) {
                return function (x) {
                  if (x <= 0) return 0;
                  if (x >= 1) return 1;
                  var lo = 0, hi = 1, t = x;
                  for (var i = 0; i < 40; i++) {
                    var u = 1 - t;
                    var cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                    if (Math.abs(cx - x) < 1e-6) break;
                    if (cx < x) lo = t; else hi = t;
                    t = (lo + hi) / 2;
                  }
                  var v = 1 - t;
                  return 3 * v * v * t * y1 + 3 * v * t * t * y2 + t * t * t;
                };
              }
              return {
                bezier: bezier,
                linear: function (t) { return t; },
                quad: function (t) { return t * t; },
                cubic: function (t) { return t * t * t; },
                sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); },
                poly: function (n) { return function (t) { return Math.pow(t, n); }; },
                ease: bezier(0.42, 0, 1, 1),
                out: function (f) { return function (t) { return 1 - f(1 - t); }; },
                inOut: function (f) { return function (t) { return t < 0.5 ? f(t * 2) / 2 : 1 - f((1 - t) * 2) / 2; }; }
              };
            })();
            function interpolate(input, inR, outR, o) {
              o = o || {};
              var n = inR.length;
              var left = o.extrapolateLeft || "extend";
              var right = o.extrapolateRight || "extend";
              var i = 1;
              while (i < n - 1 && input > inR[i]) i++;
              var a = inR[i - 1], b = inR[i];
              if (input < inR[0] && left === "clamp") return outR[0];
              if (input > inR[n - 1] && right === "clamp") return outR[n - 1];
              var t = b === a ? 0 : (input - a) / (b - a);
              if (o.easing) t = o.easing(t);
              return outR[i - 1] + (outR[i] - outR[i - 1]) * t;
            }
            // Damped spring from rest to 1. durationInFrames stretches time so the spring has settled by then.
            function spring(o) {
              var c = o.config || {};
              var mass = c.mass != null ? c.mass : 1;
              var k = c.stiffness != null ? c.stiffness : 100;
              var damp = c.damping != null ? c.damping : 10;
              function at(t) {
                var w0 = Math.sqrt(k / mass);
                var z = damp / (2 * Math.sqrt(k * mass));
                if (z < 1) {
                  var wd = w0 * Math.sqrt(1 - z * z);
                  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
                }
                return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
              }
              var t = Math.max(0, o.frame) / o.fps;
              if (o.durationInFrames) {
                var settle = 4, step = 1 / o.fps;
                for (var s = settle; s > 0.05; s -= step) {
                  if (Math.abs(1 - at(s)) > 0.001) { settle = s + step; break; }
                  settle = s;
                }
                t = (Math.max(0, o.frame) / o.durationInFrames) * settle;
                if (o.frame >= o.durationInFrames) return 1;
              }
              return at(t);
            }
            function parseColor(c) {
              var m;
              c = String(c).trim();
              if ((m = /^#([0-9a-f]{3,8})$/i.exec(c))) {
                var h = m[1];
                if (h.length <= 4) h = h.split("").map(function (x) { return x + x; }).join("");
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
              }
              if ((m = /^rgba?\(([^)]+)\)/i.exec(c))) {
                var p = m[1].split(",").map(Number);
                return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
              }
              return [0, 0, 0, 1];
            }
            function interpolateColors(t, inR, outR) {
              var a = parseColor(outR[0]), b = parseColor(outR[1]);
              var u = Math.min(1, Math.max(0, (t - inR[0]) / (inR[1] - inR[0])));
              return "rgba(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * u); }).join(",") + "," + (a[3] + (b[3] - a[3]) * u) + ")";
            }
            // Seeded 0..1 value: the same seed always gives the same number.
            function random(seed) {
              var s = String(seed), h = 2166136261;
              for (var i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 16777619);
              }
              h = Math.imul(h ^ (h >>> 13), 2246822519);
              h = Math.imul(h ^ (h >>> 16), 3266489917);
              return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
            }
            // Fit a fixed-size design stage into the frame.
            function fit(el, w, h, fill) {
              var s = Math.min(root.clientWidth / w, root.clientHeight / h) * (fill || 1);
              el.style.position = "absolute";
              el.style.left = "50%";
              el.style.top = "50%";
              el.style.width = w + "px";
              el.style.height = h + "px";
              el.style.transform = "translate(-50%, -50%) scale(" + s + ")";
              return s;
            }
            // Drive draw(frame) from the timeline so seeking always draws the same picture.
            function clockTween(tl, totalFrames, draw, rate) {
              var clock = { frame: 0 };
              tl.to(clock, { frame: totalFrames, duration: totalFrames / 30, ease: "none", onUpdate: function () { draw(clock.frame * (rate || 1)); } }, 0);
              draw(0);
            }
            var SVGNS = "http://www.w3.org/2000/svg";
            function svgEl(tag, attrs, parent) {
              var e = document.createElementNS(SVGNS, tag);
              for (var k in attrs) e.setAttribute(k, attrs[k]);
              if (parent) parent.appendChild(e);
              return e;
            }


            
const DEFAULT_STEP = 3;

const qf = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step) * step;

const qstep = (frame        , step = DEFAULT_STEP)         =>
  Math.floor(frame / step);

const hash01 = (seed        )         => {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = Math.imul(h ^ (h >>> 13), 2246822519);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

const hashRange = (seed        , lo        , hi        )         =>
  lo + hash01(seed) * (hi - lo);

                                                           

const paperJitter = (
  frame        ,
  seed        ,
  options                                                   ,
)         => {
  const amp = options?.amp ?? 1.4;
  const rotAmp = options?.rotAmp ?? 0.35;
  const s = qstep(frame, options?.step ?? DEFAULT_STEP);
  return {
    x: hashRange(`${seed}:x:${s}`, -amp, amp),
    y: hashRange(`${seed}:y:${s}`, -amp, amp),
    rot: hashRange(`${seed}:r:${s}`, -rotAmp, rotAmp),
  };
};

const steppedSpring = (args   
                
              
                 
                
                                                                   
 )         =>
  spring({
    frame: qf(
      Math.max(0, args.frame - (args.delay ?? 0)),
      args.step ?? DEFAULT_STEP,
    ),
    fps: args.fps,
    config: args.config,
  });

const steppedRamp = (
  frame        ,
  from        ,
  to        ,
  options                                                  ,
)         => {
  const f = qf(frame, options?.step ?? DEFAULT_STEP);
  if (f <= from) return 0;
  if (f >= to) return 1;
  const ease = options?.ease ?? ((t        ) => t);
  return ease((f - from) / (to - from));
};

            if (typeof vars.color === "string" && vars.color) root.style.setProperty("--pwb-ink", vars.color);
            var amp = num(vars.amp, 1.4, 0, 6), rotAmp = num(vars.rot_amp, 0.35, 0, 2);
            var seed = str(vars.seed, "wobble"), step = Math.round(num(vars.step, 3, 1, 6));
            document.getElementById("pwb-title").textContent = str(vars.title, "Paper Wobble");
            document.getElementById("pwb-ct").textContent = str(vars.card_title, "Shot on a desk");
            document.getElementById("pwb-cs").textContent = str(vars.card_subtitle, "Every pose is placed by hand");
            var scene = document.getElementById("pwb-scene");
            
            fit(scene, 640, 340, 1);
            var items = [["pwb-w1", seed + ":title"], ["pwb-w2", seed + ":card"]].map(function (p) { return { el: document.getElementById(p[0]), seed: p[1] }; });
            function draw(frame) {
              items.forEach(function (it) {
                var j = paperJitter(frame, it.seed, { amp: amp, rotAmp: rotAmp, step: step });
                it.el.style.transform = "translate(" + j.x + "px, " + j.y + "px) rotate(" + j.rot + "deg)";
              });
            }
            var tl = gsap.timeline({ paused: true });
            clockTween(tl, 90, draw);

            var total = parseFloat(root.dataset.duration || "3");
            if (tl.duration() < total) tl.to({}, { duration: total - tl.duration() });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["paper-wobble"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
