<html
  lang="en"
  data-composition-id="liquid-fill"
  data-composition-duration="2.6"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Wordmark", "description": "Wordmark that slides out beside the mark once it is full. Leave empty for the mark alone.", "default": "studio"},
    {"id": "shape", "type": "string", "role": "content", "label": "Shape path", "description": "Mark outline as SVG path data inside a 100 by 100 box. Defaults to a rounded square.", "default": "M 27 2 H 73 A 25 25 0 0 1 98 27 V 73 A 25 25 0 0 1 73 98 H 27 A 25 25 0 0 1 2 73 V 27 A 25 25 0 0 1 27 2 Z"},
    {"id": "background_color", "type": "color", "role": "style", "label": "Background", "description": "Stage color.", "default": "#111111"},
    {"id": "liquid_color", "type": "color", "role": "style", "label": "Liquid", "description": "Liquid and filled mark color.", "default": "#E5322D"},
    {"id": "outline_color", "type": "color", "role": "style", "label": "Outline", "description": "Mark outline and wordmark color.", "default": "#FFFFFF"},
    {"id": "bubble_color", "type": "color", "role": "style", "label": "Bubbles", "description": "Bubble outline color.", "default": "#FFFFFF"},
    {"id": "speed", "type": "number", "role": "motion", "label": "Speed", "description": "Playback speed multiplier.", "default": 1, "min": 0.25, "max": 3, "step": 0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Liquid Fill</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          pointer-events: none;
        }

        #root { background: var(--bg); }
        .lf-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .lf-row { display: flex; align-items: center; }
        .lf-svg { flex-shrink: 0; overflow: visible; }
        .lf-word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.04em; color: var(--text); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="liquid-fill" data-duration="2.6" data-fps="30">
        <div id="lf-clip" class="lf-stage clip" data-start="0" data-duration="2.6" data-track-index="0">
          <div class="lf-row" id="lf-row">
            <svg class="lf-svg" id="lf-svg" viewBox="0 0 100 100"></svg>
            <span class="lf-word" id="lf-word"></span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var NAME = "liquid-fill";

var root = document.getElementById("root");
var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
function num(v, f, min, max) { var n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : f; }
function str(v, f) { return typeof v === "string" && v.trim() ? v : f; }
function col(v, f) { return typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim()) ? v.trim() : f; }
function bool(v, f) { return v === true || v === "true" ? true : v === false || v === "false" ? false : f; }
var FPS = 30;
var DUR = parseFloat(root.dataset.duration || "2");
var TOTAL = Math.round(DUR * FPS);
function lerp(a, b, t) { return a + (b - a) * t; }
function cl(x, a, b) { return Math.min(b, Math.max(a, x)); }
// interpolate(x, [in...], [out...], easing): clamped on both sides, easing applied per segment.
function interp(x, inp, out, easing) {
  if (x <= inp[0]) return out[0];
  if (x >= inp[inp.length - 1]) return out[out.length - 1];
  var i = 0;
  while (x > inp[i + 1]) i++;
  var t = (x - inp[i]) / (inp[i + 1] - inp[i]);
  if (easing) t = easing(t);
  return out[i] + (out[i + 1] - out[i]) * t;
}
function bez(x1, y1, x2, y2) {
  return function (x) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var t = x;
    for (var i = 0; i < 8; i++) {
      var cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      var d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = cl(t, 0, 1);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
var E = {
  lin: function (t) { return t; },
  quad: function (t) { return t * t; },
  cubic: function (t) { return t * t * t; },
  sin: function (t) { return 1 - Math.cos((t * Math.PI) / 2); }
};
function eOut(f) { return function (t) { return 1 - f(1 - t); }; }
function eInOut(f) { return function (t) { return t < 0.5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2; }; }
var outCubic = eOut(E.cubic), outQuad = eOut(E.quad), inCubic = E.cubic, inQuad = E.quad;
var inOutCubic = eInOut(E.cubic), inOutQuad = eInOut(E.quad), inOutSin = eInOut(E.sin), outSin = eOut(E.sin);
// Damped spring from 0 to 1 (rest at 1, no initial velocity), frames at 30 fps.
function spring(frame, cfg) {
  if (frame <= 0) return 0;
  var m = cfg.mass || 1, k = cfg.stiffness, c = cfg.damping;
  var w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m)), t = frame / FPS;
  if (z < 1) {
    var wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  var s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s;
  return 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1);
}
// Seeded random: same string in, same number out.
function rnd(seed) {
  var sd = String(seed), h = 1779033703 ^ sd.length;
  for (var i = 0; i < sd.length; i++) { h = Math.imul(h ^ sd.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16;
  var a = (h >>> 0);
  a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixc(a, b, t) {
  var x = rgb(a), y = rgb(b);
  return "rgb(" + Math.round(lerp(x[0], y[0], t)) + "," + Math.round(lerp(x[1], y[1], t)) + "," + Math.round(lerp(x[2], y[2], t)) + ")";
}
function rgba(h, a) { var x = rgb(h); return "rgba(" + x[0] + "," + x[1] + "," + x[2] + "," + a + ")"; }
var SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function setA(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
// Drive draw(frame) from the timeline; frames run 0..frames over frames/30 seconds.
function drive(draw, frames) {
  var tl = gsap.timeline({ paused: true });
  var clock = { frame: 0 };
  tl.to(clock, { frame: frames, duration: frames / FPS, ease: "none", onUpdate: function () { draw(clock.frame); } }, 0);
  draw(0);
  return tl;
}
function finish(tl) {
  if (tl.duration() < DUR) tl.to({}, { duration: DUR - tl.duration() });
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines[NAME] = tl;
}


var row = document.getElementById("lf-row"), svg = document.getElementById("lf-svg"), word = document.getElementById("lf-word");
var shape = str(vars.shape, "M 27 2 H 73 A 25 25 0 0 1 98 27 V 73 A 25 25 0 0 1 73 98 H 27 A 25 25 0 0 1 2 73 V 27 A 25 25 0 0 1 27 2 Z");
var bg = col(vars.background_color, "#111111"), liquidC = col(vars.liquid_color, "#E5322D"), outlineC = col(vars.outline_color, "#FFFFFF"), bubbleC = col(vars.bubble_color, "#FFFFFF"), speed = num(vars.speed, 1, 0, 4);
var wordText = typeof vars.text === "string" ? vars.text : "studio";
root.style.setProperty("--bg", bg); root.style.setProperty("--text", outlineC);
var W = root.clientWidth, H = root.clientHeight;
var size = Math.round(Math.min(W, H) * 0.24);
svg.setAttribute("width", size); svg.setAttribute("height", size);
row.style.gap = size * 0.24 + "px";
word.textContent = wordText; word.style.fontSize = size * 0.5 + "px";
if (!wordText) word.style.display = "none";
var rowW = row.offsetWidth;
var LAND = 9, FULL = 34, SLIDE = 36, BUBBLES = 6;
var defs = svgEl("defs", {}, svg);
var cp = svgEl("clipPath", { id: "lf-shape" }, defs); svgEl("path", { d: shape }, cp);
var drop = svgEl("path", { d: "M 0 -7 C 3 -2 5 1 5 4 A 5 5 0 0 1 -5 4 C -5 1 -3 -2 0 -7 Z", fill: liquidC }, svg);
var cg = svgEl("g", { "clip-path": "url(#lf-shape)" }, svg);
var liquid = svgEl("path", { fill: liquidC }, cg);
var mensc = svgEl("path", { fill: "none", stroke: "#FFFFFF", "stroke-width": 1.4 }, cg);
var bubbles = [];
for (var i = 0; i < BUBBLES; i++) bubbles.push(svgEl("circle", { fill: "none", stroke: bubbleC, "stroke-width": 0.8 }, cg));
var outline = svgEl("path", { d: shape, fill: "none", "stroke-width": 3 }, svg);
var xs = []; for (var q = 0; q < 27; q++) xs.push(-4 + q * 4.3);
function draw(frame) {
  var t = frame * speed;
  var fall = interp(t, [0, LAND], [0, 1], inQuad);
  var dropY = -70 + fall * 142, dropStretch = 1 + 0.5 * fall;
  var level = interp(t, [LAND, FULL], [100, -12], bez(0.35, 0, 0.35, 1));
  var since = Math.max(0, t - LAND);
  var amp = t < LAND ? 0 : 7 * Math.exp(-since / 10) * (1 - (t - LAND) / (FULL - LAND + 6));
  var splash = t < LAND ? 0 : 14 * Math.exp(-since / 3.5);
  function surface(x) {
    return level + Math.max(0, amp) * (Math.sin(x * 0.09 + since * 0.7) + 0.45 * Math.sin(x * 0.17 - since * 0.95 + 1.3)) - splash * Math.exp(-Math.pow((x - 50) / 10, 2)) + splash * 0.35 * Math.exp(-Math.pow((x - 50) / 26, 2));
  }
  var wave = xs.map(function (x) { return x.toFixed(2) + " " + surface(x).toFixed(2); });
  var solid = interp(t, [FULL - 2, FULL + 3], [0, 1]);
  var slide = interp(t, [SLIDE, SLIDE + 11], [0, 1], inOutCubic);
  var reveal = interp(t, [SLIDE + 2, SLIDE + 13], [0, 1], outCubic);
  setA(drop, { transform: "translate(50 " + dropY + ") scale(" + 1.6 / Math.sqrt(dropStretch) + " " + 1.6 * dropStretch + ")", opacity: t < LAND + 1 ? interp(t, [0, 2, LAND, LAND + 1], [0, 1, 1, 0]) : 0 });
  var on = t >= LAND;
  liquid.setAttribute("d", on ? "M " + wave.join(" L ") + " L 110 110 L -10 110 Z" : "M 0 0");
  mensc.setAttribute("d", on && solid < 1 ? "M " + wave.join(" L ") : "M 0 0");
  mensc.setAttribute("stroke-opacity", 0.35 * (1 - solid));
  bubbles.forEach(function (c, i) {
    var start = LAND + 2 + rnd("liquid-fill-b-" + i) * 16, age = t - start;
    var bx = 20 + rnd("liquid-fill-x-" + i) * 60, by = 98 - age * (2.4 + rnd("liquid-fill-v-" + i) * 2), r = 1.2 + rnd("liquid-fill-r-" + i) * 2;
    if (age < 0 || by < surface(bx) + r + 1) { c.setAttribute("opacity", 0); return; }
    setA(c, { cx: bx + Math.sin(age * 0.6 + i) * 1.5, cy: by, r: r, opacity: 1, "stroke-opacity": 0.7 * (1 - solid) });
  });
  setA(outline, { stroke: mixc(outlineC, liquidC, solid), opacity: interp(t, [0, 5], [0, 1]) });
  if (wordText) {
    row.style.transform = "translateX(" + (rowW / 2 - size / 2) * (1 - slide) + "px)";
    word.style.opacity = reveal;
    word.style.clipPath = "inset(-30% " + (1 - reveal) * 100 + "% -30% -5%)";
    word.style.transform = "translateX(" + (1 - reveal) * -size * 0.3 + "px)";
  }
}
finish(drive(draw, TOTAL));

          })();
        </script>
      </div>
    </template>
  </body>
</html>
