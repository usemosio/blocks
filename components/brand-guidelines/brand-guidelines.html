              var plate = { kind: p[0], x: p[1], y: p[2], w: p[3], h: p[4], velocity: p[5], delay: p[6], dir: p[7], depth: p[8] };
              var box = el(collageInner, "left:" + plate.x + "px;width:" + plate.w + "px;height:" + plate.h + "px" + (plate.depth ? ";filter:blur(" + plate.depth + "px)" : ""), "bgl-plate");
              plate.box = box;
              var k = plate.kind;
              if (k === "ceramics" || k === "materials" || k === "chair") {
                var ph = el(box, "", "bgl-photo");
                if (photoVar[k]) ph.style.backgroundImage = "url('" + photoVar[k].replace(/'/g, "%27") + "')";
                else ph.innerHTML = photoSvg[k].replace(/id="bgl-/g, 'id="bgl-' + n + "-").replace(/url\(#bgl-/g, "url(#bgl-" + n + "-");
              } else if (k === "mark") {
                var f1 = el(box, "background:" + T.ink + ";color:" + T.paper + ";display:flex;align-items:center;justify-content:center", "bgl-fill");
                mark(f1, T.paper, 74, "position:relative");
                label(f1, "position:absolute;bottom:17px;left:18px;font-size:10px", C.brand);
              } else if (k === "poster") {
                var f2 = el(box, "background:" + T.accent + ";color:" + T.paper + ";padding:19px;box-sizing:border-box", "bgl-fill");
                label(f2, "font-size:9px", C.collection);
                el(f2, "margin-top:17px;line-height:1.02;letter-spacing:-0.045em;font-weight:500;max-width:200px;font-size:" + fitSize(C.collageTitle, 32, 490) + "px", "", C.collageTitle);
                mark(f2, T.paper, 27, "right:16px;bottom:13px");
              } else {
                var f3 = el(box, "background:" + T.stone + ";color:" + T.ink + ";padding:21px;box-sizing:border-box", "bgl-fill");
                el(f3, "line-height:1;letter-spacing:-0.06em;font-weight:800;font-size:" + fitSize(C.brand, 44, 238) + "px", "", C.brand);
                var sw = el(f3, "display:flex;gap:6px;margin-top:26px");
                [T.ink, T.accent, T.stone, T.paper].forEach(function (c, i) { el(sw, "width:45px;height:45px;background:" + c + (i === 1 ? ";border-radius:50%" : "")); });
                label(f3, "position:absolute;bottom:20px;font-size:10px", C.tagline);
              }
              return plate;
            });

            // ---- Scene: closing
            var sCl = document.getElementById("bgl-s-closing");
            bgOf(sCl, T.ink);
            sCl.style.color = T.paper;
            var tiles = words.map(function (w, i) {
              var tile = el(sCl, "top:241px;left:" + (88 + i * 292) + "px;width:200px;height:65px", "bgl-abs bgl-tile");
              var blockW = i === 0 ? 94 : 50;
              var block = el(tile, "margin:9px auto;width:" + blockW + "px;height:39px;background:" + T.paper);
              var txt = el(tile, "font-size:" + fitSize(w, 42, 196) + "px", "bgl-tile-text", w);
              return { tile: tile, block: block, txt: txt };
            });
            var lock = el(sCl, "left:100px;width:760px;top:175px;height:190px", "bgl-abs");
            var lockMark = mark(lock, T.paper, 94, "left:333px;top:0");
            var lockName = el(lock, "top:113px;width:100%;text-align:center;font-weight:800;letter-spacing:-0.05em;font-size:" + fitSize(C.brand, 40, 660) + "px", "bgl-abs", C.brand);
            var foot = label(sCl, "bottom:26px;left:70px;right:70px;text-align:center;font-size:11px;color:" + T.stone, C.footer);
            foot.style.position = "absolute";

            var scenes = [
              [sId, 0, 118], [sPal, 118, 326], [sTy, 294, 806], [sCo, 614, 806], [sCl, 806, 100000]
            ];

            function draw(t) {
              var f = Math.min(1071, t * 60);
              scenes.forEach(function (s) { s[0].style.display = f >= s[1] && f < s[2] ? "block" : "none"; });
              // identity
              var rv = reduced ? 1 : slide(f, 18, 33);
              idTag.style.opacity = rv; idTag.style.transform = "translateY(" + 10 * (1 - rv) + "px)";
              // palette
              var px = function (a, b, to) { return reduced ? to : 960 + (to - 960) * slide(f, a, b); };
              var accentX = px(166, 201, 422);
              panels[0].style.left = accentX + "px"; panels[1].style.left = px(211, 241, 566) + "px"; panels[2].style.left = px(249, 279, 744) + "px";
              palLabelInk.style.left = accentX / 2 + "px"; palLabelInk.style.transform = "translateX(-50%)";
              sPal.style.transform = reduced ? "none" : "translateX(" + -960 * slide(f, 294, 326) + "px)";
              // type
              sTy.style.transform = reduced ? "none" : "translateX(" + 960 * (1 - slide(f, 294, 326)) + "px)";
              if (f >= 294) {
                var st = specimenState(f), sp = STYLES[st.index];
                spec.style.fontFamily = sp[0] + ", sans-serif"; spec.style.fontWeight = sp[1]; spec.style.fontStyle = sp[2];
                spec.style.fontSize = fitSize(st.full, 80, 850) + "px";
                spec.style.filter = !reduced && f > 636 ? "blur(" + progress(f, 636, 660) * 2 + "px)" : "none";
                specLabel.textContent = sp[3];
                guides.style.opacity = 1 - progress(f, 600, 620);
                if (st.caret) { specSettled.textContent = st.settled; specActive.textContent = st.active; }
                else { specSettled.textContent = st.text; specActive.textContent = ""; }
                caret.style.display = st.caret ? "inline-block" : "none";
              }
              // collage
              if (f >= 614) {
                collageInner.style.transform = reduced ? "none" : "scale(" + (1 + 0.045 * slide(f, 640, 806)) + ")";
                PLATES.forEach(function (p) {
                  var enter = slide(f, 614 + p.delay, 642 + p.delay);
                  var y = reduced ? p.y : p.y + (f - 710) * p.velocity + (1 - enter) * 730 * p.dir;
                  p.box.style.transform = "translateY(" + y + "px)";
                });
              }
              // closing
              if (f >= 806) {
                var wordsOut = reduced ? (f >= 942 ? 1 : 0) : slide(f, 930, 944);
                var markIn = reduced ? (f >= 944 ? 1 : 0) : slide(f, 944, 959);
                var nameOut = reduced ? (f >= 1000 ? 1 : 0) : slide(f, 988, 1008);
                tiles.forEach(function (tl, i) {
                  tl.tile.style.display = f < 944 ? "block" : "none";
                  var turn = slide(f, 860 + i * 3, 883 + i * 3);
                  var bounce = reduced ? 0 : Math.sin(progress(f, 806, 860) * Math.PI * 2 + i * 1.1) * (1 - turn) * 17;
                  tl.tile.style.opacity = 1 - wordsOut;
                  tl.tile.style.transform = "translateY(" + (bounce - 20 * wordsOut) + "px)";
                  var showBlock = !reduced && turn < 0.5;
                  tl.block.style.display = showBlock ? "block" : "none";
                  tl.txt.style.display = showBlock ? "none" : "block";
                  tl.block.style.transform = "rotateX(" + 180 * turn + "deg)";
                  tl.txt.style.transform = reduced ? "none" : "rotateX(" + -180 * (1 - turn) + "deg)";
                });
                lock.style.display = f >= 944 ? "block" : "none";
                lock.style.opacity = markIn;
                lock.style.transform = "scale(" + (reduced ? 1 : 0.88 + 0.12 * markIn) + ")";
                lockMark.wrap.style.top = 44 * nameOut + "px";
                lockName.style.opacity = 1 - nameOut;
                lockName.style.transform = "translateY(" + -12 * nameOut + "px)";
                foot.style.opacity = reduced ? (f >= 1008 ? 1 : 0) : slide(f, 1006, 1024);
              }
            }

            var TOTAL = parseFloat(root.dataset.duration || "17.867");
            var tl = gsap.timeline({ paused: true });
            var clock = { t: 0 };
            tl.to(clock, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["brand-guidelines"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
