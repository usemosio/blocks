              o += L(0, 0, 480, 270, "opacity:" + ramp(t, 6.1, 7) + ";background:linear-gradient(100deg,#000 0%,transparent 43%,#0004 66%,#000 96%)");
              if (t >= 6.55) {
                o += L(dotX - r * 2, dotY - r * 2, r * 4, r * 4, "background:#eed7a6;border-radius:50%;filter:blur(" + Math.min(10, r) + "px);opacity:" + (t < 7.88 ? 0.2 : 0));

              return o;
            }

            // ---- slider
            var PAPER_BG = function () { return wide("#ebe1ce") + L(0, 0, 480, 270, "background:linear-gradient(145deg," + th.paper + ",#ebe1ce 65%,#f7f0e3)"); };
            function slider(t) {
              var label = t < 8.65;
              var barW = t < 10.4833 ? key(t, [8.65, 8.8, 9, 9.2, 9.3, 9.55, 9.8, 10.05, 10.3, 10.4833], [3500, 2600, 1800, 820, 464, 322, 292, 276, 255, 220]) : tween(t, 10.4833, 10.8833, 220, 2, contraction);
              var barH = key(t, [8.65, 8.8, 9, 9.2, 9.3, 9.55, 9.8, 10.3, 10.5], [650, 400, 154, 66, 35, 24, 22, 20, 19]);
              var centerX = tween(t, 10.45, 10.8833, 240, 250, contraction);
              var price = key(t, [9.3, 9.55, 9.8, 10.05, 10.3], [79, 79.5, 80, 81, 82]);
              var quantity = key(t, [9.3, 9.55, 9.8, 10.05, 10.3], [40, 72, 112, 144, 160]);

              var roll = tween(t, 8.18, 8.55, 0, 1, linear);
              var knob = barH * 0.77;
              var o = label ? wide("white") : PAPER_BG();
              if (label) {
                o += L(130, 116, 220, 38, "display:flex;align-items:center;justify-content:center;gap:9px;color:#865616;font-size:23px;letter-spacing:-0.6px;opacity:" + ramp(t, 8.01, 8.1),
                  '<span style="transform:rotate(90deg);display:flex">' + chevron(th.accent, 16) + "</span>" +
                  '<div style="width:78px;height:35px;position:relative;overflow:visible">' + L(0, -roll * 35, null, null, "opacity:" + (1 - roll), "Market") + L(0, (1 - roll) * 35, null, null, "opacity:" + roll, "Limit") + "</div>");
              } else {
                var kx = barW * key(t, [8.65, 9.2, 9.3, 10.3], [0.5, 0.57, 0.58, 0.955]) - knob / 2;
                o += L(centerX - barW / 2, 135 - barH / 2, barW, barH, "background:linear-gradient(100deg,#c78a30," + th.accent + ");border-radius:" + Math.min(9, barH / 3) + "px;" + (t < 10.7 ? "box-shadow:inset 0 0.5px 1px #f3d8a3, 0 1px 2px #8d6a301f" : ""),
                  L(kx, (barH - knob) / 2, knob, knob, "background:#fff;border-radius:50%;box-shadow:0 1px 3px #4d3b2126;opacity:" + (1 - ramp(t, 10.4, 10.65))));
                var det =
                  L(-146, -65, 292, null, "display:flex;justify-content:center;gap:7px;font-size:11px", "<span>Limit price</span><span>" + money(price) + ' <span style="color:' + LMUTED + '">(+' + (((price - 79) / 79) * 100).toFixed(2) + "%)</span></span>") +
                  L(-142, -31, null, null, "font-size:13px;color:#5b5548", quantity.toFixed(2) + " " + esc(c.ticker)) +
                  L(113, -31, 30, null, "text-align:right;font-size:13px;color:#865616;font-weight:600", percent + "%") +
                  L(-146, 25, 292, null, "display:flex;justify-content:space-between;font-size:13px", '<span style="color:' + LMUTED + '">Est. profit</span><span style="color:#326846">' + money(quantity * (price - 75)) + "</span>") +
                  L(-128, 53, 274, null, "display:flex;justify-content:space-between;font-size:12px", '<span style="color:' + LMUTED + '">Details</span><span>&lt;0.01% fee ﹀</span>');
                o += L(240, 135, null, null, "transform:scale(" + uiScale + ");opacity:" + detailAlpha + ";color:#28281f;font-size:9px;white-space:nowrap", det);
              }
              return o;
            }

            // ---- price
            function price(t) {
              var zoom = tween(t, 11.65, 12.25, 1, 2.7, travel);
              var targetX = tween(t, 11.65, 12.25, 240, 277, travel);
              var typed = t < 11.84 ? "$" : c.limitPrice.slice(0, Math.floor(tween(t, 11.84, 12.12, 1, c.limitPrice.length, linear)));
              var alpha = ramp(t, 10.9, 11.18);
              var o = PAPER_BG();
              var inner = '<div style="opacity:' + alpha + ';font-weight:500">' +
                L(100, 61, null, null, "", assetIcon(30, th.accent)) +
                L(140, 63, null, null, "font-size:12px", esc(c.ticker) + '<div style="margin-top:2px;color:' + LMUTED + ';font-size:9px">' + esc(c.openInterest) + "</div>") +
                L(300, 65, 79, null, "text-align:right;font-size:12px", esc(c.marketPrice) + '<div style="margin-top:3px;color:#326846;font-size:9px">' + esc(c.change) + "</div>") +
                L(100, 110, 279, 0.6, "background:#c5bba466") + L(100, 158, 279, 0.6, "background:#c5bba444") +
                L(117, 120, null, null, "font-size:11px", 'Limit price<div style="margin-top:4px;font-size:8px;color:' + LMUTED + '">+3.80% above market</div>') +
                L(100, 181, 279, null, "display:flex;gap:6px", ["+1%", "+5%", "+10%", "+20%"].map(function (s) {
                  return '<div style="width:66px;height:21px;border-radius:5px;border:0.5px solid #cbbda282;background:#ffffff24;display:grid;place-items:center;font-size:9px">' + s + "</div>";
                }).join("")) + "</div>" +
                L(225, 122, 96, 28, "display:flex;align-items:center;justify-content:flex-end;transform:translateX(" + tween(t, 10.9, 11.18, -39, 0) + "px);gap:5px;font-size:12px;font-weight:600;letter-spacing:-0.35px",
                  '<span style="opacity:' + alpha + '">' + esc(typed) + '</span><span style="width:1.5px;height:19px;background:' + th.accent + '"></span><span style="color:#865616;margin-left:-1px;opacity:' + alpha + '">Mid</span>');
              o += L(240 - targetX * zoom, 135 - 135 * zoom, 480, 270, "transform:scale(" + zoom + ");transform-origin:0 0;color:#28281f", inner);
              return o;
            }

            // ---- confirmation (the film's clock runs 1.85 s ahead from here on)
            function confirmation(t) {
              var scale = key(t, [14.45, 14.65, 15.25, 15.6, 15.8, 16], [0.67, 0.73, 1, 1.16, 1.25, 1.3]);
              var exit = tween(t, 15.77, 16, 0, 210, function (v) { return v * v; });
              var fill = Math.round(key(t, [14.45, 14.7, 15, 15.25, 15.45], [20, 50, 83, 97, 100]));
              var ring = '<svg width="14" height="14" viewBox="0 0 14 14" style="display:block"><circle cx="7" cy="7" r="5" fill="none" stroke="#302946" stroke-width="1.8"/><circle cx="7" cy="7" r="5" fill="none" stroke="' + th.accent + '" stroke-width="1.8" stroke-dasharray="' + (31.416 * fill) / 100 + ' 31.416" transform="rotate(-90 7 7)"/></svg>';
              var card =
                L(10, 10, null, null, "", badge(c.position)) +
                L(235, 12, 55, null, "font-size:14px;text-align:right;color:#d0ced9", "Cancel") +
                L(10, 41, null, null, ROW + "gap:5px;font-size:16px", assetIcon(18, th.accent) + "<span>" + esc(c.ticker) + '</span><span style="color:' + MUTED + ';font-size:12px">⊙</span><span>' + esc(c.limitPrice) + "</span>") +
                L(214, 45, null, null, ROW + "gap:8px;font-size:12px;color:" + MUTED, ring + "<span>" + fill + "% filled</span>") +
                L(10, 86, 280, null, ROW + "justify-content:space-between;font-size:12px;color:#bbb8c6",
                  '<span>Margin <span style="color:white;font-size:15px;margin-left:4px">' + esc(c.margin) + '</span></span><span>Lev. size <span style="color:white;font-size:15px;margin-left:4px">' + esc(c.orderSize) + "</span></span>");
              return L(240, 135 + exit, 300, 110, "transform:translate(-50%,-50%) scale(" + scale + ") rotate(" + key(t, [14.45, 15.4, 16], [-1.2, 0, 2]) + "deg);background:" + th.panel + ";border-radius:12px;box-shadow:0 0 10px #18131e65;font-weight:500;letter-spacing:-0.4px", card);
            }

            // ---- closing
            function closing(t) {
              var brand = tween(t, 18.15, 18.38), o = "";
              if (t < 18.3) {
                var words = c.closing.split(" ").map(function (w, i) {
                  var p = tween(t, 16 + i * 0.3, 16.18 + i * 0.3);
                  return '<span style="opacity:' + p + ";filter:blur(" + (1 - p) * 4 + "px);transform:translateY(" + (1 - p) * 7 + 'px)">' + esc(w) + "</span>";
                }).join("");
                o += L(15, 111, 450, 42, "display:flex;align-items:center;justify-content:center;gap:5px;font-size:22.5px;letter-spacing:-1px;white-space:nowrap;opacity:" + (1 - ramp(t, 18.13, 18.24)), words);
              }
              if (t >= 18.15) {
                o += L(15, 98, 450, 64, "display:grid;place-items:center;font-size:" + (brandName.length > 9 ? 31 : 42) + "px;font-weight:600;letter-spacing:-1.2px;opacity:" + brand + ";transform:scale(" + (0.95 + 0.05 * brand) + ");filter:blur(" + (1 - brand) * 5 + "px)",
                  '<span style="display:flex;align-items:center;gap:12px">' + assetIcon(42, th.accent) + esc(brandName) + "</span>");
              }
              return o;
            }

            function frameHtml(t) {
              if (t < 2.7) return opening(t);
              if (t < 8) return phone(t);
              if (t < 10.9) return slider(t);
              if (t < 12.6) return '<div style="position:absolute;inset:0;opacity:' + (1 - tween(t, 12.3, 12.6)) + '">' + price(t) + "</div>";
              if (t < 14.15) return '<div style="position:absolute;inset:0;opacity:' + tween(t, 12.6, 12.78) + '">' + confirmation(t + 1.85) + "</div>";
              return closing(t + 1.85);
            }
            function draw(t) { stage.innerHTML = frameHtml(t); }

            var TOTAL = parseFloat(root.dataset.duration || "18.467");
            var tl = gsap.timeline({ paused: true });
            var clock = { t: 0 };
            tl.to(clock, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
            draw(0);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["fomo-limit-orders"] = tl;
          })();
        </script>
      </div>
    </template>
