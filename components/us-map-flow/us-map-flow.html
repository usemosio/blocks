  US Flow Map

  Dark US map: city dots and names appear, glowing arcs draw between cities (thicker for more volume) and a dot travels along each route.

  Ported to an HTML + GSAP sub-composition by usemosio/blocks from:
  https://github.com/heygen-com/hyperframes/blob/bd6cff8157a1a0ed5075527e673cc4f321fe9123/registry/blocks/us-map-flow/us-map-flow.html

  law or agreed to in writing, software distributed under the License is distributed on an "AS IS"
  BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for
  the specific language governing permissions and limitations under the License.

  Map geometry: us-atlas states-10m (ISC licence, Copyright Mike Bostock), built from the US Census
  Bureau cartographic boundary files (public domain). The Albers USA projection and the SVG paths were
  computed once with d3-geo and are embedded below, simplified and rounded; the lower-48 projection is
  written out in the script so that cities given as longitude and latitude land on the same map.

  Changes by usemosio/blocks: fills the host frame (header, map and source note stack to fit portrait and landscape); d3, topojson and the us-atlas fetch are gone: the state paths are embedded and the Albers equal-area conic is written out in a few lines; title, subtitle, source, cities (JSON of name to [lon, lat]), flows (JSON list of from, to, volume), arc and dot colours, land colour and background are variables; the travelling dot fades out with a timeline tween instead of a completion callback so seeking stays exact.
-->
